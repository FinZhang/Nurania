$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[53360,[\"/Nurania/next/static/chunks/409fa6e7eed2c119.js\",\"/Nurania/next/static/chunks/b77339cc29226d86.js\",\"/Nurania/next/static/chunks/747ad6c054a5245b.js\",\"/Nurania/next/static/chunks/e9371c2148cd7f21.js\"],\"default\"]\n13:T8256,"])</script><script>self.__next_f.push([1,"\n诺拉尼亚大陆现存三套主要的信仰体系：流播最广的[唯一神信仰](#idx-e139)、封闭于西北一隅的[尼希尔诸神信仰](#idx-e196)，以及[希尔文诺](#idx-e543)精灵族的[圣树](#idx-e219)信仰。三者各自独立，神学旨趣、组织形态与历史渊源各异，唯一的共同点或许在于，每一套信仰都与一支[魔法](#idx-e3)体系深度绑定——唯一神信仰之于[神启祷言](#idx-e5)、诸神信仰之于[尼希尔秘术](#idx-e4)、圣树信仰之于精灵[自然魔法](#idx-e9)。魔法的运行机理详见魔法篇，本篇所述为信仰本身：其崇奉的对象、解释世界的方式，以及由此生长出的制度与文化。\n\n三种宗教可供考据的程度并不均等。唯一神信仰的典章制度公开而完备，可据以详述，有兴趣的读者亦可参阅行观别录卷唯一神信仰小考篇；尼希尔诸神信仰因酋邦封闭，多赖贸易往来与边境见闻推断；圣树信仰则几乎全凭[落叶精灵](#idx-e416)的转述。本篇各节详略与口吻之别，根源即在于此。\n\n### 唯一神信仰\n\n唯一神信仰是大陆流播最广的宗教：[正教](#idx-e150)为[索拉瑞斯](#idx-e441)与[忒奥西斯](#idx-e499)的国教，[公教](#idx-e110)则是[阿布丹提亚](#idx-e468)人口的第一大信仰，其历法与礼拜之制的影响更遍及各国。自十三世纪末[教会大分裂](#idx-e164)后，信仰分为[正教会](#idx-e185)与[公教会](#idx-e159)两套并行的体制。下文所述教义除特别说明外均依正教会立场，两会的分歧见后文“教会与大分裂”一节。\n\n#### 唯一神与创世\n\n[唯一神](#idx-e138)，信徒也称之为主、神或上帝，是整个宇宙的创造者、维系者与监督者，也是世间一切魔法力量的源头——在正教教义里，“魔法”专指神启祷言一脉，[星空魔法](#idx-e8)（星术）既不出于神，也不在神权之列；正教并不把施用星术一概斥为[异端](#idx-e147)，但其在神学中始终不具神圣性（公教会独立后方将星术纳入神权，见后文）。唯一神的形象不固定、非人形、无法以言语描述，祂降临时假托信徒心中最尊崇的人型显现，因此各人所见不同——最初追随祂的四人中，[圣约翰](#idx-e126)所见为一位老者，[圣伊琳娜](#idx-e125)所见为一位中年女子。\n\n正教的创世叙事大略如下：太初之时，除[天界](#idx-e136)外，宇宙是一片充盈着原质“虚”的黑暗混沌。居于天界的神自虚中依次造出地、水、风、火四[元素](#idx-e54)，化为大地、江海、天空与万物的流动；再造[以太](#idx-e19)元素，化为天球，于其中安置日月群星，将整个世界包裹起来。随后神在大地上播撒生命，是为[现界](#idx-e141)，又造[冥界](#idx-e117)，作为众生死后的居所与转世的通道。神随后巡视世界，见人类蒙昧的先祖在严寒中瑟缩饥迫，便赐下自己的一部分权柄分给人类，包括智性（编织[术式](#idx-e40)的[精神力](#idx-e25)）与感知四元素的[亲和力](#idx-e58)；为教导他们正确行使此力，神降临人前、行走大地，将教义传于追随者，随后返回天界。此重大事件后被正教会定为[圣格里仪式历](#idx-e366)元年。\n\n#### 诸界与神圣存在\n\n正教神学的宇宙由[四界](#idx-e133)构成：天界是唯一神、圣徒与天使的居所；现界是人类生息的世界；冥界是信徒死后安息、静待轮回之地；[虚界](#idx-e145)则在天球与大地构成的世界之外，是仍为无穷“虚”所充满的空间，也是罪人与非正信者死后的去处。\n\n天界诸圣以最初的四[使徒](#idx-e129)为首：约翰，被奉为先知与弥赛亚，司精神与教导，是正教唯一的先知（公教另尊保罗为第二先知，见后文）；伊琳娜，司秩序与契约，圣领圣银币即以其得名；约瑟，商会之圣，司转化、破坏与锻造；保罗，最初的医者，司治愈与修复。四使徒之外，历代教会还册封过许多显现神迹、殉道或品行高洁的信徒，通称[从圣徒](#idx-e105)。天界的四位天使被视为唯一神部分神格的具现，被造为两男两女之形，各负六翼，分掌[四大元素](#idx-e41)的权柄，依次为地之[盖昂](#idx-e108)、炎之[皮雷乌斯](#idx-e119)、岚之[阿内玛](#idx-e99)、泽之[海德洛娅](#idx-e111)，率其下[次级天使](#idx-e104)往来三界，传谕护佑，赞颂神名，必要时代神显现。次级天使中的[埃塞莉斯](#idx-e100)尤为特殊，她巡行于天球之上、监视虚界的裂缝，也是末日预言中最先通报天球开裂的一位。\n\n巨龙族在天界诸神圣存在中另居特殊之位：教义确立巨龙为唯一神以自身一滴血所造，是现界最初的智慧种族，也是神的直系血脉。巨龙们天生继承神的魔法权柄，宗教地位因而近乎乃至高于四使徒；巨龙死后灵魂直接进入天界，[末日之战](#idx-e118)中也将随天使一同作战。这一地位是[第一次宗教改革](#idx-e155)的产物（见后文），也是[龙骑士](#idx-e300)乃至后世[圣礼骑士](#idx-e306)制度的神学根基。\n\n#### 罪、称义与末世\n\n正教认为人一出生便背负“[宿债](#idx-e134)”：神分给人类的权柄是借予而非赠予，凡受其惠者——无论亲手施法，还是受惠于他人之法——都天生亏欠唯一神。信徒只要持守信仰、按神的教诲生活（无论会不会神启魔法），神便免其债，是为“[称义](#idx-e103)”；称义自[洗礼](#idx-e140)开始，借[圣事](#idx-e124)逐步积累，至临终而成。其间若犯罪，须向神职人员[告解](#idx-e109)求得赦免。正教认为任何罪无论大小都须经告解才可赦免，通常以[苦行](#idx-e114)赎罪为赦免条件，苦行之责可购[赎罪券](#idx-e132)折抵。\n\n人若不信奉唯一神，宿债便转化为“[原罪](#idx-e149)”，负原罪者将在死后审判中被流放虚界，在那里被剥夺一切感知、精神逐点消磨，最终灵魂碎裂、重归于虚。原罪之下是[三大罪](#idx-e121)：不谨，即以违背教义的方式使用神启魔法，居三罪之首，基本仅针对神启魔法的[施法者](#idx-e38)；不智，即主动放弃对智性的追求，如盲信愚昧、知行不一、傲慢固执；不爱，即背离唯一神关于人际相爱的训诫。三大罪不能以寻常告解赦免——赦免三大罪称“[大赦](#idx-e106)”，须直接出自[大牧首](#idx-e152)（或[宗主教](#idx-e187)，见下）本人；三大罪情节严重者可处[诺万尼斯流放](#idx-e171)极刑，由[审判庭](#idx-e175)执行，将受刑者留置于[终末碑座](#idx-e440)的枯竭死地直至器官衰竭，尤以“不谨”最易被判此刑。关于此流放刑罚的进一步讨论可参见行观别录卷唯一神信仰小考篇。\n\n正教[圣典](#idx-e135)中也预言了当今世界的末日。末日来临时，包裹大地的以太天球开裂，虚界的“虚”如潮水渗入现界，所至之处只余死地；那时唯一神将携四天使再临，向现世降下末日审判，通过者得入冥界躲避，不信者与罪人则为[虚潮](#idx-e144)吞噬，孵化出各象三大罪的三只“[虚之大兽](#idx-e146)”，转而入侵冥界。天使大军与诸巨龙与之长久交锋，是为末日之战；终局三兽尽亡，冥界亦遭毁灭，仅余少数生命受天使引渡前往天界，宇宙复归混沌之“虚”。唯一神此后再造新天新地，受庇于天界的余生被引入其中，领受全新的命运。\n\n笔者注：虚潮吞噬现界的过程与结果，与神启魔法引发元素[疏化](#idx-e39)、枯竭的情形几乎一致。一个合理的推断是，这套末世预言的灵感正源自正教创生期在西诺拉尼亚目睹的几次小规模[元素枯竭](#idx-e56)；按正教会教义，末日降临的首因是滥用神启魔法、错误行使神赐的权柄；而诺万尼斯大枯竭之所以被奉为头等大事，正是因为它被看作滥用魔法招来末日的一次预演。那片死地被称作“终末碑座”，其名或即由此而来。\n\n#### 经典、圣事与礼仪年\n\n唯一神信仰的最高典籍是《索菲亚圣典》，通称《圣典》，一切教义或直接出自其中，或源于对其内容的解释，正教与公教的分歧多由后者而来。《圣典》分为数卷：《创世录》述创世与神降临行走；《弥赛亚记》载约翰所受的教诲，宿债、原罪、三大罪与称义等核心教义多出于此；《神言书》是神启魔法的教义之源，也是最早成文的神启魔法教本；《箴言集》讲处世智慧与道德戒律；四部福音分记四使徒行走大陆、建立教会直至殉道的经历；《预言书》则预告末世。教义为信徒立下的规范大体可分两类：一类关乎信仰本身：不奉他神、坚持圣事、守礼拜日、有罪必告解；一类是三大罪的反面，合为十二条诫命，分属“谨”“智”“爱”三目。\n\n正教有六项圣事。洗礼一生一次，是入教与称义之始，象征认清并领受自身的宿债；[坚振](#idx-e113)也一生一次，标志称义大体完成，受此礼者须对教会有重大贡献，或持守信仰足够长久，虔诚信徒若未及而先逝，[司祭](#idx-e180)会在葬礼上为之补行；婚姻一生一次，正教徒的婚姻不可解除，被视为“爱”之教诲的最高体现；告解是信徒为自身罪行请求赦免，可反复进行；[大祝职](#idx-e107)是学徒正式受任为神职之礼，[小祝职](#idx-e142)则是神职卸任、复为寻常信徒之礼（大祝职作为神职就任的圣事，大多时候是一条单行道。很多神职人员会选择终身供职，卸任复归俗世的小祝职只见于少数年老体弱者）。通常情况下，正教徒的婚礼与葬礼均由神职人员主持。\n\n信仰渗入日常的最直接载体是历法：源出正教会的圣格里仪式历将一年分为六季、每季十周。每周五日对应《圣典》所载神行走大地的五日，其中第五日为信众向唯一神礼拜的[圣神日](#idx-e363)；六季各有仪式名，对应一条完整的[礼仪年](#idx-e115)循环。全年最大的宗教节日是[晖醒](#idx-e361)季首日的[降临节](#idx-e354)，纪念唯一神降临传道，是正教与公教宗教意义上的新年；其余节庆多系于圣徒纪念与教义节点（如纪念约瑟首施神启魔法、“借予”之约显明于世的[立约节](#idx-e357)），两教会大多同庆，唯纪念保罗以太神迹的[祝星节](#idx-e382)只有公教徒庆祝——[牧首厅](#idx-e170)视任何公开庆祝为宣扬异端之举。仪轨之外，正紫色在神学中被视为神圣之色，禁止外流、仅限教会内部使用；赎罪券作为一次性折抵告解苦行的凭证由教会售卖；[朝圣](#idx-e102)则是信众沿既定路线前往[圣城索菲亚](#idx-e503)——相传唯一神降临之处——的虔修，也是圣领一项可观的收入来源。\n\n#### 教会组织与大分裂\n\n正教会以忒奥西斯圣领为中心，建立了大陆最完备的宗教官僚体制，大牧首、[枢机主教团](#idx-e178)、[都主教](#idx-e156)、主教、司祭层层相属（行政组织对应详见忒奥西斯篇）；神职经大祝职入序、依年资与功绩升迁。都主教及以上不得婚娶，别称“[门徒](#idx-e169)”，象征舍弃现世之乐、专心侍神。正教会对神启魔法的垄断主要立于两个方面：其一是文化性控制，将神启魔法与信仰深度绑定，使多数神启天赋者在意识到自己能力时，首先想到的是向司祭坦白；其二是审判庭的强制追查，神启魔法的反复释放会留下可观测的元素疏化痕迹，使追踪在技术上切实可行。优质触媒的垄断供给，则是教会吸纳大陆神启人才的另一重杠杆（详见行观别录卷[魔法矿石](#idx-e74)篇）。\n\n唯一神信仰的两次重大转折事件均与魔法有关。其一是以八世纪中叶，[诺万尼斯大叛乱](#idx-e284)为导火索的第一次宗教改革：在此之前，借龙族[血契](#idx-e50)施放神启魔法的龙骑士被斥为僭越神权的异端、长期遭受排斥，宗教改革后，巨龙族被写入《创世录》、确立了其神圣血脉的地位（见前），龙骑士也由此平反。其二是十三世纪末，[第一次阿索战争](#idx-e276)引发的[第二次宗教改革](#idx-e154)，其失败直接导致了教会大分裂：战争中圣领以索拉瑞斯盟友身份参战，激化了阿布丹提亚境内教会的不满；改革派主张将星空魔法定性为唯一神权柄的另一种显现，既为丹提亚境内日益普及的星术正名，也为圣领的政治中立提供神学背书。然而这一方案触动了依托神启魔法垄断的教会权威架构，又受索拉瑞斯帝国的政治阻挠，最终在牧首厅遭到封杀；阿布丹提亚境内的正教会因而于1295年宣布独立，公教会就此诞生。\n\n正教与公教两会共用《圣典》，分歧几乎都出自对同一经文的不同解读。其一，星空魔法是否同属神权：公教会将保罗于四元素耗尽时借以太显现神迹的一段并入《神言书》，据以论证星术亦为唯一神的权柄，并把巡视天球的埃塞莉斯诠释为以太神权的象征，与四天使并列；正教会则视星空魔法为保罗一己之力，而非神所授的权柄。其二，轻罪的赦免是否必经告解：《弥赛亚记》原文只言“若犯罪，当求赦”，未定其法，正教解为必须经教会告解，公教会则主张轻罪可凭虔信与圣事自赦，称义的本位在信徒自身。其三，神启魔法的管控：滥用神启是否会加速末日，《圣典》并无明文，正教会解释为会，便以“神在现界的代行者”自任，设审判庭严管神启魔法、以诺万尼斯流放向神赎罪以求延缓末日；公教会则认为末日自有定期、审判之权唯神独有，不额外设审判庭建制，对教外的神启施用仅在牵涉元素枯竭时依托世俗机构介入，更斥诺万尼斯流放为对神意的滥用而将其废除。正教会大牧首与公教会宗主教在分裂后互相开除教籍，两教会更是至今仍以这些教义分歧作为互向攻讦之据。\n\n公教会的领袖称宗主教，驻于[波马里亚](#idx-e475)的[公教总会](#idx-e161)，由全大陆公教主教先选出三名候选，再由一位盲眼的童贞信徒抽签决定，以象征最终取舍出自唯一神。[公教区](#idx-e160)多依当地世俗政权划界，教阶也较正教扁平；正教低阶神职可以婚娶，公教则不允许所有神职人员婚娶。在教义气质上，公教一面反对教会代神行权、对轻罪从宽，仅针对三大罪保留需要宗主教大赦的立场；一面又把称义的重担压在信徒自身，对个人虔修的要求高于正教。公教基本继承了正教的圣事体制（如洗礼、坚振等）和节日，但内容多有不同，[季首弥撒](#idx-e112)也按[通用历](#idx-e373)而非仪式历举行。两会均以[十字架](#idx-e130)为教会符号，但形制略异：正教十字架四角象征唯一神的四元素权柄；公教十字竖条下部分收窄，下端另加一道短横，两横四端象征四元素魔法，顶端一角则因指向天空而象征星空魔法。\n\n#### 异端、异教与异种族\n\n在唯一神信仰的框架里，异端指对同一教义解释相异的唯一神信仰，[异教](#idx-e148)则指其他宗教。就正教而言，公教会即是历史与当代最大的异端；异端游离于罪罚体系之外，但其惩处之重几与三大罪并列，最高同样可处诺万尼斯流放。历史上唯一神信仰曾滋生的教派粗略估计不下百数，一部分为正教或公教所吸纳，一部分被定为异端而遭压制、终至衰亡或被剿灭，另有少数存续至今，多在公教主导或信仰相对自由的地区，限于篇幅，此处不再赘述。\n\n笔者注：无论分裂之前，还是分裂之后的正教主导地区，凡主张神启魔法可自由或较自由使用的教派，几乎无一例外都以异端之名被消灭。可见对神启魔法的控制，实际上构成了正教教义的一条主轴。\n\n两教会如今对异种族与其魔法的态度格外审慎，显然是为避免历史上龙骑士迫害那样的宗教冲突重演。巨龙族已被解释为唯一神的神圣血脉写入圣典（见前）；而圣典中并无只字记载的精灵，当前正教会对信徒的官方解释大致是：精灵是唯一神所造的另一智慧种族，自然魔法不过是神启魔法的另一种形式，而希尔文诺大圣树“或许”是唯一神在现界化身而成的树形圣躯——牧首厅与公教总会在精灵事务上都尽量回避这套说法、有意保持含糊。至于[尼希尔](#idx-e536)的诸神信仰，两会一致视之为异教；秘术基于血腥的活体献祭，更是两会反复抨击尼希尔酋邦的共同依据——这是双方少有的立场一致之处。\n\n笔者注：赫利娅·梵诺尔小姐对上述“树形圣躯”的解释完全不能接受。精灵眼中的“圣树之母”，与人类教会口中“唯一神的化身”，显然是两回事。\n\n### 尼希尔诸神信仰\n\n诸神信仰行于尼希尔酋邦一域，是大陆唯一与活体献祭绑定的宗教。它以“称量”为核心，将宗教、秘术与统治三者牢牢缚在一处；其雏形出自两河流域的各个早期部落，整体结构则在前二世纪萨阿尔部对西尼希尔地区的征服后成型，其中绝大部分一直延续至今日（见尼希尔篇）。\n\n#### 创世与循环\n\n诸神信仰的宇宙起于一条停滞的[混沌之河](#idx-e192)。混沌中孕育出最初、也是唯一的神——[零之神](#idx-e199)司费尔。司费尔在河中独存了极漫长的岁月，终于百无聊赖，便令混沌之河流动起来，又以自身之躯造出现世的大地与天空，是为现界，如同一艘行于混沌之河上的[巨航船](#idx-e194)；再在其上造出神界，将自己拆作六片、化为六位神祇，居于神界护送现界之船。船自混沌之河的最上游顺流而下，终将驶抵尽头的[混沌之海](#idx-e191)；届时海浪撕毁航船，现世、神界与其间的一切生命尽归终结——这便是末日。千年之后，承继司费尔的意志，新的航船会在最上游再度诞生，在六神护佑下重新起航，是为循环的再启。\n\n笔者注：这套以行船喻世的宇宙观，显然生自尼希尔的河流文明底色。纳赫尔与哈亚特两河的入海口位于[凛冰洋](#idx-e432)，海况凶恶、终年严寒，文明早期那些小而脆弱的船只一旦入海便九死一生。早期尼希尔人对末日的想象，多半就是从这片吞船的冷海里生出来的。\n\n#### 六神与玛阿特\n\n六位神祇是司费尔精神的六片，各自对应宇宙循环中的一段，形象自幼及老、由壹至陆递进：[壹之神](#idx-e201)瓦赫德作孩童之形，象征一切循环与现世的开端，司掌驱动混沌之河的“第一力”，也是秘术力量的源头；[贰之神](#idx-e205)伊斯南作少年之形，象征二元的对立与调和，司掌昼夜交替、河流涨落等自然之象；[叁之神](#idx-e197)塞兰萨作青年之形，象征过去、现在、未来的时间轮转与播种、生长、收获的农时，司掌岁时更替、万物生长与记忆；[肆之神](#idx-e188)阿尔巴作壮年之形，象征在大地上撑起天空的四根基柱，司掌社会制度、秩序与统治的稳固；[伍之神](#idx-e189)阿姆萨作中年之形，象征人手所出的一切智慧结晶，司掌智慧、工艺、制造与艺术；[陆之神](#idx-e202)希塔作老者之形，象征上下四方万物的终点，司掌灵魂与审判，也是“[至福乐土](#idx-e206)”的看护者。六神皆无性别、虽有次第而不分尊卑；司费尔造出六神之后便告消隐，仅存于创世神话之中，从不受现世的祭祀。\n\n诸神信仰中，人死后将接受名为“[玛阿特](#idx-e195)”的仪式审判，死者的心脏将被放在天平上称量，以希塔所拄手杖顶端的宝石作为砝码。审判由瓦赫德、伊斯南、阿尔巴三神监护、希塔执行。心轻于宝石者为称量通过，由希塔引入至福乐土，享永恒的安乐直到循环终结；心重者为称量不过，其心为[守护兽](#idx-e198)吞噬——守护兽在诸神信仰的图像传统中作鹰头、狮身、蛇尾之形，灵魂被逐入现世与神界之间的缝隙——在宇宙的图景里，这意味着被抛下航船，在混沌之河中浮沉直至消亡。心与宝石恰成平衡者，则由阿尔巴擢升、瓦赫德授予秘术之力，成为[神遴者](#idx-e417)，转生送回现世，引导凡众。神遴者被喻为巨航船的领航人与舵手：若没有他们的引领，航船不待驶抵混沌之海便会中途搁浅损毁，招来提前的末日；神遴者受赐自诸神的秘术，象征着“称量”祭品之价值、向神换取相应之力的过程，因而兼具崇高的宗教意义。这一层层相扣的解释，把秘术、神权与统治缚为一体：唯有神遴者能护航于世，也唯有神遴者配居于人上。\n\n#### 教义与统治\n\n诸神信仰约束信徒的教义分作两部分。第一部分见于《[司费尔书](#idx-e200)》，其为诸神信仰唯一的成文典籍，载有创世、宇宙与诸神的全部神话，内容无论古今、无论部落都相当固定。就约束信众而言，它主要讲人如何通过玛阿特的称量：人于生命之初，心中“善”“恶”各半，此后随其行为彼此消长，善压过恶，其心便轻，得以通过，反之亦然。至于何种行为增善、何种行为积恶，《司费尔书》并不载明，这就引出教义的第二部分：它没有任何成文典籍，全凭各部落的酋长与长老口耳相传，且明文禁止笔录，据传其依据出自《司费尔书》中的训诫：“河水不会在石上停留，我的教诲也不会；你们当以口传口、以心记心，不可将它锢于文字。”正因如此，这部分教义无论在历史上还是各部落之间都不尽相同；唯一相同的主轴可以概括为：神遴者阶层高居众人之上，自由民与奴隶必须服从神遴者的教诲，并以服侍神遴者、为神遴者献身为荣；这条教义以肆之神阿尔巴之名颁布，除此以外，教义则多以塞兰萨与阿姆萨之名颁行——这两位神不在玛阿特称量的监护者之列，被解释为神权更多覆盖现世的日常。各部各自有别的信徒人生礼仪细目繁琐，但大体都在为这套依附叙事添砖加瓦。\n\n在制度上，诸神信仰与酋邦的统治结构完全重合：[教长](#idx-e204)、[诸神圣土](#idx-e207)的祭司、各部落酋长与长老，无一例外皆出身神遴者阶级，宗教身份即政治资格。祭司按六神分设六个[祭司团](#idx-e193)，六团共同的最高领袖即酋邦教长，除执掌本团神祇的仪式外，也按所奉神祇的职司分管诸神圣土的行政；[阿尔努尔](#idx-e537)城中六神各有神庙，另有教长驻跸并主持全酋邦最隆重仪典的[大神庙](#idx-e190)，是整个酋邦的宗教中心与圣地。这一套宗教-政治制度继承自历史上前二世纪至五世纪统治尼希尔的[萨阿尔血王朝](#idx-e558)：前二世纪，掌握秘术的萨阿尔部入侵并统一两河诸部，将其余部落的神话主体尽数抹去，以自身的信仰体系为主干奠定了这套结构；王朝被推翻后，这套制度一度被提议废除，但因其太便于统治，422年的阿尔努尔会盟最终决定保留，之后其主体几乎原封未动，一直延续到今日的尼希尔（详见尼希尔篇）。\n\n#### 祭祀与血票\n\n尼希尔的地方历法名为[萨辛历](#idx-e364)，其对应通用历六季的名称被称为壹位至[陆位](#idx-e358)，正对应壹之神至陆之神。诸神信仰中，现世一年被看作宇宙循环投下的影子——这也正是六神形象自童及老的缘由，岁首即象征航船新一轮的起航（历法结构详见度量与岁时篇）。六季之首各有一场对应主神的祭典，多分东西两场设于两河沿岸对应位置的城市，地点顺河流自上游向下游铺开，每年变动，与混沌之河上的巨航之旅相对应；其中第[肆位](#idx-e355)季阿尔巴之祭固定在首都阿尔努尔举行，规模也最为盛大。每年祭典设于何地、要否加设，既是宗教问题，也牵动着极大的部落政治与经济利益，因此是[酋长会议](#idx-e244)上年年争执的议题。值得一提的是，[纳赫尔河](#idx-e539)的源头在索拉瑞斯境内，第一季的西祭典历来只能在靠近酋邦南边境的城市勉强举行，这也是尼希尔与索拉瑞斯边境关系长期恶劣的原因之一。\n\n作为祭典和秘术核心的献祭方式有两种。一种是祭典上的大型献祭，祭品由诸神圣土提供，其中必包含活人。祭典上祭司长为祭品涂上圣油、置于祭坛之上，主祭以一柄特制的镀金匕首刺入其心口。这一刺是象征性的，因为在祭品毙命之前，大祭司会以[秘术式](#idx-e2)将其[构成元素](#idx-e20)解离为无属性的元素流，用以驱动大型秘术，是为祭典最高潮。这种大型秘术或降下大雨，或开凿矿井，或为神庙或大型建筑群典籍，往往兼具实际效用与神遴者力量展示。另一种献祭更为私密，即神遴者按自己施法之需直接取祭品献祭；由于神遴者几乎足不出尼希尔、也几乎不在境外施术，这类献祭的具体过程在大陆学界的资料几乎不存在。经由[血票](#idx-e203)成为合法祭品的活物（活人在内）与素材，在教义上被视作对应神遴者的血票资产；血票所付的牺牲，被解作自愿而神圣的奉献，象征维系巨航船驶完循环所必需的代价（血票的经济机制详见尼希尔篇）。\n\n笔者注：略有讽刺的是，有些平民（尤其是奴隶）一旦成了血票，日子反倒比先前好过。神遴者出于宗教象征与现实利害两重考量，往往会把自己的血票看顾周全；而寻常奴隶的生死，往往只被当作资产的损耗来打量，无人如此上心。\n\n### 圣树信仰\n\n圣树信仰是希尔文诺精灵族的信仰，与人类各教截然不同，也最难为外界所知。迄今没有任何人类获准进入[希尔文诺大森林](#idx-e547)，人类对该信仰体系的所有了解，几乎都来自跨种族贸易往来与落叶精灵的口述。耐人寻味的是，这些认识泾渭分明地分作两半。一半是精灵并不忌讳、相对自由向人类讲述的：圣树给子民的教诲，以及它期望精灵如何行事——这部分历经数百年反复的交叉印证，相当可靠。另一半却是精灵讳莫如深、对异种族绝口不提的：圣树究竟是什么、精灵又如何敬奉它。可说的落在“精灵”，不可说的落在“圣树”；下文所谓“可考”“不可考”，即指其落在哪一半。\n\n#### 圣树与叶片\n\n圣树信仰的核心、也是唯一的神圣对象是希尔文诺大圣树。与多被世俗学者视为虚构的唯一神不同，大圣树是真实存在的实体，千年来矗立于[希尔文尼亚](#idx-e546)的祭坛广场之中，据叙述确曾释放过大型魔法。在精灵的观念里，每个精灵都是它的一片叶子、各[氏族](#idx-e216)是它的分枝；精灵一出生便与之相连，自然魔法即“圣树之母”分享的力量（同可参见魔法篇与希尔文诺篇）。凡有描述，圣树都以女性的位格出现，因为“所有精灵都是祂的孩子”。至于圣树是否真具一个主体的“神格”，则落在不可考的一半。既无人类见过大圣树，也就无从判断精灵口中“圣树母亲的教导”究竟是圣树亲授，还是一种宗教修辞。圣树与精灵的由来同样成谜，落叶精灵所能给出的最正面的回答，不过是“大圣树在一切之初便已存在，而我们作为祂的叶片降生”（其与“[叶茂](#idx-e380)纪元”之谜相连，详见度量与岁时篇）。\n\n圣树对叶片的教化，沉淀为七条自幼诵习、贯穿一生的诫律，统称[希尔文诺七诫](#idx-e220)，被认为直接出自大圣树、由历代[叶络枢机院](#idx-e221)口传维系，内容涵盖诚实、公正、感恩、守信、知足、等视与归属（全文见希尔文诺篇）。七诫之外，精灵也惯把种种信条称作“圣树之母的教导”；这究竟出自成文经典、长老口传，还是精灵个体把自己的道德自律追认为母亲的意思（好比孩子乖巧懂事，未必真是母亲一一吩咐），人类便无从分辨了。\n\n笔者注：精灵族这种整齐划一的沉默本身就透着些消息。一种可能是“不愿”说——将之视为不可与外族分享的禁忌；另一种可能是“不能”说——或许这些只有枢机院长老一级的精灵才知情，[落叶](#idx-e212)者本就无从说起，又或许他们被某种契约魔法从根本上禁止向异种族吐露。孰是孰非，无从证实。\n\n#### 礼仪与神职\n\n精灵的[人生大礼](#idx-e213)共有五道：出生与命名、成年、结婚、怀孕、葬礼，分别对应草木的抽芽、成叶、开花、结果与[归根](#idx-e211)，各有一套象征其时序的仪程，其中成年与结婚尤为隆重，照例须有族长或长老到场主持。“归根”一礼指向精灵的死后归宿：肉身葬于大森林，灵魂回归圣树，将来某日再作新芽降生；唯有落叶者被摒于这一循环之外——连接既断，“终归于根”的指望也就永远失去了。精灵另有周期性的[圣树祭典](#idx-e214)，其中最重要的一场纪念“一次[圣树枯荣](#idx-e215)”周期的开始，但这周期究竟合多少人类岁月、祭典又是何种情形，同样落在不可考的一半。\n\n圣树信仰没有独立于世俗权力的教阶：宗教职责完全由叶络枢机院的长老与各氏族族长兼任，枢机院[司院](#idx-e217)即其宗教上的首席。至于仪典如何进行、除希尔文尼亚的圣树所在之外还有哪些圣地，落叶精灵一概不愿谈起；他们偶尔随身携带的圣树信物，据观察多半是对大森林故乡的情感寄托，而非信仰意义上的圣物。\n\n笔者注：这里有一处值得指出的分别。人类诸教的信众与所奉之神之间，第一层关系都是“敬畏”；圣树信仰的第一层关系却是“亲爱”。与落叶精灵相处过的学者大多能感到，在许多精灵心里，圣树并非高踞其上的神祇，而实实在在是包括自己在内整个族群的母亲。由此有一个被广泛接受的推断：对寻常精灵而言，圣树信仰本身与对“圣树母亲”的亲情等同。祭典是为母亲庆生，人生礼仪则是在母亲面前展示自己的长成。\n\n### 世俗与无信仰\n\n大陆各国的信仰浓度相差悬殊。尼希尔、索拉瑞斯与忒奥西斯三国以信众为绝对主体：尼希尔是诸神信仰的神权酋邦；索拉瑞斯与圣领则以正教为国教，圣领的正信几乎与公民身份相始终，索拉瑞斯的正教信众亦逾公民八成。阿布丹提亚约有七成人口是公教徒，但公教并非国教。帝国奉行政教分离，宗教之于国政，远不及在索拉瑞斯与圣领那般地位重大。\n\n大陆南部的[卡帕尼](#idx-e519)与[艾瑟瑞姆](#idx-e510)相较之下可被视为完全的世俗国家。卡帕尼自阿布丹提亚帝国独立以来，务实逐利的商业文化不断冲淡信仰，至十六世纪初，境内正、公两教信众合计已不足国民的两成；艾瑟瑞姆更为极端，这个以星术与理性研究立国的王国举国上下几乎无人信教，[星空学派](#idx-e7)的学者也素来把唯一神看作并不存在的虚构。不过艾瑟瑞姆王国官方并不禁止宗教信仰，境内仍有零星的正教、公教教会，只是数量太少，不成规模，两教会都不曾为其单划[教区](#idx-e165)。至于希尔文诺，精灵则几乎人人系于圣树信仰，唯落叶者是例外（见前）。\n\n---\n\n笔者注：三套信仰对“力量何以可能”各有一套说法，可做彼此对照。唯一神信仰与圣树信仰如出一辙，都把魔法解释为一个崇高存在向其“孩子”分享的权柄；尼希尔诸神信仰则换了一副面孔，将力量说成与神之间一场以祭品清偿的交换。前两者言“赐予”，后者言“交换”，而三者无一例外，都把对力量的解释权牢牢系在统治或信仰的中枢之上。一种力量越是稀缺而关键，围绕它生长出的神学便越是周密——这一点上，诺拉尼亚的诸般信仰殊途同归。\n"])</script><script>self.__next_f.push([1,"a:[\"$\",\"$2\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"min-h-[60vh] flex items-center justify-center text-[var(--ink-muted)]\",\"children\":\"加载中…\"}],\"children\":[\"$\",\"$L12\",null,{\"bookSlug\":\"compendium\",\"toc\":[{\"slug\":\"作者序\",\"title\":\"炉边随记（代作者序）\",\"titleEn\":\"Preface\",\"isArticle\":true},{\"slug\":\"年表与大事记 Chronology\",\"title\":\"年表与大事记\",\"titleEn\":\"Chronology\",\"isArticle\":true},{\"slug\":\"度量与岁时 Measures and Times\",\"title\":\"度量与岁时\",\"titleEn\":\"Measures and Times\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview\",\"title\":\"大陆总览 Overview\",\"children\":[{\"slug\":\"大陆总览 Overview/地理\",\"title\":\"地理概述\",\"titleEn\":\"The Geography\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/魔法\",\"title\":\"魔法概述\",\"titleEn\":\"The Magic\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/经济\",\"title\":\"经济概述\",\"titleEn\":\"The Economy\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/宗教\",\"title\":\"宗教概述\",\"titleEn\":\"The Religions\",\"isArticle\":true},{\"slu e\":false},{\"slug\":\"诸域纪闻 Chronicles of the Realms\",\"title\":\"诸域纪闻 Chronicles of the Realms\",\"children\":[{\"slug\":\"诸域纪闻 Chronicles of the Realms/沉默者\",\"title\":\"沉默者\",\"titleEn\":\"The Silent One\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/衡台\",\"title\":\"衡台\",\"titleEn\":\"The Weighing Scale\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/童年\",\"title\":\"童年\",\"titleEn\":\"Coming of Age·Childhood\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/在人间·上\",\"title\":\"在人间·上\",\"titleEn\":\"Coming of Age·In the Human World I\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/在人间·下\",\"title\":\"在人间·下\",\"titleEn\":\"Coming of Age·In the Human World II\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/送别\",\"title\":\"送别\",\"titleEn\":\"The Farewell\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/铸币的两面\",\"title\":\"铸币的两面\",\"titleEn\":\"Two Sides of a Nicat\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"索引 Index\",\"title\":\"索引\",\"titleEn\":\"Index\",\"isArticle\":true}],\"currentSlug\":\"大陆总览 Overview/宗教\",\"article\":{\"slug\":\"大陆总览 Overview/宗教\",\"title\":\"宗教概述\",\"titleEn\":\"The Religions\",\"content\":\"$13\",\"indexTerms\":[{\"id\":\"e1\",\"title\":\"龙族魔法\",\"aliases\":[],\"body\":\"巨龙及龙族亚种所用的种族[魔法](#idx-e3)，学界归类为[神启魔法](#idx-e5)的一种。\"},{\"id\":\"e2\",\"title\":\"秘术式\",\"aliases\":[],\"body\":\"[尼希尔秘术](#idx-e4)施法所用的特殊仪式，将祭品[构成元素](#idx-e20)解离为[无属性元素流](#idx-e44)并转化为[魔法](#idx-e3)。\"},{\"id\":\"e3\",\"title\":\"魔法\",\"aliases\":[],\"body\":\"智慧种族通过特定条件调用[自然元素](#idx-e41)或[第五元素](#idx-e19)来施展的超自然力量，包含[祷言](#idx-e5)、[星术](#idx-e8)、[自然魔法](#idx-e9)和[秘术](#idx-e4)等种类。\"},{\"id\":\"e4\",\"title\":\"尼希尔秘术\",\"aliases\":[\"秘术\"],\"body\":\"[尼希尔](#idx-e536)统治阶级独有的[魔法](#idx-e3)体系，简称秘术，以等价交换为原理，解离祭品的[构成元素](#idx-e20)为力量。\"},{\"id\":\"e5\",\"title\":\"神启祷言\",\"aliases\":[\"祷言\",\"神启魔法\"],\"body\":\"[神启学派](#idx-e6)对自身[魔法](#idx-e3)的称呼，简称祷言；亦名神启魔法。狭义专指各类神启魔法对应的[术式](#idx-e40)。\"},{\"id\":\"e6\",\"title\":\"神启学派\",\"aliases\":[],\"body\":\"将[魔法](#idx-e3)解释为[唯一神](#idx-e138)所借权柄的学派，通过编织[术式](#idx-e40)调动环境中游离态的[四大元素](#idx-e41)来施展魔法。\"},{\"id\":\"e7\",\"title\":\"星空学派\",\"aliases\":[],\"body\":\"将[魔法](#idx-e3)解释为[第五元素](#idx-e19)显现与外化形式的学派，通过[内化](#idx-e32)以太于体内再[显化](#idx-e46)来施展魔法。\"},{\"id\":\"e8\",\"title\":\"以太星术\",\"aliases\":[\"星术\",\"星空魔法\"],\"body\":\"[星空学派](#idx-e7)对自身[魔法](#idx-e3)的称呼，简称星术；亦名星空魔法。狭义专指各类星空魔法对应的[大星轨](#idx-e18)走势。\"},{\"id\":\"e9\",\"title\":\"自然魔法\",\"aliases\":[\"精灵魔法\",\"圣树魔法\"],\"body\":\"精灵族与生俱来的法术能力，源自与[大圣树](#idx-e219)的契约连接；亦称精灵魔法、圣树魔法。\"},{\"id\":\"e10\",\"title\":\"奥韦纳尔·安柯伦坦\",\"aliases\":[\"安柯伦坦\"],\"body\":\"[艾瑟瑞姆](#idx-e510)[天星师](#idx-e251)，1304年提出智慧生物出生时的[大星轨](#idx-e18)图像决定其[仪式星轨](#idx-e51)特征，且该特征恰合[丝兰黛尔](#idx-e42)的[源星](#idx-e59)分类法，该分类法由此成为[星术](#idx-e8)学界公认标准。\"},{\"id\":\"e12\",\"title\":\"半龙化\",\"aliases\":[],\"body\":\"人类与巨龙缔结[血契](#idx-e50)后，其思维与立场不可逆地向龙族一侧偏移的现象。\"},{\"id\":\"e18\",\"title\":\"大星轨\",\"aliases\":[\"天道星轨\"],\"body\":\"[天星五政](#idx-e43)在天球上的轨迹，代表宇宙中[以太](#idx-e19)流的流向；亦称天道星轨。\"},{\"id\":\"e19\",\"title\":\"第五元素\",\"aliases\":[\"以太\"],\"body\":\"构成群星与其间空间（宇宙）的物质，通称以太，永恒不朽；稀薄存在于大地之上，[星空魔法](#idx-e8)师可将其蓄积体内，是星术的能量来源。\"},{\"id\":\"e20\",\"title\":\"构成元素\",\"aliases\":[],\"body\":\"构成实体事物的四大[自然元素](#idx-e41)，不响应[祷言](#idx-e5)[术式](#idx-e40)。通过[秘术式](#idx-e2)可将其解离。\"},{\"id\":\"e25\",\"title\":\"精神力\",\"aliases\":[],\"body\":\"编织[祷言](#idx-e5)[术式](#idx-e40)所凭的能力，可经后天训练提高，只能依靠时间缓慢恢复。\"},{\"id\":\"e27\",\"title\":\"洛林阶运\",\"aliases\":[],\"body\":\"特定工艺的[星轨蚀刻](#idx-e79)（如旧式的[三分耦式](#idx-e35)蚀刻法）所致的[玛娜](#idx-e28)自然向外部流出的矿界面层现象。\"},{\"id\":\"e28\",\"title\":\"玛娜\",\"aliases\":[\"魔力\"],\"body\":\"[星空学派](#idx-e7)语境下[内化](#idx-e32)后的[以太](#idx-e19)，即俗称的魔力；释放后无法自然恢复，须[星术](#idx-e8)师冥想缓慢补充。\"},{\"id\":\"e30\",\"title\":\"米西斯类\",\"aliases\":[],\"body\":\"[魔矿](#idx-e74)[蚀刻](#idx-e79)工艺的一个类别，包含[三分耦式](#idx-e35)蚀刻、四分耦式蚀刻等。特征是加工过程对环境温度非常敏感。\"},{\"id\":\"e32\",\"title\":\"内化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师于修习中将环境自由[以太](#idx-e19)汇入体内[仪式星轨](#idx-e51)的过程。\"},{\"id\":\"e35\",\"title\":\"三分耦式\",\"aliases\":[\"三分耦\"],\"body\":\"[米西斯类](#idx-e30)[魔矿](#idx-e74)[蚀刻](#idx-e79)工艺的一种，其加工过程长期依赖低温环境；1490年，该工艺获得可在室温条件下进行的重要突破。\"},{\"id\":\"e38\",\"title\":\"施法者\",\"aliases\":[],\"body\":\"能够主动运用[魔法](#idx-e3)的人口的统称，全大陆约占一成五。\"},{\"id\":\"e39\",\"title\":\"疏化\",\"aliases\":[],\"body\":\"同一空间内反复施用[神启魔法](#idx-e5)后[自然元素](#idx-e41)恢复速率异常下降的现象，由神启魔法学者菲略奥斯提出。\"},{\"id\":\"e40\",\"title\":\"术式\",\"aliases\":[],\"body\":\"[神启魔法](#idx-e5)师以[精神力](#idx-e25)编织、临时改写自然法则的结构，是与[唯一神](#idx-e138)所立的单向契约。\"},{\"id\":\"e41\",\"title\":\"四大元素\",\"aliases\":[\"自然元素\"],\"body\":\"构成世界万物和游离在自然环境中的地、水、火、风[元素](#idx-e54)，也称自然元素；唯游离态者可为[神启魔法](#idx-e5)调用。\"},{\"id\":\"e42\",\"title\":\"塔莉拉·丝兰黛尔\",\"aliases\":[\"丝兰黛尔\"],\"body\":\"[星空学派](#idx-e7)[魔法](#idx-e3)先驱，著《[星术](#idx-e8)源流考》，首创以五颗天星对应五类魔法的[源星](#idx-e59)分类法，源星之名即出于此。\"},{\"id\":\"e43\",\"title\":\"天星五政\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)最重要的概念之一，指[冠阳](#idx-e551)、[汐月](#idx-e563)、[仲裁星](#idx-e568)、[烬铸星](#idx-e552)、[织虹星](#idx-e567)五颗天体。五政在天球上的轨迹被称为[大星轨](#idx-e18)，代表了宇宙中[以太](#idx-e19)流的流向。\"},{\"id\":\"e44\",\"title\":\"无属性元素流\",\"aliases\":[],\"body\":\"[秘术式](#idx-e2)解离祭品[构成元素](#idx-e20)后所得的能量形态，其性质仍是大陆[魔法](#idx-e3)学界研究的未解课题。\"},{\"id\":\"e46\",\"title\":\"显化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师控制体内[以太](#idx-e19)流运转特定[大星轨](#idx-e18)、将[玛娜](#idx-e28)转为有色状态并外放的过程。\"},{\"id\":\"e50\",\"title\":\"血契\",\"aliases\":[],\"body\":\"人类与巨龙缔结的契约，双方精神世界互相开放，可转移龙族[术式](#idx-e40)的[精神力](#idx-e25)消耗。\"},{\"id\":\"e51\",\"title\":\"仪式星轨\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师于体内仿照[大星轨](#idx-e18)建立的结构，人体各部位各对应一天宫。是星术师释放星术的核心系统。\"},{\"id\":\"e54\",\"title\":\"元素\",\"aliases\":[],\"body\":\"组成万物的最基本实体，包含构成世界的[四大元素](#idx-e41)以及构成群星与其间空间（宇宙）的[第五元素](#idx-e19)。\"},{\"id\":\"e55\",\"title\":\"元素丰地\",\"aliases\":[],\"body\":\"游离态[四大元素](#idx-e41)丰度明显高于大陆平均的天然区域，对[疏化](#idx-e39)有强韧抵抗力。\"},{\"id\":\"e56\",\"title\":\"元素枯竭\",\"aliases\":[],\"body\":\"[疏化](#idx-e39)的最终形态，[元素](#idx-e54)流几乎完全凝滞且长期无法恢复，学界认为不可逆转。\"},{\"id\":\"e58\",\"title\":\"元素亲和力\",\"aliases\":[\"亲和力\"],\"body\":\"[神启魔法](#idx-e5)师对游离态[自然元素](#idx-e41)的感知能力，常简称亲和力，先天决定，常以感知范围量化。\"},{\"id\":\"e59\",\"title\":\"源星\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师[丝兰黛尔](#idx-e42)在《星术源流考》中提出的星术分类法中，五类星术的源头，对应[天星五政](#idx-e43)。该分类法被称为源星分类法。\"},{\"id\":\"e64\",\"title\":\"动力炉\",\"aliases\":[],\"body\":\"大型[星术设备](#idx-e88)的供能核心，见于[魔偶](#idx-e86)、[巨像](#idx-e84)与[星术驿车](#idx-e90)等。\"},{\"id\":\"e68\",\"title\":\"高品级魔矿\",\"aliases\":[],\"body\":\"[元素](#idx-e54)储存率极高、可承受各种[魔法](#idx-e3)加工工艺的[魔矿](#idx-e74)，八成以上产自[沙阿万大魔矿](#idx-e540)。\"},{\"id\":\"e72\",\"title\":\"洛林星元\",\"aliases\":[\"星元\"],\"body\":\"粗加工[魔矿](#idx-e74)晶体经[星轨蚀刻](#idx-e79)、注入[玛娜](#idx-e28)封装的[星术制品](#idx-e91)，通称星元，取名于洛林法蚀刻，可为小型[星术设备](#idx-e88)供能。\"},{\"id\":\"e74\",\"title\":\"魔法矿石\",\"aliases\":[\"魔矿\"],\"body\":\"对五大[元素](#idx-e54)均具极高流通率与储存率的天然矿石，通称魔矿，是大陆最重要的战略资源。\"},{\"id\":\"e76\",\"title\":\"蚀刻魔矿\",\"aliases\":[],\"body\":\"经[星轨蚀刻](#idx-e79)的[魔矿](#idx-e74)，可按[回路](#idx-e78)结构储存[玛娜](#idx-e28)，并在触发时释放对应[星术](#idx-e8)。\"},{\"id\":\"e77\",\"title\":\"托兰瓦尔·洛林\",\"aliases\":[\"洛林\"],\"body\":\"[艾瑟瑞姆](#idx-e510)[天星师](#idx-e251)，1125年首报可流通储存[以太](#idx-e19)的矿石并据以发明[星轨蚀刻](#idx-e79)；洛林法蚀刻为纪念其贡献而名，[洛林星元](#idx-e72)、[洛林阶运](#idx-e27)之名亦由此而来。\"},{\"id\":\"e78\",\"title\":\"星轨回路\",\"aliases\":[\"回路\"],\"body\":\"通过[蚀刻](#idx-e79)在[魔矿](#idx-e74)上建立的模仿[仪式星轨](#idx-e51)的通路，允许魔矿储存[玛娜](#idx-e28)，并在特定条件触发下释放对应[星术](#idx-e8)。\"},{\"id\":\"e79\",\"title\":\"星轨回路蚀刻\",\"aliases\":[\"蚀刻\",\"星轨蚀刻\",\"洛林法蚀刻\"],\"body\":\"于[魔矿](#idx-e74)表面蚀刻[仪式星轨](#idx-e51)[回路](#idx-e78)的技术，简称星轨蚀刻或蚀刻，为纪念发明人，又名洛林法蚀刻。1125年由[艾瑟瑞姆](#idx-e510)[星术](#idx-e8)学者[托兰瓦尔·洛林](#idx-e77)发明，构成了[星术设备](#idx-e88)的基石。\"},{\"id\":\"e84\",\"title\":\"星术巨像\",\"aliases\":[\"巨像\"],\"body\":\"[星术](#idx-e8)兵种的大型作战单位，通称巨像，由专精操作的星术师远距控制。\"},{\"id\":\"e86\",\"title\":\"星术魔偶\",\"aliases\":[\"魔偶\"],\"body\":\"以[蚀刻](#idx-e79)[回路](#idx-e78)驱动的小型[星术](#idx-e8)作战或劳作单位，通称魔偶，有农用魔偶、清扫魔偶等。\"},{\"id\":\"e88\",\"title\":\"星术设备\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e76)制成的各类器物的统称，自家用台灯至战场[巨像](#idx-e84)[动力炉](#idx-e64)，是[艾瑟瑞姆](#idx-e510)高技术社会立国的物质基础。\"},{\"id\":\"e90\",\"title\":\"星术驿车\",\"aliases\":[],\"body\":\"以[动力炉](#idx-e64)驱动的陆上载具，行于[艾瑟瑞姆](#idx-e510)城市内或城际道路。\"},{\"id\":\"e91\",\"title\":\"星术制品\",\"aliases\":[],\"body\":\"[星术设备](#idx-e88)所需半成品作为贸易品的称呼，[洛林星元](#idx-e72)为其典型代表。\"},{\"id\":\"e99\",\"title\":\"阿内玛\",\"aliases\":[],\"body\":\"四[天使长](#idx-e137)之一，掌岚（风）[元素](#idx-e54)权柄。\"},{\"id\":\"e100\",\"title\":\"埃塞莉斯\",\"aliases\":[],\"body\":\"巡行天球之上、监视[虚界](#idx-e145)裂缝的[次级天使](#idx-e104)，末世预言中最先通报天球开裂者。[公教](#idx-e110)尊之为[以太](#idx-e19)神权的象征、与四[天使长](#idx-e137)并列，[正教](#idx-e150)不认此说。\"},{\"id\":\"e102\",\"title\":\"朝圣\",\"aliases\":[],\"body\":\"[正教](#idx-e150)信众沿既定路线前往[圣城索菲亚](#idx-e503)的虔修，是[圣领](#idx-e499)可观的收入来源。\"},{\"id\":\"e103\",\"title\":\"称义\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒持守信仰、按神的教诲生活而得免[宿债](#idx-e134)的全过程，自[洗礼](#idx-e140)始，至临终而成。\"},{\"id\":\"e104\",\"title\":\"次级天使\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中四[天使长](#idx-e137)座下的天使，往来三界传谕护佑；[埃塞莉斯](#idx-e100)为其中特殊一位。\"},{\"id\":\"e105\",\"title\":\"从圣徒\",\"aliases\":[],\"body\":\"历代[正教会](#idx-e185)与[公教会](#idx-e159)册封的显现神迹、殉道或品行高洁的信徒，死后由[次级天使](#idx-e104)径引[天界](#idx-e136)。\"},{\"id\":\"e106\",\"title\":\"大赦\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中[三大罪](#idx-e121)的赦免。须直接出自[大牧首](#idx-e152)或[宗主教](#idx-e187)本人。\"},{\"id\":\"e107\",\"title\":\"大祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)学徒正式受任为神职的[圣事](#idx-e124)。\"},{\"id\":\"e108\",\"title\":\"盖昂\",\"aliases\":[],\"body\":\"四[天使长](#idx-e137)之一，掌地[元素](#idx-e54)权柄。\"},{\"id\":\"e109\",\"title\":\"告解\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒为自身罪行请求赦免的[圣事](#idx-e124)，可反复进行。\"},{\"id\":\"e110\",\"title\":\"公教\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)两大教派之一，1295年[教会大分裂](#idx-e164)后自[阿布丹提亚](#idx-e468)境内的[正教会](#idx-e185)独立而成，以[公教会](#idx-e159)为组织载体，是阿布丹提亚人口的第一大信仰。将[星空魔法](#idx-e8)一并纳入[唯一神](#idx-e138)权柄、另尊保罗为第二先知；主张轻罪可凭虔信与[圣事](#idx-e124)自赦，审判之权唯神独有，故不设[审判庭](#idx-e175)建制并废除[诺万尼斯流放](#idx-e171)，对个人虔修的要求高于[正教](#idx-e150)；[季首弥撒](#idx-e112)与节庆均依[通用历](#idx-e373)。\"},{\"id\":\"e111\",\"title\":\"海德洛娅\",\"aliases\":[],\"body\":\"四[天使长](#idx-e137)之一，掌泽（水）[元素](#idx-e54)权柄。\"},{\"id\":\"e112\",\"title\":\"季首弥撒\",\"aliases\":[],\"body\":\"[正教](#idx-e150)于[仪式历](#idx-e366)各季首日，[公教](#idx-e110)于[通用历](#idx-e373)各季首日举行的规模略大于每周[弥撒](#idx-e116)的集体仪式。\"},{\"id\":\"e113\",\"title\":\"坚振\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中，标志[称义](#idx-e103)大体完成的[圣事](#idx-e124)，一生一次，须对教会有重大贡献或持守信仰足够长久。\"},{\"id\":\"e114\",\"title\":\"苦行\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中，赦免所需的赎罪之法，其责可购[赎罪券](#idx-e132)折抵。\"},{\"id\":\"e115\",\"title\":\"礼仪年\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中六季[弥撒](#idx-e116)与九大节庆构成的一整年宗教循环。\"},{\"id\":\"e116\",\"title\":\"弥撒\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)礼拜日举行的集体仪式，与每日的[日课](#idx-e120)同为[称义](#idx-e103)最重要的日常载体。\"},{\"id\":\"e117\",\"title\":\"冥界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中的[四界](#idx-e133)之一，信徒死后安息、静候轮回之地。\"},{\"id\":\"e118\",\"title\":\"末日之战\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)末世预言中，天使大军与诸巨龙对抗三只[虚之大兽](#idx-e146)的终局之战。\"},{\"id\":\"e119\",\"title\":\"皮雷乌斯\",\"aliases\":[],\"body\":\"四[天使长](#idx-e137)之一，掌炎（火）[元素](#idx-e54)权柄。\"},{\"id\":\"e120\",\"title\":\"日课\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒每日的功课，与礼拜日[弥撒](#idx-e116)同为[称义](#idx-e103)的日常载体。\"},{\"id\":\"e121\",\"title\":\"三大罪\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中，[原罪](#idx-e149)之下的三种大罪：不谨、不智、不爱；非经[大赦](#idx-e106)不得赦免。\"},{\"id\":\"e122\",\"title\":\"圣保罗\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之一，最初的医者，司治愈与修复；对应[织虹星](#idx-e567)与[虹曜日](#idx-e353)。[公教](#idx-e110)另尊其为第二先知。\"},{\"id\":\"e123\",\"title\":\"圣骸\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)语境下的圣徒遗骨，为[朝圣](#idx-e102)与教堂声望所系，如[潘克拉托](#idx-e501)大教堂所藏的[圣约翰](#idx-e126)圣骸。\"},{\"id\":\"e124\",\"title\":\"圣事\",\"aliases\":[],\"body\":\"指[正教](#idx-e150)与[公教](#idx-e110)六项圣事：[洗礼](#idx-e140)、[坚振](#idx-e113)、婚姻、[告解](#idx-e109)、[大祝职](#idx-e107)、[小祝职](#idx-e142)。\"},{\"id\":\"e125\",\"title\":\"圣伊琳娜\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之一，司秩序与契约；对应[仲裁星](#idx-e568)与[裁曜日](#idx-e350)，[圣领](#idx-e499)[伊琳娜圣银币](#idx-e346)以其得名。\"},{\"id\":\"e126\",\"title\":\"圣约翰\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之首，[正教](#idx-e150)唯一的先知与弥赛亚，司精神与教导；对应[汐月](#idx-e563)与[月曜日](#idx-e381)。\"},{\"id\":\"e127\",\"title\":\"圣约瑟\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之一，商会之圣，司转化、破坏与锻造；对应[烬铸星](#idx-e552)与[烬曜日](#idx-e356)，[圣约瑟商会](#idx-e340)以其得名。\"},{\"id\":\"e129\",\"title\":\"使徒\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载中，随[唯一神](#idx-e138)降世传教的最初四人：约翰、伊琳娜、约瑟、保罗。\"},{\"id\":\"e130\",\"title\":\"十字架\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)共用的宗教象征符号。[正教](#idx-e150)十字架为四端，象征四[元素](#idx-e54)权柄。[公教](#idx-e110)下端另加一横，四横端象征四元素，竖端象征[星术](#idx-e8)。\"},{\"id\":\"e132\",\"title\":\"赎罪券\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)售卖的一次性折抵[告解](#idx-e109)[苦行](#idx-e114)的凭证，不可转让或继承。\"},{\"id\":\"e133\",\"title\":\"四界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)神学的宇宙构成：[天界](#idx-e136)、[现界](#idx-e141)、[冥界](#idx-e117)、[虚界](#idx-e145)。\"},{\"id\":\"e134\",\"title\":\"宿债\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)神学中，人一出生便背负的亏欠。缘于[唯一神](#idx-e138)所借予而非赐予的权柄，受惠者无人能置身账外。\"},{\"id\":\"e135\",\"title\":\"索菲亚圣典\",\"aliases\":[\"圣典\"],\"body\":\"[唯一神信仰](#idx-e139)的最高典籍，通称《圣典》，分《创世录》、《弥赛亚记》、《神言书》、《箴言集》、四福音（《约翰福音》、《约瑟福音》、《伊琳娜福音》、《保罗福音》）与《预言书》。\"},{\"id\":\"e136\",\"title\":\"天界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中的[四界](#idx-e133)之一，[唯一神](#idx-e138)、圣徒与天使的居所。\"},{\"id\":\"e137\",\"title\":\"天使长\",\"aliases\":[],\"body\":\"神学中[唯一神](#idx-e138)部分神格的具现。共有四位，各具六翼，分掌[四大元素](#idx-e41)权柄：[盖昂](#idx-e108)（地）、[皮雷乌斯](#idx-e119)（火）、[阿内玛](#idx-e99)（岚）、[海德洛娅](#idx-e111)（水）。\"},{\"id\":\"e138\",\"title\":\"唯一神\",\"aliases\":[\"主\",\"神\",\"上帝\"],\"body\":\"[唯一神信仰](#idx-e139)所奉的至高神，信徒亦称主、神或上帝，是宇宙的创造者、维系者与监督者，也是世间一切[魔法](#idx-e3)力量的源头。\"},{\"id\":\"e139\",\"title\":\"唯一神信仰\",\"aliases\":[],\"body\":\"大陆流播最广的宗教，崇奉[唯一神](#idx-e138)，与[神启祷言](#idx-e5)一脉深度绑定，最高典籍为《[索菲亚圣典](#idx-e135)》。十三世纪末[教会大分裂](#idx-e164)后分为[正教](#idx-e150)与[公教](#idx-e110)两派，前者为[索拉瑞斯](#idx-e441)与[忒奥西斯](#idx-e499)的国教，后者是[阿布丹提亚](#idx-e468)人口的第一大信仰；其历法与礼拜之制的影响遍及各国。\"},{\"id\":\"e140\",\"title\":\"洗礼\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒入教与[称义](#idx-e103)之始的[圣事](#idx-e124)，一生一次，象征认清并领受自身的[宿债](#idx-e134)。\"},{\"id\":\"e141\",\"title\":\"现界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中[四界](#idx-e133)之一，人类生息的世界。\"},{\"id\":\"e142\",\"title\":\"小祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)神职人员卸任、复为寻常信徒之礼，多见于年老体弱者。\"},{\"id\":\"e144\",\"title\":\"虚潮\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)神学中，末日时自[虚界](#idx-e145)渗入[现界](#idx-e141)的虚，所至之处只余死地。\"},{\"id\":\"e145\",\"title\":\"虚界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中的[四界](#idx-e133)之一，天球与大地之外仍为虚所充满的空间，罪人与非正信者死后的去处。\"},{\"id\":\"e146\",\"title\":\"虚之大兽\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)末世预言中，由被吞灭者之力所生的三只巨兽，各象[三大罪](#idx-e121)。\"},{\"id\":\"e147\",\"title\":\"异端\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)语境下，秉持不同教义解释相异的教派；就[正教](#idx-e150)而言[公教](#idx-e110)即当代最大异端。\"},{\"id\":\"e148\",\"title\":\"异教\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)语境下，唯一神信仰之外的其他宗教，如[尼希尔诸神信仰](#idx-e196)。\"},{\"id\":\"e149\",\"title\":\"原罪\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)语境下，不信奉[唯一神](#idx-e138)者[宿债](#idx-e134)所转化者。负原罪者死后被流放[虚界](#idx-e145)，终至灵魂碎裂。\"},{\"id\":\"e150\",\"title\":\"正教\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)两大教派之一，以[正教会](#idx-e185)为组织载体，为[索拉瑞斯](#idx-e441)与[忒奥西斯](#idx-e499)的国教。认[神启祷言](#idx-e5)为[唯一神](#idx-e138)所授的权柄，[星空魔法](#idx-e8)则不在神权之列；一切罪无论大小均须经[告解](#idx-e109)方得赦免，并以神在[现界](#idx-e141)的代行者自任，设[审判庭](#idx-e175)严管神启魔法、以[诺万尼斯流放](#idx-e171)向神赎罪。历法与[礼仪年](#idx-e115)循环依[圣格里仪式历](#idx-e366)。\"},{\"id\":\"e151\",\"title\":\"传信厅\",\"aliases\":[],\"body\":\"[圣领](#idx-e499)[牧首厅](#idx-e170)六分厅之一，分管外交。\"},{\"id\":\"e152\",\"title\":\"大牧首\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)最高元首、[忒奥西斯](#idx-e499)圣领国家元首，由[枢机主教团](#idx-e178)闭门选出，终身任期。\"},{\"id\":\"e153\",\"title\":\"大审判长\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)最高长官，由[枢机主教团](#idx-e178)任命，与[大牧首](#idx-e152)同为终身任期。\"},{\"id\":\"e154\",\"title\":\"第二次宗教改革\",\"aliases\":[],\"body\":\"十三世纪末谋求将[星术](#idx-e8)纳入神权的改革，失败后直接导致[教会大分裂](#idx-e164)。\"},{\"id\":\"e155\",\"title\":\"第一次宗教改革\",\"aliases\":[],\"body\":\"八世纪中叶以[诺万尼斯大叛乱](#idx-e284)为导火索的改革，[龙族魔法](#idx-e1)获平反，《[索菲亚圣典](#idx-e135)·创世录》新增有关巨龙族的章节。\"},{\"id\":\"e156\",\"title\":\"都主教\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)[都主教区](#idx-e157)长官，教阶在主教之上；与[大牧首](#idx-e152)同不得婚娶，别称[门徒](#idx-e169)。\"},{\"id\":\"e157\",\"title\":\"都主教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e499)最高一级行政区划和宗教管理区划，全境共五个，长官称[都主教](#idx-e156)。[卡帕尼](#idx-e519)和[索拉瑞斯](#idx-e441)亦设有都主教区，但不具备行政职能。\"},{\"id\":\"e158\",\"title\":\"督审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)教阶之一，位在[审判官](#idx-e173)之上；[审判所](#idx-e166)驻任长官、[审判分庭](#idx-e172)官员。[诺万尼斯流放](#idx-e171)须由审判分庭所属督审判官主刑。\"},{\"id\":\"e159\",\"title\":\"公教会\",\"aliases\":[],\"body\":\"1295年[教会大分裂](#idx-e164)后，[阿布丹提亚](#idx-e468)境内[正教会](#idx-e185)脱离[牧首厅](#idx-e170)管辖独立而来的教会，领袖称[宗主教](#idx-e187)，驻[波马里亚](#idx-e475)。\"},{\"id\":\"e160\",\"title\":\"公教区\",\"aliases\":[],\"body\":\"[公教会](#idx-e159)的行政区划，多依当地世俗政权划界；在[阿布丹提亚](#idx-e468)依[帝政省](#idx-e233)划分，所属分会设于区内最大城市。其下不再分级，直辖各地基层教会。\"},{\"id\":\"e161\",\"title\":\"公教总会\",\"aliases\":[],\"body\":\"[公教会](#idx-e159)中枢，驻[阿布丹提亚帝国](#idx-e468)城市[波马里亚](#idx-e475)。\"},{\"id\":\"e164\",\"title\":\"教会大分裂\",\"aliases\":[],\"body\":\"1295年[第二次宗教改革](#idx-e154)失败后，[阿布丹提亚帝国](#idx-e468)境内[正教会](#idx-e185)宣布脱离[牧首厅](#idx-e170)独立，成立[公教会](#idx-e159)。\"},{\"id\":\"e165\",\"title\":\"教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e499)[都主教区](#idx-e157)下辖的最小一级行政区划，长官称主教。也是[正教会](#idx-e185)在大陆各国所划的宗教事务上的最小管理层级。\"},{\"id\":\"e166\",\"title\":\"教区审判所\",\"aliases\":[\"审判所\"],\"body\":\"[审判庭](#idx-e175)在[教区](#idx-e165)一级所设的分支机构，简称审判所，由[督审判官](#idx-e158)驻任长官。\"},{\"id\":\"e169\",\"title\":\"门徒\",\"aliases\":[],\"body\":\"教会系统中[都主教](#idx-e156)及以上神职，以及[审判庭](#idx-e175)系统中自[督审判官](#idx-e158)及以上职位的别称，象征舍弃现世之乐、专心侍神；门徒不得婚娶。\"},{\"id\":\"e170\",\"title\":\"牧首厅\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)中枢以及[圣领](#idx-e499)最高行政机构，下设[圣礼厅](#idx-e177)、[省察厅](#idx-e183)、[司牧厅](#idx-e181)、[神启厅](#idx-e176)、[传信厅](#idx-e151)、[卫教厅](#idx-e182)六分厅。\"},{\"id\":\"e171\",\"title\":\"诺万尼斯流放\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[索拉瑞斯帝国](#idx-e441)维持的一种极刑，将受刑者留置诺万尼斯区域枯竭死地直至器官衰竭。\"},{\"id\":\"e172\",\"title\":\"审判分庭\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)在[都主教区](#idx-e157)一级的机构，长官称审判长，由[大审判长](#idx-e153)直接任命。\"},{\"id\":\"e173\",\"title\":\"审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)教阶之一，负责日常调查和执行事务，是[圣领](#idx-e499)独立于军事系统的强制执行编制。\"},{\"id\":\"e175\",\"title\":\"审判庭\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)直属司法和执行机构，处理[异端](#idx-e147)事务、追查未经许可的神启施法，拥有独立执法和行刑权。\"},{\"id\":\"e176\",\"title\":\"神启厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管[神启魔法](#idx-e5)事务。\"},{\"id\":\"e177\",\"title\":\"圣礼厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管宗教事务，亦负责[索拉瑞斯](#idx-e441)[凯撒](#idx-e239)的[血脉测试](#idx-e258)。\"},{\"id\":\"e178\",\"title\":\"枢机主教团\",\"aliases\":[],\"body\":\"[圣领](#idx-e499)事实上的最高权力机构，[大牧首](#idx-e152)去世后负责闭门选出继任者。成员由大牧首自[都主教](#idx-e156)中选任。\"},{\"id\":\"e180\",\"title\":\"司祭\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)教阶之一，分管各城镇乡村的基层教会，往往本人即[神启魔法](#idx-e5)师。\"},{\"id\":\"e181\",\"title\":\"司牧厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管民生。\"},{\"id\":\"e182\",\"title\":\"卫教厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管军事，战时统一征召[护教军](#idx-e294)。\"},{\"id\":\"e183\",\"title\":\"省察厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管监察。\"},{\"id\":\"e185\",\"title\":\"正教会\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)最大教派[正教](#idx-e150)的教会组织，以[忒奥西斯](#idx-e499)圣领[牧首厅](#idx-e170)为教会中枢，同时也是圣领的统治机构。\"},{\"id\":\"e187\",\"title\":\"宗主教\",\"aliases\":[],\"body\":\"[公教会](#idx-e159)领袖，由全大陆[公教](#idx-e110)主教选出三名候选，再由盲眼童贞信徒抽签决定。\"},{\"id\":\"e188\",\"title\":\"阿尔巴\",\"aliases\":[\"肆之神\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)中六神之一，壮年之形，象征在大地上撑起天空的四根基柱，司社会制度、秩序与统治；[神遴者](#idx-e417)高居众人之上的教义即以其名颁布。\"},{\"id\":\"e189\",\"title\":\"阿姆萨\",\"aliases\":[\"伍之神\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)中六神之一，中年之形，象征人手所出的智慧结晶，司智慧、工艺、制造与艺术。\"},{\"id\":\"e190\",\"title\":\"大神庙\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e536)首都[阿尔努尔](#idx-e537)城中的[教长](#idx-e204)驻地，是酋邦的宗教中心与圣地。\"},{\"id\":\"e191\",\"title\":\"混沌之海\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中[混沌之河](#idx-e192)的尽头。现世的[巨航船](#idx-e194)于此为海浪撕毁，是为末日。千年后新船于混沌之河上游再度起航。\"},{\"id\":\"e192\",\"title\":\"混沌之河\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中，孕育[司费尔](#idx-e199)的停滞之河，经其令之流动后成为宇宙时间的载体。[巨航船](#idx-e194)自上游航行而下抵达[混沌之海](#idx-e191)，是为一次循环。\"},{\"id\":\"e193\",\"title\":\"祭司团\",\"aliases\":[],\"body\":\"[诸神圣土](#idx-e207)按六神分设的祭司团，各设大祭司一位，兼为辅助[教长](#idx-e204)治理圣土的行政机构。\"},{\"id\":\"e194\",\"title\":\"巨航船\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中的宇宙譬喻：[现界](#idx-e141)如行于[混沌之河](#idx-e192)上的巨船，终将驶抵[混沌之海](#idx-e191)。\"},{\"id\":\"e195\",\"title\":\"玛阿特\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中的死后审判仪式，以心脏置于天平称量，砝码为[希塔](#idx-e202)手杖顶端的宝石。\"},{\"id\":\"e196\",\"title\":\"尼希尔诸神信仰\",\"aliases\":[\"诸神信仰\"],\"body\":\"行于[尼希尔酋邦](#idx-e536)一域的宗教，通称诸神信仰，是大陆唯一与活体献祭绑定者。奉[零之神](#idx-e199)司费尔及其所化六神，以死后的[玛阿特](#idx-e195)称量为教义核心，称量恰成平衡者受赐[秘术](#idx-e4)之力成为[神遴者](#idx-e417)。雏形出自两河流域早期部落，结构在前二世纪萨阿尔部征服西尼希尔后成型，宗教、秘术与统治三者由此缚为一体。\"},{\"id\":\"e197\",\"title\":\"塞兰萨\",\"aliases\":[\"叁之神\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)中六神之一，青年之形，象征时间轮转与农时，司岁时更替、万物生长与记忆。\"},{\"id\":\"e198\",\"title\":\"守护兽\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中神祇所驯养的神兽，鹰头狮身蛇尾。心脏未能通过[玛阿特](#idx-e195)称量之人，其心为之吞噬。\"},{\"id\":\"e199\",\"title\":\"司费尔\",\"aliases\":[\"零之神\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)中[混沌之河](#idx-e192)所孕育的最初亦唯一之神，以自身之躯造出[现界](#idx-e141)，又拆己身为六片化作六神，随后消隐，不受祭祀。\"},{\"id\":\"e200\",\"title\":\"司费尔书\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)唯一的成文典籍，载创世、宇宙与诸神的全部神话，古今各部所载相当固定。\"},{\"id\":\"e201\",\"title\":\"瓦赫德\",\"aliases\":[\"壹之神\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)中六神之首，孩童之形，象征循环与现世的开端，司驱动[混沌之河](#idx-e192)的\\\"第一力\\\"，是[秘术](#idx-e4)力量的源头。\"},{\"id\":\"e202\",\"title\":\"希塔\",\"aliases\":[\"陆之神\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)中六神之一，老者之形，象征万物的终点，司灵魂与审判，看护[至福乐土](#idx-e206)；[玛阿特](#idx-e195)称量由其执行，砝码即其手杖顶端的宝石。\"},{\"id\":\"e203\",\"title\":\"血票\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e536)实行的，以活体生物作等价支付手段的制度，所收活物依教义可合法作为祭品用于[秘术](#idx-e4)祭祀。\"},{\"id\":\"e204\",\"title\":\"伊玛目教长\",\"aliases\":[\"教长\"],\"body\":\"[尼希尔](#idx-e536)最高元首，简称教长，同时是酋邦的宗教领袖与[酋长会议](#idx-e244)首席。终身制，非世袭，代代以[秘术](#idx-e4)密封诏书委任继承。\"},{\"id\":\"e205\",\"title\":\"伊斯南\",\"aliases\":[\"贰之神\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)六神之一，少年之形，象征二元的对立与调和，司昼夜交替、河流涨落等自然之象。\"},{\"id\":\"e206\",\"title\":\"至福乐土\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中，[玛阿特](#idx-e195)称量通过者所被允许进入的永恒安乐之地，由[希塔](#idx-e202)看护。\"},{\"id\":\"e207\",\"title\":\"诸神圣土\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e536)中由[伊玛目教长](#idx-e204)直辖的宗教领地。含首都[阿尔努尔](#idx-e537)及周边耕地城市，由各部按比例出资供养。\"},{\"id\":\"e211\",\"title\":\"归根\",\"aliases\":[],\"body\":\"精灵葬礼之谓：肉身葬于大森林，灵魂回归[圣树](#idx-e219)，来日再作新芽降生。\"},{\"id\":\"e212\",\"title\":\"落叶\",\"aliases\":[],\"body\":\"精灵与[圣树](#idx-e219)的精神连接中断之谓，主动者称背弃圣树者，被动者称圣树抛弃者。\"},{\"id\":\"e213\",\"title\":\"人生大礼\",\"aliases\":[],\"body\":\"精灵的出生与命名、成年、结婚、怀孕、葬礼，分对草木的抽芽、成叶、开花、结果、[归根](#idx-e211)。\"},{\"id\":\"e214\",\"title\":\"圣树祭典\",\"aliases\":[],\"body\":\"精灵的周期性祭典，最重要的一场用于纪念一次[圣树枯荣](#idx-e215)周期的开始。\"},{\"id\":\"e215\",\"title\":\"圣树枯荣\",\"aliases\":[],\"body\":\"精灵计时的大周期，一度圣树枯荣为一祭典循环的开始。\"},{\"id\":\"e216\",\"title\":\"氏族\",\"aliases\":[],\"body\":\"精灵族的社会单位，被喻为[大圣树](#idx-e219)的分枝，各有族长与长老，本族领地内高度自治。\"},{\"id\":\"e217\",\"title\":\"司院\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e543)[叶络枢机院](#idx-e221)首席，由[万叶庭](#idx-e218)轮选中得票最多的长老出任，同时也是[圣树](#idx-e219)信仰的宗教领袖。\"},{\"id\":\"e218\",\"title\":\"万叶庭\",\"aliases\":[],\"body\":\"精灵族最高权力机构，每三十年于[希尔文尼亚](#idx-e546)召开，全体精灵借[圣树魔法](#idx-e9)旁听并投票。\"},{\"id\":\"e219\",\"title\":\"希尔文诺大圣树\",\"aliases\":[\"圣树\",\"大圣树\",\"圣树之母\"],\"body\":\"圣树信仰唯一的神圣对象，通称大圣树或圣树，矗立于[希尔文尼亚](#idx-e546)祭坛广场；凡有描述皆以女性位格出现，精灵称之为圣树之母，[自然魔法](#idx-e9)即祂分享之力。\"},{\"id\":\"e220\",\"title\":\"希尔文诺七诫\",\"aliases\":[],\"body\":\"[圣树](#idx-e219)对自己精灵子民的教化，总结为七条自幼诵习、贯穿一生的诫律，是为七诫，由历代[叶络枢机院](#idx-e221)口传维系。\"},{\"id\":\"e221\",\"title\":\"叶络枢机院\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e543)日常行政与对外事务机构，席位由[万叶庭](#idx-e218)轮选，长老兼承宗教职责。\"},{\"id\":\"e223\",\"title\":\"阿斯塔伦·塔利瑞安\",\"aliases\":[\"塔利瑞安\"],\"body\":\"[星术](#idx-e8)泰斗，1097年联合十二城邦创建[大星术研究院](#idx-e231)，即今[王家研究院](#idx-e254)之前身。\"},{\"id\":\"e231\",\"title\":\"大星术研究院\",\"aliases\":[],\"body\":\"1097年由[塔利瑞安](#idx-e223)联合十二城邦创建，[艾瑟瑞姆](#idx-e510)[王家研究院](#idx-e254)前身，是艾瑟瑞姆国家形态的起点。\"},{\"id\":\"e232\",\"title\":\"地星师\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e510)[星术](#idx-e8)学者的头衔之一。星术师于所属研究院研究室完成课题答辩，毕业后被授予的头衔。\"},{\"id\":\"e233\",\"title\":\"帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)的一级行政区划，共五个，与皇室直辖的[维里迪亚直辖省](#idx-e497)并列；省政府为中央[内阁](#idx-e242)的地方分支。原为六省，[卡帕尼](#idx-e519)独立后余五省。\"},{\"id\":\"e235\",\"title\":\"公爵领\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)最高级别的贵族封地，各[帝政省](#idx-e233)含一到两个公爵领。\"},{\"id\":\"e236\",\"title\":\"管理局\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)[特贸区](#idx-e522)的立法与行政机构，由区内各商会分部选派代表组成，最高长官称管理局主席。\"},{\"id\":\"e237\",\"title\":\"军团行省\",\"aliases\":[\"行省\"],\"body\":\"[索拉瑞斯](#idx-e441)的一级行政区划，一行省对应一[军团](#idx-e299)，共八个，长官称[行省总督](#idx-e256)。\"},{\"id\":\"e238\",\"title\":\"龙裔继嗣法\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)开国皇帝[阿利昂](#idx-e240)晚年制定的皇位继承法，以直系子嗣的龙血浓度为据，由[牧首厅](#idx-e170)主持[血脉测试](#idx-e258)。\"},{\"id\":\"e239\",\"title\":\"龙裔凯撒\",\"aliases\":[\"凯撒\"],\"body\":\"[索拉瑞斯](#idx-e441)最高统治者的称号，简称凯撒，即位须由[大牧首](#idx-e152)主持册封礼，体现君权神授。\"},{\"id\":\"e240\",\"title\":\"马尔奇安·阿利昂\",\"aliases\":[\"阿利昂\"],\"body\":\"[索拉瑞斯](#idx-e441)开国[凯撒](#idx-e239)，人龙混血，受[大牧首](#idx-e152)册封为首位龙裔凯撒；捐帝国东部领土立[忒奥西斯](#idx-e499)圣领，晚年制定《[龙裔继嗣法](#idx-e238)》。\"},{\"id\":\"e242\",\"title\":\"内阁\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e510)和[阿布丹提亚帝国](#idx-e468)的中央机构之一。均指直属于王室/皇室的日常行政机构，各有大臣分管外交、军务、内务与王室/皇室财政。\"},{\"id\":\"e244\",\"title\":\"酋长会议\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e536)最高权力机构，由[教长](#idx-e204)与各部落酋长组成，每年[金素](#idx-e355)季于[阿尔努尔](#idx-e537)召开，协商全酋邦外交、军事与内政事宜。\"},{\"id\":\"e245\",\"title\":\"三柱议会\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)最高立法与财政机构，1393年确立，三柱指皇室、贵族与[魔法](#idx-e3)阶级。\"},{\"id\":\"e249\",\"title\":\"特别仪式区\",\"aliases\":[\"仪式区\"],\"body\":\"位于[艾瑟瑞姆](#idx-e510)中南部最大平原，专用于王国[星术](#idx-e8)研究与设备制造，行政直属国王/女王，区内最大城市为[韦里泰尔](#idx-e517)。\"},{\"id\":\"e250\",\"title\":\"特区商法典\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)[北部特贸区](#idx-e522)适用的独立法系，不同于各公国法系。\"},{\"id\":\"e251\",\"title\":\"天星师\",\"aliases\":[],\"body\":\"[星术](#idx-e8)学者的最高阶头衔与职位，授予毕业后继续从事学术研究，且学术成果极为杰出的[地星师](#idx-e232)。[托兰瓦尔·洛林](#idx-e77)、[奥韦纳尔·安柯伦坦](#idx-e10)等均曾任天星师。\"},{\"id\":\"e252\",\"title\":\"天星首席\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e510)[王家研究院](#idx-e254)最高级别学者之职，永久由艾瑟瑞姆国王或女王兼任。\"},{\"id\":\"e253\",\"title\":\"王冠领地\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e510)国王直辖之地，含以首都[阿斯托利亚](#idx-e511)为首的[坠星湖](#idx-e518)南岸城市群。\"},{\"id\":\"e254\",\"title\":\"王家研究院\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e510)学术中枢，前身为[大星术研究院](#idx-e231)，兼掌王室继承事务与[特别仪式区](#idx-e249)管理，院长即[天星首席](#idx-e252)，永久由国王或女王兼任。\"},{\"id\":\"e256\",\"title\":\"行省总督\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)[军团行省](#idx-e237)最高长官，由[军团](#idx-e299)长兼任，任期二十年，每年赴首都[索尔因](#idx-e461)叙职。\"},{\"id\":\"e257\",\"title\":\"叙职大会\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)八位[行省总督](#idx-e256)每年赴[索尔因](#idx-e461)向[凯撒](#idx-e239)当面汇报施政与军务的会议。\"},{\"id\":\"e258\",\"title\":\"血脉测试\",\"aliases\":[],\"body\":\"《[龙裔继嗣法](#idx-e238)》规定的继承资格测试，由[牧首厅](#idx-e170)[圣礼厅](#idx-e177)主持，每代[凯撒](#idx-e239)继承人均须重测。\"},{\"id\":\"e264\",\"title\":\"仲裁所\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)[特贸区](#idx-e522)[管理局](#idx-e236)下属机构，承担特贸区司法职能。\"},{\"id\":\"e268\",\"title\":\"阿索战争\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)与[索拉瑞斯帝国](#idx-e441)之间的三次大规模战争（1290–1292、1351–1356、1479–1483）。\"},{\"id\":\"e269\",\"title\":\"布兰顿和约\",\"aliases\":[],\"body\":\"[第二次阿索战争](#idx-e274)停战和约，以[布兰顿河](#idx-e479)下游为两国新界，[布兰顿](#idx-e478)城割予[索拉瑞斯](#idx-e441)。\"},{\"id\":\"e270\",\"title\":\"布兰顿战役\",\"aliases\":[],\"body\":\"1479年[三战](#idx-e275)前期的一场决定性会战，[阿布丹提亚帝国](#idx-e468)获得战略性胜利。\"},{\"id\":\"e274\",\"title\":\"第二次阿索战争\",\"aliases\":[\"二战\"],\"body\":\"于1351–1356年[索拉瑞斯](#idx-e441)与[阿布丹提亚](#idx-e468)发生的第二次大规模战争，[忒奥西斯](#idx-e499)保持中立。索拉瑞斯获胜，得[西比尔平原](#idx-e508)南部与[布兰顿](#idx-e478)城，停战于《[布兰顿和约](#idx-e269)》；阿布丹提亚放弃[卡帕尼](#idx-e519)群岛，卡帕尼同年独立。\"},{\"id\":\"e275\",\"title\":\"第三次阿索战争\",\"aliases\":[\"三战\"],\"body\":\"于1479–1483年[索拉瑞斯](#idx-e441)与[阿布丹提亚](#idx-e468)发生的第三次大规模战争，阿布丹提亚获胜。停战于《[卡斯特鲁姆和约](#idx-e280)》，索拉瑞斯向阿布丹提亚归还[大运河](#idx-e438)下游东岸两座城市及其周边土地，两国当代边界由此确立。\"},{\"id\":\"e276\",\"title\":\"第一次阿索战争\",\"aliases\":[\"一战\"],\"body\":\"于1290–1292年[索拉瑞斯](#idx-e441)与[阿布丹提亚](#idx-e468)发生的第一次大规模战争，[忒奥西斯](#idx-e499)为索拉瑞斯盟友。索拉瑞斯获胜后与圣领同告东扩，停战于《[文特拉和约](#idx-e288)》；间接促成1295年[教会大分裂](#idx-e164)。\"},{\"id\":\"e278\",\"title\":\"黑暗时代\",\"aliases\":[],\"body\":\"指八世纪[七王约](#idx-e285)瓦解后，西诺拉尼亚地区长达数百年的多国混战时期。\"},{\"id\":\"e280\",\"title\":\"卡斯特鲁姆和约\",\"aliases\":[],\"body\":\"[第三次阿索战争](#idx-e275)停战和约，确立阿索当代边界；[大运河](#idx-e438)下游东岸两城交接至今悬而未决。\"},{\"id\":\"e281\",\"title\":\"林缘议厅\",\"aliases\":[],\"body\":\"1203年[希尔文诺](#idx-e543)[叶络枢机院](#idx-e221)于[冠脊山脉](#idx-e427)屏林脉西南端的隘口所设，是当前大陆唯一公认的中立缔约见证机构。\"},{\"id\":\"e284\",\"title\":\"诺万尼斯大叛乱\",\"aliases\":[],\"body\":\"758年[龙骑士](#idx-e300)群体与[诺万尼斯王国](#idx-e557)结盟发动的叛乱，[索瑞斯战役](#idx-e287)引发大规模[元素枯竭](#idx-e56)。\"},{\"id\":\"e285\",\"title\":\"七王约\",\"aliases\":[],\"body\":\"328年西诺拉尼亚七国建立的松散邦联，存续约四个世纪，八世纪中叶瓦解。\"},{\"id\":\"e287\",\"title\":\"索瑞斯战役\",\"aliases\":[],\"body\":\"[诺万尼斯大叛乱](#idx-e284)中交战双方连续动用大规模[神启魔法](#idx-e5)的会战，直接导致诺万尼斯枯竭。\"},{\"id\":\"e288\",\"title\":\"文特拉和约\",\"aliases\":[],\"body\":\"[第一次阿索战争](#idx-e276)停战和约，[索拉瑞斯](#idx-e441)与[忒奥西斯](#idx-e499)领土东扩。\"},{\"id\":\"e294\",\"title\":\"护教军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)最主要的常规部队，下分五个师，由各[都主教区](#idx-e157)分别组建。\"},{\"id\":\"e296\",\"title\":\"近卫龙骑兵团\",\"aliases\":[\"龙骑兵团\"],\"body\":\"[索拉瑞斯](#idx-e441)以[飞龙](#idx-e297)为坐骑的精锐常规部队，通称龙骑兵团，直属[凯撒](#idx-e239)，约八万头飞龙、五万人编制，跨地形作战能力冠绝大陆。\"},{\"id\":\"e297\",\"title\":\"巨龙眷属\",\"aliases\":[\"飞龙\"],\"body\":\"巨龙与大型野兽的混血飞行亚种，通称飞龙，寿约五百年，是[龙骑兵团](#idx-e296)的坐骑。\"},{\"id\":\"e299\",\"title\":\"军团\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)最高军事编制，与[行省](#idx-e237)一体，下设团、大队、小队。\"},{\"id\":\"e300\",\"title\":\"龙骑士\",\"aliases\":[],\"body\":\"与巨龙缔结[血契](#idx-e50)、得以释放[龙族魔法](#idx-e1)的人类战士，存在[半龙化](#idx-e12)现象。\"},{\"id\":\"e301\",\"title\":\"龙骑士团\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e441)的顶级战力，成员皆与巨龙缔结[血契](#idx-e50)，效忠[凯撒](#idx-e239)本人而非帝国，团内以多数决议事。\"},{\"id\":\"e306\",\"title\":\"圣礼骑士\",\"aliases\":[],\"body\":\"由[大牧首](#idx-e152)册封的[龙骑士](#idx-e300)，席位限一人，承担[圣领](#idx-e499)防卫义务，但编制上仍属[龙骑士团](#idx-e301)。\"},{\"id\":\"e307\",\"title\":\"圣仪军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)[牧首厅](#idx-e170)直属的精锐法术作战部队，大陆规模最大的法术军力，兼承民间大型工程建设。\"},{\"id\":\"e340\",\"title\":\"圣约瑟商会\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)[牧首厅](#idx-e170)直属商会，垄断圣领境内外一切贸易，学界普遍认为兼具情报网络职能。\"},{\"id\":\"e343\",\"title\":\"索利亚商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)商会之一，1489年前后由卡涅·道格拉斯创办，以[星术设备](#idx-e88)半成品与[魔矿](#idx-e74)原料分销起家，后跃居联邦前列。\"},{\"id\":\"e346\",\"title\":\"伊琳娜圣银币\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)流通货币，以高含银量铸造并防伪，与[索拉瑞斯](#idx-e441)铁钞按一比一互认流通。\"},{\"id\":\"e349\",\"title\":\"自由港\",\"aliases\":[],\"body\":\"[特贸区](#idx-e522)所设、享有极高自治权的港口体系，是国际贸易量激增的制度前提。\"},{\"id\":\"e350\",\"title\":\"裁曜日\",\"aliases\":[\"圣伊琳娜日\"],\"body\":\"[通用历](#idx-e373)一周第二日，亦简称星期二；[仪式历](#idx-e366)作圣伊琳娜日，对应天星[仲裁星](#idx-e568)。\"},{\"id\":\"e351\",\"title\":\"大陆历\",\"aliases\":[],\"body\":\"[通用历](#idx-e373)纪年，以[唯一神](#idx-e138)降临传教义于[圣约翰](#idx-e126)之年为元年，元年之前称元前。\"},{\"id\":\"e353\",\"title\":\"虹曜日\",\"aliases\":[\"圣保罗日\"],\"body\":\"[通用历](#idx-e373)一周第四日，亦简称星期四；[仪式历](#idx-e366)作圣保罗日，对应天星[织虹星](#idx-e567)。\"},{\"id\":\"e354\",\"title\":\"降临节\",\"aliases\":[],\"body\":\"[晖醒](#idx-e361)季首日，纪念[唯一神](#idx-e138)降临传道的[正教](#idx-e150)宗教节日，是宗教意义上的新年与全年最大节日。\"},{\"id\":\"e355\",\"title\":\"金素\",\"aliases\":[\"圣献\",\"冕宫月\",\"肆位\"],\"body\":\"一年六季的第四季，各地作物相继采收。[仪式历](#idx-e366)同季作圣献，[艾瑟瑞姆](#idx-e510)[星历](#idx-e376)作冕宫月，[尼希尔](#idx-e536)[萨辛历](#idx-e364)作肆位。\"},{\"id\":\"e356\",\"title\":\"烬曜日\",\"aliases\":[\"圣约瑟日\"],\"body\":\"[通用历](#idx-e373)一周第三日，亦简称星期三；[仪式历](#idx-e366)作圣约瑟日，对应天星[烬铸星](#idx-e552)。\"},{\"id\":\"e357\",\"title\":\"立约节\",\"aliases\":[],\"body\":\"纪念约瑟在大地上首施[神启魔法](#idx-e5)、借予之约显明于世的[正教](#idx-e150)宗教节日，因邻[通用历](#idx-e373)新年常连同庆祝。\"},{\"id\":\"e358\",\"title\":\"凛寒\",\"aliases\":[\"正炼\",\"琴宫月\",\"陆位\"],\"body\":\"一年六季的第六季，山地封路、[凛冰洋](#idx-e432)冰封，大陆整体进入年内节律最为收缩的状态。[仪式历](#idx-e366)同季作正炼，[艾瑟瑞姆](#idx-e510)[星历](#idx-e376)作琴宫月，[尼希尔](#idx-e536)[萨辛历](#idx-e364)作陆位。\"},{\"id\":\"e361\",\"title\":\"启蛰\",\"aliases\":[\"晖醒\",\"天宫月\",\"壹位\"],\"body\":\"一年六季的第一季，[通用历](#idx-e373)岁首所在。[凛冰洋](#idx-e432)浮冰退散、山地封雪消融、两河进入汛期，各地贸易与出行随之重新活跃。[仪式历](#idx-e366)同季作晖醒，[艾瑟瑞姆](#idx-e510)[星历](#idx-e376)作天宫月，[尼希尔](#idx-e536)[萨辛历](#idx-e364)作壹位。\"},{\"id\":\"e363\",\"title\":\"日曜日\",\"aliases\":[\"圣神日\"],\"body\":\"[通用历](#idx-e373)一周第五日，亦简称星期日；[仪式历](#idx-e366)作圣神日，对应天星[冠阳](#idx-e551)，是信众向[唯一神](#idx-e138)礼拜的礼拜日。\"},{\"id\":\"e364\",\"title\":\"萨辛历\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e536)地方历法，以当代伊玛目称号纪年，每代即位则重置元年，六季称[壹位](#idx-e361)至[陆位](#idx-e358)。\"},{\"id\":\"e366\",\"title\":\"圣格里仪式历\",\"aliases\":[\"仪式历\"],\"body\":\"[正教会](#idx-e185)原始历法，[通用历](#idx-e373)前身，[圣领](#idx-e499)与[索拉瑞斯](#idx-e441)的官方历法，六季与五日均保留宗教命名。\"},{\"id\":\"e373\",\"title\":\"通用历\",\"aliases\":[\"格里历\"],\"body\":\"大陆通行的太阳历，一年六季、每季五十日、每旬十日、每周五日；别称格里历，源自[正教会](#idx-e185)的[圣格里仪式历](#idx-e366)，经[公教会](#idx-e159)世俗化后扩散全大陆。\"},{\"id\":\"e376\",\"title\":\"星历\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e510)地方历法，大陆唯一的月亮历，六月之名取自黄道六宫。\"},{\"id\":\"e380\",\"title\":\"叶茂\",\"aliases\":[],\"body\":\"精灵纪年的纪元名，其元年约当[通用历](#idx-e373)二世纪二十年代，来历不明。\"},{\"id\":\"e381\",\"title\":\"月曜日\",\"aliases\":[\"圣约翰日\"],\"body\":\"[通用历](#idx-e373)一周第一日，亦简称星期一；[仪式历](#idx-e366)作圣约翰日，对应天星[汐月](#idx-e563)，是四个劳作日之首。\"},{\"id\":\"e382\",\"title\":\"祝星节\",\"aliases\":[],\"body\":\"纪念保罗于四[元素](#idx-e54)耗尽时借[以太](#idx-e19)显现神迹，仅[公教](#idx-e110)庆祝，[牧首厅](#idx-e170)视公开庆祝为[异端](#idx-e147)之举。\"},{\"id\":\"e383\",\"title\":\"步米\",\"aliases\":[],\"body\":\"长度基本单位，源自[索拉瑞斯](#idx-e441)[军团](#idx-e299)标准行军步伐；一步米等于十分步米等于一百厘步米。\"},{\"id\":\"e390\",\"title\":\"界石\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)[军团](#idx-e299)沿主干道每千步所立的里程标记，亦为[陆里](#idx-e392)之所本。\"},{\"id\":\"e392\",\"title\":\"陆里\",\"aliases\":[],\"body\":\"长度单位，一陆里等于一千[步米](#idx-e383)，源自[军团](#idx-e299)沿主干道每千步立一[界石](#idx-e390)的传统。\"},{\"id\":\"e400\",\"title\":\"星度\",\"aliases\":[],\"body\":\"温度基本单位，源自[王家研究院](#idx-e254)的[魔矿](#idx-e74)[蚀刻](#idx-e79)环境控制需求，以纯水冰点为零、沸点为一百。\"},{\"id\":\"e416\",\"title\":\"落叶精灵\",\"aliases\":[],\"body\":\"已与[圣树](#idx-e219)断开连接（无论主动被动）的精灵统称，离开大森林后即失去[自然魔法](#idx-e9)的施展能力。\"},{\"id\":\"e417\",\"title\":\"神遴者\",\"aliases\":[\"神遴者阶层\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)的[玛阿特](#idx-e195)称量中，心脏与宝石恰成平衡者。宗教解释中，他们身负引导众生的责任，受赐[秘术](#idx-e4)之力转生现世；作为一个阶层，神遴者垄断了酋邦一切政治职位，[教长](#idx-e204)、祭司、部落酋长与长老无一例外皆出于此。\"},{\"id\":\"e418\",\"title\":\"北门湾\",\"aliases\":[],\"body\":\"[凛冰洋](#idx-e432)伸入大陆中部的内湾，位于[忒奥西斯](#idx-e499)北境，是[索菲亚大运河](#idx-e438)的北端入口。[尼希尔](#idx-e536)所产[魔矿](#idx-e74)经凛冰洋航线抵此南下，是当代大陆最重要跨洋贸易干线上的节点。\"},{\"id\":\"e421\",\"title\":\"晨风海\",\"aliases\":[],\"body\":\"大陆东南方海域，洋流自东往西、往北持续输送暖湿气流深入内陆，是[阿布丹提亚大平原](#idx-e469)优良农业气候的关键成因。[马提尼河](#idx-e487)与[波特利亚河](#idx-e477)汇流后注入此海。\"},{\"id\":\"e422\",\"title\":\"大星洋\",\"aliases\":[],\"body\":\"大陆西南侧的宽广海域，洋流复杂多变；其偏暖洋流携湿润气流北上，遇[裂境山脉](#idx-e431)与[冠脊山脉](#idx-e427)抬升成雨，是西诺拉尼亚地区森林的核心水分来源。\"},{\"id\":\"e424\",\"title\":\"翡翠海峡\",\"aliases\":[],\"body\":\"大陆南方水域，全大陆航运最繁忙之处，[卡帕尼](#idx-e519)群岛与大陆本体之间的物流几乎全经于此，亦是[索菲亚大运河](#idx-e438)的南端出口。卡帕尼北部岛链水文条件优越、港口全年可用，是这条贸易干线的天然枢纽。\"},{\"id\":\"e427\",\"title\":\"冠脊山脉\",\"aliases\":[],\"body\":\"大陆规模最大的山脉系统，分背雨、屏林、青嶂、雪源、朝礼、横嶂六脉。山系自西南的雪源脉起向东北延伸，经青嶂脉至三脉交汇处分出屏林脉与朝礼脉；背雨脉横亘于北，横嶂脉自雪源脉东北角东出。[希尔文诺大森林](#idx-e547)由背雨、屏林、青嶂三脉合围而成，[尼希尔酋邦](#idx-e536)的南侧边境则由背雨、雪源两脉围合。\"},{\"id\":\"e431\",\"title\":\"裂境山脉\",\"aliases\":[],\"body\":\"西南-东北走向纵贯[索拉瑞斯](#idx-e441)中部的山脉，是帝国东西地形的核心分界线。其以东为[奥利提斯平原](#idx-e442)，落在其雨影区而气候偏干；以西地势平缓，[镜心湖](#idx-e448)居中。山脉沿线铁铜矿藏富集，是大陆冶铁产业最重要的原料来源；[索尔河](#idx-e460)发源于其南麓。\"},{\"id\":\"e432\",\"title\":\"凛冰洋\",\"aliases\":[],\"body\":\"大陆北方极寒洋，以东西向洋流为主，北部与东部全年有浮冰，渔业与运输活动仅集中于中西部海域；[尼希尔](#idx-e536)[魔矿](#idx-e74)出口的主干路线即自酋邦出海口北上进入此洋，东行抵[北门湾](#idx-e418)后南下入[大运河](#idx-e438)。\"},{\"id\":\"e438\",\"title\":\"索菲亚大运河\",\"aliases\":[\"大运河\"],\"body\":\"[忒奥西斯](#idx-e499)与[索拉瑞斯](#idx-e441)联合开凿的人工水道，1381–1388年历时七年建成，以[圣仪军](#idx-e307)的[神启魔法](#idx-e5)为主力，是[大陆历](#idx-e351)史上最庞大的人造工程。自[北门湾](#idx-e418)几乎垂直向南贯穿[西比尔平原](#idx-e508)，南端注入[翡翠海峡](#idx-e424)，将[凛冰洋](#idx-e432)与翡翠海峡物理贯通，从根本上重塑了大陆南北贸易格局。\"},{\"id\":\"e440\",\"title\":\"终末碑座\",\"aliases\":[\"诺万尼斯平原\"],\"body\":\"[索拉瑞斯](#idx-e441)东南部平原，原为黑暗时期[诺万尼斯王国](#idx-e557)故地。[大陆历](#idx-e351)758年[诺万尼斯大叛乱](#idx-e284)的[索瑞斯战役](#idx-e287)中，交战双方连续动用大规模[神启魔法](#idx-e5)引发[元素枯竭](#idx-e56)，平原自此化为死地，七百余年未见任何恢复迹象。索拉瑞斯、[忒奥西斯](#idx-e499)与[艾瑟瑞姆](#idx-e510)三国均划其为禁入区。该地区也是[诺万尼斯流放](#idx-e171)的行刑地。\"},{\"id\":\"e441\",\"title\":\"索拉瑞斯帝国\",\"aliases\":[\"索拉瑞斯\"],\"body\":\"位于大陆中西部的军事集权帝制大国，首都[索尔因维克图斯](#idx-e461)。1159年[索拉尔王国](#idx-e560)国王[阿利昂](#idx-e240)统一西大陆诸国、受牧首册封为首代[龙裔凯撒](#idx-e239)而立国。国土一千一百二十万平方[陆里](#idx-e392)，划为八个[军团行省](#idx-e237)，逾七成为群山与原始森林，人口约四千二百万。以[军团](#idx-e299)—行省一体化制度与[龙骑兵团](#idx-e296)著称，尊[正教](#idx-e150)为国教，逾八成公民为正教信徒；外交强势，与[阿布丹提亚](#idx-e468)共构当代大陆两极。\"},{\"id\":\"e442\",\"title\":\"奥利提斯平原\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)境内[裂境山脉](#idx-e431)以东呈东北—西南走向的狭长平原，是帝国最主要的农业区与人口集中地之一，首都[索尔因维克图斯](#idx-e461)位于其西南角。因落在裂境山脉雨影区，气候较[镜心湖](#idx-e448)区偏干。\"},{\"id\":\"e448\",\"title\":\"镜心湖\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)西部的湖泊，是帝国最重要的农业产区核心与人口最密集的区域之一。受[大星洋](#idx-e422)暖流直接调节，湖体又进一步平抑温差，是帝国内气候最温和宜居的地带。[纳赫尔河](#idx-e539)发源于此；东岸最大城市为[雷克西姆](#idx-e453)。\"},{\"id\":\"e449\",\"title\":\"镜心湖行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)八个[军团行省](#idx-e237)之一，位于帝国西部，环[镜心湖](#idx-e448)而设，首府[雷克西姆](#idx-e453)。\"},{\"id\":\"e453\",\"title\":\"雷克西姆\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)[镜心湖行省](#idx-e449)首府，[镜心湖](#idx-e448)东岸最大城市，建有[圣保罗](#idx-e122)大教堂。堂中无[圣骸](#idx-e123)，仅供奉据称是保罗生前所披的斗篷——保罗殉道之处据《保罗福音》末章推测邻近镜心湖，[正教会](#idx-e185)因此在雷克西姆建立大教堂。\"},{\"id\":\"e460\",\"title\":\"索尔河\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)境内河流。发源于[裂境山脉](#idx-e431)南麓，流经首都[索尔因维克图斯](#idx-e461)后向东南注入[艾瑟瑞姆](#idx-e510)境内的[坠星湖](#idx-e518)，是帝国重要的内河水系。\"},{\"id\":\"e461\",\"title\":\"索尔因维克图斯\",\"aliases\":[\"索尔因\"],\"body\":\"[索拉瑞斯帝国](#idx-e441)首都，通称索尔因，位于[奥利提斯平原](#idx-e442)西南角，[索尔河](#idx-e460)流经其间。是帝国的政治军事中心与最大城市，八位[行省总督](#idx-e256)每年赴此参加[叙职大会](#idx-e257)；城南设有[龙骑士团](#idx-e301)驻地与飞场。\"},{\"id\":\"e468\",\"title\":\"阿布丹提亚帝国\",\"aliases\":[\"阿布丹提亚\",\"丹提亚帝国\"],\"body\":\"通称丹提亚帝国，位于大陆东南方大平原的君主立宪制大国，首都[维里迪亚](#idx-e496)。386年卡立曼·费内尔统一大平原诸国建立帝政，费内尔家族统治延续至今；两次[阿索战争](#idx-e268)失利后于1393年建[三柱议会](#idx-e245)，和平演变为君主立宪制国家。国土八百七十万平方[陆里](#idx-e392)，划为五个[帝政省](#idx-e233)和一个直辖省，人口逾六千二百万，为全大陆最多。大陆第一大粮食出口国与政治东极，约七成人口信奉[公教](#idx-e110)。\"},{\"id\":\"e469\",\"title\":\"阿布丹提亚大平原\",\"aliases\":[\"丹提亚大平原\"],\"body\":\"[阿布丹提亚帝国](#idx-e468)国土主体，大陆东部平原带规模最大的一部分，为全大陆最集中的农业核心地带。地势平坦开阔，水系极为发达，冲积土壤肥沃；中部核心区无霜期长而几无结冻，是帝国粮食、棉花与人口的集中所在，首都[维里迪亚](#idx-e496)居其腹地。\"},{\"id\":\"e475\",\"title\":\"波马里亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)境内位于[润溪湖](#idx-e490)西南方的重要城市。是大陆东部已知[元素](#idx-e54)丰度最高的城市之一，天然宜居且对元素[疏化](#idx-e39)抵抗力强。历史上曾为[正教会](#idx-e185)在东诺拉尼亚最重要的宗教驻地，[教会大分裂](#idx-e164)后成为[公教总会](#idx-e161)所在地；[公教会](#idx-e159)于十四世纪宣称寻得的[圣保罗](#idx-e122)[圣骸](#idx-e123)即供奉于波马里亚大教堂。该城亦是波马里亚[公爵领](#idx-e235)首府，同名[帝政省](#idx-e233)的省名即出于此。\"},{\"id\":\"e477\",\"title\":\"波特利亚河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)境内的主要河流之一，发源自[葛林沃尔克](#idx-e544)南脉南麓，与[马提尼河](#idx-e487)于大平原中部汇流后注入[晨风海](#idx-e421)，两河交汇处即首都[维里迪亚](#idx-e496)所在。\"},{\"id\":\"e478\",\"title\":\"布兰顿\",\"aliases\":[],\"body\":\"[布兰顿河](#idx-e479)东岸城市，位于河流中游。[第二次阿索战争](#idx-e274)后依《[布兰顿和约](#idx-e269)》割予[索拉瑞斯](#idx-e441)，此后一百二十余年是帝国边境最靠东的据点。1479年[三战](#idx-e275)开战之初为[阿布丹提亚](#idx-e468)夺取，此后终战未再易手，现归属于阿布丹提亚。\"},{\"id\":\"e479\",\"title\":\"布兰顿河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)境内河流。自北向南流经[西比尔平原](#idx-e508)东南缘，中段接纳一条自西而来的支流后折向东南，于[法拉利亚](#idx-e481)一带入海；[第二次阿索战争](#idx-e274)后其下游为阿索两国界河，《[布兰顿和约](#idx-e269)》即以此河命名，1479年[布兰顿战役](#idx-e270)的战场亦在其中下游两岸。\"},{\"id\":\"e481\",\"title\":\"法拉利亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)境内，[布兰顿河](#idx-e479)入[翡翠海峡](#idx-e424)河口处的港镇。\"},{\"id\":\"e487\",\"title\":\"马提尼河\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)第一大河，发源于[穗满湖](#idx-e493)，向东南流经大平原后与[波特利亚河](#idx-e477)汇流注入[晨风海](#idx-e421)，两河交汇处即首都[维里迪亚](#idx-e496)所在。\"},{\"id\":\"e490\",\"title\":\"润溪湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)双湖之东者，与[穗满湖](#idx-e493)并称双湖，是帝国北部水系的重要源头。湖运承担北部矿区矿产向核心区的输送；西南方为[元素丰地](#idx-e55)城市[波马里亚](#idx-e475)。\"},{\"id\":\"e493\",\"title\":\"穗满湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)双湖之西者，与[润溪湖](#idx-e490)并称双湖。湖区周边水草丰美，是全大陆最集中的规模化牧区；[马提尼河](#idx-e487)发源于此。\"},{\"id\":\"e496\",\"title\":\"维里迪亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)首都，位于[马提尼河](#idx-e487)与[波特利亚河](#idx-e477)交汇处、[丹提亚大平原](#idx-e469)腹地，是帝国政治文化中心，也是帝国最重要的内河航运枢纽之一。城市内歌剧院与画廊林立，素有\\\"艺术之都\\\"之称。\"},{\"id\":\"e497\",\"title\":\"维里迪亚直辖省\",\"aliases\":[\"首都直辖省\"],\"body\":\"[阿布丹提亚帝国](#idx-e468)六个一级行政区中唯一由皇室直辖者，亦称首都直辖省，位于帝国西南，含首都[维里迪亚](#idx-e496)及周边；境内不设贵族封地与[帝政省](#idx-e233)政府，是该国唯一的直辖省。\"},{\"id\":\"e499\",\"title\":\"忒奥西斯圣治领\",\"aliases\":[\"忒奥西斯\",\"圣治领\",\"圣领\"],\"body\":\"位于大陆中央北部的[正教会](#idx-e185)神权共和国，通称圣治领或圣领，首都[圣城索菲亚](#idx-e503)。1159年[索拉瑞斯](#idx-e441)开国[凯撒](#idx-e239)[阿利昂](#idx-e240)将帝国东部领土捐献给[大牧首](#idx-e152)而立，是正教会取得世俗领地后的政治实体。国土两百三十万平方[陆里](#idx-e392)，划为五个[都主教区](#idx-e157)，人口一千三百万。大牧首兼国家元首，[牧首厅](#idx-e170)为最高行政机构。\"},{\"id\":\"e501\",\"title\":\"潘克拉托\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)境内城市，[圣约翰都主教区](#idx-e505)的都教座城。[圣约翰](#idx-e126)殉道之地，[圣骸](#idx-e123)存于圣约翰大教堂。\"},{\"id\":\"e503\",\"title\":\"圣城索菲亚\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)圣领首都，[大牧首](#idx-e152)及[牧首厅](#idx-e170)所在地。相传为[唯一神](#idx-e138)降临之处，本为小村，圣领建立及[大运河](#idx-e438)开通后扩张为兼具政治、宗教与经济中心地位的大都会。是大陆中部已知最大的[元素丰地](#idx-e55)，也是[正教会](#idx-e185)立都于此的重要自然前提；索菲亚大教堂藏有据称是[圣约翰](#idx-e126)升天时所钉[十字架](#idx-e130)的原木碎片。\"},{\"id\":\"e505\",\"title\":\"圣约翰都主教区\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)圣领西南部[都主教区](#idx-e157)，以四[使徒](#idx-e129)之首[圣约翰](#idx-e126)命名，辖存有圣约翰[圣骸](#idx-e123)的[潘克拉托](#idx-e501)等地。\"},{\"id\":\"e508\",\"title\":\"西比尔平原\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)圣领所在的温带半干旱草原，地势平坦、天然水源匮乏，[索菲亚大运河](#idx-e438)贯通前农业条件相当有限；北延至[北门湾](#idx-e418)，是大陆南北贸易的关键咽喉。其南部于[二战](#idx-e274)后尽归[索拉瑞斯](#idx-e441)，后为索菲亚大运河纵切为二；运河以东的土地依[三战](#idx-e275)《[卡斯特鲁姆和约](#idx-e280)》归[阿布丹提亚](#idx-e468)，交接至今悬置，是阿索两国博弈的核心争议。\"},{\"id\":\"e510\",\"title\":\"艾瑟瑞姆王国\",\"aliases\":[\"艾瑟瑞姆\"],\"body\":\"位于大陆西南部的封建君主制国家，首都[阿斯托利亚](#idx-e511)，领土环抱[坠星湖](#idx-e518)。源出西诺拉尼亚黑暗时期南下避难的[星术](#idx-e8)学者聚落，十一世纪末[塔利瑞安](#idx-e223)联合十二城邦创建[大星术研究院](#idx-e231)，十三世纪前叶塔利兰娜受推举加冕为初代女王。国土约四百二十万平方[陆里](#idx-e392)，由[王冠领地](#idx-e253)、四大伯爵封邑与[特别仪式区](#idx-e249)构成，人口约一千八百万。以星术立国，[王家研究院](#idx-e254)[天星首席](#idx-e252)永由君主兼任，传统意义的[施法者](#idx-e38)占人口逾半。\"},{\"id\":\"e511\",\"title\":\"阿斯托利亚\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e510)首都，位于[坠星湖](#idx-e518)南端[瑟蒂尔河](#idx-e515)出湖处，由[大陆历](#idx-e351)894年南下避难的[星术](#idx-e8)学者聚落发展而成，[王家研究院](#idx-e254)即设于此。城名源出[星空学派](#idx-e7)早期所用的 Astralis（\\\"属星的\\\"），后世音变作 Astoria，旧拼法今仅见于研究院的仪式文书。\"},{\"id\":\"e515\",\"title\":\"瑟蒂尔河\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e510)境内河流。由[坠星湖](#idx-e518)南端出发，向南流经艾瑟瑞姆注入[大星洋](#idx-e422)，首都[阿斯托利亚](#idx-e511)位于其北端出湖处。\"},{\"id\":\"e517\",\"title\":\"韦里泰尔\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e510)[特别仪式区](#idx-e249)内的最大城市，[星轨蚀刻](#idx-e79)总所所在地，统筹协调全区的[星术设备](#idx-e88)生产。\"},{\"id\":\"e518\",\"title\":\"坠星湖\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e510)的地理中心，首都[阿斯托利亚](#idx-e511)位于其南端出湖口。[索尔河](#idx-e460)自[索拉瑞斯](#idx-e441)方向注入湖北端，[瑟蒂尔河](#idx-e515)由南端流出南向[大星洋](#idx-e422)；湖运依托[星术](#idx-e8)船只，是沿岸城市群最重要的内部贸易路线。\"},{\"id\":\"e519\",\"title\":\"卡帕尼诸公联合\",\"aliases\":[\"卡帕尼\",\"卡帕尼联邦\"],\"body\":\"又称卡帕尼联邦，位于大陆南部群岛的公国联邦制国家，由四成员公国与[北部特别贸易区](#idx-e522)组成，四公国各有首府，联邦首都为[阿卡帕尼](#idx-e520)公国的[伊索拉韦尔德](#idx-e534)。1356年[第二次阿索战争](#idx-e274)后，四公爵于[米德可尔](#idx-e530)会晤宣布脱离[阿布丹提亚](#idx-e468)独立。国土约二百五十万平方[陆里](#idx-e392)，散布于七十八座岛屿，人口约九百八十万。联邦以商贸与金融立国，外交奉行离岸平衡，热带群岛旅游业亦非常发达。\"},{\"id\":\"e520\",\"title\":\"阿卡帕尼\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)四公国之一，由同名公爵世袭领有，核心领地为[阿卡帕尼岛](#idx-e521)，首府[伊索拉韦尔德](#idx-e534)亦为联邦首都。\"},{\"id\":\"e521\",\"title\":\"阿卡帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)群岛南部主岛区的核心岛屿之一，与[梅尔帕尼岛](#idx-e528)合计聚居全联邦逾半人口。\"},{\"id\":\"e522\",\"title\":\"北部特别贸易区\",\"aliases\":[\"特贸区\",\"北部特贸区\"],\"body\":\"[卡帕尼联邦](#idx-e519)于1382年于群岛北部岛链设立的特别经济区，由五十八座岛屿及[泽卡](#idx-e535)、[法纳莱](#idx-e524)等[自由港](#idx-e349)城组成，适用独立的[特区商法典](#idx-e250)与优惠贸易税率，设[管理局](#idx-e236)与[仲裁所](#idx-e264)自治，是大陆各国商人自由开展贸易的核心地带，也是联邦金融机构最密集之处。\"},{\"id\":\"e524\",\"title\":\"法纳莱\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)[北部特别贸易区](#idx-e522)的[自由港](#idx-e349)城之一，位于[翡翠海峡](#idx-e424)南缘的北部岛链。\"},{\"id\":\"e528\",\"title\":\"梅尔帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)群岛南部主岛区的核心岛屿之一，与[阿卡帕尼岛](#idx-e521)合计聚居全联邦逾半人口。\"},{\"id\":\"e530\",\"title\":\"米德可尔\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)境内地名。1356年[第二次阿索战争](#idx-e274)后，卡帕尼四公爵于此会晤宣布建立诸公联合，是联邦独立的历史象征地点。\"},{\"id\":\"e534\",\"title\":\"伊索拉韦尔德\",\"aliases\":[\"伊索拉\"],\"body\":\"[卡帕尼诸公联合](#idx-e519)首都，通称伊索拉，同时是[阿卡帕尼](#idx-e520)公国首府，四公国的政治核心所在地。当地作坊以镀银工艺见长，[索利亚商会](#idx-e343)创办于此。\"},{\"id\":\"e535\",\"title\":\"泽卡\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)[北部特别贸易区](#idx-e522)的[自由港](#idx-e349)城之一，位于[翡翠海峡](#idx-e424)南缘的北部岛链。\"},{\"id\":\"e536\",\"title\":\"尼希尔伊玛目酋邦\",\"aliases\":[\"尼希尔\",\"尼希尔酋邦\"],\"body\":\"通称尼希尔酋邦，位于大陆西北角沙漠绿洲与两河流域的神权部落联邦国家，首都[阿尔努尔](#idx-e537)。五世纪[萨阿尔血王朝](#idx-e558)覆灭后，诸部酋长于阿尔努尔会盟，推举诸神大祭司为[伊玛目教长](#idx-e204)，成立酋邦。尼希尔国土五百八十万平方[陆里](#idx-e392)，由[诸神圣土](#idx-e207)与八部落领地构成，人口约一千八百万。酋邦是当今大陆唯一合法保有奴隶制的国家，社会等级高度固化。\"},{\"id\":\"e537\",\"title\":\"阿尔努尔\",\"aliases\":[],\"body\":\"[尼希尔伊玛目酋邦](#idx-e536)首都兼伊玛目城，位于两河流域核心地带，属[教长](#idx-e204)直辖的[诸神圣土](#idx-e207)。422年诸部酋长于此会盟建立部落联邦体制、推举首任伊玛目教长；城中六神各有神庙，另有教长主持全酋邦最隆重仪典的[大神庙](#idx-e190)，[酋长会议](#idx-e244)亦每年在此召开。\"},{\"id\":\"e538\",\"title\":\"哈亚特河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e536)两河之东河，发源于[冠脊山脉](#idx-e427)雪源脉北麓的积雪融水，自南向北流经酋邦西部，于[塔巴特](#idx-e542)与[纳赫尔河](#idx-e539)交汇后入[凛冰洋](#idx-e432)。其洪汛带来上游冲积土并补充土壤水分，随洪水消退而展开的播种是全酋邦农业的年度起点。\"},{\"id\":\"e539\",\"title\":\"纳赫尔河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e536)两河之西河，发源于[索拉瑞斯](#idx-e441)境内的[镜心湖](#idx-e448)，自南向北流经酋邦西部，于[塔巴特](#idx-e542)与[哈亚特河](#idx-e538)交汇。因源头在索拉瑞斯境内，[诸神信仰](#idx-e196)第一季的西祭典历来只能在靠近南边境的城市勉强举行，这也是尼索边境关系长期恶劣的原因之一。\"},{\"id\":\"e540\",\"title\":\"沙阿万大魔矿\",\"aliases\":[\"大魔矿\"],\"body\":\"位于[尼希尔](#idx-e536)东部沙阿万沙漠地下，全大陆最大的单一[魔矿](#idx-e74)产地，年产量占大陆总量逾半，[高品级魔矿](#idx-e68)更占大陆产出八成以上，几乎构成事实垄断。矿井多由[神遴者](#idx-e417)以[秘术](#idx-e4)开凿，此后的采掘、支护、排水与转运则由奴隶以常规工具承担。各国对尼希尔的结构性经济依赖即根源于此。\"},{\"id\":\"e541\",\"title\":\"沙阿万大沙漠\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e536)东部广袤沙漠，是大陆最严酷的干旱地带，地表资源匮乏，昼夜温差可超三十[星度](#idx-e400)，仅有[冠脊山脉](#idx-e427)背雨脉北麓发源的两条小型沙漠河流维系着若干绿洲；地下则蕴藏[沙阿万大魔矿](#idx-e540)。\"},{\"id\":\"e542\",\"title\":\"塔巴特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e536)西部[纳赫尔河](#idx-e539)与[哈亚特河](#idx-e538)的交汇处，是两河流域的重要节点，两河在此汇合后继续北行入[凛冰洋](#idx-e432)。\"},{\"id\":\"e543\",\"title\":\"希尔文诺\",\"aliases\":[],\"body\":\"大陆精灵族裔及其文明与家园的统称，位于[冠脊山脉](#idx-e427)间的封闭盆地，由二十余个[氏族](#idx-e216)部落构成，最大聚落为[大圣树](#idx-e219)所在的[希尔文尼亚](#idx-e546)。其实际控制面积以大森林为界约一百二十万平方[陆里](#idx-e392)，人口一般认为不超过一百万。制度植根于大圣树信仰，每三十年召开[万叶庭](#idx-e218)全体表决，[叶络枢机院](#idx-e221)理日常行政与对外事务。1132年与人类首次接触，此后长期保持中立与封闭，被各国视为大陆事务的天然缓冲区与仲裁者。\"},{\"id\":\"e544\",\"title\":\"葛林沃尔克\",\"aliases\":[],\"body\":\"大陆东北角地区，由南北两支山脉夹峙高山密林构成，北部为雪原冰川。是大陆地理信息最匮乏的区域，据传其可能存在智慧种族与独立的[魔法](#idx-e3)体系，但学界均无可靠资料。\"},{\"id\":\"e546\",\"title\":\"希尔文尼亚\",\"aliases\":[],\"body\":\"[希尔文诺大圣树](#idx-e219)所在之地，精灵族规模最大的聚居点，[万叶庭](#idx-e218)与[叶络枢机院](#idx-e221)所在。据推测是大陆最优越的[元素丰地](#idx-e55)之一。\"},{\"id\":\"e547\",\"title\":\"希尔文诺大森林\",\"aliases\":[],\"body\":\"精灵族世代定居之地，坐落于[冠脊山脉](#idx-e427)背雨、屏林、青嶂三脉合围而成的山间盆地，是大陆封闭程度最高的区域之一，实际控制面积约一百二十万平方[陆里](#idx-e392)。三脉合围造就封闭湿润的气候，孕育大量大陆其他地区所没有的特有动植物；盆地开口朝向东南，屏林脉西南端的天然隘口是[林缘议厅](#idx-e281)所在地。\"},{\"id\":\"e551\",\"title\":\"冠阳\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之首，[星空学派](#idx-e7)完整名\\\"主序·冠阳\\\"，即太阳。[源星](#idx-e59)属权威、创造与审判；[正教](#idx-e150)神学中象征[唯一神](#idx-e138)，对应[仪式历](#idx-e366)[圣神日](#idx-e363)与[通用历](#idx-e373)日曜日。\"},{\"id\":\"e552\",\"title\":\"烬铸星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"熔炉·烬铸星\\\"。[源星](#idx-e59)属转化、破坏与锻造，常被视为天球之上的锻造炉象征；[正教](#idx-e150)神学上象征[圣约瑟](#idx-e127)，对应[烬曜日](#idx-e356)。\"},{\"id\":\"e557\",\"title\":\"诺万尼斯王国\",\"aliases\":[],\"body\":\"西诺拉尼亚[七王约](#idx-e285)时期存在的王国政权。八世纪该王国与[龙骑士](#idx-e300)群体结盟发动叛乱、试图驱逐[正教会](#idx-e185)势力并统一七王邦联。758年[索瑞斯战役](#idx-e287)中交战双方滥用[神启魔法](#idx-e5)引发[元素枯竭](#idx-e56)，王国所在[诺万尼斯平原](#idx-e440)永久化为死地，即今终末碑座地区。\"},{\"id\":\"e558\",\"title\":\"萨阿尔血王朝\",\"aliases\":[],\"body\":\"古代[尼希尔](#idx-e536)地区存在的政权，由掌握[秘术](#idx-e4)的萨阿尔部落于[大陆历](#idx-e351)元前二世纪建立。该部自[沙阿万大沙漠](#idx-e541)西侵，用八年统一西尼希尔诸部，王朝延续至五世纪。其以自身信仰强行替代西尼希尔原有神话体系，奠定了尼希尔日后的[诸神信仰](#idx-e196)与政教结构。史籍普遍估算，王朝治下因屠杀或献祭而死者逾四百万。该王朝在五世纪大起义中覆灭，但其制度主体却被422年的[阿尔努尔](#idx-e537)会盟所承袭。\"},{\"id\":\"e560\",\"title\":\"索拉尔王国\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e441)的前身，于西诺拉尼亚[黑暗时代](#idx-e278)中崛起的王国。1159年，索拉尔国王[阿利昂](#idx-e240)统一西大陆诸国、受牧首册封为首位[龙裔凯撒](#idx-e239)，索拉瑞斯帝国由此建立。现代通用度量衡的长度单位[步米](#idx-e383)与[陆里](#idx-e392)即源自索拉尔王国的[军团](#idx-e299)行军传统。\"},{\"id\":\"e563\",\"title\":\"汐月\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"银杯·汐月\\\"，即月亮。[源星](#idx-e59)属容纳、精神与教导；[正教](#idx-e150)神学上象征[圣约翰](#idx-e126)，对应[月曜日](#idx-e381)。[艾瑟瑞姆](#idx-e510)[星历](#idx-e376)即以其盈亏循环为月。\"},{\"id\":\"e567\",\"title\":\"织虹星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"脉生·织虹星\\\"。[源星](#idx-e59)属修复、治疗与幻象；[正教](#idx-e150)神学上象征[圣保罗](#idx-e122)，对应[虹曜日](#idx-e353)。\"},{\"id\":\"e568\",\"title\":\"仲裁星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"律令·仲裁星\\\"，是星空中最亮且运动最明显的三颗星体之一。[源星](#idx-e59)属秩序、守护与契约；[正教](#idx-e150)神学上象征[圣伊琳娜](#idx-e125)，对应[裁曜日](#idx-e350)。\"}]}}]}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/Nurania/next/static/chunks/ff1a16fafef87110.js\",\"/Nurania/next/static/chunks/0bd6498bda341889.js\"],\"IconMark\"]\nc:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"宗教概述 | The Religions\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"诺拉尼亚大陆现存三套主要的信仰体系：流播最广的唯一神信仰、封闭于西北一隅的尼希尔诸神信仰，以及希尔文诺精灵族的圣树信仰。三者各自独立，神学旨趣、组织形态与历史渊源各异，唯一的共同点或许在于，每一套信仰都与一支魔法体系深度绑定——唯一神信仰之…\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"宗教概述 | The Religions\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"诺拉尼亚大陆现存三套主要的信仰体系：流播最广的唯一神信仰、封闭于西北一隅的尼希尔诸神信仰，以及希尔文诺精灵族的圣树信仰。三者各自独立，神学旨趣、组织形态与历史渊源各异，唯一的共同点或许在于，每一套信仰都与一支魔法体系深度绑定——唯一神信仰之…\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:image\",\"content\":\"https://finzhang.space/Nurania/compendium/book_cover.webp\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:type\",\"content\":\"article\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"宗教概述 | The Religions\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"诺拉尼亚大陆现存三套主要的信仰体系：流播最广的唯一神信仰、封闭于西北一隅的尼希尔诸神信仰，以及希尔文诺精灵族的圣树信仰。三者各自独立，神学旨趣、组织形态与历史渊源各异，唯一的共同点或许在于，每一套信仰都与一支魔法体系深度绑定——唯一神信仰之…\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:image\",\"content\":\"https://finzhang.space/Nurania/compendium/book_cover.webp\"}],[\"$\",\"link\",\"10\",{\"rel\":\"icon\",\"href\":\"/Nurania/icon.svg?icon.986a92ce.svg\",\"sizes\":\"any\
