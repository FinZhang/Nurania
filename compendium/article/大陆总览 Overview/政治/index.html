",\"$Ld\",null,{\"children\":[\"$\",\"$2\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"10:I[53360,[\"/Nurania/next/static/chunks/27ac9b8ec347c021.js\",\"/Nurania/next/static/chunks/3548cb099ad61741.js\",\"/Nurania/next/static/chunks/59ec9ede302cbce9.js\",\"/Nurania/next/static/chunks/088430588bf85aac.js\"],\"default\"]\n11:T7c81,"])</script><script>self.__next_f.push([1,"\n诺拉尼亚大陆当代政治格局可概括为两强对峙、三柱支撑、一隅暗涌。[阿布丹提亚帝国](#idx-e452)与[索拉瑞斯帝国](#idx-e429)作为大陆东西两极，自[卡斯特鲁姆和约](#idx-e275)签署以来维持了二十年的大体和平；[尼希尔](#idx-e517)的[沙阿万大魔矿](#idx-e521)、[卡帕尼](#idx-e502)的贸易金融网络、艾瑟瑞姆的[星术](#idx-e7)技术垄断构成大陆经济运行的三根支柱，也以各自的方式塑造了所在国的国际位置；与此同时，[圣领](#idx-e483)与索拉瑞斯互为人质的同盟关系、[希尔文诺](#idx-e524)内部松动的迹象、[龙骑士团](#idx-e296)与[凯撒](#idx-e234)之间的隐性裂痕，预示着新一轮变局的临近。\n\n### 政体光谱\n\n大陆已知现存政治实体共七个：人类六国以及希尔文诺精灵族裔领地，形态各异，几乎涵盖了已知的所有主要政体类型。横向对照之下，最具分析价值的不是政体本身的形式，而是其合法性的来源。按合法性来源划分，大陆政体可大致归为五类。\n\n**血脉合法性**以索拉瑞斯帝国与[艾瑟瑞姆王国](#idx-e494)为代表。索拉瑞斯皇位继承依《[龙裔继嗣法](#idx-e233)》行事，凯撒之所以是凯撒，是因为其龙血浓度达标——[血脉测试](#idx-e253)由[牧首厅](#idx-e166)主持，是教会与皇室共同维系的制度。艾瑟瑞姆的王位继承同样建立在血脉之上，但同时也看重学术能力的代际传承：王室成员须为杰出的星术[施法者](#idx-e36)或理论学者，否则自动失去继承权。两国看似都系于血脉，但内涵截然不同，索拉瑞斯是生物性血脉的容器，艾瑟瑞姆则是学术血脉的载体。\n\n**神授合法性**以忒奥西斯圣领与尼希尔伊玛目酋邦为代表，两者均为神权政体，政治资格与宗教身份重合。圣领[大牧首](#idx-e148)由[枢机主教团](#idx-e174)闭门选出，制度上保留了共和成分；尼希尔[教长](#idx-e199)则以[秘术](#idx-e3)密封诏书的方式委任下一任，整个过程被视为最重要的宗教仪式之一，外部完全无从介入。两国统治阶层均以宗教身份兼任政治职务，圣领的[都主教](#idx-e152)、主教、[司祭](#idx-e176)悉数为神职人员，尼希尔的教长、祭司、酋长、长老无一例外皆为[神遴者](#idx-e412)。\n\n**契约合法性**以阿布丹提亚帝国为代表。1393 年[三柱议会](#idx-e240)的成立标志着帝国从纯粹的世袭君主制演变为君主立宪制，皇室、贵族与魔法阶级三方以宪政契约形式共享立法与财政权力。这是大陆唯一通过制度演变，而非革命或外力强加完成政体转型的国家。皇帝的合法性由费内尔家族近一千二百年的不间断传承承担，议会的合法性则由三柱代表的常规推选过程承担，两者共同构成帝国政治权威的双轨基础。\n\n**财富合法性**以卡帕尼诸公联合为代表。表面上看，联邦由四公国构成，公爵世袭、政体名义为公国联邦；实质上，独立以来联邦已完成向商业寡头联合体的政治转型。四公爵同时担任[四大商会](#idx-e336)主席，公爵之位以年龄顺位传承，公爵权威与商业地位互相加固。这是大陆唯一以财富积累作为政治合法性来源的国家，一个公爵之所以是公爵，部分原因在于属于他的巨额商会财富。\n\n**生态合法性**则以希尔文诺为代表，与人类各国政体差异较大。精灵族的政治权威建立在[圣树契约](#idx-e34)之上，[万叶庭](#idx-e213)每三十年召开一次，全体精灵借[圣树魔法](#idx-e8)旁听并投票表决，[叶络枢机院](#idx-e216)由万叶庭轮选产生，承担日常行政与对外事务。这套体系是宗教、生态与民主决策的混合形态：[圣树](#idx-e214)是其权威的源头，万叶庭是其决策的方式，叶络枢机院是其行政的执行者。人类学界对这套体系内部的实际权力分布所知有限，但可以确定的是，圣树本身——无论作为信仰对象还是政治权威源头——的地位均高于任何具体的精灵族个体。\n\n笔者注：阿布丹提亚的契约合法性来之不易。它是 1290 至 1393 年间，帝国在两次[阿索战争](#idx-e263)惨败、[教会大分裂](#idx-e160)、贵族与新兴魔法阶层话语权增长的多重冲击下被迫探索出的妥协方案。换句话说，所谓宪政演变，本质上是一张对延绵百年的政治危机与自救的最终处方。只是从结果来看，它的确将一个屡战屡败的帝国带入了黄金时代，并最终让阿布丹提亚在[第三次阿索战争](#idx-e270)中实现复仇。\n\n### 当代国际格局\n\n大陆当代国际格局由三层结构叠加构成：阿索两国构成的政治两极、由经济资源所支撑的三大支柱、以及围绕两极与支柱的缓冲圈层。[索菲亚大运河](#idx-e427)作为贯穿这一格局的物理节点，则提供了一个比上述三层都更敏感的地缘观察窗口。\n\n#### 两极对峙\n\n阿布丹提亚帝国与索拉瑞斯帝国作为大陆东西两极，是诺拉尼亚政治格局的主轴。两国自十三世纪末至十五世纪后叶发动了三次大规模战争，反复争夺大陆中部的农耕地与运河流域。第三次阿索战争以索拉瑞斯战败、阿布丹提亚收复部分十三世纪失地告终，《卡斯特鲁姆和约》确立了当代两国边界。然而和约中归还阿布丹提亚的大运河下游东岸两城，至本文撰写时仍未完成行政交接，索拉瑞斯在事实上依旧管辖入海段。\n\n阿布丹提亚的内政由两条主线驱动。一是现任皇帝卡立曼七世与三柱议会的权力角逐——皇帝意图收回更多权柄、议会内贵族与魔法两柱坚决抵制；二是议会内贵族与魔法阶层借[农用星术设备](#idx-e72)推行的[圈地运动](#idx-e281)，使大量农奴失去土地、流向海岛对岸的卡帕尼。两条主线在表面上看似互不相干，但其物质基础是同一的。皇帝对议会的不满，相当一部分原因在于议会代表的内政立场（圈地、对卡贸易开放）正在为他制造一个难以单独解决的外交问题。\n\n索拉瑞斯的处境则更为复杂。雷尔金二世登基三十余年来以稳健治国著称，但帝国内部由三十年继承内战所遗留的合法性问题至今未能消解。扩军备战与对外强硬是缓解内部张力的常见路径，但帝国财政正因三战损失与持续扩军而承压。学界有观点认为帝国正考虑对大运河商船增收通行费，这一动议若付诸实施，将直接冲击大陆[魔矿](#idx-e71)主干航线的通行成本。\n\n四战已成大陆学界的共识，悬而未决的只是触发它的具体导火索。\n\n#### 三柱支撑：经济地位的政治含义\n\n大陆经济运行的三根柱子：尼希尔的沙阿万大魔矿、卡帕尼的贸易金融网络、艾瑟瑞姆的星术技术垄断，同时也是这三个国家在国际格局中保持独立位置的根本支撑。三柱国均不参与阿索两极的直接对峙，但其各自的角色与内部张力都直接关系到下一场战争的走向。\n\n尼希尔以魔矿顺差实现外交豁免。各国对其奴隶制与活体献祭的谴责持续不断，但魔矿出口构成的依赖关系使谴责无法转化为实质行动。酋邦内部对外界几乎完全不透明，仅能通过贸易往来窥得若干信号：近年贸易需求扩大、[血票](#idx-e198)收取量同步上升，指向某类宗教仪式的祭品需求正在增加。若此判断属实，酋邦内部对自由民与奴隶的压榨，或将随之进一步加剧。这一变化的长期含义如何，外界目前尚无可靠评估。\n\n卡帕尼以贸易与金融维持超然中立。联邦的离岸平衡策略要求与各国维持可运作的贸易关系，因此对阿索两极均保持独立距离，并刻意回避正式军事表态。其内部张力集中在对星术[蚀刻](#idx-e76)技术的研究方向上——部分公爵将其视为下一个世代最大的商业机遇，主张积极推进；另有公爵忧虑研究激进会进一步恶化与阿布丹提亚（人口外流争议）和艾瑟瑞姆（技术外流忧虑）的关系，态度审慎。两种立场分别对应两种联邦未来：一个独立、甚至主导大陆经济的商业帝国，或一个继续维持现状的金融中介。\n\n艾瑟瑞姆以星术技术维持战略价值。王国与阿布丹提亚的[丹提亚-瑞姆协约](#idx-e268)是其外交的支柱，但这一支柱在三战后开始松动。王国推行的[不习者改革](#idx-e266)对外开放、对外贸易扩大引致技术与人才外流，王室与保守派伯爵在改革方向上的分歧因此日益尖锐。索拉瑞斯三战战败后将扩张方向转南，艾瑟瑞姆边境压力同步上升，被迫从过往的学术僻静转向有限的外交主动。\n\n#### 缓冲与仲裁：希尔文诺\n\n希尔文诺占据[冠脊山脉](#idx-e419)之间的封闭盆地，地理上同时与索拉瑞斯、尼希尔与忒奥西斯接壤，加之其军事实力的高度不透明，使其成为大陆事务中的天然缓冲区与公认的仲裁者。[林缘议厅](#idx-e276)作为各国指定的国际会谈场所，三百余年来从未出现协定被撕毁的情形。\n\n精灵社会内部的当代变化目前主要表现为开放派与保守派的分歧。部分[氏族](#idx-e211)倡导进一步与人类世界接触，另一部分则视之为对传统秩序的侵蚀。这一分歧伴随着[落叶](#idx-e207)现象的明显加速：其成因究竟是自愿出走还是某种内部结构性压力所致，人类学界至今没有定论。希尔文诺在国际格局中扮演的仲裁角色——尤其是其作为可信中立第三方的权威——是否会受到内部松动的影响，目前是一个公开但无答案的问题。\n\n#### 大运河控制\n\n索菲亚大运河贯通[凛冰洋](#idx-e423)与[翡翠海峡](#idx-e416)，是凛冰洋—大运河—翡翠海峡这一魔矿主干航线的核心节点，同时也是大陆当代地缘结构中最重要的隐性杠杆。现今运河的主体管理权依旧归属于忒奥西斯，三战后阿布丹提亚虽接收了下游东岸两城的主权，但接受了由圣领继续管辖运河整体的安排。然而由于交接迟迟未能完成，索拉瑞斯在事实上仍控制运河下游入海段。\n\n由此三国在大运河问题上形成了微妙制衡：忒奥西斯以管理权与[河金](#idx-e321)收入嵌入这条航线，索拉瑞斯以入海段实控保留对航线的物理影响力，阿布丹提亚则掌握名义主权但尚未取得实际管辖。所有依赖大运河的贸易方——尼希尔的魔矿出口、卡帕尼的转手贸易、以及三国本身的跨国贸易——都处于这一三角关系所制造的不确定性之中。若索拉瑞斯如学界推测的那样对商船增收通行费，极有可能导致国际各贸易力量的联合反弹；若阿布丹提亚以两城交接为由施加压力，则可能引发索拉瑞斯、甚至亲索的圣领对其收紧运河通行。这条人造水道，从最初作为[正教会](#idx-e181)神迹的载体起步，已演变为大陆当代地缘政治最敏感的物理节点之一。\n\n### 国际制度与公共空间\n\n大陆当代国际秩序建立在数项制度安排之上，其中既有公认的国际公共空间，也有重要的双边协定。这些制度的形成多与精灵族扮演的催化角色相关，构成了历史上大陆国际秩序长期运转的基础。\n\n#### 林缘议厅\n\n林缘议厅是希尔文诺叶络枢机院于 1203 年在冠脊山脉东南脉隘口建立的国际会谈场所，是大陆唯一被各国共同承认的中立缔约见证机构。每次会谈均由叶络枢机院至少两位长老出席主持，会后公文存档发布。三次阿索战争的停战和约、丹提亚-瑞姆技术协约等[大陆历](#idx-e346)史上最具分量的国际协定均在此签署，三百余年来从未出现协定被单方撕毁的情形。\n\n林缘议厅权威的根本基础是精灵族的中立性与不可替代的仲裁地位。各国对希尔文诺的战略价值虽有不同程度的觊觎，但精灵族军事实力的高度不透明使任何单方面的扩张企图均缺乏可靠的战略预估，加之人类各国之间的相互制衡，林缘议厅得以维持其超然地位。\n\n#### 常驻使节体系\n\n大陆五国：阿布丹提亚、索拉瑞斯、忒奥西斯、艾瑟瑞姆、卡帕尼之间互设常驻使节，是大陆当代外交制度的核心。这一体系的形成可追溯至十三世纪林缘议厅建立之后，由精灵族的居中倡议与各国国际事务频繁化的实际需求共同推动，至十五世纪基本成型。常驻使节负责双边日常沟通、重要决议的传达与文书往来，紧急事态下可即时接触对方中央政府，避免了过往临时特使因路途与传讯延迟所引发的危机升级。\n\n尼希尔则游离于这一体系之外。酋邦因对外封闭的根本性政策，仅与卡帕尼有正式使节往来，与卡帕尼作为其最大贸易伙伴的地位相称。其余国家与尼希尔的外交接触至今仍以临时出使形式进行。希尔文诺无单设外交使节，林缘议厅与[卡里司泰](#idx-e526)[自由城市](#idx-e261)共同承担精灵族对外接触渠道的功能。\n\n值得一提的是，[公教会](#idx-e155)与正教会作为大陆两大宗教组织，并不在他国设立独立的驻外代表机构，而是仅依附于本国教会组织进行跨境联络，例如公教会通过在卡帕尼四公国首都的分会与联邦中央（四公爵[联席会议](#idx-e243)）进行沟通，圣领则通过设于[索尔因维克图斯](#idx-e448)的都主教会与凯撒朝廷接触。两大教会的外交活动因此与世俗外交体系并行不悖，仅在涉及神学事务时才直接介入。\n\n#### 卡里司泰自由城市\n\n卡里司泰位于冠脊山脉东南支脉中部、希尔文诺与忒奥西斯边境处，是大陆唯一的自由城市，由各国贸易机构负责人与希尔文诺精灵特别代表组成的**[城务会](#idx-e222)**共同治理。城务会之名即取其权限止于市政之意——仓储、转运、市集与治安而已，不涉任何对外事务。城市须保持完全去武装化状态，同时不具备外交主体地位，不被国际社会承认为独立政治实体。\n\n卡里司泰的实际职能远超其最初的贸易仓储定位。除作为精灵-人类官方贸易的集散地外，它也是大陆学者前来旅居考察、各国驻外贸易代表与精灵族非正式接触的场所，更是大多数[落叶精灵](#idx-e411)进入人类社会的第一站。卡里司泰因而事实上承担了大陆\"非正式外交空间\"的功能，许多在[常驻使节体系](#idx-e267)中不便讨论的事项，往往在卡里司泰各方代表的私下接触中先行探出底线。\n\n笔者注：林缘议厅、卡里司泰、常驻使节体系——大陆当代国际秩序的三项核心制度，三者均与精灵族的居中协调直接相关。这一事实在人类各国当代外交话语中很少被特意提及，但其历史脉络是清晰的。换句话说，若没有希尔文诺的存在，大陆的国际秩序在过往三百年的演变路径将完全不同。\n\n#### 主要双边制度\n\n大陆当代主要双边制度可分为三类。技术与资源协约方面，丹提亚-瑞姆技术协约（1304 年缔结）是大陆现存最重要的国家间长期协约，规定艾瑟瑞姆向阿布丹提亚出口星术成果与技术人才，换取魔矿与战略资源进口，每十年重新谈判换算标准。三战后协约执行虽有所松动，但仍是两国关系的基础框架。金融方面，索拉瑞斯与忒奥西斯之间的货币实现了互认，两国货币以一比一官方汇率等价流通，常被认为是当代两国政治深度绑定在经济层面的直接体现，无第二个国家间存在类似的对等安排。停战与领土条约方面，三次阿索战争的停战和约每次都导向了新的大陆地缘格局变化，三战签署的卡斯特鲁姆和约中，关于大运河下游东岸两城交接的条款至今未能完整执行，是当代大陆地缘最关键的悬置事项。\n\n### 战争与和平的节律\n\n近代大陆政治格局的根本节律由阿索两国的周期性冲突主导——三次阿索战争跨越两个世纪，每一次都触发了至少一项制度性后果，深刻地重塑了大陆的政治版图。\n\n#### 三次大陆战争与影响\n\n[第一次阿索战争](#idx-e271)（1290–1292）的政治后果远超战场本身。圣领以索拉瑞斯盟友身份参战，引发了阿布丹提亚境内正教会的强烈不满。一个教义上宣称超越世俗政治的教会，以如此明确的姿态站在交战一方，使境内信众与教会人士的内部矛盾骤然激化。改革派提出将星空魔法视为[唯一神](#idx-e135)权柄的另一种显现形式纳入教义，以此为阿布丹提亚帝国境内的星术应用提供神学合法性，同时也为圣领的政治中立性提供神学背书。然而改革方案在推行中遭到了巨大阻力：星术合法化将根本性冲击依赖[神启魔法](#idx-e4)垄断的正教会权威架构，同时索拉瑞斯也不愿看到圣领的政治立场中立化，施加了境外政治影响。改革最终失败，其结果便是 1295 年阿布丹提亚境内正教会宣布独立，公教会成立，史称教会大分裂。\n\n[第二次阿索战争](#idx-e269)（1351–1356）触发了更深层的政治重塑。阿布丹提亚再度战败、放弃对卡帕尼群岛的宗主权，导致卡帕尼于 1356 年宣布独立。一个完全以商业立国的群岛联邦由此进入大陆国际舞台。战败后的阿布丹提亚经过近四十年的内部权力再分配，于 1393 年成立三柱议会，完成了专制帝国向君主立宪制国家的转型。与此同时，和约令[西比尔平原](#idx-e492)南部领土归于亲圣领的索拉瑞斯治下，成为三十年后忒索两国联合开凿索菲亚大运河的地理基础——这条人造水道日后将成为大陆贸易格局乃至当代地缘冲突的核心节点之一。二战的政治后果通过三条平行的链条：卡帕尼独立、阿布丹提亚立宪、大运河开凿，构成了今日大陆政治格局的物质基础。\n\n索拉瑞斯继承内战（1402–1433）是三次大陆战争节律的一次插曲。它并非阿索冲突，但在帝国合法性结构中留下的损伤直接决定了下一场阿索战争的胜负。十五世纪初第七代凯撒过早驾崩、子嗣无人达到《龙裔继嗣法》规定的标准，制度漏洞由此显现。三十年内战之后，三皇子雷尔金一世胜出登基，但他的合法性瑕疵至今仍是帝国内部最敏感的政治议题。\n\n第三次阿索战争（1479–1483）是当代大陆政治格局的直接奠基。阿布丹提亚依托黄金时代的积累成果，加之丹提亚-瑞姆协约下引进的星术军工技术，部署[对龙工程兵团](#idx-e287)取得了两场决定性战役胜利；索拉瑞斯则因龙骑士团全程未参战失去了顶端战力。卡斯特鲁姆和约确立了阿索两国当前边界，圣领与阿布丹提亚的关系因此恶化，索拉瑞斯的扩张方向被迫转南——所有这些将在二十年之后构成下一场冲突的全部背景条件。\n\n#### 战后二十年\n\n近一个世纪以来，大陆政治节律在缩短，而非延长，这是大陆历史学界的共识之一。对此一种简化的解读是：随着大陆人口增长、各国经济恢复速度加快与军事技术不断更新，战争窗口的间隔正在向一个完整兵役世代靠拢。三战后二十年的相对和平期，本质上是阿索两国军备恢复与内政整合的窗口——卡立曼七世借此收回更多君权，完成军备整合；雷尔金二世则借此尝试弥合内战遗留的合法性裂痕。\n\n笔者注：在历史长河中，二十年是一个相当短的时间窗口。它足够让上一场战争的死者被埋葬、被纪念，却不足以让生者忘记他们；它足够让下一代成长到适于服役的年龄，却不足以让一个国家消化战败的耻辱。若四战如学界共识所预测的那样如期到来，下一场战争的双方将由经历过三战的中年军官指挥、由战时出生的青年士兵填充——这种代际叠加，本身就是一种政治节律的烈性燃料。\n\n### 军事力量谱系\n\n大陆军事力量的真实分布与外界对其的认知差距，是各国制定战略时最关键也最隐晦的变量。按威慑力的可信度——即外界对其编制、装备与实际可动员性的了解程度——可将大陆军事力量大致分为三层：公开可信、半透明、不透明。\n\n#### 公开可信的力量\n\n这一层的力量，其编制、规模与战力为外界充分掌握，或经实战与大型工程反复检验，或因常态化的公开运作而无从遁形。各国的常规部队大多归入此列。\n\n阿索两强与圣领的常规军构成了这一层的主体。索拉瑞斯实行全民军事化，以[军团](#idx-e294)为最高编制、军团与[行省](#idx-e232)一体，八大军团既是行政骨架也是军事编制，历次阿索战争中规模与战力反复展现于实战。阿布丹提亚常规军分为贵族征召的[地方军](#idx-e286)与皇室直属的[皇室近卫军](#idx-e290)，是三战中帝国军队的主体，编制与战斗序列为外界熟知。忒奥西斯[护教军](#idx-e289)下分五个师，由各[都主教区](#idx-e153)分别组建、平时分散驻防，以治安与国土防御为主。这些军队的兵员构成、征召方式与大致规模均无隐秘可言。\n\n在常规军之上，这三国还各拥有一支战力已获公开印证的精锐。索拉瑞斯[龙骑兵团](#idx-e291)约八万头[飞龙](#idx-e292)、五万人编制，是帝国维持西诺拉尼亚统一的核心军事支柱，跨地形作战能力冠绝大陆，其规模、训练方式与编制传统在各国均有相对完整的情报积累。阿布丹提亚的星术兵种与对龙工程兵团是帝国魔法军力的全部主体——前者以[星术巨像](#idx-e81)与[野战星术师](#idx-e306)为核心，后者以[对龙穿甲弩炮](#idx-e62)等专用装备为标志，三战中的实战表现已使其战斗能力得到外界验证。忒奥西斯[圣仪军](#idx-e302)是大陆规模最大的法术军事力量，其在索菲亚大运河建设中的表现，已展现出集团施法的工程级能力。\n\n卡帕尼[大舰队](#idx-e285)是大陆唯一具备独立海军编制的力量，战舰装备[星术火炮](#idx-e80)、[仲裁星术防护罩](#idx-e94)与随船神启魔法师，专为海战设计。与上述各支力量不同，大舰队从未参与任何大陆国际性战事或大型工程，其可信并非来自实战检验，而在于常年在翡翠海峡执行护航与海盗清剿、编制与运作始终处于公开视野；加之大陆并无第二支成熟海军，其海上支配地位本无对手可供较量。\n\n#### 半透明的力量\n\n这一层的力量在编制上对外公开，但其实际可动员性或运作机制存在外界难以评估的部分。\n\n索拉瑞斯龙骑士团是其中最典型的例子。八位骑士的存在是公开事实，但[龙骑士](#idx-e295)的效忠对象是凯撒本人而非帝国，且团内决议采用多数决方式——这意味着凯撒对其的动员权并非绝对。三战期间龙骑士团几乎全程未参战，是这一可动员性问题最直接的体现。艾瑟瑞姆的[屏星军](#idx-e297)与[源星军](#idx-e307)在编制与装备上同样信息相对透明，但王国长期实施严格的对外信息管控，且几乎没有参与大陆冲突，这支技术先进的军队在大规模战争中的真实表现仍是一个外界尚未真正验证过的问题。忒奥西斯[宗座卫队](#idx-e309)成员的姓名、年龄与能力均不对外公开，但其作为大牧首近卫的存在与基本编制为各国所知。[圣礼骑士](#idx-e301)的身份本身就是一种制度性的半透明设计——由凯撒派出、受大牧首册封、名义上仍属龙骑士团但承担圣领防卫义务——其效忠链的多重嵌合使任何外部评估都不得不附加大量条件。\n\n#### 不透明的力量\n\n希尔文诺与尼希尔的军事力量是大陆军力评估中两块最大的盲区。\n\n精灵族军事力量完全不透明。索拉瑞斯历史上的唯一一次试探被轻松全歼，未留下任何可供推断的情报；落叶精灵失去圣树魔法，使人类学界无从借此研究精灵魔法体系；卡里司泰的精灵特别代表则对相关议题保持完全沉默。在缺乏任何实质性数据的情况下，学界的共识只能止步于一个保守的下限：希尔文诺的军事实力只会高于各国的估计，不会更低。\n\n尼希尔的情况略有不同。酋邦从未参与任何大陆国际战争，外界从未在战时记录中获得过其军事力量的样本；学界依据有限信息推测其军队分为[众徒军](#idx-e308)（奴隶与自由民构成的常规部队）与[神使军](#idx-e300)（神遴者的魔法部队）两类，另设教长直属的[神庙卫士](#idx-e298)。这套推测性框架是否准确，目前尚无可靠的检验方式。\n\n#### 评估不对称与战略推论\n\n军事力量谱系的\"已知—未知\"分布直接决定了各国的战略选择。三战后的二十年间，索拉瑞斯依赖龙骑士团的战略威慑力，但其可动员性已被外界重新评估，尤其是阿布丹提亚。这一评估上的差异是卡立曼七世扩张信心的重要来源：他相信下一场战争中，索拉瑞斯无法投入其顶端战力。\n\n笔者注：当下索拉瑞斯依旧在外交辞令中坚持龙骑士团的威慑姿态，但这支力量是否仍能为帝国所用，如今已是疑问。阿布丹提亚的积极军备，事实上也透露出丹提亚高层持有相同的判断。战争从不只是在战场上决出胜负。很多时候，它在双方对彼此底牌的估算出现分歧的那一刻便已经开始了。\n\n### 教权-帝权与凯撒合法性\n\n大陆当代政治格局中最严重的结构性裂痕集中体现在阿布丹提亚、索拉瑞斯与圣领三方之间——两条裂痕互相纠缠，构成了下一场大陆战争最深层的合法性背景。\n\n#### 教会大分裂的政治后果\n\n教会大分裂发生于 1295 年，距今已逾两个世纪。其直接后果是大陆唯一神信仰被切分为正教会—公教会两套并行体制：正教会以圣领为核心，覆盖索拉瑞斯及大陆其他地区的传统信众；公教会以阿布丹提亚为主要传播地区，独立运作。两大教会在神学路线上存在多项明确分歧——星空魔法是否同为神权、[诺万尼斯流放](#idx-e167)极刑是否合法、神启魔法的管理是否应当依托[审判庭](#idx-e171)制度等——双方大牧首与[宗主教](#idx-e183)互相开除教籍，至当代仍是各自宗教叙事中互相批评对方的惯用论据。\n\n大分裂的政治后果在三个层面上塑造了大陆当代格局。第一，圣领与阿布丹提亚的结构性对立。圣领作为正教会的世俗化身，与公教会的所在国阿布丹提亚之间，宗教层面的张力在分裂初始便已存在。这一张力本可在阿布丹提亚世俗化程度较高、圣领立场相对中立的条件下被实务性维持，但三战之后圣领与雷尔金朝的紧密关系、对南西比尔交接的拖延、以及对阿布丹提亚的态度明显恶化，使忒阿两国关系趋向僵硬。第二，公教会在阿布丹提亚的边缘政治地位。帝国从未将公教会立为国教，三柱议会内仅设少量公教会特别代表席位，独立于皇室、贵族、魔法三柱之外。这一安排既反映了帝国世俗化的政治取向，也意味着公教会在阿布丹提亚的影响力远不及正教会在索拉瑞斯。它是一个被允许存在、但从未被赋予政治主导权的宗教组织。第三，神启魔法的地缘失衡。圣领凭借触媒制作技术的垄断持续吸纳大陆各地的顶尖神启天赋者，公教会则技术水准明显落后、人才规模有限。这一失衡是阿布丹提亚在军事路线上全面依赖星术的结构性原因——丹提亚-瑞姆协约的根本动力，部分正来自帝国神启魔法资源的长期不足。\n\n#### 龙裔合法性危机\n\n第二条裂痕涉及索拉瑞斯帝国皇权的合法性根基。《龙裔继嗣法》以血脉浓度作为皇位继承的核心标准，由牧首厅主持血脉测试。这一制度在帝国早期是稳定的，但其存在一个根本漏洞：若所有直系子嗣均未达标，则无人能够继承凯撒之位。这一问题在血脉浓度逐代衰减的长期趋势下迟早会显现。十五世纪初第七代凯撒过早驾崩触发了这一情况，三十年继承内战随之而起，最终三皇子雷尔金一世胜出登基。\n\n雷尔金一世登基后，索拉瑞斯与圣领的关系迅速回暖，至当代仍紧密。表面上是两大政治体的战略选择，更深层则牵扯到血脉测试这一最敏感的环节。一种在大陆学界私下流传的推论是：内战期间圣领（具体由当时主管[圣礼厅](#idx-e173)的西奥多枢机协助）配合雷尔金一世完成了血脉测试结果的伪造，雷尔金一世登基后回报这一支持，全力支撑亲索派牧首在牧首厅的地位。由于《龙裔继嗣法》要求每代凯撒的子嗣均须重新测试，亲索派大牧首因此不是一次性的历史包袱，而是世代延续的刚性需求，这一结构使圣领与索拉瑞斯之间形成了一种深层的互为人质关系。\n\n现任凯撒雷尔金二世（1440 年生，1470 年登基）作为雷尔金一世之孙，承袭了这一合法性裂痕。帝国内部若干军团长对雷尔金二世的认可程度有限，部分军团长甚至默许\"血统测试造假\"的流言在所辖行省传播。这一裂痕最直接的体现是三战期间龙骑士团内部决议不参战——龙骑士的效忠对象是凯撒本人而非帝国，其立场[半龙化](#idx-e11)使他们对血缘合法性的瑕疵尤为敏感。\n\n#### 两条裂痕的当代汇合\n\n教会大分裂与龙裔合法性危机看似两条独立的裂痕，但在 1470 年之后逐渐汇合为同一条政治断层。雷尔金二世登基以来，凯撒对圣领宗教背书的需求日益迫切，圣领对维系亲索路线的政治投入也同步加大：大牧首西奥多三世的当选，本身就是这一互为人质结构的延续。\n\n这一结构在三战之后已被推向极致。圣领同时陷入与阿布丹提亚（南西比尔领土争议）、与公教会（神学冲突）两条关系恶化的轨迹，表面上是不同议题上的偶发摩擦，本质上是同一种政治取向的不可逆深化。圣领没有退路，若雷尔金朝失去合法性、若雷尔金二世以任何方式被取代或清算，前三代凯撒的合法性都将被翻案，圣领两代亲索派大牧首的政治遗产也将随之崩塌。\n\n笔者注：若上述判断属实，下一场大陆战争对索拉瑞斯与圣领而言已远不只是一场领土与国际地位的争夺，而是一场关于合法性本身的战争。一旦失败，圣领与雷尔金朝两代人精心维系的政治结构都将面临难以承受的解体压力。这也是为什么，在所有当代大陆观察者眼中，索拉瑞斯比阿布丹提亚更没有退路；而圣领的处境，恐怕比索拉瑞斯本身还要紧迫。\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$2\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"min-h-[60vh] flex items-center justify-center text-[var(--ink-muted)]\",\"children\":\"加载中…\"}],\"children\":[\"$\",\"$L10\",null,{\"bookSlug\":\"compendium\",\"toc\":[{\"slug\":\"作者序\",\"title\":\"炉边随记（代作者序）\",\"titleEn\":\"Preface\",\"isArticle\":true},{\"slug\":\"年表与大事记 Chronology\",\"title\":\"年表与大事记\",\"titleEn\":\"Chronology\",\"isArticle\":true},{\"slug\":\"度量与岁时 Measures and Times\",\"title\":\"度量与岁时\",\"titleEn\":\"Measures and Times\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview\",\"title\":\"大陆总览 Overview\",\"children\":[{\"slug\":\"大陆总览 Overview/地理\",\"title\":\"地理概述\",\"titleEn\":\"The Geography\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/魔法\",\"title\":\"魔法概述\",\"titleEn\":\"The Magic\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/经济\",\"title\":\"经济概述\",\"titleEn\":\"The Economy\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/宗教\",\"title\":\"宗教概述\",\"titleEn\":\"The Religions\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/政治\",\"title\":\"政治概述\",\"titleEn\":\"The Politics\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/文化\",\"title\":\"文化概述\",\"titleEn\":\"The Culture\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"诸国列志 Chorography of the Nations\",\"title\":\"诸国列志 Chorography of the Nations\",\"children\":[{\"slug\":\"诸国列志 Chorography of the Nations/阿布丹提亚\",\"title\":\"阿布丹提亚帝国\",\"titleEn\":\"The Abundantia Empire\",\"isArticle\":true},{\"slug\":\"诸国列志 Chorography of the Nations/索拉瑞斯\",\"title\":\"索拉瑞斯帝国\",\"t itle\":\"在人间·上\",\"titleEn\":\"Coming of Age·In the Human World I\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/在人间·下\",\"title\":\"在人间·下\",\"titleEn\":\"Coming of Age·In the Human World II\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/送别\",\"title\":\"送别\",\"titleEn\":\"The Farewell\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/铸币的两面\",\"title\":\"铸币的两面\",\"titleEn\":\"Two Sides of a Nicat\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"索引 Index\",\"title\":\"索引\",\"titleEn\":\"Index\",\"isArticle\":true}],\"currentSlug\":\"大陆总览 Overview/政治\",\"article\":{\"slug\":\"大陆总览 Overview/政治\",\"title\":\"政治概述\",\"titleEn\":\"The Politics\",\"content\":\"$11\",\"indexTerms\":[{\"id\":\"e1\",\"title\":\"龙族魔法\",\"aliases\":[],\"body\":\"巨龙及龙族亚种所用的种族魔法，学界归类为[神启魔法](#idx-e4)的一种。\"},{\"id\":\"e2\",\"title\":\"秘术式\",\"aliases\":[],\"body\":\"[尼希尔秘术](#idx-e3)施法所用的特殊仪式，将祭品[构成元素](#idx-e18)解离为[无属性元素流](#idx-e42)并转化为魔法。\"},{\"id\":\"e3\",\"title\":\"尼希尔秘术\",\"aliases\":[\"秘术\"],\"body\":\"[尼希尔](#idx-e517)统治阶级独有的魔法体系，简称秘术，以等价交换为原理，解离祭品的[构成元素](#idx-e18)为力量。\"},{\"id\":\"e4\",\"title\":\"神启祷言\",\"aliases\":[\"祷言\",\"神启魔法\"],\"body\":\"[神启学派](#idx-e5)对自身魔法的称呼，简称祷言；亦名神启魔法。\"},{\"id\":\"e5\",\"title\":\"神启学派\",\"aliases\":[],\"body\":\"以[唯一神](#idx-e135)所借权柄使用魔法的学派，编织[术式](#idx-e38)调动环境中游离态的[四大元素](#idx-e39)。\"},{\"id\":\"e6\",\"title\":\"星空学派\",\"aliases\":[],\"body\":\"以[第五元素](#idx-e17)以太的显现与外化解释魔法的学派，[内化](#idx-e30)以太于体内再[显化](#idx-e44)为魔法。\"},{\"id\":\"e7\",\"title\":\"以太星术\",\"aliases\":[\"星术\",\"星空魔法\"],\"body\":\"[星空学派](#idx-e6)对自身魔法的自称，简称星术；亦名星空魔法。狭义专指各类魔法对应的[大星轨](#idx-e16)走势。\"},{\"id\":\"e8\",\"title\":\"自然魔法\",\"aliases\":[\"精灵魔法\",\"圣树魔法\"],\"body\":\"精灵族与生俱来的法术能力，源自与[大圣树](#idx-e214)的契约连接；亦称精灵魔法、圣树魔法。\"},{\"id\":\"e9\",\"title\":\"奥韦纳尔·安柯伦坦\",\"aliases\":[\"安柯伦坦\"],\"body\":\"艾瑟瑞姆[天星师](#idx-e246)，1304年提出智慧生物出生时的[大星轨](#idx-e16)图像决定其[仪式星轨](#idx-e49)特征，且该特征恰合[源星](#idx-e56)五分类，[丝黛兰尔](#idx-e40)的分类法由此成为公认标准。\"},{\"id\":\"e11\",\"title\":\"半龙化\",\"aliases\":[],\"body\":\"人类与巨龙缔结[血契](#idx-e48)后，其思维与立场不可逆地向龙族一侧偏移的现象。\"},{\"id\":\"e13\",\"title\":\"裁闭术\",\"aliases\":[],\"body\":\"利用[界星石](#idx-e66)将局部空间环境状态固定的[星术](#idx-e7)，[仲裁星术](#idx-e58)的一种，常用于稳定温度。须以[玛娜](#idx-e26)供给[回路](#idx-e75)维持。\"},{\"id\":\"e16\",\"title\":\"大星轨\",\"aliases\":[\"天道星轨\"],\"body\":\"[天星五政](#idx-e41)在天球上的轨迹，代表宇宙中[以太](#idx-e17)流的流向；亦称天道星轨。\"},{\"id\":\"e17\",\"title\":\"第五元素\",\"aliases\":[\"以太\"],\"body\":\"构成群星与其间空间（宇宙）的物质，通称以太，永恒不朽；稀薄存在于大地之上，[星空魔法](#idx-e7)师可将其蓄积体内，是星术的能量来源。\"},{\"id\":\"e18\",\"title\":\"构成元素\",\"aliases\":[],\"body\":\"构成实体事物的四大[自然元素](#idx-e39)，不响应[祷言](#idx-e4)[术式](#idx-e38)。通过[秘术式](#idx-e2)可将其解离。\"},{\"id\":\"e20\",\"title\":\"结界\",\"aliases\":[],\"body\":\"[仲裁星术](#idx-e58)所构造的防护或隔离[术式](#idx-e38)，[裁闭术](#idx-e13)是其中的一种；通常依靠[界星石](#idx-e66)建立。\"},{\"id\":\"e23\",\"title\":\"精神力\",\"aliases\":[],\"body\":\"编织[祷言](#idx-e4)[术式](#idx-e38)所凭的能力，可经后天训练提高，只能依靠时间缓慢恢复。\"},{\"id\":\"e25\",\"title\":\"洛林阶运\",\"aliases\":[],\"body\":\"特定工艺的[星轨蚀刻](#idx-e76)（如旧式三分耦式蚀刻法）所致的[玛娜](#idx-e26)自然向外部流出的矿界面层现象。\"},{\"id\":\"e26\",\"title\":\"玛娜\",\"aliases\":[\"魔力\"],\"body\":\"[星空学派](#idx-e6)语境下[内化](#idx-e30)后的[以太](#idx-e17)，即俗称的魔力；释放后无法自然恢复，须[星术](#idx-e7)师冥想缓慢补充。\"},{\"id\":\"e29\",\"title\":\"魔元素动力学\",\"aliases\":[],\"body\":\"[神启学派](#idx-e5)中研究元素流动与[疏化](#idx-e37)机理的学科，由[神启魔法](#idx-e4)学者菲略奥斯等人奠基。\"},{\"id\":\"e30\",\"title\":\"内化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师于修习中将环境自由[以太](#idx-e17)汇入体内[仪式星轨](#idx-e49)的过程。\"},{\"id\":\"e34\",\"title\":\"圣树契约\",\"aliases\":[],\"body\":\"精灵与[大圣树](#idx-e214)之间的连接，圣树通过契约承担施法所需的[精神力](#idx-e23)消耗。\"},{\"id\":\"e36\",\"title\":\"施法者\",\"aliases\":[],\"body\":\"能够主动运用魔法的人口的统称，全大陆约占两成。\"},{\"id\":\"e37\",\"title\":\"疏化\",\"aliases\":[],\"body\":\"同一空间内反复施用[神启魔法](#idx-e4)后[自然元素](#idx-e39)恢复速率异常下降的现象，由神启魔法学者菲略奥斯提出。\"},{\"id\":\"e38\",\"title\":\"术式\",\"aliases\":[],\"body\":\"[神启魔法](#idx-e4)师以[精神力](#idx-e23)编织、临时改写自然法则的结构，是与[唯一神](#idx-e135)所立的单向契约。\"},{\"id\":\"e39\",\"title\":\"四大元素\",\"aliases\":[\"自然元素\"],\"body\":\"构成世界万物和游离在自然环境中的地、水、火、风元素，也称自然元素；唯游离态者可为[神启魔法](#idx-e4)调用。\"},{\"id\":\"e40\",\"title\":\"塔莉拉·丝黛兰尔\",\"aliases\":[\"丝黛兰尔\"],\"body\":\"[星空学派](#idx-e6)魔法先驱，著《[星术](#idx-e7)源流考》，首创以五颗天星对应五类魔法的[源星](#idx-e56)分类法，源星之名即出于此。\"},{\"id\":\"e41\",\"title\":\"天星五政\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)最重要的概念之一，指[冠阳](#idx-e532)、[汐月](#idx-e544)、[仲裁星](#idx-e549)、[烬铸星](#idx-e533)、[织虹星](#idx-e548)五颗天体。\"},{\"id\":\"e42\",\"title\":\"无属性元素流\",\"aliases\":[],\"body\":\"[秘术式](#idx-e2)解离祭品[构成元素](#idx-e18)后所得的能量形态，其性质仍是大陆魔法学界研究的未解课题。\"},{\"id\":\"e44\",\"title\":\"显化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师控制体内[以太](#idx-e17)流运转特定[大星轨](#idx-e16)、将[玛娜](#idx-e26)转为有色状态并外放的过程。\"},{\"id\":\"e48\",\"title\":\"血契\",\"aliases\":[],\"body\":\"人类与巨龙缔结的契约，双方精神世界互相开放，可转移龙族[术式](#idx-e38)的[精神力](#idx-e23)消耗。\"},{\"id\":\"e49\",\"title\":\"仪式星轨\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师于体内仿照[大星轨](#idx-e16)建立的[以太](#idx-e17)[回路](#idx-e75)，各部位对应一天宫。\"},{\"id\":\"e52\",\"title\":\"元素丰地\",\"aliases\":[],\"body\":\"游离态[四大元素](#idx-e39)丰度明显高于大陆平均的天然区域，对[疏化](#idx-e37)有强韧抵抗力。\"},{\"id\":\"e56\",\"title\":\"源星\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师[丝黛兰尔](#idx-e40)在《星术源流考》中提出的星术五分类，对应[天星五政](#idx-e41)。\"},{\"id\":\"e58\",\"title\":\"仲裁星术\",\"aliases\":[],\"body\":\"以[仲裁星](#idx-e549)为[源星](#idx-e56)的一类[星术](#idx-e7)，主秩序、约束与原则，含施加守护、封印、[结界](#idx-e20)制造与契约构造等星术。\"},{\"id\":\"e61\",\"title\":\"动力炉\",\"aliases\":[],\"body\":\"大型[星术设备](#idx-e85)的供能核心，见于[魔偶](#idx-e83)、[巨像](#idx-e81)与[星术驿车](#idx-e87)等。\"},{\"id\":\"e62\",\"title\":\"对龙穿甲弩炮\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)[对龙工程兵团](#idx-e287)列装的专用军备，利用[星术](#idx-e7)驱动发射装有特制簇头的大型弩箭，专为打击[索拉瑞斯](#idx-e429)龙骑兵部队设计。\"},{\"id\":\"e63\",\"title\":\"二型衡台\",\"aliases\":[],\"body\":\"附设[界星石](#idx-e66)，利用[裁闭术](#idx-e13)固定称重环境温度的衡台，用于称量对温度变化敏感的物品（如[星元](#idx-e69)）。\"},{\"id\":\"e65\",\"title\":\"高品级魔矿\",\"aliases\":[],\"body\":\"元素储存率极高、可承受各种魔法加工工艺的[魔矿](#idx-e71)，八成以上产自沙阿万。\"},{\"id\":\"e66\",\"title\":\"界星石\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e73)制成的器件，[仲裁星术](#idx-e58)设备的核心原件之一，用途极为广泛。可检测与稳定局部环境、维持[回路](#idx-e75)与[结界](#idx-e20)、容许特定构型[星术](#idx-e7)运行，用于[二型衡台](#idx-e63)、星术锁、[星术灯](#idx-e78)开关、建筑保温等领域。\"},{\"id\":\"e69\",\"title\":\"洛林星元\",\"aliases\":[\"星元\"],\"body\":\"粗加工[魔矿](#idx-e71)晶体经[星轨蚀刻](#idx-e76)、注入[玛娜](#idx-e26)封装的[星术制品](#idx-e88)，通称星元，取名于洛林法蚀刻，可为小型[星术设备](#idx-e85)供能。\"},{\"id\":\"e71\",\"title\":\"魔法矿石\",\"aliases\":[\"魔矿\"],\"body\":\"对五大元素均具极高流通率与储存率的天然矿石，通称魔矿，是大陆最重要的战略资源。\"},{\"id\":\"e72\",\"title\":\"农用星术设备\",\"aliases\":[],\"body\":\"用于耕作看护的[星术设备](#idx-e85)，典型代表为农用[魔偶](#idx-e83)；其引进是[阿布丹提亚帝国](#idx-e452)[三战](#idx-e270)后[圈地运动](#idx-e281)的物质前提。\"},{\"id\":\"e73\",\"title\":\"蚀刻魔矿\",\"aliases\":[],\"body\":\"经[星轨蚀刻](#idx-e76)的[魔矿](#idx-e71)，可按[回路](#idx-e75)结构储存[玛娜](#idx-e26)，并在触发时释放对应[星术](#idx-e7)。\"},{\"id\":\"e74\",\"title\":\"托兰瓦尔·洛林\",\"aliases\":[\"洛林\"],\"body\":\"艾瑟瑞姆[天星师](#idx-e246)，1125年首报可流通储存[以太](#idx-e17)的矿石并据以发明[星轨蚀刻](#idx-e76)；洛林法蚀刻为纪念其贡献而名，[洛林星元](#idx-e69)、[洛林阶运](#idx-e25)之名亦由此而来。\"},{\"id\":\"e75\",\"title\":\"星轨回路\",\"aliases\":[\"回路\"],\"body\":\"通过[蚀刻](#idx-e76)在[魔矿](#idx-e71)上建立的模仿[仪式星轨](#idx-e49)的通路，允许魔矿储存[玛娜](#idx-e26)，并在特定条件触发下释放对应[星术](#idx-e7)。\"},{\"id\":\"e76\",\"title\":\"星轨回路蚀刻\",\"aliases\":[\"蚀刻\",\"星轨蚀刻\",\"洛林法蚀刻\"],\"body\":\"于[魔矿](#idx-e71)表面蚀刻[仪式星轨](#idx-e49)[回路](#idx-e75)的技术，简称星轨蚀刻或蚀刻，为纪念发明人，又名洛林法蚀刻。1125年由艾瑟瑞姆[星术](#idx-e7)学者[托兰瓦尔·洛林](#idx-e74)发明，构成了[星术设备](#idx-e85)的基石。\"},{\"id\":\"e78\",\"title\":\"星术灯\",\"aliases\":[],\"body\":\"以[星术](#idx-e7)驱动的照明器具，有台灯、壁灯、顶灯等形制，在[艾瑟瑞姆王国](#idx-e494)境内已经几乎完全取代了常规照明用具（如油灯）。\"},{\"id\":\"e80\",\"title\":\"星术火炮\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[大舰队](#idx-e285)战舰装配的舰载火器，由操炮[星术](#idx-e7)师操作。\"},{\"id\":\"e81\",\"title\":\"星术巨像\",\"aliases\":[\"巨像\"],\"body\":\"[星术](#idx-e7)兵种的大型作战单位，通称巨像，由专精操作的星术师远距控制。\"},{\"id\":\"e83\",\"title\":\"星术魔偶\",\"aliases\":[\"魔偶\"],\"body\":\"以[蚀刻](#idx-e76)[回路](#idx-e75)驱动的小型[星术](#idx-e7)作战或劳作单位，通称魔偶，有农用魔偶、清扫魔偶等。\"},{\"id\":\"e85\",\"title\":\"星术设备\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e73)制成的各类器物的统称，自家用台灯至战场[巨像](#idx-e81)[动力炉](#idx-e61)，是艾瑟瑞姆高技术社会立国的物质基础。\"},{\"id\":\"e87\",\"title\":\"星术驿车\",\"aliases\":[],\"body\":\"以[动力炉](#idx-e61)驱动的陆上载具，行于艾瑟瑞姆城市内或城际道路。\"},{\"id\":\"e88\",\"title\":\"星术制品\",\"aliases\":[],\"body\":\"[星术设备](#idx-e85)所需半成品作为贸易品的称呼，[洛林星元](#idx-e69)为其典型代表。\"},{\"id\":\"e93\",\"title\":\"移动星术谐振台\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)[对龙工程兵团](#idx-e287)列装的专用军备，利用[星术设备](#idx-e85)发射高频声波干扰[飞龙](#idx-e292)亚种，与[对龙穿甲弩炮](#idx-e62)同为反制龙骑兵的核心器械。\"},{\"id\":\"e94\",\"title\":\"仲裁星术防护罩\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[大舰队](#idx-e285)战舰装配的魔法防护装置，使用[界星石](#idx-e66)构成的一种[结界](#idx-e20)，以随船[星术](#idx-e7)师使用[仲裁星术](#idx-e58)运作。\"},{\"id\":\"e99\",\"title\":\"朝圣\",\"aliases\":[],\"body\":\"[正教](#idx-e146)信众沿既定路线前往[圣城索菲亚](#idx-e487)的虔修，是[圣领](#idx-e483)可观的收入来源。\"},{\"id\":\"e100\",\"title\":\"称义\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒持守信仰、按神的教诲生活而得免[宿债](#idx-e131)的全过程，自[洗礼](#idx-e136)始，至临终而成。\"},{\"id\":\"e104\",\"title\":\"大祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)学徒正式受任为神职的[圣事](#idx-e121)。\"},{\"id\":\"e106\",\"title\":\"告解\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒为自身罪行请求赦免的[圣事](#idx-e121)，可反复进行。\"},{\"id\":\"e107\",\"title\":\"公教\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰两大教派之一，1295年[教会大分裂](#idx-e160)后自[阿布丹提亚](#idx-e452)境内的[正教会](#idx-e181)独立而成，以[公教会](#idx-e155)为组织载体，是阿布丹提亚人口的第一大信仰。将[星空魔法](#idx-e7)一并纳入唯一神权柄、另尊保罗为第二先知；主张轻罪可凭虔信与[圣事](#idx-e121)自赦，审判之权唯神独有，故不设[审判庭](#idx-e171)建制并废除[诺万尼斯流放](#idx-e167)，对个人虔修的要求高于[正教](#idx-e146)；[季首弥撒](#idx-e109)与节庆均依[通用历](#idx-e368)。\"},{\"id\":\"e109\",\"title\":\"季首弥撒\",\"aliases\":[],\"body\":\"[正教](#idx-e146)于[仪式历](#idx-e361)各季首日，[公教](#idx-e107)于[通用历](#idx-e368)各季首日举行的规模略大于每周[弥撒](#idx-e113)的集体仪式。\"},{\"id\":\"e110\",\"title\":\"坚振\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中，标志[称义](#idx-e100)大体完成的[圣事](#idx-e121)，一生一次，须对教会有重大贡献或持守信仰足够长久。\"},{\"id\":\"e112\",\"title\":\"礼仪年\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中六季[弥撒](#idx-e113)与九大节庆构成的一整年宗教循环。\"},{\"id\":\"e113\",\"title\":\"弥撒\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)礼拜日举行的集体仪式，与每日的[日课](#idx-e117)同为[称义](#idx-e100)最重要的日常载体。\"},{\"id\":\"e114\",\"title\":\"冥界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，信徒死后安息、静候轮回之地。\"},{\"id\":\"e117\",\"title\":\"日课\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒每日的功课，与礼拜日[弥撒](#idx-e113)同为[称义](#idx-e100)的日常载体。\"},{\"id\":\"e119\",\"title\":\"圣保罗\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，最初的医者，司治愈与修复；对应[织虹星](#idx-e548)与[虹曜日](#idx-e348)。[公教](#idx-e107)另尊其为第二先知。\"},{\"id\":\"e120\",\"title\":\"圣骸\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下的圣徒遗骨，为[朝圣](#idx-e99)与教堂声望所系，如[潘克拉托](#idx-e485)大教堂所藏的[圣约翰](#idx-e123)圣骸。\"},{\"id\":\"e121\",\"title\":\"圣事\",\"aliases\":[],\"body\":\"指[正教](#idx-e146)与[公教](#idx-e107)六项圣事：[洗礼](#idx-e136)、[坚振](#idx-e110)、婚姻、[告解](#idx-e106)、[大祝职](#idx-e104)、[小祝职](#idx-e138)。\"},{\"id\":\"e122\",\"title\":\"圣伊琳娜\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，司秩序与契约；对应[仲裁星](#idx-e549)与[裁曜日](#idx-e345)，[圣领](#idx-e483)[伊琳娜圣银币](#idx-e341)以其得名。\"},{\"id\":\"e123\",\"title\":\"圣约翰\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之首，[正教](#idx-e146)唯一的先知与弥赛亚，司精神与教导；对应[汐月](#idx-e544)与[月曜日](#idx-e376)。\"},{\"id\":\"e124\",\"title\":\"圣约瑟\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，商会之圣，司转化、破坏与锻造；对应[烬铸星](#idx-e533)与[烬曜日](#idx-e351)，[圣约瑟商会](#idx-e335)以其得名。\"},{\"id\":\"e126\",\"title\":\"使徒\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e132)》记载中，随[唯一神](#idx-e135)降世传教的最初四人：约翰、伊琳娜、约瑟、保罗。\"},{\"id\":\"e127\",\"title\":\"十字架\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教会](#idx-e155)共用的宗教象征符号。正教十字架为四端，象征四元素权柄。[公教](#idx-e107)下端另加一横，四横端象征四元素，竖端象征[星术](#idx-e7)。\"},{\"id\":\"e130\",\"title\":\"四界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰神学的宇宙构成：[天界](#idx-e133)、[现界](#idx-e137)、[冥界](#idx-e114)、[虚界](#idx-e141)。\"},{\"id\":\"e131\",\"title\":\"宿债\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰神学中，人一出生便背负的亏欠。缘于唯一神所借予而非赐予的权柄，受惠者无人能置身账外。\"},{\"id\":\"e132\",\"title\":\"索菲亚圣典\",\"aliases\":[\"圣典\"],\"body\":\"[唯一神](#idx-e135)信仰的最高典籍，通称《圣典》，分《创世录》《弥赛亚记》《神言书》《箴言集》四福音与《预言书》。\"},{\"id\":\"e133\",\"title\":\"天界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，唯一神、圣徒与天使的居所。\"},{\"id\":\"e135\",\"title\":\"唯一神\",\"aliases\":[\"主\",\"神\",\"上帝\"],\"body\":\"唯一神信仰所奉的至高神，信徒亦称主、神或上帝，是宇宙的创造者、维系者与监督者，也是世间一切魔法力量的源头。\"},{\"id\":\"e136\",\"title\":\"洗礼\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒入教与[称义](#idx-e100)之始的[圣事](#idx-e121)，一生一次，象征认清并领受自身的[宿债](#idx-e131)。\"},{\"id\":\"e137\",\"title\":\"现界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中[四界](#idx-e130)之一，人类生息的世界。\"},{\"id\":\"e138\",\"title\":\"小祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)神职人员卸任、复为寻常信徒之礼，多见于年老体弱者。\"},{\"id\":\"e141\",\"title\":\"虚界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，天球与大地之外仍为虚所充满的空间，罪人与非正信者死后的去处。\"},{\"id\":\"e143\",\"title\":\"异端\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下，秉持不同教义解释相异的教派；就[正教](#idx-e146)而言[公教](#idx-e107)即当代最大异端。\"},{\"id\":\"e146\",\"title\":\"正教\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰两大教派之一，以[正教会](#idx-e181)为组织载体，为[索拉瑞斯](#idx-e429)与[忒奥西斯](#idx-e483)的国教。认[神启祷言](#idx-e4)为唯一神所授的权柄，[星空魔法](#idx-e7)则不在神权之列；一切罪无论大小均须经[告解](#idx-e106)方得赦免，并以神在[现界](#idx-e137)的代行者自任，设[审判庭](#idx-e171)严管神启魔法、以[诺万尼斯流放](#idx-e167)向神赎罪。历法与[礼仪年](#idx-e112)循环依[圣格里仪式历](#idx-e361)。\"},{\"id\":\"e147\",\"title\":\"传信厅\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)[牧首厅](#idx-e166)六分厅之一，分管外交。\"},{\"id\":\"e148\",\"title\":\"大牧首\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)最高元首、[忒奥西斯](#idx-e483)圣领国家元首，由[枢机主教团](#idx-e174)闭门选出，终身任期。\"},{\"id\":\"e149\",\"title\":\"大审判长\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)最高长官，由[枢机主教团](#idx-e174)任命，与[大牧首](#idx-e148)同为终身任期。\"},{\"id\":\"e150\",\"title\":\"第二次宗教改革\",\"aliases\":[],\"body\":\"十三世纪末谋求将[星术](#idx-e7)纳入神权的改革，失败后直接导致[教会大分裂](#idx-e160)。\"},{\"id\":\"e152\",\"title\":\"都主教\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)[都主教区](#idx-e153)长官，教阶在主教之上；与[大牧首](#idx-e148)同不得婚娶，别称[门徒](#idx-e165)。\"},{\"id\":\"e153\",\"title\":\"都主教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)最高一级行政区划和宗教管理区划，全境共五个，长官称[都主教](#idx-e152)。[卡帕尼](#idx-e502)和[索拉瑞斯](#idx-e429)亦设有都主教区，但不具备行政职能。\"},{\"id\":\"e154\",\"title\":\"督审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)教阶之一，位在[审判官](#idx-e169)之上；[审判所](#idx-e162)驻任长官、[审判分庭](#idx-e168)官员。[诺万尼斯流放](#idx-e167)须由审判分庭所属督审判官主刑。\"},{\"id\":\"e155\",\"title\":\"公教会\",\"aliases\":[],\"body\":\"1295年[阿布丹提亚](#idx-e452)境内[正教会](#idx-e181)独立所成立的教会，领袖称[宗主教](#idx-e183)，驻[波马里亚](#idx-e459)。\"},{\"id\":\"e157\",\"title\":\"公教总会\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)中枢，驻[阿布丹提亚帝国](#idx-e452)城市[波马里亚](#idx-e459)。\"},{\"id\":\"e160\",\"title\":\"教会大分裂\",\"aliases\":[],\"body\":\"1295年[第二次宗教改革](#idx-e150)失败后，[阿布丹提亚帝国](#idx-e452)境内[正教会](#idx-e181)宣布脱离[牧首厅](#idx-e166)独立，成立[公教会](#idx-e155)。\"},{\"id\":\"e161\",\"title\":\"教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)[都主教区](#idx-e153)下辖的最小一级行政区划，长官称主教。也是[正教会](#idx-e181)在大陆各国所划的宗教事务上的最小管理层级。\"},{\"id\":\"e162\",\"title\":\"教区审判所\",\"aliases\":[\"审判所\"],\"body\":\"[审判庭](#idx-e171)在[教区](#idx-e161)一级所设的分支机构，简称审判所，由[督审判官](#idx-e154)驻任长官。\"},{\"id\":\"e165\",\"title\":\"门徒\",\"aliases\":[],\"body\":\"教会系统中[都主教](#idx-e152)及以上神职，以及[审判庭](#idx-e171)系统中自[督审判官](#idx-e154)及以上职位的别称，象征舍弃现世之乐、专心侍神；门徒不得婚娶。\"},{\"id\":\"e166\",\"title\":\"牧首厅\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)中枢以及[圣领](#idx-e483)最高行政机构，下设[圣礼厅](#idx-e173)、[省察厅](#idx-e179)、[司牧厅](#idx-e177)、[神启厅](#idx-e172)、[传信厅](#idx-e147)、[卫教厅](#idx-e178)六分厅。\"},{\"id\":\"e167\",\"title\":\"诺万尼斯流放\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[索拉瑞斯帝国](#idx-e429)维持的一种极刑，将受刑者留置诺万尼斯区域枯竭死地直至器官衰竭。\"},{\"id\":\"e168\",\"title\":\"审判分庭\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)在[都主教区](#idx-e153)一级的机构，长官称审判长，由[大审判长](#idx-e149)直接任命。\"},{\"id\":\"e169\",\"title\":\"审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)教阶之一，负责日常调查和执行事务，是[圣领](#idx-e483)独立于军事系统的强制执行编制。\"},{\"id\":\"e171\",\"title\":\"审判庭\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)直属司法和执行机构，处理[异端](#idx-e143)事务、追查未经许可的神启施法，拥有独立执法和行刑权。\"},{\"id\":\"e172\",\"title\":\"神启厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管[神启魔法](#idx-e4)事务。\"},{\"id\":\"e173\",\"title\":\"圣礼厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管宗教事务，亦负责[索拉瑞斯](#idx-e429)[凯撒](#idx-e234)的[血脉测试](#idx-e253)。\"},{\"id\":\"e174\",\"title\":\"枢机主教团\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)事实上的最高权力机构，[大牧首](#idx-e148)去世后负责闭门选出继任者。成员由大牧首自[都主教](#idx-e152)中选任。\"},{\"id\":\"e176\",\"title\":\"司祭\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)教阶之一，分管各城镇乡村的基层教会，往往本人即[神启魔法](#idx-e4)师。\"},{\"id\":\"e177\",\"title\":\"司牧厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管民生。\"},{\"id\":\"e178\",\"title\":\"卫教厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管军事，战时统一征召[护教军](#idx-e289)。\"},{\"id\":\"e179\",\"title\":\"省察厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管监察。\"},{\"id\":\"e181\",\"title\":\"正教会\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰最大教派[正教](#idx-e146)的教会组织，以[忒奥西斯](#idx-e483)圣领[牧首厅](#idx-e166)为教会中枢，同时也是圣领的统治机构。\"},{\"id\":\"e183\",\"title\":\"宗主教\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)领袖，由全大陆[公教](#idx-e107)主教选出三名候选，再由盲眼童贞信徒抽签决定。\"},{\"id\":\"e186\",\"title\":\"大神庙\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)首都[阿尔努尔](#idx-e518)城中的[教长](#idx-e199)驻地，是酋邦的宗教中心与圣地。\"},{\"id\":\"e191\",\"title\":\"玛阿特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中的死后审判仪式，以心脏置于天平称量，砝码为[希塔](#idx-e197)手杖顶端的宝石。\"},{\"id\":\"e197\",\"title\":\"希塔\",\"aliases\":[\"陆之神\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰中六神之一，老者之形，象征万物的终点，司灵魂与审判，看护[至福乐土](#idx-e201)；[玛阿特](#idx-e191)称量由其执行，砝码即其手杖顶端的宝石。\"},{\"id\":\"e198\",\"title\":\"血票\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)实行的，以活体生物作等价支付手段的制度，所收活物依教义可合法作为祭品用于[秘术](#idx-e3)祭祀。\"},{\"id\":\"e199\",\"title\":\"伊玛目教长\",\"aliases\":[\"教长\"],\"body\":\"[尼希尔](#idx-e517)最高元首，简称教长，同时是酋邦的宗教领袖与[酋长会议](#idx-e239)首席。终身制，非世袭，代代以[秘术](#idx-e3)密封诏书委任继承。\"},{\"id\":\"e201\",\"title\":\"至福乐土\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中，[玛阿特](#idx-e191)称量通过者所被允许进入的永恒安乐之地，由[希塔](#idx-e197)看护。\"},{\"id\":\"e202\",\"title\":\"诸神圣土\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)中由[伊玛目教长](#idx-e199)直辖的宗教领地。含首都[阿尔努尔](#idx-e518)及周边耕地城市，由各部按比例出资供养。\"},{\"id\":\"e207\",\"title\":\"落叶\",\"aliases\":[],\"body\":\"精灵与[圣树](#idx-e214)的精神连接中断之谓，主动者称背弃圣树者，被动者称圣树抛弃者。\"},{\"id\":\"e211\",\"title\":\"氏族\",\"aliases\":[],\"body\":\"精灵族的社会单位，被喻为[大圣树](#idx-e214)的分枝，各有族长与长老，本族领地内高度自治。\"},{\"id\":\"e213\",\"title\":\"万叶庭\",\"aliases\":[],\"body\":\"精灵族最高权力机构，每三十年于[希尔文尼亚](#idx-e527)召开，全体精灵借[圣树魔法](#idx-e8)旁听并投票。\"},{\"id\":\"e214\",\"title\":\"希尔文诺大圣树\",\"aliases\":[\"圣树\",\"大圣树\",\"圣树之母\"],\"body\":\"圣树信仰唯一的神圣对象，通称大圣树或圣树，矗立于[希尔文尼亚](#idx-e527)祭坛广场；凡有描述皆以女性位格出现，精灵称之为圣树之母，[自然魔法](#idx-e8)即祂分享之力。\"},{\"id\":\"e216\",\"title\":\"叶络枢机院\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e524)日常行政与对外事务机构，席位由[万叶庭](#idx-e213)轮选，长老兼承宗教职责。\"},{\"id\":\"e218\",\"title\":\"阿斯塔伦·塔利瑞安\",\"aliases\":[\"塔利瑞安\"],\"body\":\"[星术](#idx-e7)泰斗，1097年联合十二城邦创建[大星术研究院](#idx-e226)，即今[王家研究院](#idx-e249)之前身。\"},{\"id\":\"e222\",\"title\":\"城务会\",\"aliases\":[\"卡里司泰城务会\"],\"body\":\"[自由城市](#idx-e261)[卡里司泰](#idx-e526)的治理机构，由各国贸易机构负责人与[希尔文诺](#idx-e524)精灵特别代表组成，权限止于仓储、转运、市集与治安等市政事务。\"},{\"id\":\"e226\",\"title\":\"大星术研究院\",\"aliases\":[],\"body\":\"1097年由[塔利瑞安](#idx-e218)联合十二城邦创建，艾瑟瑞姆[王家研究院](#idx-e249)前身，是艾瑟瑞姆国家形态的起点。\"},{\"id\":\"e227\",\"title\":\"地星师\",\"aliases\":[],\"body\":\"艾瑟瑞姆[星术](#idx-e7)学者的头衔之一。星术师于所属研究院研究室完成课题答辩，毕业后被授予的头衔。\"},{\"id\":\"e228\",\"title\":\"帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)的一级行政区划，共五个，与皇室直辖的[维里迪亚直辖省](#idx-e481)并列；省政府为中央[内阁](#idx-e237)的地方分支。原为六省，[卡帕尼](#idx-e502)独立后余五省。\"},{\"id\":\"e230\",\"title\":\"公爵领\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)最高级别的贵族封地，各[帝政省](#idx-e228)含一到两个公爵领。\"},{\"id\":\"e231\",\"title\":\"管理局\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[特贸区](#idx-e505)的立法与行政机构，由区内各商会分部选派代表组成，最高长官称管理局主席。\"},{\"id\":\"e232\",\"title\":\"军团行省\",\"aliases\":[\"行省\"],\"body\":\"[索拉瑞斯](#idx-e429)的一级行政区划，一行省对应一[军团](#idx-e294)，共八个，长官称[行省总督](#idx-e251)。\"},{\"id\":\"e233\",\"title\":\"龙裔继嗣法\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)开国皇帝[阿利昂](#idx-e235)晚年制定的皇位继承法，以直系子嗣的龙血浓度为据，由[牧首厅](#idx-e166)主持[血脉测试](#idx-e253)。\"},{\"id\":\"e234\",\"title\":\"龙裔凯撒\",\"aliases\":[\"凯撒\"],\"body\":\"[索拉瑞斯](#idx-e429)最高统治者的称号，简称凯撒，即位须由[大牧首](#idx-e148)主持册封礼，体现君权神授。\"},{\"id\":\"e235\",\"title\":\"马尔奇安·阿利昂\",\"aliases\":[\"阿利昂\"],\"body\":\"[索拉瑞斯](#idx-e429)开国[凯撒](#idx-e234)，人龙混血，受[大牧首](#idx-e148)册封为首位龙裔凯撒；捐帝国东部领土立[忒奥西斯](#idx-e483)圣领，晚年制定《[龙裔继嗣法](#idx-e233)》。\"},{\"id\":\"e237\",\"title\":\"内阁\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)和[阿布丹提亚帝国](#idx-e452)的中央机构之一。均指直属于王室/皇室的日常行政机构，各有大臣分管外交、军务、内务与王室/皇室财政。\"},{\"id\":\"e239\",\"title\":\"酋长会议\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)最高权力机构，由[教长](#idx-e199)与各部落酋长组成，每年[金素](#idx-e350)季于[阿尔努尔](#idx-e518)召开，协商全酋邦外交、军事与内政事宜。\"},{\"id\":\"e240\",\"title\":\"三柱议会\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)最高立法与财政机构，1393年确立，三柱指皇室、贵族与魔法阶级。\"},{\"id\":\"e242\",\"title\":\"首席发言人\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[四公联席会议](#idx-e243)主席，由四公爵轮任，联席会议表决平局时握最终裁决权。\"},{\"id\":\"e243\",\"title\":\"四公联席会议\",\"aliases\":[\"联席会议\"],\"body\":\"[卡帕尼](#idx-e502)最高权力机构，由四公爵组成，设[首席发言人](#idx-e242)一职，每五年轮换。\"},{\"id\":\"e244\",\"title\":\"特别仪式区\",\"aliases\":[],\"body\":\"位于艾瑟瑞姆中南部最[大平原](#idx-e453)，专用于王国[星术](#idx-e7)研究与设备制造，行政直属国王/女王。\"},{\"id\":\"e245\",\"title\":\"特区商法典\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[北部特贸区](#idx-e505)适用的独立法系，不同于各公国法系。\"},{\"id\":\"e246\",\"title\":\"天星师\",\"aliases\":[],\"body\":\"[星术](#idx-e7)学者的最高阶头衔与职位，授予学术成果极为杰出的[地星师](#idx-e227)。[托兰瓦尔·洛林](#idx-e74)、[奥韦纳尔·安柯伦坦](#idx-e9)等均曾任天星师。\"},{\"id\":\"e247\",\"title\":\"天星首席\",\"aliases\":[],\"body\":\"艾瑟瑞姆[王家研究院](#idx-e249)最高级别学者之职，永久由艾瑟瑞姆国王或女王兼任。\"},{\"id\":\"e248\",\"title\":\"王冠领地\",\"aliases\":[],\"body\":\"艾瑟瑞姆国王直辖之地，含以首都[阿斯托利亚](#idx-e495)为首的[坠星湖](#idx-e501)南岸城市群。\"},{\"id\":\"e249\",\"title\":\"王家研究院\",\"aliases\":[],\"body\":\"艾瑟瑞姆学术中枢，前身为[大星术研究院](#idx-e226)，兼掌王室继承事务与[特别仪式区](#idx-e244)管理，院长即[天星首席](#idx-e247)，永久由国王或女王兼任。\"},{\"id\":\"e251\",\"title\":\"行省总督\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团行省](#idx-e232)最高长官，由[军团](#idx-e294)长兼任，任期二十年，每年赴首都[索尔因](#idx-e448)叙职。\"},{\"id\":\"e252\",\"title\":\"叙职大会\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八位[行省总督](#idx-e251)每年赴[索尔因](#idx-e448)向[凯撒](#idx-e234)当面汇报施政与军务的会议。\"},{\"id\":\"e253\",\"title\":\"血脉测试\",\"aliases\":[],\"body\":\"《[龙裔继嗣法](#idx-e233)》规定的继承资格测试，由[牧首厅](#idx-e166)[圣礼厅](#idx-e173)主持，每代[凯撒](#idx-e234)继承人均须重测。\"},{\"id\":\"e259\",\"title\":\"仲裁所\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[特贸区](#idx-e505)[管理局](#idx-e231)下属机构，承担特贸区司法职能。\"},{\"id\":\"e261\",\"title\":\"自由城市\",\"aliases\":[],\"body\":\"不受任何人类政权管辖、亦不被承认为独立政治实体的城市，大陆仅[卡里司泰](#idx-e526)一处。须完全去武装化，不具外交主体地位，由驻城各方组成的[城务会](#idx-e222)共同治理。\"},{\"id\":\"e263\",\"title\":\"阿索战争\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)与[索拉瑞斯帝国](#idx-e429)之间的三次大规模战争（1290–1292、1351–1356、1479–1483）。\"},{\"id\":\"e264\",\"title\":\"布兰顿和约\",\"aliases\":[],\"body\":\"[第二次阿索战争](#idx-e269)停战和约，以[布兰顿河](#idx-e463)下游为两国新界，[布兰顿](#idx-e462)城割予[索拉瑞斯](#idx-e429)。\"},{\"id\":\"e265\",\"title\":\"布兰顿战役\",\"aliases\":[],\"body\":\"1479年[三战](#idx-e270)前期的一场决定性会战，[阿布丹提亚帝国](#idx-e452)获得战略性胜利。\"},{\"id\":\"e266\",\"title\":\"不习者改革\",\"aliases\":[],\"body\":\"[三战](#idx-e270)后[艾瑟瑞姆王国](#idx-e494)推行的对外开放政策，要求王国各大城市与口岸为不习[星术](#idx-e7)者准备不依赖星术操作的各类公共设施。\"},{\"id\":\"e267\",\"title\":\"常驻使节体系\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)、[索拉瑞斯](#idx-e429)、[忒奥西斯](#idx-e483)、艾瑟瑞姆和[卡帕尼](#idx-e502)五国互设常驻使节的外交制度，[尼希尔](#idx-e517)游离其外。\"},{\"id\":\"e268\",\"title\":\"丹提亚-瑞姆技术协约\",\"aliases\":[\"丹提亚-瑞姆协约\"],\"body\":\"1304年[阿布丹提亚](#idx-e452)与艾瑟瑞姆缔结的长期协约，艾瑟瑞姆输出[星术](#idx-e7)成果与人才，换取阿布丹提亚[魔矿](#idx-e71)与战略资源。\"},{\"id\":\"e269\",\"title\":\"第二次阿索战争\",\"aliases\":[\"二战\"],\"body\":\"于1351–1356年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第二次大规模战争，[忒奥西斯](#idx-e483)保持中立。索拉瑞斯获胜，得[西比尔平原](#idx-e492)南部与[布兰顿](#idx-e462)城，停战于《[布兰顿和约](#idx-e264)》；阿布丹提亚放弃[卡帕尼](#idx-e502)群岛，卡帕尼同年独立。\"},{\"id\":\"e270\",\"title\":\"第三次阿索战争\",\"aliases\":[\"三战\"],\"body\":\"于1479–1483年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第三次大规模战争，阿布丹提亚获胜。停战于《[卡斯特鲁姆和约](#idx-e275)》，索拉瑞斯向阿布丹提亚归还[大运河](#idx-e427)下游东岸两座城市及其周边土地，两国当代边界由此确立。\"},{\"id\":\"e271\",\"title\":\"第一次阿索战争\",\"aliases\":[\"一战\"],\"body\":\"于1290–1292年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第一次大规模战争，[忒奥西斯](#idx-e483)为索拉瑞斯盟友。索拉瑞斯获胜后与圣领同告东扩，停战于《[文特拉和约](#idx-e283)》；间接促成1295年[教会大分裂](#idx-e160)。\"},{\"id\":\"e273\",\"title\":\"黑暗时代\",\"aliases\":[],\"body\":\"指八世纪[七王约](#idx-e280)瓦解后，西诺拉尼亚地区长达数百年的多国混战时期。\"},{\"id\":\"e275\",\"title\":\"卡斯特鲁姆和约\",\"aliases\":[],\"body\":\"[第三次阿索战争](#idx-e270)停战和约，确立阿索当代边界；[大运河](#idx-e427)下游东岸两城交接至今悬而未决。\"},{\"id\":\"e276\",\"title\":\"林缘议厅\",\"aliases\":[],\"body\":\"1203年[希尔文诺](#idx-e524)[叶络枢机院](#idx-e216)于[冠脊山脉](#idx-e419)东南脉隘口所设，是当前大陆唯一公认的中立缔约见证机构。\"},{\"id\":\"e280\",\"title\":\"七王约\",\"aliases\":[],\"body\":\"328年西诺拉尼亚七国建立的松散邦联，存续约四个世纪，八世纪中叶瓦解。\"},{\"id\":\"e281\",\"title\":\"圈地运动\",\"aliases\":[],\"body\":\"[三战](#idx-e270)以来，[阿布丹提亚](#idx-e452)贵族与魔法阶层借[农用星术设备](#idx-e72)提升庄园产出、驱赶农奴的运动。大量失去土地的农奴流向[卡帕尼联邦](#idx-e502)。\"},{\"id\":\"e283\",\"title\":\"文特拉和约\",\"aliases\":[],\"body\":\"[第一次阿索战争](#idx-e271)停战和约，[索拉瑞斯](#idx-e429)与[忒奥西斯](#idx-e483)领土东扩。\"},{\"id\":\"e285\",\"title\":\"大舰队\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国舰队的合称，是大陆唯一成熟的海军编制，设舰队司令统率。\"},{\"id\":\"e286\",\"title\":\"地方军\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)按[帝政省](#idx-e228)划编的常规部队，战时由贵族征召指挥，军费自负。\"},{\"id\":\"e287\",\"title\":\"对龙工程兵团\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)专为反制[龙骑兵团](#idx-e291)而设的特殊编制，列装[对龙穿甲弩炮](#idx-e62)与[移动星术谐振台](#idx-e93)。\"},{\"id\":\"e289\",\"title\":\"护教军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)最主要的常规部队，下分五个师，由各[都主教区](#idx-e153)分别组建。\"},{\"id\":\"e290\",\"title\":\"皇室近卫军\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)皇帝直辖的常备军，规模有限，军费由议会审批、自国库支出。\"},{\"id\":\"e291\",\"title\":\"近卫龙骑兵团\",\"aliases\":[\"龙骑兵团\"],\"body\":\"[索拉瑞斯](#idx-e429)以[飞龙](#idx-e292)为坐骑的精锐常规部队，通称龙骑兵团，直属[凯撒](#idx-e234)，约八万头飞龙、五万人编制，跨地形作战能力冠绝大陆。\"},{\"id\":\"e292\",\"title\":\"巨龙眷属\",\"aliases\":[\"飞龙\"],\"body\":\"巨龙与大型野兽的混血飞行亚种，通称飞龙，寿约五百年，是[龙骑兵团](#idx-e291)的坐骑。\"},{\"id\":\"e293\",\"title\":\"巨像部队\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)[星术兵团](#idx-e304)中以[星术巨像](#idx-e81)为作战单位的编制。\"},{\"id\":\"e294\",\"title\":\"军团\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)最高军事编制，与[行省](#idx-e232)一体，下设团、大队、小队。\"},{\"id\":\"e295\",\"title\":\"龙骑士\",\"aliases\":[],\"body\":\"与巨龙缔结[血契](#idx-e48)、得以释放[龙族魔法](#idx-e1)的人类战士，存在[半龙化](#idx-e11)现象。\"},{\"id\":\"e296\",\"title\":\"龙骑士团\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)的顶级战力，成员皆与巨龙缔结[血契](#idx-e48)，效忠[凯撒](#idx-e234)本人而非帝国，团内以多数决议事。\"},{\"id\":\"e297\",\"title\":\"屏星军\",\"aliases\":[],\"body\":\"艾瑟瑞姆对应他国常规作战部队的编制，作战单位完全由[巨像](#idx-e81)与[魔偶](#idx-e83)构成。\"},{\"id\":\"e298\",\"title\":\"神庙卫士\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)[教长](#idx-e199)直属的护卫编制，职能与[圣领](#idx-e483)[宗座卫队](#idx-e309)类似。\"},{\"id\":\"e300\",\"title\":\"神使军\",\"aliases\":[],\"body\":\"学界推测中[尼希尔酋邦](#idx-e517)由[神遴者](#idx-e412)构成的魔法部队。\"},{\"id\":\"e301\",\"title\":\"圣礼骑士\",\"aliases\":[],\"body\":\"由[大牧首](#idx-e148)册封的[龙骑士](#idx-e295)，席位限一人，承担[圣领](#idx-e483)防卫义务，但编制上仍属[龙骑士团](#idx-e296)。\"},{\"id\":\"e302\",\"title\":\"圣仪军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)直属的精锐法术作战部队，大陆规模最大的法术军力，兼承民间大型工程建设。\"},{\"id\":\"e304\",\"title\":\"星术兵团\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)魔法军力的主体，由[巨像](#idx-e81)、操作巨像的[星术](#idx-e7)师与[野战星术师](#idx-e306)组成，直属皇室。\"},{\"id\":\"e305\",\"title\":\"星术工程部队\",\"aliases\":[],\"body\":\"艾瑟瑞姆[源星军](#idx-e307)下属编制，近年列装自[阿布丹提亚](#idx-e452)引进的[对龙穿甲弩炮](#idx-e62)等器械。\"},{\"id\":\"e306\",\"title\":\"野战星术师\",\"aliases\":[],\"body\":\"艾瑟瑞姆与[阿布丹提亚](#idx-e452)[星术](#idx-e7)部队中不操作[巨像](#idx-e81)，自主作战的星术师，与[巨像部队](#idx-e293)并列为魔法军力主体。\"},{\"id\":\"e307\",\"title\":\"源星军\",\"aliases\":[],\"body\":\"艾瑟瑞姆真正意义上的魔法部队，由[野战星术师](#idx-e306)与[星术工程部队](#idx-e305)构成。\"},{\"id\":\"e308\",\"title\":\"众徒军\",\"aliases\":[],\"body\":\"学界推测中[尼希尔](#idx-e517)由奴隶与自由民构成的常规部队。\"},{\"id\":\"e309\",\"title\":\"宗座卫队\",\"aliases\":[],\"body\":\"[大牧首](#idx-e148)与[枢机主教团](#idx-e174)的近卫，驻[圣城索菲亚](#idx-e487)，高层成员一切信息不对外公开。\"},{\"id\":\"e321\",\"title\":\"河金\",\"aliases\":[],\"body\":\"船只通行[索菲亚大运河](#idx-e427)所缴的费用，是[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)的重要常规收入。\"},{\"id\":\"e335\",\"title\":\"圣约瑟商会\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)直属商会，垄断圣领境内外一切贸易，学界普遍认为兼具情报网络职能。\"},{\"id\":\"e336\",\"title\":\"四大商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国各自直属的商会，由四公爵历史上直接出资创立，其主席即公爵本人。\"},{\"id\":\"e338\",\"title\":\"索利亚商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)商会之一，1489年前后由卡涅·道格拉斯创办，以[星术设备](#idx-e85)半成品与[魔矿](#idx-e71)原料分销起家，后跃居联邦前列。\"},{\"id\":\"e341\",\"title\":\"伊琳娜圣银币\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)流通货币，以高含银量铸造并防伪，与[索拉瑞斯](#idx-e429)铁钞按一比一互认流通。\"},{\"id\":\"e344\",\"title\":\"自由港\",\"aliases\":[],\"body\":\"[特贸区](#idx-e505)所设、享有极高自治权的港口体系，是国际贸易量激增的制度前提。\"},{\"id\":\"e345\",\"title\":\"裁曜日\",\"aliases\":[\"圣伊琳娜日\"],\"body\":\"[通用历](#idx-e368)一周第二日，亦简称星期二；[仪式历](#idx-e361)作圣伊琳娜日，对应天星[仲裁星](#idx-e549)。\"},{\"id\":\"e346\",\"title\":\"大陆历\",\"aliases\":[],\"body\":\"[通用历](#idx-e368)纪年，以[唯一神](#idx-e135)降临传教义于[圣约翰](#idx-e123)之年为元年，元年之前称元前。\"},{\"id\":\"e348\",\"title\":\"虹曜日\",\"aliases\":[\"圣保罗日\"],\"body\":\"[通用历](#idx-e368)一周第四日，亦简称星期四；[仪式历](#idx-e361)作圣保罗日，对应天星[织虹星](#idx-e548)。\"},{\"id\":\"e350\",\"title\":\"金素\",\"aliases\":[\"圣献\",\"冕宫月\",\"肆位\"],\"body\":\"一年六季的第四季，各地作物相继采收。[仪式历](#idx-e361)同季作圣献，艾瑟瑞姆[星历](#idx-e371)作冕宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作肆位。\"},{\"id\":\"e351\",\"title\":\"烬曜日\",\"aliases\":[\"圣约瑟日\"],\"body\":\"[通用历](#idx-e368)一周第三日，亦简称星期三；[仪式历](#idx-e361)作圣约瑟日，对应天星[烬铸星](#idx-e533)。\"},{\"id\":\"e353\",\"title\":\"凛寒\",\"aliases\":[\"正炼\",\"琴宫月\",\"陆位\"],\"body\":\"一年六季的第六季，山地封路、[凛冰洋](#idx-e423)冰封，大陆整体进入年内节律最为收缩的状态。[仪式历](#idx-e361)同季作正炼，艾瑟瑞姆[星历](#idx-e371)作琴宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作陆位。\"},{\"id\":\"e356\",\"title\":\"启蛰\",\"aliases\":[\"晖醒\",\"天宫月\",\"壹位\"],\"body\":\"一年六季的第一季，[通用历](#idx-e368)岁首所在。[凛冰洋](#idx-e423)浮冰退散、山地封雪消融、两河进入汛期，各地贸易与出行随之重新活跃。[仪式历](#idx-e361)同季作晖醒，艾瑟瑞姆[星历](#idx-e371)作天宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作壹位。\"},{\"id\":\"e358\",\"title\":\"日曜日\",\"aliases\":[\"圣神日\"],\"body\":\"[通用历](#idx-e368)一周第五日，亦简称星期日；[仪式历](#idx-e361)作圣神日，对应天星[冠阳](#idx-e532)，是信众向[唯一神](#idx-e135)礼拜的礼拜日。\"},{\"id\":\"e359\",\"title\":\"萨辛历\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)地方历法，以当代伊玛目称号纪年，每代即位则重置元年，六季称[壹位](#idx-e356)至[陆位](#idx-e353)。\"},{\"id\":\"e361\",\"title\":\"圣格里仪式历\",\"aliases\":[\"仪式历\"],\"body\":\"[正教会](#idx-e181)原始历法，[通用历](#idx-e368)前身，[圣领](#idx-e483)与[索拉瑞斯](#idx-e429)的官方历法，六季与五日均保留宗教命名。\"},{\"id\":\"e368\",\"title\":\"通用历\",\"aliases\":[\"格里历\"],\"body\":\"大陆通行的太阳历，一年六季、每季五十日、每旬十日、每周五日；别称格里历，源自[正教会](#idx-e181)的[圣格里仪式历](#idx-e361)，经[公教会](#idx-e155)世俗化后扩散全大陆。\"},{\"id\":\"e371\",\"title\":\"星历\",\"aliases\":[],\"body\":\"艾瑟瑞姆地方历法，大陆唯一的月亮历，六月之名取自黄道六宫。\"},{\"id\":\"e376\",\"title\":\"月曜日\",\"aliases\":[\"圣约翰日\"],\"body\":\"[通用历](#idx-e368)一周第一日，亦简称星期一；[仪式历](#idx-e361)作圣约翰日，对应天星[汐月](#idx-e544)，是四个劳作日之首。\"},{\"id\":\"e378\",\"title\":\"步米\",\"aliases\":[],\"body\":\"长度基本单位，源自[索拉瑞斯](#idx-e429)[军团](#idx-e294)标准行军步伐；一步米等于十分步米等于一百厘步米。\"},{\"id\":\"e385\",\"title\":\"界石\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团](#idx-e294)沿主干道每千步所立的里程标记，亦为[陆里](#idx-e387)之所本。\"},{\"id\":\"e387\",\"title\":\"陆里\",\"aliases\":[],\"body\":\"长度单位，一陆里等于一千[步米](#idx-e378)，源自[军团](#idx-e294)沿主干道每千步立一[界石](#idx-e385)的传统。\"},{\"id\":\"e395\",\"title\":\"星度\",\"aliases\":[],\"body\":\"温度基本单位，源自[王家研究院](#idx-e249)的[魔矿](#idx-e71)[蚀刻](#idx-e76)环境控制需求，以纯水冰点为零、沸点为一百。\"},{\"id\":\"e411\",\"title\":\"落叶精灵\",\"aliases\":[],\"body\":\"已与[圣树](#idx-e214)断开连接（无论主动被动）的精灵统称，离开大森林后即失去[自然魔法](#idx-e8)的施展能力。\"},{\"id\":\"e412\",\"title\":\"神遴者\",\"aliases\":[\"神遴者阶层\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰的[玛阿特](#idx-e191)称量中，心脏与宝石恰成平衡者。宗教解释中，他们身负引导众生的责任，受赐[秘术](#idx-e3)之力转生现世；作为一个阶层，神遴者垄断了酋邦一切政治职位，[教长](#idx-e199)、祭司、部落酋长与长老无一例外皆出于此。\"},{\"id\":\"e413\",\"title\":\"北门湾\",\"aliases\":[],\"body\":\"[凛冰洋](#idx-e423)伸入大陆中部的内湾，位于[忒奥西斯](#idx-e483)北境，是[索菲亚大运河](#idx-e427)的北端入口。[尼希尔](#idx-e517)[魔矿](#idx-e71)经凛冰洋航线抵此南下，是当代大陆最重要跨洋贸易干线上的节点；[运河仪所](#idx-e493)即设于湾口。\"},{\"id\":\"e414\",\"title\":\"晨风海\",\"aliases\":[],\"body\":\"大陆东南方海域，洋流自东往西、往北持续输送暖湿气流深入内陆，是[阿布丹提亚大平原](#idx-e453)优良农业气候的关键成因。[马提尼河](#idx-e471)与[波特利亚河](#idx-e461)汇流后注入此海。\"},{\"id\":\"e415\",\"title\":\"大星洋\",\"aliases\":[],\"body\":\"大陆西侧海域，洋流复杂多变，深远洋几无成规模的远洋航行；较活跃者唯[索拉瑞斯](#idx-e429)西海岸的近海航线，串联[镜心湖](#idx-e436)产区与西南偏远[行省](#idx-e232)。其偏暖洋流携湿润气流北上，遇[裂境山脉](#idx-e422)与[冠脊山脉](#idx-e419)抬升成雨，是索拉瑞斯森林覆盖率过半的核心水分来源。\"},{\"id\":\"e416\",\"title\":\"翡翠海峡\",\"aliases\":[],\"body\":\"大陆南方水域，全大陆航运最繁忙之处，[卡帕尼](#idx-e502)群岛与大陆本体之间的物流几乎全经于此，亦是[索菲亚大运河](#idx-e427)的南端出口。卡帕尼北部岛链水文条件优越、港口全年可用，是这条贸易干线的天然枢纽。\"},{\"id\":\"e419\",\"title\":\"冠脊山脉\",\"aliases\":[],\"body\":\"大陆规模最大的山脉系统，分北、西、东南、南四脉。北脉与西脉合围[尼希尔](#idx-e517)南侧边境，北脉与东南脉之间夹含[希尔文诺大森林](#idx-e528)，南脉则完全位于[索拉瑞斯](#idx-e429)境内。冠脊山脉北脉同时是大陆西部最重要的气候屏障，其北为尼希尔干旱荒漠，其南为[希尔文诺](#idx-e524)封闭湿润的万年密林，是大陆诸域中最极端的毗邻气候对照。\"},{\"id\":\"e422\",\"title\":\"裂境山脉\",\"aliases\":[],\"body\":\"南北走向纵贯[索拉瑞斯](#idx-e429)中部，是帝国东西地形的核心分界线：以东为[奥利提斯平原](#idx-e430)，落在其雨影区而气候偏干；以西地势平缓，[镜心湖](#idx-e436)居中。沿线铁铜矿藏富集，是大陆冶铁产业最重要的原料来源；[索尔河](#idx-e447)发源于其南麓。\"},{\"id\":\"e423\",\"title\":\"凛冰洋\",\"aliases\":[],\"body\":\"大陆北方极寒洋，以东西向洋流为主，北部与东部全年有浮冰，渔业与运输活动仅集中于中西部海域；对大陆只输出严寒与干燥。[尼希尔](#idx-e517)[魔矿](#idx-e71)出口的主干路线即自两河出海口北上进入此洋，东行抵[北门湾](#idx-e413)后南下入[大运河](#idx-e427)。\"},{\"id\":\"e427\",\"title\":\"索菲亚大运河\",\"aliases\":[\"大运河\"],\"body\":\"[忒奥西斯](#idx-e483)与[索拉瑞斯](#idx-e429)联合开凿的人工水道，1381–1388年历时七年建成，以[圣仪军](#idx-e302)的[神启魔法](#idx-e4)为主力，是[大陆历](#idx-e346)史上最庞大的人造工程。自[北门湾](#idx-e413)几乎垂直向南贯穿[西比尔平原](#idx-e492)，南端注入[翡翠海峡](#idx-e416)，将[凛冰洋](#idx-e423)与翡翠海峡物理贯通，从根本上重塑了大陆南北贸易格局。管理权归圣领，凡向其报备货物并缴纳[河金](#idx-e321)的船只不分国籍皆可通行。\"},{\"id\":\"e429\",\"title\":\"索拉瑞斯帝国\",\"aliases\":[\"索拉瑞斯\"],\"body\":\"位于大陆中西部的军事集权帝制大国，首都[索尔因维克图斯](#idx-e448)。1159年[索拉尔王国](#idx-e541)国王[阿利昂](#idx-e235)统一西大陆诸国、受牧首册封为首代[龙裔凯撒](#idx-e234)而立国。国土一千一百二十万平方[陆里](#idx-e387)，划为八个[军团行省](#idx-e232)，逾七成为群山与原始森林，人口约四千二百万。以[军团](#idx-e294)—行省一体化制度与[龙骑兵团](#idx-e291)著称，尊[正教](#idx-e146)为国教，逾八成公民为正教信徒；外交强势，与[阿布丹提亚](#idx-e452)共构当代大陆两极。\"},{\"id\":\"e430\",\"title\":\"奥利提斯平原\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)境内[裂境山脉](#idx-e422)以东呈东北—西南走向的狭长平原，是帝国最主要的农业区与人口集中地之一，首都[索尔因维克图斯](#idx-e448)位于其西南角。因落在裂境山脉雨影区，气候较[镜心湖](#idx-e436)区偏干。\"},{\"id\":\"e436\",\"title\":\"镜心湖\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)西部的湖泊，是帝国最重要的农业产区核心与人口最密集的区域之一。受[大星洋](#idx-e415)暖流直接调节，湖体又进一步平抑温差，是帝国内气候最温和宜居的地带。[纳赫尔河](#idx-e520)发源于此；东岸最大城市为[雷克西姆](#idx-e440)。\"},{\"id\":\"e437\",\"title\":\"镜心湖行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八个[军团行省](#idx-e232)之一，位于帝国西部，环[镜心湖](#idx-e436)而设，首府[雷克西姆](#idx-e440)。\"},{\"id\":\"e440\",\"title\":\"雷克西姆\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[镜心湖行省](#idx-e437)首府，[镜心湖](#idx-e436)东岸最大城市，建有[圣保罗](#idx-e119)大教堂。堂中无[圣骸](#idx-e120)，仅供奉据称是保罗生前所披的斗篷——保罗殉道之处据《保罗福音》末章推测邻近镜心湖，[正教会](#idx-e181)因此在雷克西姆建立大教堂。\"},{\"id\":\"e447\",\"title\":\"索尔河\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)境内河流。发源于[裂境山脉](#idx-e422)南麓，流经首都[索尔因维克图斯](#idx-e448)后向东南注入艾瑟瑞姆境内的[坠星湖](#idx-e501)，是帝国重要的内河水系。\"},{\"id\":\"e448\",\"title\":\"索尔因维克图斯\",\"aliases\":[\"索尔因\"],\"body\":\"[索拉瑞斯帝国](#idx-e429)首都，通称索尔因，位于[奥利提斯平原](#idx-e430)西南角，[索尔河](#idx-e447)流经其间。是帝国的政治军事中心与最大城市，八位[行省总督](#idx-e251)每年赴此参加[叙职大会](#idx-e252)；城南设有[龙骑士团](#idx-e296)驻地与飞场。\"},{\"id\":\"e452\",\"title\":\"阿布丹提亚帝国\",\"aliases\":[\"阿布丹提亚\",\"丹提亚帝国\"],\"body\":\"通称丹提亚帝国，位于大陆东南方[大平原](#idx-e453)的君主宪政制大国，首都[维里迪亚](#idx-e480)。386年卡立曼·费内尔统一诸国建立帝政，费内尔家族统治延续至今；两次[阿索战争](#idx-e263)失利后于1393年建[三柱议会](#idx-e240)，和平演变为君主立宪制国家。国土八百七十万平方[陆里](#idx-e387)，划为五个[帝政省](#idx-e228)和一个直辖省，人口逾六千二百万，为全大陆最多。大陆第一大粮食出口国与政治东极，约七成人口信奉[公教](#idx-e107)。\"},{\"id\":\"e453\",\"title\":\"阿布丹提亚大平原\",\"aliases\":[\"大平原\"],\"body\":\"[阿布丹提亚帝国](#idx-e452)国土主体，大陆东部平原带规模最大的一部分，为全大陆最集中的农业核心地带。地势平坦开阔，水系极为发达，冲积土壤肥沃；中部核心区无霜期长而几无结冻，是帝国粮食、棉花与人口的集中所在，首都[维里迪亚](#idx-e480)居其腹地。\"},{\"id\":\"e459\",\"title\":\"波马里亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内位于[润溪湖](#idx-e474)西南方的重要城市。是大陆东部已知元素丰度最高的城市之一，天然宜居且对元素[疏化](#idx-e37)抵抗力强。历史上曾为[正教会](#idx-e181)在东诺拉尼亚最重要的宗教驻地，[教会大分裂](#idx-e160)后成为[公教总会](#idx-e157)所在地；[公教会](#idx-e155)于十四世纪宣称寻得的[圣保罗](#idx-e119)[圣骸](#idx-e120)即供奉于波马里亚大教堂。该城亦是波马里亚[公爵领](#idx-e230)首府，同名[帝政省](#idx-e228)的省名即出于此。\"},{\"id\":\"e461\",\"title\":\"波特利亚河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内的主要河流之一，发源自[葛林沃尔克](#idx-e525)南脉南麓，与[马提尼河](#idx-e471)于[大平原](#idx-e453)中部汇流后注入[晨风海](#idx-e414)，两河交汇处即首都[维里迪亚](#idx-e480)所在。\"},{\"id\":\"e462\",\"title\":\"布兰顿\",\"aliases\":[],\"body\":\"[布兰顿河](#idx-e463)东岸城市，位于河流中游。[第二次阿索战争](#idx-e269)后依《[布兰顿和约](#idx-e264)》割予[索拉瑞斯](#idx-e429)，此后一百二十余年是帝国边境最靠东的据点。1479年[三战](#idx-e270)开战之初为[阿布丹提亚](#idx-e452)夺取，此后终战未再易手，现归属于阿布丹提亚。\"},{\"id\":\"e463\",\"title\":\"布兰顿河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内河流。自北向南流经[西比尔平原](#idx-e492)东南缘，中段接纳一条自西而来的支流后折向东南，于[法拉利亚](#idx-e465)一带入海；[第二次阿索战争](#idx-e269)后其下游为阿索两国界河，《[布兰顿和约](#idx-e264)》即以此河命名，1479年[布兰顿战役](#idx-e265)的战场亦在其中下游两岸。\"},{\"id\":\"e465\",\"title\":\"法拉利亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内，[布兰顿河](#idx-e463)入[翡翠海峡](#idx-e416)河口处的港镇。\"},{\"id\":\"e471\",\"title\":\"马提尼河\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)第一大河，发源于[穗满湖](#idx-e477)，向东南流经[大平原](#idx-e453)后与[波特利亚河](#idx-e461)汇流注入[晨风海](#idx-e414)，两河交汇处即首都[维里迪亚](#idx-e480)所在。\"},{\"id\":\"e474\",\"title\":\"润溪湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)双湖之东者，与[穗满湖](#idx-e477)并称双湖，是帝国北部水系的重要源头。湖运承担北部矿区矿产向核心区的输送；西南方为[元素丰地](#idx-e52)城市[波马里亚](#idx-e459)。\"},{\"id\":\"e477\",\"title\":\"穗满湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)双湖之西者，与[润溪湖](#idx-e474)并称双湖。湖区周边水草丰美，是全大陆最集中的规模化牧区；[马提尼河](#idx-e471)发源于此。\"},{\"id\":\"e480\",\"title\":\"维里迪亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)首都，位于[马提尼河](#idx-e471)与[波特利亚河](#idx-e461)交汇处、[大平原](#idx-e453)腹地，是帝国政治文化中心，也是帝国最重要的内河航运枢纽之一。城市内歌剧院与画廊林立，素有\\\"艺术之都\\\"之称。\"},{\"id\":\"e481\",\"title\":\"维里迪亚直辖省\",\"aliases\":[\"首都直辖省\"],\"body\":\"[阿布丹提亚帝国](#idx-e452)六个一级行政区中唯一由皇室直辖者，亦称首都直辖省，位于帝国西南，含首都[维里迪亚](#idx-e480)及周边；境内不设贵族封地与[帝政省](#idx-e228)政府，是该国唯一的直辖省。\"},{\"id\":\"e483\",\"title\":\"忒奥西斯圣治领\",\"aliases\":[\"忒奥西斯\",\"圣治领\",\"圣领\"],\"body\":\"通称圣治领或圣领，位于大陆中央北部的[正教会](#idx-e181)神权共和国，首都[圣城索菲亚](#idx-e487)。1159年[索拉瑞斯](#idx-e429)开国[凯撒](#idx-e234)[阿利昂](#idx-e235)将帝国东部领土捐献给[大牧首](#idx-e148)而立，是正教会取得世俗领地后的政治实体。国土两百三十万平方[陆里](#idx-e387)，划为五个[都主教区](#idx-e153)，人口一千三百万。大牧首兼国家元首，[牧首厅](#idx-e166)为最高行政机构；直属[圣仪军](#idx-e302)兼掌国防与大型工程，[索菲亚大运河](#idx-e427)即其代表成果。\"},{\"id\":\"e485\",\"title\":\"潘克拉托\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)境内城市，[圣约翰都主教区](#idx-e489)的都教座城。[圣约翰](#idx-e123)殉道之地，[圣骸](#idx-e120)存于圣约翰大教堂。\"},{\"id\":\"e487\",\"title\":\"圣城索菲亚\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领首都，[大牧首](#idx-e148)及[牧首厅](#idx-e166)所在地。相传为[唯一神](#idx-e135)降临之处，本为小村，圣领建立及[大运河](#idx-e427)开通后扩张为兼具政治、宗教与经济中心地位的大都会。是大陆中部已知最大的[元素丰地](#idx-e52)，也是[正教会](#idx-e181)立都于此的重要自然前提；索菲亚大教堂藏有据称是[圣约翰](#idx-e123)升天时所钉[十字架](#idx-e127)的原木碎片。\"},{\"id\":\"e489\",\"title\":\"圣约翰都主教区\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领西南部[都主教区](#idx-e153)，以四[使徒](#idx-e126)之首[圣约翰](#idx-e123)命名，辖存有圣约翰[圣骸](#idx-e120)的[潘克拉托](#idx-e485)等地。\"},{\"id\":\"e492\",\"title\":\"西比尔平原\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领所在的温带半干旱草原，地势平坦、天然水源匮乏，[索菲亚大运河](#idx-e427)贯通前农业条件相当有限；北延至[北门湾](#idx-e413)，是大陆南北贸易的关键咽喉。其南部于[二战](#idx-e269)后尽归[索拉瑞斯](#idx-e429)，后为索菲亚大运河纵切为二；运河以东的土地依[三战](#idx-e270)《[卡斯特鲁姆和约](#idx-e275)》归[阿布丹提亚](#idx-e452)，交接至今悬置，是阿索两国博弈的核心争议。\"},{\"id\":\"e493\",\"title\":\"运河仪所\",\"aliases\":[],\"body\":\"坐落于[忒奥西斯](#idx-e483)圣领领土最北端、[索菲亚大运河](#idx-e427)与[北门湾](#idx-e413)交汇入口处的机构，是[牧首厅](#idx-e166)对大运河实施管理的最前沿。承担通行审核与海水除盐双重职能，常驻[神启魔法](#idx-e4)师持续以水元素魔法析出注入运河的海水盐分。其除盐作业常年施法却从未引发可观测的元素[疏化](#idx-e37)，已成为[魔元素动力学](#idx-e29)的专项研究课题。\"},{\"id\":\"e494\",\"title\":\"艾瑟瑞姆王国\",\"aliases\":[],\"body\":\"位于大陆西南部的封建君主制国家，首都[阿斯托利亚](#idx-e495)，领土环抱[坠星湖](#idx-e501)。源出西诺拉尼亚黑暗时期南下避难的[星术](#idx-e7)学者聚落，十一世纪末[塔利瑞安](#idx-e218)联合十二城邦创建[大星术研究院](#idx-e226)，十三世纪前叶塔利兰娜受推举加冕为初代女王。国土约四百二十万平方[陆里](#idx-e387)，由[王冠领地](#idx-e248)、四大伯爵封邑与[特别仪式区](#idx-e244)构成，人口约一千八百万。以星术立国，[王家研究院](#idx-e249)[天星首席](#idx-e247)永由君主兼任，传统意义的[施法者](#idx-e36)占人口逾半。\"},{\"id\":\"e495\",\"title\":\"阿斯托利亚\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)首都，位于[坠星湖](#idx-e501)南端[瑟蒂尔河](#idx-e499)出湖处，由[大陆历](#idx-e346)894年南下避难的[星术](#idx-e7)学者聚落发展而成，[王家研究院](#idx-e249)即设于此。城名源出[星空学派](#idx-e6)早期所用的 Astralis（\\\"属星的\\\"），后世音变作 Astoria，旧拼法今仅见于研究院的仪式文书。\"},{\"id\":\"e499\",\"title\":\"瑟蒂尔河\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)境内河流。由[坠星湖](#idx-e501)南端出发，向南流经艾瑟瑞姆注入[大星洋](#idx-e415)，首都[阿斯托利亚](#idx-e495)位于其北端出湖处。\"},{\"id\":\"e501\",\"title\":\"坠星湖\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)的地理中心，首都[阿斯托利亚](#idx-e495)位于其南端出湖口。[索尔河](#idx-e447)自[索拉瑞斯](#idx-e429)方向注入湖北端，[瑟蒂尔河](#idx-e499)由南端流出南向[大星洋](#idx-e415)；湖运依托[星术](#idx-e7)船只，是沿岸城市群最重要的内部贸易路线。\"},{\"id\":\"e502\",\"title\":\"卡帕尼诸公联合\",\"aliases\":[\"卡帕尼\",\"卡帕尼联邦\"],\"body\":\"又称卡帕尼联邦，位于大陆南部群岛的公国联邦制国家，由四成员公国与[北部特别贸易区](#idx-e505)组成，四公国各有首府，联邦首都为[阿卡帕尼](#idx-e503)公国的[伊索拉韦尔德](#idx-e516)。1356年[第二次阿索战争](#idx-e269)后，四公爵于[米德可尔](#idx-e512)会晤宣布脱离[阿布丹提亚](#idx-e452)独立。国土约二百五十万平方[陆里](#idx-e387)，散布于七十八座岛屿，人口约九百八十万。联邦以商贸与金融立国，外交奉行离岸平衡，热带群岛旅游业亦非常发达。\"},{\"id\":\"e503\",\"title\":\"阿卡帕尼\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一，由同名公爵世袭领有，核心领地为[阿卡帕尼岛](#idx-e504)，首府[伊索拉韦尔德](#idx-e516)亦为联邦首都。\"},{\"id\":\"e504\",\"title\":\"阿卡帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)群岛南部主岛区的核心岛屿之一，与[梅尔帕尼岛](#idx-e510)合计聚居全联邦逾半人口。\"},{\"id\":\"e505\",\"title\":\"北部特别贸易区\",\"aliases\":[\"特贸区\",\"北部特贸区\"],\"body\":\"[卡帕尼联邦](#idx-e502)于1382年于群岛北部岛链设立的特别经济区，由五十八座岛屿及[自由港](#idx-e344)组成，适用独立的[特区商法典](#idx-e245)与优惠贸易税率，设[管理局](#idx-e231)与[仲裁所](#idx-e259)自治，是大陆各国商人自由设立分部开展贸易的核心地带，也是联邦金融机构最密集之处。\"},{\"id\":\"e510\",\"title\":\"梅尔帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)群岛南部主岛区的核心岛屿之一，与[阿卡帕尼岛](#idx-e504)合计聚居全联邦逾半人口。\"},{\"id\":\"e512\",\"title\":\"米德可尔\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)境内地名。1356年[第二次阿索战争](#idx-e269)后，卡帕尼四公爵于此会晤宣布建立诸公联合，是联邦独立的历史象征地点。\"},{\"id\":\"e516\",\"title\":\"伊索拉韦尔德\",\"aliases\":[\"伊索拉\"],\"body\":\"[卡帕尼诸公联合](#idx-e502)首都，通称伊索拉，同时是[阿卡帕尼](#idx-e503)公国首府，四公国的政治核心所在地。当地作坊以镀银工艺见长，[索利亚商会](#idx-e338)创办于此。\"},{\"id\":\"e517\",\"title\":\"尼希尔伊玛目酋邦\",\"aliases\":[\"尼希尔\",\"尼希尔酋邦\"],\"body\":\"通称尼希尔酋邦，位于大陆西北角沙漠绿洲与两河流域的神权部落联邦国家，首都[阿尔努尔](#idx-e518)。五世纪[萨阿尔血王朝](#idx-e539)覆灭后，诸部酋长于阿尔努尔会盟，推举诸神大祭司为[伊玛目教长](#idx-e199)，成立酋邦。尼希尔国土五百八十万平方[陆里](#idx-e387)，由[诸神圣土](#idx-e202)与八部落领地构成，人口约一千八百万。酋邦是当今大陆唯一合法保有奴隶制的国家，社会等级高度固化。\"},{\"id\":\"e518\",\"title\":\"阿尔努尔\",\"aliases\":[],\"body\":\"[尼希尔伊玛目酋邦](#idx-e517)首都兼伊玛目城，位于两河流域核心地带，属[教长](#idx-e199)直辖的[诸神圣土](#idx-e202)。422年诸部酋长于此会盟建立部落联邦体制、推举首任伊玛目教长；城中六神各有神庙，另有教长主持全酋邦最隆重仪典的[大神庙](#idx-e186)，[酋长会议](#idx-e239)亦每年在此召开。\"},{\"id\":\"e519\",\"title\":\"哈亚特河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)两河之东河，发源于[冠脊山脉](#idx-e419)西脉北麓的积雪融水，自南向北流经酋邦西部，于[塔巴特](#idx-e523)与[纳赫尔河](#idx-e520)交汇后入[凛冰洋](#idx-e423)。其洪汛带来上游冲积土并补充土壤水分，随洪水消退而展开的播种是全酋邦农业的年度起点。\"},{\"id\":\"e520\",\"title\":\"纳赫尔河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)两河之西河，发源于[索拉瑞斯](#idx-e429)境内的[镜心湖](#idx-e436)，自南向北流经酋邦西部，于[塔巴特](#idx-e523)与[哈亚特河](#idx-e519)交汇。因源头在索拉瑞斯境内，诸神信仰第一季的西祭典历来只能在靠近南边境的城市勉强举行，这也是尼索边境关系长期恶劣的原因之一。\"},{\"id\":\"e521\",\"title\":\"沙阿万大魔矿\",\"aliases\":[\"大魔矿\"],\"body\":\"位于[尼希尔](#idx-e517)东部沙阿万沙漠地下，全大陆最大的单一[魔矿](#idx-e71)产地，年产量占大陆总量逾半，[高品级魔矿](#idx-e65)更占大陆产出八成以上，几乎构成事实垄断。矿井多由[神遴者](#idx-e412)以[秘术](#idx-e3)开凿，此后的采掘、支护、排水与转运则由奴隶以常规工具承担。各国对尼希尔的结构性经济依赖即根源于此。\"},{\"id\":\"e522\",\"title\":\"沙阿万大沙漠\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)东部广袤沙漠，是大陆最严酷的干旱地带，地表资源匮乏，昼夜温差可超三十[星度](#idx-e395)，仅有[冠脊山脉](#idx-e419)北脉北麓发源的两条小型沙漠河流维系着若干绿洲；地下则蕴藏[沙阿万大魔矿](#idx-e521)。\"},{\"id\":\"e523\",\"title\":\"塔巴特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)西部[纳赫尔河](#idx-e520)与[哈亚特河](#idx-e519)的交汇处，是两河流域的重要节点，两河在此汇合后继续北行入[凛冰洋](#idx-e423)。\"},{\"id\":\"e524\",\"title\":\"希尔文诺\",\"aliases\":[],\"body\":\"大陆精灵族裔及其文明与家园的统称，位于[冠脊山脉](#idx-e419)间的封闭盆地，由二十余个[氏族](#idx-e211)部落构成，最大聚落为[大圣树](#idx-e214)所在的[希尔文尼亚](#idx-e527)。其实际控制面积以大森林为界约一百二十万平方[陆里](#idx-e387)，人口一般认为不超过一百万。制度植根于大圣树信仰，每三十年召开[万叶庭](#idx-e213)全体表决，[叶络枢机院](#idx-e216)理日常行政与对外事务。1132年与人类首次接触，此后长期保持中立与封闭，被各国视为大陆事务的天然缓冲区与仲裁者。\"},{\"id\":\"e525\",\"title\":\"葛林沃尔克\",\"aliases\":[],\"body\":\"大陆东北角地区，由南北两支山脉夹峙高山密林构成，北部为雪原冰川。是大陆地理信息最匮乏的区域，据传其可能存在智慧种族与独立的魔法体系，但学界均无可靠资料。\"},{\"id\":\"e526\",\"title\":\"卡里司泰\",\"aliases\":[],\"body\":\"[冠脊山脉](#idx-e419)东南支脉中部、[希尔文诺](#idx-e524)与[忒奥西斯](#idx-e483)边境处的城市，位于[林缘议厅](#idx-e276)以东不远，是全大陆唯一的[自由城市](#idx-e261)。行政上不受任何人类政权管辖，由各国贸易机构负责人与希尔文诺精灵特别代表组成的[城务会](#idx-e222)共同治理，须保持完全去武装化且不具外交主体地位。职能集中于贸易运输与货物仓储，亦是大陆学者旅居考察、各方非正式接触之所，更是多数[落叶精灵](#idx-e411)进入人类社会的第一站；艾瑟瑞姆[王家研究院](#idx-e249)在此设有特别研究所。\"},{\"id\":\"e527\",\"title\":\"希尔文尼亚\",\"aliases\":[],\"body\":\"[希尔文诺大圣树](#idx-e214)所在之地，精灵族规模最大的聚居点，[万叶庭](#idx-e213)与[叶络枢机院](#idx-e216)所在。据推测是大陆最优越的[元素丰地](#idx-e52)之一。\"},{\"id\":\"e528\",\"title\":\"希尔文诺大森林\",\"aliases\":[],\"body\":\"精灵族世代定居之地，坐落于[冠脊山脉](#idx-e419)北脉与东南脉合围而成的山间盆地，是大陆封闭程度最高的区域之一，实际控制面积约一百二十万平方[陆里](#idx-e387)。山脉双重合围造就封闭湿润的气候，孕育大量大陆其他地区所没有的特有动植物；盆地开口朝向东南，东南脉中部的天然隘口是[林缘议厅](#idx-e276)所在地。\"},{\"id\":\"e532\",\"title\":\"冠阳\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之首，[星空学派](#idx-e6)完整名\\\"主序·冠阳\\\"，即太阳。[源星](#idx-e56)属权威、创造与审判；[正教](#idx-e146)神学中象征[唯一神](#idx-e135)，对应[仪式历](#idx-e361)[圣神日](#idx-e358)与[通用历](#idx-e368)日曜日。\"},{\"id\":\"e533\",\"title\":\"烬铸星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"熔炉·烬铸星\\\"。[源星](#idx-e56)属转化、破坏与锻造，常被视为天球之上的锻造炉象征；[正教](#idx-e146)神学上象征[圣约瑟](#idx-e124)，对应[烬曜日](#idx-e351)。\"},{\"id\":\"e539\",\"title\":\"萨阿尔血王朝\",\"aliases\":[],\"body\":\"古代[尼希尔](#idx-e517)地区存在的政权，由掌握[秘术](#idx-e3)的萨阿尔部落于[大陆历](#idx-e346)元前二世纪建立。该部自[沙阿万大沙漠](#idx-e522)西侵，用八年统一西尼希尔诸部，王朝延续至五世纪。其以自身信仰强行替代西尼希尔原有神话体系，奠定了尼希尔日后的诸神信仰与政教结构。史籍普遍估算，王朝治下因屠杀或献祭而死者逾四百万。该王朝在五世纪大起义中覆灭，但其制度主体却被422年的[阿尔努尔](#idx-e518)会盟所承袭。\"},{\"id\":\"e541\",\"title\":\"索拉尔王国\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)的前身，于西诺拉尼亚[黑暗时代](#idx-e273)中崛起的王国。1159年，索拉尔国王[阿利昂](#idx-e235)统一西大陆诸国、受牧首册封为首位[龙裔凯撒](#idx-e234)，索拉瑞斯帝国由此建立。现代通用度量衡的长度单位[步米](#idx-e378)与[陆里](#idx-e387)即源自索拉尔王国的[军团](#idx-e294)行军传统。\"},{\"id\":\"e544\",\"title\":\"汐月\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"银杯·汐月\\\"，即月亮。[源星](#idx-e56)属容纳、精神与教导；[正教](#idx-e146)神学上象征[圣约翰](#idx-e123)，对应[月曜日](#idx-e376)。艾瑟瑞姆[星历](#idx-e371)即以其盈亏循环为月。\"},{\"id\":\"e548\",\"title\":\"织虹星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"脉生·织虹星\\\"。[源星](#idx-e56)属修复、治疗与幻象；[正教](#idx-e146)神学上象征[圣保罗](#idx-e119)，对应[虹曜日](#idx-e348)。\"},{\"id\":\"e549\",\"title\":\"仲裁星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"律令·仲裁星\\\"，是星空中最亮且运动最明显的三颗星体之一。[源星](#idx-e56)属秩序、守护与契约；[正教](#idx-e146)神学上象征[圣伊琳娜](#idx-e122)，对应[裁曜日](#idx-e345)。\"}]}}]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"12:I[27201,[\"/Nurania/next/static/chunks/ff1a16fafef87110.js\",\"/Nurania/next/static/chunks/0bd6498bda341889.js\"],\"IconMark\"]\na:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"政治概述 | The Politics\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"纪念塞勒内斯·尤里梅尔诞辰150周年系列文集\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/Nurania/icon.svg?icon.986a92ce.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L12\",\"3\",{}]]\n"])</script></body></html>
