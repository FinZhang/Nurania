邦以经济实力为基础的政治秩序。外交方面，卡帕尼长期奉行灵活的离岸平衡政策，与各国维持稳定贸易关系的同时刻意回避直接军事对抗。于此同时，联邦亦以其热带群岛景观与航海文化闻名大陆，旅游业发达。其北部岛链素有“[卡帕尼千岛群星](#idx-e403)”的美称，是各国权贵阶层青睐的度假胜地之一。\n\n### 历史\n\n### 气候地理\n\n联邦全境由七十八座岛屿构成，分为两个地理区域。南部主岛区由六个主岛与十四个周边小岛组成，是四公国的核心领地，地势整体平坦，仅有少量丘陵；北部岛链由五十八座岛屿散布于翡翠海峡南缘，即\"卡帕尼千岛群星\"，近岸水文条件优越，港口四季可用，南北走向的风向与洋流便于四季货运，是联邦成为大陆航运枢纽的自然基础。群岛陆地面积有限，可耕地相当稀缺，境内不存在任何规模性矿产资源。北部主岛上存在若干小规模河流，主要功能为本地香料种植的灌溉与岛内短途运输。\n\n联邦全境处于热带，终年炎热潮湿，是大陆气候最温暖的地区。群岛西南面大星洋、东面晨风海、北面翡翠海峡三面暖海的持续蒸发提供充沛水汽，使群岛气候高温湿热而不干烤，气温极值远较内陆地区温和。季节以降水多寡区分：旱季晴天多、风浪相对平稳，是贸易航运与旅游的黄金窗口；雨季降水集中，台风风险显著上升，同时也是群岛香料作物的生长旺盛期。季节性台风是联邦最重要的天气风险，既是海运贸易的最大威胁，也是联邦航海技术与船型设计高度发展的自然动因。\n\n香料是联邦最具代表性的本地物产，南部主岛区热带高温高湿、全年无霜、岛屿富矿质土壤的条件组合是胡椒、豆蔻等热带香料作物的理想生境，大陆内地国家难以复制这一条件，构成联邦香料贸易的天然壁垒。近海海域出产珍珠与贝壳等装饰性水产，依赖长年温暖清澈的热带近海水域，与阿布丹提亚以大宗经济鱼类为主的捕捞业形成显著的产品层级差异。岛屿地形与热带土壤养分淋失限制了粮食作物的规模化种植，联邦粮食几乎完全依赖进口。\n\n### 魔法与技术\n\n联邦的[施法者](#idx-e36)约占总人口两成，来源可分为三类：其一是本地[公教会](#idx-e155)的[神启魔法](#idx-e4)师，与阿布丹提亚的情况类似，开放接受民间魔法技术委托；其二是艾瑟瑞姆官方驻联邦的[星空魔法](#idx-e7)师技术人员，受本国政策约束不得参与联邦境内的经济活动；其三是以独立身份移居卡帕尼的星空魔法师，多受雇于大型商会，主要从事对艾瑟瑞姆的贸易相关活动，行动上几乎不受宗教或政策限制。\n\n值得关注的是，部分被[工匠行会](#idx-e319)与商人行会雇佣的神启魔法师在参与生产时缺乏元素环境审查，由此带来的[疏化](#idx-e37)风险已在历史上若干贸易城市中留下可观测的疏化迹象。这一现象在联邦国内外均引发了广泛讨论，是否应当立法规范雇佣神启魔法师的魔法使用至今仍是卡帕尼政界与商界的争议议题。联邦长期有意引入[星术设备](#idx-e85)以扩大生产，但始终受制于艾瑟瑞姆的严格出口管制，这一局面在[第三次阿索战争](#idx-e270)后随艾瑟瑞姆外交政策的松动开始出现转机。\n\n联邦自身不设培养施法者的体系：神启魔法师出自公教会，星术师来自艾瑟瑞姆，魔法主要以委托与雇佣的形式取得。这一取得方式使联邦成为大陆上唯一同时倚重常规技术与外来魔法的国家，其常规技术未曾因魔法的存在而被挤占，而是与之并行发展。\n\n印刷是联邦最具代表性的技术，其源头与书籍无关。大陆历1401年，卡帕尼钟表工匠洛伦索·拉韦洛受草创未久的[卡帕尼银联](#idx-e325)委托，制成一种能够高效印制不同防伪工艺[汇票](#idx-e326)的器械，随即成为银联印制汇票的指定技术。洛伦索也因此常被视为尼卡特汇票防伪工艺的发明者。此后洛伦索将该器械改造为可排活字印制书籍的形态，后世称[拉韦洛印刷机](#idx-e404)，并随跨国贸易迅速扩散至大陆各地。大陆钟表业的中心同样位于卡帕尼联邦：各国城镇的[报时钟](#idx-e397)寻常可见，权贵所用的机械怀表则几乎全部出自卡帕尼作坊。\n\n卡帕尼其余制造业各门类的规模与产品详见经济节。就技术而言，最值得单独说明的是联邦的造船业：其规模与工艺略逊于索拉瑞斯，长处在于船型设计与远洋适航性能，[大舰队](#idx-e285)战舰专为海战设计的形制（详见政治与军事节）在他国的武装商船与运兵船上也并不存在。然而联邦最具优势的这一项技术，其原料并不掌握在自己手中：造船所需木材几乎全部来自索拉瑞斯，船型设计上的自主与船材供给上的依赖长期并存。\n\n引进是卡帕尼联邦技术的另一条来路，其中最为代表性的是从艾瑟瑞姆引进的星术相关技术，其受制于王国出口管制的情形已如前述。值得一提的是，经艾瑟瑞姆改为星术驱动的拉韦洛印刷机，在第三次阿索战争后随其开放政策反向输入联邦。\n\n联邦的工匠行会实行学徒制，配方与工序属行会秘密。卡帕尼对技术进步的态度是各国中最为积极的：联邦既不受宗教约束，亦不受军事体制的统一调配，新工艺往往直接对应新的利润空间，卡帕尼群岛因此长期以来是大陆新技术发明诞生最为旺盛的地区。\n\n### 人口，民族与文化\n\n联邦土地由商人与商会持有，农业与渔业生产以雇佣劳动合同为基础，城市制造业则以手工业行会组织生产或商人行会雇佣生产为主要形式。联邦在制度上对人口流动持开放态度，但受制于其他国家的管控现实，单方面的人口吸引效果有限。以财富为基础的社会结构使联邦劳动力市场相对灵活，是大陆最接近真正市场经济的国家。发达的商业活动与高频人口流动塑造了联邦复杂多元的民族结构，多语言混用在各大贸易港口是日常现象。\n\n### 政治与军事\n\n卡帕尼诸公联合是公国联邦制国家。联邦最高权力机构称**[四公联席会议](#idx-e243)**，由阿卡帕尼、梅尔帕尼、卡恩顿与汶托尼亚四位公爵组成，协商联邦层面的外交、军事与贸易事务。会议设**[首席发言人](#idx-e242)**一职，由四公爵每五年轮换担任，现任首席发言人为梅尔帕尼公爵**诺维雅三世**（任期 1502–1507）；联席会议表决出现平局时，首席发言人握有最终裁决权。联席会议每年定期召开两次，会址设于首席发言人的公爵领境内；遇紧急事态，也可由首席发言人临时召集。联邦不设常设的中央行政与司法机构，跨公国事务均在联席会议或其附属会议上协商完成。\n\n学界普遍认为，联邦独立以来已完成政治路线转型——四公国体制与公爵头衔更多是历史传统与主权象征的延续。四公爵同时担任[四大商会](#idx-e336)主席，以世袭商业寡头家族的形式联合议事，国家战略以维持大陆贸易核心地位与商业利润为首要导向。\n\n#### 公国与特贸区\n\n各公爵在本公国内拥有完全的行政与司法权力，其他公爵无权干涉其内政。公爵之位以年龄顺位传承，男女皆可继承；若当前公爵无直系继承人，则循上代公爵支系按亲疏远近依次顺推，历史上尚未出现过爵位无人可继承的情况。公爵之下不设分封贵族——独立之初，四公爵借动荡时机废除了阿布丹提亚统治时期的各级贵族体系，改由公国直辖诸城市与乡村，以更适于贸易运作的结构取代传统封建层级。\n\n联邦北部岛链特贸区具有相对独立的地位，适用专门的特区商法典而非各公国法系。特贸区设**[管理局](#idx-e231)**（承担立法与行政职能）及下属的**[仲裁所](#idx-e259)**（承担司法职能），管理局由特贸区内各卡帕尼商会分部选派代表组成，最高长官称**管理局主席**，直接向四公联席会议负责。特贸区无独立的外交与军事权力，相关事务由联邦统一负责。\n\n#### 外交立场\n\n卡帕尼的外交以商业利益为首要导向，长期奉行离岸平衡策略——维持大陆主要势力之间的相互制衡，防止任何一方主导全局，同时尽可能与各国保持可运作的贸易关系。\n\n对阿索两国，诸公联合刻意保持等距：为双方居间转口、提供战后重建融资，如今更是两方备战物资的重要来源，却始终回避正式的军事表态。卡帕尼与索拉瑞斯历史上长期存在边境摩擦，但未升级为正式冲突；三战之后，阿布丹提亚持续指责联邦吸纳其失地农奴，两国关系明显僵化。\n\n艾瑟瑞姆方面，三战双方商贸往来随星术设备与技术人才的大量引进而显著升温，但持续的技术外流令王国渐生戒备，战略互信不升反降。对[忒奥西斯](#idx-e483)，卡帕尼维持基本礼遇——[大运河](#idx-e427)航线是[魔矿](#idx-e71)及其他诸多货品跨国贸易的关键通道，因此联邦对圣领态度格外审慎。\n\n卡帕尼是[尼希尔](#idx-e517)最大的贸易伙伴，每年大量进口沙阿万魔矿并转销大陆各国；在大陆诸国之中，对尼希尔奴隶制的外交批评也以卡帕尼最为克制，基本仅限于表态。对[希尔文诺](#idx-e524)，诸公联合则纯以贸易相待，往来可观，不涉政治主张。\n\n#### 军事体制\n\n联邦是大陆唯一拥有成熟海军体制的国家。四公国各自编制一支舰队，合称**大舰队**，设**舰队司令**一职统率全军，由首席发言人任命，任期五年，与之同步更换。与其他国家以武装商船或运兵船充当水上力量的做法不同，大舰队战舰专为海战设计：配备适于海上作战的[星术火炮](#idx-e80)，装有以[仲裁星术](#idx-e58)运作的魔法防护罩，并随船配有受过专业海战训练的神启魔法师。水手战时由四公国征调，操炮星术师与随船魔法师则为常备专业人员。\n\n联邦无独立陆军编制，陆战单位为大舰队下属的**[海军陆战队](#idx-e288)**，含常规士兵与魔法师部队。独立以来联邦从未参与大陆国际战争，大舰队目前主要承担翡翠海峡的贸易护航与海盗清剿任务。\n\n#### 当代政治格局\n\n联邦当前外部压力主要来自两个方向：阿布丹提亚持续就人口外流问题施压，艾瑟瑞姆则因星术设备与技术人才不断流入而对其研究动向高度警惕，两国与联邦的关系均有所降温。联邦内部也因此存在对全面推进[蚀刻](#idx-e76)技术研究保持审慎的声音，以防止与邻国和贸易伙伴的外交关系进一步恶化。\n\n### 经济\n\n卡帕尼的实业规模相较大陆主要强国并不突出，但作为大陆跨国贸易的核心枢纽，其进口原材料种类极为丰富，由此催生了覆盖范围较广的加工产业。香料产业是联邦最重要的本地制造业支柱，卡帕尼群岛出产的多种热带香料驰名大陆，香料粗加工及化妆品、食品佐料等相关制品是联邦最大的贸易顺差来源。水产产业以珍珠、贝壳等工艺品与装饰首饰的生产为特色，并辅以海产油脂类制品。联邦的造船业亦有一定水准，但与索拉瑞斯相比仍略逊一筹。印刷业同样相当发达，能够为票据设计并加工复杂的防伪工艺，是卡帕尼银联尼卡特汇票防伪体系的重要技术支撑。\n\n服务业是联邦经济最具决定性优势的部门。金融与贸易服务业冠绝大陆，各类集市、[交易所](#idx-e323)、经济中介、保险商与银行机构在联邦高度发达，构成整个大陆跨国商业活动的基础设施；旅游业依托\"卡帕尼千岛群星\"的热带群岛景观，长期吸引大陆各国权贵阶层，相关餐饮、住宿与休闲服务产业随之高度发达。\n\n#### 货币、金融与财政\n\n联邦流通货币为**[卡帕尼尼卡特铸币](#idx-e324)**（简称尼卡特）与**[尼卡特分铸币](#idx-e331)**，兑换比率为一比一百，是大陆无可置疑的国际通用货币。尼卡特以含金量较高的合金铸造，辅以复杂铸造工艺防伪。其历史源头可追溯至特贸区设立后由四公国联合发行的统一贸易货币，随跨国贸易扩张逐步渗透大陆各地，四公国随后相继废弃各自旧有货币，全面推行尼卡特。**卡帕尼银联汇票**是与尼卡特铸币并行流通的重要结算工具，由四大商会共同组建的卡帕尼银联信用背书发行，持票人可在任意银联成员银行兑换等额尼卡特，以[丹提亚纸](#idx-e316)制作并辅以联邦发达印刷业的防伪工艺，学界普遍认为其已具备事实上的货币地位，是当前大陆跨国贸易中最广泛使用的结算凭证。\n\n卡帕尼拥有大陆最发达的金融体系。四公国各自直属的四大商会均设有独立银行网络，与众多中小商会银行共同组成卡帕尼银联，支持[存票](#idx-e314)、[债票](#idx-e343)与汇票的跨行自由存取，并统一负责尼卡特汇票的发行与管理。上述各类票据均可在二级市场转让，联邦二级市场极为发达，尤以特贸区的交易所为甚。除常规储蓄与借贷业务外，卡帕尼还发展出大陆其他国家几乎没有的金融业务形态：**[保险业](#idx-e312)**涵盖贸易险与年金；**[家族信托](#idx-e322)**服务于大陆各国权贵阶层的财富传承需求；**[洛卡金票](#idx-e330)**是卡帕尼独有的投资凭证，可用于投资特定商会或特定贸易活动，持有人依出资比例享有分红与收益分配，可在交易所自由买卖，构成大陆最接近原始股票市场的交易机制。联邦依托尼卡特的国际货币地位与汇票体系的广泛流通，积累了可观的跨国财富。\n\n财政收入由三部分构成：民众产业税、商会商业税，以及贸易税。特贸区对进出港贸易统一征收贸易税，税率相当优惠以维持贸易吸引力，卡帕尼本地商会享有更低的优惠税率，特贸区税收收入按各公国贡献比例分配，是四公国政府的重要收入来源之一。四公国另各自发行[公债](#idx-e320)，可在特贸区的交易所自由买卖。\n\n#### 商业与贸易\n\n卡帕尼拥有全大陆最发达的商会体系，全联邦大小商会超过三十家，几乎均在特贸区设有分部，各商会银行网络共同组成卡帕尼银联，是尼卡特汇票获得近似货币地位的制度基石。其中最重要的**四大商会**分属四公国，由四公爵历史上直接出资创立，在大陆各国口岸均有分布。联邦各地亦存在产业工匠行会，与当地商会的合作关系在大陆诸国中最为紧密。\n\n北部特贸区是联邦商业运作的核心地带，翡翠海峡南缘的北部岛链上集中了联邦最密集的商会分部与金融机构，适用特区商法典与优惠贸易税率，大陆各国商人均可在此自由设立分部开展贸易。核心港口波托马利是整个大陆南北贸易的关键枢纽。\n\n联邦以海运为主，翡翠海峡航线是对外贸易的主轴；群岛近海海运连接各岛聚落，是境内最重要的贸易通道；境内路网与河运亦相当完善。\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$2\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"min-h-[60vh] flex items-center justify-c \"currentSlug\":\"诸国列志 Chorography of the Nations/卡帕尼\",\"article\":{\"slug\":\"诸国列志 Chorography of the Nations/卡帕尼\",\"title\":\"卡帕尼诸公联合\",\"titleEn\":\"The United Principalities of Kapani\",\"content\":\"$11\",\"indexTerms\":[{\"id\":\"e2\",\"title\":\"秘术式\",\"aliases\":[],\"body\":\"[尼希尔秘术](#idx-e3)施法所用的特殊仪式，将祭品[构成元素](#idx-e18)解离为[无属性元素流](#idx-e42)并转化为魔法。\"},{\"id\":\"e3\",\"title\":\"尼希尔秘术\",\"aliases\":[\"秘术\"],\"body\":\"[尼希尔](#idx-e517)统治阶级独有的魔法体系，简称秘术，以等价交换为原理，解离祭品的[构成元素](#idx-e18)为力量。\"},{\"id\":\"e4\",\"title\":\"神启祷言\",\"aliases\":[\"祷言\",\"神启魔法\"],\"body\":\"[神启学派](#idx-e5)对自身魔法的称呼，简称祷言；亦名神启魔法。\"},{\"id\":\"e5\",\"title\":\"神启学派\",\"aliases\":[],\"body\":\"以[唯一神](#idx-e135)所借权柄使用魔法的学派，编织[术式](#idx-e38)调动环境中游离态的[四大元素](#idx-e39)。\"},{\"id\":\"e6\",\"title\":\"星空学派\",\"aliases\":[],\"body\":\"以[第五元素](#idx-e17)以太的显现与外化解释魔法的学派，[内化](#idx-e30)以太于体内再[显化](#idx-e44)为魔法。\"},{\"id\":\"e7\",\"title\":\"以太星术\",\"aliases\":[\"星术\",\"星空魔法\"],\"body\":\"[星空学派](#idx-e6)对自身魔法的自称，简称星术；亦名星空魔法。狭义专指各类魔法对应的[大星轨](#idx-e16)走势。\"},{\"id\":\"e8\",\"title\":\"自然魔法\",\"aliases\":[\"精灵魔法\",\"圣树魔法\"],\"body\":\"精灵族与生俱来的法术能力，源自与[大圣树](#idx-e214)的契约连接；亦称精灵魔法、圣树魔法。\"},{\"id\":\"e9\",\"title\":\"奥韦纳尔·安柯伦坦\",\"aliases\":[\"安柯伦坦\"],\"body\":\"艾瑟瑞姆[天星师](#idx-e246)，1304年提出智慧生物出生时的[大星轨](#idx-e16)图像决定其[仪式星轨](#idx-e49)特征，且该特征恰合[源星](#idx-e56)五分类，[丝黛兰尔](#idx-e40)的分类法由此成为公认标准。\"},{\"id\":\"e13\",\"title\":\"裁闭术\",\"aliases\":[],\"body\":\"利用[界星石](#idx-e66)将局部空间环境状态固定的[星术](#idx-e7)，[仲裁星术](#idx-e58)的一种，常用于稳定温度。须以[玛娜](#idx-e26)供给[回路](#idx-e75)维持。\"},{\"id\":\"e16\",\"title\":\"大星轨\",\"aliases\":[\"天道星轨\"],\"body\":\"[天星五政](#idx-e41)在天球上的轨迹，代表宇宙中[以太](#idx-e17)流的流向；亦称天道星轨。\"},{\"id\":\"e17\",\"title\":\"第五元素\",\"aliases\":[\"以太\"],\"body\":\"构成群星与其间空间（宇宙）的物质，通称以太，永恒不朽；稀薄存在于大地之上，[星空魔法](#idx-e7)师可将其蓄积体内，是星术的能量来源。\"},{\"id\":\"e18\",\"title\":\"构成元素\",\"aliases\":[],\"body\":\"构成实体事物的四大[自然元素](#idx-e39)，不响应[祷言](#idx-e4)[术式](#idx-e38)。通过[秘术式](#idx-e2)可将其解离。\"},{\"id\":\"e20\",\"title\":\"结界\",\"aliases\":[],\"body\":\"[仲裁星术](#idx-e58)所构造的防护或隔离[术式](#idx-e38)，[裁闭术](#idx-e13)是其中的一种；通常依靠[界星石](#idx-e66)建立。\"},{\"id\":\"e23\",\"title\":\"精神力\",\"aliases\":[],\"body\":\"编织[祷言](#idx-e4)[术式](#idx-e38)所凭的能力，可经后天训练提高，只能依靠时间缓慢恢复。\"},{\"id\":\"e25\",\"title\":\"洛林阶运\",\"aliases\":[],\"body\":\"特定工艺的[星轨蚀刻](#idx-e76)（如旧式三分耦式蚀刻法）所致的[玛娜](#idx-e26)自然向外部流出的矿界面层现象。\"},{\"id\":\"e26\",\"title\":\"玛娜\",\"aliases\":[\"魔力\"],\"body\":\"[星空学派](#idx-e6)语境下[内化](#idx-e30)后的[以太](#idx-e17)，即俗称的魔力；释放后无法自然恢复，须[星术](#idx-e7)师冥想缓慢补充。\"},{\"id\":\"e29\",\"title\":\"魔元素动力学\",\"aliases\":[],\"body\":\"[神启学派](#idx-e5)中研究元素流动与[疏化](#idx-e37)机理的学科，由[神启魔法](#idx-e4)学者菲略奥斯等人奠基。\"},{\"id\":\"e30\",\"title\":\"内化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师于修习中将环境自由[以太](#idx-e17)汇入体内[仪式星轨](#idx-e49)的过程。\"},{\"id\":\"e36\",\"title\":\"施法者\",\"aliases\":[],\"body\":\"能够主动运用魔法的人口的统称，全大陆约占两成。\"},{\"id\":\"e37\",\"title\":\"疏化\",\"aliases\":[],\"body\":\"同一空间内反复施用[神启魔法](#idx-e4)后[自然元素](#idx-e39)恢复速率异常下降的现象，由神启魔法学者菲略奥斯提出。\"},{\"id\":\"e38\",\"title\":\"术式\",\"aliases\":[],\"body\":\"[神启魔法](#idx-e4)师以[精神力](#idx-e23)编织、临时改写自然法则的结构，是与[唯一神](#idx-e135)所立的单向契约。\"},{\"id\":\"e39\",\"title\":\"四大元素\",\"aliases\":[\"自然元素\"],\"body\":\"构成世界万物和游离在自然环境中的地、水、火、风元素，也称自然元素；唯游离态者可为[神启魔法](#idx-e4)调用。\"},{\"id\":\"e40\",\"title\":\"塔莉拉·丝黛兰尔\",\"aliases\":[\"丝黛兰尔\"],\"body\":\"[星空学派](#idx-e6)魔法先驱，著《[星术](#idx-e7)源流考》，首创以五颗天星对应五类魔法的[源星](#idx-e56)分类法，源星之名即出于此。\"},{\"id\":\"e41\",\"title\":\"天星五政\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)最重要的概念之一，指[冠阳](#idx-e532)、[汐月](#idx-e544)、[仲裁星](#idx-e549)、[烬铸星](#idx-e533)、[织虹星](#idx-e548)五颗天体。\"},{\"id\":\"e42\",\"title\":\"无属性元素流\",\"aliases\":[],\"body\":\"[秘术式](#idx-e2)解离祭品[构成元素](#idx-e18)后所得的能量形态，其性质仍是大陆魔法学界研究的未解课题。\"},{\"id\":\"e44\",\"title\":\"显化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师控制体内[以太](#idx-e17)流运转特定[大星轨](#idx-e16)、将[玛娜](#idx-e26)转为有色状态并外放的过程。\"},{\"id\":\"e48\",\"title\":\"血契\",\"aliases\":[],\"body\":\"人类与巨龙缔结的契约，双方精神世界互相开放，可转移龙族[术式](#idx-e38)的[精神力](#idx-e23)消耗。\"},{\"id\":\"e49\",\"title\":\"仪式星轨\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师于体内仿照[大星轨](#idx-e16)建立的[以太](#idx-e17)[回路](#idx-e75)，各部位对应一天宫。\"},{\"id\":\"e52\",\"title\":\"元素丰地\",\"aliases\":[],\"body\":\"游离态[四大元素](#idx-e39)丰度明显高于大陆平均的天然区域，对[疏化](#idx-e37)有强韧抵抗力。\"},{\"id\":\"e56\",\"title\":\"源星\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师[丝黛兰尔](#idx-e40)在《星术源流考》中提出的星术五分类，对应[天星五政](#idx-e41)。\"},{\"id\":\"e58\",\"title\":\"仲裁星术\",\"aliases\":[],\"body\":\"以[仲裁星](#idx-e549)为[源星](#idx-e56)的一类[星术](#idx-e7)，主秩序、约束与原则，含施加守护、封印、[结界](#idx-e20)制造与契约构造等星术。\"},{\"id\":\"e61\",\"title\":\"动力炉\",\"aliases\":[],\"body\":\"大型[星术设备](#idx-e85)的供能核心，见于[魔偶](#idx-e83)、[巨像](#idx-e81)与[星术驿车](#idx-e87)等。\"},{\"id\":\"e63\",\"title\":\"二型衡台\",\"aliases\":[],\"body\":\"附设[界星石](#idx-e66)，利用[裁闭术](#idx-e13)固定称重环境温度的衡台，用于称量对温度变化敏感的物品（如[星元](#idx-e69)）。\"},{\"id\":\"e65\",\"title\":\"高品级魔矿\",\"aliases\":[],\"body\":\"元素储存率极高、可承受各种魔法加工工艺的[魔矿](#idx-e71)，八成以上产自沙阿万。\"},{\"id\":\"e66\",\"title\":\"界星石\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e73)制成的器件，[仲裁星术](#idx-e58)设备的核心原件之一，用途极为广泛。可检测与稳定局部环境、维持[回路](#idx-e75)与[结界](#idx-e20)、容许特定构型[星术](#idx-e7)运行，用于[二型衡台](#idx-e63)、星术锁、[星术灯](#idx-e78)开关、建筑保温等领域。\"},{\"id\":\"e69\",\"title\":\"洛林星元\",\"aliases\":[\"星元\"],\"body\":\"粗加工[魔矿](#idx-e71)晶体经[星轨蚀刻](#idx-e76)、注入[玛娜](#idx-e26)封装的[星术制品](#idx-e88)，通称星元，取名于洛林法蚀刻，可为小型[星术设备](#idx-e85)供能。\"},{\"id\":\"e71\",\"title\":\"魔法矿石\",\"aliases\":[\"魔矿\"],\"body\":\"对五大元素均具极高流通率与储存率的天然矿石，通称魔矿，是大陆最重要的战略资源。\"},{\"id\":\"e73\",\"title\":\"蚀刻魔矿\",\"aliases\":[],\"body\":\"经[星轨蚀刻](#idx-e76)的[魔矿](#idx-e71)，可按[回路](#idx-e75)结构储存[玛娜](#idx-e26)，并在触发时释放对应[星术](#idx-e7)。\"},{\"id\":\"e74\",\"title\":\"托兰瓦尔·洛林\",\"aliases\":[\"洛林\"],\"body\":\"艾瑟瑞姆[天星师](#idx-e246)，1125年首报可流通储存[以太](#idx-e17)的矿石并据以发明[星轨蚀刻](#idx-e76)；洛林法蚀刻为纪念其贡献而名，[洛林星元](#idx-e69)、[洛林阶运](#idx-e25)之名亦由此而来。\"},{\"id\":\"e75\",\"title\":\"星轨回路\",\"aliases\":[\"回路\"],\"body\":\"通过[蚀刻](#idx-e76)在[魔矿](#idx-e71)上建立的模仿[仪式星轨](#idx-e49)的通路，允许魔矿储存[玛娜](#idx-e26)，并在特定条件触发下释放对应[星术](#idx-e7)。\"},{\"id\":\"e76\",\"title\":\"星轨回路蚀刻\",\"aliases\":[\"蚀刻\",\"星轨蚀刻\",\"洛林法蚀刻\"],\"body\":\"于[魔矿](#idx-e71)表面蚀刻[仪式星轨](#idx-e49)[回路](#idx-e75)的技术，简称星轨蚀刻或蚀刻，为纪念发明人，又名洛林法蚀刻。1125年由艾瑟瑞姆[星术](#idx-e7)学者[托兰瓦尔·洛林](#idx-e74)发明，构成了[星术设备](#idx-e85)的基石。\"},{\"id\":\"e78\",\"title\":\"星术灯\",\"aliases\":[],\"body\":\"以[星术](#idx-e7)驱动的照明器具，有台灯、壁灯、顶灯等形制，在[艾瑟瑞姆王国](#idx-e494)境内已经几乎完全取代了常规照明用具（如油灯）。\"},{\"id\":\"e80\",\"title\":\"星术火炮\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[大舰队](#idx-e285)战舰装配的舰载火器，由操炮[星术](#idx-e7)师操作。\"},{\"id\":\"e81\",\"title\":\"星术巨像\",\"aliases\":[\"巨像\"],\"body\":\"[星术](#idx-e7)兵种的大型作战单位，通称巨像，由专精操作的星术师远距控制。\"},{\"id\":\"e83\",\"title\":\"星术魔偶\",\"aliases\":[\"魔偶\"],\"body\":\"以[蚀刻](#idx-e76)[回路](#idx-e75)驱动的小型[星术](#idx-e7)作战或劳作单位，通称魔偶，有农用魔偶、清扫魔偶等。\"},{\"id\":\"e85\",\"title\":\"星术设备\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e73)制成的各类器物的统称，自家用台灯至战场[巨像](#idx-e81)[动力炉](#idx-e61)，是艾瑟瑞姆高技术社会立国的物质基础。\"},{\"id\":\"e87\",\"title\":\"星术驿车\",\"aliases\":[],\"body\":\"以[动力炉](#idx-e61)驱动的陆上载具，行于艾瑟瑞姆城市内或城际道路。\"},{\"id\":\"e88\",\"title\":\"星术制品\",\"aliases\":[],\"body\":\"[星术设备](#idx-e85)所需半成品作为贸易品的称呼，[洛林星元](#idx-e69)为其典型代表。\"},{\"id\":\"e99\",\"title\":\"朝圣\",\"aliases\":[],\"body\":\"[正教](#idx-e146)信众沿既定路线前往[圣城索菲亚](#idx-e487)的虔修，是[圣领](#idx-e483)可观的收入来源。\"},{\"id\":\"e100\",\"title\":\"称义\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒持守信仰、按神的教诲生活而得免[宿债](#idx-e131)的全过程，自[洗礼](#idx-e136)始，至临终而成。\"},{\"id\":\"e104\",\"title\":\"大祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)学徒正式受任为神职的[圣事](#idx-e121)。\"},{\"id\":\"e106\",\"title\":\"告解\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒为自身罪行请求赦免的[圣事](#idx-e121)，可反复进行。\"},{\"id\":\"e107\",\"title\":\"公教\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰两大教派之一，1295年[教会大分裂](#idx-e160)后自[阿布丹提亚](#idx-e452)境内的[正教会](#idx-e181)独立而成，以[公教会](#idx-e155)为组织载体，是阿布丹提亚人口的第一大信仰。将[星空魔法](#idx-e7)一并纳入唯一神权柄、另尊保罗为第二先知；主张轻罪可凭虔信与[圣事](#idx-e121)自赦，审判之权唯神独有，故不设[审判庭](#idx-e171)建制并废除[诺万尼斯流放](#idx-e167)，对个人虔修的要求高于[正教](#idx-e146)；[季首弥撒](#idx-e109)与节庆均依[通用历](#idx-e368)。\"},{\"id\":\"e109\",\"title\":\"季首弥撒\",\"aliases\":[],\"body\":\"[正教](#idx-e146)于[仪式历](#idx-e361)各季首日，[公教](#idx-e107)于[通用历](#idx-e368)各季首日举行的规模略大于每周[弥撒](#idx-e113)的集体仪式。\"},{\"id\":\"e110\",\"title\":\"坚振\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中，标志[称义](#idx-e100)大体完成的[圣事](#idx-e121)，一生一次，须对教会有重大贡献或持守信仰足够长久。\"},{\"id\":\"e112\",\"title\":\"礼仪年\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中六季[弥撒](#idx-e113)与九大节庆构成的一整年宗教循环。\"},{\"id\":\"e113\",\"title\":\"弥撒\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)礼拜日举行的集体仪式，与每日的[日课](#idx-e117)同为[称义](#idx-e100)最重要的日常载体。\"},{\"id\":\"e114\",\"title\":\"冥界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，信徒死后安息、静候轮回之地。\"},{\"id\":\"e117\",\"title\":\"日课\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒每日的功课，与礼拜日[弥撒](#idx-e113)同为[称义](#idx-e100)的日常载体。\"},{\"id\":\"e119\",\"title\":\"圣保罗\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，最初的医者，司治愈与修复；对应[织虹星](#idx-e548)与[虹曜日](#idx-e348)。[公教](#idx-e107)另尊其为第二先知。\"},{\"id\":\"e120\",\"title\":\"圣骸\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下的圣徒遗骨，为[朝圣](#idx-e99)与教堂声望所系，如[潘克拉托](#idx-e485)大教堂所藏的[圣约翰](#idx-e123)圣骸。\"},{\"id\":\"e121\",\"title\":\"圣事\",\"aliases\":[],\"body\":\"指[正教](#idx-e146)与[公教](#idx-e107)六项圣事：[洗礼](#idx-e136)、[坚振](#idx-e110)、婚姻、[告解](#idx-e106)、[大祝职](#idx-e104)、[小祝职](#idx-e138)。\"},{\"id\":\"e122\",\"title\":\"圣伊琳娜\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，司秩序与契约；对应[仲裁星](#idx-e549)与[裁曜日](#idx-e345)，[圣领](#idx-e483)[伊琳娜圣银币](#idx-e341)以其得名。\"},{\"id\":\"e123\",\"title\":\"圣约翰\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之首，[正教](#idx-e146)唯一的先知与弥赛亚，司精神与教导；对应[汐月](#idx-e544)与[月曜日](#idx-e376)。\"},{\"id\":\"e124\",\"title\":\"圣约瑟\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，商会之圣，司转化、破坏与锻造；对应[烬铸星](#idx-e533)与[烬曜日](#idx-e351)，[圣约瑟商会](#idx-e335)以其得名。\"},{\"id\":\"e126\",\"title\":\"使徒\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e132)》记载中，随[唯一神](#idx-e135)降世传教的最初四人：约翰、伊琳娜、约瑟、保罗。\"},{\"id\":\"e127\",\"title\":\"十字架\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教会](#idx-e155)共用的宗教象征符号。正教十字架为四端，象征四元素权柄。[公教](#idx-e107)下端另加一横，四横端象征四元素，竖端象征[星术](#idx-e7)。\"},{\"id\":\"e130\",\"title\":\"四界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰神学的宇宙构成：[天界](#idx-e133)、[现界](#idx-e137)、[冥界](#idx-e114)、[虚界](#idx-e141)。\"},{\"id\":\"e131\",\"title\":\"宿债\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰神学中，人一出生便背负的亏欠。缘于唯一神所借予而非赐予的权柄，受惠者无人能置身账外。\"},{\"id\":\"e132\",\"title\":\"索菲亚圣典\",\"aliases\":[\"圣典\"],\"body\":\"[唯一神](#idx-e135)信仰的最高典籍，通称《圣典》，分《创世录》《弥赛亚记》《神言书》《箴言集》四福音与《预言书》。\"},{\"id\":\"e133\",\"title\":\"天界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，唯一神、圣徒与天使的居所。\"},{\"id\":\"e135\",\"title\":\"唯一神\",\"aliases\":[\"主\",\"神\",\"上帝\"],\"body\":\"唯一神信仰所奉的至高神，信徒亦称主、神或上帝，是宇宙的创造者、维系者与监督者，也是世间一切魔法力量的源头。\"},{\"id\":\"e136\",\"title\":\"洗礼\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒入教与[称义](#idx-e100)之始的[圣事](#idx-e121)，一生一次，象征认清并领受自身的[宿债](#idx-e131)。\"},{\"id\":\"e137\",\"title\":\"现界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中[四界](#idx-e130)之一，人类生息的世界。\"},{\"id\":\"e138\",\"title\":\"小祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)神职人员卸任、复为寻常信徒之礼，多见于年老体弱者。\"},{\"id\":\"e141\",\"title\":\"虚界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，天球与大地之外仍为虚所充满的空间，罪人与非正信者死后的去处。\"},{\"id\":\"e143\",\"title\":\"异端\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下，秉持不同教义解释相异的教派；就[正教](#idx-e146)而言[公教](#idx-e107)即当代最大异端。\"},{\"id\":\"e146\",\"title\":\"正教\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰两大教派之一，以[正教会](#idx-e181)为组织载体，为[索拉瑞斯](#idx-e429)与[忒奥西斯](#idx-e483)的国教。认[神启祷言](#idx-e4)为唯一神所授的权柄，[星空魔法](#idx-e7)则不在神权之列；一切罪无论大小均须经[告解](#idx-e106)方得赦免，并以神在[现界](#idx-e137)的代行者自任，设[审判庭](#idx-e171)严管神启魔法、以[诺万尼斯流放](#idx-e167)向神赎罪。历法与[礼仪年](#idx-e112)循环依[圣格里仪式历](#idx-e361)。\"},{\"id\":\"e147\",\"title\":\"传信厅\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)[牧首厅](#idx-e166)六分厅之一，分管外交。\"},{\"id\":\"e148\",\"title\":\"大牧首\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)最高元首、[忒奥西斯](#idx-e483)圣领国家元首，由[枢机主教团](#idx-e174)闭门选出，终身任期。\"},{\"id\":\"e149\",\"title\":\"大审判长\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)最高长官，由[枢机主教团](#idx-e174)任命，与[大牧首](#idx-e148)同为终身任期。\"},{\"id\":\"e150\",\"title\":\"第二次宗教改革\",\"aliases\":[],\"body\":\"十三世纪末谋求将[星术](#idx-e7)纳入神权的改革，失败后直接导致[教会大分裂](#idx-e160)。\"},{\"id\":\"e152\",\"title\":\"都主教\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)[都主教区](#idx-e153)长官，教阶在主教之上；与[大牧首](#idx-e148)同不得婚娶，别称[门徒](#idx-e165)。\"},{\"id\":\"e153\",\"title\":\"都主教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)最高一级行政区划和宗教管理区划，全境共五个，长官称[都主教](#idx-e152)。[卡帕尼](#idx-e502)和[索拉瑞斯](#idx-e429)亦设有都主教区，但不具备行政职能。\"},{\"id\":\"e154\",\"title\":\"督审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)教阶之一，位在[审判官](#idx-e169)之上；[审判所](#idx-e162)驻任长官、[审判分庭](#idx-e168)官员。[诺万尼斯流放](#idx-e167)须由审判分庭所属督审判官主刑。\"},{\"id\":\"e155\",\"title\":\"公教会\",\"aliases\":[],\"body\":\"1295年[阿布丹提亚](#idx-e452)境内[正教会](#idx-e181)独立所成立的教会，领袖称[宗主教](#idx-e183)，驻[波马里亚](#idx-e459)。\"},{\"id\":\"e157\",\"title\":\"公教总会\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)中枢，驻[阿布丹提亚帝国](#idx-e452)城市[波马里亚](#idx-e459)。\"},{\"id\":\"e160\",\"title\":\"教会大分裂\",\"aliases\":[],\"body\":\"1295年[第二次宗教改革](#idx-e150)失败后，[阿布丹提亚帝国](#idx-e452)境内[正教会](#idx-e181)宣布脱离[牧首厅](#idx-e166)独立，成立[公教会](#idx-e155)。\"},{\"id\":\"e161\",\"title\":\"教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)[都主教区](#idx-e153)下辖的最小一级行政区划，长官称主教。也是[正教会](#idx-e181)在大陆各国所划的宗教事务上的最小管理层级。\"},{\"id\":\"e162\",\"title\":\"教区审判所\",\"aliases\":[\"审判所\"],\"body\":\"[审判庭](#idx-e171)在[教区](#idx-e161)一级所设的分支机构，简称审判所，由[督审判官](#idx-e154)驻任长官。\"},{\"id\":\"e165\",\"title\":\"门徒\",\"aliases\":[],\"body\":\"教会系统中[都主教](#idx-e152)及以上神职，以及[审判庭](#idx-e171)系统中自[督审判官](#idx-e154)及以上职位的别称，象征舍弃现世之乐、专心侍神；门徒不得婚娶。\"},{\"id\":\"e166\",\"title\":\"牧首厅\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)中枢以及[圣领](#idx-e483)最高行政机构，下设[圣礼厅](#idx-e173)、[省察厅](#idx-e179)、[司牧厅](#idx-e177)、[神启厅](#idx-e172)、[传信厅](#idx-e147)、[卫教厅](#idx-e178)六分厅。\"},{\"id\":\"e167\",\"title\":\"诺万尼斯流放\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[索拉瑞斯帝国](#idx-e429)维持的一种极刑，将受刑者留置诺万尼斯区域枯竭死地直至器官衰竭。\"},{\"id\":\"e168\",\"title\":\"审判分庭\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)在[都主教区](#idx-e153)一级的机构，长官称审判长，由[大审判长](#idx-e149)直接任命。\"},{\"id\":\"e169\",\"title\":\"审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)教阶之一，负责日常调查和执行事务，是[圣领](#idx-e483)独立于军事系统的强制执行编制。\"},{\"id\":\"e171\",\"title\":\"审判庭\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)直属司法和执行机构，处理[异端](#idx-e143)事务、追查未经许可的神启施法，拥有独立执法和行刑权。\"},{\"id\":\"e172\",\"title\":\"神启厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管[神启魔法](#idx-e4)事务。\"},{\"id\":\"e173\",\"title\":\"圣礼厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管宗教事务，亦负责[索拉瑞斯](#idx-e429)[凯撒](#idx-e234)的[血脉测试](#idx-e253)。\"},{\"id\":\"e174\",\"title\":\"枢机主教团\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)事实上的最高权力机构，[大牧首](#idx-e148)去世后负责闭门选出继任者。成员由大牧首自[都主教](#idx-e152)中选任。\"},{\"id\":\"e177\",\"title\":\"司牧厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管民生。\"},{\"id\":\"e178\",\"title\":\"卫教厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管军事，战时统一征召[护教军](#idx-e289)。\"},{\"id\":\"e179\",\"title\":\"省察厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管监察。\"},{\"id\":\"e181\",\"title\":\"正教会\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰最大教派[正教](#idx-e146)的教会组织，以[忒奥西斯](#idx-e483)圣领[牧首厅](#idx-e166)为教会中枢，同时也是圣领的统治机构。\"},{\"id\":\"e183\",\"title\":\"宗主教\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)领袖，由全大陆[公教](#idx-e107)主教选出三名候选，再由盲眼童贞信徒抽签决定。\"},{\"id\":\"e186\",\"title\":\"大神庙\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)首都[阿尔努尔](#idx-e518)城中的[教长](#idx-e199)驻地，是酋邦的宗教中心与圣地。\"},{\"id\":\"e191\",\"title\":\"玛阿特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中的死后审判仪式，以心脏置于天平称量，砝码为[希塔](#idx-e197)手杖顶端的宝石。\"},{\"id\":\"e197\",\"title\":\"希塔\",\"aliases\":[\"陆之神\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰中六神之一，老者之形，象征万物的终点，司灵魂与审判，看护[至福乐土](#idx-e201)；[玛阿特](#idx-e191)称量由其执行，砝码即其手杖顶端的宝石。\"},{\"id\":\"e199\",\"title\":\"伊玛目教长\",\"aliases\":[\"教长\"],\"body\":\"[尼希尔](#idx-e517)最高元首，简称教长，同时是酋邦的宗教领袖与[酋长会议](#idx-e239)首席。终身制，非世袭，代代以[秘术](#idx-e3)密封诏书委任继承。\"},{\"id\":\"e201\",\"title\":\"至福乐土\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中，[玛阿特](#idx-e191)称量通过者所被允许进入的永恒安乐之地，由[希塔](#idx-e197)看护。\"},{\"id\":\"e202\",\"title\":\"诸神圣土\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)中由[伊玛目教长](#idx-e199)直辖的宗教领地。含首都[阿尔努尔](#idx-e518)及周边耕地城市，由各部按比例出资供养。\"},{\"id\":\"e211\",\"title\":\"氏族\",\"aliases\":[],\"body\":\"精灵族的社会单位，被喻为[大圣树](#idx-e214)的分枝，各有族长与长老，本族领地内高度自治。\"},{\"id\":\"e213\",\"title\":\"万叶庭\",\"aliases\":[],\"body\":\"精灵族最高权力机构，每三十年于[希尔文尼亚](#idx-e527)召开，全体精灵借[圣树魔法](#idx-e8)旁听并投票。\"},{\"id\":\"e214\",\"title\":\"希尔文诺大圣树\",\"aliases\":[\"圣树\",\"大圣树\",\"圣树之母\"],\"body\":\"圣树信仰唯一的神圣对象，通称大圣树或圣树，矗立于[希尔文尼亚](#idx-e527)祭坛广场；凡有描述皆以女性位格出现，精灵称之为圣树之母，[自然魔法](#idx-e8)即祂分享之力。\"},{\"id\":\"e216\",\"title\":\"叶络枢机院\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e524)日常行政与对外事务机构，席位由[万叶庭](#idx-e213)轮选，长老兼承宗教职责。\"},{\"id\":\"e218\",\"title\":\"阿斯塔伦·塔利瑞安\",\"aliases\":[\"塔利瑞安\"],\"body\":\"[星术](#idx-e7)泰斗，1097年联合十二城邦创建[大星术研究院](#idx-e226)，即今[王家研究院](#idx-e249)之前身。\"},{\"id\":\"e226\",\"title\":\"大星术研究院\",\"aliases\":[],\"body\":\"1097年由[塔利瑞安](#idx-e218)联合十二城邦创建，艾瑟瑞姆[王家研究院](#idx-e249)前身，是艾瑟瑞姆国家形态的起点。\"},{\"id\":\"e227\",\"title\":\"地星师\",\"aliases\":[],\"body\":\"艾瑟瑞姆[星术](#idx-e7)学者的头衔之一。星术师于所属研究院研究室完成课题答辩，毕业后被授予的头衔。\"},{\"id\":\"e228\",\"title\":\"帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)的一级行政区划，共五个，与皇室直辖的[维里迪亚直辖省](#idx-e481)并列；省政府为中央[内阁](#idx-e237)的地方分支。原为六省，[卡帕尼](#idx-e502)独立后余五省。\"},{\"id\":\"e230\",\"title\":\"公爵领\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)最高级别的贵族封地，各[帝政省](#idx-e228)含一到两个公爵领。\"},{\"id\":\"e231\",\"title\":\"管理局\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[特贸区](#idx-e505)的立法与行政机构，由区内各商会分部选派代表组成，最高长官称管理局主席。\"},{\"id\":\"e232\",\"title\":\"军团行省\",\"aliases\":[\"行省\"],\"body\":\"[索拉瑞斯](#idx-e429)的一级行政区划，一行省对应一[军团](#idx-e294)，共八个，长官称[行省总督](#idx-e251)。\"},{\"id\":\"e233\",\"title\":\"龙裔继嗣法\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)开国皇帝[阿利昂](#idx-e235)晚年制定的皇位继承法，以直系子嗣的龙血浓度为据，由[牧首厅](#idx-e166)主持[血脉测试](#idx-e253)。\"},{\"id\":\"e234\",\"title\":\"龙裔凯撒\",\"aliases\":[\"凯撒\"],\"body\":\"[索拉瑞斯](#idx-e429)最高统治者的称号，简称凯撒，即位须由[大牧首](#idx-e148)主持册封礼，体现君权神授。\"},{\"id\":\"e235\",\"title\":\"马尔奇安·阿利昂\",\"aliases\":[\"阿利昂\"],\"body\":\"[索拉瑞斯](#idx-e429)开国[凯撒](#idx-e234)，人龙混血，受[大牧首](#idx-e148)册封为首位龙裔凯撒；捐帝国东部领土立[忒奥西斯](#idx-e483)圣领，晚年制定《[龙裔继嗣法](#idx-e233)》。\"},{\"id\":\"e237\",\"title\":\"内阁\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)和[阿布丹提亚帝国](#idx-e452)的中央机构之一。均指直属于王室/皇室的日常行政机构，各有大臣分管外交、军务、内务与王室/皇室财政。\"},{\"id\":\"e239\",\"title\":\"酋长会议\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)最高权力机构，由[教长](#idx-e199)与各部落酋长组成，每年[金素](#idx-e350)季于[阿尔努尔](#idx-e518)召开，协商全酋邦外交、军事与内政事宜。\"},{\"id\":\"e240\",\"title\":\"三柱议会\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)最高立法与财政机构，1393年确立，三柱指皇室、贵族与魔法阶级。\"},{\"id\":\"e242\",\"title\":\"首席发言人\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[四公联席会议](#idx-e243)主席，由四公爵轮任，联席会议表决平局时握最终裁决权。\"},{\"id\":\"e243\",\"title\":\"四公联席会议\",\"aliases\":[\"联席会议\"],\"body\":\"[卡帕尼](#idx-e502)最高权力机构，由四公爵组成，设[首席发言人](#idx-e242)一职，每五年轮换。\"},{\"id\":\"e244\",\"title\":\"特别仪式区\",\"aliases\":[],\"body\":\"位于艾瑟瑞姆中南部最[大平原](#idx-e453)，专用于王国[星术](#idx-e7)研究与设备制造，行政直属国王/女王。\"},{\"id\":\"e245\",\"title\":\"特区商法典\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[北部特贸区](#idx-e505)适用的独立法系，不同于各公国法系。\"},{\"id\":\"e246\",\"title\":\"天星师\",\"aliases\":[],\"body\":\"[星术](#idx-e7)学者的最高阶头衔与职位，授予学术成果极为杰出的[地星师](#idx-e227)。[托兰瓦尔·洛林](#idx-e74)、[奥韦纳尔·安柯伦坦](#idx-e9)等均曾任天星师。\"},{\"id\":\"e247\",\"title\":\"天星首席\",\"aliases\":[],\"body\":\"艾瑟瑞姆[王家研究院](#idx-e249)最高级别学者之职，永久由艾瑟瑞姆国王或女王兼任。\"},{\"id\":\"e248\",\"title\":\"王冠领地\",\"aliases\":[],\"body\":\"艾瑟瑞姆国王直辖之地，含以首都[阿斯托利亚](#idx-e495)为首的[坠星湖](#idx-e501)南岸城市群。\"},{\"id\":\"e249\",\"title\":\"王家研究院\",\"aliases\":[],\"body\":\"艾瑟瑞姆学术中枢，前身为[大星术研究院](#idx-e226)，兼掌王室继承事务与[特别仪式区](#idx-e244)管理，院长即[天星首席](#idx-e247)，永久由国王或女王兼任。\"},{\"id\":\"e251\",\"title\":\"行省总督\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团行省](#idx-e232)最高长官，由[军团](#idx-e294)长兼任，任期二十年，每年赴首都[索尔因](#idx-e448)叙职。\"},{\"id\":\"e252\",\"title\":\"叙职大会\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八位[行省总督](#idx-e251)每年赴[索尔因](#idx-e448)向[凯撒](#idx-e234)当面汇报施政与军务的会议。\"},{\"id\":\"e253\",\"title\":\"血脉测试\",\"aliases\":[],\"body\":\"《[龙裔继嗣法](#idx-e233)》规定的继承资格测试，由[牧首厅](#idx-e166)[圣礼厅](#idx-e173)主持，每代[凯撒](#idx-e234)继承人均须重测。\"},{\"id\":\"e259\",\"title\":\"仲裁所\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[特贸区](#idx-e505)[管理局](#idx-e231)下属机构，承担特贸区司法职能。\"},{\"id\":\"e263\",\"title\":\"阿索战争\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)与[索拉瑞斯帝国](#idx-e429)之间的三次大规模战争（1290–1292、1351–1356、1479–1483）。\"},{\"id\":\"e264\",\"title\":\"布兰顿和约\",\"aliases\":[],\"body\":\"[第二次阿索战争](#idx-e269)停战和约，以[布兰顿河](#idx-e463)下游为两国新界，[布兰顿](#idx-e462)城割予[索拉瑞斯](#idx-e429)。\"},{\"id\":\"e265\",\"title\":\"布兰顿战役\",\"aliases\":[],\"body\":\"1479年[三战](#idx-e270)前期的一场决定性会战，[阿布丹提亚帝国](#idx-e452)获得战略性胜利。\"},{\"id\":\"e269\",\"title\":\"第二次阿索战争\",\"aliases\":[\"二战\"],\"body\":\"于1351–1356年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第二次大规模战争，[忒奥西斯](#idx-e483)保持中立。索拉瑞斯获胜，得[西比尔平原](#idx-e492)南部与[布兰顿](#idx-e462)城，停战于《[布兰顿和约](#idx-e264)》；阿布丹提亚放弃[卡帕尼](#idx-e502)群岛，卡帕尼同年独立。\"},{\"id\":\"e270\",\"title\":\"第三次阿索战争\",\"aliases\":[\"三战\"],\"body\":\"于1479–1483年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第三次大规模战争，阿布丹提亚获胜。停战于《[卡斯特鲁姆和约](#idx-e275)》，索拉瑞斯向阿布丹提亚归还[大运河](#idx-e427)下游东岸两座城市及其周边土地，两国当代边界由此确立。\"},{\"id\":\"e271\",\"title\":\"第一次阿索战争\",\"aliases\":[\"一战\"],\"body\":\"于1290–1292年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第一次大规模战争，[忒奥西斯](#idx-e483)为索拉瑞斯盟友。索拉瑞斯获胜后与圣领同告东扩，停战于《[文特拉和约](#idx-e283)》；间接促成1295年[教会大分裂](#idx-e160)。\"},{\"id\":\"e273\",\"title\":\"黑暗时代\",\"aliases\":[],\"body\":\"指八世纪[七王约](#idx-e280)瓦解后，西诺拉尼亚地区长达数百年的多国混战时期。\"},{\"id\":\"e275\",\"title\":\"卡斯特鲁姆和约\",\"aliases\":[],\"body\":\"[第三次阿索战争](#idx-e270)停战和约，确立阿索当代边界；[大运河](#idx-e427)下游东岸两城交接至今悬而未决。\"},{\"id\":\"e276\",\"title\":\"林缘议厅\",\"aliases\":[],\"body\":\"1203年[希尔文诺](#idx-e524)[叶络枢机院](#idx-e216)于[冠脊山脉](#idx-e419)东南脉隘口所设，是当前大陆唯一公认的中立缔约见证机构。\"},{\"id\":\"e278\",\"title\":\"梅尔卡托条约\",\"aliases\":[],\"body\":\"723年[阿布丹提亚](#idx-e452)与[卡帕尼王国](#idx-e534)签订，[卡帕尼](#idx-e502)由此成为帝国附庸国。\"},{\"id\":\"e280\",\"title\":\"七王约\",\"aliases\":[],\"body\":\"328年西诺拉尼亚七国建立的松散邦联，存续约四个世纪，八世纪中叶瓦解。\"},{\"id\":\"e283\",\"title\":\"文特拉和约\",\"aliases\":[],\"body\":\"[第一次阿索战争](#idx-e271)停战和约，[索拉瑞斯](#idx-e429)与[忒奥西斯](#idx-e483)领土东扩。\"},{\"id\":\"e285\",\"title\":\"大舰队\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国舰队的合称，是大陆唯一成熟的海军编制，设舰队司令统率。\"},{\"id\":\"e288\",\"title\":\"海军陆战队\",\"aliases\":[],\"body\":\"[大舰队](#idx-e285)下属的陆战单位，含常规士兵与魔法师部队。\"},{\"id\":\"e289\",\"title\":\"护教军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)最主要的常规部队，下分五个师，由各[都主教区](#idx-e153)分别组建。\"},{\"id\":\"e291\",\"title\":\"近卫龙骑兵团\",\"aliases\":[\"龙骑兵团\"],\"body\":\"[索拉瑞斯](#idx-e429)以[飞龙](#idx-e292)为坐骑的精锐常规部队，通称龙骑兵团，直属[凯撒](#idx-e234)，约八万头飞龙、五万人编制，跨地形作战能力冠绝大陆。\"},{\"id\":\"e292\",\"title\":\"巨龙眷属\",\"aliases\":[\"飞龙\"],\"body\":\"巨龙与大型野兽的混血飞行亚种，通称飞龙，寿约五百年，是[龙骑兵团](#idx-e291)的坐骑。\"},{\"id\":\"e294\",\"title\":\"军团\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)最高军事编制，与[行省](#idx-e232)一体，下设团、大队、小队。\"},{\"id\":\"e296\",\"title\":\"龙骑士团\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)的顶级战力，成员皆与巨龙缔结[血契](#idx-e48)，效忠[凯撒](#idx-e234)本人而非帝国，团内以多数决议事。\"},{\"id\":\"e302\",\"title\":\"圣仪军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)直属的精锐法术作战部队，大陆规模最大的法术军力，兼承民间大型工程建设。\"},{\"id\":\"e312\",\"title\":\"保险业\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)独有的金融业态，涵盖贸易险与年金。\"},{\"id\":\"e314\",\"title\":\"存票\",\"aliases\":[],\"body\":\"银行或教会发行的储蓄凭证，附有利率。在[阿布丹提亚](#idx-e452)、[卡帕尼](#idx-e502)和艾瑟瑞姆境内可在二级市场流通，卡帕尼存票可经银联跨行自由存取；[圣领](#idx-e483)存票仅限神职人员与教会机构之间流通，不开放民间交易。[尼希尔](#idx-e517)与[索拉瑞斯](#idx-e429)不发行存票。\"},{\"id\":\"e316\",\"title\":\"丹提亚纸\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)以[棉短绒](#idx-e405)制成的高品质纸张，是各国高端纸制品，以及[尼卡特汇票](#idx-e326)最重要的原材料之一。\"},{\"id\":\"e319\",\"title\":\"工匠行会\",\"aliases\":[],\"body\":\"按行业组织同业手工业者的机构，广泛存在于[阿布丹提亚](#idx-e452)、艾瑟瑞姆与[卡帕尼](#idx-e502)，实行学徒制，配方与工序属行会秘密。\"},{\"id\":\"e320\",\"title\":\"公债\",\"aliases\":[],\"body\":\"由国家或[帝政省](#idx-e228)政府发行的[债票](#idx-e343)，于[阿布丹提亚](#idx-e452)、艾瑟瑞姆和[卡帕尼](#idx-e502)发行流通。\"},{\"id\":\"e321\",\"title\":\"河金\",\"aliases\":[],\"body\":\"船只通行[索菲亚大运河](#idx-e427)所缴的费用，是[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)的重要常规收入。\"},{\"id\":\"e322\",\"title\":\"家族信托\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)独有的金融业态，服务于大陆各国权贵阶层的财富传承需求。\"},{\"id\":\"e323\",\"title\":\"交易所\",\"aliases\":[],\"body\":\"票据与投资凭证的交易场所，以[卡帕尼](#idx-e502)[特贸区](#idx-e505)最为发达。\"},{\"id\":\"e324\",\"title\":\"卡帕尼尼卡特铸币\",\"aliases\":[\"尼卡特\"],\"body\":\"[卡帕尼](#idx-e502)流通货币的通称，含金合金铸造，是大陆事实上的国际货币。\"},{\"id\":\"e325\",\"title\":\"卡帕尼银联\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[四大商会](#idx-e336)与众多中小商会银行共组的联合体，发行并管理[尼卡特汇票](#idx-e326)。\"},{\"id\":\"e326\",\"title\":\"卡帕尼银联汇票\",\"aliases\":[\"尼卡特汇票\",\"汇票\"],\"body\":\"[卡帕尼银联](#idx-e325)发行的结算凭证，通称尼卡特汇票或汇票，可在任意卡帕尼银联成员银行兑现，学界视为已具事实货币地位。\"},{\"id\":\"e330\",\"title\":\"洛卡金票\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)独有的投资凭证，可投资特定商会或贸易活动，于[交易所](#idx-e323)自由买卖。\"},{\"id\":\"e331\",\"title\":\"尼卡特分铸币\",\"aliases\":[],\"body\":\"[尼卡特](#idx-e324)的辅币，兑换比率一比一百。\"},{\"id\":\"e335\",\"title\":\"圣约瑟商会\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)直属商会，垄断圣领境内外一切贸易，学界普遍认为兼具情报网络职能。\"},{\"id\":\"e336\",\"title\":\"四大商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国各自直属的商会，由四公爵历史上直接出资创立，其主席即公爵本人。\"},{\"id\":\"e338\",\"title\":\"索利亚商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)商会之一，1489年前后由卡涅·道格拉斯创办，以[星术设备](#idx-e85)半成品与[魔矿](#idx-e71)原料分销起家，后跃居联邦前列。\"},{\"id\":\"e339\",\"title\":\"汶托尼亚商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[四大商会](#idx-e336)之一，属[汶托尼亚](#idx-e514)公国。\"},{\"id\":\"e341\",\"title\":\"伊琳娜圣银币\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)流通货币，以高含银量铸造并防伪，与[索拉瑞斯](#idx-e429)铁钞按一比一互认流通。\"},{\"id\":\"e343\",\"title\":\"债票\",\"aliases\":[],\"body\":\"银行或教会发行的债务凭证，附有利率。在[阿布丹提亚](#idx-e452)、[卡帕尼](#idx-e502)和艾瑟瑞姆境内可在二级市场流通，[圣领](#idx-e483)债票仅限神职人员与教会机构之间流通，不开放民间交易。[尼希尔](#idx-e517)与[索拉瑞斯](#idx-e429)不发行债票。\"},{\"id\":\"e344\",\"title\":\"自由港\",\"aliases\":[],\"body\":\"[特贸区](#idx-e505)所设、享有极高自治权的港口体系，是国际贸易量激增的制度前提。\"},{\"id\":\"e345\",\"title\":\"裁曜日\",\"aliases\":[\"圣伊琳娜日\"],\"body\":\"[通用历](#idx-e368)一周第二日，亦简称星期二；[仪式历](#idx-e361)作圣伊琳娜日，对应天星[仲裁星](#idx-e549)。\"},{\"id\":\"e346\",\"title\":\"大陆历\",\"aliases\":[],\"body\":\"[通用历](#idx-e368)纪年，以[唯一神](#idx-e135)降临传教义于[圣约翰](#idx-e123)之年为元年，元年之前称元前。\"},{\"id\":\"e348\",\"title\":\"虹曜日\",\"aliases\":[\"圣保罗日\"],\"body\":\"[通用历](#idx-e368)一周第四日，亦简称星期四；[仪式历](#idx-e361)作圣保罗日，对应天星[织虹星](#idx-e548)。\"},{\"id\":\"e350\",\"title\":\"金素\",\"aliases\":[\"圣献\",\"冕宫月\",\"肆位\"],\"body\":\"一年六季的第四季，各地作物相继采收。[仪式历](#idx-e361)同季作圣献，艾瑟瑞姆[星历](#idx-e371)作冕宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作肆位。\"},{\"id\":\"e351\",\"title\":\"烬曜日\",\"aliases\":[\"圣约瑟日\"],\"body\":\"[通用历](#idx-e368)一周第三日，亦简称星期三；[仪式历](#idx-e361)作圣约瑟日，对应天星[烬铸星](#idx-e533)。\"},{\"id\":\"e353\",\"title\":\"凛寒\",\"aliases\":[\"正炼\",\"琴宫月\",\"陆位\"],\"body\":\"一年六季的第六季，山地封路、[凛冰洋](#idx-e423)冰封，大陆整体进入年内节律最为收缩的状态。[仪式历](#idx-e361)同季作正炼，艾瑟瑞姆[星历](#idx-e371)作琴宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作陆位。\"},{\"id\":\"e356\",\"title\":\"启蛰\",\"aliases\":[\"晖醒\",\"天宫月\",\"壹位\"],\"body\":\"一年六季的第一季，[通用历](#idx-e368)岁首所在。[凛冰洋](#idx-e423)浮冰退散、山地封雪消融、两河进入汛期，各地贸易与出行随之重新活跃。[仪式历](#idx-e361)同季作晖醒，艾瑟瑞姆[星历](#idx-e371)作天宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作壹位。\"},{\"id\":\"e358\",\"title\":\"日曜日\",\"aliases\":[\"圣神日\"],\"body\":\"[通用历](#idx-e368)一周第五日，亦简称星期日；[仪式历](#idx-e361)作圣神日，对应天星[冠阳](#idx-e532)，是信众向[唯一神](#idx-e135)礼拜的礼拜日。\"},{\"id\":\"e359\",\"title\":\"萨辛历\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)地方历法，以当代伊玛目称号纪年，每代即位则重置元年，六季称[壹位](#idx-e356)至[陆位](#idx-e353)。\"},{\"id\":\"e361\",\"title\":\"圣格里仪式历\",\"aliases\":[\"仪式历\"],\"body\":\"[正教会](#idx-e181)原始历法，[通用历](#idx-e368)前身，[圣领](#idx-e483)与[索拉瑞斯](#idx-e429)的官方历法，六季与五日均保留宗教命名。\"},{\"id\":\"e368\",\"title\":\"通用历\",\"aliases\":[\"格里历\"],\"body\":\"大陆通行的太阳历，一年六季、每季五十日、每旬十日、每周五日；别称格里历，源自[正教会](#idx-e181)的[圣格里仪式历](#idx-e361)，经[公教会](#idx-e155)世俗化后扩散全大陆。\"},{\"id\":\"e371\",\"title\":\"星历\",\"aliases\":[],\"body\":\"艾瑟瑞姆地方历法，大陆唯一的月亮历，六月之名取自黄道六宫。\"},{\"id\":\"e376\",\"title\":\"月曜日\",\"aliases\":[\"圣约翰日\"],\"body\":\"[通用历](#idx-e368)一周第一日，亦简称星期一；[仪式历](#idx-e361)作圣约翰日，对应天星[汐月](#idx-e544)，是四个劳作日之首。\"},{\"id\":\"e378\",\"title\":\"步米\",\"aliases\":[],\"body\":\"长度基本单位，源自[索拉瑞斯](#idx-e429)[军团](#idx-e294)标准行军步伐；一步米等于十分步米等于一百厘步米。\"},{\"id\":\"e385\",\"title\":\"界石\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团](#idx-e294)沿主干道每千步所立的里程标记，亦为[陆里](#idx-e387)之所本。\"},{\"id\":\"e387\",\"title\":\"陆里\",\"aliases\":[],\"body\":\"长度单位，一陆里等于一千[步米](#idx-e378)，源自[军团](#idx-e294)沿主干道每千步立一[界石](#idx-e385)的传统。\"},{\"id\":\"e395\",\"title\":\"星度\",\"aliases\":[],\"body\":\"温度基本单位，源自[王家研究院](#idx-e249)的[魔矿](#idx-e71)[蚀刻](#idx-e76)环境控制需求，以纯水冰点为零、沸点为一百。\"},{\"id\":\"e397\",\"title\":\"报时钟\",\"aliases\":[],\"body\":\"各国城镇常见的公共计时装置，一般安装于教堂钟楼。\"},{\"id\":\"e403\",\"title\":\"卡帕尼千岛群星\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)北部岛链的美称，热带群岛风光吸引各国权贵，旅游业发达。\"},{\"id\":\"e404\",\"title\":\"拉韦洛印刷机\",\"aliases\":[],\"body\":\"1401年洛伦索·拉韦洛改造[汇票](#idx-e326)印制器械而成的活字印刷机，随跨国贸易扩散至全大陆。\"},{\"id\":\"e405\",\"title\":\"棉短绒\",\"aliases\":[],\"body\":\"棉花脱棉后的副产物，是[丹提亚纸](#idx-e316)的原料。\"},{\"id\":\"e412\",\"title\":\"神遴者\",\"aliases\":[\"神遴者阶层\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰的[玛阿特](#idx-e191)称量中，心脏与宝石恰成平衡者。宗教解释中，他们身负引导众生的责任，受赐[秘术](#idx-e3)之力转生现世；作为一个阶层，神遴者垄断了酋邦一切政治职位，[教长](#idx-e199)、祭司、部落酋长与长老无一例外皆出于此。\"},{\"id\":\"e413\",\"title\":\"北门湾\",\"aliases\":[],\"body\":\"[凛冰洋](#idx-e423)伸入大陆中部的内湾，位于[忒奥西斯](#idx-e483)北境，是[索菲亚大运河](#idx-e427)的北端入口。[尼希尔](#idx-e517)[魔矿](#idx-e71)经凛冰洋航线抵此南下，是当代大陆最重要跨洋贸易干线上的节点；[运河仪所](#idx-e493)即设于湾口。\"},{\"id\":\"e414\",\"title\":\"晨风海\",\"aliases\":[],\"body\":\"大陆东南方海域，洋流自东往西、往北持续输送暖湿气流深入内陆，是[阿布丹提亚大平原](#idx-e453)优良农业气候的关键成因。[马提尼河](#idx-e471)与[波特利亚河](#idx-e461)汇流后注入此海。\"},{\"id\":\"e415\",\"title\":\"大星洋\",\"aliases\":[],\"body\":\"大陆西侧海域，洋流复杂多变，深远洋几无成规模的远洋航行；较活跃者唯[索拉瑞斯](#idx-e429)西海岸的近海航线，串联[镜心湖](#idx-e436)产区与西南偏远[行省](#idx-e232)。其偏暖洋流携湿润气流北上，遇[裂境山脉](#idx-e422)与[冠脊山脉](#idx-e419)抬升成雨，是索拉瑞斯森林覆盖率过半的核心水分来源。\"},{\"id\":\"e416\",\"title\":\"翡翠海峡\",\"aliases\":[],\"body\":\"大陆南方水域，全大陆航运最繁忙之处，[卡帕尼](#idx-e502)群岛与大陆本体之间的物流几乎全经于此，亦是[索菲亚大运河](#idx-e427)的南端出口。卡帕尼北部岛链水文条件优越、港口全年可用，是这条贸易干线的天然枢纽。\"},{\"id\":\"e419\",\"title\":\"冠脊山脉\",\"aliases\":[],\"body\":\"大陆规模最大的山脉系统，分北、西、东南、南四脉。北脉与西脉合围[尼希尔](#idx-e517)南侧边境，北脉与东南脉之间夹含[希尔文诺大森林](#idx-e528)，南脉则完全位于[索拉瑞斯](#idx-e429)境内。冠脊山脉北脉同时是大陆西部最重要的气候屏障，其北为尼希尔干旱荒漠，其南为[希尔文诺](#idx-e524)封闭湿润的万年密林，是大陆诸域中最极端的毗邻气候对照。\"},{\"id\":\"e422\",\"title\":\"裂境山脉\",\"aliases\":[],\"body\":\"南北走向纵贯[索拉瑞斯](#idx-e429)中部，是帝国东西地形的核心分界线：以东为[奥利提斯平原](#idx-e430)，落在其雨影区而气候偏干；以西地势平缓，[镜心湖](#idx-e436)居中。沿线铁铜矿藏富集，是大陆冶铁产业最重要的原料来源；[索尔河](#idx-e447)发源于其南麓。\"},{\"id\":\"e423\",\"title\":\"凛冰洋\",\"aliases\":[],\"body\":\"大陆北方极寒洋，以东西向洋流为主，北部与东部全年有浮冰，渔业与运输活动仅集中于中西部海域；对大陆只输出严寒与干燥。[尼希尔](#idx-e517)[魔矿](#idx-e71)出口的主干路线即自两河出海口北上进入此洋，东行抵[北门湾](#idx-e413)后南下入[大运河](#idx-e427)。\"},{\"id\":\"e427\",\"title\":\"索菲亚大运河\",\"aliases\":[\"大运河\"],\"body\":\"[忒奥西斯](#idx-e483)与[索拉瑞斯](#idx-e429)联合开凿的人工水道，1381–1388年历时七年建成，以[圣仪军](#idx-e302)的[神启魔法](#idx-e4)为主力，是[大陆历](#idx-e346)史上最庞大的人造工程。自[北门湾](#idx-e413)几乎垂直向南贯穿[西比尔平原](#idx-e492)，南端注入[翡翠海峡](#idx-e416)，将[凛冰洋](#idx-e423)与翡翠海峡物理贯通，从根本上重塑了大陆南北贸易格局。管理权归圣领，凡向其报备货物并缴纳[河金](#idx-e321)的船只不分国籍皆可通行。\"},{\"id\":\"e429\",\"title\":\"索拉瑞斯帝国\",\"aliases\":[\"索拉瑞斯\"],\"body\":\"位于大陆中西部的军事集权帝制大国，首都[索尔因维克图斯](#idx-e448)。1159年[索拉尔王国](#idx-e541)国王[阿利昂](#idx-e235)统一西大陆诸国、受牧首册封为首代[龙裔凯撒](#idx-e234)而立国。国土一千一百二十万平方[陆里](#idx-e387)，划为八个[军团行省](#idx-e232)，逾七成为群山与原始森林，人口约四千二百万。以[军团](#idx-e294)—行省一体化制度与[龙骑兵团](#idx-e291)著称，尊[正教](#idx-e146)为国教，逾八成公民为正教信徒；外交强势，与[阿布丹提亚](#idx-e452)共构当代大陆两极。\"},{\"id\":\"e430\",\"title\":\"奥利提斯平原\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)境内[裂境山脉](#idx-e422)以东呈东北—西南走向的狭长平原，是帝国最主要的农业区与人口集中地之一，首都[索尔因维克图斯](#idx-e448)位于其西南角。因落在裂境山脉雨影区，气候较[镜心湖](#idx-e436)区偏干。\"},{\"id\":\"e436\",\"title\":\"镜心湖\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)西部的湖泊，是帝国最重要的农业产区核心与人口最密集的区域之一。受[大星洋](#idx-e415)暖流直接调节，湖体又进一步平抑温差，是帝国内气候最温和宜居的地带。[纳赫尔河](#idx-e520)发源于此；东岸最大城市为[雷克西姆](#idx-e440)。\"},{\"id\":\"e437\",\"title\":\"镜心湖行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八个[军团行省](#idx-e232)之一，位于帝国西部，环[镜心湖](#idx-e436)而设，首府[雷克西姆](#idx-e440)。\"},{\"id\":\"e440\",\"title\":\"雷克西姆\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[镜心湖行省](#idx-e437)首府，[镜心湖](#idx-e436)东岸最大城市，建有[圣保罗](#idx-e119)大教堂。堂中无[圣骸](#idx-e120)，仅供奉据称是保罗生前所披的斗篷——保罗殉道之处据《保罗福音》末章推测邻近镜心湖，[正教会](#idx-e181)因此在雷克西姆建立大教堂。\"},{\"id\":\"e447\",\"title\":\"索尔河\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)境内河流。发源于[裂境山脉](#idx-e422)南麓，流经首都[索尔因维克图斯](#idx-e448)后向东南注入艾瑟瑞姆境内的[坠星湖](#idx-e501)，是帝国重要的内河水系。\"},{\"id\":\"e448\",\"title\":\"索尔因维克图斯\",\"aliases\":[\"索尔因\"],\"body\":\"[索拉瑞斯帝国](#idx-e429)首都，通称索尔因，位于[奥利提斯平原](#idx-e430)西南角，[索尔河](#idx-e447)流经其间。是帝国的政治军事中心与最大城市，八位[行省总督](#idx-e251)每年赴此参加[叙职大会](#idx-e252)；城南设有[龙骑士团](#idx-e296)驻地与飞场。\"},{\"id\":\"e452\",\"title\":\"阿布丹提亚帝国\",\"aliases\":[\"阿布丹提亚\",\"丹提亚帝国\"],\"body\":\"通称丹提亚帝国，位于大陆东南方[大平原](#idx-e453)的君主宪政制大国，首都[维里迪亚](#idx-e480)。386年卡立曼·费内尔统一诸国建立帝政，费内尔家族统治延续至今；两次[阿索战争](#idx-e263)失利后于1393年建[三柱议会](#idx-e240)，和平演变为君主立宪制国家。国土八百七十万平方[陆里](#idx-e387)，划为五个[帝政省](#idx-e228)和一个直辖省，人口逾六千二百万，为全大陆最多。大陆第一大粮食出口国与政治东极，约七成人口信奉[公教](#idx-e107)。\"},{\"id\":\"e453\",\"title\":\"阿布丹提亚大平原\",\"aliases\":[\"大平原\"],\"body\":\"[阿布丹提亚帝国](#idx-e452)国土主体，大陆东部平原带规模最大的一部分，为全大陆最集中的农业核心地带。地势平坦开阔，水系极为发达，冲积土壤肥沃；中部核心区无霜期长而几无结冻，是帝国粮食、棉花与人口的集中所在，首都[维里迪亚](#idx-e480)居其腹地。\"},{\"id\":\"e459\",\"title\":\"波马里亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内位于[润溪湖](#idx-e474)西南方的重要城市。是大陆东部已知元素丰度最高的城市之一，天然宜居且对元素[疏化](#idx-e37)抵抗力强。历史上曾为[正教会](#idx-e181)在东诺拉尼亚最重要的宗教驻地，[教会大分裂](#idx-e160)后成为[公教总会](#idx-e157)所在地；[公教会](#idx-e155)于十四世纪宣称寻得的[圣保罗](#idx-e119)[圣骸](#idx-e120)即供奉于波马里亚大教堂。该城亦是波马里亚[公爵领](#idx-e230)首府，同名[帝政省](#idx-e228)的省名即出于此。\"},{\"id\":\"e461\",\"title\":\"波特利亚河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内的主要河流之一，发源自[葛林沃尔克](#idx-e525)南脉南麓，与[马提尼河](#idx-e471)于[大平原](#idx-e453)中部汇流后注入[晨风海](#idx-e414)，两河交汇处即首都[维里迪亚](#idx-e480)所在。\"},{\"id\":\"e462\",\"title\":\"布兰顿\",\"aliases\":[],\"body\":\"[布兰顿河](#idx-e463)东岸城市，位于河流中游。[第二次阿索战争](#idx-e269)后依《[布兰顿和约](#idx-e264)》割予[索拉瑞斯](#idx-e429)，此后一百二十余年是帝国边境最靠东的据点。1479年[三战](#idx-e270)开战之初为[阿布丹提亚](#idx-e452)夺取，此后终战未再易手，现归属于阿布丹提亚。\"},{\"id\":\"e463\",\"title\":\"布兰顿河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内河流。自北向南流经[西比尔平原](#idx-e492)东南缘，中段接纳一条自西而来的支流后折向东南，于[法拉利亚](#idx-e465)一带入海；[第二次阿索战争](#idx-e269)后其下游为阿索两国界河，《[布兰顿和约](#idx-e264)》即以此河命名，1479年[布兰顿战役](#idx-e265)的战场亦在其中下游两岸。\"},{\"id\":\"e465\",\"title\":\"法拉利亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内，[布兰顿河](#idx-e463)入[翡翠海峡](#idx-e416)河口处的港镇。\"},{\"id\":\"e471\",\"title\":\"马提尼河\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)第一大河，发源于[穗满湖](#idx-e477)，向东南流经[大平原](#idx-e453)后与[波特利亚河](#idx-e461)汇流注入[晨风海](#idx-e414)，两河交汇处即首都[维里迪亚](#idx-e480)所在。\"},{\"id\":\"e474\",\"title\":\"润溪湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)双湖之东者，与[穗满湖](#idx-e477)并称双湖，是帝国北部水系的重要源头。湖运承担北部矿区矿产向核心区的输送；西南方为[元素丰地](#idx-e52)城市[波马里亚](#idx-e459)。\"},{\"id\":\"e477\",\"title\":\"穗满湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)双湖之西者，与[润溪湖](#idx-e474)并称双湖。湖区周边水草丰美，是全大陆最集中的规模化牧区；[马提尼河](#idx-e471)发源于此。\"},{\"id\":\"e480\",\"title\":\"维里迪亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)首都，位于[马提尼河](#idx-e471)与[波特利亚河](#idx-e461)交汇处、[大平原](#idx-e453)腹地，是帝国政治文化中心，也是帝国最重要的内河航运枢纽之一。城市内歌剧院与画廊林立，素有\\\"艺术之都\\\"之称。\"},{\"id\":\"e481\",\"title\":\"维里迪亚直辖省\",\"aliases\":[\"首都直辖省\"],\"body\":\"[阿布丹提亚帝国](#idx-e452)六个一级行政区中唯一由皇室直辖者，亦称首都直辖省，位于帝国西南，含首都[维里迪亚](#idx-e480)及周边；境内不设贵族封地与[帝政省](#idx-e228)政府，是该国唯一的直辖省。\"},{\"id\":\"e483\",\"title\":\"忒奥西斯圣治领\",\"aliases\":[\"忒奥西斯\",\"圣治领\",\"圣领\"],\"body\":\"通称圣治领或圣领，位于大陆中央北部的[正教会](#idx-e181)神权共和国，首都[圣城索菲亚](#idx-e487)。1159年[索拉瑞斯](#idx-e429)开国[凯撒](#idx-e234)[阿利昂](#idx-e235)将帝国东部领土捐献给[大牧首](#idx-e148)而立，是正教会取得世俗领地后的政治实体。国土两百三十万平方[陆里](#idx-e387)，划为五个[都主教区](#idx-e153)，人口一千三百万。大牧首兼国家元首，[牧首厅](#idx-e166)为最高行政机构；直属[圣仪军](#idx-e302)兼掌国防与大型工程，[索菲亚大运河](#idx-e427)即其代表成果。\"},{\"id\":\"e485\",\"title\":\"潘克拉托\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)境内城市，[圣约翰都主教区](#idx-e489)的都教座城。[圣约翰](#idx-e123)殉道之地，[圣骸](#idx-e120)存于圣约翰大教堂。\"},{\"id\":\"e487\",\"title\":\"圣城索菲亚\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领首都，[大牧首](#idx-e148)及[牧首厅](#idx-e166)所在地。相传为[唯一神](#idx-e135)降临之处，本为小村，圣领建立及[大运河](#idx-e427)开通后扩张为兼具政治、宗教与经济中心地位的大都会。是大陆中部已知最大的[元素丰地](#idx-e52)，也是[正教会](#idx-e181)立都于此的重要自然前提；索菲亚大教堂藏有据称是[圣约翰](#idx-e123)升天时所钉[十字架](#idx-e127)的原木碎片。\"},{\"id\":\"e489\",\"title\":\"圣约翰都主教区\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领西南部[都主教区](#idx-e153)，以四[使徒](#idx-e126)之首[圣约翰](#idx-e123)命名，辖存有圣约翰[圣骸](#idx-e120)的[潘克拉托](#idx-e485)等地。\"},{\"id\":\"e492\",\"title\":\"西比尔平原\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领所在的温带半干旱草原，地势平坦、天然水源匮乏，[索菲亚大运河](#idx-e427)贯通前农业条件相当有限；北延至[北门湾](#idx-e413)，是大陆南北贸易的关键咽喉。其南部于[二战](#idx-e269)后尽归[索拉瑞斯](#idx-e429)，后为索菲亚大运河纵切为二；运河以东的土地依[三战](#idx-e270)《[卡斯特鲁姆和约](#idx-e275)》归[阿布丹提亚](#idx-e452)，交接至今悬置，是阿索两国博弈的核心争议。\"},{\"id\":\"e493\",\"title\":\"运河仪所\",\"aliases\":[],\"body\":\"坐落于[忒奥西斯](#idx-e483)圣领领土最北端、[索菲亚大运河](#idx-e427)与[北门湾](#idx-e413)交汇入口处的机构，是[牧首厅](#idx-e166)对大运河实施管理的最前沿。承担通行审核与海水除盐双重职能，常驻[神启魔法](#idx-e4)师持续以水元素魔法析出注入运河的海水盐分。其除盐作业常年施法却从未引发可观测的元素[疏化](#idx-e37)，已成为[魔元素动力学](#idx-e29)的专项研究课题。\"},{\"id\":\"e494\",\"title\":\"艾瑟瑞姆王国\",\"aliases\":[],\"body\":\"位于大陆西南部的封建君主制国家，首都[阿斯托利亚](#idx-e495)，领土环抱[坠星湖](#idx-e501)。源出西诺拉尼亚黑暗时期南下避难的[星术](#idx-e7)学者聚落，十一世纪末[塔利瑞安](#idx-e218)联合十二城邦创建[大星术研究院](#idx-e226)，十三世纪前叶塔利兰娜受推举加冕为初代女王。国土约四百二十万平方[陆里](#idx-e387)，由[王冠领地](#idx-e248)、四大伯爵封邑与[特别仪式区](#idx-e244)构成，人口约一千八百万。以星术立国，[王家研究院](#idx-e249)[天星首席](#idx-e247)永由君主兼任，传统意义的[施法者](#idx-e36)占人口逾半。\"},{\"id\":\"e495\",\"title\":\"阿斯托利亚\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)首都，位于[坠星湖](#idx-e501)南端[瑟蒂尔河](#idx-e499)出湖处，由[大陆历](#idx-e346)894年南下避难的[星术](#idx-e7)学者聚落发展而成，[王家研究院](#idx-e249)即设于此。城名源出[星空学派](#idx-e6)早期所用的 Astralis（\\\"属星的\\\"），后世音变作 Astoria，旧拼法今仅见于研究院的仪式文书。\"},{\"id\":\"e499\",\"title\":\"瑟蒂尔河\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)境内河流。由[坠星湖](#idx-e501)南端出发，向南流经艾瑟瑞姆注入[大星洋](#idx-e415)，首都[阿斯托利亚](#idx-e495)位于其北端出湖处。\"},{\"id\":\"e501\",\"title\":\"坠星湖\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)的地理中心，首都[阿斯托利亚](#idx-e495)位于其南端出湖口。[索尔河](#idx-e447)自[索拉瑞斯](#idx-e429)方向注入湖北端，[瑟蒂尔河](#idx-e499)由南端流出南向[大星洋](#idx-e415)；湖运依托[星术](#idx-e7)船只，是沿岸城市群最重要的内部贸易路线。\"},{\"id\":\"e502\",\"title\":\"卡帕尼诸公联合\",\"aliases\":[\"卡帕尼\",\"卡帕尼联邦\"],\"body\":\"又称卡帕尼联邦，位于大陆南部群岛的公国联邦制国家，由四成员公国与[北部特别贸易区](#idx-e505)组成，四公国各有首府，联邦首都为[阿卡帕尼](#idx-e503)公国的[伊索拉韦尔德](#idx-e516)。1356年[第二次阿索战争](#idx-e269)后，四公爵于[米德可尔](#idx-e512)会晤宣布脱离[阿布丹提亚](#idx-e452)独立。国土约二百五十万平方[陆里](#idx-e387)，散布于七十八座岛屿，人口约九百八十万。联邦以商贸与金融立国，外交奉行离岸平衡，热带群岛旅游业亦非常发达。\"},{\"id\":\"e503\",\"title\":\"阿卡帕尼\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一，由同名公爵世袭领有，核心领地为[阿卡帕尼岛](#idx-e504)，首府[伊索拉韦尔德](#idx-e516)亦为联邦首都。\"},{\"id\":\"e504\",\"title\":\"阿卡帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)群岛南部主岛区的核心岛屿之一，与[梅尔帕尼岛](#idx-e510)合计聚居全联邦逾半人口。\"},{\"id\":\"e505\",\"title\":\"北部特别贸易区\",\"aliases\":[\"特贸区\",\"北部特贸区\"],\"body\":\"[卡帕尼联邦](#idx-e502)于1382年于群岛北部岛链设立的特别经济区，由五十八座岛屿及[自由港](#idx-e344)组成，适用独立的[特区商法典](#idx-e245)与优惠贸易税率，设[管理局](#idx-e231)与[仲裁所](#idx-e259)自治，是大陆各国商人自由设立分部开展贸易的核心地带，也是联邦金融机构最密集之处。\"},{\"id\":\"e506\",\"title\":\"波托马利\",\"aliases\":[],\"body\":\"[卡帕尼联邦](#idx-e502)最大城市，位于[北部特贸区](#idx-e505)、[翡翠海峡](#idx-e416)中央，是全大陆南北贸易的关键枢纽与海运门户。\"},{\"id\":\"e507\",\"title\":\"卡恩顿\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一，由同名公爵世袭领有，首府[柯拉罗](#idx-e508)。\"},{\"id\":\"e508\",\"title\":\"柯拉罗\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一[卡恩顿](#idx-e507)公国首府。\"},{\"id\":\"e509\",\"title\":\"梅尔帕尼\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一，由同名公爵世袭领有，核心领地为[梅尔帕尼岛](#idx-e510)，首府[梅卡托](#idx-e511)。现任[四公联席会议](#idx-e243)[首席发言人](#idx-e242)诺维雅三世即梅尔帕尼公爵。\"},{\"id\":\"e510\",\"title\":\"梅尔帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)群岛南部主岛区的核心岛屿之一，与[阿卡帕尼岛](#idx-e504)合计聚居全联邦逾半人口。\"},{\"id\":\"e511\",\"title\":\"梅卡托\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一[梅尔帕尼](#idx-e509)公国首府。\"},{\"id\":\"e512\",\"title\":\"米德可尔\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)境内地名。1356年[第二次阿索战争](#idx-e269)后，卡帕尼四公爵于此会晤宣布建立诸公联合，是联邦独立的历史象征地点。\"},{\"id\":\"e513\",\"title\":\"汶托布鲁\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一[汶托尼亚](#idx-e514)公国首府。\"},{\"id\":\"e514\",\"title\":\"汶托尼亚\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一，由同名公爵世袭领有，首府[汶托布鲁](#idx-e513)；其[汶托尼亚商会](#idx-e339)为[四大商会](#idx-e336)之一。\"},{\"id\":\"e516\",\"title\":\"伊索拉韦尔德\",\"aliases\":[\"伊索拉\"],\"body\":\"[卡帕尼诸公联合](#idx-e502)首都，通称伊索拉，同时是[阿卡帕尼](#idx-e503)公国首府，四公国的政治核心所在地。当地作坊以镀银工艺见长，[索利亚商会](#idx-e338)创办于此。\"},{\"id\":\"e517\",\"title\":\"尼希尔伊玛目酋邦\",\"aliases\":[\"尼希尔\",\"尼希尔酋邦\"],\"body\":\"通称尼希尔酋邦，位于大陆西北角沙漠绿洲与两河流域的神权部落联邦国家，首都[阿尔努尔](#idx-e518)。五世纪[萨阿尔血王朝](#idx-e539)覆灭后，诸部酋长于阿尔努尔会盟，推举诸神大祭司为[伊玛目教长](#idx-e199)，成立酋邦。尼希尔国土五百八十万平方[陆里](#idx-e387)，由[诸神圣土](#idx-e202)与八部落领地构成，人口约一千八百万。酋邦是当今大陆唯一合法保有奴隶制的国家，社会等级高度固化。\"},{\"id\":\"e518\",\"title\":\"阿尔努尔\",\"aliases\":[],\"body\":\"[尼希尔伊玛目酋邦](#idx-e517)首都兼伊玛目城，位于两河流域核心地带，属[教长](#idx-e199)直辖的[诸神圣土](#idx-e202)。422年诸部酋长于此会盟建立部落联邦体制、推举首任伊玛目教长；城中六神各有神庙，另有教长主持全酋邦最隆重仪典的[大神庙](#idx-e186)，[酋长会议](#idx-e239)亦每年在此召开。\"},{\"id\":\"e519\",\"title\":\"哈亚特河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)两河之东河，发源于[冠脊山脉](#idx-e419)西脉北麓的积雪融水，自南向北流经酋邦西部，于[塔巴特](#idx-e523)与[纳赫尔河](#idx-e520)交汇后入[凛冰洋](#idx-e423)。其洪汛带来上游冲积土并补充土壤水分，随洪水消退而展开的播种是全酋邦农业的年度起点。\"},{\"id\":\"e520\",\"title\":\"纳赫尔河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)两河之西河，发源于[索拉瑞斯](#idx-e429)境内的[镜心湖](#idx-e436)，自南向北流经酋邦西部，于[塔巴特](#idx-e523)与[哈亚特河](#idx-e519)交汇。因源头在索拉瑞斯境内，诸神信仰第一季的西祭典历来只能在靠近南边境的城市勉强举行，这也是尼索边境关系长期恶劣的原因之一。\"},{\"id\":\"e521\",\"title\":\"沙阿万大魔矿\",\"aliases\":[\"大魔矿\"],\"body\":\"位于[尼希尔](#idx-e517)东部沙阿万沙漠地下，全大陆最大的单一[魔矿](#idx-e71)产地，年产量占大陆总量逾半，[高品级魔矿](#idx-e65)更占大陆产出八成以上，几乎构成事实垄断。矿井多由[神遴者](#idx-e412)以[秘术](#idx-e3)开凿，此后的采掘、支护、排水与转运则由奴隶以常规工具承担。各国对尼希尔的结构性经济依赖即根源于此。\"},{\"id\":\"e522\",\"title\":\"沙阿万大沙漠\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)东部广袤沙漠，是大陆最严酷的干旱地带，地表资源匮乏，昼夜温差可超三十[星度](#idx-e395)，仅有[冠脊山脉](#idx-e419)北脉北麓发源的两条小型沙漠河流维系着若干绿洲；地下则蕴藏[沙阿万大魔矿](#idx-e521)。\"},{\"id\":\"e523\",\"title\":\"塔巴特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)西部[纳赫尔河](#idx-e520)与[哈亚特河](#idx-e519)的交汇处，是两河流域的重要节点，两河在此汇合后继续北行入[凛冰洋](#idx-e423)。\"},{\"id\":\"e524\",\"title\":\"希尔文诺\",\"aliases\":[],\"body\":\"大陆精灵族裔及其文明与家园的统称，位于[冠脊山脉](#idx-e419)间的封闭盆地，由二十余个[氏族](#idx-e211)部落构成，最大聚落为[大圣树](#idx-e214)所在的[希尔文尼亚](#idx-e527)。其实际控制面积以大森林为界约一百二十万平方[陆里](#idx-e387)，人口一般认为不超过一百万。制度植根于大圣树信仰，每三十年召开[万叶庭](#idx-e213)全体表决，[叶络枢机院](#idx-e216)理日常行政与对外事务。1132年与人类首次接触，此后长期保持中立与封闭，被各国视为大陆事务的天然缓冲区与仲裁者。\"},{\"id\":\"e525\",\"title\":\"葛林沃尔克\",\"aliases\":[],\"body\":\"大陆东北角地区，由南北两支山脉夹峙高山密林构成，北部为雪原冰川。是大陆地理信息最匮乏的区域，据传其可能存在智慧种族与独立的魔法体系，但学界均无可靠资料。\"},{\"id\":\"e527\",\"title\":\"希尔文尼亚\",\"aliases\":[],\"body\":\"[希尔文诺大圣树](#idx-e214)所在之地，精灵族规模最大的聚居点，[万叶庭](#idx-e213)与[叶络枢机院](#idx-e216)所在。据推测是大陆最优越的[元素丰地](#idx-e52)之一。\"},{\"id\":\"e528\",\"title\":\"希尔文诺大森林\",\"aliases\":[],\"body\":\"精灵族世代定居之地，坐落于[冠脊山脉](#idx-e419)北脉与东南脉合围而成的山间盆地，是大陆封闭程度最高的区域之一，实际控制面积约一百二十万平方[陆里](#idx-e387)。山脉双重合围造就封闭湿润的气候，孕育大量大陆其他地区所没有的特有动植物；盆地开口朝向东南，东南脉中部的天然隘口是[林缘议厅](#idx-e276)所在地。\"},{\"id\":\"e532\",\"title\":\"冠阳\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之首，[星空学派](#idx-e6)完整名\\\"主序·冠阳\\\"，即太阳。[源星](#idx-e56)属权威、创造与审判；[正教](#idx-e146)神学中象征[唯一神](#idx-e135)，对应[仪式历](#idx-e361)[圣神日](#idx-e358)与[通用历](#idx-e368)日曜日。\"},{\"id\":\"e533\",\"title\":\"烬铸星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"熔炉·烬铸星\\\"。[源星](#idx-e56)属转化、破坏与锻造，常被视为天球之上的锻造炉象征；[正教](#idx-e146)神学上象征[圣约瑟](#idx-e124)，对应[烬曜日](#idx-e351)。\"},{\"id\":\"e534\",\"title\":\"卡帕尼王国\",\"aliases\":[],\"body\":\"367年[卡帕尼](#idx-e502)群岛各城邦统一而成的王国。自712年起与[阿布丹提亚](#idx-e452)通商，723年签订《[梅尔卡托条约](#idx-e278)》后成为其附庸，986年正式并入阿布丹提亚为帝国第七省；今卡帕尼四公国即溯源于并入后所设的四个[公爵领](#idx-e230)。\"},{\"id\":\"e539\",\"title\":\"萨阿尔血王朝\",\"aliases\":[],\"body\":\"古代[尼希尔](#idx-e517)地区存在的政权，由掌握[秘术](#idx-e3)的萨阿尔部落于[大陆历](#idx-e346)元前二世纪建立。该部自[沙阿万大沙漠](#idx-e522)西侵，用八年统一西尼希尔诸部，王朝延续至五世纪。其以自身信仰强行替代西尼希尔原有神话体系，奠定了尼希尔日后的诸神信仰与政教结构。史籍普遍估算，王朝治下因屠杀或献祭而死者逾四百万。该王朝在五世纪大起义中覆灭，但其制度主体却被422年的[阿尔努尔](#idx-e518)会盟所承袭。\"},{\"id\":\"e541\",\"title\":\"索拉尔王国\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)的前身，于西诺拉尼亚[黑暗时代](#idx-e273)中崛起的王国。1159年，索拉尔国王[阿利昂](#idx-e235)统一西大陆诸国、受牧首册封为首位[龙裔凯撒](#idx-e234)，索拉瑞斯帝国由此建立。现代通用度量衡的长度单位[步米](#idx-e378)与[陆里](#idx-e387)即源自索拉尔王国的[军团](#idx-e294)行军传统。\"},{\"id\":\"e544\",\"title\":\"汐月\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"银杯·汐月\\\"，即月亮。[源星](#idx-e56)属容纳、精神与教导；[正教](#idx-e146)神学上象征[圣约翰](#idx-e123)，对应[月曜日](#idx-e376)。艾瑟瑞姆[星历](#idx-e371)即以其盈亏循环为月。\"},{\"id\":\"e548\",\"title\":\"织虹星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"脉生·织虹星\\\"。[源星](#idx-e56)属修复、治疗与幻象；[正教](#idx-e146)神学上象征[圣保罗](#idx-e119)，对应[虹曜日](#idx-e348)。\"},{\"id\":\"e549\",\"title\":\"仲裁星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"律令·仲裁星\\\"，是星空中最亮且运动最明显的三颗星体之一。[源星](#idx-e56)属秩序、守护与契约；[正教](#idx-e146)神学上象征[圣伊琳娜](#idx-e122)，对应[裁曜日](#idx-e345)。\"}],\"titleImagePath\":\"/compendium/诸国列志/卡帕尼.webp\",\"titleImageInsertLine\":3}}]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"12:I[27201,[\"/Nurania/next/static/chunks/ff1a16fafef87110.js\",\"/Nurania/next/static/chunks/0bd6498bda341889.js\"],\"IconMark\"]\na:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"卡帕尼诸公联合 | The United Principalities of Kapani\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"纪念塞勒内斯·尤里梅尔诞辰150周年系列文集\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/Nurania/icon.svg?icon.986a92ce.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L12\",\"3\",{}]]\n"])</script></body></html>
