法术军事力量之一，除承担国防与宗教武装职能外，也被广泛用于大型民用工程建设，索菲亚大运河正是其最具代表性的成果。 \r\n\r\n### 历史\r\n\r\n### 气候地理\r\n\r\n圣领大部分国土为西比尔稀树平原，地势平坦开阔，境内天然河流极为匮乏，气候整体偏干。平原北端濒临北门湾，其作为[凛冰洋](#idx-e428)伸入大陆中部的内湾，亦是索菲亚大运河的北端入口。大运河自北门湾几乎垂直向南贯穿[西比尔平原](#idx-e500)全境，于南端注入[翡翠海峡](#idx-e421)，是圣领境内最重要的水上动脉和大陆南北贸易的骨干通道；圣领东北接[葛林沃尔克山脉](#idx-e423)南北两支山脉与高山密林，东南与阿布丹提亚帝国毗邻，西南与索拉瑞斯帝国接壤，西北方向连接尼希尔酋邦。\r\n\r\n圣领整体属温带大陆性半干旱气候，冬冷夏暖，温差较大，年降水有限，天然植被以草地加稀树为主。西比尔平原向北直面北门湾与凛冰洋，无任何山脉屏障，冬天来自凛冰洋的冷气团南下横扫平原，带来寒冷干燥的强劲北风；圣领内部气候自北向南呈明显梯度：北部北门湾沿岸直接承受凛冰洋影响，冬天严寒，夏天短促，几乎不具备农业条件；中部西比尔平原腹地是大陆性气候最为典型的区域，冬天寒冷干燥，夏天温暖多晴、日照充足、昼夜温差大；南部运河下游一带受南方海洋湿润气流渗入，叠加大运河引水灌溉，是全圣领气候最温和、农业条件最优的区域。春秋两季平原地带开阔无遮挡，风力较强，是[朝圣](#idx-e102)者与商旅往来最为活跃的窗口。此外，大运河水体的持续蒸发在一定程度上提高了沿岸局地湿度，使运河沿线城市的体感气候明显优于平原腹地。\r\n\r\n圣领的物产格局深受气候条件塑造。染料作物是最具代表性的农业经济作物，以[托伊尔莓](#idx-e413)为代表——此类作物耐旱喜光，色素积累在昼夜温差大、日照强烈的环境中尤为充分，高度适应中部平原夏天的气候条件。大运河引水灌溉从根本上弥补了西比尔平原的先天降水不足，运河沿线耕地在两个世纪内持续开垦扩展；远离运河的平原腹地则以广布的天然草场支撑畜牧业，牛羊放牧为主，皮革与羊毛均有对外出口。圣领北部北门湾沿岸历史上深度参与凛冰洋捕捞，高纬度冷水海域孕育的稀有高端海产长期作为奢侈品输向大陆权贵阶层。矿产方面，索菲亚城北的[索菲亚银矿](#idx-e498)是大陆已知规模最大的单一银矿产地，为圣领高含银量的货币体系提供了物质基础。圣城索菲亚所在地是大陆中部已知最大的[元素丰地](#idx-e55)，高[元素](#idx-e54)丰度赋予这片土地天然的宜居优势与对元素[疏化](#idx-e39)的强韧抵抗力，是正教会立都于此的重要自然前提之一。\r\n\r\n### 魔法与技术\r\n\r\n圣领[魔法](#idx-e3)人口占比超过五成，是大陆神启魔法师密度最高的地区，这一数字本身即是圣领政教合一体制最直观的体现。正教会长期以来将神启魔法与唯一神信仰深度绑定，依托遍布全领的教会组织网络持续吸纳并培养神启人才，使圣领的魔法人力储备远超其人口规模所应有的量级。\r\n\r\n圣仪军是这一魔法资源最集中的体现，兼具军事防御与大型工程建设两类职能。出于防治元素疏化的考量，神启魔法师通常不自由参与日常产业劳动，而是由教会统一派遣调度，按需介入各地的大型工程项目，包括水利设施、农田开垦、大面积民用建筑及城堡教堂建设等，其参与的项目规模往往是常规劳动力难以独立承担的。索菲亚大运河正是圣仪军迄今最具代表性的建设成果。\r\n\r\n教会对神启魔法的调度依行政层级分作三层。军事职能与国家级工程由牧首厅直属的圣仪军承担，索菲亚大运河即其代表；都主教区与[教区](#idx-e165)一级的大型基建，由对应的[都主教](#idx-e156)会或教区教会统一组织本级神启魔法师实施，无须上调圣仪军；最基层的施法则在[司祭](#idx-e180)手中——圣领全境行政官员均为神职人员，各城镇与乡村的基层教会由司祭分管，而司祭本人往往即是神启魔法师，在其辖内以魔法处置修缮、抗灾、水源处置与救护伤患等具体事务，属地方管理职权的一部分，唯须定期向上一级汇报。\r\n\r\n第三次阿索战争以来，圣领境内对祷言的管控持续收紧，基层施法愈发须经事先报备与批准，司祭的自决空间较战前已明显缩小。就民众的日常感受而言，圣领仍是大陆上魔法最为可见的国家；就产业而言，魔法的参与则相当有限，常规生产职能几乎全部由常规技术承担。\r\n\r\n触媒制作是圣领唯一以魔法本身为对象的技术，也是正教会核心的技术机密（详见〈[魔法矿石](#idx-e74)〉）。该技艺不见于文本，由师徒口授相传，习艺者必须是正教信徒，学成之后人身归属教会。技术与信仰在此处合为一事：教会所控制的不仅是工艺，也包括掌握工艺的人。忒奥西斯的常规技术以染料与酿造、银器、河工三项最具代表性。前两项的产业形态详见经济节；就技术而言，两者的共同点是工艺高度依赖特定原料——正紫染料的原料、托伊尔莓脱色副产物的发酵性质，以及索菲亚银矿的银，均无从以他物替代。河工则是圣领独有的一套工程经验：大运河由圣仪军开凿，此后的闸、渠、堤防与河道维护乃至通行管理均由常规河工承担，[运河仪所](#idx-e501)常年施展的除盐作业为其中的例外。\r\n\r\n这三项技术各自依赖一处不可移动的资源：托伊尔莓的种植区、索菲亚银矿的矿脉，以及运河本身。它们既是圣领技术优势的来源，也界定了其边界——工艺可以精进，原料却无从替代或扩张，而三者的处置权同样归于教会。圣领境内的工匠由教会附属机构统一管理，工艺随教会组织而非市场流转。对技术进步的态度则偏于保守：新工艺须先经与教义相合的审查，采用在后，这与忒奥西斯在神启魔法管控上的立场出于同一种谨慎。\r\n\r\n### 人口，民族与文化\r\n\r\n圣领各地分教会扮演领主角色，土地制度与阿布丹提亚相近，但宗教管控力度更强。农奴、自由农民与城市自由民的比例约为七比一比二，是大陆农奴比例最高的国家之一。宗教组织对劳动力的直接管辖使圣领的劳动力流动受到宗教与行政的双重限制。\r\n\r\n### 政治与军事\r\n\r\n忒奥西斯圣领是大陆唯一的神权共和国，最高元首称大牧首，终身任期。前任大牧首去世后，由[枢机主教团](#idx-e178)在闭门会议上以无记名投票选出继任者。枢机主教团是圣领事实上的最高权力机构，大牧首主持枢机主教团，并掌握枢机主教的选任权——枢机主教由大牧首从全大陆都主教中选任，以圣领各都主教区的都主教为主体，历史上偶有来自索拉瑞斯、[卡帕尼](#idx-e511)者。现任大牧首为西奥多三世（1417 年生，1467 年继位），原任牧首厅[圣礼厅](#idx-e177)枢机主教。\r\n\r\n圣领最高行政机构为牧首厅，主厅是大牧首与枢机主教团的议事场所——学界提及\"牧首厅\"时，多数情况下即指这一主厅。主厅之下设六个分厅按职能分管：圣礼厅（宗教事务，含索拉瑞斯[凯撒](#idx-e239)[血脉测试](#idx-e258)）、[省察厅](#idx-e183)（监察）、[司牧厅](#idx-e181)（民生）、[神启厅](#idx-e176)（神启魔法）、[传信厅](#idx-e151)（外交）、[卫教厅](#idx-e182)（军事）。[审判庭](#idx-e175)与[圣约瑟商会](#idx-e340)均为牧首厅直属机构，因规模与职能特殊，不纳入分厅序列。\r\n\r\n#### 政教合一与地方治理\r\n\r\n圣领自上而下实行完全的政教合一体制，教会即政府。全境划为五个都主教区，是最高一级行政区划，长官称都主教；都主教区下分若干教区，是最小一级行政区划，长官称主教。教区之内，各城镇与乡村的基层教会由司祭分管，不再单列为一级行政区划。所有行政官员均为神职人员（修士或修女），非正教信徒无法进入这一体系。神职人员的教阶自成一序：欲入神职者先以学徒身份见习，经[大祝职](#idx-e107)受任为修士或修女，此后依年资与功绩逐级升迁，男女不限，序列为学徒、[修士／修女](#idx-e184)、[执事](#idx-e186)、司祭、主教、都主教、大牧首。低阶神职可以婚娶，但须年满一定岁数（男三十、女二十五）或在教会奉神满十年；都主教及以上不得婚娶、也不得复归俗世，别称“[门徒](#idx-e169)”，象征舍弃现世之乐、专心侍神。\r\n\r\n司法独立于行政层级，由审判庭承担。其最高长官称[大审判长](#idx-e153)，由枢机主教团任命，与大牧首同为终身任期；审判庭在各教区均设分支机构，在索拉瑞斯帝国境内另设分庭。按两国协议，审判庭在索拉瑞斯境内开展宗教事务时仅负有知会帝国官方的义务，无需取得许可。除处理[异端](#idx-e147)事务外，审判庭也负责追捕、处置未经许可的神启魔法使用者，[诺万尼斯流放](#idx-e171)同样由审判庭全权执行。审判庭的教阶另成一列——学徒、修士／修女、执事、[审判官](#idx-e173)、[督审判官](#idx-e158)、审判长、大审判长——其“门徒”之限自督审判官起，起点低于教会序列，因审判庭代神行审、更须屏弃私情。\r\n\r\n审判庭另设有独立于军事系统的强制执行编制，由审判官及其扈从组成——这一安排在圣领体制中较为特殊：大陆其他地区在和平时期的司法强制一般由军队兼任。\r\n\r\n#### 军事力量\r\n\r\n圣领的军事力量由两支主力部队与两类特殊编制构成。\r\n\r\n[护教军](#idx-e294)是圣领最主要的常规部队，下分五个师，由各都主教区与所属教区分别组建，平时分散驻防各级教区，兼有日常治安职能，战时由卫教厅统一征召、整编为军。护教军士兵须为正教信徒。圣仪军是牧首厅直属的法术作战部队，全员为经层层选拔的神启魔法精锐，是大陆最强大的魔法军事力量之一。除军事职能外，圣仪军也承担大型工程建设，索菲亚大运河即其最具代表性的成果（详见经济节）。圣仪军成员以魔法能力为首要选拔标准，故未必是神职人员，但须宣誓效忠圣领与大牧首。\r\n\r\n[宗座卫队](#idx-e314)驻扎于圣城索菲亚，是大牧首与枢机主教团的近卫，承担圣城卫戍与宗教仪仗职能，不参与正面作战。宗座卫队高层成员从不出现在公共场合，人数、姓名、年龄、能力等均不对外公开。\r\n\r\n[圣礼骑士](#idx-e306)是索拉瑞斯凯撒派出的[龙骑士](#idx-e300)经大牧首册封后承担的特殊身份，最重要的义务是保卫圣领免于军事入侵，名义上为圣领最强战力；但这一义务限于防御，不能用于主动进攻。相关内容可参阅索拉瑞斯篇军事节。\r\n\r\n#### 外交立场\r\n\r\n圣领的外交立场高度由教义主导，这是它与大陆其他主要国家最根本的区别。\r\n\r\n圣领视索拉瑞斯凯撒为[唯一神](#idx-e138)在人间所立的合法统治者，两国是大陆当代最为紧密的政治组合。1295 年[教会大分裂](#idx-e164)后，正教会大牧首与公教会[宗主教](#idx-e187)互相开除教籍，公教会也因此成为与圣领关系最恶劣的组织（详见大陆总览宗教篇）。阿布丹提亚帝国因本身世俗化程度较高，与圣领的官方外交关系未受国内[公教总会](#idx-e161)掣肘，但近两个世纪以来，同样因[星术](#idx-e8)技术依赖、境内神启人才不断流向圣领两点而趋于紧张。[艾瑟瑞姆](#idx-e502)主修星术、卡帕尼过度商业化、尼希尔保有奴隶制，三者均与正教教义相悖，圣领对其外交态度偏向负面，关系普遍僵硬。\r\n\r\n圣领对[希尔文诺](#idx-e535)的态度较为微妙。人类对精灵[自然魔法](#idx-e9)的运行机理本就所知有限；而同为异种族的巨龙，其[龙族魔法](#idx-e1)所引发的神学争议在历史上曾冲击教会，直接导致了[第一次宗教改革](#idx-e155)（详见大陆总览魔法篇与宗教篇）。因此近代圣领在涉非人类问题上一贯谨慎，对精灵事务长期保持中立、不主动介入。牧首厅直属的圣约瑟商会则不受此限，照常参与精灵-人类贸易。\r\n\r\n#### 当代裂痕\r\n\r\n索拉瑞斯凯撒雷尔金一世的血统造假指控若属实，当时主管圣礼厅的西奥多枢机便是直接共犯——这一历史负担在反对雷尔金朝合法性的索拉瑞斯[军团](#idx-e299)长之中早已成为流言主轴。在这些军团长所辖的[行省](#idx-e237)之内，圣礼厅乃至圣领整体的政治地位较以往明显下降。\r\n\r\n更近期的矛盾来自三战之后。圣领在战后主动支持索拉瑞斯拖延南西比尔平原的领土交接，并与雷尔金二世政权进一步靠拢——这些做法使反对凯撒的诸军团长更加坚信凯撒与圣领之间存在利益绑定，同时也令圣领与阿布丹提亚、公教会的关系明显恶化。\r\n\r\n这一系列裂痕的内部因果链与圣领—索拉瑞斯互为人质的深层结构，详见笔者行观别录的相关篇章。\r\n\r\n### 经济\r\n\r\n忒奥西斯的经济格局以索菲亚大运河的开通作为分界明确地分出两个阶段。运河竣工前，西比尔平原因缺乏水源灌溉而农业产出相当有限；运河开通后，其带来的稳定水源令西比尔平原逐步开垦为良田，使圣领在近两个世纪内经历了大陆农业版图中最显著的结构性变化之一。染料作物是圣领主要的农业经济作物，北临北门湾的海岸位置亦使圣领历史上深度参与凛冰洋捕捞，特色奢侈海产长期作为高价值出口商品流向大陆各地权贵阶层。平原腹地远离运河灌溉的区域天然草场广布，以牛羊放牧为主要土地利用方式，羊毛与皮革作为副产品有一定的对外出口。\r\n\r\n圣领的支柱制造业是染料业，形成了从原料种植、染料提炼到纺织品染色加工的完整产业链，对外同时以原料染料和染色成品两种形式出口。其中正紫色染料来源于独特原料，在正教会神学体系中被视为神圣之色，明令禁止出口，仅限于教会组织内部流通使用。染料作物托伊尔莓是圣领产业体系中值得单独提及的例子：其提取亮蓝色染料后的脱色干制副产物是上好的发酵原料，催生了圣领极为发达的酿酒产业，高品质的[托伊尔莓酒](#idx-e414)既长期出现在正教会的宗教仪式中，也作为奢侈品大量出口。依托索菲亚银矿的稳定供给，圣领的银制品业同样高度发达，宗教器具历来以纯银打造，工艺精湛奢华，非宗教用途的银制品亦作为高价值商品对外出口。圣领的产业组织以各地分教会和牧首厅附属手工业为主体，教会在生产资料的持有与劳动力调配上均居于主导地位。\r\n\r\n服务业方面，朝圣活动是圣领最具特色的收入来源。来自索拉瑞斯、卡帕尼以及阿布丹提亚、艾瑟瑞姆少量地下信众的朝圣者沿既定路线前往圣城索菲亚，沿途催生了相当规模的旅店、酒馆、餐饮及宗教纪念品产业，是圣领境内城镇经济的重要组成部分。圣城索菲亚相传是唯一神降临之处，本为小村，今日的索菲亚大教堂藏有据称是[圣约翰](#idx-e126)升天时所钉[十字架](#idx-e130)的原木碎片；其西南方的[潘克拉托](#idx-e493)是约翰殉道之地，[圣骸](#idx-e123)存于圣约翰大教堂。\r\n\r\n#### 货币、金融与财政\r\n\r\n圣领流通货币为[伊琳娜圣银币](#idx-e346)与[伊琳娜分银币](#idx-e345)，以唯一神最初的四[使徒](#idx-e129)之一命名，由牧首厅直属铸造机构发行，兑换比率为一比一百，以高含量银铸造，含银量本身即构成防伪的核心机制。索拉瑞斯铁钞与铁筹作为特殊平行货币，被允许在圣领境内与圣银币等价自由流通，指定汇率为一比一。为防止铁钞大量积存于圣领境内，各级教会在日常金融业务中优先向客户提供圣银，牧首厅亦定期汇总境内铁钞，与索拉瑞斯帝国进行官方兑换，实现货币回流。\r\n\r\n圣领的金融体系与教会组织高度一体化，牧首厅与各级分教会在承担宗教职能的同时，扮演着事实上的中央银行与地方银行角色，信用以教会的神圣性为根本基础，而非世俗的国家强制力或商业信誉。教会金融业务收入来源多元，涵盖税收、信徒自愿捐献、神启魔法技术派遣收费、[赎罪券](#idx-e132)销售（一次性消费凭证，不可转让或继承）及储蓄借贷业务；圣领不发行[公债](#idx-e325)。教会发行的[存票](#idx-e319)与[债票](#idx-e348)仅允许在神职人员及教会机构之间流通，不开放民间二级交易，且没有正式机构或场所加以管理。对外贸易以卡帕尼[尼卡特铸币](#idx-e336)及[尼卡特汇票](#idx-e330)为外汇结算基准。\r\n\r\n财政方面，各级分教会即为地方财政机构，牧首厅金库即为中央国库。收入来源包括强制性税收——非信徒须额外缴纳[罗兹亚人头税](#idx-e168)（Rozya）——以及信徒捐献、魔法技术派遣收费、赎罪券收入与放贷盈利。征税权为圣领教会独有，具有强制性，是教会作为财政机构而非纯宗教组织的核心制度体现。\r\n\r\n#### 商业与贸易\r\n\r\n圣领拥有且仅拥有牧首厅直属的圣约瑟商会及其各地分商会，成员均为教会神职人员，负责圣领境内一切跨地区贸易与对外跨国贸易事务。圣约瑟商会在大陆其他国家的主要口岸均设有分部，但相较于境内活动较为收敛。大陆学界普遍认为圣约瑟商会兼具审判庭秘密情报网络的功能，其商会分部同时充当信息搜集渠道，尽管圣领官方对此完全否认。圣领不存在[工匠行会](#idx-e324)。\r\n\r\n圣领境内的物流运输依托主干路网与大运河两套体系。主干路网连接各都主教区的主要城市，大运河则是圣领最重要的内部贸易通道，运河沿岸催生了多座新兴城市，圣城索菲亚借此进一步扩张为兼具政治、宗教与经济中心地位的大都会。北门湾作为大运河的北部入口，是尼希尔魔矿经凛冰洋航线进入大陆主要贸易网的关键节点，圣领从中征收的[河金](#idx-e326)亦是牧首厅的重要财政收入来源。\r\n\r\n#### 索菲亚之水\r\n\r\n索菲亚大运河竣工于大陆历十四世纪后叶，由忒奥西斯圣领与索拉瑞斯帝国联合开凿，以圣仪军为主力、索拉瑞斯东部两个军团协助完成，历时七年。运河贯通大陆北部凛冰洋北门湾与南部翡翠海峡，绝大部分线路位于圣领境内，下游南段延伸至当时属于索拉瑞斯的西比尔平原南部——该地区恰是索拉瑞斯于第二次阿索战争中获得的新领土，开发需求与运河规划不谋而合，两国合作由此达成。\r\n\r\n运河的开凿同时服务于三重目的。宗教上，牧首厅意图借此浩大工程展现唯一神的神迹，强化正教会的宗教感召力，同时压制公教会对信众的吸引力。经济上，圣领境内缺乏天然河流，农业耕作与水力器械应用长期受限，运河引水有望根本性改变这一局面。交通上，一条贯通凛冰洋与翡翠海峡的人工水道，将大幅提升圣领乃至整个大陆的河运与贸易效率。\r\n\r\n竣工后，大运河的管理权移交圣领，由其负责日常维护与通行管理。第三次阿索战争后，运河下游东岸领土虽依约归还阿布丹提亚，但阿方仍接受圣领对运河的持续管辖——圣领相对开放的运河管理政策是这一安排得以维持的重要原因：凡向圣领报备货物并缴纳河金的船只，无论国籍与宗教归属均可通行，公教会船只同样被允许进入；正教会信徒与教会组织的船只享有河金减免。\r\n\r\n大运河开通后三重目标均得以有效实现。宗教上成为正教会宣扬神迹的有力载体，信众有所增长；经济上西比尔平原农业快速发展，圣领人口随之显著增长，河金更成为牧首厅的重要常规收入；交通上境内贸易效率显著提升，运河沿岸兴起了多座新城市。与此同时，大运河下游的西比尔平原南部地区因运河而成为价值极高的战略要地，其领土归属随之成为阿索两国长期博弈的核心争议之一。\r\n\r\n#### 运河仪所\r\n\r\n运河的日常维护中一处重要的特殊设施被称为运河仪所。其坐落于圣领领土最北端、大运河与北门湾的交汇入口处，是牧首厅对大运河实施管理的最前沿机构。\r\n\r\n仪所承担双重职能。其一是通行审核：所有自凛冰洋经北门湾进入大运河的船只，须在此处向仪所官员申报货物、缴纳河金，并接受必要的宗教与安全审查，方可南下通行。其二是海水除盐：凛冰洋虽含盐量较其他海域偏低，但直接引入仍不宜农业灌溉，仪所常驻神启魔法师因此持续对注入大运河的海水施展水元素魔法，将水中盐分析出并导入湾口，令进入运河的水体在源头即完成初步淡化处理。此后水流在南行途中持续混入地下水渗流与沿途降水，至运河中下游已与普通淡水河无异，可直接用于西比尔平原的农业灌溉。\r\n\r\n值得关注的是，仪所的除盐作业虽需常年累月地施展神启魔法，却从未在此地引发可观测的元素疏化现象。这一反常情况引起了学界的注意，主流解释认为其成因在于施法对象的特殊性：除盐魔法的作用对象是大运河水体本身，而大运河水体是大容量、持续定向流动的水元素流——施法所调用的水元素本即属于该水体，产生的疏化影响随即被水流带离施法区域输送至下游，使本地疏化无从积累。这一现象已成为[魔元素动力学](#idx-e31)领域的专项研究课题，也是运河仪所在学术界知名度远高于其行政地位的原因所在。\r\n"])</script><script>self.__next_f.push([1,"a:[\"$\",\"$2\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"min-h-[60vh] flex items-center justify-center text-[var(--ink-muted)]\",\"children\":\"加载中…\"}],\"children\":[\"$\",\"$L12\",null,{\"bookSlug\":\"compendium\",\"toc\":[{\"slug\":\"作者序\",\"title\":\"炉边随记（代作者序）\",\"titleEn\":\"Preface\",\"isArticle\":true},{\"slug\":\"年表与大事记 Chronology\",\"title\":\"年表与大事记\",\"titleEn\":\"Chronology\",\"isArticle\":true},{\"slug\":\"度量与岁时 Measures and Times\",\"title\":\"度量与岁时\",\"titleEn\":\"Measures and Times\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview\",\"title\":\"大陆总览 Overview\",\"children\":[{\"slug\":\"大陆总览 Overview/地理\",\"title\":\"地理概述\",\"titleEn\":\"The Geography\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/魔法\",\"title\":\"魔法概述\",\"titleEn\":\"The Magic\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/经济\",\"title\":\"经济概述\",\"titleEn\":\"The Economy\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/宗教\",\"title\":\"宗教概述\",\"titleEn\":\"The Religions\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/政治\",\"title\":\"政治概述\",\"titleEn\":\"The Politics\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/文化\",\"title\":\"文化概述\",\"titleEn\":\"The Culture\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"诸国列志 Chorography of the 星空学派\",\"aliases\":[],\"body\":\"将[魔法](#idx-e3)解释为[第五元素](#idx-e19)显现与外化形式的学派，通过[内化](#idx-e32)以太于体内再[显化](#idx-e46)来施展魔法。\"},{\"id\":\"e8\",\"title\":\"以太星术\",\"aliases\":[\"星术\",\"星空魔法\"],\"body\":\"[星空学派](#idx-e7)对自身[魔法](#idx-e3)的称呼，简称星术；亦名星空魔法。狭义专指各类星空魔法对应的[大星轨](#idx-e18)走势。\"},{\"id\":\"e9\",\"title\":\"自然魔法\",\"aliases\":[\"精灵魔法\",\"圣树魔法\"],\"body\":\"精灵族与生俱来的法术能力，源自与[大圣树](#idx-e219)的契约连接；亦称精灵魔法、圣树魔法。\"},{\"id\":\"e10\",\"title\":\"奥韦纳尔·安柯伦坦\",\"aliases\":[\"安柯伦坦\"],\"body\":\"[艾瑟瑞姆](#idx-e502)[天星师](#idx-e251)，1304年提出智慧生物出生时的[大星轨](#idx-e18)图像决定其[仪式星轨](#idx-e51)特征，且该特征恰合[丝黛兰尔](#idx-e42)的[源星](#idx-e59)分类法，该分类法由此成为[星术](#idx-e8)学界公认标准。\"},{\"id\":\"e12\",\"title\":\"半龙化\",\"aliases\":[],\"body\":\"人类与巨龙缔结[血契](#idx-e50)后，其思维与立场不可逆地向龙族一侧偏移的现象。\"},{\"id\":\"e18\",\"title\":\"大星轨\",\"aliases\":[\"天道星轨\"],\"body\":\"[天星五政](#idx-e43)在天球上的轨迹，代表宇宙中[以太](#idx-e19)流的流向；亦称天道星轨。\"},{\"id\":\"e19\",\"title\":\"第五元素\",\"aliases\":[\"以太\"],\"body\":\"构成群星与其间空间（宇宙）的物质，通称以太，永恒不朽；稀薄存在于大地之上，[星空魔法](#idx-e8)师可将其蓄积体内，是星术的能量来源。\"},{\"id\":\"e20\",\"title\":\"构成元素\",\"aliases\":[],\"body\":\"构成实体事物的四大[自然元素](#idx-e41)，不响应[祷言](#idx-e5)[术式](#idx-e40)。通过[秘术式](#idx-e2)可将其解离。\"},{\"id\":\"e25\",\"title\":\"精神力\",\"aliases\":[],\"body\":\"编织[祷言](#idx-e5)[术式](#idx-e40)所凭的能力，可经后天训练提高，只能依靠时间缓慢恢复。\"},{\"id\":\"e27\",\"title\":\"洛林阶运\",\"aliases\":[],\"body\":\"特定工艺的[星轨蚀刻](#idx-e79)（如旧式的[三分耦式](#idx-e35)蚀刻法）所致的[玛娜](#idx-e28)自然向外部流出的矿界面层现象。\"},{\"id\":\"e28\",\"title\":\"玛娜\",\"aliases\":[\"魔力\"],\"body\":\"[星空学派](#idx-e7)语境下[内化](#idx-e32)后的[以太](#idx-e19)，即俗称的魔力；释放后无法自然恢复，须[星术](#idx-e8)师冥想缓慢补充。\"},{\"id\":\"e30\",\"title\":\"米西斯类\",\"aliases\":[],\"body\":\"[魔矿](#idx-e74)[蚀刻](#idx-e79)工艺的一个类别，包含[三分耦式](#idx-e35)蚀刻、四分耦式蚀刻等。特征是加工过程对环境温度非常敏感。\"},{\"id\":\"e31\",\"title\":\"魔元素动力学\",\"aliases\":[],\"body\":\"[神启学派](#idx-e6)中研究[元素](#idx-e54)流动与[疏化](#idx-e39)机理的学科，由[神启魔法](#idx-e5)学者菲略奥斯等人奠基。\"},{\"id\":\"e32\",\"title\":\"内化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师于修习中将环境自由[以太](#idx-e19)汇入体内[仪式星轨](#idx-e51)的过程。\"},{\"id\":\"e35\",\"title\":\"三分耦式\",\"aliases\":[\"三分耦\"],\"body\":\"[米西斯类](#idx-e30)[魔矿](#idx-e74)[蚀刻](#idx-e79)工艺的一种，其加工过程长期依赖低温环境；1490年，该工艺获得可在室温条件下进行的重要突破。\"},{\"id\":\"e38\",\"title\":\"施法者\",\"aliases\":[],\"body\":\"能够主动运用[魔法](#idx-e3)的人口的统称，全大陆约占两成。\"},{\"id\":\"e39\",\"title\":\"疏化\",\"aliases\":[],\"body\":\"同一空间内反复施用[神启魔法](#idx-e5)后[自然元素](#idx-e41)恢复速率异常下降的现象，由神启魔法学者菲略奥斯提出。\"},{\"id\":\"e40\",\"title\":\"术式\",\"aliases\":[],\"body\":\"[神启魔法](#idx-e5)师以[精神力](#idx-e25)编织、临时改写自然法则的结构，是与[唯一神](#idx-e138)所立的单向契约。\"},{\"id\":\"e41\",\"title\":\"四大元素\",\"aliases\":[\"自然元素\"],\"body\":\"构成世界万物和游离在自然环境中的地、水、火、风[元素](#idx-e54)，也称自然元素；唯游离态者可为[神启魔法](#idx-e5)调用。\"},{\"id\":\"e42\",\"title\":\"塔莉拉·丝黛兰尔\",\"aliases\":[\"丝黛兰尔\"],\"body\":\"[星空学派](#idx-e7)[魔法](#idx-e3)先驱，著《[星术](#idx-e8)源流考》，首创以五颗天星对应五类魔法的[源星](#idx-e59)分类法，源星之名即出于此。\"},{\"id\":\"e43\",\"title\":\"天星五政\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)最重要的概念之一，指[冠阳](#idx-e543)、[汐月](#idx-e555)、[仲裁星](#idx-e560)、[烬铸星](#idx-e544)、[织虹星](#idx-e559)五颗天体。五政在天球上的轨迹被称为[大星轨](#idx-e18)，代表了宇宙中[以太](#idx-e19)流的流向。\"},{\"id\":\"e44\",\"title\":\"无属性元素流\",\"aliases\":[],\"body\":\"[秘术式](#idx-e2)解离祭品[构成元素](#idx-e20)后所得的能量形态，其性质仍是大陆[魔法](#idx-e3)学界研究的未解课题。\"},{\"id\":\"e46\",\"title\":\"显化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师控制体内[以太](#idx-e19)流运转特定[大星轨](#idx-e18)、将[玛娜](#idx-e28)转为有色状态并外放的过程。\"},{\"id\":\"e50\",\"title\":\"血契\",\"aliases\":[],\"body\":\"人类与巨龙缔结的契约，双方精神世界互相开放，可转移龙族[术式](#idx-e40)的[精神力](#idx-e25)消耗。\"},{\"id\":\"e51\",\"title\":\"仪式星轨\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师于体内仿照[大星轨](#idx-e18)建立的结构，人体各部位各对应一天宫。是星术师释放星术的核心系统。\"},{\"id\":\"e54\",\"title\":\"元素\",\"aliases\":[],\"body\":\"组成万物的最基本实体，包含构成世界的[四大元素](#idx-e41)以及构成群星与其间空间（宇宙）的[第五元素](#idx-e19)。\"},{\"id\":\"e55\",\"title\":\"元素丰地\",\"aliases\":[],\"body\":\"游离态[四大元素](#idx-e41)丰度明显高于大陆平均的天然区域，对[疏化](#idx-e39)有强韧抵抗力。\"},{\"id\":\"e56\",\"title\":\"元素枯竭\",\"aliases\":[],\"body\":\"[疏化](#idx-e39)的最终形态，[元素](#idx-e54)流几乎完全凝滞且长期无法恢复，学界认为不可逆转。\"},{\"id\":\"e59\",\"title\":\"源星\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师[丝黛兰尔](#idx-e42)在《星术源流考》中提出的星术分类法中，五类星术的源头，对应[天星五政](#idx-e43)。该分类法被称为源星分类法。\"},{\"id\":\"e64\",\"title\":\"动力炉\",\"aliases\":[],\"body\":\"大型[星术设备](#idx-e88)的供能核心，见于[魔偶](#idx-e86)、[巨像](#idx-e84)与[星术驿车](#idx-e90)等。\"},{\"id\":\"e68\",\"title\":\"高品级魔矿\",\"aliases\":[],\"body\":\"[元素](#idx-e54)储存率极高、可承受各种[魔法](#idx-e3)加工工艺的[魔矿](#idx-e74)，八成以上产自[沙阿万大魔矿](#idx-e532)。\"},{\"id\":\"e72\",\"title\":\"洛林星元\",\"aliases\":[\"星元\"],\"body\":\"粗加工[魔矿](#idx-e74)晶体经[星轨蚀刻](#idx-e79)、注入[玛娜](#idx-e28)封装的[星术制品](#idx-e91)，通称星元，取名于洛林法蚀刻，可为小型[星术设备](#idx-e88)供能。\"},{\"id\":\"e74\",\"title\":\"魔法矿石\",\"aliases\":[\"魔矿\"],\"body\":\"对五大[元素](#idx-e54)均具极高流通率与储存率的天然矿石，通称魔矿，是大陆最重要的战略资源。\"},{\"id\":\"e76\",\"title\":\"蚀刻魔矿\",\"aliases\":[],\"body\":\"经[星轨蚀刻](#idx-e79)的[魔矿](#idx-e74)，可按[回路](#idx-e78)结构储存[玛娜](#idx-e28)，并在触发时释放对应[星术](#idx-e8)。\"},{\"id\":\"e77\",\"title\":\"托兰瓦尔·洛林\",\"aliases\":[\"洛林\"],\"body\":\"[艾瑟瑞姆](#idx-e502)[天星师](#idx-e251)，1125年首报可流通储存[以太](#idx-e19)的矿石并据以发明[星轨蚀刻](#idx-e79)；洛林法蚀刻为纪念其贡献而名，[洛林星元](#idx-e72)、[洛林阶运](#idx-e27)之名亦由此而来。\"},{\"id\":\"e78\",\"title\":\"星轨回路\",\"aliases\":[\"回路\"],\"body\":\"通过[蚀刻](#idx-e79)在[魔矿](#idx-e74)上建立的模仿[仪式星轨](#idx-e51)的通路，允许魔矿储存[玛娜](#idx-e28)，并在特定条件触发下释放对应[星术](#idx-e8)。\"},{\"id\":\"e79\",\"title\":\"星轨回路蚀刻\",\"aliases\":[\"蚀刻\",\"星轨蚀刻\",\"洛林法蚀刻\"],\"body\":\"于[魔矿](#idx-e74)表面蚀刻[仪式星轨](#idx-e51)[回路](#idx-e78)的技术，简称星轨蚀刻或蚀刻，为纪念发明人，又名洛林法蚀刻。1125年由[艾瑟瑞姆](#idx-e502)[星术](#idx-e8)学者[托兰瓦尔·洛林](#idx-e77)发明，构成了[星术设备](#idx-e88)的基石。\"},{\"id\":\"e84\",\"title\":\"星术巨像\",\"aliases\":[\"巨像\"],\"body\":\"[星术](#idx-e8)兵种的大型作战单位，通称巨像，由专精操作的星术师远距控制。\"},{\"id\":\"e86\",\"title\":\"星术魔偶\",\"aliases\":[\"魔偶\"],\"body\":\"以[蚀刻](#idx-e79)[回路](#idx-e78)驱动的小型[星术](#idx-e8)作战或劳作单位，通称魔偶，有农用魔偶、清扫魔偶等。\"},{\"id\":\"e88\",\"title\":\"星术设备\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e76)制成的各类器物的统称，自家用台灯至战场[巨像](#idx-e84)[动力炉](#idx-e64)，是[艾瑟瑞姆](#idx-e502)高技术社会立国的物质基础。\"},{\"id\":\"e90\",\"title\":\"星术驿车\",\"aliases\":[],\"body\":\"以[动力炉](#idx-e64)驱动的陆上载具，行于[艾瑟瑞姆](#idx-e502)城市内或城际道路。\"},{\"id\":\"e91\",\"title\":\"星术制品\",\"aliases\":[],\"body\":\"[星术设备](#idx-e88)所需半成品作为贸易品的称呼，[洛林星元](#idx-e72)为其典型代表。\"},{\"id\":\"e102\",\"title\":\"朝圣\",\"aliases\":[],\"body\":\"[正教](#idx-e150)信众沿既定路线前往[圣城索菲亚](#idx-e495)的虔修，是[圣领](#idx-e491)可观的收入来源。\"},{\"id\":\"e103\",\"title\":\"称义\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒持守信仰、按神的教诲生活而得免[宿债](#idx-e134)的全过程，自[洗礼](#idx-e140)始，至临终而成。\"},{\"id\":\"e107\",\"title\":\"大祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)学徒正式受任为神职的[圣事](#idx-e124)。\"},{\"id\":\"e109\",\"title\":\"告解\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒为自身罪行请求赦免的[圣事](#idx-e124)，可反复进行。\"},{\"id\":\"e110\",\"title\":\"公教\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)两大教派之一，1295年[教会大分裂](#idx-e164)后自[阿布丹提亚](#idx-e460)境内的[正教会](#idx-e185)独立而成，以[公教会](#idx-e159)为组织载体，是阿布丹提亚人口的第一大信仰。将[星空魔法](#idx-e8)一并纳入[唯一神](#idx-e138)权柄、另尊保罗为第二先知；主张轻罪可凭虔信与[圣事](#idx-e124)自赦，审判之权唯神独有，故不设[审判庭](#idx-e175)建制并废除[诺万尼斯流放](#idx-e171)，对个人虔修的要求高于[正教](#idx-e150)；[季首弥撒](#idx-e112)与节庆均依[通用历](#idx-e373)。\"},{\"id\":\"e112\",\"title\":\"季首弥撒\",\"aliases\":[],\"body\":\"[正教](#idx-e150)于[仪式历](#idx-e366)各季首日，[公教](#idx-e110)于[通用历](#idx-e373)各季首日举行的规模略大于每周[弥撒](#idx-e116)的集体仪式。\"},{\"id\":\"e113\",\"title\":\"坚振\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中，标志[称义](#idx-e103)大体完成的[圣事](#idx-e124)，一生一次，须对教会有重大贡献或持守信仰足够长久。\"},{\"id\":\"e114\",\"title\":\"苦行\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中，赦免所需的赎罪之法，其责可购[赎罪券](#idx-e132)折抵。\"},{\"id\":\"e115\",\"title\":\"礼仪年\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中六季[弥撒](#idx-e116)与九大节庆构成的一整年宗教循环。\"},{\"id\":\"e116\",\"title\":\"弥撒\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)礼拜日举行的集体仪式，与每日的[日课](#idx-e120)同为[称义](#idx-e103)最重要的日常载体。\"},{\"id\":\"e117\",\"title\":\"冥界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中的[四界](#idx-e133)之一，信徒死后安息、静候轮回之地。\"},{\"id\":\"e120\",\"title\":\"日课\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒每日的功课，与礼拜日[弥撒](#idx-e116)同为[称义](#idx-e103)的日常载体。\"},{\"id\":\"e122\",\"title\":\"圣保罗\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之一，最初的医者，司治愈与修复；对应[织虹星](#idx-e559)与[虹曜日](#idx-e353)。[公教](#idx-e110)另尊其为第二先知。\"},{\"id\":\"e123\",\"title\":\"圣骸\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)语境下的圣徒遗骨，为[朝圣](#idx-e102)与教堂声望所系，如[潘克拉托](#idx-e493)大教堂所藏的[圣约翰](#idx-e126)圣骸。\"},{\"id\":\"e124\",\"title\":\"圣事\",\"aliases\":[],\"body\":\"指[正教](#idx-e150)与[公教](#idx-e110)六项圣事：[洗礼](#idx-e140)、[坚振](#idx-e113)、婚姻、[告解](#idx-e109)、[大祝职](#idx-e107)、[小祝职](#idx-e142)。\"},{\"id\":\"e125\",\"title\":\"圣伊琳娜\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之一，司秩序与契约；对应[仲裁星](#idx-e560)与[裁曜日](#idx-e350)，[圣领](#idx-e491)[伊琳娜圣银币](#idx-e346)以其得名。\"},{\"id\":\"e126\",\"title\":\"圣约翰\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之首，[正教](#idx-e150)唯一的先知与弥赛亚，司精神与教导；对应[汐月](#idx-e555)与[月曜日](#idx-e381)。\"},{\"id\":\"e127\",\"title\":\"圣约瑟\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之一，商会之圣，司转化、破坏与锻造；对应[烬铸星](#idx-e544)与[烬曜日](#idx-e356)，[圣约瑟商会](#idx-e340)以其得名。\"},{\"id\":\"e129\",\"title\":\"使徒\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载中，随[唯一神](#idx-e138)降世传教的最初四人：约翰、伊琳娜、约瑟、保罗。\"},{\"id\":\"e130\",\"title\":\"十字架\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)共用的宗教象征符号。[正教](#idx-e150)十字架为四端，象征四[元素](#idx-e54)权柄。[公教](#idx-e110)下端另加一横，四横端象征四元素，竖端象征[星术](#idx-e8)。\"},{\"id\":\"e132\",\"title\":\"赎罪券\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)售卖的一次性折抵[告解](#idx-e109)[苦行](#idx-e114)的凭证，不可转让或继承。\"},{\"id\":\"e133\",\"title\":\"四界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)神学的宇宙构成：[天界](#idx-e136)、[现界](#idx-e141)、[冥界](#idx-e117)、[虚界](#idx-e145)。\"},{\"id\":\"e134\",\"title\":\"宿债\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)神学中，人一出生便背负的亏欠。缘于[唯一神](#idx-e138)所借予而非赐予的权柄，受惠者无人能置身账外。\"},{\"id\":\"e135\",\"title\":\"索菲亚圣典\",\"aliases\":[\"圣典\"],\"body\":\"[唯一神信仰](#idx-e139)的最高典籍，通称《圣典》，分《创世录》、《弥赛亚记》、《神言书》、《箴言集》、四福音（《约翰福音》、《约瑟福音》、《伊琳娜福音》、《保罗福音》）与《预言书》。\"},{\"id\":\"e136\",\"title\":\"天界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中的[四界](#idx-e133)之一，[唯一神](#idx-e138)、圣徒与天使的居所。\"},{\"id\":\"e138\",\"title\":\"唯一神\",\"aliases\":[\"主\",\"神\",\"上帝\"],\"body\":\"[唯一神信仰](#idx-e139)所奉的至高神，信徒亦称主、神或上帝，是宇宙的创造者、维系者与监督者，也是世间一切[魔法](#idx-e3)力量的源头。\"},{\"id\":\"e139\",\"title\":\"唯一神信仰\",\"aliases\":[],\"body\":\"大陆流播最广的宗教，崇奉[唯一神](#idx-e138)，与[神启祷言](#idx-e5)一脉深度绑定，最高典籍为《[索菲亚圣典](#idx-e135)》。十三世纪末[教会大分裂](#idx-e164)后分为[正教](#idx-e150)与[公教](#idx-e110)两派，前者为[索拉瑞斯](#idx-e434)与[忒奥西斯](#idx-e491)的国教，后者是[阿布丹提亚](#idx-e460)人口的第一大信仰；其历法与礼拜之制的影响遍及各国。\"},{\"id\":\"e140\",\"title\":\"洗礼\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒入教与[称义](#idx-e103)之始的[圣事](#idx-e124)，一生一次，象征认清并领受自身的[宿债](#idx-e134)。\"},{\"id\":\"e141\",\"title\":\"现界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中[四界](#idx-e133)之一，人类生息的世界。\"},{\"id\":\"e142\",\"title\":\"小祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)神职人员卸任、复为寻常信徒之礼，多见于年老体弱者。\"},{\"id\":\"e145\",\"title\":\"虚界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中的[四界](#idx-e133)之一，天球与大地之外仍为虚所充满的空间，罪人与非正信者死后的去处。\"},{\"id\":\"e147\",\"title\":\"异端\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)语境下，秉持不同教义解释相异的教派；就[正教](#idx-e150)而言[公教](#idx-e110)即当代最大异端。\"},{\"id\":\"e150\",\"title\":\"正教\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)两大教派之一，以[正教会](#idx-e185)为组织载体，为[索拉瑞斯](#idx-e434)与[忒奥西斯](#idx-e491)的国教。认[神启祷言](#idx-e5)为[唯一神](#idx-e138)所授的权柄，[星空魔法](#idx-e8)则不在神权之列；一切罪无论大小均须经[告解](#idx-e109)方得赦免，并以神在[现界](#idx-e141)的代行者自任，设[审判庭](#idx-e175)严管神启魔法、以[诺万尼斯流放](#idx-e171)向神赎罪。历法与[礼仪年](#idx-e115)循环依[圣格里仪式历](#idx-e366)。\"},{\"id\":\"e151\",\"title\":\"传信厅\",\"aliases\":[],\"body\":\"[圣领](#idx-e491)[牧首厅](#idx-e170)六分厅之一，分管外交。\"},{\"id\":\"e152\",\"title\":\"大牧首\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)最高元首、[忒奥西斯](#idx-e491)圣领国家元首，由[枢机主教团](#idx-e178)闭门选出，终身任期。\"},{\"id\":\"e153\",\"title\":\"大审判长\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)最高长官，由[枢机主教团](#idx-e178)任命，与[大牧首](#idx-e152)同为终身任期。\"},{\"id\":\"e154\",\"title\":\"第二次宗教改革\",\"aliases\":[],\"body\":\"十三世纪末谋求将[星术](#idx-e8)纳入神权的改革，失败后直接导致[教会大分裂](#idx-e164)。\"},{\"id\":\"e155\",\"title\":\"第一次宗教改革\",\"aliases\":[],\"body\":\"八世纪中叶以[诺万尼斯大叛乱](#idx-e284)为导火索的改革，[龙族魔法](#idx-e1)获平反，《[索菲亚圣典](#idx-e135)·创世录》新增有关巨龙族的章节。\"},{\"id\":\"e156\",\"title\":\"都主教\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)[都主教区](#idx-e157)长官，教阶在主教之上；与[大牧首](#idx-e152)同不得婚娶，别称[门徒](#idx-e169)。\"},{\"id\":\"e157\",\"title\":\"都主教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e491)最高一级行政区划和宗教管理区划，全境共五个，长官称[都主教](#idx-e156)。[卡帕尼](#idx-e511)和[索拉瑞斯](#idx-e434)亦设有都主教区，但不具备行政职能。\"},{\"id\":\"e158\",\"title\":\"督审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)教阶之一，位在[审判官](#idx-e173)之上；[审判所](#idx-e166)驻任长官、[审判分庭](#idx-e172)官员。[诺万尼斯流放](#idx-e171)须由审判分庭所属督审判官主刑。\"},{\"id\":\"e159\",\"title\":\"公教会\",\"aliases\":[],\"body\":\"1295年[教会大分裂](#idx-e164)后，[阿布丹提亚](#idx-e460)境内[正教会](#idx-e185)脱离[牧首厅](#idx-e170)管辖独立而来的教会，领袖称[宗主教](#idx-e187)，驻[波马里亚](#idx-e467)。\"},{\"id\":\"e161\",\"title\":\"公教总会\",\"aliases\":[],\"body\":\"[公教会](#idx-e159)中枢，驻[阿布丹提亚帝国](#idx-e460)城市[波马里亚](#idx-e467)。\"},{\"id\":\"e164\",\"title\":\"教会大分裂\",\"aliases\":[],\"body\":\"1295年[第二次宗教改革](#idx-e154)失败后，[阿布丹提亚帝国](#idx-e460)境内[正教会](#idx-e185)宣布脱离[牧首厅](#idx-e170)独立，成立[公教会](#idx-e159)。\"},{\"id\":\"e165\",\"title\":\"教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e491)[都主教区](#idx-e157)下辖的最小一级行政区划，长官称主教。也是[正教会](#idx-e185)在大陆各国所划的宗教事务上的最小管理层级。\"},{\"id\":\"e166\",\"title\":\"教区审判所\",\"aliases\":[\"审判所\"],\"body\":\"[审判庭](#idx-e175)在[教区](#idx-e165)一级所设的分支机构，简称审判所，由[督审判官](#idx-e158)驻任长官。\"},{\"id\":\"e168\",\"title\":\"罗兹亚人头税\",\"aliases\":[],\"body\":\"[圣领](#idx-e491)对非信徒另征的人头税，是大陆唯一以宗教身份区分纳税标准的制度。\"},{\"id\":\"e169\",\"title\":\"门徒\",\"aliases\":[],\"body\":\"教会系统中[都主教](#idx-e156)及以上神职，以及[审判庭](#idx-e175)系统中自[督审判官](#idx-e158)及以上职位的别称，象征舍弃现世之乐、专心侍神；门徒不得婚娶。\"},{\"id\":\"e170\",\"title\":\"牧首厅\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)中枢以及[圣领](#idx-e491)最高行政机构，下设[圣礼厅](#idx-e177)、[省察厅](#idx-e183)、[司牧厅](#idx-e181)、[神启厅](#idx-e176)、[传信厅](#idx-e151)、[卫教厅](#idx-e182)六分厅。\"},{\"id\":\"e171\",\"title\":\"诺万尼斯流放\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[索拉瑞斯帝国](#idx-e434)维持的一种极刑，将受刑者留置诺万尼斯区域枯竭死地直至器官衰竭。\"},{\"id\":\"e172\",\"title\":\"审判分庭\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)在[都主教区](#idx-e157)一级的机构，长官称审判长，由[大审判长](#idx-e153)直接任命。\"},{\"id\":\"e173\",\"title\":\"审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)教阶之一，负责日常调查和执行事务，是[圣领](#idx-e491)独立于军事系统的强制执行编制。\"},{\"id\":\"e175\",\"title\":\"审判庭\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)直属司法和执行机构，处理[异端](#idx-e147)事务、追查未经许可的神启施法，拥有独立执法和行刑权。\"},{\"id\":\"e176\",\"title\":\"神启厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管[神启魔法](#idx-e5)事务。\"},{\"id\":\"e177\",\"title\":\"圣礼厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管宗教事务，亦负责[索拉瑞斯](#idx-e434)[凯撒](#idx-e239)的[血脉测试](#idx-e258)。\"},{\"id\":\"e178\",\"title\":\"枢机主教团\",\"aliases\":[],\"body\":\"[圣领](#idx-e491)事实上的最高权力机构，[大牧首](#idx-e152)去世后负责闭门选出继任者。成员由大牧首自[都主教](#idx-e156)中选任。\"},{\"id\":\"e180\",\"title\":\"司祭\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)教阶之一，分管各城镇乡村的基层教会，往往本人即[神启魔法](#idx-e5)师。\"},{\"id\":\"e181\",\"title\":\"司牧厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管民生。\"},{\"id\":\"e182\",\"title\":\"卫教厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管军事，战时统一征召[护教军](#idx-e294)。\"},{\"id\":\"e183\",\"title\":\"省察厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管监察。\"},{\"id\":\"e184\",\"title\":\"修士／修女\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)中经[大祝职](#idx-e107)受任的基层神职人员，[圣领](#idx-e491)全境行政官员均出于此。\"},{\"id\":\"e185\",\"title\":\"正教会\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)最大教派[正教](#idx-e150)的教会组织，以[忒奥西斯](#idx-e491)圣领[牧首厅](#idx-e170)为教会中枢，同时也是圣领的统治机构。\"},{\"id\":\"e186\",\"title\":\"执事\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)共有的教阶之一，位在[修士／修女](#idx-e184)之上。\"},{\"id\":\"e187\",\"title\":\"宗主教\",\"aliases\":[],\"body\":\"[公教会](#idx-e159)领袖，由全大陆[公教](#idx-e110)主教选出三名候选，再由盲眼童贞信徒抽签决定。\"},{\"id\":\"e190\",\"title\":\"大神庙\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e528)首都[阿尔努尔](#idx-e529)城中的[教长](#idx-e204)驻地，是酋邦的宗教中心与圣地。\"},{\"id\":\"e191\",\"title\":\"混沌之海\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中[混沌之河](#idx-e192)的尽头。现世的[巨航船](#idx-e194)于此为海浪撕毁，是为末日。千年后新船于混沌之河上游再度起航。\"},{\"id\":\"e192\",\"title\":\"混沌之河\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中，孕育[司费尔](#idx-e199)的停滞之河，经其令之流动后成为宇宙时间的载体。[巨航船](#idx-e194)自上游航行而下抵达[混沌之海](#idx-e191)，是为一次循环。\"},{\"id\":\"e194\",\"title\":\"巨航船\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中的宇宙譬喻：[现界](#idx-e141)如行于[混沌之河](#idx-e192)上的巨船，终将驶抵[混沌之海](#idx-e191)。\"},{\"id\":\"e195\",\"title\":\"玛阿特\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中的死后审判仪式，以心脏置于天平称量，砝码为[希塔](#idx-e202)手杖顶端的宝石。\"},{\"id\":\"e196\",\"title\":\"尼希尔诸神信仰\",\"aliases\":[\"诸神信仰\"],\"body\":\"行于[尼希尔酋邦](#idx-e528)一域的宗教，通称诸神信仰，是大陆唯一与活体献祭绑定者。奉[零之神](#idx-e199)司费尔及其所化六神，以死后的[玛阿特](#idx-e195)称量为教义核心，称量恰成平衡者受赐[秘术](#idx-e4)之力成为[神遴者](#idx-e417)。雏形出自两河流域早期部落，结构在前二世纪萨阿尔部征服西尼希尔后成型，宗教、秘术与统治三者由此缚为一体。\"},{\"id\":\"e199\",\"title\":\"司费尔\",\"aliases\":[\"零之神\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)中[混沌之河](#idx-e192)所孕育的最初亦唯一之神，以自身之躯造出[现界](#idx-e141)，又拆己身为六片化作六神，随后消隐，不受祭祀。\"},{\"id\":\"e202\",\"title\":\"希塔\",\"aliases\":[\"陆之神\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)中六神之一，老者之形，象征万物的终点，司灵魂与审判，看护[至福乐土](#idx-e206)；[玛阿特](#idx-e195)称量由其执行，砝码即其手杖顶端的宝石。\"},{\"id\":\"e204\",\"title\":\"伊玛目教长\",\"aliases\":[\"教长\"],\"body\":\"[尼希尔](#idx-e528)最高元首，简称教长，同时是酋邦的宗教领袖与[酋长会议](#idx-e244)首席。终身制，非世袭，代代以[秘术](#idx-e4)密封诏书委任继承。\"},{\"id\":\"e206\",\"title\":\"至福乐土\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中，[玛阿特](#idx-e195)称量通过者所被允许进入的永恒安乐之地，由[希塔](#idx-e202)看护。\"},{\"id\":\"e207\",\"title\":\"诸神圣土\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e528)中由[伊玛目教长](#idx-e204)直辖的宗教领地。含首都[阿尔努尔](#idx-e529)及周边耕地城市，由各部按比例出资供养。\"},{\"id\":\"e216\",\"title\":\"氏族\",\"aliases\":[],\"body\":\"精灵族的社会单位，被喻为[大圣树](#idx-e219)的分枝，各有族长与长老，本族领地内高度自治。\"},{\"id\":\"e218\",\"title\":\"万叶庭\",\"aliases\":[],\"body\":\"精灵族最高权力机构，每三十年于[希尔文尼亚](#idx-e538)召开，全体精灵借[圣树魔法](#idx-e9)旁听并投票。\"},{\"id\":\"e219\",\"title\":\"希尔文诺大圣树\",\"aliases\":[\"圣树\",\"大圣树\",\"圣树之母\"],\"body\":\"圣树信仰唯一的神圣对象，通称大圣树或圣树，矗立于[希尔文尼亚](#idx-e538)祭坛广场；凡有描述皆以女性位格出现，精灵称之为圣树之母，[自然魔法](#idx-e9)即祂分享之力。\"},{\"id\":\"e221\",\"title\":\"叶络枢机院\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e535)日常行政与对外事务机构，席位由[万叶庭](#idx-e218)轮选，长老兼承宗教职责。\"},{\"id\":\"e223\",\"title\":\"阿斯塔伦·塔利瑞安\",\"aliases\":[\"塔利瑞安\"],\"body\":\"[星术](#idx-e8)泰斗，1097年联合十二城邦创建[大星术研究院](#idx-e231)，即今[王家研究院](#idx-e254)之前身。\"},{\"id\":\"e231\",\"title\":\"大星术研究院\",\"aliases\":[],\"body\":\"1097年由[塔利瑞安](#idx-e223)联合十二城邦创建，[艾瑟瑞姆](#idx-e502)[王家研究院](#idx-e254)前身，是艾瑟瑞姆国家形态的起点。\"},{\"id\":\"e232\",\"title\":\"地星师\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e502)[星术](#idx-e8)学者的头衔之一。星术师于所属研究院研究室完成课题答辩，毕业后被授予的头衔。\"},{\"id\":\"e233\",\"title\":\"帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e460)的一级行政区划，共五个，与皇室直辖的[维里迪亚直辖省](#idx-e489)并列；省政府为中央[内阁](#idx-e242)的地方分支。原为六省，[卡帕尼](#idx-e511)独立后余五省。\"},{\"id\":\"e235\",\"title\":\"公爵领\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e460)最高级别的贵族封地，各[帝政省](#idx-e233)含一到两个公爵领。\"},{\"id\":\"e236\",\"title\":\"管理局\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e511)[特贸区](#idx-e514)的立法与行政机构，由区内各商会分部选派代表组成，最高长官称管理局主席。\"},{\"id\":\"e237\",\"title\":\"军团行省\",\"aliases\":[\"行省\"],\"body\":\"[索拉瑞斯](#idx-e434)的一级行政区划，一行省对应一[军团](#idx-e299)，共八个，长官称[行省总督](#idx-e256)。\"},{\"id\":\"e238\",\"title\":\"龙裔继嗣法\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)开国皇帝[阿利昂](#idx-e240)晚年制定的皇位继承法，以直系子嗣的龙血浓度为据，由[牧首厅](#idx-e170)主持[血脉测试](#idx-e258)。\"},{\"id\":\"e239\",\"title\":\"龙裔凯撒\",\"aliases\":[\"凯撒\"],\"body\":\"[索拉瑞斯](#idx-e434)最高统治者的称号，简称凯撒，即位须由[大牧首](#idx-e152)主持册封礼，体现君权神授。\"},{\"id\":\"e240\",\"title\":\"马尔奇安·阿利昂\",\"aliases\":[\"阿利昂\"],\"body\":\"[索拉瑞斯](#idx-e434)开国[凯撒](#idx-e239)，人龙混血，受[大牧首](#idx-e152)册封为首位龙裔凯撒；捐帝国东部领土立[忒奥西斯](#idx-e491)圣领，晚年制定《[龙裔继嗣法](#idx-e238)》。\"},{\"id\":\"e242\",\"title\":\"内阁\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e502)和[阿布丹提亚帝国](#idx-e460)的中央机构之一。均指直属于王室/皇室的日常行政机构，各有大臣分管外交、军务、内务与王室/皇室财政。\"},{\"id\":\"e244\",\"title\":\"酋长会议\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e528)最高权力机构，由[教长](#idx-e204)与各部落酋长组成，每年[金素](#idx-e355)季于[阿尔努尔](#idx-e529)召开，协商全酋邦外交、军事与内政事宜。\"},{\"id\":\"e245\",\"title\":\"三柱议会\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e460)最高立法与财政机构，1393年确立，三柱指皇室、贵族与[魔法](#idx-e3)阶级。\"},{\"id\":\"e249\",\"title\":\"特别仪式区\",\"aliases\":[\"仪式区\"],\"body\":\"位于[艾瑟瑞姆](#idx-e502)中南部最大平原，专用于王国[星术](#idx-e8)研究与设备制造，行政直属国王/女王，区内最大城市为[韦里泰尔](#idx-e509)。\"},{\"id\":\"e250\",\"title\":\"特区商法典\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e511)[北部特贸区](#idx-e514)适用的独立法系，不同于各公国法系。\"},{\"id\":\"e251\",\"title\":\"天星师\",\"aliases\":[],\"body\":\"[星术](#idx-e8)学者的最高阶头衔与职位，授予毕业后继续从事学术研究，且学术成果极为杰出的[地星师](#idx-e232)。[托兰瓦尔·洛林](#idx-e77)、[奥韦纳尔·安柯伦坦](#idx-e10)等均曾任天星师。\"},{\"id\":\"e252\",\"title\":\"天星首席\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e502)[王家研究院](#idx-e254)最高级别学者之职，永久由艾瑟瑞姆国王或女王兼任。\"},{\"id\":\"e253\",\"title\":\"王冠领地\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e502)国王直辖之地，含以首都[阿斯托利亚](#idx-e503)为首的[坠星湖](#idx-e510)南岸城市群。\"},{\"id\":\"e254\",\"title\":\"王家研究院\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e502)学术中枢，前身为[大星术研究院](#idx-e231)，兼掌王室继承事务与[特别仪式区](#idx-e249)管理，院长即[天星首席](#idx-e252)，永久由国王或女王兼任。\"},{\"id\":\"e256\",\"title\":\"行省总督\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)[军团行省](#idx-e237)最高长官，由[军团](#idx-e299)长兼任，任期二十年，每年赴首都[索尔因](#idx-e454)叙职。\"},{\"id\":\"e257\",\"title\":\"叙职大会\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)八位[行省总督](#idx-e256)每年赴[索尔因](#idx-e454)向[凯撒](#idx-e239)当面汇报施政与军务的会议。\"},{\"id\":\"e258\",\"title\":\"血脉测试\",\"aliases\":[],\"body\":\"《[龙裔继嗣法](#idx-e238)》规定的继承资格测试，由[牧首厅](#idx-e170)[圣礼厅](#idx-e177)主持，每代[凯撒](#idx-e239)继承人均须重测。\"},{\"id\":\"e264\",\"title\":\"仲裁所\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e511)[特贸区](#idx-e514)[管理局](#idx-e236)下属机构，承担特贸区司法职能。\"},{\"id\":\"e268\",\"title\":\"阿索战争\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e460)与[索拉瑞斯帝国](#idx-e434)之间的三次大规模战争（1290–1292、1351–1356、1479–1483）。\"},{\"id\":\"e269\",\"title\":\"布兰顿和约\",\"aliases\":[],\"body\":\"[第二次阿索战争](#idx-e274)停战和约，以[布兰顿河](#idx-e471)下游为两国新界，[布兰顿](#idx-e470)城割予[索拉瑞斯](#idx-e434)。\"},{\"id\":\"e270\",\"title\":\"布兰顿战役\",\"aliases\":[],\"body\":\"1479年[三战](#idx-e275)前期的一场决定性会战，[阿布丹提亚帝国](#idx-e460)获得战略性胜利。\"},{\"id\":\"e274\",\"title\":\"第二次阿索战争\",\"aliases\":[\"二战\"],\"body\":\"于1351–1356年[索拉瑞斯](#idx-e434)与[阿布丹提亚](#idx-e460)发生的第二次大规模战争，[忒奥西斯](#idx-e491)保持中立。索拉瑞斯获胜，得[西比尔平原](#idx-e500)南部与[布兰顿](#idx-e470)城，停战于《[布兰顿和约](#idx-e269)》；阿布丹提亚放弃[卡帕尼](#idx-e511)群岛，卡帕尼同年独立。\"},{\"id\":\"e275\",\"title\":\"第三次阿索战争\",\"aliases\":[\"三战\"],\"body\":\"于1479–1483年[索拉瑞斯](#idx-e434)与[阿布丹提亚](#idx-e460)发生的第三次大规模战争，阿布丹提亚获胜。停战于《[卡斯特鲁姆和约](#idx-e280)》，索拉瑞斯向阿布丹提亚归还[大运河](#idx-e432)下游东岸两座城市及其周边土地，两国当代边界由此确立。\"},{\"id\":\"e276\",\"title\":\"第一次阿索战争\",\"aliases\":[\"一战\"],\"body\":\"于1290–1292年[索拉瑞斯](#idx-e434)与[阿布丹提亚](#idx-e460)发生的第一次大规模战争，[忒奥西斯](#idx-e491)为索拉瑞斯盟友。索拉瑞斯获胜后与圣领同告东扩，停战于《[文特拉和约](#idx-e288)》；间接促成1295年[教会大分裂](#idx-e164)。\"},{\"id\":\"e278\",\"title\":\"黑暗时代\",\"aliases\":[],\"body\":\"指八世纪[七王约](#idx-e285)瓦解后，西诺拉尼亚地区长达数百年的多国混战时期。\"},{\"id\":\"e280\",\"title\":\"卡斯特鲁姆和约\",\"aliases\":[],\"body\":\"[第三次阿索战争](#idx-e275)停战和约，确立阿索当代边界；[大运河](#idx-e432)下游东岸两城交接至今悬而未决。\"},{\"id\":\"e281\",\"title\":\"林缘议厅\",\"aliases\":[],\"body\":\"1203年[希尔文诺](#idx-e535)[叶络枢机院](#idx-e221)于[冠脊山脉](#idx-e424)东南脉隘口所设，是当前大陆唯一公认的中立缔约见证机构。\"},{\"id\":\"e284\",\"title\":\"诺万尼斯大叛乱\",\"aliases\":[],\"body\":\"758年[龙骑士](#idx-e300)群体与[诺万尼斯王国](#idx-e549)结盟发动的叛乱，[索瑞斯战役](#idx-e287)引发大规模[元素枯竭](#idx-e56)。\"},{\"id\":\"e285\",\"title\":\"七王约\",\"aliases\":[],\"body\":\"328年西诺拉尼亚七国建立的松散邦联，存续约四个世纪，八世纪中叶瓦解。\"},{\"id\":\"e287\",\"title\":\"索瑞斯战役\",\"aliases\":[],\"body\":\"[诺万尼斯大叛乱](#idx-e284)中交战双方连续动用大规模[神启魔法](#idx-e5)的会战，直接导致诺万尼斯枯竭。\"},{\"id\":\"e288\",\"title\":\"文特拉和约\",\"aliases\":[],\"body\":\"[第一次阿索战争](#idx-e276)停战和约，[索拉瑞斯](#idx-e434)与[忒奥西斯](#idx-e491)领土东扩。\"},{\"id\":\"e294\",\"title\":\"护教军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e491)最主要的常规部队，下分五个师，由各[都主教区](#idx-e157)分别组建。\"},{\"id\":\"e296\",\"title\":\"近卫龙骑兵团\",\"aliases\":[\"龙骑兵团\"],\"body\":\"[索拉瑞斯](#idx-e434)以[飞龙](#idx-e297)为坐骑的精锐常规部队，通称龙骑兵团，直属[凯撒](#idx-e239)，约八万头飞龙、五万人编制，跨地形作战能力冠绝大陆。\"},{\"id\":\"e297\",\"title\":\"巨龙眷属\",\"aliases\":[\"飞龙\"],\"body\":\"巨龙与大型野兽的混血飞行亚种，通称飞龙，寿约五百年，是[龙骑兵团](#idx-e296)的坐骑。\"},{\"id\":\"e299\",\"title\":\"军团\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)最高军事编制，与[行省](#idx-e237)一体，下设团、大队、小队。\"},{\"id\":\"e300\",\"title\":\"龙骑士\",\"aliases\":[],\"body\":\"与巨龙缔结[血契](#idx-e50)、得以释放[龙族魔法](#idx-e1)的人类战士，存在[半龙化](#idx-e12)现象。\"},{\"id\":\"e301\",\"title\":\"龙骑士团\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e434)的顶级战力，成员皆与巨龙缔结[血契](#idx-e50)，效忠[凯撒](#idx-e239)本人而非帝国，团内以多数决议事。\"},{\"id\":\"e306\",\"title\":\"圣礼骑士\",\"aliases\":[],\"body\":\"由[大牧首](#idx-e152)册封的[龙骑士](#idx-e300)，席位限一人，承担[圣领](#idx-e491)防卫义务，但编制上仍属[龙骑士团](#idx-e301)。\"},{\"id\":\"e307\",\"title\":\"圣仪军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e491)[牧首厅](#idx-e170)直属的精锐法术作战部队，大陆规模最大的法术军力，兼承民间大型工程建设。\"},{\"id\":\"e314\",\"title\":\"宗座卫队\",\"aliases\":[],\"body\":\"[大牧首](#idx-e152)与[枢机主教团](#idx-e178)的近卫，驻[圣城索菲亚](#idx-e495)，高层成员一切信息不对外公开。\"},{\"id\":\"e319\",\"title\":\"存票\",\"aliases\":[],\"body\":\"银行或教会发行的储蓄凭证，附有利率。在[阿布丹提亚](#idx-e460)、[卡帕尼](#idx-e511)和[艾瑟瑞姆](#idx-e502)境内可在二级市场流通，卡帕尼存票可经银联跨行自由存取；[圣领](#idx-e491)存票仅限神职人员与教会机构之间流通，不开放民间交易。[尼希尔](#idx-e528)与[索拉瑞斯](#idx-e434)不发行存票。\"},{\"id\":\"e324\",\"title\":\"工匠行会\",\"aliases\":[],\"body\":\"按行业组织同业手工业者的机构，广泛存在于[阿布丹提亚](#idx-e460)、[艾瑟瑞姆](#idx-e502)与[卡帕尼](#idx-e511)，实行学徒制，配方与工序属行会秘密。\"},{\"id\":\"e325\",\"title\":\"公债\",\"aliases\":[],\"body\":\"由国家或[帝政省](#idx-e233)政府发行的[债票](#idx-e348)，于[阿布丹提亚](#idx-e460)、[艾瑟瑞姆](#idx-e502)和[卡帕尼](#idx-e511)发行流通。\"},{\"id\":\"e326\",\"title\":\"河金\",\"aliases\":[],\"body\":\"船只通行[索菲亚大运河](#idx-e432)所缴的费用，是[忒奥西斯](#idx-e491)[牧首厅](#idx-e170)的重要常规收入。\"},{\"id\":\"e329\",\"title\":\"卡帕尼银联\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e511)[四大商会](#idx-e341)与众多中小商会银行共组的联合体，发行并管理[尼卡特汇票](#idx-e330)。\"},{\"id\":\"e330\",\"title\":\"卡帕尼银联汇票\",\"aliases\":[\"尼卡特汇票\",\"汇票\"],\"body\":\"[卡帕尼银联](#idx-e329)发行的结算凭证，通称尼卡特汇票或汇票，可在任意卡帕尼银联成员银行兑现，学界视为已具事实货币地位。\"},{\"id\":\"e336\",\"title\":\"尼卡特铸币\",\"aliases\":[\"尼卡特\"],\"body\":\"[卡帕尼](#idx-e511)流通货币的通称，含金合金铸造，是大陆事实上的国际货币，[尼卡特汇票](#idx-e330)即依托该货币发行。\"},{\"id\":\"e340\",\"title\":\"圣约瑟商会\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e491)[牧首厅](#idx-e170)直属商会，垄断圣领境内外一切贸易，学界普遍认为兼具情报网络职能。\"},{\"id\":\"e341\",\"title\":\"四大商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e511)四公国各自直属的商会，由四公爵历史上直接出资创立，其主席即公爵本人。\"},{\"id\":\"e343\",\"title\":\"索利亚商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e511)商会之一，1489年前后由卡涅·道格拉斯创办，以[星术设备](#idx-e88)半成品与[魔矿](#idx-e74)原料分销起家，后跃居联邦前列。\"},{\"id\":\"e345\",\"title\":\"伊琳娜分银币\",\"aliases\":[],\"body\":\"[伊琳娜圣银币](#idx-e346)的辅币，兑换比率一比一百。\"},{\"id\":\"e346\",\"title\":\"伊琳娜圣银币\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e491)流通货币，以高含银量铸造并防伪，与[索拉瑞斯](#idx-e434)铁钞按一比一互认流通。\"},{\"id\":\"e348\",\"title\":\"债票\",\"aliases\":[],\"body\":\"银行或教会发行的债务凭证，附有利率。在[阿布丹提亚](#idx-e460)、[卡帕尼](#idx-e511)和[艾瑟瑞姆](#idx-e502)境内可在二级市场流通，[圣领](#idx-e491)债票仅限神职人员与教会机构之间流通，不开放民间交易。[尼希尔](#idx-e528)与[索拉瑞斯](#idx-e434)不发行债票。\"},{\"id\":\"e349\",\"title\":\"自由港\",\"aliases\":[],\"body\":\"[特贸区](#idx-e514)所设、享有极高自治权的港口体系，是国际贸易量激增的制度前提。\"},{\"id\":\"e350\",\"title\":\"裁曜日\",\"aliases\":[\"圣伊琳娜日\"],\"body\":\"[通用历](#idx-e373)一周第二日，亦简称星期二；[仪式历](#idx-e366)作圣伊琳娜日，对应天星[仲裁星](#idx-e560)。\"},{\"id\":\"e351\",\"title\":\"大陆历\",\"aliases\":[],\"body\":\"[通用历](#idx-e373)纪年，以[唯一神](#idx-e138)降临传教义于[圣约翰](#idx-e126)之年为元年，元年之前称元前。\"},{\"id\":\"e353\",\"title\":\"虹曜日\",\"aliases\":[\"圣保罗日\"],\"body\":\"[通用历](#idx-e373)一周第四日，亦简称星期四；[仪式历](#idx-e366)作圣保罗日，对应天星[织虹星](#idx-e559)。\"},{\"id\":\"e355\",\"title\":\"金素\",\"aliases\":[\"圣献\",\"冕宫月\",\"肆位\"],\"body\":\"一年六季的第四季，各地作物相继采收。[仪式历](#idx-e366)同季作圣献，[艾瑟瑞姆](#idx-e502)[星历](#idx-e376)作冕宫月，[尼希尔](#idx-e528)[萨辛历](#idx-e364)作肆位。\"},{\"id\":\"e356\",\"title\":\"烬曜日\",\"aliases\":[\"圣约瑟日\"],\"body\":\"[通用历](#idx-e373)一周第三日，亦简称星期三；[仪式历](#idx-e366)作圣约瑟日，对应天星[烬铸星](#idx-e544)。\"},{\"id\":\"e358\",\"title\":\"凛寒\",\"aliases\":[\"正炼\",\"琴宫月\",\"陆位\"],\"body\":\"一年六季的第六季，山地封路、[凛冰洋](#idx-e428)冰封，大陆整体进入年内节律最为收缩的状态。[仪式历](#idx-e366)同季作正炼，[艾瑟瑞姆](#idx-e502)[星历](#idx-e376)作琴宫月，[尼希尔](#idx-e528)[萨辛历](#idx-e364)作陆位。\"},{\"id\":\"e361\",\"title\":\"启蛰\",\"aliases\":[\"晖醒\",\"天宫月\",\"壹位\"],\"body\":\"一年六季的第一季，[通用历](#idx-e373)岁首所在。[凛冰洋](#idx-e428)浮冰退散、山地封雪消融、两河进入汛期，各地贸易与出行随之重新活跃。[仪式历](#idx-e366)同季作晖醒，[艾瑟瑞姆](#idx-e502)[星历](#idx-e376)作天宫月，[尼希尔](#idx-e528)[萨辛历](#idx-e364)作壹位。\"},{\"id\":\"e363\",\"title\":\"日曜日\",\"aliases\":[\"圣神日\"],\"body\":\"[通用历](#idx-e373)一周第五日，亦简称星期日；[仪式历](#idx-e366)作圣神日，对应天星[冠阳](#idx-e543)，是信众向[唯一神](#idx-e138)礼拜的礼拜日。\"},{\"id\":\"e364\",\"title\":\"萨辛历\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e528)地方历法，以当代伊玛目称号纪年，每代即位则重置元年，六季称[壹位](#idx-e361)至[陆位](#idx-e358)。\"},{\"id\":\"e366\",\"title\":\"圣格里仪式历\",\"aliases\":[\"仪式历\"],\"body\":\"[正教会](#idx-e185)原始历法，[通用历](#idx-e373)前身，[圣领](#idx-e491)与[索拉瑞斯](#idx-e434)的官方历法，六季与五日均保留宗教命名。\"},{\"id\":\"e373\",\"title\":\"通用历\",\"aliases\":[\"格里历\"],\"body\":\"大陆通行的太阳历，一年六季、每季五十日、每旬十日、每周五日；别称格里历，源自[正教会](#idx-e185)的[圣格里仪式历](#idx-e366)，经[公教会](#idx-e159)世俗化后扩散全大陆。\"},{\"id\":\"e376\",\"title\":\"星历\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e502)地方历法，大陆唯一的月亮历，六月之名取自黄道六宫。\"},{\"id\":\"e381\",\"title\":\"月曜日\",\"aliases\":[\"圣约翰日\"],\"body\":\"[通用历](#idx-e373)一周第一日，亦简称星期一；[仪式历](#idx-e366)作圣约翰日，对应天星[汐月](#idx-e555)，是四个劳作日之首。\"},{\"id\":\"e383\",\"title\":\"步米\",\"aliases\":[],\"body\":\"长度基本单位，源自[索拉瑞斯](#idx-e434)[军团](#idx-e299)标准行军步伐；一步米等于十分步米等于一百厘步米。\"},{\"id\":\"e390\",\"title\":\"界石\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)[军团](#idx-e299)沿主干道每千步所立的里程标记，亦为[陆里](#idx-e392)之所本。\"},{\"id\":\"e392\",\"title\":\"陆里\",\"aliases\":[],\"body\":\"长度单位，一陆里等于一千[步米](#idx-e383)，源自[军团](#idx-e299)沿主干道每千步立一[界石](#idx-e390)的传统。\"},{\"id\":\"e400\",\"title\":\"星度\",\"aliases\":[],\"body\":\"温度基本单位，源自[王家研究院](#idx-e254)的[魔矿](#idx-e74)[蚀刻](#idx-e79)环境控制需求，以纯水冰点为零、沸点为一百。\"},{\"id\":\"e413\",\"title\":\"托伊尔莓\",\"aliases\":[],\"body\":\"[圣领](#idx-e491)代表性染料作物，提取亮蓝色染料后的脱色副产物是上好的发酵原料。\"},{\"id\":\"e414\",\"title\":\"托伊尔莓酒\",\"aliases\":[],\"body\":\"以[托伊尔莓](#idx-e413)脱色副产物酿造的酒，既用于宗教仪式，也作奢侈品出口。\"},{\"id\":\"e417\",\"title\":\"神遴者\",\"aliases\":[\"神遴者阶层\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)的[玛阿特](#idx-e195)称量中，心脏与宝石恰成平衡者。宗教解释中，他们身负引导众生的责任，受赐[秘术](#idx-e4)之力转生现世；作为一个阶层，神遴者垄断了酋邦一切政治职位，[教长](#idx-e204)、祭司、部落酋长与长老无一例外皆出于此。\"},{\"id\":\"e418\",\"title\":\"北门湾\",\"aliases\":[],\"body\":\"[凛冰洋](#idx-e428)伸入大陆中部的内湾，位于[忒奥西斯](#idx-e491)北境，是[索菲亚大运河](#idx-e432)的北端入口。[尼希尔](#idx-e528)所产[魔矿](#idx-e74)经凛冰洋航线抵此南下，是当代大陆最重要跨洋贸易干线上的节点。\"},{\"id\":\"e419\",\"title\":\"晨风海\",\"aliases\":[],\"body\":\"大陆东南方海域，洋流自东往西、往北持续输送暖湿气流深入内陆，是[阿布丹提亚大平原](#idx-e461)优良农业气候的关键成因。[马提尼河](#idx-e479)与[波特利亚河](#idx-e469)汇流后注入此海。\"},{\"id\":\"e420\",\"title\":\"大星洋\",\"aliases\":[],\"body\":\"大陆西南侧的宽广海域，洋流复杂多变；其偏暖洋流携湿润气流北上，遇[裂境山脉](#idx-e427)与[冠脊山脉](#idx-e424)抬升成雨，是西诺拉尼亚地区森林的核心水分来源。\"},{\"id\":\"e421\",\"title\":\"翡翠海峡\",\"aliases\":[],\"body\":\"大陆南方水域，全大陆航运最繁忙之处，[卡帕尼](#idx-e511)群岛与大陆本体之间的物流几乎全经于此，亦是[索菲亚大运河](#idx-e432)的南端出口。卡帕尼北部岛链水文条件优越、港口全年可用，是这条贸易干线的天然枢纽。\"},{\"id\":\"e423\",\"title\":\"葛林沃尔克山脉\",\"aliases\":[],\"body\":\"大陆东北方最高处，是[阿布丹提亚](#idx-e460)北境的天然屏障，有效阻隔[凛冰洋](#idx-e428)冷气团南下，使山脉以南的平原远较同纬度温和。南脉沿线为大陆东部最重要的金属矿产区，铁铜之外亦产[魔矿](#idx-e74)——后者于十三世纪末被发现，成为帝国与[艾瑟瑞姆](#idx-e502)缔结技术协约的核心筹码。\"},{\"id\":\"e424\",\"title\":\"冠脊山脉\",\"aliases\":[],\"body\":\"大陆规模最大的山脉系统，分北、西、东南、南四脉。北脉与西脉合围[尼希尔](#idx-e528)南侧边境，北脉与东南脉之间夹含[希尔文诺大森林](#idx-e539)，南脉则完全位于[索拉瑞斯](#idx-e434)境内。冠脊山脉北脉同时是大陆西部最重要的气候屏障，其北为尼希尔干旱荒漠，其南为[希尔文诺](#idx-e535)封闭湿润的万年密林，是大陆诸域中最极端的毗邻气候对照。\"},{\"id\":\"e427\",\"title\":\"裂境山脉\",\"aliases\":[],\"body\":\"西南-东北走向纵贯[索拉瑞斯](#idx-e434)中部的山脉，是帝国东西地形的核心分界线。其以东为[奥利提斯平原](#idx-e435)，落在其雨影区而气候偏干；以西地势平缓，[镜心湖](#idx-e441)居中。山脉沿线铁铜矿藏富集，是大陆冶铁产业最重要的原料来源；[索尔河](#idx-e453)发源于其南麓。\"},{\"id\":\"e428\",\"title\":\"凛冰洋\",\"aliases\":[],\"body\":\"大陆北方极寒洋，以东西向洋流为主，北部与东部全年有浮冰，渔业与运输活动仅集中于中西部海域；[尼希尔](#idx-e528)[魔矿](#idx-e74)出口的主干路线即自酋邦出海口北上进入此洋，东行抵[北门湾](#idx-e418)后南下入[大运河](#idx-e432)。\"},{\"id\":\"e432\",\"title\":\"索菲亚大运河\",\"aliases\":[\"大运河\"],\"body\":\"[忒奥西斯](#idx-e491)与[索拉瑞斯](#idx-e434)联合开凿的人工水道，1381–1388年历时七年建成，以[圣仪军](#idx-e307)的[神启魔法](#idx-e5)为主力，是[大陆历](#idx-e351)史上最庞大的人造工程。自[北门湾](#idx-e418)几乎垂直向南贯穿[西比尔平原](#idx-e500)，南端注入[翡翠海峡](#idx-e421)，将[凛冰洋](#idx-e428)与翡翠海峡物理贯通，从根本上重塑了大陆南北贸易格局。\"},{\"id\":\"e433\",\"title\":\"终末碑座\",\"aliases\":[\"诺万尼斯平原\"],\"body\":\"[索拉瑞斯](#idx-e434)东南部平原，原为黑暗时期[诺万尼斯王国](#idx-e549)故地。[大陆历](#idx-e351)758年[诺万尼斯大叛乱](#idx-e284)的[索瑞斯战役](#idx-e287)中，交战双方连续动用大规模[神启魔法](#idx-e5)引发[元素枯竭](#idx-e56)，平原自此化为死地，七百余年未见任何恢复迹象。索拉瑞斯、[忒奥西斯](#idx-e491)与[艾瑟瑞姆](#idx-e502)三国均划其为禁入区。该地区也是[诺万尼斯流放](#idx-e171)的行刑地。\"},{\"id\":\"e434\",\"title\":\"索拉瑞斯帝国\",\"aliases\":[\"索拉瑞斯\"],\"body\":\"位于大陆中西部的军事集权帝制大国，首都[索尔因维克图斯](#idx-e454)。1159年[索拉尔王国](#idx-e552)国王[阿利昂](#idx-e240)统一西大陆诸国、受牧首册封为首代[龙裔凯撒](#idx-e239)而立国。国土一千一百二十万平方[陆里](#idx-e392)，划为八个[军团行省](#idx-e237)，逾七成为群山与原始森林，人口约四千二百万。以[军团](#idx-e299)—行省一体化制度与[龙骑兵团](#idx-e296)著称，尊[正教](#idx-e150)为国教，逾八成公民为正教信徒；外交强势，与[阿布丹提亚](#idx-e460)共构当代大陆两极。\"},{\"id\":\"e435\",\"title\":\"奥利提斯平原\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)境内[裂境山脉](#idx-e427)以东呈东北—西南走向的狭长平原，是帝国最主要的农业区与人口集中地之一，首都[索尔因维克图斯](#idx-e454)位于其西南角。因落在裂境山脉雨影区，气候较[镜心湖](#idx-e441)区偏干。\"},{\"id\":\"e441\",\"title\":\"镜心湖\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)西部的湖泊，是帝国最重要的农业产区核心与人口最密集的区域之一。受[大星洋](#idx-e420)暖流直接调节，湖体又进一步平抑温差，是帝国内气候最温和宜居的地带。[纳赫尔河](#idx-e531)发源于此；东岸最大城市为[雷克西姆](#idx-e446)。\"},{\"id\":\"e442\",\"title\":\"镜心湖行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)八个[军团行省](#idx-e237)之一，位于帝国西部，环[镜心湖](#idx-e441)而设，首府[雷克西姆](#idx-e446)。\"},{\"id\":\"e446\",\"title\":\"雷克西姆\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)[镜心湖行省](#idx-e442)首府，[镜心湖](#idx-e441)东岸最大城市，建有[圣保罗](#idx-e122)大教堂。堂中无[圣骸](#idx-e123)，仅供奉据称是保罗生前所披的斗篷——保罗殉道之处据《保罗福音》末章推测邻近镜心湖，[正教会](#idx-e185)因此在雷克西姆建立大教堂。\"},{\"id\":\"e453\",\"title\":\"索尔河\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)境内河流。发源于[裂境山脉](#idx-e427)南麓，流经首都[索尔因维克图斯](#idx-e454)后向东南注入[艾瑟瑞姆](#idx-e502)境内的[坠星湖](#idx-e510)，是帝国重要的内河水系。\"},{\"id\":\"e454\",\"title\":\"索尔因维克图斯\",\"aliases\":[\"索尔因\"],\"body\":\"[索拉瑞斯帝国](#idx-e434)首都，通称索尔因，位于[奥利提斯平原](#idx-e435)西南角，[索尔河](#idx-e453)流经其间。是帝国的政治军事中心与最大城市，八位[行省总督](#idx-e256)每年赴此参加[叙职大会](#idx-e257)；城南设有[龙骑士团](#idx-e301)驻地与飞场。\"},{\"id\":\"e460\",\"title\":\"阿布丹提亚帝国\",\"aliases\":[\"阿布丹提亚\",\"丹提亚帝国\"],\"body\":\"通称丹提亚帝国，位于大陆东南方大平原的君主宪政制大国，首都[维里迪亚](#idx-e488)。386年卡立曼·费内尔统一诸国建立帝政，费内尔家族统治延续至今；两次[阿索战争](#idx-e268)失利后于1393年建[三柱议会](#idx-e245)，和平演变为君主立宪制国家。国土八百七十万平方[陆里](#idx-e392)，划为五个[帝政省](#idx-e233)和一个直辖省，人口逾六千二百万，为全大陆最多。大陆第一大粮食出口国与政治东极，约七成人口信奉[公教](#idx-e110)。\"},{\"id\":\"e461\",\"title\":\"阿布丹提亚大平原\",\"aliases\":[\"丹提亚大平原\"],\"body\":\"[阿布丹提亚帝国](#idx-e460)国土主体，大陆东部平原带规模最大的一部分，为全大陆最集中的农业核心地带。地势平坦开阔，水系极为发达，冲积土壤肥沃；中部核心区无霜期长而几无结冻，是帝国粮食、棉花与人口的集中所在，首都[维里迪亚](#idx-e488)居其腹地。\"},{\"id\":\"e467\",\"title\":\"波马里亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e460)境内位于[润溪湖](#idx-e482)西南方的重要城市。是大陆东部已知[元素](#idx-e54)丰度最高的城市之一，天然宜居且对元素[疏化](#idx-e39)抵抗力强。历史上曾为[正教会](#idx-e185)在东诺拉尼亚最重要的宗教驻地，[教会大分裂](#idx-e164)后成为[公教总会](#idx-e161)所在地；[公教会](#idx-e159)于十四世纪宣称寻得的[圣保罗](#idx-e122)[圣骸](#idx-e123)即供奉于波马里亚大教堂。该城亦是波马里亚[公爵领](#idx-e235)首府，同名[帝政省](#idx-e233)的省名即出于此。\"},{\"id\":\"e469\",\"title\":\"波特利亚河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e460)境内的主要河流之一，发源自[葛林沃尔克](#idx-e536)南脉南麓，与[马提尼河](#idx-e479)于大平原中部汇流后注入[晨风海](#idx-e419)，两河交汇处即首都[维里迪亚](#idx-e488)所在。\"},{\"id\":\"e470\",\"title\":\"布兰顿\",\"aliases\":[],\"body\":\"[布兰顿河](#idx-e471)东岸城市，位于河流中游。[第二次阿索战争](#idx-e274)后依《[布兰顿和约](#idx-e269)》割予[索拉瑞斯](#idx-e434)，此后一百二十余年是帝国边境最靠东的据点。1479年[三战](#idx-e275)开战之初为[阿布丹提亚](#idx-e460)夺取，此后终战未再易手，现归属于阿布丹提亚。\"},{\"id\":\"e471\",\"title\":\"布兰顿河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e460)境内河流。自北向南流经[西比尔平原](#idx-e500)东南缘，中段接纳一条自西而来的支流后折向东南，于[法拉利亚](#idx-e473)一带入海；[第二次阿索战争](#idx-e274)后其下游为阿索两国界河，《[布兰顿和约](#idx-e269)》即以此河命名，1479年[布兰顿战役](#idx-e270)的战场亦在其中下游两岸。\"},{\"id\":\"e473\",\"title\":\"法拉利亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e460)境内，[布兰顿河](#idx-e471)入[翡翠海峡](#idx-e421)河口处的港镇。\"},{\"id\":\"e479\",\"title\":\"马提尼河\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e460)第一大河，发源于[穗满湖](#idx-e485)，向东南流经大平原后与[波特利亚河](#idx-e469)汇流注入[晨风海](#idx-e419)，两河交汇处即首都[维里迪亚](#idx-e488)所在。\"},{\"id\":\"e482\",\"title\":\"润溪湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e460)双湖之东者，与[穗满湖](#idx-e485)并称双湖，是帝国北部水系的重要源头。湖运承担北部矿区矿产向核心区的输送；西南方为[元素丰地](#idx-e55)城市[波马里亚](#idx-e467)。\"},{\"id\":\"e485\",\"title\":\"穗满湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e460)双湖之西者，与[润溪湖](#idx-e482)并称双湖。湖区周边水草丰美，是全大陆最集中的规模化牧区；[马提尼河](#idx-e479)发源于此。\"},{\"id\":\"e488\",\"title\":\"维里迪亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e460)首都，位于[马提尼河](#idx-e479)与[波特利亚河](#idx-e469)交汇处、[丹提亚大平原](#idx-e461)腹地，是帝国政治文化中心，也是帝国最重要的内河航运枢纽之一。城市内歌剧院与画廊林立，素有\\\"艺术之都\\\"之称。\"},{\"id\":\"e489\",\"title\":\"维里迪亚直辖省\",\"aliases\":[\"首都直辖省\"],\"body\":\"[阿布丹提亚帝国](#idx-e460)六个一级行政区中唯一由皇室直辖者，亦称首都直辖省，位于帝国西南，含首都[维里迪亚](#idx-e488)及周边；境内不设贵族封地与[帝政省](#idx-e233)政府，是该国唯一的直辖省。\"},{\"id\":\"e491\",\"title\":\"忒奥西斯圣治领\",\"aliases\":[\"忒奥西斯\",\"圣治领\",\"圣领\"],\"body\":\"位于大陆中央北部的[正教会](#idx-e185)神权共和国，通称圣治领或圣领，首都[圣城索菲亚](#idx-e495)。1159年[索拉瑞斯](#idx-e434)开国[凯撒](#idx-e239)[阿利昂](#idx-e240)将帝国东部领土捐献给[大牧首](#idx-e152)而立，是正教会取得世俗领地后的政治实体。国土两百三十万平方[陆里](#idx-e392)，划为五个[都主教区](#idx-e157)，人口一千三百万。大牧首兼国家元首，[牧首厅](#idx-e170)为最高行政机构。\"},{\"id\":\"e493\",\"title\":\"潘克拉托\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e491)境内城市，[圣约翰都主教区](#idx-e497)的都教座城。[圣约翰](#idx-e126)殉道之地，[圣骸](#idx-e123)存于圣约翰大教堂。\"},{\"id\":\"e495\",\"title\":\"圣城索菲亚\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e491)圣领首都，[大牧首](#idx-e152)及[牧首厅](#idx-e170)所在地。相传为[唯一神](#idx-e138)降临之处，本为小村，圣领建立及[大运河](#idx-e432)开通后扩张为兼具政治、宗教与经济中心地位的大都会。是大陆中部已知最大的[元素丰地](#idx-e55)，也是[正教会](#idx-e185)立都于此的重要自然前提；索菲亚大教堂藏有据称是[圣约翰](#idx-e126)升天时所钉[十字架](#idx-e130)的原木碎片。\"},{\"id\":\"e497\",\"title\":\"圣约翰都主教区\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e491)圣领西南部[都主教区](#idx-e157)，以四[使徒](#idx-e129)之首[圣约翰](#idx-e126)命名，辖存有圣约翰[圣骸](#idx-e123)的[潘克拉托](#idx-e493)等地。\"},{\"id\":\"e498\",\"title\":\"索菲亚银矿\",\"aliases\":[],\"body\":\"[圣城索菲亚](#idx-e495)城北的银矿，是大陆已知规模最大的单一银矿产地，其产出构成[忒奥西斯](#idx-e491)高含银量货币体系的物质基础，[伊琳娜圣银币](#idx-e346)即以此为原料铸造。\"},{\"id\":\"e500\",\"title\":\"西比尔平原\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e491)圣领所在的温带半干旱草原，地势平坦、天然水源匮乏，[索菲亚大运河](#idx-e432)贯通前农业条件相当有限；北延至[北门湾](#idx-e418)，是大陆南北贸易的关键咽喉。其南部于[二战](#idx-e274)后尽归[索拉瑞斯](#idx-e434)，后为索菲亚大运河纵切为二；运河以东的土地依[三战](#idx-e275)《[卡斯特鲁姆和约](#idx-e280)》归[阿布丹提亚](#idx-e460)，交接至今悬置，是阿索两国博弈的核心争议。\"},{\"id\":\"e501\",\"title\":\"运河仪所\",\"aliases\":[],\"body\":\"坐落于[忒奥西斯](#idx-e491)圣领领土最北端、[索菲亚大运河](#idx-e432)与[北门湾](#idx-e418)交汇入口处的机构，是[牧首厅](#idx-e170)对大运河实施管理的最前沿。承担通行审核与海水除盐双重职能，常驻[神启魔法](#idx-e5)师持续以水[元素](#idx-e54)[魔法](#idx-e3)析出注入运河的海水盐分。其除盐作业常年施法却从未引发可观测的元素[疏化](#idx-e39)，已成为[魔元素动力学](#idx-e31)的专项研究课题。\"},{\"id\":\"e502\",\"title\":\"艾瑟瑞姆王国\",\"aliases\":[\"艾瑟瑞姆\"],\"body\":\"位于大陆西南部的封建君主制国家，首都[阿斯托利亚](#idx-e503)，领土环抱[坠星湖](#idx-e510)。源出西诺拉尼亚黑暗时期南下避难的[星术](#idx-e8)学者聚落，十一世纪末[塔利瑞安](#idx-e223)联合十二城邦创建[大星术研究院](#idx-e231)，十三世纪前叶塔利兰娜受推举加冕为初代女王。国土约四百二十万平方[陆里](#idx-e392)，由[王冠领地](#idx-e253)、四大伯爵封邑与[特别仪式区](#idx-e249)构成，人口约一千八百万。以星术立国，[王家研究院](#idx-e254)[天星首席](#idx-e252)永由君主兼任，传统意义的[施法者](#idx-e38)占人口逾半。\"},{\"id\":\"e503\",\"title\":\"阿斯托利亚\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e502)首都，位于[坠星湖](#idx-e510)南端[瑟蒂尔河](#idx-e507)出湖处，由[大陆历](#idx-e351)894年南下避难的[星术](#idx-e8)学者聚落发展而成，[王家研究院](#idx-e254)即设于此。城名源出[星空学派](#idx-e7)早期所用的 Astralis（\\\"属星的\\\"），后世音变作 Astoria，旧拼法今仅见于研究院的仪式文书。\"},{\"id\":\"e507\",\"title\":\"瑟蒂尔河\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e502)境内河流。由[坠星湖](#idx-e510)南端出发，向南流经艾瑟瑞姆注入[大星洋](#idx-e420)，首都[阿斯托利亚](#idx-e503)位于其北端出湖处。\"},{\"id\":\"e509\",\"title\":\"韦里泰尔\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e502)[特别仪式区](#idx-e249)内的最大城市，[星轨蚀刻](#idx-e79)总所所在地，统筹协调全区的[星术设备](#idx-e88)生产。\"},{\"id\":\"e510\",\"title\":\"坠星湖\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e502)的地理中心，首都[阿斯托利亚](#idx-e503)位于其南端出湖口。[索尔河](#idx-e453)自[索拉瑞斯](#idx-e434)方向注入湖北端，[瑟蒂尔河](#idx-e507)由南端流出南向[大星洋](#idx-e420)；湖运依托[星术](#idx-e8)船只，是沿岸城市群最重要的内部贸易路线。\"},{\"id\":\"e511\",\"title\":\"卡帕尼诸公联合\",\"aliases\":[\"卡帕尼\",\"卡帕尼联邦\"],\"body\":\"又称卡帕尼联邦，位于大陆南部群岛的公国联邦制国家，由四成员公国与[北部特别贸易区](#idx-e514)组成，四公国各有首府，联邦首都为[阿卡帕尼](#idx-e512)公国的[伊索拉韦尔德](#idx-e526)。1356年[第二次阿索战争](#idx-e274)后，四公爵于[米德可尔](#idx-e522)会晤宣布脱离[阿布丹提亚](#idx-e460)独立。国土约二百五十万平方[陆里](#idx-e392)，散布于七十八座岛屿，人口约九百八十万。联邦以商贸与金融立国，外交奉行离岸平衡，热带群岛旅游业亦非常发达。\"},{\"id\":\"e512\",\"title\":\"阿卡帕尼\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e511)四公国之一，由同名公爵世袭领有，核心领地为[阿卡帕尼岛](#idx-e513)，首府[伊索拉韦尔德](#idx-e526)亦为联邦首都。\"},{\"id\":\"e513\",\"title\":\"阿卡帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e511)群岛南部主岛区的核心岛屿之一，与[梅尔帕尼岛](#idx-e520)合计聚居全联邦逾半人口。\"},{\"id\":\"e514\",\"title\":\"北部特别贸易区\",\"aliases\":[\"特贸区\",\"北部特贸区\"],\"body\":\"[卡帕尼联邦](#idx-e511)于1382年于群岛北部岛链设立的特别经济区，由五十八座岛屿及[泽卡](#idx-e527)、[法纳莱](#idx-e516)等[自由港](#idx-e349)城组成，适用独立的[特区商法典](#idx-e250)与优惠贸易税率，设[管理局](#idx-e236)与[仲裁所](#idx-e264)自治，是大陆各国商人自由开展贸易的核心地带，也是联邦金融机构最密集之处。\"},{\"id\":\"e516\",\"title\":\"法纳莱\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e511)[北部特别贸易区](#idx-e514)的[自由港](#idx-e349)城之一，位于[翡翠海峡](#idx-e421)南缘的北部岛链。\"},{\"id\":\"e520\",\"title\":\"梅尔帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e511)群岛南部主岛区的核心岛屿之一，与[阿卡帕尼岛](#idx-e513)合计聚居全联邦逾半人口。\"},{\"id\":\"e522\",\"title\":\"米德可尔\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e511)境内地名。1356年[第二次阿索战争](#idx-e274)后，卡帕尼四公爵于此会晤宣布建立诸公联合，是联邦独立的历史象征地点。\"},{\"id\":\"e526\",\"title\":\"伊索拉韦尔德\",\"aliases\":[\"伊索拉\"],\"body\":\"[卡帕尼诸公联合](#idx-e511)首都，通称伊索拉，同时是[阿卡帕尼](#idx-e512)公国首府，四公国的政治核心所在地。当地作坊以镀银工艺见长，[索利亚商会](#idx-e343)创办于此。\"},{\"id\":\"e527\",\"title\":\"泽卡\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e511)[北部特别贸易区](#idx-e514)的[自由港](#idx-e349)城之一，位于[翡翠海峡](#idx-e421)南缘的北部岛链。\"},{\"id\":\"e528\",\"title\":\"尼希尔伊玛目酋邦\",\"aliases\":[\"尼希尔\",\"尼希尔酋邦\"],\"body\":\"通称尼希尔酋邦，位于大陆西北角沙漠绿洲与两河流域的神权部落联邦国家，首都[阿尔努尔](#idx-e529)。五世纪[萨阿尔血王朝](#idx-e550)覆灭后，诸部酋长于阿尔努尔会盟，推举诸神大祭司为[伊玛目教长](#idx-e204)，成立酋邦。尼希尔国土五百八十万平方[陆里](#idx-e392)，由[诸神圣土](#idx-e207)与八部落领地构成，人口约一千八百万。酋邦是当今大陆唯一合法保有奴隶制的国家，社会等级高度固化。\"},{\"id\":\"e529\",\"title\":\"阿尔努尔\",\"aliases\":[],\"body\":\"[尼希尔伊玛目酋邦](#idx-e528)首都兼伊玛目城，位于两河流域核心地带，属[教长](#idx-e204)直辖的[诸神圣土](#idx-e207)。422年诸部酋长于此会盟建立部落联邦体制、推举首任伊玛目教长；城中六神各有神庙，另有教长主持全酋邦最隆重仪典的[大神庙](#idx-e190)，[酋长会议](#idx-e244)亦每年在此召开。\"},{\"id\":\"e530\",\"title\":\"哈亚特河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e528)两河之东河，发源于[冠脊山脉](#idx-e424)西脉北麓的积雪融水，自南向北流经酋邦西部，于[塔巴特](#idx-e534)与[纳赫尔河](#idx-e531)交汇后入[凛冰洋](#idx-e428)。其洪汛带来上游冲积土并补充土壤水分，随洪水消退而展开的播种是全酋邦农业的年度起点。\"},{\"id\":\"e531\",\"title\":\"纳赫尔河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e528)两河之西河，发源于[索拉瑞斯](#idx-e434)境内的[镜心湖](#idx-e441)，自南向北流经酋邦西部，于[塔巴特](#idx-e534)与[哈亚特河](#idx-e530)交汇。因源头在索拉瑞斯境内，[诸神信仰](#idx-e196)第一季的西祭典历来只能在靠近南边境的城市勉强举行，这也是尼索边境关系长期恶劣的原因之一。\"},{\"id\":\"e532\",\"title\":\"沙阿万大魔矿\",\"aliases\":[\"大魔矿\"],\"body\":\"位于[尼希尔](#idx-e528)东部沙阿万沙漠地下，全大陆最大的单一[魔矿](#idx-e74)产地，年产量占大陆总量逾半，[高品级魔矿](#idx-e68)更占大陆产出八成以上，几乎构成事实垄断。矿井多由[神遴者](#idx-e417)以[秘术](#idx-e4)开凿，此后的采掘、支护、排水与转运则由奴隶以常规工具承担。各国对尼希尔的结构性经济依赖即根源于此。\"},{\"id\":\"e533\",\"title\":\"沙阿万大沙漠\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e528)东部广袤沙漠，是大陆最严酷的干旱地带，地表资源匮乏，昼夜温差可超三十[星度](#idx-e400)，仅有[冠脊山脉](#idx-e424)北脉北麓发源的两条小型沙漠河流维系着若干绿洲；地下则蕴藏[沙阿万大魔矿](#idx-e532)。\"},{\"id\":\"e534\",\"title\":\"塔巴特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e528)西部[纳赫尔河](#idx-e531)与[哈亚特河](#idx-e530)的交汇处，是两河流域的重要节点，两河在此汇合后继续北行入[凛冰洋](#idx-e428)。\"},{\"id\":\"e535\",\"title\":\"希尔文诺\",\"aliases\":[],\"body\":\"大陆精灵族裔及其文明与家园的统称，位于[冠脊山脉](#idx-e424)间的封闭盆地，由二十余个[氏族](#idx-e216)部落构成，最大聚落为[大圣树](#idx-e219)所在的[希尔文尼亚](#idx-e538)。其实际控制面积以大森林为界约一百二十万平方[陆里](#idx-e392)，人口一般认为不超过一百万。制度植根于大圣树信仰，每三十年召开[万叶庭](#idx-e218)全体表决，[叶络枢机院](#idx-e221)理日常行政与对外事务。1132年与人类首次接触，此后长期保持中立与封闭，被各国视为大陆事务的天然缓冲区与仲裁者。\"},{\"id\":\"e536\",\"title\":\"葛林沃尔克\",\"aliases\":[],\"body\":\"大陆东北角地区，由南北两支山脉夹峙高山密林构成，北部为雪原冰川。是大陆地理信息最匮乏的区域，据传其可能存在智慧种族与独立的[魔法](#idx-e3)体系，但学界均无可靠资料。\"},{\"id\":\"e538\",\"title\":\"希尔文尼亚\",\"aliases\":[],\"body\":\"[希尔文诺大圣树](#idx-e219)所在之地，精灵族规模最大的聚居点，[万叶庭](#idx-e218)与[叶络枢机院](#idx-e221)所在。据推测是大陆最优越的[元素丰地](#idx-e55)之一。\"},{\"id\":\"e539\",\"title\":\"希尔文诺大森林\",\"aliases\":[],\"body\":\"精灵族世代定居之地，坐落于[冠脊山脉](#idx-e424)北脉与东南脉合围而成的山间盆地，是大陆封闭程度最高的区域之一，实际控制面积约一百二十万平方[陆里](#idx-e392)。山脉双重合围造就封闭湿润的气候，孕育大量大陆其他地区所没有的特有动植物；盆地开口朝向东南，东南脉中部的天然隘口是[林缘议厅](#idx-e281)所在地。\"},{\"id\":\"e543\",\"title\":\"冠阳\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之首，[星空学派](#idx-e7)完整名\\\"主序·冠阳\\\"，即太阳。[源星](#idx-e59)属权威、创造与审判；[正教](#idx-e150)神学中象征[唯一神](#idx-e138)，对应[仪式历](#idx-e366)[圣神日](#idx-e363)与[通用历](#idx-e373)日曜日。\"},{\"id\":\"e544\",\"title\":\"烬铸星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"熔炉·烬铸星\\\"。[源星](#idx-e59)属转化、破坏与锻造，常被视为天球之上的锻造炉象征；[正教](#idx-e150)神学上象征[圣约瑟](#idx-e127)，对应[烬曜日](#idx-e356)。\"},{\"id\":\"e549\",\"title\":\"诺万尼斯王国\",\"aliases\":[],\"body\":\"西诺拉尼亚[七王约](#idx-e285)时期存在的王国政权。八世纪该王国与[龙骑士](#idx-e300)群体结盟发动叛乱、试图驱逐[正教会](#idx-e185)势力并统一七王邦联。758年[索瑞斯战役](#idx-e287)中交战双方滥用[神启魔法](#idx-e5)引发[元素枯竭](#idx-e56)，王国所在[诺万尼斯平原](#idx-e433)永久化为死地，即今终末碑座地区。\"},{\"id\":\"e550\",\"title\":\"萨阿尔血王朝\",\"aliases\":[],\"body\":\"古代[尼希尔](#idx-e528)地区存在的政权，由掌握[秘术](#idx-e4)的萨阿尔部落于[大陆历](#idx-e351)元前二世纪建立。该部自[沙阿万大沙漠](#idx-e533)西侵，用八年统一西尼希尔诸部，王朝延续至五世纪。其以自身信仰强行替代西尼希尔原有神话体系，奠定了尼希尔日后的[诸神信仰](#idx-e196)与政教结构。史籍普遍估算，王朝治下因屠杀或献祭而死者逾四百万。该王朝在五世纪大起义中覆灭，但其制度主体却被422年的[阿尔努尔](#idx-e529)会盟所承袭。\"},{\"id\":\"e552\",\"title\":\"索拉尔王国\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e434)的前身，于西诺拉尼亚[黑暗时代](#idx-e278)中崛起的王国。1159年，索拉尔国王[阿利昂](#idx-e240)统一西大陆诸国、受牧首册封为首位[龙裔凯撒](#idx-e239)，索拉瑞斯帝国由此建立。现代通用度量衡的长度单位[步米](#idx-e383)与[陆里](#idx-e392)即源自索拉尔王国的[军团](#idx-e299)行军传统。\"},{\"id\":\"e555\",\"title\":\"汐月\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"银杯·汐月\\\"，即月亮。[源星](#idx-e59)属容纳、精神与教导；[正教](#idx-e150)神学上象征[圣约翰](#idx-e126)，对应[月曜日](#idx-e381)。[艾瑟瑞姆](#idx-e502)[星历](#idx-e376)即以其盈亏循环为月。\"},{\"id\":\"e559\",\"title\":\"织虹星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"脉生·织虹星\\\"。[源星](#idx-e59)属修复、治疗与幻象；[正教](#idx-e150)神学上象征[圣保罗](#idx-e122)，对应[虹曜日](#idx-e353)。\"},{\"id\":\"e560\",\"title\":\"仲裁星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"律令·仲裁星\\\"，是星空中最亮且运动最明显的三颗星体之一。[源星](#idx-e59)属秩序、守护与契约；[正教](#idx-e150)神学上象征[圣伊琳娜](#idx-e125)，对应[裁曜日](#idx-e350)。\"}],\"titleImagePath\":\"/compendium/诸国列志/忒奥西斯.webp\",\"titleImageInsertLine\":3}}]}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/Nurania/next/static/chunks/ff1a16fafef87110.js\",\"/Nurania/next/static/chunks/0bd6498bda341889.js\"],\"IconMark\"]\nc:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"忒奥西斯圣治领 | The θέωσις(Theosis) Dominion\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"“信仰无根便是童话。” 概述 忒奥西斯圣治领（The Theosis Dominion），通称圣治领或圣领(The Dominion)，是位于大陆中央北部地区的正教会神权共和国，首都圣城索菲亚（Hagia Sophia）。圣领北临北门湾，西…\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"忒奥西斯圣治领 | The θέωσις(Theosis) Dominion\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"“信仰无根便是童话。” 概述 忒奥西斯圣治领（The Theosis Dominion），通称圣治领或圣领(The Dominion)，是位于大陆中央北部地区的正教会神权共和国，首都圣城索菲亚（Hagia Sophia）。圣领北临北门湾，西…\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:image\",\"content\":\"https://finzhang.space/Nurania/compendium/%E8%AF%B8%E5%9B%BD%E5%88%97%E5%BF%97/%E5%BF%92%E5%A5%A5%E8%A5%BF%E6%96%AF.webp\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:type\",\"content\":\"article\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:title\",\"content\":\"忒奥西斯圣治领 | The θέωσις(Theosis) Dominion\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:description\",\"content\":\"“信仰无根便是童话。” 概述 忒奥西斯圣治领（The Theosis Dominion），通称圣治领或圣领(The Dominion)，是位于大陆中央北部地区的正教会神权共和国，首都圣城索菲亚（Hagia Sophia）。圣领北临北门湾，西…\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:image\",\"content\":\"https://finzhang.space/Nurania/compendium/%E8%AF%B8%E5
