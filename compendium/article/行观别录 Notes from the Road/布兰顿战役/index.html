}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[53360,[\"/Nurania/next/static/chunks/409fa6e7eed2c119.js\",\"/Nurania/next/static/chunks/b77339cc29226d86.js\",\"/Nurania/next/static/chunks/747ad6c054a5245b.js\",\"/Nurania/next/static/chunks/e9371c2148cd7f21.js\"],\"default\"]\n13:T7ab6,"])</script><script>self.__next_f.push([1,"\n[布兰顿战役](#idx-e270)（The Battle of Branton）是[第三次阿索战争](#idx-e275)前期的第一场重要会战，发生于[大陆历](#idx-e351) 1479 年[炎阳](#idx-e379)季46日至[金素](#idx-e355)季5日，历时约十天，战场位于[西比尔平原](#idx-e508)东南缘的[布兰顿河](#idx-e479)中下游两岸。[阿布丹提亚帝国](#idx-e468)投入前线战斗人员约三十九万，由年仅十七岁的皇帝卡立曼七世·费内尔御驾亲征；[索拉瑞斯帝国](#idx-e441)投入三个[军团](#idx-e299)与[近卫龙骑兵团](#idx-e296)共约五十四万五千人，[凯撒](#idx-e239)雷尔金二世未亲临前线，部队由持凯撒[御令](#idx-e260)的参谋长安托娜·维斯统一指挥。\n\n战役以阿布丹提亚获胜告终。索拉瑞斯三个军团被迫西撤至[缪涅斯特](#idx-e457)一线重整，近卫龙骑兵团第一至第三旅在此役中损失近半，兵团长卢卡努斯·瓦伦重伤，三战后续战斗指挥由副团长代领。布兰顿战役是阿布丹提亚[对龙工程兵团](#idx-e292)的首次实战投入，也是[巨龙眷属](#idx-e297)自被编入索拉瑞斯军事体系以来第一次被成建制地摧毁。\n\n本篇所据史料以阿布丹提亚方面的战报、亲历者回忆与数种流传的战记为主，索拉瑞斯方面的军事记录至今未曾公开，凡涉及索军内部决策之处均系依已知结果反推。\n\n### 一、战役背景\n\n[第二次阿索战争](#idx-e274)结束后，两国边境在西比尔平原南部以布兰顿河下游为界，这条边界由以本河命名的《[布兰顿和约](#idx-e269)》划定。布兰顿河中游一带的边界并不循河而行，河东岸的[布兰顿](#idx-e478)城在二战和约中被割让给索拉瑞斯，一百多年来是帝国边境最靠东的据点。\n\n1479 年[清和](#idx-e362)季35日，阿布丹提亚对索拉瑞斯宣战。开战之初阿方即以突袭夺取布兰顿城，随后在布兰顿河东岸集结[皇室近卫军](#idx-e295)、[星术兵团](#idx-e309)与五位大公爵的[地方军](#idx-e291)，准备西渡布兰顿河、向缪涅斯特一线推进。索拉瑞斯方面动员东部三个军团与近卫龙骑兵团编为第一集团军，渡[索菲亚大运河](#idx-e438)东出，经缪涅斯特抵达布兰顿河西岸。阿方侦知索军动向后判断兵力对比不利于野战进攻，遂放弃西渡计划，依托布兰顿河在东岸构筑野战工事转取守势，意图以防守反击消耗索军。\n\n#### 战场地理\n\n\u003c!-- 插图 compendium/行观别录/布兰顿战役/geography.webp 宽度=400 右 可放大 --\u003e\n\n布兰顿河自北向南流经战场，中段接纳一条自西而来的支流后折向东南，于[法拉利亚](#idx-e481)一带入海。下游近海一段河面开阔，不具备强渡条件，双方可能交锋的正面因此收缩在布兰顿城至汇口南方八十[陆里](#idx-e392)之间的河段。\n\n支流的存在将布兰顿西岸切为南北两个隔间，索军中北两翼之间的横向调动必须经汇口一带通过。位于两河交汇处的[奥斯提乌姆](#idx-e472)镇因此成为整场战役的枢纽，索军的集团军指挥部在中辖军团到达后设置于此。西岸另一处要点是支流上游的[卢佩尔库姆](#idx-e486)，索军自缪涅斯特东来的补给与增援皆经此地。东岸有[米尔罗](#idx-e488)与法拉利亚两座城镇，前者为路网枢纽，后者位于布兰顿入[翡翠海峡](#idx-e424)河口，是阿方海上补给来源方向。战场其余部分为开阔平原，仅有四片林地可供遮蔽，其中东北与东中两片正对可渡河段的后方。\n\n### 二、战前部署\n\n#### 索拉瑞斯帝国\n\n| 编成                                         | 兵力                                | 指挥官          |\n| ------------------------------------------ | --------------------------------- | ------------ |\n| 集团军指挥部（Army Group Headquarters，HQ）         | —                                 | 御前参谋长 安托娜·维斯 |\n| 中辖军团（The Central Legion，CEN）               | 二十一万（重步二团、轻步四团、骑兵一团），法术部队五个大队一万五千 | 军团长 鲁提尔·阿奎洛  |\n| 东奥利提斯军团（The East Olitis Legion，EOL）        | 十五万（重步一团、轻步三团、骑兵一团），法术部队三个大队一万    | 军团长 特拉文·雷辛   |\n| 西奥利提斯军团（The West Olitis Legion，WOL）        | 十二万（重步一团、轻步三团），法术部队三个大队一万         | 军团长 塞维林·韦里克  |\n| 近卫龙骑兵团（The Guard Dragon Cavalry Corps，DCC） | 三万（三个旅，每旅四个大队）                    | 兵团长 卢卡努斯·瓦伦  |\n\n按索拉瑞斯标准编制，一团三万人，一大队三千人，一小队五百人；近卫龙骑兵团另有编制，一大队两千五百骑。[神启魔法](#idx-e5)部队（Orison Battalions，Ori）分配至各军团独立指挥。集团军指挥部由三位军团长与参谋长维斯组成，参谋长受凯撒御令，军团长争执不下时拥有最后决定权。近卫龙骑兵团原则上受御令约束，听从参谋长调度，但依帝国律法拥有较高自决权，可视战机自行行动。\n\n#### 阿布丹提亚帝国\n\n| 编成                                      | 兵力                                    | 指挥官               |\n| --------------------------------------- | ------------------------------------- | ----------------- |\n| 联军总指挥（Supreme Commander）                | —                                     | 皇帝 卡立曼七世          |\n| 皇室近卫军（The Imperial Guard，IG）            | 七万（重步三团、骑兵一团）                         | 皇帝直辖              |\n| 星术兵团（The Astral Corps，AST）              | 三万一千（对龙工程兵团三团一万五千、[巨像部队](#idx-e298)三团一万、[野战星术师](#idx-e311)二团六千） | 皇帝直辖              |\n| [阿格伯瑞](#idx-e470)公爵军（The Augaberry Ducal Army，AUG）   | 八万，下辖三部伯爵军，两部子爵军                      | 阿格伯瑞公爵 韦尔滕·迪韦勒    |\n| [费洛菲尔德](#idx-e482)公爵军（The Ferrofield Ducal Army，FER） | 四万，下辖两部伯爵军                            | 费洛菲尔德公爵 奥德里克·切里萨诺 |\n| [波马里亚](#idx-e475)公爵军（The Pomaria Ducal Army，POM）     | 七万，下辖四部伯爵军，一部子爵军                      | 波马里亚公爵 卡韦尔·安布里西   |\n| [库珀贝尔](#idx-e485)公爵军（The Copperbell Ducal Army，COP）  | 四万，下辖三部伯爵军                            | 库珀贝尔公爵 威尔姆·托尔内利   |\n| [斯拉格丹](#idx-e492)公爵军（The Slagdan Ducal Army，SLG）     | 六万，下辖两部伯爵军，四部子爵军                      | 斯拉格丹公爵 哈内克·巴利     |\n\n阿格伯瑞与费洛菲尔德同属[阿格伯瑞帝政省](#idx-e471)，波马里亚与库珀贝尔同属[波马里亚帝政省](#idx-e476)，各自倾向于联合行动。战时皇帝以全军最高统帅身份居中指挥，各公爵在其统率框架内各自指挥本部；皇室近卫军和星术兵团由皇帝直辖，不经贵族体系。\n\n#### 双方的作战构想\n\n\u003c!-- 插图 compendium/行观别录/布兰顿战役/pre-battle.webp 宽度=400 右 可放大 --\u003e\n\n阿布丹提亚全军在战役第一日即已就位：北翼阿格伯瑞与费洛菲尔德固守布兰顿城及上游东岸，中翼皇室近卫军与斯拉格丹据奥斯提乌姆对岸，南翼波马里亚与库珀贝尔据下游东岸。对龙工程兵团置于中翼后方，皇帝对其使用的要求只有一条：在最合适的时机之前不得暴露。\n\n索拉瑞斯三个军团则分批抵达。东奥利提斯军团与近卫龙骑兵团第一旅于炎阳季46日抵下游西岸，中辖军团与龙骑兵团第二第三旅48日晚抵奥斯提乌姆一带，西奥利提斯军团北上绕开阿方中翼防线，于金素季1日经中游渡河、出现于布兰顿城以南的东岸。索方的构想是以中辖在汇口正面压迫、牵制阿军中枢，以西奥利提斯在东岸展开平原进攻、迫使阿军沿东岸北调，待其横向调动展开时投入龙骑兵团。\n\n笔者注：梯次抵达实际上意味着索军在最初五日里并不享有它名义上的兵力优势。46日至47日，索方在场者仅东奥利提斯一部十五万；直至第五日为止，索军在场兵力始终少于阿军。索拉瑞斯方面显然认为采取守势的对手不会在河的另一侧主动出击——这个判断在战役第一天就被推翻了，只不过推翻它的并不是卡立曼七世。\n\n### 三、战役经过\n\n#### 第一阶段：炎阳季46日至炎阳季48日\n\n\u003c!-- 插图 compendium/行观别录/布兰顿战役/phase-I-1.webp 宽度=400 右 可放大 --\u003e\n\n46日清晨，阿布丹提亚南翼的波马里亚与库珀贝尔两位公爵未经报备，违反皇帝东岸固守的命令，于奥斯提乌姆下游七十陆里处经七处浮桥渡河，自行向立足未稳的东奥利提斯军团发起进攻。波马里亚军七万担任正面，库珀贝尔军四万绕北侧迂回。两位公爵的判断是时间在己方一侧：东奥利提斯自本土长途行军而来，状态不佳，短期内不会有援军，龙骑兵团在场者至多一个旅。渡河部队未携任何对空手段。\n\n东奥利提斯军团长雷辛以重步兵团顶住正面，三个轻步团梯次向西且战且退，同时以骑兵团扑击库珀贝尔的侧翼纵队，三个法术大队全部投入正面支援重步兵团。正面阵地当日失守，重步兵团伤亡惨重，但其受轻步兵部队接应向西退却，成功把阿军越拉越远；骑兵团阻断了库珀贝尔的夹击，确保了步兵部队的撤退路线。\n\n46日黄昏。阿军全部渡河完毕之后，龙骑兵团第一旅一万骑自卢佩尔库姆出击，目标不是敌军而是渡场，七处浮桥被毁去五处，切断两公爵军撤退路线。同一日下午，卡立曼七世获悉南翼擅动，急令斯拉格丹公爵军携巨像部队第一第二团、野战星术师第一团南下接应，并遣信使渡河传达后撤命令。\n\n\u003c!-- 插图 compendium/行观别录/布兰顿战役/phase-I-2.webp 宽度=400 右 可放大 --\u003e\n\n47日清晨信使抵达，两位公爵开始东撤。波马里亚军当日退抵渡口，发现浮桥已毁，被迫与追击的东奥利提斯军团在河岸交战；库珀贝尔军则被索军骑兵缠住，未能按时抵达西岸。斯拉格丹部于当日中午抵达东岸，由野战星术师团重建渡桥，巨像部队击退索方龙骑兵团第一旅后续对渡场发起的二次进攻。同日下午，卡立曼七世传信北翼要求费洛菲尔德公爵军南下支援仅余七万余人的中翼，并要求工程兵团撤入北方树林避开空中侦查。龙骑兵团第一旅放弃南面目标，北上袭击阿方传令线，但阿方传令兵均配属[星术](#idx-e8)师以[织虹星术](#idx-e60)掩护，自空中难以察觉，此次出击无功而返。\n\n48日下午，波马里亚军大部成功渡回东岸。库珀贝尔军在东奥利提斯军团骑兵与中辖军团先遣骑兵合计六万骑的合围下崩溃，公爵威尔姆·托尔内利阵前战死，所部伤亡惨重、溃散抵岸。其残部后由斯拉格丹公爵军收拢并暂拨波马里亚公爵指挥。阿布丹提亚在开战头三日损失了一支完整的公爵军和一位公爵，代价全部来自一次未经许可的进攻。\n\n#### 第二阶段：炎阳季49日至金素季1日\n\n\u003c!-- 插图 compendium/行观别录/布兰顿战役/phase-II-1.webp 宽度=400 右 可放大 --\u003e\n\n48日傍晚，索拉瑞斯中辖军团抵达奥斯提乌姆，龙骑兵团第二、第三旅同时到位。索方指挥部内部随即出现分歧：参谋长维斯主张不在汇口强渡，改由上游绕行、集中兵力于北翼；军团长阿奎洛认为拖延三日足以让阿方补齐北翼，主张即刻利用中翼空虚强渡。维斯动用了御令权，定中辖军团在奥斯提乌姆强渡以夺取桥头堡，钉住阿军中枢，同时令西奥利提斯军团在上游渡河后立刻向东机动切断阿方两翼联系。\n\n49日拂晓，中辖军团自奥斯提乌姆强渡。此时斯拉格丹部尚未北返、费洛菲尔德部刚刚抵达，阿方中翼可用于滩头防御的星术部队仅有[巨像](#idx-e84)第三团与野战星术师第二团，无法抵抗索方满效率的法术火力，被迫让出登陆区。中辖军团两个重步团与两个轻步团成功上陆，随后遭皇室近卫军依托工事全面阻击，索军虽占据上风但阵地推进缓慢。瓦伦向维斯请战要求投入龙骑兵团支援东岸，被维斯拒绝。至49日傍晚斯拉格丹军携巨像第二团与野战星术师第一团抵达战场，阿奎洛放弃确保登陆场，主动撤出部队。此战索方虽为登陆一方，战损仍占优势。\n\n此后索方的判断发生两处变化。其一是[元素](#idx-e54)[疏化](#idx-e39)的代价开始显现：下游段与奥斯提乌姆正面先后经历高强度施法，索军祷言部队在这两处的效率已明显下降，而阿方所倚仗的星术不受疏化影响。其二是阿方对龙工程兵团在中翼几乎被撕开时始终未曾出现，索方由此推断它并非不存在，而是在等待龙骑兵团。\n\n\u003c!-- 插图 compendium/行观别录/布兰顿战役/phase-II-2.webp 宽度=400 右 可放大 --\u003e\n\n维斯遂将主攻方向转往北翼。中辖军团分出轻步团第二第三团与骑兵团北上，余部留守汇口南段维持压力。金素季1日，西奥利提斯军团十二万于布兰顿城以南渡河到达东岸，此处区域此前未经动用神启魔法，所配法术部队得以满效率发起进攻；龙骑兵团三个旅三万骑亦于同日一次性投入。阿格伯瑞公爵军八万人虽有工事掩护仍伤亡惨重，被迫退入布兰顿城固守，与中翼的联系被切断。公爵本人在此战中身负重伤，失去一条腿与一条小臂。\n\n阿方战史记载，战役中最关键的方案由阿格伯瑞公爵本人提出。他在重伤当夜（金素季1日）以急信向卡立曼七世请战，自愿以残部死守布兰顿城，将索军主力牵制在北翼，为中翼创造决战条件。其急信中有一句后来被阿方文献反复引用的话：“让他们的刀和枪冲着我来吧，孩子。当他们抬起手的时候，你要像一柄利剑一样刺入他们的心脏。”，卡立曼七世同意了这一方案。\n\n#### 第三阶段：金素季2日至金素季3日\n\n\u003c!-- 插图 compendium/行观别录/布兰顿战役/phase-III-1.webp 宽度=400 右 可放大 --\u003e\n\n金素季2日阿布丹提亚方依阿格伯瑞公爵提议行动：北翼死守，南翼佯攻牵制东奥利提斯军团，中翼则集结全部二十万兵力强渡布兰顿河，卡立曼七世亲率皇室近卫军在前，直指奥斯提乌姆的索军指挥部；对龙工程兵团同时推进至河边待机，部署在河岸后方两处人工土丘上，射界覆盖奥斯提乌姆渡场上空八十度扇面。维斯认出了这一部署的意图：能在一天内立刻驰援中翼的只有龙骑兵团，对龙工程兵团正在等的就是这一刻，因此她选择不投入龙骑兵，命中辖所剩重步兵两团，轻步兵第一第四团迟滞后撤、让出汇口，指挥部西移，并令南北两翼放弃当前目标立即向卡立曼的侧后合拢，布兰顿城下仅留西奥利提斯轻步兵第二团。龙骑兵团则自西绕行与中辖军团汇合，不可与阿军接战。\n\n兵团长瓦伦拒绝了这一判断。2日拂晓，近卫龙骑兵团三个旅三万骑自北翼南下，全部投入奥斯提乌姆渡场上空，目标是渡河中的皇室近卫军与皇帝本队。\n\n笔者注：龙骑兵团原则上受御令指挥，但其指挥官可自行视战机行动，以完全发挥飞行部队的机动优势，因此瓦伦拒绝参谋部命令并不违反帝国律令，但问题在于此前七日间，维斯持续征调该团的精锐骑手承担传令任务——索军的情报与调度效率因此远胜阿军，代价是瓦伦对参谋部的敌意在战役期间不断累积。龙骑兵团在2日拂晓自行行动，其中多少来自于瓦伦的军事判断，又多少来自于其与维斯的矛盾，笔者不得而知。索拉瑞斯方面从未就2日瓦伦的决定给出正式说明，但战后二十年间，帝国军中对这一日的讨论从未真正停过。\n\n阿方对龙工程兵团即在此刻展开。由于索方没有任何地面部队随之压制阵地，龙骑兵在预设射界中遭到[对龙穿甲弩炮](#idx-e65)与[移动星术谐振台](#idx-e96)的全面打击。龙骑兵团三旅三万人在这一日中损失一万五千人，队伍溃散；兵团长卢卡努斯·瓦伦身负重伤，在部下掩护下领残部脱离战场，缺席此后三战全部战事。皇帝卡立曼七世本人在交战中受轻伤。\n\n阿方中翼二十万人在布兰顿河上和东岸目睹了龙骑兵团被击垮的过程。战斗与渡河结束后，2日下午，卡立曼七世在布兰顿河西岸向全军发表阵前演讲（全文见附录一）后领各部向西北追击索军。索拉瑞斯中辖余部接情报后得知唯一可能的援兵在半日之内被击垮，士气崩溃，原定的迟滞后撤变为溃散，损失惨重，索军指挥部因撤离及时得以走脱。\n\n金素季3日，索方中辖军团与龙骑兵团余部在卢佩尔库姆东四十陆里处依托指挥部重整。维斯判断战役已无取胜可能，遂急信北翼与南翼索军立刻向中翼靠拢并转向西撤退。\n\n#### 第四阶段：金素季4日至金素季5日\n\n\u003c!-- 插图 compendium/行观别录/布兰顿战役/phase-IV-1.webp 宽度=400 右 可放大 --\u003e\n\n金素季4日上午，卡立曼七世停止追击中辖军团，转北渡过支流，率军从侧翼攻击自布兰顿城往西南卢佩尔库姆方向靠拢的北翼索军。负责殿后的西奥利提斯军团轻步兵第一第三团在撤退中被歼。南翼波马里亚公爵得索军全线撤退情报，急欲扩大战果，第二次无视皇帝的命令，将佯攻改为实攻，渡河追击东奥利提斯军团；北翼阿格伯瑞军整编残部出城，追击自城下撤离的西奥利提斯军团轻步兵第二团，阿格伯瑞公爵在担架上亲自随军出击。\n\n索拉瑞斯方全线撤退。东奥利提斯军团回身反击波马里亚军，将其击退，但撤退令已下，军团长雷辛放弃追击，向西北与中辖残部及指挥部会合后撤退，成为了索军三个军团中保存编制最完好的一个。北翼索军折损殿后的两个轻步兵团成功与中翼合流，阿方未继续追击，折返向东北反渡布兰顿河，将阿格伯瑞军缠住的轻步兵第二团包围全歼。西奥利提斯军团的三个轻步团在这两日内全部覆灭。\n\n维斯收拢三军团残部后往西撤往缪涅斯特一线，与帝国后续到达的军团会合重整。阿布丹提亚军顺势西进占领卢佩尔库姆，就近整军。布兰顿战役至此结束。\n\n### 四、战役结果\n\n#### 双方战损\n\n伤亡与被俘人数如下。索拉瑞斯方面各军团法术部队并入其军团计。\n\n| 索拉瑞斯    | 编制     | 伤亡或被俘  |\n| ------- | ------ | ------ |\n| 中辖军团    | 二十二万五千 | 九万     |\n| 东奥利提斯军团 | 十六万    | 三万     |\n| 西奥利提斯军团 | 十三万    | 十万     |\n| 近卫龙骑兵团  | 三万     | 一万五千   |\n| 合计      | 五十四万五千 | 二十三万五千 |\n\n| 阿布丹提亚    | 编制     | 伤亡或被俘 |\n| -------- | ------ | ----- |\n| 皇室近卫军    | 七万     | 二万五千  |\n| 对龙工程兵团   | 一万五千   | 基本无损失 |\n| 巨像部队     | 一万     | 二千    |\n| 野战星术师    | 六千     | 一千    |\n| 阿格伯瑞公爵军  | 八万     | 六万    |\n| 费洛菲尔德公爵军 | 四万     | 一万    |\n| 波马里亚公爵军  | 七万     | 三万    |\n| 库珀贝尔公爵军  | 四万     | 近四万   |\n| 斯拉格丹公爵军  | 六万     | 二万    |\n| 合计       | 三十九万一千 | 十八万八千 |\n\n两支部队在战后被裁撤。索拉瑞斯西奥利提斯军团三个轻步团全灭、全军损失逾七成，余部解散回归[行省](#idx-e237)，未参加第三次阿索战争的后续战斗；阿布丹提亚库珀贝尔公爵军几乎全军覆没，番号撤销，爵位由威尔姆·托尔内利的长子继承。\n\n笔者注：这份报告表里有两点值得一提。其一是胜方的损失比例高于败方——阿布丹提亚损失约占其编制的四成八，索拉瑞斯约占四成三。布兰顿是一场战略胜利而非消耗战胜利，阿布丹提亚得到的是全局战争的主动权以及索拉瑞斯的顶端战力的重创，不是人命上的交换比。其二是这些损失在阿军内部的分布：阿格伯瑞与库珀贝尔两支公爵军承担了全军损失的一大半，而皇帝直辖的皇室近卫军与星术兵团合计十万一千人，损失仅两万八千，是全军比例最低的部分。\n\n#### 对阿布丹提亚的影响\n\n在军事层面，布兰顿之战解决了一个困扰阿布丹提亚一百二十余年的问题。自[第一次阿索战争](#idx-e276)以来，龙骑兵始终是阿布丹提亚军队无法在正面战场解决的兵种，两次战败均与此直接相关。第二次阿索战争之后，帝国依托[丹提亚-瑞姆技术协约](#idx-e273)引进的星术军工技术，逐步建立起专以反制龙骑兵为目的的对龙工程兵团，至此役方才第一次投入实战。结果是决定性的：三万龙骑兵在半日之内损失过半，此后的战争过程中，索拉瑞斯对龙骑兵的使用变得极为谨慎，成为了阿方的重要战术优势之一。\n\n在政治层面，卡立曼七世的收获比战场上的更大。取得决定性战果的是皇室近卫军与星术兵团，这两支部队由皇帝直辖、不经贵族、军费由国库支出；而同一场战役中，两位公爵先后两次抗命，一位战死、所部覆灭，另一位则两次吃下败退。[三柱议会](#idx-e245)中的贵族柱长期以“军费自负、指挥自主”为据维持贵族在军事上的地位，这一根据在布兰顿之后变得难以维持。此后二十余年间皇帝与议会围绕军权的一系列争执，其起点大多可以追溯到这十天。\n\n皇帝在阵前演讲中表彰了阿格伯瑞公爵一人，对四日前阵亡的库珀贝尔公爵未置一词。为国血战，服从命令者出现在演讲里，轻率冒进，公然抗命者即便战死也没有留下名字，这一对照在阿布丹提亚贵族当中被议论了很多年。\n\n#### 对索拉瑞斯的影响\n\n索拉瑞斯在此役中损失的不只是兵力。近卫龙骑兵团是帝国自建国以来维持西诺拉尼亚统治的核心支柱，也是历次[阿索战争](#idx-e268)中决定战役走向的重要力量，其在布兰顿河上空的惨败使帝国在第三次阿索战争中被迫将它惯常的顶端常规战力半雪藏。战争最终以索拉瑞斯议和、签订《[卡斯特鲁姆和约](#idx-e280)》告终，这一结局的军事基础是在布兰顿奠定的。\n\n布兰顿战役也暴露出了帝国指挥体制上的缺陷。龙骑兵团金素季2日的出击未经[御前参谋部](#idx-e261)同意，而其确实被授予了这样的权力——历史这一安排确实有效地发挥了飞行部队的高机动性，但在其被阿方部署了针对性措施的当下，这一自决权反而成了关键时刻飞行与地面部队难以协同作战的软肋。而在同一场战争中，索拉瑞斯的[龙骑士团](#idx-e301)以多数决议全程未予参战，帝国亦从未就此给出正式说明。两件事同时发生，指向的是同一个问题：凯撒名下最强的两支力量，能否真正发挥作用都无法由帝国的军事制度保证。\n\n笔者注：雷尔金二世登基于 1470 年，布兰顿之战发生在 1479 年，其间九年。一位血脉合法性本就受到质疑的凯撒，在其登基后的第一场大战中，一支直属于他本人的部队违背了前线的统一指挥，另一支名义上效忠于他本人的力量则干脆没有出现。此后二十年间帝国对外仍以龙骑士团作为威慑姿态的核心，但各国在评估索拉瑞斯军力时是否仍将其计入，恐怕已是另一回事。\n\n### 附录一：卡立曼七世的阵前演讲\n\n以下为阿布丹提亚方面通行的演讲文本，据称出自1479年金素季2日当日下午一位近卫军书记官的记录。皇帝演讲由随行星术师放大声音传至全军，卡立曼七世时年十七岁，负轻伤，骑于马上。\n\n\u003e \"The river behind you is called the Branton.\n\u003e “你们背后的这条河，叫布兰顿。\n\u003e \n\u003e A hundred and twenty-three years ago we signed a treaty at the Glade Hall. That treaty carries the name of this river. The man who signed it was my forefather. By the time he signed it, we had already lost twice. The first time, we gave up the land to the west. The second time, we gave up the good farmland of southern Sybil, and Kapani out in the sea.\n\u003e 一百二十三年前，我们在[林缘议厅](#idx-e281)签过一份和约，那份和约用的就是这条河的名字，签字的是我的先祖。他签字的时候，我们已经输了两次。第一次，我们交出了西边的土地。第二次，我们交出了西比尔南边的良田，还有海上的[卡帕尼](#idx-e519)。\n\u003e \n\u003e For a hundred and twenty-three years since, we have watched Solarians lord it over land that belongs to us. Some say that is because we were beaten into submission.\n\u003e 那之后一百二十三年，我们看着那些索拉瑞斯人在属于我们的土地上作威作福，有人说，那是因为我们被打服了。\n\u003e \n\u003e We were not.\n\u003e 我们没有。\n\u003e \n\u003e For a hundred and twenty-three years we have been doing other things. We raised up the Three Pillars Parliament. We brought star magic home and learned it. Our grain feeds half this continent — including the people on the far bank of the Grand Canal. We make paper, we weave cloth, we lay roads; our cities run from the Spica Gulf to the Twin Lakes and the Grimvolk Range. They call us the granary. They call us the land of abundance in the east.\n\u003e 这一百二十三年，我们在做别的事。我们把三柱议会立了起来，我们把星术学了回来，我们的粮食养活了这块大陆上一半的人，也包括大运河对岸的那些人。我们造纸、纺布、修路，我们的城市从[穗浪湾](#idx-e437)铺到两湖和[葛林沃尔克](#idx-e544)山——他们叫我们粮仓，叫我们大陆东方的丰饶之国。\n\u003e \n\u003e They have never called us a power.\n\u003e 他们从来不叫我们强国。\n\u003e \n\u003e (The Emperor turns and raises a hand toward the riverbank.)\n\u003e （皇帝转过身，朝河滩抬了抬手。）\n\u003e \n\u003e Look at what is lying over there. Before today, no human army had ever broken them in open battle. They are the shadow that has hung over Abundantia for two hundred years. Today they came down out of the sky — and you all saw how they went back up.\n\u003e 躺在那边的东西，在今天之前，没有一支人类的军队正面打垮过他们。他们是盘旋在阿布丹提亚头上两百年的阴影，今天他们从天上下来——你们都看见了他们是怎么回去的。\n\u003e \n\u003e What broke them was no miracle. It was bolt-throwers and resonance platforms, cast furnace by furnace in the workshops of Veridia, of Copperbell, of Ferrofield, by your brothers and sisters and mine. It is a hundred and twenty-three years of Abundantia's gathered strength! We beat them once today — we can beat them twice, three times, without end!\n\u003e 打垮他们的，不是奇迹，是在[维里迪亚](#idx-e496)、在库珀贝尔、在费洛菲尔德的工坊里，你我的兄弟姐妹一炉一炉铸出来的弩炮和谐振台，是阿布丹提亚一百二十三年来积蓄下来的力量！我们今天能打败他们一次，就能打败他们两次，三次，无数次！\n\u003e \n\u003e (A brief pause.)\n\u003e （短暂的停顿）\n\u003e \n\u003e There is one man I want to speak of.\n\u003e 我要说一个人。\n\u003e \n\u003e The Duke of Augaberry, Welten Duvelle, my father's cousin. Yesterday, in the north, he lost a leg and half an arm. He is inside Branton at this hour, ringed about by a Solarian legion. He cannot hear me.\n\u003e 阿格伯瑞公爵，韦尔滕·迪韦勒，我的表叔。昨天他在北边的战斗里丢了一条腿和一条小臂。他此刻在布兰顿城里，被索拉瑞斯人的一个军团层层包围，他听不见我说话。\n\u003e \n\u003e Yesterday night, when they carried him off the field, he sent me an urgent letter asking to fight. He wrote:\n\u003e 他被抬下来的那天夜里，急信向我请战。他说，\n\u003e \n\u003e 'Let their blades and their spears come at me, boy. And when they raise their hands — go in like a sword, into their heart.'\n\u003e ‘让他们的刀和枪冲着我来吧，孩子。当他们抬起手的时候，你要像一柄利剑一样刺入他们的心脏。’\n\u003e \n\u003e That hour is now.\n\u003e 现在就是这个时候。\n\u003e \n\u003e (The Emperor draws his sword and turns his horse to face west.)\n\u003e （皇帝拔出长剑，将马掉转面向西方。）\n\u003e \n\u003e My grandfather and my father did not live to cross the Branton. So I stand here in their place — I will not wait behind for you to come back. I will ride out ahead of you, the way I did just now against those loathsome dragon riders!\n\u003e 我的祖父和父亲，都没有活到能越过布兰顿河的这一天，所以我代他们站在这里——我不会在后面等你们回来，我会冲在你们前面，就像刚刚面对那些可憎的龙骑兵那样！\n\u003e \n\u003e We will take back our cities. We will take back our land!\n\u003e 我们要夺回属于我们的城市，夺回属于我们的土地！\n\u003e \n\u003e Forward! Drive the Solarians back to the west! God keep House Fenel! God keep Abundantia!\"\n\u003e 进军！把那些索拉瑞斯人赶回西边去！天佑费内尔！天佑阿布丹提亚！”\n\n### 附录二：《卡立曼七世在布兰顿河边的演讲》\n\n\u003c!-- 插图 compendium/行观别录/布兰顿战役/painting.webp 整行 可放大 --\u003e\n\n1502 年，阿布丹提亚画界为皇帝四十岁生日献上一幅巨幅油画，题为《卡立曼七世在布兰顿河边的演讲》，现悬于维里迪亚皇宫大厅。画面取皇帝拔剑掉转马头的一刻，背景是燃烧的河滩与远处的布兰顿河，近卫军、星术兵团、费洛菲尔德和斯拉格丹公爵的旗帜自画面右下角一路铺至地平线。此画在丹提亚境内有大量尺寸各异的临摹本流传，是当代帝国最广为人知的历史题材作品之一。\n\n笔者注：这两年笔者在阿布丹提亚旅居时，在各种公众场合看到过这幅画。画面上皇帝的马侧另有一骑，是一位身着戎装，四肢完好的老公爵，按位置与纹章只能是阿格伯瑞。而在演讲发生的那个下午，韦尔滕·迪韦勒缺着一条腿和一条小臂，被围在一百陆里以外的布兰顿城中。\n"])</script><script>self.__next_f.push([1,"a:[\"$\",\"$2\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"min-h-[60vh] flex items-center justify-center text-[var(--ink-muted)]\",\"children\":\"加载中…\"}],\"children\":[\"$\",\"$L12\",null,{\"bookSlug\":\"compendium\",\"toc\":[{\"slug\":\"作者序\",\"title\":\"炉边随记（代作者序）\",\"titleEn\":\"Preface\",\"isArticle\":true},{\"slug\":\"年表与大事记 Chronology\",\"title\":\"年表与大事记\",\"titleEn\":\"Chronology\",\"isArticle\":true},{\"slug\":\"度量与岁时 Measures and Times\",\"title\":\"度量与岁时\",\"titleEn\":\"Measures and Times\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview\",\"title\":\"大陆总览 Overview\",\"children\":[{\"slug\":\"大陆总览 Overview/地理\",\"title\":\"地理概述\",\"titleEn\":\"The Geography\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/魔法\",\"title\":\"魔法概述\",\"titleEn\":\"The Magic\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/经济\",\"title\":\"经济概述\",\"titleEn\":\"The Economy\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/宗教\",\"title\":\"宗教概述\",\"titleEn\":\"The Religions\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/政治\",\"title\":\"政治概述\",\"titleEn\":\"The Politics\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/文化\",\"title\":\"文化概述\",\"titleEn\":\"The Culture\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"诸国列志 Chorography of the Nations\",\"title\":\"诸国列志 Chorography of the Nations\",\"children\":[{\"slug\":\"诸国列志 Chorography of the Nations/阿布丹提亚\",\"title\":\"阿布丹提亚帝国\",\"titleEn\":\"The Abundantia Empire\",\"isArticle\":true},{\"slug\":\"诸国列志 Chorography of the Nations/索拉瑞斯\",\"title\":\"索拉瑞斯帝国\",\"titleEn\":\"Imperium Solaris\",\"isArticle\":true},{\"slug\":\"诸国列志 Chorography of the Nations/忒奥西斯\",\"title\":\"忒奥西斯圣治领\",\"titleEn\":\"The θέωσις(Theosis) Dominion\",\"isArticle\":true},{\"slug\":\"诸国列志 Chorography of the Nations/卡帕尼\",\"title\":\"卡帕尼诸公联合\",\"titleEn\":\"The United Principalities of Kapani\",\"isArticle\":true},{\"slug\":\"诸国列志 Chorography of the Nations/艾瑟瑞姆\",\"title\":\"艾瑟瑞姆王国\",\"titleEn\":\"The Kingdom of Aethyrium\",\"isArticle\":true},{\"slug\":\"诸国列志 Chorography of the Nations/尼希尔\",\"title\":\"尼希尔伊玛目酋邦\",\"titleEn\":\"The Nithil Imam-Chiefdom\",\"isArticle\":true},{\"slug\":\"诸国列志 Chorography of the Nations/希尔文诺\",\"title\":\"希尔文诺\",\"titleEn\":\"Sylvanor\",\"isArticle\":true},{\"slug\":\"诸国列志 Chorography of the Nations/葛林沃尔克\",\"title\":\"葛林沃尔克\",\"titleEn\":\"Grimvolk\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"行观别录 Notes from the Road\",\"title\":\"行观别录 Notes from the Road\",\"children\":[{\"slug\":\"行观别录 Notes from the Road/布兰顿战役\",\"title\":\"布兰顿战役\",\"titleEn\":\"The Battle of Branton\",\"isArticle\":true},{\"slug\":\"行观别录 Notes from the Road/当代经济考略\",\"title\":\"当代经济格局考略\",\"titleEn\":\"On the Economic Order of the Nurania\",\"isArticle\":true},{\"slug\":\"行观别录 Notes from the Road/魔法矿石\",\"title\":\"魔法矿石\",\"titleEn\":\"The Magic Ore\",\"isArticle\":true},{\"slug\":\"行观别录 Notes from the Road/唯一神信仰小考\",\"title\":\"唯一神信仰小考\",\"titleEn\":\"A Brief Study on the One God Faith\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"诸域纪闻 Chronicles of the Realms\",\"title\":\"诸域纪闻 Chronicles of the Realms\",\"children\":[{\"slug\":\"诸域纪闻 Chronicles of the Realms/沉默者\",\"title\":\"沉默者\",\"titleEn\":\"The Silent One\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/衡台\",\"title\":\"衡台\",\"titleEn\":\"The Weighing Scale\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/童年\",\"title\":\"童年\",\"titleEn\":\"Coming of Age·Childhood\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/在人间·上\",\"title\":\"在人间·上\",\"titleEn\":\"Coming of Age·In the Human World I\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/在人间·下\",\"title\":\"在人间·下\",\"titleEn\":\"Coming of Age·In the Human World II\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/送别\",\"title\":\"送别\",\"titleEn\":\"The Farewell\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/铸币的两面\",\"title\":\"铸币的两面\",\"titleEn\":\"Two Sides of a Nicat\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"索引 Index\",\"title\":\"索引\",\"titleEn\":\"Index\",\"isArticle\":true}],\"currentSlug\":\"行观别录 Notes from the Road/布兰顿战役\",\"article\":{\"slug\":\"行观别录 Notes from the Road/布兰顿战役\",\"title\":\"布兰顿战役\",\"titleEn\":\"The Battle of Branton\",\"content\":\"$13\",\"indexTerms\":[{\"id\":\"e2\",\"title\":\"秘术式\",\"aliases\":[],\"body\":\"[尼希尔秘术](#idx-e4)施法所用的特殊仪式，将祭品[构成元素](#idx-e20)解离为[无属性元素流](#idx-e44)并转化为[魔法](#idx-e3)。\"},{\"id\":\"e3\",\"title\":\"魔法\",\"aliases\":[],\"body\":\"智慧种族通过特定条件调用[自然元素](#idx-e41)或[第五元素](#idx-e19)来施展的超自然力量，包含[祷言](#idx-e5)、[星术](#idx-e8)、[自然魔法](#idx-e9)和[秘术](#idx-e4)等种类。\"},{\"id\":\"e4\",\"title\":\"尼希尔秘术\",\"aliases\":[\"秘术\"],\"body\":\"[尼希尔](#idx-e536)统治阶级独有的[魔法](#idx-e3)体系，简称秘术，以等价交换为原理，解离祭品的[构成元素](#idx-e20)为力量。\"},{\"id\":\"e5\",\"title\":\"神启祷言\",\"aliases\":[\"祷言\",\"神启魔法\"],\"body\":\"[神启学派](#idx-e6)对自身[魔法](#idx-e3)的称呼，简称祷言；亦名神启魔法。狭义专指各类神启魔法对应的[术式](#idx-e40)。\"},{\"id\":\"e6\",\"title\":\"神启学派\",\"aliases\":[],\"body\":\"将[魔法](#idx-e3)解释为[唯一神](#idx-e138)所借权柄的学派，通过编织[术式](#idx-e40)调动环境中游离态的[四大元素](#idx-e41)来施展魔法。\"},{\"id\":\"e7\",\"title\":\"星空学派\",\"aliases\":[],\"body\":\"将[魔法](#idx-e3)解释为[第五元素](#idx-e19)显现与外化形式的学派，通过[内化](#idx-e32)以太于体内再[显化](#idx-e46)来施展魔法。\"},{\"id\":\"e8\",\"title\":\"以太星术\",\"aliases\":[\"星术\",\"星空魔法\"],\"body\":\"[星空学派](#idx-e7)对自身[魔法](#idx-e3)的称呼，简称星术；亦名星空魔法。狭义专指各类星空魔法对应的[大星轨](#idx-e18)走势。\"},{\"id\":\"e9\",\"title\":\"自然魔法\",\"aliases\":[\"精灵魔法\",\"圣树魔法\"],\"body\":\"精灵族与生俱来的法术能力，源自与[大圣树](#idx-e219)的契约连接；亦称精灵魔法、圣树魔法。\"},{\"id\":\"e10\",\"title\":\"奥韦纳尔·安柯伦坦\",\"aliases\":[\"安柯伦坦\"],\"body\":\"[艾瑟瑞姆](#idx-e510)[天星师](#idx-e251)，1304年提出智慧生物出生时的[大星轨](#idx-e18)图像决定其[仪式星轨](#idx-e51)特征，且该特征恰合[丝兰黛尔](#idx-e42)的[源星](#idx-e59)分类法，该分类法由此成为[星术](#idx-e8)学界公认标准。\"},{\"id\":\"e18\",\"title\":\"大星轨\",\"aliases\":[\"天道星轨\"],\"body\":\"[天星五政](#idx-e43)在天球上的轨迹，代表宇宙中[以太](#idx-e19)流的流向；亦称天道星轨。\"},{\"id\":\"e19\",\"title\":\"第五元素\",\"aliases\":[\"以太\"],\"body\":\"构成群星与其间空间（宇宙）的物质，通称以太，永恒不朽；稀薄存在于大地之上，[星空魔法](#idx-e8)师可将其蓄积体内，是星术的能量来源。\"},{\"id\":\"e20\",\"title\":\"构成元素\",\"aliases\":[],\"body\":\"构成实体事物的四大[自然元素](#idx-e41)，不响应[祷言](#idx-e5)[术式](#idx-e40)。通过[秘术式](#idx-e2)可将其解离。\"},{\"id\":\"e25\",\"title\":\"精神力\",\"aliases\":[],\"body\":\"编织[祷言](#idx-e5)[术式](#idx-e40)所凭的能力，可经后天训练提高，只能依靠时间缓慢恢复。\"},{\"id\":\"e27\",\"title\":\"洛林阶运\",\"aliases\":[],\"body\":\"特定工艺的[星轨蚀刻](#idx-e79)（如旧式的[三分耦式](#idx-e35)蚀刻法）所致的[玛娜](#idx-e28)自然向外部流出的矿界面层现象。\"},{\"id\":\"e28\",\"title\":\"玛娜\",\"aliases\":[\"魔力\"],\"body\":\"[星空学派](#idx-e7)语境下[内化](#idx-e32)后的[以太](#idx-e19)，即俗称的魔力；经人体或[蚀刻魔矿](#idx-e76)[回路](#idx-e78)运转[仪式星轨](#idx-e51)后释放成为[魔法](#idx-e3)。释放后无法自然恢复，须[星术](#idx-e8)师冥想缓慢补充/手动为回路充能。\"},{\"id\":\"e30\",\"title\":\"米西斯类\",\"aliases\":[],\"body\":\"[魔矿](#idx-e74)[蚀刻](#idx-e79)工艺的一个类别，包含[三分耦式](#idx-e35)蚀刻、四分耦式蚀刻等。特征是加工过程对环境温度非常敏感。\"},{\"id\":\"e32\",\"title\":\"内化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师于修习中将环境自由[以太](#idx-e19)汇入体内[仪式星轨](#idx-e51)的过程。\"},{\"id\":\"e35\",\"title\":\"三分耦式\",\"aliases\":[\"三分耦\"],\"body\":\"[米西斯类](#idx-e30)[魔矿](#idx-e74)[蚀刻](#idx-e79)工艺的一种，其加工过程长期依赖低温环境；1490年，该工艺获得可在室温条件下进行的重要突破。\"},{\"id\":\"e38\",\"title\":\"施法者\",\"aliases\":[],\"body\":\"能够主动运用[魔法](#idx-e3)的人口的统称，全大陆约占一成五。\"},{\"id\":\"e39\",\"title\":\"疏化\",\"aliases\":[],\"body\":\"同一空间内反复施用[神启魔法](#idx-e5)后[自然元素](#idx-e41)恢复速率异常下降的现象，由神启魔法学者菲略奥斯提出。\"},{\"id\":\"e40\",\"title\":\"术式\",\"aliases\":[],\"body\":\"[神启魔法](#idx-e5)师以[精神力](#idx-e25)编织、临时改写自然法则的结构，是与[唯一神](#idx-e138)所立的单向契约。\"},{\"id\":\"e41\",\"title\":\"四大元素\",\"aliases\":[\"自然元素\"],\"body\":\"构成世界万物和游离在自然环境中的地、水、火、风[元素](#idx-e54)，也称自然元素；唯游离态者可为[神启魔法](#idx-e5)调用。\"},{\"id\":\"e42\",\"title\":\"塔莉拉·丝兰黛尔\",\"aliases\":[\"丝兰黛尔\"],\"body\":\"[星空学派](#idx-e7)[魔法](#idx-e3)先驱，著《[星术](#idx-e8)源流考》，首创以五颗天星对应五类魔法的[源星](#idx-e59)分类法，源星之名即出于此。\"},{\"id\":\"e43\",\"title\":\"天星五政\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)最重要的概念之一，指[冠阳](#idx-e551)、[汐月](#idx-e563)、[仲裁星](#idx-e568)、[烬铸星](#idx-e552)、[织虹星](#idx-e567)五颗天体。五政在天球上的轨迹被称为[大星轨](#idx-e18)，代表了宇宙中[以太](#idx-e19)流的流向。\"},{\"id\":\"e44\",\"title\":\"无属性元素流\",\"aliases\":[],\"body\":\"[秘术式](#idx-e2)解离祭品[构成元素](#idx-e20)后所得的能量形态，其性质仍是大陆[魔法](#idx-e3)学界研究的未解课题。\"},{\"id\":\"e46\",\"title\":\"显化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师控制体内[以太](#idx-e19)流运转特定[大星轨](#idx-e18)、将[玛娜](#idx-e28)转为有色状态并外放的过程。\"},{\"id\":\"e50\",\"title\":\"血契\",\"aliases\":[],\"body\":\"人类与巨龙缔结的契约，双方精神世界互相开放，可转移龙族[术式](#idx-e40)的[精神力](#idx-e25)消耗。\"},{\"id\":\"e51\",\"title\":\"仪式星轨\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师于体内仿照[大星轨](#idx-e18)建立的结构，人体各部位各对应一天宫。是星术师释放星术的核心系统。\"},{\"id\":\"e54\",\"title\":\"元素\",\"aliases\":[],\"body\":\"组成万物的最基本实体，包含构成世界的[四大元素](#idx-e41)以及构成群星与其间空间（宇宙）的[第五元素](#idx-e19)。\"},{\"id\":\"e55\",\"title\":\"元素丰地\",\"aliases\":[],\"body\":\"游离态[四大元素](#idx-e41)丰度明显高于大陆平均的天然区域，对[疏化](#idx-e39)有强韧抵抗力。\"},{\"id\":\"e59\",\"title\":\"源星\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师[丝兰黛尔](#idx-e42)在《星术源流考》中提出的星术分类法中，五类星术的源头，对应[天星五政](#idx-e43)。该分类法被称为源星分类法。\"},{\"id\":\"e60\",\"title\":\"织虹星术\",\"aliases\":[],\"body\":\"以[织虹星](#idx-e567)为[源星](#idx-e59)的一类[星术](#idx-e8)，主修复、修饰与客体感知，含实体治疗、修复、幻象与伪装变化等星术。\"},{\"id\":\"e64\",\"title\":\"动力炉\",\"aliases\":[],\"body\":\"大型[星术设备](#idx-e88)的供能核心，见于[魔偶](#idx-e86)、[巨像](#idx-e84)与[星术驿车](#idx-e90)等。\"},{\"id\":\"e65\",\"title\":\"对龙穿甲弩炮\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)[对龙工程兵团](#idx-e292)列装的专用军备，利用[星术](#idx-e8)驱动发射装有特制簇头的大型弩箭，专为打击[索拉瑞斯](#idx-e441)龙骑兵部队设计。\"},{\"id\":\"e68\",\"title\":\"高品级魔矿\",\"aliases\":[],\"body\":\"[元素](#idx-e54)储存率极高、可承受各种[魔法](#idx-e3)加工工艺的[魔矿](#idx-e74)，八成以上产自[沙阿万大魔矿](#idx-e540)。\"},{\"id\":\"e72\",\"title\":\"洛林星元\",\"aliases\":[\"星元\"],\"body\":\"粗加工[魔矿](#idx-e74)晶体经[星轨蚀刻](#idx-e79)、注入[玛娜](#idx-e28)封装的[星术制品](#idx-e91)，通称星元，取名于洛林法蚀刻，可为小型[星术设备](#idx-e88)供能。\"},{\"id\":\"e74\",\"title\":\"魔法矿石\",\"aliases\":[\"魔矿\"],\"body\":\"对五大[元素](#idx-e54)均具极高流通率与储存率的天然矿石，通称魔矿，是大陆最重要的战略资源。\"},{\"id\":\"e76\",\"title\":\"蚀刻魔矿\",\"aliases\":[],\"body\":\"经[星轨蚀刻](#idx-e79)的[魔矿](#idx-e74)，可按[回路](#idx-e78)结构储存[玛娜](#idx-e28)，并在触发时释放对应[星术](#idx-e8)。\"},{\"id\":\"e77\",\"title\":\"托兰瓦尔·洛林\",\"aliases\":[\"洛林\"],\"body\":\"[艾瑟瑞姆](#idx-e510)[天星师](#idx-e251)，1125年首报可流通储存[以太](#idx-e19)的矿石并据以发明[星轨蚀刻](#idx-e79)；洛林法蚀刻为纪念其贡献而名，[洛林星元](#idx-e72)、[洛林阶运](#idx-e27)之名亦由此而来。\"},{\"id\":\"e78\",\"title\":\"星轨回路\",\"aliases\":[\"回路\"],\"body\":\"通过[蚀刻](#idx-e79)在[魔矿](#idx-e74)上建立的模仿[仪式星轨](#idx-e51)的通路，允许魔矿储存[玛娜](#idx-e28)，并在特定条件触发下释放对应[星术](#idx-e8)。\"},{\"id\":\"e79\",\"title\":\"星轨回路蚀刻\",\"aliases\":[\"蚀刻\",\"星轨蚀刻\",\"洛林法蚀刻\"],\"body\":\"于[魔矿](#idx-e74)表面蚀刻[仪式星轨](#idx-e51)[回路](#idx-e78)的技术，简称星轨蚀刻或蚀刻，为纪念发明人，又名洛林法蚀刻。1125年由[艾瑟瑞姆](#idx-e510)[星术](#idx-e8)学者[托兰瓦尔·洛林](#idx-e77)发明，构成了[星术设备](#idx-e88)的基石。\"},{\"id\":\"e84\",\"title\":\"星术巨像\",\"aliases\":[\"巨像\"],\"body\":\"[星术](#idx-e8)兵种的大型作战单位，通称巨像，由专精操作的星术师远距控制。\"},{\"id\":\"e86\",\"title\":\"星术魔偶\",\"aliases\":[\"魔偶\"],\"body\":\"以[蚀刻](#idx-e79)[回路](#idx-e78)驱动的小型[星术](#idx-e8)作战或劳作单位，通称魔偶，有农用魔偶、清扫魔偶等。\"},{\"id\":\"e88\",\"title\":\"星术设备\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e76)制成的各类器物的统称，自家用台灯至战场[巨像](#idx-e84)[动力炉](#idx-e64)，是[艾瑟瑞姆](#idx-e510)高技术社会立国的物质基础。\"},{\"id\":\"e90\",\"title\":\"星术驿车\",\"aliases\":[],\"body\":\"以[动力炉](#idx-e64)驱动的陆上载具，行于[艾瑟瑞姆](#idx-e510)城市内或城际道路。\"},{\"id\":\"e91\",\"title\":\"星术制品\",\"aliases\":[],\"body\":\"[星术设备](#idx-e88)所需半成品作为贸易品的称呼，[洛林星元](#idx-e72)为其典型代表。\"},{\"id\":\"e96\",\"title\":\"移动星术谐振台\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)[对龙工程兵团](#idx-e292)列装的专用军备，利用[星术设备](#idx-e88)发射高频声波干扰[飞龙](#idx-e297)亚种，与[对龙穿甲弩炮](#idx-e65)同为反制龙骑兵的核心器械。\"},{\"id\":\"e102\",\"title\":\"朝圣\",\"aliases\":[],\"body\":\"[正教](#idx-e150)信众沿既定路线前往[圣城索菲亚](#idx-e503)的虔修，是[圣领](#idx-e499)可观的收入来源。\"},{\"id\":\"e103\",\"title\":\"称义\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒持守信仰、按神的教诲生活而得免[宿债](#idx-e134)的全过程，自[洗礼](#idx-e140)始，至临终而成。\"},{\"id\":\"e107\",\"title\":\"大祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)学徒正式受任为神职的[圣事](#idx-e124)。\"},{\"id\":\"e109\",\"title\":\"告解\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒为自身罪行请求赦免的[圣事](#idx-e124)，可反复进行。\"},{\"id\":\"e110\",\"title\":\"公教\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)两大教派之一，1295年[教会大分裂](#idx-e164)后自[阿布丹提亚](#idx-e468)境内的[正教会](#idx-e185)独立而成，以[公教会](#idx-e159)为组织载体，是阿布丹提亚人口的第一大信仰。将[星空魔法](#idx-e8)一并纳入[唯一神](#idx-e138)权柄、另尊保罗为第二先知；主张轻罪可凭虔信与[圣事](#idx-e124)自赦，审判之权唯神独有，故不设[审判庭](#idx-e175)建制并废除[诺万尼斯流放](#idx-e171)，对个人虔修的要求高于[正教](#idx-e150)；[季首弥撒](#idx-e112)与节庆均依[通用历](#idx-e373)。\"},{\"id\":\"e112\",\"title\":\"季首弥撒\",\"aliases\":[],\"body\":\"[正教](#idx-e150)于[仪式历](#idx-e366)各季首日，[公教](#idx-e110)于[通用历](#idx-e373)各季首日举行的规模略大于每周[弥撒](#idx-e116)的集体仪式。\"},{\"id\":\"e113\",\"title\":\"坚振\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中，标志[称义](#idx-e103)大体完成的[圣事](#idx-e124)，一生一次，须对教会有重大贡献或持守信仰足够长久。\"},{\"id\":\"e115\",\"title\":\"礼仪年\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中六季[弥撒](#idx-e116)与九大节庆构成的一整年宗教循环。\"},{\"id\":\"e116\",\"title\":\"弥撒\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)礼拜日举行的集体仪式，与每日的[日课](#idx-e120)同为[称义](#idx-e103)最重要的日常载体。\"},{\"id\":\"e117\",\"title\":\"冥界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中的[四界](#idx-e133)之一，信徒死后安息、静候轮回之地。\"},{\"id\":\"e120\",\"title\":\"日课\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒每日的功课，与礼拜日[弥撒](#idx-e116)同为[称义](#idx-e103)的日常载体。\"},{\"id\":\"e122\",\"title\":\"圣保罗\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之一，最初的医者，司治愈与修复；对应[织虹星](#idx-e567)与[虹曜日](#idx-e353)。[公教](#idx-e110)另尊其为第二先知。\"},{\"id\":\"e123\",\"title\":\"圣骸\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)语境下的圣徒遗骨，为[朝圣](#idx-e102)与教堂声望所系，如[潘克拉托](#idx-e501)大教堂所藏的[圣约翰](#idx-e126)圣骸。\"},{\"id\":\"e124\",\"title\":\"圣事\",\"aliases\":[],\"body\":\"指[正教](#idx-e150)与[公教](#idx-e110)六项圣事：[洗礼](#idx-e140)、[坚振](#idx-e113)、婚姻、[告解](#idx-e109)、[大祝职](#idx-e107)、[小祝职](#idx-e142)。\"},{\"id\":\"e125\",\"title\":\"圣伊琳娜\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之一，司秩序与契约；对应[仲裁星](#idx-e568)与[裁曜日](#idx-e350)，[圣领](#idx-e499)[伊琳娜圣银币](#idx-e346)以其得名。\"},{\"id\":\"e126\",\"title\":\"圣约翰\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之首，[正教](#idx-e150)唯一的先知与弥赛亚，司精神与教导；对应[汐月](#idx-e563)与[月曜日](#idx-e381)。\"},{\"id\":\"e127\",\"title\":\"圣约瑟\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之一，商会之圣，司转化、破坏与锻造；对应[烬铸星](#idx-e552)与[烬曜日](#idx-e356)，[圣约瑟商会](#idx-e340)以其得名。\"},{\"id\":\"e129\",\"title\":\"使徒\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载中，随[唯一神](#idx-e138)降世传教的最初四人：约翰、伊琳娜、约瑟、保罗。\"},{\"id\":\"e130\",\"title\":\"十字架\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)共用的宗教象征符号。[正教](#idx-e150)十字架为四端，象征四[元素](#idx-e54)权柄。[公教](#idx-e110)下端另加一横，四横端象征四元素，竖端象征[星术](#idx-e8)。\"},{\"id\":\"e133\",\"title\":\"四界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)神学的宇宙构成：[天界](#idx-e136)、[现界](#idx-e141)、[冥界](#idx-e117)、[虚界](#idx-e145)。\"},{\"id\":\"e134\",\"title\":\"宿债\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)神学中，人一出生便背负的亏欠。缘于[唯一神](#idx-e138)所借予而非赐予的权柄，受惠者无人能置身账外。\"},{\"id\":\"e135\",\"title\":\"索菲亚圣典\",\"aliases\":[\"圣典\"],\"body\":\"[唯一神信仰](#idx-e139)的最高典籍，通称《圣典》，分《创世录》、《弥赛亚记》、《神言书》、《箴言集》、四福音（《约翰福音》、《约瑟福音》、《伊琳娜福音》、《保罗福音》）与《预言书》。\"},{\"id\":\"e136\",\"title\":\"天界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中的[四界](#idx-e133)之一，[唯一神](#idx-e138)、圣徒与天使的居所。\"},{\"id\":\"e138\",\"title\":\"唯一神\",\"aliases\":[\"主\",\"神\",\"上帝\"],\"body\":\"[唯一神信仰](#idx-e139)所奉的至高神，信徒亦称主、神或上帝，是宇宙的创造者、维系者与监督者，也是世间一切[魔法](#idx-e3)力量的源头。\"},{\"id\":\"e139\",\"title\":\"唯一神信仰\",\"aliases\":[],\"body\":\"大陆流播最广的宗教，崇奉[唯一神](#idx-e138)，与[神启祷言](#idx-e5)一脉深度绑定，最高典籍为《[索菲亚圣典](#idx-e135)》。十三世纪末[教会大分裂](#idx-e164)后分为[正教](#idx-e150)与[公教](#idx-e110)两派，前者为[索拉瑞斯](#idx-e441)与[忒奥西斯](#idx-e499)的国教，后者是[阿布丹提亚](#idx-e468)人口的第一大信仰；其历法与礼拜之制的影响遍及各国。\"},{\"id\":\"e140\",\"title\":\"洗礼\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒入教与[称义](#idx-e103)之始的[圣事](#idx-e124)，一生一次，象征认清并领受自身的[宿债](#idx-e134)。\"},{\"id\":\"e141\",\"title\":\"现界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中[四界](#idx-e133)之一，人类生息的世界。\"},{\"id\":\"e142\",\"title\":\"小祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)神职人员卸任、复为寻常信徒之礼，多见于年老体弱者。\"},{\"id\":\"e145\",\"title\":\"虚界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中的[四界](#idx-e133)之一，天球与大地之外仍为虚所充满的空间，罪人与非正信者死后的去处。\"},{\"id\":\"e147\",\"title\":\"异端\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)语境下，秉持不同教义解释相异的教派；就[正教](#idx-e150)而言[公教](#idx-e110)即当代最大异端。\"},{\"id\":\"e150\",\"title\":\"正教\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)两大教派之一，以[正教会](#idx-e185)为组织载体，为[索拉瑞斯](#idx-e441)与[忒奥西斯](#idx-e499)的国教。认[神启祷言](#idx-e5)为[唯一神](#idx-e138)所授的权柄，[星空魔法](#idx-e8)则不在神权之列；正教会主张一切罪无论大小均须经[告解](#idx-e109)方得赦免，并以神在[现界](#idx-e141)的代行者自任，设[审判庭](#idx-e175)严管神启魔法、以[诺万尼斯流放](#idx-e171)向神赎罪。历法与[礼仪年](#idx-e115)循环依[圣格里仪式历](#idx-e366)。\"},{\"id\":\"e151\",\"title\":\"传信厅\",\"aliases\":[],\"body\":\"[圣领](#idx-e499)[牧首厅](#idx-e170)六分厅之一，分管外交。\"},{\"id\":\"e152\",\"title\":\"大牧首\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)最高元首、[忒奥西斯](#idx-e499)圣领国家元首，由[枢机主教团](#idx-e178)闭门选出，终身任期。\"},{\"id\":\"e153\",\"title\":\"大审判长\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)最高长官，由[枢机主教团](#idx-e178)任命，与[大牧首](#idx-e152)同为终身任期。\"},{\"id\":\"e154\",\"title\":\"第二次宗教改革\",\"aliases\":[],\"body\":\"十三世纪末谋求将[星术](#idx-e8)纳入神权的改革，失败后直接导致[教会大分裂](#idx-e164)。\"},{\"id\":\"e156\",\"title\":\"都主教\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)[都主教区](#idx-e157)长官，教阶在主教之上；与[大牧首](#idx-e152)同不得婚娶，别称[门徒](#idx-e169)。\"},{\"id\":\"e157\",\"title\":\"都主教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e499)最高一级行政区划和宗教管理区划，全境共五个，长官称[都主教](#idx-e156)。[卡帕尼](#idx-e519)和[索拉瑞斯](#idx-e441)亦设有都主教区，但不具备行政职能。\"},{\"id\":\"e158\",\"title\":\"督审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)教阶之一，位在[审判官](#idx-e173)之上；[审判所](#idx-e166)驻任长官、[审判分庭](#idx-e172)官员。[诺万尼斯流放](#idx-e171)须由审判分庭所属督审判官主刑。\"},{\"id\":\"e159\",\"title\":\"公教会\",\"aliases\":[],\"body\":\"1295年[教会大分裂](#idx-e164)后，[阿布丹提亚](#idx-e468)境内[正教会](#idx-e185)脱离[牧首厅](#idx-e170)管辖独立而来的教会，领袖称[宗主教](#idx-e187)，驻[波马里亚](#idx-e475)。\"},{\"id\":\"e161\",\"title\":\"公教总会\",\"aliases\":[],\"body\":\"[公教会](#idx-e159)中枢，驻[阿布丹提亚帝国](#idx-e468)城市[波马里亚](#idx-e475)。\"},{\"id\":\"e164\",\"title\":\"教会大分裂\",\"aliases\":[],\"body\":\"1295年[第二次宗教改革](#idx-e154)失败后，[阿布丹提亚帝国](#idx-e468)境内[正教会](#idx-e185)宣布脱离[牧首厅](#idx-e170)独立，成立[公教会](#idx-e159)。\"},{\"id\":\"e165\",\"title\":\"教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e499)[都主教区](#idx-e157)下辖的最小一级行政区划，长官称主教。也是[正教会](#idx-e185)在大陆各国所划的宗教事务上的最小管理层级。\"},{\"id\":\"e166\",\"title\":\"教区审判所\",\"aliases\":[\"审判所\"],\"body\":\"[审判庭](#idx-e175)在[教区](#idx-e165)一级所设的分支机构，简称审判所，由[督审判官](#idx-e158)驻任长官。\"},{\"id\":\"e169\",\"title\":\"门徒\",\"aliases\":[],\"body\":\"教会系统中[都主教](#idx-e156)及以上神职，以及[审判庭](#idx-e175)系统中自[督审判官](#idx-e158)及以上职位的别称，象征舍弃现世之乐、专心侍神；门徒不得婚娶。\"},{\"id\":\"e170\",\"title\":\"牧首厅\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)中枢以及[圣领](#idx-e499)最高行政机构，下设[圣礼厅](#idx-e177)、[省察厅](#idx-e183)、[司牧厅](#idx-e181)、[神启厅](#idx-e176)、[传信厅](#idx-e151)、[卫教厅](#idx-e182)六分厅。\"},{\"id\":\"e171\",\"title\":\"诺万尼斯流放\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[索拉瑞斯帝国](#idx-e441)维持的一种极刑，将受刑者留置诺万尼斯区域枯竭死地直至器官衰竭。\"},{\"id\":\"e172\",\"title\":\"审判分庭\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)在[都主教区](#idx-e157)一级的机构，长官称审判长，由[大审判长](#idx-e153)直接任命。\"},{\"id\":\"e173\",\"title\":\"审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)教阶之一，负责日常调查和执行事务，是[圣领](#idx-e499)独立于军事系统的强制执行编制。\"},{\"id\":\"e175\",\"title\":\"审判庭\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)直属司法和执行机构，处理[异端](#idx-e147)事务、追查未经许可的神启施法，拥有独立执法和行刑权。\"},{\"id\":\"e176\",\"title\":\"神启厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管[神启魔法](#idx-e5)事务。\"},{\"id\":\"e177\",\"title\":\"圣礼厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管宗教事务，亦负责[索拉瑞斯](#idx-e441)[凯撒](#idx-e239)的[血脉测试](#idx-e258)。\"},{\"id\":\"e178\",\"title\":\"枢机主教团\",\"aliases\":[],\"body\":\"[圣领](#idx-e499)事实上的最高权力机构，[大牧首](#idx-e152)去世后负责闭门选出继任者。成员由大牧首自[都主教](#idx-e156)中选任。\"},{\"id\":\"e181\",\"title\":\"司牧厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管民生。\"},{\"id\":\"e182\",\"title\":\"卫教厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管军事，战时统一征召[护教军](#idx-e294)。\"},{\"id\":\"e183\",\"title\":\"省察厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管监察。\"},{\"id\":\"e185\",\"title\":\"正教会\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)最大教派[正教](#idx-e150)的教会组织，以[忒奥西斯](#idx-e499)圣领[牧首厅](#idx-e170)为教会中枢，同时也是圣领的统治机构。\"},{\"id\":\"e187\",\"title\":\"宗主教\",\"aliases\":[],\"body\":\"[公教会](#idx-e159)领袖，由全大陆[公教](#idx-e110)主教选出三名候选，再由盲眼童贞信徒抽签决定。\"},{\"id\":\"e190\",\"title\":\"大神庙\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e536)首都[阿尔努尔](#idx-e537)城中的[教长](#idx-e204)驻地，是酋邦的宗教中心与圣地。\"},{\"id\":\"e191\",\"title\":\"混沌之海\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中[混沌之河](#idx-e192)的尽头。现世的[巨航船](#idx-e194)于此为海浪撕毁，是为末日。千年后新船于混沌之河上游再度起航。\"},{\"id\":\"e192\",\"title\":\"混沌之河\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中，孕育[司费尔](#idx-e199)的停滞之河，经其令之流动后成为宇宙时间的载体。[巨航船](#idx-e194)自上游航行而下抵达[混沌之海](#idx-e191)，是为一次循环。\"},{\"id\":\"e194\",\"title\":\"巨航船\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中的宇宙譬喻：[现界](#idx-e141)如行于[混沌之河](#idx-e192)上的巨船，终将驶抵[混沌之海](#idx-e191)。\"},{\"id\":\"e195\",\"title\":\"玛阿特\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中的死后审判仪式，以心脏置于天平称量，砝码为[希塔](#idx-e202)手杖顶端的宝石。\"},{\"id\":\"e196\",\"title\":\"尼希尔诸神信仰\",\"aliases\":[\"诸神信仰\"],\"body\":\"行于[尼希尔酋邦](#idx-e536)一域的宗教，通称诸神信仰，是大陆唯一与活体献祭绑定者。奉[零之神](#idx-e199)司费尔及其所化六神，以死后的[玛阿特](#idx-e195)称量为教义核心，称量恰成平衡者受赐[秘术](#idx-e4)之力成为[神遴者](#idx-e417)。雏形出自两河流域早期部落，结构在前二世纪萨阿尔部征服西尼希尔后成型，宗教、秘术与统治三者由此缚为一体。\"},{\"id\":\"e199\",\"title\":\"司费尔\",\"aliases\":[\"零之神\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)中[混沌之河](#idx-e192)所孕育的最初亦唯一之神，以自身之躯造出[现界](#idx-e141)，又拆己身为六片化作六神，随后消隐，不受祭祀。\"},{\"id\":\"e202\",\"title\":\"希塔\",\"aliases\":[\"陆之神\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)中六神之一，老者之形，象征万物的终点，司灵魂与审判，看护[至福乐土](#idx-e206)；[玛阿特](#idx-e195)称量由其执行，砝码即其手杖顶端的宝石。\"},{\"id\":\"e204\",\"title\":\"伊玛目教长\",\"aliases\":[\"教长\"],\"body\":\"[尼希尔](#idx-e536)最高元首，简称教长，同时是酋邦的宗教领袖与[酋长会议](#idx-e244)首席。终身制，非世袭，代代以[秘术](#idx-e4)密封诏书委任继承。\"},{\"id\":\"e206\",\"title\":\"至福乐土\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中，[玛阿特](#idx-e195)称量通过者所被允许进入的永恒安乐之地，由[希塔](#idx-e202)看护。\"},{\"id\":\"e207\",\"title\":\"诸神圣土\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e536)中由[伊玛目教长](#idx-e204)直辖的宗教领地。含首都[阿尔努尔](#idx-e537)及周边耕地城市，由各部按比例出资供养。\"},{\"id\":\"e216\",\"title\":\"氏族\",\"aliases\":[],\"body\":\"精灵族的社会单位，被喻为[大圣树](#idx-e219)的分枝，各有族长与长老，本族领地内高度自治。\"},{\"id\":\"e218\",\"title\":\"万叶庭\",\"aliases\":[],\"body\":\"精灵族最高权力机构，每三十年于[希尔文尼亚](#idx-e546)召开，全体精灵借[圣树魔法](#idx-e9)旁听并投票。\"},{\"id\":\"e219\",\"title\":\"希尔文诺大圣树\",\"aliases\":[\"圣树\",\"大圣树\",\"圣树之母\"],\"body\":\"圣树信仰唯一的神圣对象，通称大圣树或圣树，矗立于[希尔文尼亚](#idx-e546)祭坛广场；凡有描述皆以女性位格出现，精灵称之为圣树之母，[自然魔法](#idx-e9)即祂分享之力。\"},{\"id\":\"e221\",\"title\":\"叶络枢机院\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e543)日常行政与对外事务机构，席位由[万叶庭](#idx-e218)轮选，长老兼承宗教职责。\"},{\"id\":\"e223\",\"title\":\"阿斯塔伦·塔利瑞安\",\"aliases\":[\"塔利瑞安\"],\"body\":\"[星术](#idx-e8)泰斗，1097年联合十二城邦创建[大星术研究院](#idx-e231)，即今[王家研究院](#idx-e254)之前身。\"},{\"id\":\"e227\",\"title\":\"城务会\",\"aliases\":[\"卡里司泰城务会\"],\"body\":\"[自由城市](#idx-e266)[卡里司泰](#idx-e545)的治理机构，由各国贸易机构负责人与[希尔文诺](#idx-e543)精灵特别代表组成，权限止于仓储、转运、市集与治安等市政事务。\"},{\"id\":\"e231\",\"title\":\"大星术研究院\",\"aliases\":[],\"body\":\"1097年由[塔利瑞安](#idx-e223)联合十二城邦创建，[艾瑟瑞姆](#idx-e510)[王家研究院](#idx-e254)前身，是艾瑟瑞姆国家形态的起点。\"},{\"id\":\"e232\",\"title\":\"地星师\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e510)[星术](#idx-e8)学者的头衔之一。星术师于所属研究院研究室完成课题答辩，毕业后被授予的头衔。\"},{\"id\":\"e233\",\"title\":\"帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)的一级行政区划，共五个，与皇室直辖的[维里迪亚直辖省](#idx-e497)并列；省政府为中央[内阁](#idx-e242)的地方分支。原为六省，[卡帕尼](#idx-e519)独立后余五省。\"},{\"id\":\"e235\",\"title\":\"公爵领\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)最高级别的贵族封地，各[帝政省](#idx-e233)含一到两个公爵领。\"},{\"id\":\"e236\",\"title\":\"管理局\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)[特贸区](#idx-e522)的立法与行政机构，由区内各商会分部选派代表组成，最高长官称管理局主席。\"},{\"id\":\"e237\",\"title\":\"军团行省\",\"aliases\":[\"行省\"],\"body\":\"[索拉瑞斯](#idx-e441)的一级行政区划，一行省对应一[军团](#idx-e299)，共八个，长官称[行省总督](#idx-e256)。\"},{\"id\":\"e238\",\"title\":\"龙裔继嗣法\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)开国皇帝[阿利昂](#idx-e240)晚年制定的皇位继承法，以直系子嗣的龙血浓度为据，由[牧首厅](#idx-e170)主持[血脉测试](#idx-e258)。\"},{\"id\":\"e239\",\"title\":\"龙裔凯撒\",\"aliases\":[\"凯撒\"],\"body\":\"[索拉瑞斯](#idx-e441)最高统治者的称号，简称凯撒，即位须由[大牧首](#idx-e152)主持册封礼，体现君权神授。\"},{\"id\":\"e240\",\"title\":\"马尔奇安·阿利昂\",\"aliases\":[\"阿利昂\"],\"body\":\"[索拉瑞斯](#idx-e441)开国[凯撒](#idx-e239)，人龙混血，受[大牧首](#idx-e152)册封为首位龙裔凯撒；捐帝国东部领土立[忒奥西斯](#idx-e499)圣领，晚年制定《[龙裔继嗣法](#idx-e238)》。\"},{\"id\":\"e242\",\"title\":\"内阁\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e510)和[阿布丹提亚帝国](#idx-e468)的中央机构之一。均指直属于王室/皇室的日常行政机构，各有大臣分管外交、军务、内务与王室/皇室财政。\"},{\"id\":\"e244\",\"title\":\"酋长会议\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e536)最高权力机构，由[教长](#idx-e204)与各部落酋长组成，每年[金素](#idx-e355)季于[阿尔努尔](#idx-e537)召开，协商全酋邦外交、军事与内政事宜。\"},{\"id\":\"e245\",\"title\":\"三柱议会\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)最高立法与财政机构，1393年确立，三柱指皇室、贵族与[魔法](#idx-e3)阶级。\"},{\"id\":\"e249\",\"title\":\"特别仪式区\",\"aliases\":[\"仪式区\"],\"body\":\"位于[艾瑟瑞姆](#idx-e510)中南部最大平原，专用于王国[星术](#idx-e8)研究与设备制造的行政区划，直属国王/女王管理，区内最大城市为[韦里泰尔](#idx-e517)。\"},{\"id\":\"e250\",\"title\":\"特区商法典\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)[北部特贸区](#idx-e522)适用的独立法系，不同于各公国法系。\"},{\"id\":\"e251\",\"title\":\"天星师\",\"aliases\":[],\"body\":\"[星术](#idx-e8)学者的最高阶头衔与职位，授予毕业后继续从事学术研究，且学术成果极为杰出的[地星师](#idx-e232)。[托兰瓦尔·洛林](#idx-e77)、[奥韦纳尔·安柯伦坦](#idx-e10)等均曾任天星师。\"},{\"id\":\"e252\",\"title\":\"天星首席\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e510)[王家研究院](#idx-e254)最高级别学者之职，永久由艾瑟瑞姆国王或女王兼任。\"},{\"id\":\"e253\",\"title\":\"王冠领地\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e510)国王直辖之地，含以首都[阿斯托利亚](#idx-e511)为首的[坠星湖](#idx-e518)南岸城市群。\"},{\"id\":\"e254\",\"title\":\"王家研究院\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e510)学术中枢，前身为[大星术研究院](#idx-e231)，兼掌王室继承事务与[特别仪式区](#idx-e249)管理，院长即[天星首席](#idx-e252)，永久由国王或女王兼任。\"},{\"id\":\"e256\",\"title\":\"行省总督\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)[军团行省](#idx-e237)最高长官，由[军团](#idx-e299)长兼任，任期二十年，每年赴首都[索尔因](#idx-e461)叙职。\"},{\"id\":\"e257\",\"title\":\"叙职大会\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)八位[行省总督](#idx-e256)每年赴[索尔因](#idx-e461)向[凯撒](#idx-e239)当面汇报施政与军务的会议。\"},{\"id\":\"e258\",\"title\":\"血脉测试\",\"aliases\":[],\"body\":\"《[龙裔继嗣法](#idx-e238)》规定的继承资格测试，由[牧首厅](#idx-e170)[圣礼厅](#idx-e177)主持，每代[凯撒](#idx-e239)继承人均须重测。\"},{\"id\":\"e260\",\"title\":\"御令\",\"aliases\":[],\"body\":\"指[索拉瑞斯帝国](#idx-e441)[凯撒](#idx-e239)签发的各类诏令与敕令。\"},{\"id\":\"e261\",\"title\":\"御前参谋部\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)最高军事机构，直属[凯撒](#idx-e239)，主理战略与军事调度。\"},{\"id\":\"e264\",\"title\":\"仲裁所\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)[特贸区](#idx-e522)[管理局](#idx-e236)下属机构，承担特贸区司法职能。\"},{\"id\":\"e266\",\"title\":\"自由城市\",\"aliases\":[],\"body\":\"不受任何人类政权管辖、亦不被承认为独立政治实体的城市，大陆仅[卡里司泰](#idx-e545)一处。须完全去武装化，不具外交主体地位，由驻城各方组成的[城务会](#idx-e227)共同治理。\"},{\"id\":\"e268\",\"title\":\"阿索战争\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)与[索拉瑞斯帝国](#idx-e441)之间的三次大规模战争（1290–1292、1351–1356、1479–1483）。\"},{\"id\":\"e269\",\"title\":\"布兰顿和约\",\"aliases\":[],\"body\":\"[第二次阿索战争](#idx-e274)停战和约，以[布兰顿河](#idx-e479)下游为两国新界，[布兰顿](#idx-e478)城割予[索拉瑞斯](#idx-e441)。\"},{\"id\":\"e270\",\"title\":\"布兰顿战役\",\"aliases\":[],\"body\":\"1479年[三战](#idx-e275)前期的一场决定性会战，[阿布丹提亚帝国](#idx-e468)获得战略性胜利。\"},{\"id\":\"e273\",\"title\":\"丹提亚-瑞姆技术协约\",\"aliases\":[\"丹提亚-瑞姆协约\"],\"body\":\"1304年[阿布丹提亚](#idx-e468)与[艾瑟瑞姆](#idx-e510)缔结的长期协约，艾瑟瑞姆输出[星术](#idx-e8)成果与人才，换取阿布丹提亚[魔矿](#idx-e74)与战略资源。\"},{\"id\":\"e274\",\"title\":\"第二次阿索战争\",\"aliases\":[\"二战\"],\"body\":\"于1351–1356年[索拉瑞斯](#idx-e441)与[阿布丹提亚](#idx-e468)发生的第二次大规模战争，[忒奥西斯](#idx-e499)保持中立。索拉瑞斯获胜，得[西比尔平原](#idx-e508)南部与[布兰顿](#idx-e478)城，停战于《[布兰顿和约](#idx-e269)》；阿布丹提亚放弃[卡帕尼](#idx-e519)群岛，卡帕尼同年独立。\"},{\"id\":\"e275\",\"title\":\"第三次阿索战争\",\"aliases\":[\"三战\"],\"body\":\"于1479–1483年[索拉瑞斯](#idx-e441)与[阿布丹提亚](#idx-e468)发生的第三次大规模战争，阿布丹提亚获胜。停战于《[卡斯特鲁姆和约](#idx-e280)》，索拉瑞斯向阿布丹提亚归还[大运河](#idx-e438)下游东岸两座城市及其周边土地，两国当代边界由此确立。\"},{\"id\":\"e276\",\"title\":\"第一次阿索战争\",\"aliases\":[\"一战\"],\"body\":\"于1290–1292年[索拉瑞斯](#idx-e441)与[阿布丹提亚](#idx-e468)发生的第一次大规模战争，[忒奥西斯](#idx-e499)为索拉瑞斯盟友。索拉瑞斯获胜后与圣领同告东扩，停战于《[文特拉和约](#idx-e288)》；间接促成1295年[教会大分裂](#idx-e164)。\"},{\"id\":\"e278\",\"title\":\"黑暗时代\",\"aliases\":[],\"body\":\"指八世纪[七王约](#idx-e285)瓦解后，西诺拉尼亚地区长达数百年的多国混战时期。\"},{\"id\":\"e280\",\"title\":\"卡斯特鲁姆和约\",\"aliases\":[],\"body\":\"[第三次阿索战争](#idx-e275)停战和约，确立阿索当代边界；[大运河](#idx-e438)下游东岸两城交接至今悬而未决。\"},{\"id\":\"e281\",\"title\":\"林缘议厅\",\"aliases\":[],\"body\":\"1203年[希尔文诺](#idx-e543)[叶络枢机院](#idx-e221)于[冠脊山脉](#idx-e427)[屏林脉](#idx-e435)西南端的隘口所设，是当前大陆唯一公认的中立缔约见证机构。\"},{\"id\":\"e285\",\"title\":\"七王约\",\"aliases\":[],\"body\":\"328年西诺拉尼亚七国建立的松散邦联，存续约四个世纪，八世纪中叶瓦解。\"},{\"id\":\"e288\",\"title\":\"文特拉和约\",\"aliases\":[],\"body\":\"[第一次阿索战争](#idx-e276)停战和约，[索拉瑞斯](#idx-e441)与[忒奥西斯](#idx-e499)领土东扩。\"},{\"id\":\"e291\",\"title\":\"地方军\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)按[帝政省](#idx-e233)划编的常规部队，战时由贵族征召指挥，军费自负。\"},{\"id\":\"e292\",\"title\":\"对龙工程兵团\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)专为反制[龙骑兵团](#idx-e296)而设的特殊编制，列装[对龙穿甲弩炮](#idx-e65)与[移动星术谐振台](#idx-e96)。\"},{\"id\":\"e294\",\"title\":\"护教军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)最主要的常规部队，下分五个师，由各[都主教区](#idx-e157)分别组建。\"},{\"id\":\"e295\",\"title\":\"皇室近卫军\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)皇帝直辖的常备军，规模有限，军费由议会审批、自国库支出。\"},{\"id\":\"e296\",\"title\":\"近卫龙骑兵团\",\"aliases\":[\"龙骑兵团\"],\"body\":\"[索拉瑞斯](#idx-e441)以[飞龙](#idx-e297)为坐骑的精锐常规部队，通称龙骑兵团，直属[凯撒](#idx-e239)，约八万头飞龙、五万人编制，跨地形作战能力冠绝大陆。\"},{\"id\":\"e297\",\"title\":\"巨龙眷属\",\"aliases\":[\"飞龙\"],\"body\":\"巨龙与大型野兽的混血飞行亚种，通称飞龙，寿约五百年，是[龙骑兵团](#idx-e296)的坐骑。\"},{\"id\":\"e298\",\"title\":\"巨像部队\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)[星术兵团](#idx-e309)中以[星术巨像](#idx-e84)为作战单位的编制。\"},{\"id\":\"e299\",\"title\":\"军团\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)最高军事编制，与[行省](#idx-e237)一体，下设团、大队、小队。\"},{\"id\":\"e301\",\"title\":\"龙骑士团\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e441)的顶级战力，成员皆与巨龙缔结[血契](#idx-e50)，效忠[凯撒](#idx-e239)本人而非帝国，团内以多数决议事。\"},{\"id\":\"e307\",\"title\":\"圣仪军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)[牧首厅](#idx-e170)直属的精锐法术作战部队，大陆规模最大的法术军力，兼承民间大型工程建设。\"},{\"id\":\"e309\",\"title\":\"星术兵团\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)[魔法](#idx-e3)军力的主体，由[巨像](#idx-e84)、操作巨像的[星术](#idx-e8)师与[野战星术师](#idx-e311)组成，直属皇室。\"},{\"id\":\"e311\",\"title\":\"野战星术师\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e510)与[阿布丹提亚](#idx-e468)[星术](#idx-e8)部队中不操作[巨像](#idx-e84)，自主作战的星术师，与[巨像部队](#idx-e298)并列为[魔法](#idx-e3)军力主体。\"},{\"id\":\"e320\",\"title\":\"大梅希斯商会\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)皇家投资商会，垄断[丹提亚纸](#idx-e321)业约八成贸易量，兼[丹提亚-瑞姆技术协约](#idx-e273)阿方的全权贸易代表。\"},{\"id\":\"e321\",\"title\":\"丹提亚纸\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)以[棉短绒](#idx-e410)制成的高品质纸张，是各国高端纸制品，以及[尼卡特汇票](#idx-e330)最重要的原材料之一。\"},{\"id\":\"e329\",\"title\":\"卡帕尼银联\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)[四大商会](#idx-e341)与众多中小商会银行共组的联合体，发行并管理[尼卡特汇票](#idx-e330)。\"},{\"id\":\"e330\",\"title\":\"卡帕尼银联汇票\",\"aliases\":[\"尼卡特汇票\",\"汇票\"],\"body\":\"[卡帕尼银联](#idx-e329)发行的结算凭证，通称尼卡特汇票或汇票，可在任意卡帕尼银联成员银行兑现，学界视为已具事实货币地位。\"},{\"id\":\"e340\",\"title\":\"圣约瑟商会\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)[牧首厅](#idx-e170)直属商会，垄断圣领境内外一切贸易，学界普遍认为兼具情报网络职能。\"},{\"id\":\"e341\",\"title\":\"四大商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)四公国各自直属的商会，由四公爵历史上直接出资创立，其主席即公爵本人。\"},{\"id\":\"e343\",\"title\":\"索利亚商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)商会之一，1489年前后由卡涅·道格拉斯创办，以[星术设备](#idx-e88)半成品与[魔矿](#idx-e74)原料分销起家，后跃居联邦前列。\"},{\"id\":\"e346\",\"title\":\"伊琳娜圣银币\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)流通货币，以高含银量铸造并防伪，与[索拉瑞斯](#idx-e441)铁钞按一比一互认流通。\"},{\"id\":\"e349\",\"title\":\"自由港\",\"aliases\":[],\"body\":\"[特贸区](#idx-e522)所设、享有极高自治权的港口体系，是国际贸易量激增的制度前提。\"},{\"id\":\"e350\",\"title\":\"裁曜日\",\"aliases\":[\"圣伊琳娜日\"],\"body\":\"[通用历](#idx-e373)一周第二日，亦简称星期二；[仪式历](#idx-e366)作圣伊琳娜日，对应天星[仲裁星](#idx-e568)。\"},{\"id\":\"e351\",\"title\":\"大陆历\",\"aliases\":[],\"body\":\"[通用历](#idx-e373)纪年，以[唯一神](#idx-e138)降临传教义于[圣约翰](#idx-e126)之年为元年，元年之前称元前。\"},{\"id\":\"e353\",\"title\":\"虹曜日\",\"aliases\":[\"圣保罗日\"],\"body\":\"[通用历](#idx-e373)一周第四日，亦简称星期四；[仪式历](#idx-e366)作圣保罗日，对应天星[织虹星](#idx-e567)。\"},{\"id\":\"e355\",\"title\":\"金素\",\"aliases\":[\"圣献\",\"冕宫月\",\"肆位\"],\"body\":\"一年六季的第四季，各地作物相继采收。[仪式历](#idx-e366)同季作圣献，[艾瑟瑞姆](#idx-e510)[星历](#idx-e376)作冕宫月，[尼希尔](#idx-e536)[萨辛历](#idx-e364)作肆位。\"},{\"id\":\"e356\",\"title\":\"烬曜日\",\"aliases\":[\"圣约瑟日\"],\"body\":\"[通用历](#idx-e373)一周第三日，亦简称星期三；[仪式历](#idx-e366)作圣约瑟日，对应天星[烬铸星](#idx-e552)。\"},{\"id\":\"e358\",\"title\":\"凛寒\",\"aliases\":[\"正炼\",\"琴宫月\",\"陆位\"],\"body\":\"一年六季的第六季，山地封路、[凛冰洋](#idx-e432)冰封，大陆整体进入年内节律最为收缩的状态。[仪式历](#idx-e366)同季作正炼，[艾瑟瑞姆](#idx-e510)[星历](#idx-e376)作琴宫月，[尼希尔](#idx-e536)[萨辛历](#idx-e364)作陆位。\"},{\"id\":\"e361\",\"title\":\"启蛰\",\"aliases\":[\"晖醒\",\"天宫月\",\"壹位\"],\"body\":\"一年六季的第一季，[通用历](#idx-e373)岁首所在。[凛冰洋](#idx-e432)浮冰退散、山地封雪消融、两河进入汛期，各地贸易与出行随之重新活跃。[仪式历](#idx-e366)同季作晖醒，[艾瑟瑞姆](#idx-e510)[星历](#idx-e376)作天宫月，[尼希尔](#idx-e536)[萨辛历](#idx-e364)作壹位。\"},{\"id\":\"e362\",\"title\":\"清和\",\"aliases\":[\"垂恩\",\"船宫月\",\"贰位\"],\"body\":\"一年六季的第二季，气候达到全年最宜人的状态，远洋航运与陆上商路均进入最活跃的窗口。[仪式历](#idx-e366)同季作垂恩，[艾瑟瑞姆](#idx-e510)[星历](#idx-e376)作船宫月，[尼希尔](#idx-e536)[萨辛历](#idx-e364)作贰位。\"},{\"id\":\"e363\",\"title\":\"日曜日\",\"aliases\":[\"圣神日\"],\"body\":\"[通用历](#idx-e373)一周第五日，亦简称星期日；[仪式历](#idx-e366)作圣神日，对应天星[冠阳](#idx-e551)，是信众向[唯一神](#idx-e138)礼拜的礼拜日。\"},{\"id\":\"e364\",\"title\":\"萨辛历\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e536)地方历法，以当代伊玛目称号纪年，每代即位则重置元年，六季称[壹位](#idx-e361)至[陆位](#idx-e358)。\"},{\"id\":\"e366\",\"title\":\"圣格里仪式历\",\"aliases\":[\"仪式历\"],\"body\":\"[正教会](#idx-e185)原始历法，[通用历](#idx-e373)前身，[圣领](#idx-e499)与[索拉瑞斯](#idx-e441)的官方历法，六季与五日均保留宗教命名。\"},{\"id\":\"e373\",\"title\":\"通用历\",\"aliases\":[\"格里历\"],\"body\":\"大陆通行的太阳历，一年六季、每季五十日、每旬十日、每周五日；别称格里历，源自[正教会](#idx-e185)的[圣格里仪式历](#idx-e366)，经[公教会](#idx-e159)世俗化后扩散全大陆。\"},{\"id\":\"e376\",\"title\":\"星历\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e510)地方历法，大陆唯一的月亮历，六月之名取自黄道六宫。\"},{\"id\":\"e379\",\"title\":\"炎阳\",\"aliases\":[\"神焰\",\"牧宫月\",\"叁位\"],\"body\":\"一年六季的第三季，[晨风海](#idx-e421)带来充沛降水，东部平原产出攀至顶峰，各国军事行动与大规模物资调动亦多集中于此时。[仪式历](#idx-e366)同季作神焰，[艾瑟瑞姆](#idx-e510)[星历](#idx-e376)作牧宫月，[尼希尔](#idx-e536)[萨辛历](#idx-e364)作叁位。\"},{\"id\":\"e381\",\"title\":\"月曜日\",\"aliases\":[\"圣约翰日\"],\"body\":\"[通用历](#idx-e373)一周第一日，亦简称星期一；[仪式历](#idx-e366)作圣约翰日，对应天星[汐月](#idx-e563)，是四个劳作日之首。\"},{\"id\":\"e383\",\"title\":\"步米\",\"aliases\":[],\"body\":\"长度基本单位，源自[索拉瑞斯](#idx-e441)[军团](#idx-e299)标准行军步伐；一步米等于十分步米等于一百厘步米。\"},{\"id\":\"e390\",\"title\":\"界石\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)[军团](#idx-e299)沿主干道每千步所立的里程标记，亦为[陆里](#idx-e392)之所本。\"},{\"id\":\"e392\",\"title\":\"陆里\",\"aliases\":[],\"body\":\"长度单位，一陆里等于一千[步米](#idx-e383)，源自[军团](#idx-e299)沿主干道每千步立一[界石](#idx-e390)的传统。\"},{\"id\":\"e400\",\"title\":\"星度\",\"aliases\":[],\"body\":\"温度基本单位，源自[王家研究院](#idx-e254)的[魔矿](#idx-e74)[蚀刻](#idx-e79)环境控制需求，以纯水冰点为零、沸点为一百。\"},{\"id\":\"e410\",\"title\":\"棉短绒\",\"aliases\":[],\"body\":\"棉花脱棉后的副产物，是[丹提亚纸](#idx-e321)的原料。\"},{\"id\":\"e416\",\"title\":\"落叶精灵\",\"aliases\":[],\"body\":\"已与[圣树](#idx-e219)断开连接（无论主动被动）的精灵统称，离开大森林后即失去[自然魔法](#idx-e9)的施展能力。\"},{\"id\":\"e417\",\"title\":\"神遴者\",\"aliases\":[\"神遴者阶层\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)的[玛阿特](#idx-e195)称量中，心脏与宝石恰成平衡者。宗教解释中，他们身负引导众生的责任，受赐[秘术](#idx-e4)之力转生现世；作为一个阶层，神遴者垄断了酋邦一切政治职位，[教长](#idx-e204)、祭司、部落酋长与长老无一例外皆出于此。\"},{\"id\":\"e418\",\"title\":\"北门湾\",\"aliases\":[],\"body\":\"[凛冰洋](#idx-e432)伸入大陆中部的内湾，位于[忒奥西斯](#idx-e499)北境，是[索菲亚大运河](#idx-e438)的北端入口。[尼希尔](#idx-e536)所产[魔矿](#idx-e74)经凛冰洋航线抵此南下，是当代大陆最重要跨洋贸易干线上的节点。\"},{\"id\":\"e419\",\"title\":\"背雨山脉\",\"aliases\":[\"背雨脉\"],\"body\":\"[冠脊山脉](#idx-e427)六脉之一，横亘大陆中北方，北为[尼希尔](#idx-e536)的[沙阿万大沙漠](#idx-e541)、南为[希尔文诺大森林](#idx-e547)。是大陆西部最重要的气候屏障，两侧的干旱荒漠与万年密林构成大陆诸域中最极端的毗邻气候对照。北麓另发源两条小型沙漠河流，维系着沙阿万沙漠中的若干绿洲。\"},{\"id\":\"e420\",\"title\":\"朝礼山脉\",\"aliases\":[\"朝礼脉\"],\"body\":\"[冠脊山脉](#idx-e427)六脉之一，自[青嶂山脉](#idx-e436)与[屏林山脉](#idx-e435)交汇处发源，延绵向东南，是[索拉瑞斯帝国](#idx-e441)与[忒奥西斯](#idx-e499)圣领的界山。\"},{\"id\":\"e421\",\"title\":\"晨风海\",\"aliases\":[],\"body\":\"大陆东南方海域，洋流自东往西、往北持续输送暖湿气流深入内陆，是[阿布丹提亚大平原](#idx-e469)优良农业气候的关键成因。[马提尼河](#idx-e487)与[波特利亚河](#idx-e477)汇流后注入此海。\"},{\"id\":\"e422\",\"title\":\"大星洋\",\"aliases\":[],\"body\":\"大陆西南侧的宽广海域，洋流复杂多变；其偏暖洋流携湿润气流北上，遇[裂境山脉](#idx-e431)与[冠脊山脉](#idx-e427)抬升成雨，是西诺拉尼亚地区森林的核心水分来源。\"},{\"id\":\"e424\",\"title\":\"翡翠海峡\",\"aliases\":[],\"body\":\"大陆南方水域，全大陆航运最繁忙之处，[卡帕尼](#idx-e519)群岛与大陆本体之间的物流几乎全经于此，亦是[索菲亚大运河](#idx-e438)的南端出口。卡帕尼北部岛链水文条件优越、港口全年可用，是这条贸易干线的天然枢纽。\"},{\"id\":\"e427\",\"title\":\"冠脊山脉\",\"aliases\":[],\"body\":\"大陆规模最大的山脉系统，分背雨、屏林、青嶂、雪源、朝礼、横嶂六脉。山系自西南的[雪源脉](#idx-e439)起向东北延伸，经[青嶂脉](#idx-e436)至三脉交汇处分出[屏林脉](#idx-e435)与[朝礼脉](#idx-e420)；[背雨脉](#idx-e419)横亘于北，[横嶂脉](#idx-e428)自雪源脉东北角东出。[希尔文诺大森林](#idx-e547)由背雨、屏林、青嶂三脉合围而成，[尼希尔酋邦](#idx-e536)的南侧边境则由背雨、雪源两脉围合。\"},{\"id\":\"e428\",\"title\":\"横嶂山脉\",\"aliases\":[\"横嶂脉\"],\"body\":\"[冠脊山脉](#idx-e427)六脉之一，自[雪源山脉](#idx-e439)东北角东出，全境位于[索拉瑞斯帝国](#idx-e441)境内，是[裂境北行省](#idx-e454)与[尼托雷特行省](#idx-e458)的分界。与[裂境山脉](#idx-e431)同为帝国内部的地形分隔线；[弗密纳北森](#idx-e446)的东北即抵此脉。\"},{\"id\":\"e431\",\"title\":\"裂境山脉\",\"aliases\":[],\"body\":\"西南-东北走向纵贯[索拉瑞斯](#idx-e441)中部的山脉，是帝国东西地形的核心分界线。其以东为[奥利提斯平原](#idx-e442)，落在其雨影区而气候偏干；以西地势平缓，[镜心湖](#idx-e448)居中。山脉沿线铁铜矿藏富集，是大陆冶铁产业最重要的原料来源；[索尔河](#idx-e460)发源于其南麓。\"},{\"id\":\"e432\",\"title\":\"凛冰洋\",\"aliases\":[],\"body\":\"大陆北方极寒洋，以东西向洋流为主，北部与东部全年有浮冰，渔业与运输活动仅集中于中西部海域；[尼希尔](#idx-e536)[魔矿](#idx-e74)出口的主干路线即自酋邦出海口北上进入此洋，东行抵[北门湾](#idx-e418)后南下入[大运河](#idx-e438)。\"},{\"id\":\"e435\",\"title\":\"屏林山脉\",\"aliases\":[\"屏林脉\"],\"body\":\"[冠脊山脉](#idx-e427)六脉之一，呈东北—西南走向，是[希尔文诺](#idx-e543)与[忒奥西斯](#idx-e499)圣领之间的山壁。西南端的天然隘口是[希尔文诺大森林](#idx-e547)通向外界的唯一官方通道，[林缘议厅](#idx-e281)设于此处，[自由城市](#idx-e266)[卡里司泰](#idx-e545)在隘口正东不远处。西南端另与[青嶂山脉](#idx-e436)、[朝礼山脉](#idx-e420)交汇。\"},{\"id\":\"e436\",\"title\":\"青嶂山脉\",\"aliases\":[\"青嶂脉\"],\"body\":\"[冠脊山脉](#idx-e427)六脉之一，呈东北—西南走向，北面[希尔文诺大森林](#idx-e547)、南面[索拉瑞斯帝国](#idx-e441)[尼托雷特行省](#idx-e458)，两片林海以此为界。东北端与[屏林山脉](#idx-e435)、[朝礼山脉](#idx-e420)交汇，西南端接[雪源山脉](#idx-e439)。\"},{\"id\":\"e437\",\"title\":\"穗浪湾\",\"aliases\":[],\"body\":\"[晨风海](#idx-e421)北部，三面被[阿布丹提亚](#idx-e468)环抱的内湾。兼具渔业与内海运输双重功能，帝国东西两大农业产区之间的大量货物经此中转，是境内最重要的贸易通道之一。\"},{\"id\":\"e438\",\"title\":\"索菲亚大运河\",\"aliases\":[\"大运河\"],\"body\":\"[忒奥西斯](#idx-e499)与[索拉瑞斯](#idx-e441)联合开凿的人工水道，1381–1388年历时七年建成，以[圣仪军](#idx-e307)的[神启魔法](#idx-e5)为主力，是[大陆历](#idx-e351)史上最庞大的人造工程。自[北门湾](#idx-e418)几乎垂直向南贯穿[西比尔平原](#idx-e508)，南端注入[翡翠海峡](#idx-e424)，将[凛冰洋](#idx-e432)与翡翠海峡物理贯通，从根本上重塑了大陆南北贸易格局。\"},{\"id\":\"e439\",\"title\":\"雪源山脉\",\"aliases\":[\"雪源脉\"],\"body\":\"[冠脊山脉](#idx-e427)六脉之一，位于山系西南，北面[尼希尔伊玛目酋邦](#idx-e536)、南面[索拉瑞斯帝国](#idx-e441)，与[背雨山脉](#idx-e419)共同围合酋邦的南侧边境。北麓积雪融水是尼希尔[哈亚特河](#idx-e538)的源头。东北角另出[横嶂山脉](#idx-e428)。\"},{\"id\":\"e441\",\"title\":\"索拉瑞斯帝国\",\"aliases\":[\"索拉瑞斯\"],\"body\":\"位于大陆中西部的军事集权帝制大国，首都[索尔因维克图斯](#idx-e461)。1159年[索拉尔王国](#idx-e560)国王[阿利昂](#idx-e240)统一西大陆诸国、受牧首册封为首代[龙裔凯撒](#idx-e239)而立国。国土一千一百二十万平方[陆里](#idx-e392)，划为八个[军团行省](#idx-e237)，逾七成为群山与原始森林，人口约四千二百万。以[军团](#idx-e299)—行省一体化制度与[龙骑兵团](#idx-e296)著称，尊[正教](#idx-e150)为国教，逾八成公民为正教信徒；外交强势，与[阿布丹提亚](#idx-e468)共构当代大陆两极。\"},{\"id\":\"e442\",\"title\":\"奥利提斯平原\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)境内[裂境山脉](#idx-e431)以东呈东北—西南走向的狭长平原，是帝国最主要的农业区与人口集中地之一，首都[索尔因维克图斯](#idx-e461)位于其西南角。因落在裂境山脉雨影区，气候较[镜心湖](#idx-e448)区偏干。\"},{\"id\":\"e445\",\"title\":\"弗密纳\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)[裂境北行省](#idx-e454)首府，位于[裂境山脉](#idx-e431)以北、[冠脊山脉](#idx-e427)[横嶂脉](#idx-e428)以南；城北为大片森林地区，称为[弗密纳北森](#idx-e446)。\"},{\"id\":\"e446\",\"title\":\"弗密纳北森\",\"aliases\":[],\"body\":\"[弗密纳](#idx-e445)北部森林，东北接[冠脊山脉](#idx-e427)[横嶂脉](#idx-e428)，西北接[雪源山脉](#idx-e439)。\"},{\"id\":\"e447\",\"title\":\"哈吉奥多罗\",\"aliases\":[],\"body\":\"[索菲亚大运河](#idx-e438)下游东岸的粮站城市，位于[缪涅斯特](#idx-e457)以北，名出\\\"圣赐\\\"，是运河通航后[西比尔平原](#idx-e508)南部兴起的谷物集散地之一。与缪涅斯特同为《[卡斯特鲁姆和约](#idx-e280)》自[索拉瑞斯](#idx-e441)划归[阿布丹提亚](#idx-e468)的两城，交接至今悬而未决；索拉瑞斯凭对二城的实际管辖，保有对运河下游入海段的物理控制。\"},{\"id\":\"e448\",\"title\":\"镜心湖\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)西部的湖泊，是帝国最重要的农业产区核心与人口最密集的区域之一。受[大星洋](#idx-e422)暖流直接调节，湖体又进一步平抑温差，是帝国内气候最温和宜居的地带。[纳赫尔河](#idx-e539)发源于此；东岸最大城市为[雷克西姆](#idx-e453)。\"},{\"id\":\"e449\",\"title\":\"镜心湖行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)八个[军团行省](#idx-e237)之一，位于帝国西部，环[镜心湖](#idx-e448)而设，首府[雷克西姆](#idx-e453)。\"},{\"id\":\"e453\",\"title\":\"雷克西姆\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)[镜心湖行省](#idx-e449)首府，[镜心湖](#idx-e448)东岸最大城市，建有[圣保罗](#idx-e122)大教堂。堂中无[圣骸](#idx-e123)，仅供奉据称是保罗生前所披的斗篷——保罗殉道之处据《保罗福音》末章推测邻近镜心湖，[正教会](#idx-e185)因此在雷克西姆建立大教堂。\"},{\"id\":\"e454\",\"title\":\"裂境北行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)八个[军团行省](#idx-e237)之一，位于[裂境山脉](#idx-e431)以北、[冠脊山脉](#idx-e427)[雪源脉](#idx-e439)与[横嶂脉](#idx-e428)以南，首府[弗密纳](#idx-e445)。\"},{\"id\":\"e457\",\"title\":\"缪涅斯特\",\"aliases\":[],\"body\":\"[布兰顿河](#idx-e479)以西、[索菲亚大运河](#idx-e438)以东的城市，是[索拉瑞斯](#idx-e441)在[西比尔平原](#idx-e508)南部的东向门户。与北面的[哈吉奥多罗](#idx-e447)同为《[卡斯特鲁姆和约](#idx-e280)》划归[阿布丹提亚](#idx-e468)的大运河下游东岸两城，行政交接至今未能完成。\"},{\"id\":\"e458\",\"title\":\"尼托雷特行省\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e441)八个[军团行省](#idx-e237)之一，位于帝国东北，北抵[冠脊山脉](#idx-e427)[青嶂脉](#idx-e436)，南以[横嶂脉](#idx-e428)与[裂境北行省](#idx-e454)分界，下辖[尼托韦德](#idx-e459)等边境聚落。\"},{\"id\":\"e459\",\"title\":\"尼托韦德\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)[尼托雷特行省](#idx-e458)东部的边境小镇，住户不多，偏僻清冷，距首都[索尔因维克图斯](#idx-e461)约两千七百[陆里](#idx-e392)。\"},{\"id\":\"e460\",\"title\":\"索尔河\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e441)境内河流。发源于[裂境山脉](#idx-e431)南麓，流经首都[索尔因维克图斯](#idx-e461)后向东南注入[艾瑟瑞姆](#idx-e510)境内的[坠星湖](#idx-e518)，是帝国重要的内河水系。\"},{\"id\":\"e461\",\"title\":\"索尔因维克图斯\",\"aliases\":[\"索尔因\"],\"body\":\"[索拉瑞斯帝国](#idx-e441)首都，通称索尔因，位于[奥利提斯平原](#idx-e442)西南角，[索尔河](#idx-e460)流经其间。是帝国的政治军事中心与最大城市，八位[行省总督](#idx-e256)每年赴此参加[叙职大会](#idx-e257)；城南设有[龙骑士团](#idx-e301)驻地与飞场。\"},{\"id\":\"e468\",\"title\":\"阿布丹提亚帝国\",\"aliases\":[\"阿布丹提亚\",\"丹提亚帝国\"],\"body\":\"通称丹提亚帝国，位于大陆东南方大平原的君主立宪制大国，首都[维里迪亚](#idx-e496)。386年卡立曼·费内尔统一大平原诸国建立帝政，费内尔家族统治延续至今；两次[阿索战争](#idx-e268)失利后于1393年建[三柱议会](#idx-e245)，和平演变为君主立宪制国家。国土八百七十万平方[陆里](#idx-e392)，划为五个[帝政省](#idx-e233)和一个直辖省，人口逾六千二百万，为全大陆最多。大陆第一大粮食出口国与政治东极，约七成人口信奉[公教](#idx-e110)。\"},{\"id\":\"e469\",\"title\":\"阿布丹提亚大平原\",\"aliases\":[\"丹提亚大平原\"],\"body\":\"[阿布丹提亚帝国](#idx-e468)国土主体，大陆东部平原带规模最大的一部分，为全大陆最集中的农业核心地带。地势平坦开阔，水系极为发达，冲积土壤肥沃；中部核心区无霜期长而几无结冻，是帝国粮食、棉花与人口的集中所在，首都[维里迪亚](#idx-e496)居其腹地。\"},{\"id\":\"e470\",\"title\":\"阿格伯瑞\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)境内城市，从属于[阿格伯瑞帝政省](#idx-e471)所属同名[公爵领](#idx-e235)。[第三次阿索战争](#idx-e275)时期该公爵领领主为卡立曼七世的表叔韦尔滕·迪韦勒。\"},{\"id\":\"e471\",\"title\":\"阿格伯瑞帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)五个[帝政省](#idx-e233)之一，以帝政省最大城市[阿格伯瑞](#idx-e470)命名，位于帝国西北，靠近阿索边境。\"},{\"id\":\"e472\",\"title\":\"奥斯提乌姆\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)境内城镇，位于[西比尔平原](#idx-e508)东南缘，[布兰顿河](#idx-e479)与其西支流交汇处。[三战](#idx-e275)[布兰顿战役](#idx-e270)中[索拉瑞斯](#idx-e441)集团军指挥部所在地。\"},{\"id\":\"e475\",\"title\":\"波马里亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)境内位于[润溪湖](#idx-e490)西南方的重要城市。是大陆东部已知[元素](#idx-e54)丰度最高的城市之一，天然宜居且对元素[疏化](#idx-e39)抵抗力强。历史上曾为[正教会](#idx-e185)在东诺拉尼亚最重要的宗教驻地，[教会大分裂](#idx-e164)后成为[公教总会](#idx-e161)所在地；[公教会](#idx-e159)于十四世纪宣称寻得的[圣保罗](#idx-e122)[圣骸](#idx-e123)即供奉于波马里亚大教堂。该城亦是波马里亚[公爵领](#idx-e235)首府，同名[帝政省](#idx-e233)的省名即出于此。\"},{\"id\":\"e476\",\"title\":\"波马里亚帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)五个[帝政省](#idx-e233)之一，位于帝国中北部，两湖之间。帝政省辖[波马里亚](#idx-e475)与[库珀贝尔](#idx-e485)两[公爵领](#idx-e235)，省名取自省内的[元素丰地](#idx-e55)城市波马里亚。\"},{\"id\":\"e477\",\"title\":\"波特利亚河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)境内的主要河流之一，发源自[葛林沃尔克](#idx-e544)南脉南麓，与[马提尼河](#idx-e487)于大平原中部汇流后注入[晨风海](#idx-e421)，两河交汇处即首都[维里迪亚](#idx-e496)所在。\"},{\"id\":\"e478\",\"title\":\"布兰顿\",\"aliases\":[],\"body\":\"[布兰顿河](#idx-e479)东岸城市，位于河流中游。[第二次阿索战争](#idx-e274)后依《[布兰顿和约](#idx-e269)》割予[索拉瑞斯](#idx-e441)，此后一百二十余年是帝国边境最靠东的据点。1479年[三战](#idx-e275)开战之初为[阿布丹提亚](#idx-e468)夺取，此后终战未再易手，现归属于阿布丹提亚。\"},{\"id\":\"e479\",\"title\":\"布兰顿河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)境内河流。自北向南流经[西比尔平原](#idx-e508)东南缘，中段接纳一条自西而来的支流后折向东南，于[法拉利亚](#idx-e481)一带入海；[第二次阿索战争](#idx-e274)后其下游为阿索两国界河，《[布兰顿和约](#idx-e269)》即以此河命名，1479年[布兰顿战役](#idx-e270)的战场亦在其中下游两岸。\"},{\"id\":\"e481\",\"title\":\"法拉利亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)境内，[布兰顿河](#idx-e479)入[翡翠海峡](#idx-e424)河口处的港镇。\"},{\"id\":\"e482\",\"title\":\"费洛菲尔德\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)境内城市，[三战](#idx-e275)前靠近阿索边境，从属于[阿格伯瑞帝政省](#idx-e471)所属同名[公爵领](#idx-e235)。阿布丹提亚主要军工器械产地之一。\"},{\"id\":\"e485\",\"title\":\"库珀贝尔\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)北部矿业城市，从属于[波马里亚帝政省](#idx-e476)所属同名[公爵领](#idx-e235)。阿布丹提亚主要军工器械产地之一。\"},{\"id\":\"e486\",\"title\":\"卢佩尔库姆\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)境内城镇，位于[布兰顿河](#idx-e479)西支流上游。\"},{\"id\":\"e487\",\"title\":\"马提尼河\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)第一大河，发源于[穗满湖](#idx-e493)，向东南流经大平原后与[波特利亚河](#idx-e477)汇流注入[晨风海](#idx-e421)，两河交汇处即首都[维里迪亚](#idx-e496)所在。\"},{\"id\":\"e488\",\"title\":\"米尔罗\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)境内城镇，位于[布兰顿](#idx-e478)东南方，是阿布丹提亚在这一带的路网枢纽。\"},{\"id\":\"e489\",\"title\":\"墨塔顿帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)五个[帝政省](#idx-e233)之一，位于帝国东南部，辖[斯拉格丹](#idx-e492)[公爵领](#idx-e235)和[赛兰德](#idx-e491)子爵领等贵族领地。\"},{\"id\":\"e490\",\"title\":\"润溪湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)双湖之东者，与[穗满湖](#idx-e493)并称双湖，是帝国北部水系的重要源头。湖运承担北部矿区矿产向核心区的输送；西南方为[元素丰地](#idx-e55)城市[波马里亚](#idx-e475)。\"},{\"id\":\"e491\",\"title\":\"赛兰德\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)境内城市，从属于[墨塔顿帝政省](#idx-e489)所属同名子爵领，城市规模较小。\"},{\"id\":\"e492\",\"title\":\"斯拉格丹\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)境内城市，从属于[墨塔顿帝政省](#idx-e489)所属同名[公爵领](#idx-e235)，位于[穗浪湾](#idx-e437)东岸。[大梅希斯商会](#idx-e320)在此设有分部。\"},{\"id\":\"e493\",\"title\":\"穗满湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e468)双湖之西者，与[润溪湖](#idx-e490)并称双湖。湖区周边水草丰美，是全大陆最集中的规模化牧区；[马提尼河](#idx-e487)发源于此。\"},{\"id\":\"e496\",\"title\":\"维里迪亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e468)首都，位于[马提尼河](#idx-e487)与[波特利亚河](#idx-e477)交汇处、[丹提亚大平原](#idx-e469)腹地，是帝国政治文化中心，也是帝国最重要的内河航运枢纽之一。城市内歌剧院与画廊林立，素有\\\"艺术之都\\\"之称。\"},{\"id\":\"e497\",\"title\":\"维里迪亚直辖省\",\"aliases\":[\"首都直辖省\"],\"body\":\"[阿布丹提亚帝国](#idx-e468)六个一级行政区中唯一由皇室直辖者，亦称首都直辖省，位于帝国西南，含首都[维里迪亚](#idx-e496)及周边；境内不设贵族封地与[帝政省](#idx-e233)政府，是该国唯一的直辖省。\"},{\"id\":\"e499\",\"title\":\"忒奥西斯圣治领\",\"aliases\":[\"忒奥西斯\",\"圣治领\",\"圣领\"],\"body\":\"位于大陆中央北部的[正教会](#idx-e185)神权共和国，通称圣治领或圣领，首都[圣城索菲亚](#idx-e503)。1159年[索拉瑞斯](#idx-e441)开国[凯撒](#idx-e239)[阿利昂](#idx-e240)将帝国东部领土捐献给[大牧首](#idx-e152)而立，是正教会取得世俗领地后的政治实体。国土两百三十万平方[陆里](#idx-e392)，划为五个[都主教区](#idx-e157)，人口一千三百万。大牧首兼国家元首，[牧首厅](#idx-e170)为最高行政机构。\"},{\"id\":\"e501\",\"title\":\"潘克拉托\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)境内城市，[圣约翰都主教区](#idx-e505)的都教座城。[圣约翰](#idx-e126)殉道之地，[圣骸](#idx-e123)存于圣约翰大教堂。\"},{\"id\":\"e503\",\"title\":\"圣城索菲亚\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)圣领首都，[大牧首](#idx-e152)及[牧首厅](#idx-e170)所在地。相传为[唯一神](#idx-e138)降临之处，本为小村，圣领建立及[大运河](#idx-e438)开通后扩张为兼具政治、宗教与经济中心地位的大都会。是大陆中部已知最大的[元素丰地](#idx-e55)，也是[正教会](#idx-e185)立都于此的重要自然前提；索菲亚大教堂藏有据称是[圣约翰](#idx-e126)升天时所钉[十字架](#idx-e130)的原木碎片。\"},{\"id\":\"e505\",\"title\":\"圣约翰都主教区\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)圣领西南部[都主教区](#idx-e157)，以四[使徒](#idx-e129)之首[圣约翰](#idx-e126)命名，辖存有圣约翰[圣骸](#idx-e123)的[潘克拉托](#idx-e501)等地。\"},{\"id\":\"e508\",\"title\":\"西比尔平原\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e499)圣领所在的温带半干旱草原，地势平坦、天然水源匮乏，[索菲亚大运河](#idx-e438)贯通前农业条件相当有限；北延至[北门湾](#idx-e418)，是大陆南北贸易的关键咽喉。其南部于[二战](#idx-e274)后尽归[索拉瑞斯](#idx-e441)，后为索菲亚大运河纵切为二；运河以东的土地依[三战](#idx-e275)《[卡斯特鲁姆和约](#idx-e280)》归[阿布丹提亚](#idx-e468)，交接至今悬置，是阿索两国博弈的核心争议。\"},{\"id\":\"e510\",\"title\":\"艾瑟瑞姆王国\",\"aliases\":[\"艾瑟瑞姆\"],\"body\":\"位于大陆西南部的封建君主制国家，首都[阿斯托利亚](#idx-e511)，领土环抱[坠星湖](#idx-e518)。源出西诺拉尼亚黑暗时期南下避难的[星术](#idx-e8)学者聚落，十一世纪末[塔利瑞安](#idx-e223)联合十二城邦创建[大星术研究院](#idx-e231)，十三世纪前叶塔利兰娜受推举加冕为初代女王。国土约四百二十万平方[陆里](#idx-e392)，由[王冠领地](#idx-e253)、四大伯爵封邑与[特别仪式区](#idx-e249)构成，人口约一千八百万。以星术立国，[王家研究院](#idx-e254)[天星首席](#idx-e252)永由君主兼任，传统意义的[施法者](#idx-e38)占人口逾半。\"},{\"id\":\"e511\",\"title\":\"阿斯托利亚\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e510)首都，位于[坠星湖](#idx-e518)南端[瑟蒂尔河](#idx-e515)出湖处，由[大陆历](#idx-e351)894年南下避难的[星术](#idx-e8)学者聚落发展而成，[王家研究院](#idx-e254)即设于此。城名源出[星空学派](#idx-e7)早期所用的 Astralis（\\\"属星的\\\"），后世音变作 Astoria，旧拼法今仅见于研究院的仪式文书。\"},{\"id\":\"e515\",\"title\":\"瑟蒂尔河\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e510)境内河流。由[坠星湖](#idx-e518)南端出发，向南流经艾瑟瑞姆注入[大星洋](#idx-e422)，首都[阿斯托利亚](#idx-e511)位于其北端出湖处。\"},{\"id\":\"e517\",\"title\":\"韦里泰尔\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e510)[特别仪式区](#idx-e249)内的最大城市，[星轨蚀刻](#idx-e79)总所所在地，统筹协调全区的[星术设备](#idx-e88)生产。\"},{\"id\":\"e518\",\"title\":\"坠星湖\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e510)的地理中心，首都[阿斯托利亚](#idx-e511)位于其南端出湖口。[索尔河](#idx-e460)自[索拉瑞斯](#idx-e441)方向注入湖北端，[瑟蒂尔河](#idx-e515)由南端流出南向[大星洋](#idx-e422)；湖运依托[星术](#idx-e8)船只，是沿岸城市群最重要的内部贸易路线。\"},{\"id\":\"e519\",\"title\":\"卡帕尼诸公联合\",\"aliases\":[\"卡帕尼\",\"卡帕尼联邦\"],\"body\":\"又称卡帕尼联邦，位于大陆南部群岛的公国联邦制国家，由四成员公国与[北部特别贸易区](#idx-e522)组成，四公国各有首府，联邦首都为[阿卡帕尼](#idx-e520)公国的[伊索拉韦尔德](#idx-e534)。1356年[第二次阿索战争](#idx-e274)后，四公爵于[米德可尔](#idx-e530)会晤宣布脱离[阿布丹提亚](#idx-e468)独立。国土约二百五十万平方[陆里](#idx-e392)，散布于七十八座岛屿，人口约九百八十万。联邦以商贸与金融立国，外交奉行离岸平衡，热带群岛旅游业亦非常发达。\"},{\"id\":\"e520\",\"title\":\"阿卡帕尼\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)四公国之一，由同名公爵世袭领有，核心领地为[阿卡帕尼岛](#idx-e521)，首府[伊索拉韦尔德](#idx-e534)亦为联邦首都。\"},{\"id\":\"e521\",\"title\":\"阿卡帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)群岛南部主岛区的核心岛屿之一，与[梅尔帕尼岛](#idx-e528)合计聚居全联邦逾半人口。\"},{\"id\":\"e522\",\"title\":\"北部特别贸易区\",\"aliases\":[\"特贸区\",\"北部特贸区\"],\"body\":\"[卡帕尼联邦](#idx-e519)于1382年于群岛北部岛链设立的特别经济区，由五十八座岛屿及[泽卡](#idx-e535)、[法纳莱](#idx-e524)等[自由港](#idx-e349)城组成，包含联邦最大城市[波托马利](#idx-e523)。特贸区适用独立的[特区商法典](#idx-e250)与优惠贸易税率，设[管理局](#idx-e236)与[仲裁所](#idx-e264)自治，是大陆各国商人自由开展贸易的核心地带，也是联邦金融机构最密集之处。\"},{\"id\":\"e523\",\"title\":\"波托马利\",\"aliases\":[],\"body\":\"[卡帕尼联邦](#idx-e519)最大城市，位于[北部特贸区](#idx-e522)、[翡翠海峡](#idx-e424)中央，是全大陆南北贸易的关键枢纽与海运门户。\"},{\"id\":\"e524\",\"title\":\"法纳莱\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)[北部特别贸易区](#idx-e522)的[自由港](#idx-e349)城之一，位于[翡翠海峡](#idx-e424)南缘的北部岛链。\"},{\"id\":\"e528\",\"title\":\"梅尔帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)群岛南部主岛区的核心岛屿之一，与[阿卡帕尼岛](#idx-e521)合计聚居全联邦逾半人口。\"},{\"id\":\"e530\",\"title\":\"米德可尔\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)境内地名。1356年[第二次阿索战争](#idx-e274)后，卡帕尼四公爵于此会晤宣布建立诸公联合，是联邦独立的历史象征地点。\"},{\"id\":\"e534\",\"title\":\"伊索拉韦尔德\",\"aliases\":[\"伊索拉\"],\"body\":\"[卡帕尼诸公联合](#idx-e519)首都，通称伊索拉，同时是[阿卡帕尼](#idx-e520)公国首府，四公国的政治核心所在地。当地作坊以镀银工艺见长，[索利亚商会](#idx-e343)创办于此。\"},{\"id\":\"e535\",\"title\":\"泽卡\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e519)[北部特别贸易区](#idx-e522)的[自由港](#idx-e349)城之一，位于[翡翠海峡](#idx-e424)南缘的北部岛链。\"},{\"id\":\"e536\",\"title\":\"尼希尔伊玛目酋邦\",\"aliases\":[\"尼希尔\",\"尼希尔酋邦\"],\"body\":\"通称尼希尔酋邦，位于大陆西北角沙漠绿洲与两河流域的神权部落联邦国家，首都[阿尔努尔](#idx-e537)。五世纪[萨阿尔血王朝](#idx-e558)覆灭后，诸部酋长于阿尔努尔会盟，推举诸神大祭司为[伊玛目教长](#idx-e204)，成立酋邦。尼希尔国土五百八十万平方[陆里](#idx-e392)，由[诸神圣土](#idx-e207)与八部落领地构成，人口约一千八百万。酋邦是当今大陆唯一合法保有奴隶制的国家，社会等级高度固化。\"},{\"id\":\"e537\",\"title\":\"阿尔努尔\",\"aliases\":[],\"body\":\"[尼希尔伊玛目酋邦](#idx-e536)首都兼伊玛目城，位于两河流域核心地带，属[教长](#idx-e204)直辖的[诸神圣土](#idx-e207)。422年诸部酋长于此会盟建立部落联邦体制、推举首任伊玛目教长；城中六神各有神庙，另有教长主持全酋邦最隆重仪典的[大神庙](#idx-e190)，[酋长会议](#idx-e244)亦每年在此召开。\"},{\"id\":\"e538\",\"title\":\"哈亚特河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e536)两河之东河，发源于[冠脊山脉](#idx-e427)[雪源脉](#idx-e439)北麓的积雪融水，自南向北流经酋邦西部，于[塔巴特](#idx-e542)与[纳赫尔河](#idx-e539)交汇后入[凛冰洋](#idx-e432)。其洪汛带来上游冲积土并补充土壤水分，随洪水消退而展开的播种是全酋邦农业的年度起点。\"},{\"id\":\"e539\",\"title\":\"纳赫尔河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e536)两河之西河，发源于[索拉瑞斯](#idx-e441)境内的[镜心湖](#idx-e448)，自南向北流经酋邦西部，于[塔巴特](#idx-e542)与[哈亚特河](#idx-e538)交汇。因源头在索拉瑞斯境内，[诸神信仰](#idx-e196)第一季的西祭典历来只能在靠近南边境的城市勉强举行，这也是尼索边境关系长期恶劣的原因之一。\"},{\"id\":\"e540\",\"title\":\"沙阿万大魔矿\",\"aliases\":[\"大魔矿\"],\"body\":\"位于[尼希尔](#idx-e536)东部沙阿万沙漠地下，全大陆最大的单一[魔矿](#idx-e74)产地，年产量占大陆总量逾半，[高品级魔矿](#idx-e68)更占大陆产出八成以上，几乎构成事实垄断。矿井多由[神遴者](#idx-e417)以[秘术](#idx-e4)开凿，此后的采掘、支护、排水与转运则由奴隶以常规工具承担。各国对尼希尔的结构性经济依赖即根源于此。\"},{\"id\":\"e541\",\"title\":\"沙阿万大沙漠\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e536)东部广袤沙漠，是大陆最严酷的干旱地带，地表资源匮乏，昼夜温差可超三十[星度](#idx-e400)，仅有[冠脊山脉](#idx-e427)[背雨脉](#idx-e419)北麓发源的两条小型沙漠河流维系着若干绿洲；地下则蕴藏[沙阿万大魔矿](#idx-e540)。\"},{\"id\":\"e542\",\"title\":\"塔巴特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e536)西部[纳赫尔河](#idx-e539)与[哈亚特河](#idx-e538)的交汇处，是两河流域的重要节点，两河在此汇合后继续北行入[凛冰洋](#idx-e432)。\"},{\"id\":\"e543\",\"title\":\"希尔文诺\",\"aliases\":[],\"body\":\"大陆精灵族裔及其文明与家园的统称，位于[冠脊山脉](#idx-e427)间的封闭盆地，由二十余个[氏族](#idx-e216)部落构成，最大聚落为[大圣树](#idx-e219)所在的[希尔文尼亚](#idx-e546)。其实际控制面积以大森林为界约一百二十万平方[陆里](#idx-e392)，人口一般认为不超过一百万。制度植根于大圣树信仰，每三十年召开[万叶庭](#idx-e218)全体表决，[叶络枢机院](#idx-e221)理日常行政与对外事务。1132年与人类首次接触，此后长期保持中立与封闭，被各国视为大陆事务的天然缓冲区与仲裁者。\"},{\"id\":\"e544\",\"title\":\"葛林沃尔克\",\"aliases\":[],\"body\":\"大陆东北角地区，由南北两支山脉夹峙高山密林构成，北部为雪原冰川。是大陆地理信息最匮乏的区域，据传其可能存在智慧种族与独立的[魔法](#idx-e3)体系，但学界均无可靠资料。\"},{\"id\":\"e545\",\"title\":\"卡里司泰\",\"aliases\":[],\"body\":\"[冠脊山脉](#idx-e427)[屏林脉](#idx-e435)西南端、[希尔文诺](#idx-e543)与[忒奥西斯](#idx-e499)边境处的城市，位于[林缘议厅](#idx-e281)以东不远，是全大陆唯一的[自由城市](#idx-e266)。行政上不受任何人类政权管辖，由各国贸易机构负责人与希尔文诺精灵特别代表组成的[城务会](#idx-e227)共同治理，须保持完全去武装化且不具外交主体地位。职能集中于贸易运输与货物仓储，亦是大陆学者旅居考察、各方非正式接触之所，更是多数[落叶精灵](#idx-e416)进入人类社会的第一站；[艾瑟瑞姆](#idx-e510)[王家研究院](#idx-e254)在此设有特别研究所。\"},{\"id\":\"e546\",\"title\":\"希尔文尼亚\",\"aliases\":[],\"body\":\"[希尔文诺大圣树](#idx-e219)所在之地，精灵族规模最大的聚居点，[万叶庭](#idx-e218)与[叶络枢机院](#idx-e221)所在。据推测是大陆最优越的[元素丰地](#idx-e55)之一。\"},{\"id\":\"e547\",\"title\":\"希尔文诺大森林\",\"aliases\":[],\"body\":\"精灵族世代定居之地，坐落于[冠脊山脉](#idx-e427)背雨、屏林、青嶂三脉合围而成的山间盆地，是大陆封闭程度最高的区域之一，实际控制面积约一百二十万平方[陆里](#idx-e392)。三脉合围造就封闭湿润的气候，孕育大量大陆其他地区所没有的特有动植物；盆地开口朝向东南，[屏林脉](#idx-e435)西南端的天然隘口是[林缘议厅](#idx-e281)所在地。\"},{\"id\":\"e551\",\"title\":\"冠阳\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之首，[星空学派](#idx-e7)完整名\\\"主序·冠阳\\\"，即太阳。[源星](#idx-e59)属权威、创造与审判；[正教](#idx-e150)神学中象征[唯一神](#idx-e138)，对应[仪式历](#idx-e366)[圣神日](#idx-e363)与[通用历](#idx-e373)日曜日。\"},{\"id\":\"e552\",\"title\":\"烬铸星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"熔炉·烬铸星\\\"。[源星](#idx-e59)属转化、破坏与锻造，常被视为天球之上的锻造炉象征；[正教](#idx-e150)神学上象征[圣约瑟](#idx-e127)，对应[烬曜日](#idx-e356)。\"},{\"id\":\"e558\",\"title\":\"萨阿尔血王朝\",\"aliases\":[],\"body\":\"古代[尼希尔](#idx-e536)地区存在的政权，由掌握[秘术](#idx-e4)的萨阿尔部落于[大陆历](#idx-e351)元前二世纪建立。该部自[沙阿万大沙漠](#idx-e541)西侵，用八年统一西尼希尔诸部，王朝延续至五世纪。其以自身信仰强行替代西尼希尔原有神话体系，奠定了尼希尔日后的[诸神信仰](#idx-e196)与政教结构。史籍普遍估算，王朝治下因屠杀或献祭而死者逾四百万。该王朝在五世纪大起义中覆灭，但其制度主体却被422年的[阿尔努尔](#idx-e537)会盟所承袭。\"},{\"id\":\"e560\",\"title\":\"索拉尔王国\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e441)的前身，于西诺拉尼亚[黑暗时代](#idx-e278)中崛起的王国。1159年，索拉尔国王[阿利昂](#idx-e240)统一西大陆诸国、受牧首册封为首位[龙裔凯撒](#idx-e239)，索拉瑞斯帝国由此建立。现代通用度量衡的长度单位[步米](#idx-e383)与[陆里](#idx-e392)即源自索拉尔王国的[军团](#idx-e299)行军传统。\"},{\"id\":\"e563\",\"title\":\"汐月\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"银杯·汐月\\\"，即月亮。[源星](#idx-e59)属容纳、精神与教导；[正教](#idx-e150)神学上象征[圣约翰](#idx-e126)，对应[月曜日](#idx-e381)。[艾瑟瑞姆](#idx-e510)[星历](#idx-e376)即以其盈亏循环为月。\"},{\"id\":\"e567\",\"title\":\"织虹星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"脉生·织虹星\\\"。[源星](#idx-e59)属修复、治疗与幻象；[正教](#idx-e150)神学上象征[圣保罗](#idx-e122)，对应[虹曜日](#idx-e353)。\"},{\"id\":\"e568\",\"title\":\"仲裁星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"律令·仲裁星\\\"，是星空中最亮且运动最明显的三颗星体之一。[源星](#idx-e59)属秩序、守护与契约；[正教](#idx-e150)神学上象征[圣伊琳娜](#idx-e125)，对应[裁曜日](#idx-e350)。\"}]}}]}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/Nurania/next/static/chunks/ff1a16fafef87110.js\",\"/Nurania/next/static/chunks/0bd6498bda341889.js\"],\"IconMark\"]\nc:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"布兰顿战役 | The Battle of Branton\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"布兰顿战役（The Battle of Branton）是第三次阿索战争前期的第一场重要会战，发生于大陆历 1479 年炎阳季46日至金素季5日，历时约十天，战场位于西比尔平原东南缘的布兰顿河中下游两岸。阿布丹提亚帝国投入前线战斗人员约三十…\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"布兰顿战役 | The Battle of Branton\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"布兰顿战役（The Battle of Branton）是第三次阿索战争前期的第一场重要会战，发生于大陆历 1479 年炎阳季46日至金素季5日，历时约十天，战场位于西比尔平原东南缘的布兰顿河中下游两岸。阿布丹提亚帝国投入前线战斗人员约三十…\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:image\",\"content\":\"https://finzhang.space/Nurania/compendium/book_cover.webp\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:type\",\"content\":\"article\"}],[\"$\",\"meta\",\"6\",{\"name\
