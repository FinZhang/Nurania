en\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$2\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],\"$L11\"]}],false]],\"m\":\"$undefined\",\"G\":[\"$12\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"11:[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]\n"])</script><script>self.__next_f.push([1,"13:I[53360,[\"/Nurania/next/static/chunks/409fa6e7eed2c119.js\",\"/Nurania/next/static/chunks/b77339cc29226d86.js\",\"/Nurania/next/static/chunks/747ad6c054a5245b.js\",\"/Nurania/next/static/chunks/e9371c2148cd7f21.js\"],\"default\"]\n14:T6e2d,"])</script><script>self.__next_f.push([1,"\n进入[圣领](#idx-e489)已经一季有余，这阵子让笔者印象最深的是，在这片土地上人们的时间是和信仰紧紧绑定在一起的。每五日，礼拜的钟声便把市集与农事叫停一次；年季的名称是[垂恩](#idx-e362)和[神焰](#idx-e379)，不是清和和炎阳；问起今天是哪一天，得到的回答常常是\"离某个节庆还有几日\"。在圣领，历法不只是记事的工具，也是宗教渗入日常生活的最好例子。\n\n笔者没有宗教信仰，这一点在此处预先说明，提请读者注意。[唯一神信仰](#idx-e139)的纲要，笔者在其他几篇有关大陆宗教的文章里已经写过，而且写得尽量公正客观；本篇收录的是则是纲要之外的细目：死后去处的等第、一生的功课、审对[神启魔法](#idx-e5)的垄断、同一部[圣典](#idx-e135)的两种读法，诸如此类，供有兴趣的读者与其他宗教文章对照参阅。\n\n### 一、借据\n\n[正教](#idx-e150)的全部神学，笔者以为可以压缩成《创世录》里的一句话。神把智性与[元素亲和力](#idx-e58)分给活物中最蒙昧软弱的人类时，说：“这力是我借给你们的，不是赐给你们的。”圣典接着写道：“这是神与人立约的起头，也是人负债的起头。”借予，而非赐予，一字之差，其余的一切——[宿债](#idx-e134)、[称义](#idx-e103)、[告解](#idx-e109)、审判——都不过是这张借据的利息条款。《弥赛亚记》把债务人的范围划得很宽：凡受权柄之惠的，“或是亲手行了，或是因人所行的得了益处，都是欠我债的”，都生来就背了这债。换句话说，没有人能置身账外，你不必会神启魔法，只要你活在一个有神启魔法的世界里。可想而知，这套说辞里对[星术](#idx-e8)使用者也同样适用，并不因为他们不用神启魔法而免债。\n\n教义里的债务面前人人平等，清偿之后的待遇却分等第。寻常信徒称义而死，得入[冥界](#idx-e117)安息，静候轮回；[从圣徒](#idx-e105)们则不必等，在冥界之门由[次级天使](#idx-e104)直接引渡，径入[天界](#idx-e136)；巨龙更进一层，死后灵魂直升天界，且可随己意选择转生现世，或长留不返。巨龙为何独享上宾之遇的理由被写在《创世录》第七章里：巨龙是神以自身一滴血所造的直系血脉，“它们的力本出于神，不用借，也不欠债”。一套以债立教的神学里，唯一生来无债的，是债主的血亲。这个安排，[卡帕尼](#idx-e508)的银行家们想必不会觉得陌生。\n\n### 二、功课\n\n信徒在神学意义上的一生始于一场[圣事](#idx-e124)：[洗礼](#idx-e140)。这是入教的仪式，也象征着信徒一生称义的开始。此后他/她的日子由两件功课填满——礼拜日的[弥撒](#idx-e116)与每日的[日课](#idx-e120)。它们不算圣事，却是称义最重要的日常载体。教会为[坚振](#idx-e113)设了两条资格，或是对教会有重大贡献，如消灭[异端](#idx-e147)或罪人、显现神迹；或是持守信仰足够长久，寻常信徒自入教起一般须满三十年，年限正以持续的弥撒与日课来计。婚姻和洗礼一样，一生一次，缔结后不可解除，除非[大牧首](#idx-e152)本人宣告其无效，而这件事的难度几近一次[大赦](#idx-e106)。“不可离婚”在教规里列在轻规范一类，与斋戒、饮食之禁和圣事中的行止规范同属一档，违者惩处较轻、较易赦免。需要指出的是，这里的轻指的是罪的分量，而非规范本身的松紧，被不幸的婚姻枷锁束缚一生的信徒大有人在。与之相对的，违反圣典所列的[十二诫命](#idx-e128)则会被视为难被赦免的重罪，这十二条分属\"谨\"\"智\"\"爱\"三目：谨管着神启魔法的行使；智崇尚诚实、谦逊、勤劳与明辨是非；爱训人相亲、待人如己。\n\n如开篇所言，唯一神信仰中最深入普通信徒生活的是历法。[圣格里仪式历](#idx-e366)的六季各有仪名：[晖醒](#idx-e361)、垂恩、神焰、[圣献](#idx-e355)、[肃省](#idx-e371)、[正炼](#idx-e358)，季首落在[通用历](#idx-e373)每季14日，各有一场规模略大于每周弥撒的[季首弥撒](#idx-e112)。各个节庆则系于圣徒纪念与教义节点。晖醒季首日的[降临节](#idx-e354)纪念[唯一神](#idx-e138)降临传道，是宗教意义上的新年，也是全年最大的节日；四日后的[灵诞节](#idx-e359)纪念神传道毕、重返天界，信徒自降临节起连续五日日课礼拜，是全年最长的休息日——休息的方式是连日礼拜，想必这在教会观念里并不算悖论。[升天节](#idx-e368)纪念[圣约翰](#idx-e126)殉道，《约翰福音》载他被钉[十字架](#idx-e130)后仍讲道一昼夜，午夜前一刻辞世，直升天界。神焰季里有两个日子分属[圣伊琳娜](#idx-e125)与[圣约瑟](#idx-e127)——圣典载二圣为夫妻，这两日遂被恋人与夫妻视为爱情之节，是[礼仪年](#idx-e115)里难得的温柔部分。岁末的[立约节](#idx-e357)纪念圣约瑟在大地上首施神启魔法、\"借予\"之约显明于世，因挨着通用历新年，常连着一起庆祝。九大节庆里只有一个例外：纪念[圣保罗](#idx-e122)[以太](#idx-e19)神迹的[祝星节](#idx-e382)仅[公教](#idx-e110)庆祝，[牧首厅](#idx-e170)视任何公开庆祝为宣扬异端之举——历法也是有前线的。\n\n这套安排的效力，笔者以为胜过任何一册教理问答。一个信徒未必识字，也不一定有机会通读圣典，但他的一生被弥撒贯穿，他的婚丧由[司祭](#idx-e180)主持；他的年岁被礼仪季分割，他的假日就是礼拜之日。历法替他把圣典过了一遍又一遍，年复一年。信仰长在肌肉里，比长在书里牢靠得多。\n\n### 三、垄断\n\n[正教会](#idx-e185)对神启魔法的垄断靠的是两套系统。一套是文化影响，一套是[审判庭](#idx-e175)控制。\n\n文化影响的作用是软性的。在一个几乎人人自幼受洗的社会里，一个孩子意识到自己有祷言天赋时，第一个念头不是他能用[魔法](#idx-e3)做什么，而是他该向哪位司祭坦白。教会在相当长的历史时期里（包括现在）鼓励信众互相检举违规施法的行为，但说到底，最好的看守长在人心里。\n\n另一方面，审判庭控制则为垄断带来了强制性保障。神启魔法的释放会在[元素](#idx-e54)界面留下可观测的元素[疏化](#idx-e39)痕迹，受过训练的[审判官](#idx-e173)检测局部元素流密度的异常，便能定位施法地点和类型，进而追溯[施法者](#idx-e38)。大陆上诸般违禁的行当里，很少有哪一种像未经许可的祷言这样，自带一份写给追捕者的证据。审判庭的手也不止于圣领国境：凡正教信众繁盛之地，皆设有审判庭分支，[索拉瑞斯](#idx-e434)境内的分部规模最大、运转最成熟——按两国协议，审判庭在帝国境内开展宗教事务仅负知会之义务，无需许可。这一安排在历史上几乎没有产生过摩擦，毕竟在管束神启魔法这件事上，[凯撒](#idx-e239)与大牧首从来站在同一侧。过去两个世纪以来，审判庭的量刑已整体趋向温和：过去处死是常见结果，后来则多以监禁、劳役与肉体惩罚代之，极刑只留给情节极重的屡犯。然而[第三次阿索战争](#idx-e275)后这一温和化进程戛然而止，圣领境内的祷言管控也骤然收紧。其名义上是为了对抗[公教会](#idx-e159)渗透，但从笔者这一季的所见所闻来看，恐怕也有集中管制魔法力量，为将来的第四次大陆战争做准备的意图在。\n\n除了这两套系统外，正教会的垄断同样也受益于它成熟的祷言人才体系。大陆各地出众的神启魔法天赋者，往往会被教会以各种方式招募延揽；这些人未必披上法衣成为神职，但涉及魔法事务时，立场大抵不会离教会太远，优质触媒的垄断供给在其中是现成的杠杆（详见笔者关于[魔法矿石](#idx-e74)的专题手记）。学界还有说法认为，[圣约瑟商会](#idx-e340)遍布各国口岸的分部实际上也兼为审判庭的耳目，而圣领官方对此自然是完全否认。两方说法笔者都照录于此，取舍随读者。\n\n回顾历史，依靠这两套系统的垄断效果卓著。唯一神信仰史上诞生过的教派粗略估计不下百数，其中主张神启魔法可自由或较自由使用的，几乎无一例外都以异端之名被剿灭。对神启魔法的控制实际构成了正教教义的一条主轴——这个判断笔者先前已经下过，此处只想再补一句让步——这一垄断在客观上确实对大陆的元素环境起到了保护作用，使疏化与枯竭不至蔓延。批评教会把持知识与权力的世俗学者（包括笔者在内），大多绕不开这个注脚。\n\n### 四、归还\n\n审判庭的量刑权在历史上延伸至一种极为独特的极刑：将受刑者流送入[诺万尼斯平原](#idx-e433)——[大陆历](#idx-e351)758年大叛乱中永久枯竭的死地。执行方式非常简单直接：受刑者被押送至禁区深处留置，行刑者退至安全距离驻守，直至受刑者死亡。进入元素极度匮乏之地的生命体会经历完整的生理应激，从胸闷眩晕，意识涣散到肌肉失控，终至脏器衰竭，少则数个时辰，多则一整日。漫长的死亡过程被视为刑罚的一部分，受刑者无力缩短这个过程，行刑者也不会介入。\n\n现在有两个政体维持着这一刑罚：索拉瑞斯与圣领。帝国军法用它处置叛国者与战争罪犯，逻辑是军事化的，最严酷的死亡占着最明确的威慑位置。圣领的论证则是神学上的，诺万尼斯的枯竭被教会解释为唯一神对滥用神启魔法的惩罚，是神意具象化的历史遗迹；将生命送入其中，便是向那片被剥夺的土地\"归还元素\"，是罪人代全人类向神赎罪的献祭。\n\n公教会在独立后不久便正式废除了[诺万尼斯流放](#idx-e171)，理由兼具人道与神学：将漫长的死亡神圣化为献祭，是对唯一神之名的滥用；以受刑者的痛苦充填神学叙事，更是把神意曲解成残忍的工具。两个世纪以来，这一分歧一直是两教会互相攻讦最惯用的论据之一。\n\n一个笔者觉得很有趣的解读是，流放实际上是神与人那张借据的另一种清偿方式。力量既是借来的，生命便是现成的抵押，即已无力偿还“宿债”，那么债主便收走抵押之物，所以才叫做“归还”——教会能把这样一件事说得如此通顺，这套话术给笔者留下的印象，比审判庭的刑罚本身还深。\n\n### 五、分裂\n\n提起唯一神信仰，就不得不同时提到正教会与公教会。两个教会之间的分歧，有一部分已在其他宗教文章和上几节提过，这一节则进一步展开。\n\n公教会诞生的契机是[第一次阿索战争](#idx-e276)（1290–1292）。圣领以索拉瑞斯盟友的身份直接参战，在[阿布丹提亚](#idx-e458)境内的教会组织中激起了严重的不满。一个教义上宣称超越世俗政治的教会，以再明确不过的姿态站进了交战的一方。当时的阿布丹提亚正值与[艾瑟瑞姆](#idx-e500)技术交流的推进期，试图引入星术对抗索拉瑞斯，帝国境内的改革派由此生出一桩神学忧虑：若教义继续把星空魔法搁在宗教合法性的模糊地带，认知的裂缝迟早会在信众一层撕开。因此，改革派试图将星术纳入教义，而他们的提议在神学上并非无据。《保罗福音》记他四元素耗尽时“举目望天球；天上的以太竟应他而动”，这是明明白白地写在圣典里的。将星术定性为唯一神权柄的另一种显现，既为技术正名，同时也能为圣领的政治中立提供背书。然而这个方案最终在牧首厅遭到封杀，除了索拉瑞斯施加的政治压力外，牧首厅显然也有自己的利益考量——星术合法化动摇的，正是教会依托神启魔法垄断的权力合法性和权威架构。1295年，[第二次宗教改革](#idx-e154)以破产告终，阿布丹提亚境内的正教会宣布独立，公教会就此诞生。\n\n公教会独立带走了大部分教义，但没有带走审判庭。这既有历史原因——脱离牧首厅时本就无从移植执法机构——也有神学上的内在一致：一个把两种魔法都归于神权的教会，以严刑峻法管控其中一种，本来在逻辑上就站不住脚。独立后，公教会对使用神启魔法的行为警示依旧，但出发点更多是防疏化枯竭的现实考量，而非渎神的神学追责。阿布丹提亚境内轻微的祷言施法若被发现，公教会通常以劝导代惩处，严重的疏化征兆则交由世俗机构以破坏元素环境为由介入。这一务实的管控政策，也意味着其约束力远弱于正教，考虑到阿布丹提亚的神启人才本就因触媒技术差距和人才体系不断流向圣领，公教会事实上是在用一副宽松的缰绳，管一群所剩不多的马。\n\n最后录一桩与政治无关的闲笔。公教尊圣保罗为第二先知，而《保罗福音》关于他的去处是这么写的：“他的身体却没有人知道葬在哪里。”[朝圣](#idx-e102)是要有地址的：[圣城索菲亚](#idx-e493)有神降临的传说，[潘克拉托](#idx-e491)存着圣约翰的[圣骸](#idx-e123)，于是两地的朝圣者络绎不绝。保罗却什么也没留下，圣典里记他一路向极西走进群山，在一片\"平静如镜，映着天球的星辰\"的大水旁殉道，水的北边有河往旷野流去。学界普遍认为这片大水指的是[镜心湖](#idx-e441)—正教会显然也是这么想的，所以[雷克西姆](#idx-e446)才建了那座大教堂。但它深在索拉瑞斯腹地，正教信仰最浓的土地中央。公教的第二先知殉道之处，竟没有一寸属于奉他为先知的教会。这层错位，可谓是自称“诺拉尼亚正信”的唯一神信仰最大的讽刺之一。  \n\n---\n\n入圣领以来，笔者的行程大部分时间不在官道上，落脚也多在东境南境的村镇之间。这些村子，与正教会向大陆宣讲的人间圣土相去很远：屋舍稀疏，田里长草的比长庄稼的多。听闻运河一线的大城市依旧是繁华的景象，但限于一些不便言说的原因，笔者和同行者也难以去亲眼验证。\n\n《创世录》里说，“这力是我借给你们的，不是赐给你们的。”正巧，前阵日子笔者在一个过路村子里见到了一伙盗匪，也见到了一次援手——那援手用的正是神“借给”人的力，行的正是“爱”的诫命。只是这援手未经许可，在这片土地的律法里无处容身。圣典把“谨”与“爱”并列为诫，却没说两条撞在一起时该怎么做。是不能还是不想，笔者无从得知。\n\n**塞勒内斯 于大陆历1505年三（炎阳）季35日 忒奥西斯东部某地**\n\n**Selenus 1505.III.35 In Eastern Theosis**\n\n### 附录一 宗教节日历表\n\n圣格里仪式历的各季首日均落在通用历每季14日（仪式历岁首为唯一神传教义于圣约翰之日，即通用历启蛰季14日）。六季首日各有一场规模略大于每周弥撒的季首弥撒，配合当季主题举行集体仪式；重大节庆则系于圣徒纪念与教义节点，历期与来历如下表。\n\n| 节庆    | 仪式历    | 通用历    | 纪念内容与仪俗                                                  |\n| ----- | ------ | ------ | -------------------------------------------------------- |\n| 降临节   | 晖醒季1日  | 启蛰季14日 | 唯一神降临大地、初传教义于约翰；宗教意义上的新年，全年最大的宗教节日                       |\n| 灵诞节   | 晖醒季5日  | 启蛰季18日 | 神传道四日后重返天界，象征人类领受教诲、智性之灵诞生；信徒自降临节至灵诞节五日间持续日课礼拜，是全年最长的休息日 |\n| [显圣节](#idx-e375)   | 垂恩季12日 | 清和季25日 | 约翰受神圣诏、建立[现界](#idx-e141)第一个教会——\"从此，你要叫世人都称颂我的名\"                       |\n| 升天节   | 垂恩季47日 | 炎阳季10日 | 约翰殉道之日，《约翰福音》载其被钉十字架讲道一昼夜、午夜前一刻辞世直升天界；一般视为神焰季诸节的一部分      |\n| [圣伊琳娜节](#idx-e369) | 神焰季15日 | 炎阳季28日 | 伊琳娜殉道之日；与[圣约瑟节](#idx-e370)同被恋人与夫妻视为爱情之节                               |\n| 圣约瑟节  | 神焰季36日 | 炎阳季49日 | 约瑟殉道之日；圣典载二圣为夫妻、婚姻受神祝福，神职人员主持婚礼即含对二圣的追念                  |\n| [圣保罗节](#idx-e365)  | 肃省季21日 | 霜序季34日 | 保罗殉道之日；公教会庆祝仪式相较正教会隆重                                    |\n| 祝星节   | 肃省季45日 | 凛寒季8日  | 保罗于四元素耗尽时借以太显现神迹；产生于大分裂之后，仅公教庆祝，牧首厅视任何公开庆祝为宣扬公教教义的异端之举   |\n| 立约节   | 正炼季36日 | 凛寒季49日 | 约瑟在大地上首次施展神启魔法，人与神\"借予\"之约显明于世；因与通用历新年相邻，常连同庆祝             |\n\n除祝星节外，上述节庆正教与公教同时庆祝，仪式内容多有区别，此处不再赘述。\n\n### 附录二 索菲亚圣典（节选）\n\n#### 创世录\n\n##### 第一章\n\n1 起初，天界之外，尽都是虚；虚充满各处，黑暗笼罩，别无一物。 2 神从太初就有，住在天界；神的目光运行在混沌之上。 3 神说：\"要有地。\"神就从虚中分出地元素，聚成土壤，铺成大地；神看着是好的。 4 神说：\"要有水。\"神从虚中分出水元素，注成江海，引成河湖；神看着是好的。 5 神说：\"要有风。\"神从虚中分出风元素，展成天空，充满大气；神看着是好的。 6 神说：\"要有火。\"神从虚中分出火元素，万物就都动起来：山岭隆起，谷壑裂开，云气聚拢，大雨降下；神看着是好的。\n\n7 神又说：\"要有以太。\"神从虚中分出第五元素，铺张为天球，包裹全地。 8 神在天球之内安置日月与众星，派大的管昼、小的管夜，定它们运行的道路与时候；神看着是好的。 9 于是天球在上，大地在下，江海行在其间：这是头一次的分开。\n\n10 神说：\"地要生出活物来。\"于是草木生在土里，鱼虫游在水中，飞鸟走兽各从其类，遍满大地；神看着是好的。这一切，神称为现界。 11 神又在现界之下开辟冥界，作众生死后安歇的地方，和转生回来的门径。 12 神看着一切所造的都甚好。\n\n13 末了神造人。人却是活物中最蒙昧、最软弱的：没有草木的深根，没有走兽的厚皮和利爪，赤身站在严寒饥饿之中，不能自存。 14 神怜悯他们，说：\"我要把我权柄的一份，分给我的儿女。\" 15 神就把智性分给人，叫人能思想、能记忆、能编织[术式](#idx-e40)；又把亲和之力分给人，叫人能觉察大地间的四元素，驱使它们。 16 神对人说：\"这力是我借给你们的，不是赐给你们的。你们要照我的教诲用它，不可僭越。\" 17 这是神与人立约的起头，也是人负债的起头。\n\n##### 第二章\n\n1 那时人虽有了权柄，却不知道怎样使用；神就亲自降临现界，行走在大地上。 2 神的形象无人能描述；祂向各人显现，都照那人心里最尊崇的样式，所以众人所见的各不相同。 3 有见祂是老者的，有见祂是妇人的，其实都是同一位神。\n\n4 神行走四日，把教诲传给跟随祂的人；祂拣选了约翰、伊琳娜、约瑟、保罗四个人随行，把前四日的教化分别交托他们。 5 到第五日，神说：\"我在地上的工成了，教诲已经交托我的仆人。\"说了这话，就升回天界。 6 从此定第五日为人向神礼拜的日子；神所拣选的四人，后世称为四[使徒](#idx-e129)。\n\n##### 第七章\n\n22 当神造活物的时候，曾取自己的一滴血，造了世上最初的智慧之族，就是巨龙。 23 巨龙是神直系的血脉，生来就承受神的权柄；它们的力本出于神，不用借，也不欠债。 24 所以凡与龙立契、行龙之法术的，不算僭越，也不算负债：这是神所喜悦的。\n\n*笔者注：此第七章成文于大陆历760年，正教会第四次[都主教](#idx-e156)会议召开前后。牧首厅宣布大天使[盖昂](#idx-e108)在诺万尼斯[元素枯竭](#idx-e56)事件后降临于圣城索菲亚，传达神意，《创世录》遂新添一章。诺万尼斯流放之刑于同年建立，后被索拉瑞斯借鉴成为帝国极刑之一。*\n\n#### 弥赛亚记\n\n##### 第三章\n\n1 神在世的日子，拣选约翰，称他作先知，又立他作弥赛亚，把深奥的教诲交托给他。 2 神对约翰说：\"你要听，也要叫世人听见。 3 凡受这权柄之惠的，或是亲手行了，或是因人所行的得了益处，都是欠我债的；这债是人生来就背负的，名叫宿债。 4 你们凭自己还不清这债。惟有信我、遵行我教诲的，我必免了他的债，这就称为义。 5 凡称了义的，死后必在冥界得安息，等候轮回的日子，重回现界。\n\n6 凡不信我的，他的宿债必变作[原罪](#idx-e149)。负原罪的，死后要被交给[虚界](#idx-e145)；在那里，他的知觉必被夺去，心神渐渐消磨，如受无尽的煎熬，末了魂魄破碎，归回于虚。 7 原罪是众罪里最重的。在它以下，有三样大罪： 8 头一样是不谨：凡不照我的教诲、妄用我所借之力的，就是不谨。 9 第二样是不智：凡轻慢智性、甘于愚昧、口是心非、骄傲固执的，就是不智。 10 第三样是不爱：凡违背我叫你们彼此相爱之诫的，就是不爱。 11 犯这三样大罪的，寻常的求赦赦不了他，惟有大赦才能免他。\n\n12 至于其余的罪，无论大小，你们若犯了，就当求赦免；凡认罪求赦的，我必不轻看。 13 那日你们各人都要站在冥界之门，在我使者面前受审判。 14 站立得住的，得享安息，等候新的轮回；站立不住的，就交给虚界。 15 所以你们当谨守我的话，如同谨守性命。\"\n\n#### 神言书\n\n##### 第二章\n\n9 神论到祂所借出的力，晓谕众人说： 10 \"这力不是你们自己的，乃是我的；我借给你们用，你们当存敬畏的心领受。 11 你们行这力，当先在我仆人的手下受教，学了才可行；不可任意妄为，也不可为私欲行它。 12 你们行这力，要为我的名，为护卫正信的人，为惩治罪人与悖逆的；这样行的，就是谨；不这样行的，就是不谨，是三样大罪的头一样。\n\n13 你们要听那警戒的话：凡在一处屡屡妄用这力的，那地的元素必渐渐稀薄，流出去不再回来。 14 用得越多，那地越枯；到了尽头，元素凝滞不动，那地就成了死地，活物不能存留——这是妄用我权柄的报应。 15 你们看见那枯竭之地，就当想起末后的日子，心里惧怕。 16 至于那日子几时来到，没有人知道，惟有神知道；所以要节制，要敬畏：宁可少用，不可滥用。\"\n\n#### 箴言集\n\n##### 第十五章\n\n1 敬畏神，是智慧的开端；认清自己的亏欠，是智慧的根基。 2 智慧人省察己过，如照镜自见其面；愚昧人遮掩己过，必不亨通。 3 诚实的口，为神所喜悦；虚谎的舌，为神所憎恶。 4 勤劳的手必得饱足，懒惰的人必受穷乏。 5 骄傲在败坏以先，谦卑在尊荣以前。 6 知足的人心里常乐，贪婪的人昼夜不安。\n\n7 你要孝敬父母，如同敬神；要爱邻舍，如同爱自己。 8 不可贪恋不属你的，不可夺取别人的；不可行奸淫，不可无故杀人。 9 义人虽死，他的名必存留；恶人虽活，他的路必灭没。 10 你手中若有余，就当分给缺乏的；你口中若有话，就当说诚实的。 11 这些不是难行的道，乃是近在你心里、你口里的；你若遵行，就必得福。\n\n#### 四福音\n\n##### 约翰福音 第十四章\n\n1 约翰既受了神的教诲，神向他显现，颁下圣诏说：\"从此，你要叫世人都称颂我的名。\" 2 约翰就在现界立起头一座教会，招聚信的人，把从神领受的教诲传给他们。 3 后来约翰为道受逼迫，被钉在十字架上；他在架上仍传讲神的道，一昼一夜口不停息，听见的人都稀奇。 4 到了午夜前一刻，约翰说：\"我在地上的事完成了。\"说了这话，气就断了；他的魂径直升入天界。\n\n##### 伊琳娜福音 第五章\n\n1 伊琳娜与约瑟结为夫妻，他们的婚姻蒙神祝福，作了世人相爱的榜样。 2 二人同行西诺拉尼亚，传扬神的道；所到之处，病人得医治，争讼得平息，立约的不再背约。 3 后来他们为道受逼迫。伊琳娜先殉道；临刑的时候，她脸上毫无惧色，倒像睡了的人一般安然。 4 凡看见她死的，都说：\"这真是个义人。\"\n\n##### 约瑟福音 第六章\n\n1 约瑟是头一个在大地上行神所借之力的人；他一伸手行这力，人与神\"借予\"的约就显明于世，世人从此都负了宿债。 2 约瑟走遍各城各乡，凡枯朽的，他使它更新；凡破损的，他使它复完。 3 伊琳娜殉道之后，约瑟也随她去了，死在同一条道路上。 4 二人先后而死，魂却同归天界，永不分离。\n\n##### 保罗福音 第十二章\n\n1 保罗走遍各地传道，行了许多神迹，困苦的人都来投奔他。 2 有一次，保罗为护卫信徒争战，四样的元素都耗尽了，再没有可用之力。 3 保罗就举目望天球；天上的以太竟应他而动，他便显出神迹，救了众人的性命。 4 保罗年老的时候，遭逢逼迫，就一路向极西去，走进群山之中。 5 他到了一片大水旁边；那水平静如镜，映着天球的星辰，水的北边有河往旷野流去。 6 追赶他的人在那里追上了他。保罗望着那水说：\"我在地上的路，到这里尽了。\" 7 他们就在水边害了他；他的魂升入天界，他的身体却没有人知道葬在哪里。\n\n#### 预言书\n\n##### 第九章\n\n1 神将末后的事指示约翰；约翰就把所见的异象写下来，说： 2 我看见那守望天球的使者[埃塞莉斯](#idx-e100)飞在空中，大声喊着说：\"天球裂开了！天球裂开了！\" 3 以太的天球从高天崩裂，虚界的虚如潮水涌进现界。 4 [虚潮](#idx-e144)所到之处，大地崩裂，山岳喷火，风雨大作；过去之后，只剩死地，没有活物存留，那地就归了虚界。\n\n5 我又看见唯一神带着四位[天使长](#idx-e137)再临现界，向天下万灵施行审判。 6 凡称义的，得进冥界躲避；不信的和犯罪的，留在现界，被虚潮吞灭。 7 那被吞灭的众异端，他们的力聚在一处，生出三只大兽：一名不谨，一名不智，一名不爱；三兽转身攻打冥界。 8 我又看见四位天使长率天使的军队从天界降下，众巨龙也随他们与三兽争战，昼夜不息：这就是[末日之战](#idx-e118)。\n\n9 三兽终必灭亡；冥界也被虚吞没，其中的生灵消亡大半，惟有少数蒙使者引渡，得进天界。 10 于是宇宙复归于虚，像太初一样。 11 我又看见神造新天新地；凡蒙庇于天界的，都被引进去，承受新的命运与福分。 12 这话是可信的，是真实的。看哪，末后的事必要成就。\n"])</script><script>self.__next_f.push([1,"a:[\"$\",\"$2\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"min-h-[60vh] flex items-center justify-center text-[var(--ink-muted)]\",\"c "诸国列志 Chorography of the Nations/希尔文诺\",\"title\":\"希尔文诺\",\"titleEn\":\"Sylvanor\",\"isArticle\":true},{\"slug\":\"诸国列志 Chorography of the Nations/葛林沃尔克\",\"title\":\"葛林沃尔克\",\"titleEn\":\"Grimvolk\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"行观别录 Notes from the Road\",\"title\":\"行观别录 Notes from the Road\",\"children\":[{\"slug\":\"行观别录 Notes from the Road/布兰顿战役\",\"title\":\"布兰顿战役\",\"titleEn\":\"The Battle of Branton\",\"isArticle\":true},{\"slug\":\"行观别录 Notes from the Road/当代经济考略\",\"title\":\"当代经济格局考略\",\"titleEn\":\"On the Economic Order of the Nurania\",\"isArticle\":true},{\"slug\":\"行观别录 Notes from the Road/魔法矿石\",\"title\":\"魔法矿石\",\"titleEn\":\"The Magic Ore\",\"isArticle\":true},{\"slug\":\"行观别录 Notes from the Road/唯一神信仰小考\",\"title\":\"唯一神信仰小考\",\"titleEn\":\"A Brief Study on the One God Faith\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"诸域纪闻 Chronicles of the Realms\",\"title\":\"诸域纪闻 Chronicles of the Realms\",\"children\":[{\"slug\":\"诸域纪闻 Chronicles of the Realms/沉默者\",\"title\":\"沉默者\",\"titleEn\":\"The Silent One\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/衡台\",\"title\":\"衡台\",\"titleEn\":\"The Weighing Scale\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/童年\",\"title\":\"童年\",\"titleEn\":\"Coming of Age·Childhood\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/在人间·上\",\"title\":\"在人间·上\",\"titleEn\":\"Coming of Age·In the Human World I\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/在人间·下\",\"title\":\"在人间·下\",\"titleEn\":\"Coming of Age·In the Human World II\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/送别\",\"title\":\"送别\",\"titleEn\":\"The Farewell\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/铸币的两面\",\"title\":\"铸币的两面\",\"titleEn\":\"Two Sides of a Nicat\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"索引 Index\",\"title\":\"索引\",\"titleEn\":\"Index\",\"isArticle\":true}],\"currentSlug\":\"行观别录 Notes from the Road/唯一神信仰小考\",\"article\":{\"slug\":\"行观别录 Notes from the Road/唯一神信仰小考\",\"title\":\"唯一神信仰小考\",\"titleEn\":\"A Brief Study on the One God Faith\",\"content\":\"$14\",\"indexTerms\":[{\"id\":\"e1\",\"title\":\"龙族魔法\",\"aliases\":[],\"body\":\"巨龙及龙族亚种所用的种族[魔法](#idx-e3)，学界归类为[神启魔法](#idx-e5)的一种。\"},{\"id\":\"e2\",\"title\":\"秘术式\",\"aliases\":[],\"body\":\"[尼希尔秘术](#idx-e4)施法所用的特殊仪式，将祭品[构成元素](#idx-e20)解离为[无属性元素流](#idx-e44)并转化为[魔法](#idx-e3)。\"},{\"id\":\"e3\",\"title\":\"魔法\",\"aliases\":[],\"body\":\"智慧种族通过特定条件调用[自然元素](#idx-e41)或[第五元素](#idx-e19)来施展的超自然力量，包含[祷言](#idx-e5)、[星术](#idx-e8)、[自然魔法](#idx-e9)和[秘术](#idx-e4)等种类。\"},{\"id\":\"e4\",\"title\":\"尼希尔秘术\",\"aliases\":[\"秘术\"],\"body\":\"[尼希尔](#idx-e523)统治阶级独有的[魔法](#idx-e3)体系，简称秘术，以等价交换为原理，解离祭品的[构成元素](#idx-e20)为力量。\"},{\"id\":\"e5\",\"title\":\"神启祷言\",\"aliases\":[\"祷言\",\"神启魔法\"],\"body\":\"[神启学派](#idx-e6)对自身[魔法](#idx-e3)的称呼，简称祷言；亦名神启魔法。狭义专指各类神启魔法对应的[术式](#idx-e40)。\"},{\"id\":\"e6\",\"title\":\"神启学派\",\"aliases\":[],\"body\":\"将[魔法](#idx-e3)解释为[唯一神](#idx-e138)所借权柄的学派，通过编织[术式](#idx-e40)调动环境中游离态的[四大元素](#idx-e41)来施展魔法。\"},{\"id\":\"e7\",\"title\":\"星空学派\",\"aliases\":[],\"body\":\"将[魔法](#idx-e3)解释为[第五元素](#idx-e19)显现与外化形式的学派，通过[内化](#idx-e32)以太于体内再[显化](#idx-e46)来施展魔法。\"},{\"id\":\"e8\",\"title\":\"以太星术\",\"aliases\":[\"星术\",\"星空魔法\"],\"body\":\"[星空学派](#idx-e7)对自身[魔法](#idx-e3)的称呼，简称星术；亦名星空魔法。狭义专指各类星空魔法对应的[大星轨](#idx-e18)走势。\"},{\"id\":\"e9\",\"title\":\"自然魔法\",\"aliases\":[\"精灵魔法\",\"圣树魔法\"],\"body\":\"精灵族与生俱来的法术能力，源自与[大圣树](#idx-e219)的契约连接；亦称精灵魔法、圣树魔法。\"},{\"id\":\"e10\",\"title\":\"奥韦纳尔·安柯伦坦\",\"aliases\":[\"安柯伦坦\"],\"body\":\"[艾瑟瑞姆](#idx-e500)[天星师](#idx-e251)，1304年提出智慧生物出生时的[大星轨](#idx-e18)图像决定其[仪式星轨](#idx-e51)特征，且该特征恰合[丝黛兰尔](#idx-e42)的[源星](#idx-e59)分类法，该分类法由此成为[星术](#idx-e8)学界公认标准。\"},{\"id\":\"e12\",\"title\":\"半龙化\",\"aliases\":[],\"body\":\"人类与巨龙缔结[血契](#idx-e50)后，其思维与立场不可逆地向龙族一侧偏移的现象。\"},{\"id\":\"e18\",\"title\":\"大星轨\",\"aliases\":[\"天道星轨\"],\"body\":\"[天星五政](#idx-e43)在天球上的轨迹，代表宇宙中[以太](#idx-e19)流的流向；亦称天道星轨。\"},{\"id\":\"e19\",\"title\":\"第五元素\",\"aliases\":[\"以太\"],\"body\":\"构成群星与其间空间（宇宙）的物质，通称以太，永恒不朽；稀薄存在于大地之上，[星空魔法](#idx-e8)师可将其蓄积体内，是星术的能量来源。\"},{\"id\":\"e20\",\"title\":\"构成元素\",\"aliases\":[],\"body\":\"构成实体事物的四大[自然元素](#idx-e41)，不响应[祷言](#idx-e5)[术式](#idx-e40)。通过[秘术式](#idx-e2)可将其解离。\"},{\"id\":\"e25\",\"title\":\"精神力\",\"aliases\":[],\"body\":\"编织[祷言](#idx-e5)[术式](#idx-e40)所凭的能力，可经后天训练提高，只能依靠时间缓慢恢复。\"},{\"id\":\"e27\",\"title\":\"洛林阶运\",\"aliases\":[],\"body\":\"特定工艺的[星轨蚀刻](#idx-e79)（如旧式的[三分耦式](#idx-e35)蚀刻法）所致的[玛娜](#idx-e28)自然向外部流出的矿界面层现象。\"},{\"id\":\"e28\",\"title\":\"玛娜\",\"aliases\":[\"魔力\"],\"body\":\"[星空学派](#idx-e7)语境下[内化](#idx-e32)后的[以太](#idx-e19)，即俗称的魔力；释放后无法自然恢复，须[星术](#idx-e8)师冥想缓慢补充。\"},{\"id\":\"e30\",\"title\":\"米西斯类\",\"aliases\":[],\"body\":\"[魔矿](#idx-e74)[蚀刻](#idx-e79)工艺的一个类别，包含[三分耦式](#idx-e35)蚀刻、四分耦式蚀刻等。特征是加工过程对环境温度非常敏感。\"},{\"id\":\"e32\",\"title\":\"内化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师于修习中将环境自由[以太](#idx-e19)汇入体内[仪式星轨](#idx-e51)的过程。\"},{\"id\":\"e35\",\"title\":\"三分耦式\",\"aliases\":[\"三分耦\"],\"body\":\"[米西斯类](#idx-e30)[魔矿](#idx-e74)[蚀刻](#idx-e79)工艺的一种，其加工过程长期依赖低温环境；1490年，该工艺获得可在室温条件下进行的重要突破。\"},{\"id\":\"e38\",\"title\":\"施法者\",\"aliases\":[],\"body\":\"能够主动运用[魔法](#idx-e3)的人口的统称，全大陆约占两成。\"},{\"id\":\"e39\",\"title\":\"疏化\",\"aliases\":[],\"body\":\"同一空间内反复施用[神启魔法](#idx-e5)后[自然元素](#idx-e41)恢复速率异常下降的现象，由神启魔法学者菲略奥斯提出。\"},{\"id\":\"e40\",\"title\":\"术式\",\"aliases\":[],\"body\":\"[神启魔法](#idx-e5)师以[精神力](#idx-e25)编织、临时改写自然法则的结构，是与[唯一神](#idx-e138)所立的单向契约。\"},{\"id\":\"e41\",\"title\":\"四大元素\",\"aliases\":[\"自然元素\"],\"body\":\"构成世界万物和游离在自然环境中的地、水、火、风[元素](#idx-e54)，也称自然元素；唯游离态者可为[神启魔法](#idx-e5)调用。\"},{\"id\":\"e42\",\"title\":\"塔莉拉·丝黛兰尔\",\"aliases\":[\"丝黛兰尔\"],\"body\":\"[星空学派](#idx-e7)[魔法](#idx-e3)先驱，著《[星术](#idx-e8)源流考》，首创以五颗天星对应五类魔法的[源星](#idx-e59)分类法，源星之名即出于此。\"},{\"id\":\"e43\",\"title\":\"天星五政\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)最重要的概念之一，指[冠阳](#idx-e538)、[汐月](#idx-e550)、[仲裁星](#idx-e555)、[烬铸星](#idx-e539)、[织虹星](#idx-e554)五颗天体。五政在天球上的轨迹被称为[大星轨](#idx-e18)，代表了宇宙中[以太](#idx-e19)流的流向。\"},{\"id\":\"e44\",\"title\":\"无属性元素流\",\"aliases\":[],\"body\":\"[秘术式](#idx-e2)解离祭品[构成元素](#idx-e20)后所得的能量形态，其性质仍是大陆[魔法](#idx-e3)学界研究的未解课题。\"},{\"id\":\"e46\",\"title\":\"显化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师控制体内[以太](#idx-e19)流运转特定[大星轨](#idx-e18)、将[玛娜](#idx-e28)转为有色状态并外放的过程。\"},{\"id\":\"e50\",\"title\":\"血契\",\"aliases\":[],\"body\":\"人类与巨龙缔结的契约，双方精神世界互相开放，可转移龙族[术式](#idx-e40)的[精神力](#idx-e25)消耗。\"},{\"id\":\"e51\",\"title\":\"仪式星轨\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师于体内仿照[大星轨](#idx-e18)建立的结构，人体各部位各对应一天宫。是星术师释放星术的核心系统。\"},{\"id\":\"e54\",\"title\":\"元素\",\"aliases\":[],\"body\":\"组成万物的最基本实体，包含构成世界的[四大元素](#idx-e41)以及构成群星与其间空间（宇宙）的[第五元素](#idx-e19)。\"},{\"id\":\"e55\",\"title\":\"元素丰地\",\"aliases\":[],\"body\":\"游离态[四大元素](#idx-e41)丰度明显高于大陆平均的天然区域，对[疏化](#idx-e39)有强韧抵抗力。\"},{\"id\":\"e56\",\"title\":\"元素枯竭\",\"aliases\":[],\"body\":\"[疏化](#idx-e39)的最终形态，[元素](#idx-e54)流几乎完全凝滞且长期无法恢复，学界认为不可逆转。\"},{\"id\":\"e58\",\"title\":\"元素亲和力\",\"aliases\":[\"亲和力\"],\"body\":\"[神启魔法](#idx-e5)师对游离态[自然元素](#idx-e41)的感知能力，常简称亲和力，先天决定，常以感知范围量化。\"},{\"id\":\"e59\",\"title\":\"源星\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e8)师[丝黛兰尔](#idx-e42)在《星术源流考》中提出的星术分类法中，五类星术的源头，对应[天星五政](#idx-e43)。该分类法被称为源星分类法。\"},{\"id\":\"e64\",\"title\":\"动力炉\",\"aliases\":[],\"body\":\"大型[星术设备](#idx-e88)的供能核心，见于[魔偶](#idx-e86)、[巨像](#idx-e84)与[星术驿车](#idx-e90)等。\"},{\"id\":\"e68\",\"title\":\"高品级魔矿\",\"aliases\":[],\"body\":\"[元素](#idx-e54)储存率极高、可承受各种[魔法](#idx-e3)加工工艺的[魔矿](#idx-e74)，八成以上产自[沙阿万大魔矿](#idx-e527)。\"},{\"id\":\"e72\",\"title\":\"洛林星元\",\"aliases\":[\"星元\"],\"body\":\"粗加工[魔矿](#idx-e74)晶体经[星轨蚀刻](#idx-e79)、注入[玛娜](#idx-e28)封装的[星术制品](#idx-e91)，通称星元，取名于洛林法蚀刻，可为小型[星术设备](#idx-e88)供能。\"},{\"id\":\"e74\",\"title\":\"魔法矿石\",\"aliases\":[\"魔矿\"],\"body\":\"对五大[元素](#idx-e54)均具极高流通率与储存率的天然矿石，通称魔矿，是大陆最重要的战略资源。\"},{\"id\":\"e76\",\"title\":\"蚀刻魔矿\",\"aliases\":[],\"body\":\"经[星轨蚀刻](#idx-e79)的[魔矿](#idx-e74)，可按[回路](#idx-e78)结构储存[玛娜](#idx-e28)，并在触发时释放对应[星术](#idx-e8)。\"},{\"id\":\"e77\",\"title\":\"托兰瓦尔·洛林\",\"aliases\":[\"洛林\"],\"body\":\"[艾瑟瑞姆](#idx-e500)[天星师](#idx-e251)，1125年首报可流通储存[以太](#idx-e19)的矿石并据以发明[星轨蚀刻](#idx-e79)；洛林法蚀刻为纪念其贡献而名，[洛林星元](#idx-e72)、[洛林阶运](#idx-e27)之名亦由此而来。\"},{\"id\":\"e78\",\"title\":\"星轨回路\",\"aliases\":[\"回路\"],\"body\":\"通过[蚀刻](#idx-e79)在[魔矿](#idx-e74)上建立的模仿[仪式星轨](#idx-e51)的通路，允许魔矿储存[玛娜](#idx-e28)，并在特定条件触发下释放对应[星术](#idx-e8)。\"},{\"id\":\"e79\",\"title\":\"星轨回路蚀刻\",\"aliases\":[\"蚀刻\",\"星轨蚀刻\",\"洛林法蚀刻\"],\"body\":\"于[魔矿](#idx-e74)表面蚀刻[仪式星轨](#idx-e51)[回路](#idx-e78)的技术，简称星轨蚀刻或蚀刻，为纪念发明人，又名洛林法蚀刻。1125年由[艾瑟瑞姆](#idx-e500)[星术](#idx-e8)学者[托兰瓦尔·洛林](#idx-e77)发明，构成了[星术设备](#idx-e88)的基石。\"},{\"id\":\"e84\",\"title\":\"星术巨像\",\"aliases\":[\"巨像\"],\"body\":\"[星术](#idx-e8)兵种的大型作战单位，通称巨像，由专精操作的星术师远距控制。\"},{\"id\":\"e86\",\"title\":\"星术魔偶\",\"aliases\":[\"魔偶\"],\"body\":\"以[蚀刻](#idx-e79)[回路](#idx-e78)驱动的小型[星术](#idx-e8)作战或劳作单位，通称魔偶，有农用魔偶、清扫魔偶等。\"},{\"id\":\"e88\",\"title\":\"星术设备\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e76)制成的各类器物的统称，自家用台灯至战场[巨像](#idx-e84)[动力炉](#idx-e64)，是[艾瑟瑞姆](#idx-e500)高技术社会立国的物质基础。\"},{\"id\":\"e90\",\"title\":\"星术驿车\",\"aliases\":[],\"body\":\"以[动力炉](#idx-e64)驱动的陆上载具，行于[艾瑟瑞姆](#idx-e500)城市内或城际道路。\"},{\"id\":\"e91\",\"title\":\"星术制品\",\"aliases\":[],\"body\":\"[星术设备](#idx-e88)所需半成品作为贸易品的称呼，[洛林星元](#idx-e72)为其典型代表。\"},{\"id\":\"e99\",\"title\":\"阿内玛\",\"aliases\":[],\"body\":\"四[天使长](#idx-e137)之一，掌岚（风）[元素](#idx-e54)权柄。\"},{\"id\":\"e100\",\"title\":\"埃塞莉斯\",\"aliases\":[],\"body\":\"巡行天球之上、监视[虚界](#idx-e145)裂缝的[次级天使](#idx-e104)，末世预言中最先通报天球开裂者。[公教](#idx-e110)尊之为[以太](#idx-e19)神权的象征、与四[天使长](#idx-e137)并列，[正教](#idx-e150)不认此说。\"},{\"id\":\"e102\",\"title\":\"朝圣\",\"aliases\":[],\"body\":\"[正教](#idx-e150)信众沿既定路线前往[圣城索菲亚](#idx-e493)的虔修，是[圣领](#idx-e489)可观的收入来源。\"},{\"id\":\"e103\",\"title\":\"称义\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒持守信仰、按神的教诲生活而得免[宿债](#idx-e134)的全过程，自[洗礼](#idx-e140)始，至临终而成。\"},{\"id\":\"e104\",\"title\":\"次级天使\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中四[天使长](#idx-e137)座下的天使，往来三界传谕护佑；[埃塞莉斯](#idx-e100)为其中特殊一位。\"},{\"id\":\"e105\",\"title\":\"从圣徒\",\"aliases\":[],\"body\":\"历代[正教会](#idx-e185)与[公教会](#idx-e159)册封的显现神迹、殉道或品行高洁的信徒，死后由[次级天使](#idx-e104)径引[天界](#idx-e136)。\"},{\"id\":\"e106\",\"title\":\"大赦\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中[三大罪](#idx-e121)的赦免。须直接出自[大牧首](#idx-e152)或[宗主教](#idx-e187)本人。\"},{\"id\":\"e107\",\"title\":\"大祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)学徒正式受任为神职的[圣事](#idx-e124)。\"},{\"id\":\"e108\",\"title\":\"盖昂\",\"aliases\":[],\"body\":\"四[天使长](#idx-e137)之一，掌地[元素](#idx-e54)权柄。\"},{\"id\":\"e109\",\"title\":\"告解\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒为自身罪行请求赦免的[圣事](#idx-e124)，可反复进行。\"},{\"id\":\"e110\",\"title\":\"公教\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)两大教派之一，1295年[教会大分裂](#idx-e164)后自[阿布丹提亚](#idx-e458)境内的[正教会](#idx-e185)独立而成，以[公教会](#idx-e159)为组织载体，是阿布丹提亚人口的第一大信仰。将[星空魔法](#idx-e8)一并纳入[唯一神](#idx-e138)权柄、另尊保罗为第二先知；主张轻罪可凭虔信与[圣事](#idx-e124)自赦，审判之权唯神独有，故不设[审判庭](#idx-e175)建制并废除[诺万尼斯流放](#idx-e171)，对个人虔修的要求高于[正教](#idx-e150)；[季首弥撒](#idx-e112)与节庆均依[通用历](#idx-e373)。\"},{\"id\":\"e111\",\"title\":\"海德洛娅\",\"aliases\":[],\"body\":\"四[天使长](#idx-e137)之一，掌泽（水）[元素](#idx-e54)权柄。\"},{\"id\":\"e112\",\"title\":\"季首弥撒\",\"aliases\":[],\"body\":\"[正教](#idx-e150)于[仪式历](#idx-e366)各季首日，[公教](#idx-e110)于[通用历](#idx-e373)各季首日举行的规模略大于每周[弥撒](#idx-e116)的集体仪式。\"},{\"id\":\"e113\",\"title\":\"坚振\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中，标志[称义](#idx-e103)大体完成的[圣事](#idx-e124)，一生一次，须对教会有重大贡献或持守信仰足够长久。\"},{\"id\":\"e115\",\"title\":\"礼仪年\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中六季[弥撒](#idx-e116)与九大节庆构成的一整年宗教循环。\"},{\"id\":\"e116\",\"title\":\"弥撒\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)礼拜日举行的集体仪式，与每日的[日课](#idx-e120)同为[称义](#idx-e103)最重要的日常载体。\"},{\"id\":\"e117\",\"title\":\"冥界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中的[四界](#idx-e133)之一，信徒死后安息、静候轮回之地。\"},{\"id\":\"e118\",\"title\":\"末日之战\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)末世预言中，天使大军与诸巨龙对抗三只[虚之大兽](#idx-e146)的终局之战。\"},{\"id\":\"e119\",\"title\":\"皮雷乌斯\",\"aliases\":[],\"body\":\"四[天使长](#idx-e137)之一，掌炎（火）[元素](#idx-e54)权柄。\"},{\"id\":\"e120\",\"title\":\"日课\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒每日的功课，与礼拜日[弥撒](#idx-e116)同为[称义](#idx-e103)的日常载体。\"},{\"id\":\"e121\",\"title\":\"三大罪\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中，[原罪](#idx-e149)之下的三种大罪：不谨、不智、不爱；非经[大赦](#idx-e106)不得赦免。\"},{\"id\":\"e122\",\"title\":\"圣保罗\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之一，最初的医者，司治愈与修复；对应[织虹星](#idx-e554)与[虹曜日](#idx-e353)。[公教](#idx-e110)另尊其为第二先知。\"},{\"id\":\"e123\",\"title\":\"圣骸\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)语境下的圣徒遗骨，为[朝圣](#idx-e102)与教堂声望所系，如[潘克拉托](#idx-e491)大教堂所藏的[圣约翰](#idx-e126)圣骸。\"},{\"id\":\"e124\",\"title\":\"圣事\",\"aliases\":[],\"body\":\"指[正教](#idx-e150)与[公教](#idx-e110)六项圣事：[洗礼](#idx-e140)、[坚振](#idx-e113)、婚姻、[告解](#idx-e109)、[大祝职](#idx-e107)、[小祝职](#idx-e142)。\"},{\"id\":\"e125\",\"title\":\"圣伊琳娜\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之一，司秩序与契约；对应[仲裁星](#idx-e555)与[裁曜日](#idx-e350)，[圣领](#idx-e489)[伊琳娜圣银币](#idx-e346)以其得名。\"},{\"id\":\"e126\",\"title\":\"圣约翰\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之首，[正教](#idx-e150)唯一的先知与弥赛亚，司精神与教导；对应[汐月](#idx-e550)与[月曜日](#idx-e381)。\"},{\"id\":\"e127\",\"title\":\"圣约瑟\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载四[使徒](#idx-e129)之一，商会之圣，司转化、破坏与锻造；对应[烬铸星](#idx-e539)与[烬曜日](#idx-e356)，[圣约瑟商会](#idx-e340)以其得名。\"},{\"id\":\"e128\",\"title\":\"十二诫命\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)中[三大罪](#idx-e121)的反面，分属谨、智、爱三目的十二条规范。\"},{\"id\":\"e129\",\"title\":\"使徒\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e135)》记载中，随[唯一神](#idx-e138)降世传教的最初四人：约翰、伊琳娜、约瑟、保罗。\"},{\"id\":\"e130\",\"title\":\"十字架\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)共用的宗教象征符号。[正教](#idx-e150)十字架为四端，象征四[元素](#idx-e54)权柄。[公教](#idx-e110)下端另加一横，四横端象征四元素，竖端象征[星术](#idx-e8)。\"},{\"id\":\"e133\",\"title\":\"四界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)神学的宇宙构成：[天界](#idx-e136)、[现界](#idx-e141)、[冥界](#idx-e117)、[虚界](#idx-e145)。\"},{\"id\":\"e134\",\"title\":\"宿债\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)神学中，人一出生便背负的亏欠。缘于[唯一神](#idx-e138)所借予而非赐予的权柄，受惠者无人能置身账外。\"},{\"id\":\"e135\",\"title\":\"索菲亚圣典\",\"aliases\":[\"圣典\"],\"body\":\"[唯一神信仰](#idx-e139)的最高典籍，通称《圣典》，分《创世录》、《弥赛亚记》、《神言书》、《箴言集》、四福音（《约翰福音》、《约瑟福音》、《伊琳娜福音》、《保罗福音》）与《预言书》。\"},{\"id\":\"e136\",\"title\":\"天界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中的[四界](#idx-e133)之一，[唯一神](#idx-e138)、圣徒与天使的居所。\"},{\"id\":\"e137\",\"title\":\"天使长\",\"aliases\":[],\"body\":\"神学中[唯一神](#idx-e138)部分神格的具现。共有四位，各具六翼，分掌[四大元素](#idx-e41)权柄：[盖昂](#idx-e108)（地）、[皮雷乌斯](#idx-e119)（火）、[阿内玛](#idx-e99)（岚）、[海德洛娅](#idx-e111)（水）。\"},{\"id\":\"e138\",\"title\":\"唯一神\",\"aliases\":[\"主\",\"神\",\"上帝\"],\"body\":\"[唯一神信仰](#idx-e139)所奉的至高神，信徒亦称主、神或上帝，是宇宙的创造者、维系者与监督者，也是世间一切[魔法](#idx-e3)力量的源头。\"},{\"id\":\"e139\",\"title\":\"唯一神信仰\",\"aliases\":[],\"body\":\"大陆流播最广的宗教，崇奉[唯一神](#idx-e138)，与[神启祷言](#idx-e5)一脉深度绑定，最高典籍为《[索菲亚圣典](#idx-e135)》。十三世纪末[教会大分裂](#idx-e164)后分为[正教](#idx-e150)与[公教](#idx-e110)两派，前者为[索拉瑞斯](#idx-e434)与[忒奥西斯](#idx-e489)的国教，后者是[阿布丹提亚](#idx-e458)人口的第一大信仰；其历法与礼拜之制的影响遍及各国。\"},{\"id\":\"e140\",\"title\":\"洗礼\",\"aliases\":[],\"body\":\"[正教](#idx-e150)与[公教](#idx-e110)信徒入教与[称义](#idx-e103)之始的[圣事](#idx-e124)，一生一次，象征认清并领受自身的[宿债](#idx-e134)。\"},{\"id\":\"e141\",\"title\":\"现界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中[四界](#idx-e133)之一，人类生息的世界。\"},{\"id\":\"e142\",\"title\":\"小祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[公教会](#idx-e159)神职人员卸任、复为寻常信徒之礼，多见于年老体弱者。\"},{\"id\":\"e144\",\"title\":\"虚潮\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)神学中，末日时自[虚界](#idx-e145)渗入[现界](#idx-e141)的虚，所至之处只余死地。\"},{\"id\":\"e145\",\"title\":\"虚界\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)宇宙观中的[四界](#idx-e133)之一，天球与大地之外仍为虚所充满的空间，罪人与非正信者死后的去处。\"},{\"id\":\"e146\",\"title\":\"虚之大兽\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)末世预言中，由被吞灭者之力所生的三只巨兽，各象[三大罪](#idx-e121)。\"},{\"id\":\"e147\",\"title\":\"异端\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)语境下，秉持不同教义解释相异的教派；就[正教](#idx-e150)而言[公教](#idx-e110)即当代最大异端。\"},{\"id\":\"e149\",\"title\":\"原罪\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)语境下，不信奉[唯一神](#idx-e138)者[宿债](#idx-e134)所转化者。负原罪者死后被流放[虚界](#idx-e145)，终至灵魂碎裂。\"},{\"id\":\"e150\",\"title\":\"正教\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)两大教派之一，以[正教会](#idx-e185)为组织载体，为[索拉瑞斯](#idx-e434)与[忒奥西斯](#idx-e489)的国教。认[神启祷言](#idx-e5)为[唯一神](#idx-e138)所授的权柄，[星空魔法](#idx-e8)则不在神权之列；一切罪无论大小均须经[告解](#idx-e109)方得赦免，并以神在[现界](#idx-e141)的代行者自任，设[审判庭](#idx-e175)严管神启魔法、以[诺万尼斯流放](#idx-e171)向神赎罪。历法与[礼仪年](#idx-e115)循环依[圣格里仪式历](#idx-e366)。\"},{\"id\":\"e151\",\"title\":\"传信厅\",\"aliases\":[],\"body\":\"[圣领](#idx-e489)[牧首厅](#idx-e170)六分厅之一，分管外交。\"},{\"id\":\"e152\",\"title\":\"大牧首\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)最高元首、[忒奥西斯](#idx-e489)圣领国家元首，由[枢机主教团](#idx-e178)闭门选出，终身任期。\"},{\"id\":\"e153\",\"title\":\"大审判长\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)最高长官，由[枢机主教团](#idx-e178)任命，与[大牧首](#idx-e152)同为终身任期。\"},{\"id\":\"e154\",\"title\":\"第二次宗教改革\",\"aliases\":[],\"body\":\"十三世纪末谋求将[星术](#idx-e8)纳入神权的改革，失败后直接导致[教会大分裂](#idx-e164)。\"},{\"id\":\"e156\",\"title\":\"都主教\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)[都主教区](#idx-e157)长官，教阶在主教之上；与[大牧首](#idx-e152)同不得婚娶，别称[门徒](#idx-e169)。\"},{\"id\":\"e157\",\"title\":\"都主教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e489)最高一级行政区划和宗教管理区划，全境共五个，长官称[都主教](#idx-e156)。[卡帕尼](#idx-e508)和[索拉瑞斯](#idx-e434)亦设有都主教区，但不具备行政职能。\"},{\"id\":\"e158\",\"title\":\"督审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)教阶之一，位在[审判官](#idx-e173)之上；[审判所](#idx-e166)驻任长官、[审判分庭](#idx-e172)官员。[诺万尼斯流放](#idx-e171)须由审判分庭所属督审判官主刑。\"},{\"id\":\"e159\",\"title\":\"公教会\",\"aliases\":[],\"body\":\"1295年[教会大分裂](#idx-e164)后，[阿布丹提亚](#idx-e458)境内[正教会](#idx-e185)脱离[牧首厅](#idx-e170)管辖独立而来的教会，领袖称[宗主教](#idx-e187)，驻[波马里亚](#idx-e465)。\"},{\"id\":\"e161\",\"title\":\"公教总会\",\"aliases\":[],\"body\":\"[公教会](#idx-e159)中枢，驻[阿布丹提亚帝国](#idx-e458)城市[波马里亚](#idx-e465)。\"},{\"id\":\"e164\",\"title\":\"教会大分裂\",\"aliases\":[],\"body\":\"1295年[第二次宗教改革](#idx-e154)失败后，[阿布丹提亚帝国](#idx-e458)境内[正教会](#idx-e185)宣布脱离[牧首厅](#idx-e170)独立，成立[公教会](#idx-e159)。\"},{\"id\":\"e165\",\"title\":\"教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e489)[都主教区](#idx-e157)下辖的最小一级行政区划，长官称主教。也是[正教会](#idx-e185)在大陆各国所划的宗教事务上的最小管理层级。\"},{\"id\":\"e166\",\"title\":\"教区审判所\",\"aliases\":[\"审判所\"],\"body\":\"[审判庭](#idx-e175)在[教区](#idx-e165)一级所设的分支机构，简称审判所，由[督审判官](#idx-e158)驻任长官。\"},{\"id\":\"e169\",\"title\":\"门徒\",\"aliases\":[],\"body\":\"教会系统中[都主教](#idx-e156)及以上神职，以及[审判庭](#idx-e175)系统中自[督审判官](#idx-e158)及以上职位的别称，象征舍弃现世之乐、专心侍神；门徒不得婚娶。\"},{\"id\":\"e170\",\"title\":\"牧首厅\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)中枢以及[圣领](#idx-e489)最高行政机构，下设[圣礼厅](#idx-e177)、[省察厅](#idx-e183)、[司牧厅](#idx-e181)、[神启厅](#idx-e176)、[传信厅](#idx-e151)、[卫教厅](#idx-e182)六分厅。\"},{\"id\":\"e171\",\"title\":\"诺万尼斯流放\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)与[索拉瑞斯帝国](#idx-e434)维持的一种极刑，将受刑者留置诺万尼斯区域枯竭死地直至器官衰竭。\"},{\"id\":\"e172\",\"title\":\"审判分庭\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)在[都主教区](#idx-e157)一级的机构，长官称审判长，由[大审判长](#idx-e153)直接任命。\"},{\"id\":\"e173\",\"title\":\"审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e175)教阶之一，负责日常调查和执行事务，是[圣领](#idx-e489)独立于军事系统的强制执行编制。\"},{\"id\":\"e175\",\"title\":\"审判庭\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)直属司法和执行机构，处理[异端](#idx-e147)事务、追查未经许可的神启施法，拥有独立执法和行刑权。\"},{\"id\":\"e176\",\"title\":\"神启厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管[神启魔法](#idx-e5)事务。\"},{\"id\":\"e177\",\"title\":\"圣礼厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管宗教事务，亦负责[索拉瑞斯](#idx-e434)[凯撒](#idx-e239)的[血脉测试](#idx-e258)。\"},{\"id\":\"e178\",\"title\":\"枢机主教团\",\"aliases\":[],\"body\":\"[圣领](#idx-e489)事实上的最高权力机构，[大牧首](#idx-e152)去世后负责闭门选出继任者。成员由大牧首自[都主教](#idx-e156)中选任。\"},{\"id\":\"e180\",\"title\":\"司祭\",\"aliases\":[],\"body\":\"[正教会](#idx-e185)教阶之一，分管各城镇乡村的基层教会，往往本人即[神启魔法](#idx-e5)师。\"},{\"id\":\"e181\",\"title\":\"司牧厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管民生。\"},{\"id\":\"e182\",\"title\":\"卫教厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管军事，战时统一征召[护教军](#idx-e294)。\"},{\"id\":\"e183\",\"title\":\"省察厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e170)六分厅之一，分管监察。\"},{\"id\":\"e185\",\"title\":\"正教会\",\"aliases\":[],\"body\":\"[唯一神信仰](#idx-e139)最大教派[正教](#idx-e150)的教会组织，以[忒奥西斯](#idx-e489)圣领[牧首厅](#idx-e170)为教会中枢，同时也是圣领的统治机构。\"},{\"id\":\"e187\",\"title\":\"宗主教\",\"aliases\":[],\"body\":\"[公教会](#idx-e159)领袖，由全大陆[公教](#idx-e110)主教选出三名候选，再由盲眼童贞信徒抽签决定。\"},{\"id\":\"e190\",\"title\":\"大神庙\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e523)首都[阿尔努尔](#idx-e524)城中的[教长](#idx-e204)驻地，是酋邦的宗教中心与圣地。\"},{\"id\":\"e191\",\"title\":\"混沌之海\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中[混沌之河](#idx-e192)的尽头。现世的[巨航船](#idx-e194)于此为海浪撕毁，是为末日。千年后新船于混沌之河上游再度起航。\"},{\"id\":\"e192\",\"title\":\"混沌之河\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中，孕育[司费尔](#idx-e199)的停滞之河，经其令之流动后成为宇宙时间的载体。[巨航船](#idx-e194)自上游航行而下抵达[混沌之海](#idx-e191)，是为一次循环。\"},{\"id\":\"e194\",\"title\":\"巨航船\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中的宇宙譬喻：[现界](#idx-e141)如行于[混沌之河](#idx-e192)上的巨船，终将驶抵[混沌之海](#idx-e191)。\"},{\"id\":\"e195\",\"title\":\"玛阿特\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中的死后审判仪式，以心脏置于天平称量，砝码为[希塔](#idx-e202)手杖顶端的宝石。\"},{\"id\":\"e196\",\"title\":\"尼希尔诸神信仰\",\"aliases\":[\"诸神信仰\"],\"body\":\"行于[尼希尔酋邦](#idx-e523)一域的宗教，通称诸神信仰，是大陆唯一与活体献祭绑定者。奉[零之神](#idx-e199)司费尔及其所化六神，以死后的[玛阿特](#idx-e195)称量为教义核心，称量恰成平衡者受赐[秘术](#idx-e4)之力成为[神遴者](#idx-e417)。雏形出自两河流域早期部落，结构在前二世纪萨阿尔部征服西尼希尔后成型，宗教、秘术与统治三者由此缚为一体。\"},{\"id\":\"e199\",\"title\":\"司费尔\",\"aliases\":[\"零之神\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)中[混沌之河](#idx-e192)所孕育的最初亦唯一之神，以自身之躯造出[现界](#idx-e141)，又拆己身为六片化作六神，随后消隐，不受祭祀。\"},{\"id\":\"e202\",\"title\":\"希塔\",\"aliases\":[\"陆之神\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)中六神之一，老者之形，象征万物的终点，司灵魂与审判，看护[至福乐土](#idx-e206)；[玛阿特](#idx-e195)称量由其执行，砝码即其手杖顶端的宝石。\"},{\"id\":\"e204\",\"title\":\"伊玛目教长\",\"aliases\":[\"教长\"],\"body\":\"[尼希尔](#idx-e523)最高元首，简称教长，同时是酋邦的宗教领袖与[酋长会议](#idx-e244)首席。终身制，非世袭，代代以[秘术](#idx-e4)密封诏书委任继承。\"},{\"id\":\"e206\",\"title\":\"至福乐土\",\"aliases\":[],\"body\":\"[尼希尔诸神信仰](#idx-e196)中，[玛阿特](#idx-e195)称量通过者所被允许进入的永恒安乐之地，由[希塔](#idx-e202)看护。\"},{\"id\":\"e207\",\"title\":\"诸神圣土\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e523)中由[伊玛目教长](#idx-e204)直辖的宗教领地。含首都[阿尔努尔](#idx-e524)及周边耕地城市，由各部按比例出资供养。\"},{\"id\":\"e216\",\"title\":\"氏族\",\"aliases\":[],\"body\":\"精灵族的社会单位，被喻为[大圣树](#idx-e219)的分枝，各有族长与长老，本族领地内高度自治。\"},{\"id\":\"e218\",\"title\":\"万叶庭\",\"aliases\":[],\"body\":\"精灵族最高权力机构，每三十年于[希尔文尼亚](#idx-e533)召开，全体精灵借[圣树魔法](#idx-e9)旁听并投票。\"},{\"id\":\"e219\",\"title\":\"希尔文诺大圣树\",\"aliases\":[\"圣树\",\"大圣树\",\"圣树之母\"],\"body\":\"圣树信仰唯一的神圣对象，通称大圣树或圣树，矗立于[希尔文尼亚](#idx-e533)祭坛广场；凡有描述皆以女性位格出现，精灵称之为圣树之母，[自然魔法](#idx-e9)即祂分享之力。\"},{\"id\":\"e221\",\"title\":\"叶络枢机院\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e530)日常行政与对外事务机构，席位由[万叶庭](#idx-e218)轮选，长老兼承宗教职责。\"},{\"id\":\"e223\",\"title\":\"阿斯塔伦·塔利瑞安\",\"aliases\":[\"塔利瑞安\"],\"body\":\"[星术](#idx-e8)泰斗，1097年联合十二城邦创建[大星术研究院](#idx-e231)，即今[王家研究院](#idx-e254)之前身。\"},{\"id\":\"e231\",\"title\":\"大星术研究院\",\"aliases\":[],\"body\":\"1097年由[塔利瑞安](#idx-e223)联合十二城邦创建，[艾瑟瑞姆](#idx-e500)[王家研究院](#idx-e254)前身，是艾瑟瑞姆国家形态的起点。\"},{\"id\":\"e232\",\"title\":\"地星师\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e500)[星术](#idx-e8)学者的头衔之一。星术师于所属研究院研究室完成课题答辩，毕业后被授予的头衔。\"},{\"id\":\"e233\",\"title\":\"帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e458)的一级行政区划，共五个，与皇室直辖的[维里迪亚直辖省](#idx-e487)并列；省政府为中央[内阁](#idx-e242)的地方分支。原为六省，[卡帕尼](#idx-e508)独立后余五省。\"},{\"id\":\"e235\",\"title\":\"公爵领\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e458)最高级别的贵族封地，各[帝政省](#idx-e233)含一到两个公爵领。\"},{\"id\":\"e236\",\"title\":\"管理局\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e508)[特贸区](#idx-e511)的立法与行政机构，由区内各商会分部选派代表组成，最高长官称管理局主席。\"},{\"id\":\"e237\",\"title\":\"军团行省\",\"aliases\":[\"行省\"],\"body\":\"[索拉瑞斯](#idx-e434)的一级行政区划，一行省对应一[军团](#idx-e299)，共八个，长官称[行省总督](#idx-e256)。\"},{\"id\":\"e238\",\"title\":\"龙裔继嗣法\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)开国皇帝[阿利昂](#idx-e240)晚年制定的皇位继承法，以直系子嗣的龙血浓度为据，由[牧首厅](#idx-e170)主持[血脉测试](#idx-e258)。\"},{\"id\":\"e239\",\"title\":\"龙裔凯撒\",\"aliases\":[\"凯撒\"],\"body\":\"[索拉瑞斯](#idx-e434)最高统治者的称号，简称凯撒，即位须由[大牧首](#idx-e152)主持册封礼，体现君权神授。\"},{\"id\":\"e240\",\"title\":\"马尔奇安·阿利昂\",\"aliases\":[\"阿利昂\"],\"body\":\"[索拉瑞斯](#idx-e434)开国[凯撒](#idx-e239)，人龙混血，受[大牧首](#idx-e152)册封为首位龙裔凯撒；捐帝国东部领土立[忒奥西斯](#idx-e489)圣领，晚年制定《[龙裔继嗣法](#idx-e238)》。\"},{\"id\":\"e242\",\"title\":\"内阁\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e500)和[阿布丹提亚帝国](#idx-e458)的中央机构之一。均指直属于王室/皇室的日常行政机构，各有大臣分管外交、军务、内务与王室/皇室财政。\"},{\"id\":\"e244\",\"title\":\"酋长会议\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e523)最高权力机构，由[教长](#idx-e204)与各部落酋长组成，每年[金素](#idx-e355)季于[阿尔努尔](#idx-e524)召开，协商全酋邦外交、军事与内政事宜。\"},{\"id\":\"e245\",\"title\":\"三柱议会\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e458)最高立法与财政机构，1393年确立，三柱指皇室、贵族与[魔法](#idx-e3)阶级。\"},{\"id\":\"e249\",\"title\":\"特别仪式区\",\"aliases\":[],\"body\":\"位于[艾瑟瑞姆](#idx-e500)中南部最大平原，专用于王国[星术](#idx-e8)研究与设备制造，行政直属国王/女王。\"},{\"id\":\"e250\",\"title\":\"特区商法典\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e508)[北部特贸区](#idx-e511)适用的独立法系，不同于各公国法系。\"},{\"id\":\"e251\",\"title\":\"天星师\",\"aliases\":[],\"body\":\"[星术](#idx-e8)学者的最高阶头衔与职位，授予毕业后继续从事学术研究，且学术成果极为杰出的[地星师](#idx-e232)。[托兰瓦尔·洛林](#idx-e77)、[奥韦纳尔·安柯伦坦](#idx-e10)等均曾任天星师。\"},{\"id\":\"e252\",\"title\":\"天星首席\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e500)[王家研究院](#idx-e254)最高级别学者之职，永久由艾瑟瑞姆国王或女王兼任。\"},{\"id\":\"e253\",\"title\":\"王冠领地\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e500)国王直辖之地，含以首都[阿斯托利亚](#idx-e501)为首的[坠星湖](#idx-e507)南岸城市群。\"},{\"id\":\"e254\",\"title\":\"王家研究院\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e500)学术中枢，前身为[大星术研究院](#idx-e231)，兼掌王室继承事务与[特别仪式区](#idx-e249)管理，院长即[天星首席](#idx-e252)，永久由国王或女王兼任。\"},{\"id\":\"e256\",\"title\":\"行省总督\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)[军团行省](#idx-e237)最高长官，由[军团](#idx-e299)长兼任，任期二十年，每年赴首都[索尔因](#idx-e454)叙职。\"},{\"id\":\"e257\",\"title\":\"叙职大会\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)八位[行省总督](#idx-e256)每年赴[索尔因](#idx-e454)向[凯撒](#idx-e239)当面汇报施政与军务的会议。\"},{\"id\":\"e258\",\"title\":\"血脉测试\",\"aliases\":[],\"body\":\"《[龙裔继嗣法](#idx-e238)》规定的继承资格测试，由[牧首厅](#idx-e170)[圣礼厅](#idx-e177)主持，每代[凯撒](#idx-e239)继承人均须重测。\"},{\"id\":\"e264\",\"title\":\"仲裁所\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e508)[特贸区](#idx-e511)[管理局](#idx-e236)下属机构，承担特贸区司法职能。\"},{\"id\":\"e268\",\"title\":\"阿索战争\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e458)与[索拉瑞斯帝国](#idx-e434)之间的三次大规模战争（1290–1292、1351–1356、1479–1483）。\"},{\"id\":\"e269\",\"title\":\"布兰顿和约\",\"aliases\":[],\"body\":\"[第二次阿索战争](#idx-e274)停战和约，以[布兰顿河](#idx-e469)下游为两国新界，[布兰顿](#idx-e468)城割予[索拉瑞斯](#idx-e434)。\"},{\"id\":\"e270\",\"title\":\"布兰顿战役\",\"aliases\":[],\"body\":\"1479年[三战](#idx-e275)前期的一场决定性会战，[阿布丹提亚帝国](#idx-e458)获得战略性胜利。\"},{\"id\":\"e274\",\"title\":\"第二次阿索战争\",\"aliases\":[\"二战\"],\"body\":\"于1351–1356年[索拉瑞斯](#idx-e434)与[阿布丹提亚](#idx-e458)发生的第二次大规模战争，[忒奥西斯](#idx-e489)保持中立。索拉瑞斯获胜，得[西比尔平原](#idx-e498)南部与[布兰顿](#idx-e468)城，停战于《[布兰顿和约](#idx-e269)》；阿布丹提亚放弃[卡帕尼](#idx-e508)群岛，卡帕尼同年独立。\"},{\"id\":\"e275\",\"title\":\"第三次阿索战争\",\"aliases\":[\"三战\"],\"body\":\"于1479–1483年[索拉瑞斯](#idx-e434)与[阿布丹提亚](#idx-e458)发生的第三次大规模战争，阿布丹提亚获胜。停战于《[卡斯特鲁姆和约](#idx-e280)》，索拉瑞斯向阿布丹提亚归还[大运河](#idx-e432)下游东岸两座城市及其周边土地，两国当代边界由此确立。\"},{\"id\":\"e276\",\"title\":\"第一次阿索战争\",\"aliases\":[\"一战\"],\"body\":\"于1290–1292年[索拉瑞斯](#idx-e434)与[阿布丹提亚](#idx-e458)发生的第一次大规模战争，[忒奥西斯](#idx-e489)为索拉瑞斯盟友。索拉瑞斯获胜后与圣领同告东扩，停战于《[文特拉和约](#idx-e288)》；间接促成1295年[教会大分裂](#idx-e164)。\"},{\"id\":\"e278\",\"title\":\"黑暗时代\",\"aliases\":[],\"body\":\"指八世纪[七王约](#idx-e285)瓦解后，西诺拉尼亚地区长达数百年的多国混战时期。\"},{\"id\":\"e280\",\"title\":\"卡斯特鲁姆和约\",\"aliases\":[],\"body\":\"[第三次阿索战争](#idx-e275)停战和约，确立阿索当代边界；[大运河](#idx-e432)下游东岸两城交接至今悬而未决。\"},{\"id\":\"e281\",\"title\":\"林缘议厅\",\"aliases\":[],\"body\":\"1203年[希尔文诺](#idx-e530)[叶络枢机院](#idx-e221)于[冠脊山脉](#idx-e424)东南脉隘口所设，是当前大陆唯一公认的中立缔约见证机构。\"},{\"id\":\"e284\",\"title\":\"诺万尼斯大叛乱\",\"aliases\":[],\"body\":\"758年[龙骑士](#idx-e300)群体与[诺万尼斯王国](#idx-e544)结盟发动的叛乱，[索瑞斯战役](#idx-e287)引发大规模[元素枯竭](#idx-e56)。\"},{\"id\":\"e285\",\"title\":\"七王约\",\"aliases\":[],\"body\":\"328年西诺拉尼亚七国建立的松散邦联，存续约四个世纪，八世纪中叶瓦解。\"},{\"id\":\"e287\",\"title\":\"索瑞斯战役\",\"aliases\":[],\"body\":\"[诺万尼斯大叛乱](#idx-e284)中交战双方连续动用大规模[神启魔法](#idx-e5)的会战，直接导致诺万尼斯枯竭。\"},{\"id\":\"e288\",\"title\":\"文特拉和约\",\"aliases\":[],\"body\":\"[第一次阿索战争](#idx-e276)停战和约，[索拉瑞斯](#idx-e434)与[忒奥西斯](#idx-e489)领土东扩。\"},{\"id\":\"e294\",\"title\":\"护教军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e489)最主要的常规部队，下分五个师，由各[都主教区](#idx-e157)分别组建。\"},{\"id\":\"e296\",\"title\":\"近卫龙骑兵团\",\"aliases\":[\"龙骑兵团\"],\"body\":\"[索拉瑞斯](#idx-e434)以[飞龙](#idx-e297)为坐骑的精锐常规部队，通称龙骑兵团，直属[凯撒](#idx-e239)，约八万头飞龙、五万人编制，跨地形作战能力冠绝大陆。\"},{\"id\":\"e297\",\"title\":\"巨龙眷属\",\"aliases\":[\"飞龙\"],\"body\":\"巨龙与大型野兽的混血飞行亚种，通称飞龙，寿约五百年，是[龙骑兵团](#idx-e296)的坐骑。\"},{\"id\":\"e299\",\"title\":\"军团\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)最高军事编制，与[行省](#idx-e237)一体，下设团、大队、小队。\"},{\"id\":\"e300\",\"title\":\"龙骑士\",\"aliases\":[],\"body\":\"与巨龙缔结[血契](#idx-e50)、得以释放[龙族魔法](#idx-e1)的人类战士，存在[半龙化](#idx-e12)现象。\"},{\"id\":\"e301\",\"title\":\"龙骑士团\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e434)的顶级战力，成员皆与巨龙缔结[血契](#idx-e50)，效忠[凯撒](#idx-e239)本人而非帝国，团内以多数决议事。\"},{\"id\":\"e307\",\"title\":\"圣仪军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e489)[牧首厅](#idx-e170)直属的精锐法术作战部队，大陆规模最大的法术军力，兼承民间大型工程建设。\"},{\"id\":\"e340\",\"title\":\"圣约瑟商会\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e489)[牧首厅](#idx-e170)直属商会，垄断圣领境内外一切贸易，学界普遍认为兼具情报网络职能。\"},{\"id\":\"e343\",\"title\":\"索利亚商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e508)商会之一，1489年前后由卡涅·道格拉斯创办，以[星术设备](#idx-e88)半成品与[魔矿](#idx-e74)原料分销起家，后跃居联邦前列。\"},{\"id\":\"e346\",\"title\":\"伊琳娜圣银币\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e489)流通货币，以高含银量铸造并防伪，与[索拉瑞斯](#idx-e434)铁钞按一比一互认流通。\"},{\"id\":\"e349\",\"title\":\"自由港\",\"aliases\":[],\"body\":\"[特贸区](#idx-e511)所设、享有极高自治权的港口体系，是国际贸易量激增的制度前提。\"},{\"id\":\"e350\",\"title\":\"裁曜日\",\"aliases\":[\"圣伊琳娜日\"],\"body\":\"[通用历](#idx-e373)一周第二日，亦简称星期二；[仪式历](#idx-e366)作圣伊琳娜日，对应天星[仲裁星](#idx-e555)。\"},{\"id\":\"e351\",\"title\":\"大陆历\",\"aliases\":[],\"body\":\"[通用历](#idx-e373)纪年，以[唯一神](#idx-e138)降临传教义于[圣约翰](#idx-e126)之年为元年，元年之前称元前。\"},{\"id\":\"e353\",\"title\":\"虹曜日\",\"aliases\":[\"圣保罗日\"],\"body\":\"[通用历](#idx-e373)一周第四日，亦简称星期四；[仪式历](#idx-e366)作圣保罗日，对应天星[织虹星](#idx-e554)。\"},{\"id\":\"e354\",\"title\":\"降临节\",\"aliases\":[],\"body\":\"[晖醒](#idx-e361)季首日，纪念[唯一神](#idx-e138)降临传道的[正教](#idx-e150)宗教节日，是宗教意义上的新年与全年最大节日。\"},{\"id\":\"e355\",\"title\":\"金素\",\"aliases\":[\"圣献\",\"冕宫月\",\"肆位\"],\"body\":\"一年六季的第四季，各地作物相继采收。[仪式历](#idx-e366)同季作圣献，[艾瑟瑞姆](#idx-e500)[星历](#idx-e376)作冕宫月，[尼希尔](#idx-e523)[萨辛历](#idx-e364)作肆位。\"},{\"id\":\"e356\",\"title\":\"烬曜日\",\"aliases\":[\"圣约瑟日\"],\"body\":\"[通用历](#idx-e373)一周第三日，亦简称星期三；[仪式历](#idx-e366)作圣约瑟日，对应天星[烬铸星](#idx-e539)。\"},{\"id\":\"e357\",\"title\":\"立约节\",\"aliases\":[],\"body\":\"纪念约瑟在大地上首施[神启魔法](#idx-e5)、借予之约显明于世的[正教](#idx-e150)宗教节日，因邻[通用历](#idx-e373)新年常连同庆祝。\"},{\"id\":\"e358\",\"title\":\"凛寒\",\"aliases\":[\"正炼\",\"琴宫月\",\"陆位\"],\"body\":\"一年六季的第六季，山地封路、[凛冰洋](#idx-e428)冰封，大陆整体进入年内节律最为收缩的状态。[仪式历](#idx-e366)同季作正炼，[艾瑟瑞姆](#idx-e500)[星历](#idx-e376)作琴宫月，[尼希尔](#idx-e523)[萨辛历](#idx-e364)作陆位。\"},{\"id\":\"e359\",\"title\":\"灵诞节\",\"aliases\":[],\"body\":\"[降临节](#idx-e354)后第四日，纪念神传道毕重返[天界](#idx-e136)；自降临节起五日为[正教](#idx-e150)信仰中全年最长的休息日。\"},{\"id\":\"e361\",\"title\":\"启蛰\",\"aliases\":[\"晖醒\",\"天宫月\",\"壹位\"],\"body\":\"一年六季的第一季，[通用历](#idx-e373)岁首所在。[凛冰洋](#idx-e428)浮冰退散、山地封雪消融、两河进入汛期，各地贸易与出行随之重新活跃。[仪式历](#idx-e366)同季作晖醒，[艾瑟瑞姆](#idx-e500)[星历](#idx-e376)作天宫月，[尼希尔](#idx-e523)[萨辛历](#idx-e364)作壹位。\"},{\"id\":\"e362\",\"title\":\"清和\",\"aliases\":[\"垂恩\",\"船宫月\",\"贰位\"],\"body\":\"一年六季的第二季，气候达到全年最宜人的状态，远洋航运与陆上商路均进入最活跃的窗口。[仪式历](#idx-e366)同季作垂恩，[艾瑟瑞姆](#idx-e500)[星历](#idx-e376)作船宫月，[尼希尔](#idx-e523)[萨辛历](#idx-e364)作贰位。\"},{\"id\":\"e363\",\"title\":\"日曜日\",\"aliases\":[\"圣神日\"],\"body\":\"[通用历](#idx-e373)一周第五日，亦简称星期日；[仪式历](#idx-e366)作圣神日，对应天星[冠阳](#idx-e538)，是信众向[唯一神](#idx-e138)礼拜的礼拜日。\"},{\"id\":\"e364\",\"title\":\"萨辛历\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e523)地方历法，以当代伊玛目称号纪年，每代即位则重置元年，六季称[壹位](#idx-e361)至[陆位](#idx-e358)。\"},{\"id\":\"e365\",\"title\":\"圣保罗节\",\"aliases\":[],\"body\":\"纪念保罗殉道的[正教](#idx-e150)宗教节日。\"},{\"id\":\"e366\",\"title\":\"圣格里仪式历\",\"aliases\":[\"仪式历\"],\"body\":\"[正教会](#idx-e185)原始历法，[通用历](#idx-e373)前身，[圣领](#idx-e489)与[索拉瑞斯](#idx-e434)的官方历法，六季与五日均保留宗教命名。\"},{\"id\":\"e368\",\"title\":\"升天节\",\"aliases\":[],\"body\":\"纪念[圣约翰](#idx-e126)殉道的[正教](#idx-e150)宗教节日，《约翰福音》载其在[十字架](#idx-e130)上讲道一昼夜后直升[天界](#idx-e136)。\"},{\"id\":\"e369\",\"title\":\"圣伊琳娜节\",\"aliases\":[],\"body\":\"纪念伊琳娜殉道的[正教](#idx-e150)宗教节日，与[圣约瑟节](#idx-e370)同被恋人与夫妻视为爱情之节。[圣典](#idx-e135)载二圣为夫妻、婚姻受神祝福。\"},{\"id\":\"e370\",\"title\":\"圣约瑟节\",\"aliases\":[],\"body\":\"纪念约瑟殉道的[正教](#idx-e150)宗教节日；与[圣伊琳娜节](#idx-e369)同被恋人与夫妻视为爱情之节。[圣典](#idx-e135)载二圣为夫妻、婚姻受神祝福。\"},{\"id\":\"e371\",\"title\":\"霜序\",\"aliases\":[\"肃省\",\"波宫月\",\"伍位\"],\"body\":\"一年六季的第五季，气温持续下降，商路与人流逐渐收束，各地进入交流的尾声窗口。[仪式历](#idx-e366)同季作肃省，[艾瑟瑞姆](#idx-e500)[星历](#idx-e376)作波宫月，[尼希尔](#idx-e523)[萨辛历](#idx-e364)作伍位。\"},{\"id\":\"e373\",\"title\":\"通用历\",\"aliases\":[\"格里历\"],\"body\":\"大陆通行的太阳历，一年六季、每季五十日、每旬十日、每周五日；别称格里历，源自[正教会](#idx-e185)的[圣格里仪式历](#idx-e366)，经[公教会](#idx-e159)世俗化后扩散全大陆。\"},{\"id\":\"e375\",\"title\":\"显圣节\",\"aliases\":[],\"body\":\"纪念约翰受神圣诏、建立[现界](#idx-e141)第一个教会的[正教](#idx-e150)宗教节日。\"},{\"id\":\"e376\",\"title\":\"星历\",\"aliases\":[],\"body\":\"[艾瑟瑞姆](#idx-e500)地方历法，大陆唯一的月亮历，六月之名取自黄道六宫。\"},{\"id\":\"e379\",\"title\":\"炎阳\",\"aliases\":[\"神焰\",\"牧宫月\",\"叁位\"],\"body\":\"一年六季的第三季，[晨风海](#idx-e419)带来充沛降水，东部平原产出攀至顶峰，各国军事行动与大规模物资调动亦多集中于此时。[仪式历](#idx-e366)同季作神焰，[艾瑟瑞姆](#idx-e500)[星历](#idx-e376)作牧宫月，[尼希尔](#idx-e523)[萨辛历](#idx-e364)作叁位。\"},{\"id\":\"e381\",\"title\":\"月曜日\",\"aliases\":[\"圣约翰日\"],\"body\":\"[通用历](#idx-e373)一周第一日，亦简称星期一；[仪式历](#idx-e366)作圣约翰日，对应天星[汐月](#idx-e550)，是四个劳作日之首。\"},{\"id\":\"e382\",\"title\":\"祝星节\",\"aliases\":[],\"body\":\"纪念保罗于四[元素](#idx-e54)耗尽时借[以太](#idx-e19)显现神迹，仅[公教](#idx-e110)庆祝，[牧首厅](#idx-e170)视公开庆祝为[异端](#idx-e147)之举。\"},{\"id\":\"e383\",\"title\":\"步米\",\"aliases\":[],\"body\":\"长度基本单位，源自[索拉瑞斯](#idx-e434)[军团](#idx-e299)标准行军步伐；一步米等于十分步米等于一百厘步米。\"},{\"id\":\"e390\",\"title\":\"界石\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)[军团](#idx-e299)沿主干道每千步所立的里程标记，亦为[陆里](#idx-e392)之所本。\"},{\"id\":\"e392\",\"title\":\"陆里\",\"aliases\":[],\"body\":\"长度单位，一陆里等于一千[步米](#idx-e383)，源自[军团](#idx-e299)沿主干道每千步立一[界石](#idx-e390)的传统。\"},{\"id\":\"e400\",\"title\":\"星度\",\"aliases\":[],\"body\":\"温度基本单位，源自[王家研究院](#idx-e254)的[魔矿](#idx-e74)[蚀刻](#idx-e79)环境控制需求，以纯水冰点为零、沸点为一百。\"},{\"id\":\"e417\",\"title\":\"神遴者\",\"aliases\":[\"神遴者阶层\"],\"body\":\"[尼希尔诸神信仰](#idx-e196)的[玛阿特](#idx-e195)称量中，心脏与宝石恰成平衡者。宗教解释中，他们身负引导众生的责任，受赐[秘术](#idx-e4)之力转生现世；作为一个阶层，神遴者垄断了酋邦一切政治职位，[教长](#idx-e204)、祭司、部落酋长与长老无一例外皆出于此。\"},{\"id\":\"e418\",\"title\":\"北门湾\",\"aliases\":[],\"body\":\"[凛冰洋](#idx-e428)伸入大陆中部的内湾，位于[忒奥西斯](#idx-e489)北境，是[索菲亚大运河](#idx-e432)的北端入口。[尼希尔](#idx-e523)所产[魔矿](#idx-e74)经凛冰洋航线抵此南下，是当代大陆最重要跨洋贸易干线上的节点。\"},{\"id\":\"e419\",\"title\":\"晨风海\",\"aliases\":[],\"body\":\"大陆东南方海域，洋流自东往西、往北持续输送暖湿气流深入内陆，是[阿布丹提亚大平原](#idx-e459)优良农业气候的关键成因。[马提尼河](#idx-e477)与[波特利亚河](#idx-e467)汇流后注入此海。\"},{\"id\":\"e420\",\"title\":\"大星洋\",\"aliases\":[],\"body\":\"大陆西南侧的宽广海域，洋流复杂多变；其偏暖洋流携湿润气流北上，遇[裂境山脉](#idx-e427)与[冠脊山脉](#idx-e424)抬升成雨，是西诺拉尼亚地区森林的核心水分来源。\"},{\"id\":\"e421\",\"title\":\"翡翠海峡\",\"aliases\":[],\"body\":\"大陆南方水域，全大陆航运最繁忙之处，[卡帕尼](#idx-e508)群岛与大陆本体之间的物流几乎全经于此，亦是[索菲亚大运河](#idx-e432)的南端出口。卡帕尼北部岛链水文条件优越、港口全年可用，是这条贸易干线的天然枢纽。\"},{\"id\":\"e424\",\"title\":\"冠脊山脉\",\"aliases\":[],\"body\":\"大陆规模最大的山脉系统，分北、西、东南、南四脉。北脉与西脉合围[尼希尔](#idx-e523)南侧边境，北脉与东南脉之间夹含[希尔文诺大森林](#idx-e534)，南脉则完全位于[索拉瑞斯](#idx-e434)境内。冠脊山脉北脉同时是大陆西部最重要的气候屏障，其北为尼希尔干旱荒漠，其南为[希尔文诺](#idx-e530)封闭湿润的万年密林，是大陆诸域中最极端的毗邻气候对照。\"},{\"id\":\"e427\",\"title\":\"裂境山脉\",\"aliases\":[],\"body\":\"西南-东北走向纵贯[索拉瑞斯](#idx-e434)中部的山脉，是帝国东西地形的核心分界线。其以东为[奥利提斯平原](#idx-e435)，落在其雨影区而气候偏干；以西地势平缓，[镜心湖](#idx-e441)居中。山脉沿线铁铜矿藏富集，是大陆冶铁产业最重要的原料来源；[索尔河](#idx-e453)发源于其南麓。\"},{\"id\":\"e428\",\"title\":\"凛冰洋\",\"aliases\":[],\"body\":\"大陆北方极寒洋，以东西向洋流为主，北部与东部全年有浮冰，渔业与运输活动仅集中于中西部海域；[尼希尔](#idx-e523)[魔矿](#idx-e74)出口的主干路线即自酋邦出海口北上进入此洋，东行抵[北门湾](#idx-e418)后南下入[大运河](#idx-e432)。\"},{\"id\":\"e432\",\"title\":\"索菲亚大运河\",\"aliases\":[\"大运河\"],\"body\":\"[忒奥西斯](#idx-e489)与[索拉瑞斯](#idx-e434)联合开凿的人工水道，1381–1388年历时七年建成，以[圣仪军](#idx-e307)的[神启魔法](#idx-e5)为主力，是[大陆历](#idx-e351)史上最庞大的人造工程。自[北门湾](#idx-e418)几乎垂直向南贯穿[西比尔平原](#idx-e498)，南端注入[翡翠海峡](#idx-e421)，将[凛冰洋](#idx-e428)与翡翠海峡物理贯通，从根本上重塑了大陆南北贸易格局。\"},{\"id\":\"e433\",\"title\":\"终末碑座\",\"aliases\":[\"诺万尼斯平原\"],\"body\":\"[索拉瑞斯](#idx-e434)东南部平原，原为黑暗时期[诺万尼斯王国](#idx-e544)故地。[大陆历](#idx-e351)758年[诺万尼斯大叛乱](#idx-e284)的[索瑞斯战役](#idx-e287)中，交战双方连续动用大规模[神启魔法](#idx-e5)引发[元素枯竭](#idx-e56)，平原自此化为死地，七百余年未见任何恢复迹象。索拉瑞斯、[忒奥西斯](#idx-e489)与[艾瑟瑞姆](#idx-e500)三国均划其为禁入区。该地区也是[诺万尼斯流放](#idx-e171)的行刑地。\"},{\"id\":\"e434\",\"title\":\"索拉瑞斯帝国\",\"aliases\":[\"索拉瑞斯\"],\"body\":\"位于大陆中西部的军事集权帝制大国，首都[索尔因维克图斯](#idx-e454)。1159年[索拉尔王国](#idx-e547)国王[阿利昂](#idx-e240)统一西大陆诸国、受牧首册封为首代[龙裔凯撒](#idx-e239)而立国。国土一千一百二十万平方[陆里](#idx-e392)，划为八个[军团行省](#idx-e237)，逾七成为群山与原始森林，人口约四千二百万。以[军团](#idx-e299)—行省一体化制度与[龙骑兵团](#idx-e296)著称，尊[正教](#idx-e150)为国教，逾八成公民为正教信徒；外交强势，与[阿布丹提亚](#idx-e458)共构当代大陆两极。\"},{\"id\":\"e435\",\"title\":\"奥利提斯平原\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)境内[裂境山脉](#idx-e427)以东呈东北—西南走向的狭长平原，是帝国最主要的农业区与人口集中地之一，首都[索尔因维克图斯](#idx-e454)位于其西南角。因落在裂境山脉雨影区，气候较[镜心湖](#idx-e441)区偏干。\"},{\"id\":\"e441\",\"title\":\"镜心湖\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)西部的湖泊，是帝国最重要的农业产区核心与人口最密集的区域之一。受[大星洋](#idx-e420)暖流直接调节，湖体又进一步平抑温差，是帝国内气候最温和宜居的地带。[纳赫尔河](#idx-e526)发源于此；东岸最大城市为[雷克西姆](#idx-e446)。\"},{\"id\":\"e442\",\"title\":\"镜心湖行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)八个[军团行省](#idx-e237)之一，位于帝国西部，环[镜心湖](#idx-e441)而设，首府[雷克西姆](#idx-e446)。\"},{\"id\":\"e446\",\"title\":\"雷克西姆\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)[镜心湖行省](#idx-e442)首府，[镜心湖](#idx-e441)东岸最大城市，建有[圣保罗](#idx-e122)大教堂。堂中无[圣骸](#idx-e123)，仅供奉据称是保罗生前所披的斗篷——保罗殉道之处据《保罗福音》末章推测邻近镜心湖，[正教会](#idx-e185)因此在雷克西姆建立大教堂。\"},{\"id\":\"e453\",\"title\":\"索尔河\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e434)境内河流。发源于[裂境山脉](#idx-e427)南麓，流经首都[索尔因维克图斯](#idx-e454)后向东南注入[艾瑟瑞姆](#idx-e500)境内的[坠星湖](#idx-e507)，是帝国重要的内河水系。\"},{\"id\":\"e454\",\"title\":\"索尔因维克图斯\",\"aliases\":[\"索尔因\"],\"body\":\"[索拉瑞斯帝国](#idx-e434)首都，通称索尔因，位于[奥利提斯平原](#idx-e435)西南角，[索尔河](#idx-e453)流经其间。是帝国的政治军事中心与最大城市，八位[行省总督](#idx-e256)每年赴此参加[叙职大会](#idx-e257)；城南设有[龙骑士团](#idx-e301)驻地与飞场。\"},{\"id\":\"e458\",\"title\":\"阿布丹提亚帝国\",\"aliases\":[\"阿布丹提亚\",\"丹提亚帝国\"],\"body\":\"通称丹提亚帝国，位于大陆东南方大平原的君主宪政制大国，首都[维里迪亚](#idx-e486)。386年卡立曼·费内尔统一诸国建立帝政，费内尔家族统治延续至今；两次[阿索战争](#idx-e268)失利后于1393年建[三柱议会](#idx-e245)，和平演变为君主立宪制国家。国土八百七十万平方[陆里](#idx-e392)，划为五个[帝政省](#idx-e233)和一个直辖省，人口逾六千二百万，为全大陆最多。大陆第一大粮食出口国与政治东极，约七成人口信奉[公教](#idx-e110)。\"},{\"id\":\"e459\",\"title\":\"阿布丹提亚大平原\",\"aliases\":[\"丹提亚大平原\"],\"body\":\"[阿布丹提亚帝国](#idx-e458)国土主体，大陆东部平原带规模最大的一部分，为全大陆最集中的农业核心地带。地势平坦开阔，水系极为发达，冲积土壤肥沃；中部核心区无霜期长而几无结冻，是帝国粮食、棉花与人口的集中所在，首都[维里迪亚](#idx-e486)居其腹地。\"},{\"id\":\"e465\",\"title\":\"波马里亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e458)境内位于[润溪湖](#idx-e480)西南方的重要城市。是大陆东部已知[元素](#idx-e54)丰度最高的城市之一，天然宜居且对元素[疏化](#idx-e39)抵抗力强。历史上曾为[正教会](#idx-e185)在东诺拉尼亚最重要的宗教驻地，[教会大分裂](#idx-e164)后成为[公教总会](#idx-e161)所在地；[公教会](#idx-e159)于十四世纪宣称寻得的[圣保罗](#idx-e122)[圣骸](#idx-e123)即供奉于波马里亚大教堂。该城亦是波马里亚[公爵领](#idx-e235)首府，同名[帝政省](#idx-e233)的省名即出于此。\"},{\"id\":\"e467\",\"title\":\"波特利亚河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e458)境内的主要河流之一，发源自[葛林沃尔克](#idx-e531)南脉南麓，与[马提尼河](#idx-e477)于大平原中部汇流后注入[晨风海](#idx-e419)，两河交汇处即首都[维里迪亚](#idx-e486)所在。\"},{\"id\":\"e468\",\"title\":\"布兰顿\",\"aliases\":[],\"body\":\"[布兰顿河](#idx-e469)东岸城市，位于河流中游。[第二次阿索战争](#idx-e274)后依《[布兰顿和约](#idx-e269)》割予[索拉瑞斯](#idx-e434)，此后一百二十余年是帝国边境最靠东的据点。1479年[三战](#idx-e275)开战之初为[阿布丹提亚](#idx-e458)夺取，此后终战未再易手，现归属于阿布丹提亚。\"},{\"id\":\"e469\",\"title\":\"布兰顿河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e458)境内河流。自北向南流经[西比尔平原](#idx-e498)东南缘，中段接纳一条自西而来的支流后折向东南，于[法拉利亚](#idx-e471)一带入海；[第二次阿索战争](#idx-e274)后其下游为阿索两国界河，《[布兰顿和约](#idx-e269)》即以此河命名，1479年[布兰顿战役](#idx-e270)的战场亦在其中下游两岸。\"},{\"id\":\"e471\",\"title\":\"法拉利亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e458)境内，[布兰顿河](#idx-e469)入[翡翠海峡](#idx-e421)河口处的港镇。\"},{\"id\":\"e477\",\"title\":\"马提尼河\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e458)第一大河，发源于[穗满湖](#idx-e483)，向东南流经大平原后与[波特利亚河](#idx-e467)汇流注入[晨风海](#idx-e419)，两河交汇处即首都[维里迪亚](#idx-e486)所在。\"},{\"id\":\"e480\",\"title\":\"润溪湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e458)双湖之东者，与[穗满湖](#idx-e483)并称双湖，是帝国北部水系的重要源头。湖运承担北部矿区矿产向核心区的输送；西南方为[元素丰地](#idx-e55)城市[波马里亚](#idx-e465)。\"},{\"id\":\"e483\",\"title\":\"穗满湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e458)双湖之西者，与[润溪湖](#idx-e480)并称双湖。湖区周边水草丰美，是全大陆最集中的规模化牧区；[马提尼河](#idx-e477)发源于此。\"},{\"id\":\"e486\",\"title\":\"维里迪亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e458)首都，位于[马提尼河](#idx-e477)与[波特利亚河](#idx-e467)交汇处、[丹提亚大平原](#idx-e459)腹地，是帝国政治文化中心，也是帝国最重要的内河航运枢纽之一。城市内歌剧院与画廊林立，素有\\\"艺术之都\\\"之称。\"},{\"id\":\"e487\",\"title\":\"维里迪亚直辖省\",\"aliases\":[\"首都直辖省\"],\"body\":\"[阿布丹提亚帝国](#idx-e458)六个一级行政区中唯一由皇室直辖者，亦称首都直辖省，位于帝国西南，含首都[维里迪亚](#idx-e486)及周边；境内不设贵族封地与[帝政省](#idx-e233)政府，是该国唯一的直辖省。\"},{\"id\":\"e489\",\"title\":\"忒奥西斯圣治领\",\"aliases\":[\"忒奥西斯\",\"圣治领\",\"圣领\"],\"body\":\"位于大陆中央北部的[正教会](#idx-e185)神权共和国，通称圣治领或圣领，首都[圣城索菲亚](#idx-e493)。1159年[索拉瑞斯](#idx-e434)开国[凯撒](#idx-e239)[阿利昂](#idx-e240)将帝国东部领土捐献给[大牧首](#idx-e152)而立，是正教会取得世俗领地后的政治实体。国土两百三十万平方[陆里](#idx-e392)，划为五个[都主教区](#idx-e157)，人口一千三百万。大牧首兼国家元首，[牧首厅](#idx-e170)为最高行政机构。\"},{\"id\":\"e491\",\"title\":\"潘克拉托\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e489)境内城市，[圣约翰都主教区](#idx-e495)的都教座城。[圣约翰](#idx-e126)殉道之地，[圣骸](#idx-e123)存于圣约翰大教堂。\"},{\"id\":\"e493\",\"title\":\"圣城索菲亚\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e489)圣领首都，[大牧首](#idx-e152)及[牧首厅](#idx-e170)所在地。相传为[唯一神](#idx-e138)降临之处，本为小村，圣领建立及[大运河](#idx-e432)开通后扩张为兼具政治、宗教与经济中心地位的大都会。是大陆中部已知最大的[元素丰地](#idx-e55)，也是[正教会](#idx-e185)立都于此的重要自然前提；索菲亚大教堂藏有据称是[圣约翰](#idx-e126)升天时所钉[十字架](#idx-e130)的原木碎片。\"},{\"id\":\"e495\",\"title\":\"圣约翰都主教区\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e489)圣领西南部[都主教区](#idx-e157)，以四[使徒](#idx-e129)之首[圣约翰](#idx-e126)命名，辖存有圣约翰[圣骸](#idx-e123)的[潘克拉托](#idx-e491)等地。\"},{\"id\":\"e498\",\"title\":\"西比尔平原\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e489)圣领所在的温带半干旱草原，地势平坦、天然水源匮乏，[索菲亚大运河](#idx-e432)贯通前农业条件相当有限；北延至[北门湾](#idx-e418)，是大陆南北贸易的关键咽喉。其南部于[二战](#idx-e274)后尽归[索拉瑞斯](#idx-e434)，后为索菲亚大运河纵切为二；运河以东的土地依[三战](#idx-e275)《[卡斯特鲁姆和约](#idx-e280)》归[阿布丹提亚](#idx-e458)，交接至今悬置，是阿索两国博弈的核心争议。\"},{\"id\":\"e500\",\"title\":\"艾瑟瑞姆王国\",\"aliases\":[\"艾瑟瑞姆\"],\"body\":\"位于大陆西南部的封建君主制国家，首都[阿斯托利亚](#idx-e501)，领土环抱[坠星湖](#idx-e507)。源出西诺拉尼亚黑暗时期南下避难的[星术](#idx-e8)学者聚落，十一世纪末[塔利瑞安](#idx-e223)联合十二城邦创建[大星术研究院](#idx-e231)，十三世纪前叶塔利兰娜受推举加冕为初代女王。国土约四百二十万平方[陆里](#idx-e392)，由[王冠领地](#idx-e253)、四大伯爵封邑与[特别仪式区](#idx-e249)构成，人口约一千八百万。以星术立国，[王家研究院](#idx-e254)[天星首席](#idx-e252)永由君主兼任，传统意义的[施法者](#idx-e38)占人口逾半。\"},{\"id\":\"e501\",\"title\":\"阿斯托利亚\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e500)首都，位于[坠星湖](#idx-e507)南端[瑟蒂尔河](#idx-e505)出湖处，由[大陆历](#idx-e351)894年南下避难的[星术](#idx-e8)学者聚落发展而成，[王家研究院](#idx-e254)即设于此。城名源出[星空学派](#idx-e7)早期所用的 Astralis（\\\"属星的\\\"），后世音变作 Astoria，旧拼法今仅见于研究院的仪式文书。\"},{\"id\":\"e505\",\"title\":\"瑟蒂尔河\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e500)境内河流。由[坠星湖](#idx-e507)南端出发，向南流经艾瑟瑞姆注入[大星洋](#idx-e420)，首都[阿斯托利亚](#idx-e501)位于其北端出湖处。\"},{\"id\":\"e507\",\"title\":\"坠星湖\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e500)的地理中心，首都[阿斯托利亚](#idx-e501)位于其南端出湖口。[索尔河](#idx-e453)自[索拉瑞斯](#idx-e434)方向注入湖北端，[瑟蒂尔河](#idx-e505)由南端流出南向[大星洋](#idx-e420)；湖运依托[星术](#idx-e8)船只，是沿岸城市群最重要的内部贸易路线。\"},{\"id\":\"e508\",\"title\":\"卡帕尼诸公联合\",\"aliases\":[\"卡帕尼\",\"卡帕尼联邦\"],\"body\":\"又称卡帕尼联邦，位于大陆南部群岛的公国联邦制国家，由四成员公国与[北部特别贸易区](#idx-e511)组成，四公国各有首府，联邦首都为[阿卡帕尼](#idx-e509)公国的[伊索拉韦尔德](#idx-e522)。1356年[第二次阿索战争](#idx-e274)后，四公爵于[米德可尔](#idx-e518)会晤宣布脱离[阿布丹提亚](#idx-e458)独立。国土约二百五十万平方[陆里](#idx-e392)，散布于七十八座岛屿，人口约九百八十万。联邦以商贸与金融立国，外交奉行离岸平衡，热带群岛旅游业亦非常发达。\"},{\"id\":\"e509\",\"title\":\"阿卡帕尼\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e508)四公国之一，由同名公爵世袭领有，核心领地为[阿卡帕尼岛](#idx-e510)，首府[伊索拉韦尔德](#idx-e522)亦为联邦首都。\"},{\"id\":\"e510\",\"title\":\"阿卡帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e508)群岛南部主岛区的核心岛屿之一，与[梅尔帕尼岛](#idx-e516)合计聚居全联邦逾半人口。\"},{\"id\":\"e511\",\"title\":\"北部特别贸易区\",\"aliases\":[\"特贸区\",\"北部特贸区\"],\"body\":\"[卡帕尼联邦](#idx-e508)于1382年于群岛北部岛链设立的特别经济区，由五十八座岛屿及[自由港](#idx-e349)组成，适用独立的[特区商法典](#idx-e250)与优惠贸易税率，设[管理局](#idx-e236)与[仲裁所](#idx-e264)自治，是大陆各国商人自由开展贸易的核心地带，也是联邦金融机构最密集之处。\"},{\"id\":\"e516\",\"title\":\"梅尔帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e508)群岛南部主岛区的核心岛屿之一，与[阿卡帕尼岛](#idx-e510)合计聚居全联邦逾半人口。\"},{\"id\":\"e518\",\"title\":\"米德可尔\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e508)境内地名。1356年[第二次阿索战争](#idx-e274)后，卡帕尼四公爵于此会晤宣布建立诸公联合，是联邦独立的历史象征地点。\"},{\"id\":\"e522\",\"title\":\"伊索拉韦尔德\",\"aliases\":[\"伊索拉\"],\"body\":\"[卡帕尼诸公联合](#idx-e508)首都，通称伊索拉，同时是[阿卡帕尼](#idx-e509)公国首府，四公国的政治核心所在地。当地作坊以镀银工艺见长，[索利亚商会](#idx-e343)创办于此。\"},{\"id\":\"e523\",\"title\":\"尼希尔伊玛目酋邦\",\"aliases\":[\"尼希尔\",\"尼希尔酋邦\"],\"body\":\"通称尼希尔酋邦，位于大陆西北角沙漠绿洲与两河流域的神权部落联邦国家，首都[阿尔努尔](#idx-e524)。五世纪[萨阿尔血王朝](#idx-e545)覆灭后，诸部酋长于阿尔努尔会盟，推举诸神大祭司为[伊玛目教长](#idx-e204)，成立酋邦。尼希尔国土五百八十万平方[陆里](#idx-e392)，由[诸神圣土](#idx-e207)与八部落领地构成，人口约一千八百万。酋邦是当今大陆唯一合法保有奴隶制的国家，社会等级高度固化。\"},{\"id\":\"e524\",\"title\":\"阿尔努尔\",\"aliases\":[],\"body\":\"[尼希尔伊玛目酋邦](#idx-e523)首都兼伊玛目城，位于两河流域核心地带，属[教长](#idx-e204)直辖的[诸神圣土](#idx-e207)。422年诸部酋长于此会盟建立部落联邦体制、推举首任伊玛目教长；城中六神各有神庙，另有教长主持全酋邦最隆重仪典的[大神庙](#idx-e190)，[酋长会议](#idx-e244)亦每年在此召开。\"},{\"id\":\"e525\",\"title\":\"哈亚特河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e523)两河之东河，发源于[冠脊山脉](#idx-e424)西脉北麓的积雪融水，自南向北流经酋邦西部，于[塔巴特](#idx-e529)与[纳赫尔河](#idx-e526)交汇后入[凛冰洋](#idx-e428)。其洪汛带来上游冲积土并补充土壤水分，随洪水消退而展开的播种是全酋邦农业的年度起点。\"},{\"id\":\"e526\",\"title\":\"纳赫尔河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e523)两河之西河，发源于[索拉瑞斯](#idx-e434)境内的[镜心湖](#idx-e441)，自南向北流经酋邦西部，于[塔巴特](#idx-e529)与[哈亚特河](#idx-e525)交汇。因源头在索拉瑞斯境内，[诸神信仰](#idx-e196)第一季的西祭典历来只能在靠近南边境的城市勉强举行，这也是尼索边境关系长期恶劣的原因之一。\"},{\"id\":\"e527\",\"title\":\"沙阿万大魔矿\",\"aliases\":[\"大魔矿\"],\"body\":\"位于[尼希尔](#idx-e523)东部沙阿万沙漠地下，全大陆最大的单一[魔矿](#idx-e74)产地，年产量占大陆总量逾半，[高品级魔矿](#idx-e68)更占大陆产出八成以上，几乎构成事实垄断。矿井多由[神遴者](#idx-e417)以[秘术](#idx-e4)开凿，此后的采掘、支护、排水与转运则由奴隶以常规工具承担。各国对尼希尔的结构性经济依赖即根源于此。\"},{\"id\":\"e528\",\"title\":\"沙阿万大沙漠\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e523)东部广袤沙漠，是大陆最严酷的干旱地带，地表资源匮乏，昼夜温差可超三十[星度](#idx-e400)，仅有[冠脊山脉](#idx-e424)北脉北麓发源的两条小型沙漠河流维系着若干绿洲；地下则蕴藏[沙阿万大魔矿](#idx-e527)。\"},{\"id\":\"e529\",\"title\":\"塔巴特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e523)西部[纳赫尔河](#idx-e526)与[哈亚特河](#idx-e525)的交汇处，是两河流域的重要节点，两河在此汇合后继续北行入[凛冰洋](#idx-e428)。\"},{\"id\":\"e530\",\"title\":\"希尔文诺\",\"aliases\":[],\"body\":\"大陆精灵族裔及其文明与家园的统称，位于[冠脊山脉](#idx-e424)间的封闭盆地，由二十余个[氏族](#idx-e216)部落构成，最大聚落为[大圣树](#idx-e219)所在的[希尔文尼亚](#idx-e533)。其实际控制面积以大森林为界约一百二十万平方[陆里](#idx-e392)，人口一般认为不超过一百万。制度植根于大圣树信仰，每三十年召开[万叶庭](#idx-e218)全体表决，[叶络枢机院](#idx-e221)理日常行政与对外事务。1132年与人类首次接触，此后长期保持中立与封闭，被各国视为大陆事务的天然缓冲区与仲裁者。\"},{\"id\":\"e531\",\"title\":\"葛林沃尔克\",\"aliases\":[],\"body\":\"大陆东北角地区，由南北两支山脉夹峙高山密林构成，北部为雪原冰川。是大陆地理信息最匮乏的区域，据传其可能存在智慧种族与独立的[魔法](#idx-e3)体系，但学界均无可靠资料。\"},{\"id\":\"e533\",\"title\":\"希尔文尼亚\",\"aliases\":[],\"body\":\"[希尔文诺大圣树](#idx-e219)所在之地，精灵族规模最大的聚居点，[万叶庭](#idx-e218)与[叶络枢机院](#idx-e221)所在。据推测是大陆最优越的[元素丰地](#idx-e55)之一。\"},{\"id\":\"e534\",\"title\":\"希尔文诺大森林\",\"aliases\":[],\"body\":\"精灵族世代定居之地，坐落于[冠脊山脉](#idx-e424)北脉与东南脉合围而成的山间盆地，是大陆封闭程度最高的区域之一，实际控制面积约一百二十万平方[陆里](#idx-e392)。山脉双重合围造就封闭湿润的气候，孕育大量大陆其他地区所没有的特有动植物；盆地开口朝向东南，东南脉中部的天然隘口是[林缘议厅](#idx-e281)所在地。\"},{\"id\":\"e538\",\"title\":\"冠阳\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之首，[星空学派](#idx-e7)完整名\\\"主序·冠阳\\\"，即太阳。[源星](#idx-e59)属权威、创造与审判；[正教](#idx-e150)神学中象征[唯一神](#idx-e138)，对应[仪式历](#idx-e366)[圣神日](#idx-e363)与[通用历](#idx-e373)日曜日。\"},{\"id\":\"e539\",\"title\":\"烬铸星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"熔炉·烬铸星\\\"。[源星](#idx-e59)属转化、破坏与锻造，常被视为天球之上的锻造炉象征；[正教](#idx-e150)神学上象征[圣约瑟](#idx-e127)，对应[烬曜日](#idx-e356)。\"},{\"id\":\"e544\",\"title\":\"诺万尼斯王国\",\"aliases\":[],\"body\":\"西诺拉尼亚[七王约](#idx-e285)时期存在的王国政权。八世纪该王国与[龙骑士](#idx-e300)群体结盟发动叛乱、试图驱逐[正教会](#idx-e185)势力并统一七王邦联。758年[索瑞斯战役](#idx-e287)中交战双方滥用[神启魔法](#idx-e5)引发[元素枯竭](#idx-e56)，王国所在[诺万尼斯平原](#idx-e433)永久化为死地，即今终末碑座地区。\"},{\"id\":\"e545\",\"title\":\"萨阿尔血王朝\",\"aliases\":[],\"body\":\"古代[尼希尔](#idx-e523)地区存在的政权，由掌握[秘术](#idx-e4)的萨阿尔部落于[大陆历](#idx-e351)元前二世纪建立。该部自[沙阿万大沙漠](#idx-e528)西侵，用八年统一西尼希尔诸部，王朝延续至五世纪。其以自身信仰强行替代西尼希尔原有神话体系，奠定了尼希尔日后的[诸神信仰](#idx-e196)与政教结构。史籍普遍估算，王朝治下因屠杀或献祭而死者逾四百万。该王朝在五世纪大起义中覆灭，但其制度主体却被422年的[阿尔努尔](#idx-e524)会盟所承袭。\"},{\"id\":\"e547\",\"title\":\"索拉尔王国\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e434)的前身，于西诺拉尼亚[黑暗时代](#idx-e278)中崛起的王国。1159年，索拉尔国王[阿利昂](#idx-e240)统一西大陆诸国、受牧首册封为首位[龙裔凯撒](#idx-e239)，索拉瑞斯帝国由此建立。现代通用度量衡的长度单位[步米](#idx-e383)与[陆里](#idx-e392)即源自索拉尔王国的[军团](#idx-e299)行军传统。\"},{\"id\":\"e550\",\"title\":\"汐月\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"银杯·汐月\\\"，即月亮。[源星](#idx-e59)属容纳、精神与教导；[正教](#idx-e150)神学上象征[圣约翰](#idx-e126)，对应[月曜日](#idx-e381)。[艾瑟瑞姆](#idx-e500)[星历](#idx-e376)即以其盈亏循环为月。\"},{\"id\":\"e554\",\"title\":\"织虹星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"脉生·织虹星\\\"。[源星](#idx-e59)属修复、治疗与幻象；[正教](#idx-e150)神学上象征[圣保罗](#idx-e122)，对应[虹曜日](#idx-e353)。\"},{\"id\":\"e555\",\"title\":\"仲裁星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e43)之一，[星空学派](#idx-e7)完整名\\\"律令·仲裁星\\\"，是星空中最亮且运动最明显的三颗星体之一。[源星](#idx-e59)属秩序、守护与契约；[正教](#idx-e150)神学上象征[圣伊琳娜](#idx-e125)，对应[裁曜日](#idx-e350)。\"}]}}]}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"15:I[27201,[\"/Nurania/next/static/chunks/ff1a16fafef87110.js\",\"/Nurania/next/static/chunks/0bd6498bda341889.js\"],\"IconMark\"]\nc:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"唯一神信仰小考 | A Brief Study on the One God Faith\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"进入圣领已经一季有余，这阵子让笔者印象最深的是，在这片土地上人们的时间是和信仰紧紧绑定在一起的。每五日，礼拜的钟声便把市集与农事叫停一次；年季的名称是垂恩和神焰，不是清和和炎阳；问起今天是哪一天，得到的回答常常是\\\"离某个节庆还有几日\\\"。在圣…\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"唯一神信仰小考 | A Brief Study on the One God Faith\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"cont
