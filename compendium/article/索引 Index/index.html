\":\"沙阿万大沙漠\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)东部广袤沙漠，是大陆最严酷的干旱地带，地表资源匮乏，昼夜温差可超三十[星度](#idx-e395)，仅有[冠脊山脉](#idx-e419)北脉北麓发源的两条小型沙漠河流维系着若干绿洲；地下则蕴藏[沙阿万大魔矿](#idx-e521)。\"},{\"id\":\"e523\",\"title\":\"塔巴特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)西部[纳赫尔河](#idx-e520)与[哈亚特河](#idx-e519)的交汇处，是两河流域的重要节点，两河在此汇合后继续北行入[凛冰洋](#idx-e423)。\"},{\"id\":\"e524\",\"title\":\"希尔文诺\",\"aliases\":[],\"body\":\"大陆精灵族裔及其文明与家园的统称，位于[冠脊山脉](#idx-e419)间的封闭盆地，由二十余个[氏族](#idx-e211)部落构成，最大聚落为[大圣树](#idx-e214)所在的[希尔文尼亚](#idx-e527)。其实际控制面积以大森林为界约一百二十万平方[陆里](#idx-e387)，人口一般认为不超过一百万。制度植根于大圣树信仰，每三十年召开[万叶庭](#idx-e213)全体表决，[叶络枢机院](#idx-e216)理日常行政与对外事务。1132年与人类首次接触，此后长期保持中立与封闭，被各国视为大陆事务的天然缓冲区与仲裁者。\"},{\"id\":\"e525\",\"title\":\"葛林沃尔克\",\"aliases\":[],\"body\":\"大陆东北角地区，由南北两支山脉夹峙高山密林构成，北部为雪原冰川。是大陆地理信息最匮乏的区域，据传其可能存在智慧种族与独立的魔法体系，但学界均无可靠资料。\"},{\"id\":\"e526\",\"title\":\"卡里司泰\",\"aliases\":[],\"body\":\"[冠脊山脉](#idx-e419)东南支脉中部、[希尔文诺](#idx-e524)与[忒奥西斯](#idx-e483)边境处的城市，位于[林缘议厅](#idx-e276)以东不远，是全大陆唯一的[自由城市](#idx-e261)。行政上不受任何人类政权管辖，由各国贸易机构负责人与希尔文诺精灵特别代表组成的[城务会](#idx-e222)共同治理，须保持完全去武装化且不具外交主体地位。职能集中于贸易运输与货物仓储，亦是大陆学者旅居考察、各方非正式接触之所，更是多数[落叶精灵](#idx-e411)进入人类社会的第一站；艾瑟瑞姆[王家研究院](#idx-e249)在此设有特别研究所。\"},{\"id\":\"e527\",\"title\":\"希尔文尼亚\",\"aliases\":[],\"body\":\"[希尔文诺大圣树](#idx-e214)所在之地，精灵族规模最大的聚居点，[万叶庭](#idx-e213)与[叶络枢机院](#idx-e216)所在。据推测是大陆最优越的[元素丰地](#idx-e52)之一。\"},{\"id\":\"e528\",\"title\":\"希尔文诺大森林\",\"aliases\":[],\"body\":\"精灵族世代定居之地，坐落于[冠脊山脉](#idx-e419)北脉与东南脉合围而成的山间盆地，是大陆封闭程度最高的区域之一，实际控制面积约一百二十万平方[陆里](#idx-e387)。山脉双重合围造就封闭湿润的气候，孕育大量大陆其他地区所没有的特有动植物；盆地开口朝向东南，东南脉中部的天然隘口是[林缘议厅](#idx-e276)所在地。\"},{\"id\":\"e529\",\"title\":\"波江宫\",\"aliases\":[],\"body\":\"[十二天宫](#idx-e35)之一，属黄道六宫，[星历](#idx-e371)[波宫月](#idx-e366)取其简称。\"},{\"id\":\"e530\",\"title\":\"船帆宫\",\"aliases\":[],\"body\":\"[十二天宫](#idx-e35)之一，属黄道六宫，[星历](#idx-e371)[船宫月](#idx-e357)取其简称。\"},{\"id\":\"e531\",\"title\":\"大熊宫\",\"aliases\":[],\"body\":\"[十二天宫](#idx-e35)之一。\"},{\"id\":\"e532\",\"title\":\"冠阳\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之首，[星空学派](#idx-e6)完整名\\\"主序·冠阳\\\"，即太阳。[源星](#idx-e56)属权威、创造与审判；[正教](#idx-e146)神学中象征[唯一神](#idx-e135)，对应[仪式历](#idx-e361)[圣神日](#idx-e358)与[通用历](#idx-e368)日曜日。\"},{\"id\":\"e533\",\"title\":\"烬铸星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"熔炉·烬铸星\\\"。[源星](#idx-e56)属转化、破坏与锻造，常被视为天球之上的锻造炉象征；[正教](#idx-e146)神学上象征[圣约瑟](#idx-e124)，对应[烬曜日](#idx-e351)。\"},{\"id\":\"e534\",\"title\":\"卡帕尼王国\",\"aliases\":[],\"body\":\"367年[卡帕尼](#idx-e502)群岛各城邦统一而成的王国。自712年起与[阿布丹提亚](#idx-e452)通商，723年签订《[梅尔卡托条约](#idx-e278)》后成为其附庸，986年正式并入阿布丹提亚为帝国第七省；今卡帕尼四公国即溯源于并入后所设的四个[公爵领](#idx-e230)。\"},{\"id\":\"e535\",\"title\":\"冕冠宫\",\"aliases\":[],\"body\":\"[十二天宫](#idx-e35)之一，属黄道六宫，[星历](#idx-e371)[冕宫月](#idx-e350)取其简称。\"},{\"id\":\"e536\",\"title\":\"牧夫宫\",\"aliases\":[],\"body\":\"[十二天宫](#idx-e35)之一，属黄道六宫，[星历](#idx-e371)[牧宫月](#idx-e374)取其简称。\"},{\"id\":\"e537\",\"title\":\"南鱼宫\",\"aliases\":[],\"body\":\"[十二天宫](#idx-e35)之一。\"},{\"id\":\"e538\",\"title\":\"诺万尼斯王国\",\"aliases\":[],\"body\":\"西诺拉尼亚[七王约](#idx-e280)时期存在的王国政权。八世纪该王国与[龙骑士](#idx-e295)群体结盟发动叛乱、试图驱逐[正教会](#idx-e181)势力并统一七王邦联。758年[索瑞斯战役](#idx-e282)中交战双方滥用[神启魔法](#idx-e4)引发[元素枯竭](#idx-e53)，王国所在[诺万尼斯平原](#idx-e428)永久化为死地，即今终末碑座地区。\"},{\"id\":\"e539\",\"title\":\"萨阿尔血王朝\",\"aliases\":[],\"body\":\"古代[尼希尔](#idx-e517)地区存在的政权，由掌握[秘术](#idx-e3)的萨阿尔部落于[大陆历](#idx-e346)元前二世纪建立。该部自[沙阿万大沙漠](#idx-e522)西侵，用八年统一西尼希尔诸部，王朝延续至五世纪。其以自身信仰强行替代西尼希尔原有神话体系，奠定了尼希尔日后的诸神信仰与政教结构。史籍普遍估算，王朝治下因屠杀或献祭而死者逾四百万。该王朝在五世纪大起义中覆灭，但其制度主体却被422年的[阿尔努尔](#idx-e518)会盟所承袭。\"},{\"id\":\"e540\",\"title\":\"竖琴宫\",\"aliases\":[],\"body\":\"[十二天宫](#idx-e35)之一，属黄道六宫，[星历](#idx-e371)[琴宫月](#idx-e353)取其简称。\"},{\"id\":\"e541\",\"title\":\"索拉尔王国\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)的前身，于西诺拉尼亚[黑暗时代](#idx-e273)中崛起的王国。1159年，索拉尔国王[阿利昂](#idx-e235)统一西大陆诸国、受牧首册封为首位[龙裔凯撒](#idx-e234)，索拉瑞斯帝国由此建立。现代通用度量衡的长度单位[步米](#idx-e378)与[陆里](#idx-e387)即源自索拉尔王国的[军团](#idx-e294)行军传统。\"},{\"id\":\"e542\",\"title\":\"天箭宫\",\"aliases\":[],\"body\":\"[十二天宫](#idx-e35)之一。\"},{\"id\":\"e543\",\"title\":\"天鹰宫\",\"aliases\":[],\"body\":\"[十二天宫](#idx-e35)之一，属黄道六宫，[星历](#idx-e371)[天宫月](#idx-e356)取其简称，星历元日即太阳进入此宫的第一天。其[以太流量](#idx-e50)浮偏在各宫中最高，相关[星术](#idx-e7)的[弛豫时间](#idx-e14)表现亦最为特殊。\"},{\"id\":\"e544\",\"title\":\"汐月\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"银杯·汐月\\\"，即月亮。[源星](#idx-e56)属容纳、精神与教导；[正教](#idx-e146)神学上象征[圣约翰](#idx-e123)，对应[月曜日](#idx-e376)。艾瑟瑞姆[星历](#idx-e371)即以其盈亏循环为月。\"},{\"id\":\"e545\",\"title\":\"小熊宫\",\"aliases\":[],\"body\":\"[十二天宫](#idx-e35)之一。\"},{\"id\":\"e546\",\"title\":\"星后宫\",\"aliases\":[],\"body\":\"[十二天宫](#idx-e35)之一。\"},{\"id\":\"e547\",\"title\":\"英仙宫\",\"aliases\":[],\"body\":\"[十二天宫](#idx-e35)之一。\"},{\"id\":\"e548\",\"title\":\"织虹星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"脉生·织虹星\\\"。[源星](#idx-e56)属修复、治疗与幻象；[正教](#idx-e146)神学上象征[圣保罗](#idx-e119)，对应[虹曜日](#idx-e348)。\"},{\"id\":\"e549\",\"title\":\"仲裁星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"律令·仲裁星\\\"，是星空中最亮且运动最明显的三颗星体之一。[源星](#idx-e56)属秩序、守护与契约；[正教](#idx-e146)神学上象征[圣伊琳娜](#idx-e122)，对应[裁曜日](#idx-e345)。\"}],\"indexOutline\":{\"intro\":\"\",\"outro\":\"\",\"parts\":[{\"title\":\"甲 专有名词\",\"categories\":[{\"title\":\"一 魔法学派与流派\",\"entryIds\":[\"e0\",\"e1\",\"e2\",\"e3\",\"e4\",\"e5\",\"e6\",\"e7\",\"e8\"]},{\"title\":\"二 魔法机理与现象\",\"entryIds\":[\"e9\",\"e10\",\"e11\",\"e12\",\"e13\",\"e14\",\"e15\",\"e16\",\"e17\",\"e18\",\"e19\",\"e20\",\"e21\",\"e22\",\"e23\",\"e24\",\"e25\",\"e26\",\"e27\",\"e28\",\"e29\",\"e30\",\"e31\",\"e32\",\"e33\",\"e34\",\"e35\",\"e36\",\"e37\",\"e38\",\"e39\",\"e40\",\"e41\",\"e42\",\"e43\",\"e44\",\"e45\",\"e46\",\"e47\",\"e48\",\"e49\",\"e50\",\"e51\",\"e52\",\"e53\",\"e54\",\"e55\",\"e56\",\"e57\",\"e58\",\"e59\",\"e60\"]},{\"title\":\"三 魔矿、蚀刻与星术器物\",\"entryIds\":[\"e61\",\"e62\",\"e63\",\"e64\",\"e65\",\"e66\",\"e67\",\"e68\",\"e69\",\"e70\",\"e71\",\"e72\",\"e73\",\"e74\",\"e75\",\"e76\",\"e77\",\"e78\",\"e79\",\"e80\",\"e81\",\"e82\",\"e83\",\"e84\",\"e85\",\"e86\",\"e87\",\"e88\",\"e89\",\"e90\",\"e91\",\"e92\",\"e93\",\"e94\",\"e95\"]},{\"title\":\"四 唯一神信仰\",\"entryIds\":[\"e96\",\"e97\",\"e98\",\"e99\",\"e100\",\"e101\",\"e102\",\"e103\",\"e104\",\"e105\",\"e106\",\"e107\",\"e108\",\"e109\",\"e110\",\"e111\",\"e112\",\"e113\",\"e114\",\"e115\",\"e116\",\"e117\",\"e118\",\"e119\",\"e120\",\"e121\",\"e122\",\"e123\",\"e124\",\"e125\",\"e126\",\"e127\",\"e128\",\"e129\",\"e130\",\"e131\",\"e132\",\"e133\",\"e134\",\"e135\",\"e136\",\"e137\",\"e138\",\"e139\",\"e140\",\"e141\",\"e142\",\"e143\",\"e144\",\"e145\",\"e146\"]},{\"title\":\"五 教会制度与审判庭\",\"entryIds\":[\"e147\",\"e148\",\"e149\",\"e150\",\"e151\",\"e152\",\"e153\",\"e154\",\"e155\",\"e156\",\"e157\",\"e158\",\"e159\",\"e160\",\"e161\",\"e162\",\"e163\",\"e164\",\"e165\",\"e166\",\"e167\",\"e168\",\"e169\",\"e170\",\"e171\",\"e172\",\"e173\",\"e174\",\"e175\",\"e176\",\"e177\",\"e178\",\"e179\",\"e180\",\"e181\",\"e182\",\"e183\"]},{\"title\":\"六 尼希尔诸神信仰\",\"entryIds\":[\"e184\",\"e185\",\"e186\",\"e187\",\"e188\",\"e189\",\"e190\",\"e191\",\"e192\",\"e193\",\"e194\",\"e195\",\"e196\",\"e197\",\"e198\",\"e199\",\"e200\",\"e201\",\"e202\"]},{\"title\":\"七 圣树信仰与精灵制度\",\"entryIds\":[\"e203\",\"e204\",\"e205\",\"e206\",\"e207\",\"e208\",\"e209\",\"e210\",\"e211\",\"e212\",\"e213\",\"e214\",\"e215\",\"e216\",\"e217\"]},{\"title\":\"八 政体与国家机构\",\"entryIds\":[\"e218\",\"e219\",\"e220\",\"e221\",\"e222\",\"e223\",\"e224\",\"e225\",\"e226\",\"e227\",\"e228\",\"e229\",\"e230\",\"e231\",\"e232\",\"e233\",\"e234\",\"e235\",\"e236\",\"e237\",\"e238\",\"e239\",\"e240\",\"e241\",\"e242\",\"e243\",\"e244\",\"e245\",\"e246\",\"e247\",\"e248\",\"e249\",\"e250\",\"e251\",\"e252\",\"e253\",\"e254\",\"e255\",\"e256\",\"e257\",\"e258\",\"e259\",\"e260\",\"e261\",\"e262\"]},{\"title\":\"九 国际制度、条约与历史事件\",\"entryIds\":[\"e263\",\"e264\",\"e265\",\"e266\",\"e267\",\"e268\",\"e269\",\"e270\",\"e271\",\"e272\",\"e273\",\"e274\",\"e275\",\"e276\",\"e277\",\"e278\",\"e279\",\"e280\",\"e281\",\"e282\",\"e283\"]},{\"title\" e463\",\"e464\",\"e465\",\"e466\",\"e467\",\"e468\",\"e469\",\"e470\",\"e471\",\"e472\",\"e473\",\"e474\",\"e475\",\"e476\",\"e477\",\"e478\",\"e479\",\"e480\",\"e481\",\"e482\"]},{\"title\":\"忒奥西斯圣领\",\"entryIds\":[\"e483\",\"e484\",\"e485\",\"e486\",\"e487\",\"e488\",\"e489\",\"e490\",\"e491\",\"e492\",\"e493\"]},{\"title\":\"艾瑟瑞姆王国\",\"entryIds\":[\"e494\",\"e495\",\"e496\",\"e497\",\"e498\",\"e499\",\"e500\",\"e501\"]},{\"title\":\"卡帕尼诸公联合\",\"entryIds\":[\"e502\",\"e503\",\"e504\",\"e505\",\"e506\",\"e507\",\"e508\",\"e509\",\"e510\",\"e511\",\"e512\",\"e513\",\"e514\",\"e515\",\"e516\"]},{\"title\":\"尼希尔伊玛目酋邦\",\"entryIds\":[\"e517\",\"e518\",\"e519\",\"e520\",\"e521\",\"e522\",\"e523\"]},{\"title\":\"希尔文诺与葛林沃尔克\",\"entryIds\":[\"e524\",\"e525\",\"e526\",\"e527\",\"e528\"]},{\"title\":\"历史政体与天体\",\"entryIds\":[\"e529\",\"e530\",\"e531\",\"e532\",\"e533\",\"e534\",\"e535\",\"e536\",\"e537\",\"e538\",\"e539\",\"e540\",\"e541\",\"e542\",\"e543\",\"e544\",\"e545\",\"e546\",\"e547\",\"e548\",\"e549\"]}]}]}}}]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"11:I[27201,[\"/Nurania/next/static/chunks/ff1a16fafef87110.js\",\"/Nurania/next/static/chunks/0bd6498bda341889.js\"],\"IconMark\"]\na:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"索引 | Index\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"纪念塞勒内斯·尤里梅尔诞辰150周年系列文集\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/Nurania/icon.svg?icon.986a92ce.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L11\",\"3\",{}]]\n"])</script></body></html>
