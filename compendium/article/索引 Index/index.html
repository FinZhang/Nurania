"title\":\"在人间·上\",\"titleEn\":\"Coming of Age·In the Human World I\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/在人间·下\",\"title\":\"在人间·下\",\"titleEn\":\"Coming of Age·In the Human World II\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/送别\",\"title\":\"送别\",\"titleEn\":\"The Farewell\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/铸币的两面\",\"title\":\"铸币的两面\",\"titleEn\":\"Two Sides of a Nicat\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"索引 Index\",\"title\":\"索引\",\"titleEn\":\"Index\",\"isArticle\":true}],\"currentSlug\":\"索引 Index\",\"article\":{\"slug\":\"索引 Index\",\"title\":\"索引\",\"titleEn\":\"Index\",\"content\":\"\",\"indexTerms\":[{\"id\":\"e0\",\"title\":\"龙语\",\"aliases\":[],\"body\":\"[龙族魔法](#idx-e1)[术式](#idx-e38)所用的咏唱体系，结构特殊，元素消耗极低而[精神力](#idx-e23)消耗极高。\"},{\"id\":\"e1\",\"title\":\"龙族魔法\",\"aliases\":[],\"body\":\"巨龙及龙族亚种所用的种族魔法，学界归类为[神启魔法](#idx-e4)的一种。\"},{\"id\":\"e2\",\"title\":\"秘术式\",\"aliases\":[],\"body\":\"[尼希尔秘术](#idx-e3)施法所用的特殊仪式，将祭品[构成元素](#idx-e18)解离为[无属性元素流](#idx-e42)并转化为魔法。\"},{\"id\":\"e3\",\"title\":\"尼希尔秘术\",\"aliases\":[\"秘术\"],\"body\":\"[尼希尔](#idx-e517)统治阶级独有的魔法体系，简称秘术，以等价交换为原理，解离祭品的[构成元素](#idx-e18)为力量。\"},{\"id\":\"e4\",\"title\":\"神启祷言\",\"aliases\":[\"祷言\",\"神启魔法\"],\"body\":\"[神启学派](#idx-e5)对自身魔法的称呼，简称祷言；亦名神启魔法。\"},{\"id\":\"e5\",\"title\":\"神启学派\",\"aliases\":[],\"body\":\"以[唯一神](#idx-e135)所借权柄使用魔法的学派，编织[术式](#idx-e38)调动环境中游离态的[四大元素](#idx-e39)。\"},{\"id\":\"e6\",\"title\":\"星空学派\",\"aliases\":[],\"body\":\"以[第五元素](#idx-e17)以太的显现与外化解释魔法的学派，[内化](#idx-e30)以太于体内再[显化](#idx-e44)为魔法。\"},{\"id\":\"e7\",\"title\":\"以太星术\",\"aliases\":[\"星术\",\"星空魔法\"],\"body\":\"[星空学派](#idx-e6)对自身魔法的自称，简称星术；亦名星空魔法。狭义专指各类魔法对应的[大星轨](#idx-e16)走势。\"},{\"id\":\"e8\",\"title\":\"自然魔法\",\"aliases\":[\"精灵魔法\",\"圣树魔法\"],\"body\":\"精灵族与生俱来的法术能力，源自与[大圣树](#idx-e214)的契约连接；亦称精灵魔法、圣树魔法。\"},{\"id\":\"e9\",\"title\":\"奥韦纳尔·安柯伦坦\",\"aliases\":[\"安柯伦坦\"],\"body\":\"艾瑟瑞姆[天星师](#idx-e246)，1304年提出智慧生物出生时的[大星轨](#idx-e16)图像决定其[仪式星轨](#idx-e49)特征，且该特征恰合[源星](#idx-e56)五分类，[丝黛兰尔](#idx-e40)的分类法由此成为公认标准。\"},{\"id\":\"e10\",\"title\":\"巴伊尔类\",\"aliases\":[],\"body\":\"[星术](#idx-e7)[术式](#idx-e38)的一个类别，其标准流量修正推导为[界星石](#idx-e66)操作类术式的基础。\"},{\"id\":\"e11\",\"title\":\"半龙化\",\"aliases\":[],\"body\":\"人类与巨龙缔结[血契](#idx-e48)后，其思维与立场不可逆地向龙族一侧偏移的现象。\"},{\"id\":\"e12\",\"title\":\"不习者\",\"aliases\":[],\"body\":\"艾瑟瑞姆人对不会施展[星术](#idx-e7)者的称呼，语带轻慢。\"},{\"id\":\"e13\",\"title\":\"裁闭术\",\"aliases\":[],\"body\":\"利用[界星石](#idx-e66)将局部空间环境状态固定的[星术](#idx-e7)，[仲裁星术](#idx-e58)的一种，常用于稳定温度。须以[玛娜](#idx-e26)供给[回路](#idx-e75)维持。\"},{\"id\":\"e14\",\"title\":\"弛豫时间\",\"aliases\":[],\"body\":\"[星术](#idx-e7)施法后到[玛娜](#idx-e26)外显之间的一段时间，随天宫与[以太流量](#idx-e50)而变。\"},{\"id\":\"e15\",\"title\":\"大魔导师\",\"aliases\":[],\"body\":\"[神启魔法](#idx-e4)造诣极高者的称呼，非正式头衔。\"},{\"id\":\"e16\",\"title\":\"大星轨\",\"aliases\":[\"天道星轨\"],\"body\":\"[天星五政](#idx-e41)在天球上的轨迹，代表宇宙中[以太](#idx-e17)流的流向；亦称天道星轨。\"},{\"id\":\"e17\",\"title\":\"第五元素\",\"aliases\":[\"以太\"],\"body\":\"构成群星与其间空间（宇宙）的物质，通称以太，永恒不朽；稀薄存在于大地之上，[星空魔法](#idx-e7)师可将其蓄积体内，是星术的能量来源。\"},{\"id\":\"e18\",\"title\":\"构成元素\",\"aliases\":[],\"body\":\"构成实体事物的四大[自然元素](#idx-e39)，不响应[祷言](#idx-e4)[术式](#idx-e38)。通过[秘术式](#idx-e2)可将其解离。\"},{\"id\":\"e19\",\"title\":\"冠阳星术\",\"aliases\":[],\"body\":\"以[冠阳](#idx-e532)为[源星](#idx-e56)的一类[星术](#idx-e7)，主权威、自我意识与创造，含实体创造、驱散与净化、强化祝福及审判等星术。\"},{\"id\":\"e20\",\"title\":\"结界\",\"aliases\":[],\"body\":\"[仲裁星术](#idx-e58)所构造的防护或隔离[术式](#idx-e38)，[裁闭术](#idx-e13)是其中的一种；通常依靠[界星石](#idx-e66)建立。\"},{\"id\":\"e21\",\"title\":\"烬铸星术\",\"aliases\":[],\"body\":\"以[烬铸星](#idx-e533)为[源星](#idx-e56)的一类[星术](#idx-e7)，主毁灭、转化与事物变化，含物质破坏、元素转化与操纵、能量爆发等星术。\"},{\"id\":\"e22\",\"title\":\"精神共鸣\",\"aliases\":[],\"body\":\"巨龙与人类契约者通过[血契](#idx-e48)所建立的连接，使契约者与巨龙互通并转移[精神力](#idx-e23)消耗。\"},{\"id\":\"e23\",\"title\":\"精神力\",\"aliases\":[],\"body\":\"编织[祷言](#idx-e4)[术式](#idx-e38)所凭的能力，可经后天训练提高，只能依靠时间缓慢恢复。\"},{\"id\":\"e24\",\"title\":\"联级界星石\",\"aliases\":[],\"body\":\"以特殊联级设计使[星场](#idx-e45)内部[玛娜](#idx-e26)浓度自动调节的[界星石](#idx-e66)构型。\"},{\"id\":\"e25\",\"title\":\"洛林阶运\",\"aliases\":[],\"body\":\"特定工艺的[星轨蚀刻](#idx-e76)（如旧式三分耦式蚀刻法）所致的[玛娜](#idx-e26)自然向外部流出的矿界面层现象。\"},{\"id\":\"e26\",\"title\":\"玛娜\",\"aliases\":[\"魔力\"],\"body\":\"[星空学派](#idx-e6)语境下[内化](#idx-e30)后的[以太](#idx-e17)，即俗称的魔力；释放后无法自然恢复，须[星术](#idx-e7)师冥想缓慢补充。\"},{\"id\":\"e27\",\"title\":\"米特兰类蚀刻法\",\"aliases\":[],\"body\":\"旧式[星术](#idx-e7)锁所用的[蚀刻](#idx-e76)法，每次激活会在[界星石](#idx-e66)[回路](#idx-e75)中留下[容流偏移](#idx-e32)，可供[星术示踪](#idx-e46)还原施法记录。\"},{\"id\":\"e28\",\"title\":\"米西斯类\",\"aliases\":[],\"body\":\"[魔矿](#idx-e71)[蚀刻](#idx-e76)工艺的一个类别，包含三分耦式蚀刻、四分耦式蚀刻等。特征是对蚀刻加工的环境温度非常敏感。\"},{\"id\":\"e29\",\"title\":\"魔元素动力学\",\"aliases\":[],\"body\":\"[神启学派](#idx-e5)中研究元素流动与[疏化](#idx-e37)机理的学科，由[神启魔法](#idx-e4)学者菲略奥斯等人奠基。\"},{\"id\":\"e30\",\"title\":\"内化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师于修习中将环境自由[以太](#idx-e17)汇入体内[仪式星轨](#idx-e49)的过程。\"},{\"id\":\"e31\",\"title\":\"耦合共鸣\",\"aliases\":[],\"body\":\"富集于[魔矿](#idx-e71)中的[自然元素](#idx-e39)与魔矿本身的高密度地元素发生反应的现象，易致溢散乃至爆炸。\"},{\"id\":\"e32\",\"title\":\"容流偏移\",\"aliases\":[],\"body\":\"[星术](#idx-e7)锁被激活时于[界星石](#idx-e66)[回路](#idx-e75)中留下的细微偏移，可还原激活时间与[施法者](#idx-e36)特征。\"},{\"id\":\"e33\",\"title\":\"三分耦蚀刻\",\"aliases\":[],\"body\":\"[米西斯类](#idx-e28)[魔矿](#idx-e71)[蚀刻](#idx-e76)工艺之一，长期受加工环境要求低温的限制；1490年取得了在室温环境下进行蚀刻的重要突破。\"},{\"id\":\"e34\",\"title\":\"圣树契约\",\"aliases\":[],\"body\":\"精灵与[大圣树](#idx-e214)之间的连接，圣树通过契约承担施法所需的[精神力](#idx-e23)消耗。\"},{\"id\":\"e35\",\"title\":\"十二天宫\",\"aliases\":[],\"body\":\"[星空学派](#idx-e6)对天球的划分，一一对应人体十二部位；其中六宫覆盖黄道（太阳运行轨道）。\"},{\"id\":\"e36\",\"title\":\"施法者\",\"aliases\":[],\"body\":\"能够主动运用魔法的人口的统称，全大陆约占两成。\"},{\"id\":\"e37\",\"title\":\"疏化\",\"aliases\":[],\"body\":\"同一空间内反复施用[神启魔法](#idx-e4)后[自然元素](#idx-e39)恢复速率异常下降的现象，由神启魔法学者菲略奥斯提出。\"},{\"id\":\"e38\",\"title\":\"术式\",\"aliases\":[],\"body\":\"[神启魔法](#idx-e4)师以[精神力](#idx-e23)编织、临时改写自然法则的结构，是与[唯一神](#idx-e135)所立的单向契约。\"},{\"id\":\"e39\",\"title\":\"四大元素\",\"aliases\":[\"自然元素\"],\"body\":\"构成世界万物和游离在自然环境中的地、水、火、风元素，也称自然元素；唯游离态者可为[神启魔法](#idx-e4)调用。\"},{\"id\":\"e40\",\"title\":\"塔莉拉·丝黛兰尔\",\"aliases\":[\"丝黛兰尔\"],\"body\":\"[星空学派](#idx-e6)魔法先驱，著《[星术](#idx-e7)源流考》，首创以五颗天星对应五类魔法的[源星](#idx-e56)分类法，源星之名即出于此。\"},{\"id\":\"e41\",\"title\":\"天星五政\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)最重要的概念之一，指[冠阳](#idx-e532)、[汐月](#idx-e544)、[仲裁星](#idx-e549)、[烬铸星](#idx-e533)、[织虹星](#idx-e548)五颗天体。\"},{\"id\":\"e42\",\"title\":\"无属性元素流\",\"aliases\":[],\"body\":\"[秘术式](#idx-e2)解离祭品[构成元素](#idx-e18)后所得的能量形态，其性质仍是大陆魔法学界研究的未解课题。\"},{\"id\":\"e43\",\"title\":\"汐月星术\",\"aliases\":[],\"body\":\"以[汐月](#idx-e544)为[源星](#idx-e56)的一类[星术](#idx-e7)，主容纳、意识与精神体验，含精神暗示、安抚、情感激化与灌输等星术。\"},{\"id\":\"e44\",\"title\":\"显化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师控制体内[以太](#idx-e17)流运转特定[大星轨](#idx-e16)、将[玛娜](#idx-e26)转为有色状态并外放的过程。\"},{\"id\":\"e45\",\"title\":\"星场\",\"aliases\":[],\"body\":\"以[界星石](#idx-e66)构造并维持的局域魔法场，其[玛娜](#idx-e26)浓度分布需定期调节。\"},{\"id\":\"e46\",\"title\":\"星术示踪\",\"aliases\":[],\"body\":\"自[界星石](#idx-e66)的[容流偏移](#idx-e32)中还原历次激活时间与[施法者](#idx-e36)[仪式星轨](#idx-e49)特征的技术。\"},{\"id\":\"e47\",\"title\":\"血脉共鸣\",\"aliases\":[],\"body\":\"[龙骑士](#idx-e295)与流淌龙血者之间的感应；[龙骑士团](#idx-e296)据此判定[凯撒](#idx-e234)血脉的真伪。\"},{\"id\":\"e48\",\"title\":\"血契\",\"aliases\":[],\"body\":\"人类与巨龙缔结的契约，双方精神世界互相开放，可转移龙族[术式](#idx-e38)的[精神力](#idx-e23)消耗。\"},{\"id\":\"e49\",\"title\":\"仪式星轨\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师于体内仿照[大星轨](#idx-e16)建立的[以太](#idx-e17)[回路](#idx-e75)，各部位对应一天宫。\"},{\"id\":\"e50\",\"title\":\"以太流量\",\"aliases\":[\"玛娜流量\"],\"body\":\"于[蚀刻](#idx-e76)[回路](#idx-e75)或[星术](#idx-e7)师体内[仪式星轨](#idx-e49)中同一时间通过的[以太](#idx-e17)量。受到回路或仪式星轨[最大容流量](#idx-e59)的限制。\"},{\"id\":\"e51\",\"title\":\"游离态元素\",\"aliases\":[],\"body\":\"广泛分布于环境中、未构成实体的[自然元素](#idx-e39)，是[神启魔法](#idx-e4)存在的基础。\"},{\"id\":\"e52\",\"title\":\"元素丰地\",\"aliases\":[],\"body\":\"游离态[四大元素](#idx-e39)丰度明显高于大陆平均的天然区域，对[疏化](#idx-e37)有强韧抵抗力。\"},{\"id\":\"e53\",\"title\":\"元素枯竭\",\"aliases\":[],\"body\":\"[疏化](#idx-e37)的最终形态，元素流几乎完全凝滞且长期无法恢复，学界认为不可逆转。\"},{\"id\":\"e54\",\"title\":\"元素流价值\",\"aliases\":[],\"body\":\"[秘术](#idx-e3)衡量祭品可转化元素流多寡的尺度；活体远高于同重死物，智慧生物最高。\"},{\"id\":\"e55\",\"title\":\"元素亲和力\",\"aliases\":[\"亲和力\"],\"body\":\"[神启魔法](#idx-e4)师对游离态[自然元素](#idx-e39)的感知能力，常简称亲和力，先天决定，常以感知范围量化。\"},{\"id\":\"e56\",\"title\":\"源星\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师[丝黛兰尔](#idx-e40)在《星术源流考》中提出的星术五分类，对应[天星五政](#idx-e41)。\"},{\"id\":\"e57\",\"title\":\"织虹星术\",\"aliases\":[],\"body\":\"以[织虹星](#idx-e548)为[源星](#idx-e56)的一类[星术](#idx-e7)，主修复、修饰与客体感知，含实体治疗、修复、幻象与伪装变化等星术。\"},{\"id\":\"e58\",\"title\":\"仲裁星术\",\"aliases\":[],\"body\":\"以[仲裁星](#idx-e549)为[源星](#idx-e56)的一类[星术](#idx-e7)，主秩序、约束与原则，含施加守护、封印、[结界](#idx-e20)制造与契约构造等星术。\"},{\"id\":\"e59\",\"title\":\"最大容流量\",\"aliases\":[],\"body\":\"[回路](#idx-e75)或[仪式星轨](#idx-e49)各天宫所能容纳的最大[以太流量](#idx-e50)，决定对应[源星](#idx-e56)魔法的修习难易。\"},{\"id\":\"e60\",\"title\":\"最大以太容量\",\"aliases\":[],\"body\":\"[回路](#idx-e75)或[仪式星轨](#idx-e49)各天宫所能容纳的[以太](#idx-e17)总量，决定魔法师可[内化](#idx-e30)的[玛娜](#idx-e26)多少。\"},{\"id\":\"e61\",\"title\":\"动力炉\",\"aliases\":[],\"body\":\"大型[星术设备](#idx-e85)的供能核心，见于[魔偶](#idx-e83)、[巨像](#idx-e81)与[星术驿车](#idx-e87)等。\"},{\"id\":\"e62\",\"title\":\"对龙穿甲弩炮\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)[对龙工程兵团](#idx-e287)列装的专用军备，利用[星术](#idx-e7)驱动发射装有特制簇头的大型弩箭，专为打击[索拉瑞斯](#idx-e429)龙骑兵部队设计。\"},{\"id\":\"e63\",\"title\":\"二型衡台\",\"aliases\":[],\"body\":\"附设[界星石](#idx-e66)，利用[裁闭术](#idx-e13)固定称重环境温度的衡台，用于称量对温度变化敏感的物品（如[星元](#idx-e69)）。\"},{\"id\":\"e64\",\"title\":\"法术触媒\",\"aliases\":[\"施术触媒\"],\"body\":\"以[魔矿](#idx-e71)制成、辅助神启施法的器具，常见形态为法杖、法器与仪式器具；又称施术触媒。制作技术由[正教会](#idx-e181)垄断，精灵族另有独特工艺的触媒专供对外贸易。\"},{\"id\":\"e65\",\"title\":\"高品级魔矿\",\"aliases\":[],\"body\":\"元素储存率极高、可承受各种魔法加工工艺的[魔矿](#idx-e71)，八成以上产自沙阿万。\"},{\"id\":\"e66\",\"title\":\"界星石\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e73)制成的器件，[仲裁星术](#idx-e58)设备的核心原件之一，用途极为广泛。可检测与稳定局部环境、维持[回路](#idx-e75)与[结界](#idx-e20)、容许特定构型[星术](#idx-e7)运行，用于[二型衡台](#idx-e63)、星术锁、[星术灯](#idx-e78)开关、建筑保温等领域。\"},{\"id\":\"e67\",\"title\":\"界星石温度柱\",\"aliases\":[],\"body\":\"以[界星石](#idx-e66)为核心的温度计量器具，须由[星术](#idx-e7)[施法者](#idx-e36)定期校准。\"},{\"id\":\"e68\",\"title\":\"洛林八阶\",\"aliases\":[],\"body\":\"[星元](#idx-e69)的等级之一，阶数对应封装的[玛娜](#idx-e26)浓度，八阶是艾瑟瑞姆允许出口的最高等级。\"},{\"id\":\"e69\",\"title\":\"洛林星元\",\"aliases\":[\"星元\"],\"body\":\"粗加工[魔矿](#idx-e71)晶体经[星轨蚀刻](#idx-e76)、注入[玛娜](#idx-e26)封装的[星术制品](#idx-e88)，通称星元，取名于洛林法蚀刻，可为小型[星术设备](#idx-e85)供能。\"},{\"id\":\"e70\",\"title\":\"明星石\",\"aliases\":[],\"body\":\"可发光的[蚀刻魔矿](#idx-e73)，用于[星术灯](#idx-e78)、招牌与建筑铭牌。\"},{\"id\":\"e71\",\"title\":\"魔法矿石\",\"aliases\":[\"魔矿\"],\"body\":\"对五大元素均具极高流通率与储存率的天然矿石，通称魔矿，是大陆最重要的战略资源。\"},{\"id\":\"e72\",\"title\":\"农用星术设备\",\"aliases\":[],\"body\":\"用于耕作看护的[星术设备](#idx-e85)，典型代表为农用[魔偶](#idx-e83)；其引进是[阿布丹提亚帝国](#idx-e452)[三战](#idx-e270)后[圈地运动](#idx-e281)的物质前提。\"},{\"id\":\"e73\",\"title\":\"蚀刻魔矿\",\"aliases\":[],\"body\":\"经[星轨蚀刻](#idx-e76)的[魔矿](#idx-e71)，可按[回路](#idx-e75)结构储存[玛娜](#idx-e26)，并在触发时释放对应[星术](#idx-e7)。\"},{\"id\":\"e74\",\"title\":\"托兰瓦尔·洛林\",\"aliases\":[\"洛林\"],\"body\":\"艾瑟瑞姆[天星师](#idx-e246)，1125年首报可流通储存[以太](#idx-e17)的矿石并据以发明[星轨蚀刻](#idx-e76)；洛林法蚀刻为纪念其贡献而名，[洛林星元](#idx-e69)、[洛林阶运](#idx-e25)之名亦由此而来。\"},{\"id\":\"e75\",\"title\":\"星轨回路\",\"aliases\":[\"回路\"],\"body\":\"通过[蚀刻](#idx-e76)在[魔矿](#idx-e71)上建立的模仿[仪式星轨](#idx-e49)的通路，允许魔矿储存[玛娜](#idx-e26)，并在特定条件触发下释放对应[星术](#idx-e7)。\"},{\"id\":\"e76\",\"title\":\"星轨回路蚀刻\",\"aliases\":[\"蚀刻\",\"星轨蚀刻\",\"洛林法蚀刻\"],\"body\":\"于[魔矿](#idx-e71)表面蚀刻[仪式星轨](#idx-e49)[回路](#idx-e75)的技术，简称星轨蚀刻或蚀刻，为纪念发明人，又名洛林法蚀刻。1125年由艾瑟瑞姆[星术](#idx-e7)学者[托兰瓦尔·洛林](#idx-e74)发明，构成了[星术设备](#idx-e85)的基石。\"},{\"id\":\"e77\",\"title\":\"星热炉\",\"aliases\":[],\"body\":\"以[星术](#idx-e7)供热的炉具，用于烹煮与加热。\"},{\"id\":\"e78\",\"title\":\"星术灯\",\"aliases\":[],\"body\":\"以[星术](#idx-e7)驱动的照明器具，有台灯、壁灯、顶灯等形制，在[艾瑟瑞姆王国](#idx-e494)境内已经几乎完全取代了常规照明用具（如油灯）。\"},{\"id\":\"e79\",\"title\":\"星术怀表\",\"aliases\":[],\"body\":\"以[星术](#idx-e7)驱动计时的怀表，是艾瑟瑞姆境内通行以及大陆各地星术师会携带的小型计时器具。\"},{\"id\":\"e80\",\"title\":\"星术火炮\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[大舰队](#idx-e285)战舰装配的舰载火器，由操炮[星术](#idx-e7)师操作。\"},{\"id\":\"e81\",\"title\":\"星术巨像\",\"aliases\":[\"巨像\"],\"body\":\"[星术](#idx-e7)兵种的大型作战单位，通称巨像，由专精操作的星术师远距控制。\"},{\"id\":\"e82\",\"title\":\"星术门\",\"aliases\":[],\"body\":\"以星术门锁开闭的门，无钥匙孔，须使用对应[星钥](#idx-e91)施法开启。\"},{\"id\":\"e83\",\"title\":\"星术魔偶\",\"aliases\":[\"魔偶\"],\"body\":\"以[蚀刻](#idx-e76)[回路](#idx-e75)驱动的小型[星术](#idx-e7)作战或劳作单位，通称魔偶，有农用魔偶、清扫魔偶等。\"},{\"id\":\"e84\",\"title\":\"星术器械\",\"aliases\":[],\"body\":\"[星术设备](#idx-e85)中的大型工程与军用形制，如开凿水利的器械与军队列装的军备。\"},{\"id\":\"e85\",\"title\":\"星术设备\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e73)制成的各类器物的统称，自家用台灯至战场[巨像](#idx-e81)[动力炉](#idx-e61)，是艾瑟瑞姆高技术社会立国的物质基础。\"},{\"id\":\"e86\",\"title\":\"星术通讯体系\",\"aliases\":[],\"body\":\"艾瑟瑞姆由[阿斯托戈商会](#idx-e310)牵头建立维护的全境通讯网，通过[星讯](#idx-e90)连接王国各大城市与口岸，是支撑艾瑟瑞姆统一对外汇率的重要技术基础。\"},{\"id\":\"e87\",\"title\":\"星术驿车\",\"aliases\":[],\"body\":\"以[动力炉](#idx-e61)驱动的陆上载具，行于艾瑟瑞姆城市内或城际道路。\"},{\"id\":\"e88\",\"title\":\"星术制品\",\"aliases\":[],\"body\":\"[星术设备](#idx-e85)所需半成品作为贸易品的称呼，[洛林星元](#idx-e69)为其典型代表。\"},{\"id\":\"e89\",\"title\":\"星术装药\",\"aliases\":[],\"body\":\"在[魔矿](#idx-e71)上[蚀刻](#idx-e76)特定的[星轨回路](#idx-e75)，使之储存的[玛娜](#idx-e26)处于不稳定状态，激发后会发生爆炸。封入水晶后外形与[星元](#idx-e69)几可乱真。\"},{\"id\":\"e90\",\"title\":\"星讯\",\"aliases\":[],\"body\":\"通过[星术通讯体系](#idx-e86)实现的远程通讯手段，一次仅能传递少量文字。成本昂贵，技术要求极高，仅见于[艾瑟瑞姆王国](#idx-e494)境内各大城市及口岸通讯。\"},{\"id\":\"e91\",\"title\":\"星钥\",\"aliases\":[],\"body\":\"菱形的开锁石件，由[蚀刻魔矿](#idx-e73)制成。将其按于[界星石](#idx-e66)上施法，可开启对应的[星术](#idx-e7)锁。\"},{\"id\":\"e92\",\"title\":\"液柱温度计\",\"aliases\":[],\"body\":\"以[星度](#idx-e395)为标度的温度计量器具，无需[星术](#idx-e7)驱动，但制造工艺复杂、成本昂贵，几乎仅用于没有星术支持的场合。\"},{\"id\":\"e93\",\"title\":\"移动星术谐振台\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)[对龙工程兵团](#idx-e287)列装的专用军备，利用[星术设备](#idx-e85)发射高频声波干扰[飞龙](#idx-e292)亚种，与[对龙穿甲弩炮](#idx-e62)同为反制龙骑兵的核心器械。\"},{\"id\":\"e94\",\"title\":\"仲裁星术防护罩\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[大舰队](#idx-e285)战舰装配的魔法防护装置，使用[界星石](#idx-e66)构成的一种[结界](#idx-e20)，以随船[星术](#idx-e7)师使用[仲裁星术](#idx-e58)运作。\"},{\"id\":\"e95\",\"title\":\"仲裁星术契约\",\"aliases\":[],\"body\":\"具魔法强制力的契约，违约将触发相应后果，是艾瑟瑞姆金融交易的执行机制。\"},{\"id\":\"e96\",\"title\":\"阿内玛\",\"aliases\":[],\"body\":\"四[天使长](#idx-e134)之一，掌岚（风）元素权柄。\"},{\"id\":\"e97\",\"title\":\"埃塞莉斯\",\"aliases\":[],\"body\":\"巡行天球之上、监视[虚界](#idx-e141)裂缝的[次级天使](#idx-e101)，末世预言中最先通报天球开裂者。[公教](#idx-e107)尊之为[以太](#idx-e17)神权的象征、与四[天使长](#idx-e134)并列，[正教](#idx-e146)不认此说。\"},{\"id\":\"e98\",\"title\":\"安息辞\",\"aliases\":[],\"body\":\"[正教](#idx-e146)葬礼上为亡者所诵的祷词，求[唯一神](#idx-e135)接纳其灵魂于[冥界](#idx-e114)安息。\"},{\"id\":\"e99\",\"title\":\"朝圣\",\"aliases\":[],\"body\":\"[正教](#idx-e146)信众沿既定路线前往[圣城索菲亚](#idx-e487)的虔修，是[圣领](#idx-e483)可观的收入来源。\"},{\"id\":\"e100\",\"title\":\"称义\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒持守信仰、按神的教诲生活而得免[宿债](#idx-e131)的全过程，自[洗礼](#idx-e136)始，至临终而成。\"},{\"id\":\"e101\",\"title\":\"次级天使\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中四[天使长](#idx-e134)座下的天使，往来三界传谕护佑；[埃塞莉斯](#idx-e97)为其中特殊一位。\"},{\"id\":\"e102\",\"title\":\"从圣徒\",\"aliases\":[],\"body\":\"历代[正教会](#idx-e181)与[公教会](#idx-e155)册封的显现神迹、殉道或品行高洁的信徒，死后由[次级天使](#idx-e101)径引[天界](#idx-e133)。\"},{\"id\":\"e103\",\"title\":\"大赦\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中[三大罪](#idx-e118)的赦免。须直接出自[大牧首](#idx-e148)或[宗主教](#idx-e183)本人。\"},{\"id\":\"e104\",\"title\":\"大祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)学徒正式受任为神职的[圣事](#idx-e121)。\"},{\"id\":\"e105\",\"title\":\"盖昂\",\"aliases\":[],\"body\":\"四[天使长](#idx-e134)之一，掌地元素权柄。\"},{\"id\":\"e106\",\"title\":\"告解\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒为自身罪行请求赦免的[圣事](#idx-e121)，可反复进行。\"},{\"id\":\"e107\",\"title\":\"公教\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰两大教派之一，1295年[教会大分裂](#idx-e160)后自[阿布丹提亚](#idx-e452)境内的[正教会](#idx-e181)独立而成，以[公教会](#idx-e155)为组织载体，是阿布丹提亚人口的第一大信仰。将[星空魔法](#idx-e7)一并纳入唯一神权柄、另尊保罗为第二先知；主张轻罪可凭虔信与[圣事](#idx-e121)自赦，审判之权唯神独有，故不设[审判庭](#idx-e171)建制并废除[诺万尼斯流放](#idx-e167)，对个人虔修的要求高于[正教](#idx-e146)；[季首弥撒](#idx-e109)与节庆均依[通用历](#idx-e368)。\"},{\"id\":\"e108\",\"title\":\"海德洛娅\",\"aliases\":[],\"body\":\"四[天使长](#idx-e134)之一，掌泽（水）元素权柄。\"},{\"id\":\"e109\",\"title\":\"季首弥撒\",\"aliases\":[],\"body\":\"[正教](#idx-e146)于[仪式历](#idx-e361)各季首日，[公教](#idx-e107)于[通用历](#idx-e368)各季首日举行的规模略大于每周[弥撒](#idx-e113)的集体仪式。\"},{\"id\":\"e110\",\"title\":\"坚振\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中，标志[称义](#idx-e100)大体完成的[圣事](#idx-e121)，一生一次，须对教会有重大贡献或持守信仰足够长久。\"},{\"id\":\"e111\",\"title\":\"苦行\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中，赦免所需的赎罪之法，其责可购[赎罪券](#idx-e129)折抵。\"},{\"id\":\"e112\",\"title\":\"礼仪年\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中六季[弥撒](#idx-e113)与九大节庆构成的一整年宗教循环。\"},{\"id\":\"e113\",\"title\":\"弥撒\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)礼拜日举行的集体仪式，与每日的[日课](#idx-e117)同为[称义](#idx-e100)最重要的日常载体。\"},{\"id\":\"e114\",\"title\":\"冥界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，信徒死后安息、静候轮回之地。\"},{\"id\":\"e115\",\"title\":\"末日之战\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰末世预言中，天使大军与诸巨龙对抗三只[虚之大兽](#idx-e142)的终局之战。\"},{\"id\":\"e116\",\"title\":\"皮雷乌斯\",\"aliases\":[],\"body\":\"四[天使长](#idx-e134)之一，掌炎（火）元素权柄。\"},{\"id\":\"e117\",\"title\":\"日课\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒每日的功课，与礼拜日[弥撒](#idx-e113)同为[称义](#idx-e100)的日常载体。\"},{\"id\":\"e118\",\"title\":\"三大罪\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中，[原罪](#idx-e145)之下的三种大罪：不谨、不智、不爱；非经[大赦](#idx-e103)不得赦免。\"},{\"id\":\"e119\",\"title\":\"圣保罗\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，最初的医者，司治愈与修复；对应[织虹星](#idx-e548)与[虹曜日](#idx-e348)。[公教](#idx-e107)另尊其为第二先知。\"},{\"id\":\"e120\",\"title\":\"圣骸\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下的圣徒遗骨，为[朝圣](#idx-e99)与教堂声望所系，如[潘克拉托](#idx-e485)大教堂所藏的[圣约翰](#idx-e123)圣骸。\"},{\"id\":\"e121\",\"title\":\"圣事\",\"aliases\":[],\"body\":\"指[正教](#idx-e146)与[公教](#idx-e107)六项圣事：[洗礼](#idx-e136)、[坚振](#idx-e110)、婚姻、[告解](#idx-e106)、[大祝职](#idx-e104)、[小祝职](#idx-e138)。\"},{\"id\":\"e122\",\"title\":\"圣伊琳娜\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，司秩序与契约；对应[仲裁星](#idx-e549)与[裁曜日](#idx-e345)，[圣领](#idx-e483)[伊琳娜圣银币](#idx-e341)以其得名。\"},{\"id\":\"e123\",\"title\":\"圣约翰\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之首，[正教](#idx-e146)唯一的先知与弥赛亚，司精神与教导；对应[汐月](#idx-e544)与[月曜日](#idx-e376)。\"},{\"id\":\"e124\",\"title\":\"圣约瑟\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，商会之圣，司转化、破坏与锻造；对应[烬铸星](#idx-e533)与[烬曜日](#idx-e351)，[圣约瑟商会](#idx-e335)以其得名。\"},{\"id\":\"e125\",\"title\":\"十二诫命\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中[三大罪](#idx-e118)的反面，分属谨、智、爱三目的十二条规范。\"},{\"id\":\"e126\",\"title\":\"使徒\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e132)》记载中，随[唯一神](#idx-e135)降世传教的最初四人：约翰、伊琳娜、约瑟、保罗。\"},{\"id\":\"e127\",\"title\":\"十字架\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教会](#idx-e155)共用的宗教象征符号。正教十字架为四端，象征四元素权柄。[公教](#idx-e107)下端另加一横，四横端象征四元素，竖端象征[星术](#idx-e7)。\"},{\"id\":\"e128\",\"title\":\"十字礼\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)于胸前划十字的礼节，象征[十字架](#idx-e127)，常用于祷告或行礼。正教画四端十字，公教于下方另补一道短横。\"},{\"id\":\"e129\",\"title\":\"赎罪券\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)售卖的一次性折抵[告解](#idx-e106)[苦行](#idx-e111)的凭证，不可转让或继承。\"},{\"id\":\"e130\",\"title\":\"四界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰神学的宇宙构成：[天界](#idx-e133)、[现界](#idx-e137)、[冥界](#idx-e114)、[虚界](#idx-e141)。\"},{\"id\":\"e131\",\"title\":\"宿债\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰神学中，人一出生便背负的亏欠。缘于唯一神所借予而非赐予的权柄，受惠者无人能置身账外。\"},{\"id\":\"e132\",\"title\":\"索菲亚圣典\",\"aliases\":[\"圣典\"],\"body\":\"[唯一神](#idx-e135)信仰的最高典籍，通称《圣典》，分《创世录》《弥赛亚记》《神言书》《箴言集》四福音与《预言书》。\"},{\"id\":\"e133\",\"title\":\"天界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，唯一神、圣徒与天使的居所。\"},{\"id\":\"e134\",\"title\":\"天使长\",\"aliases\":[],\"body\":\"神学中[唯一神](#idx-e135)部分神格的具现。共有四位，各具六翼，分掌[四大元素](#idx-e39)权柄：[盖昂](#idx-e105)（地）、[皮雷乌斯](#idx-e116)（火）、[阿内玛](#idx-e96)（岚）、[海德洛娅](#idx-e108)（水）。\"},{\"id\":\"e135\",\"title\":\"唯一神\",\"aliases\":[\"主\",\"神\",\"上帝\"],\"body\":\"唯一神信仰所奉的至高神，信徒亦称主、神或上帝，是宇宙的创造者、维系者与监督者，也是世间一切魔法力量的源头。\"},{\"id\":\"e136\",\"title\":\"洗礼\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒入教与[称义](#idx-e100)之始的[圣事](#idx-e121)，一生一次，象征认清并领受自身的[宿债](#idx-e131)。\"},{\"id\":\"e137\",\"title\":\"现界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中[四界](#idx-e130)之一，人类生息的世界。\"},{\"id\":\"e138\",\"title\":\"小祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)神职人员卸任、复为寻常信徒之礼，多见于年老体弱者。\"},{\"id\":\"e139\",\"title\":\"虚\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中，充满[虚界](#idx-e141)的原质，太初混沌之所本；宇宙终将复归于此。\"},{\"id\":\"e140\",\"title\":\"虚潮\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰神学中，末日时自[虚界](#idx-e141)渗入[现界](#idx-e137)的虚，所至之处只余死地。\"},{\"id\":\"e141\",\"title\":\"虚界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，天球与大地之外仍为虚所充满的空间，罪人与非正信者死后的去处。\"},{\"id\":\"e142\",\"title\":\"虚之大兽\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰末世预言中，由被吞灭者之力所生的三只巨兽，各象[三大罪](#idx-e118)。\"},{\"id\":\"e143\",\"title\":\"异端\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下，秉持不同教义解释相异的教派；就[正教](#idx-e146)而言[公教](#idx-e107)即当代最大异端。\"},{\"id\":\"e144\",\"title\":\"异教\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下，唯一神信仰之外的其他宗教，如[尼希尔](#idx-e517)诸神信仰。\"},{\"id\":\"e145\",\"title\":\"原罪\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下，不信奉唯一神者[宿债](#idx-e131)所转化者。负原罪者死后被流放[虚界](#idx-e141)，终至灵魂碎裂。\"},{\"id\":\"e146\",\"title\":\"正教\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰两大教派之一，以[正教会](#idx-e181)为组织载体，为[索拉瑞斯](#idx-e429)与[忒奥西斯](#idx-e483)的国教。认[神启祷言](#idx-e4)为唯一神所授的权柄，[星空魔法](#idx-e7)则不在神权之列；一切罪无论大小均须经[告解](#idx-e106)方得赦免，并以神在[现界](#idx-e137)的代行者自任，设[审判庭](#idx-e171)严管神启魔法、以[诺万尼斯流放](#idx-e167)向神赎罪。历法与[礼仪年](#idx-e112)循环依[圣格里仪式历](#idx-e361)。\"},{\"id\":\"e147\",\"title\":\"传信厅\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)[牧首厅](#idx-e166)六分厅之一，分管外交。\"},{\"id\":\"e148\",\"title\":\"大牧首\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)最高元首、[忒奥西斯](#idx-e483)圣领国家元首，由[枢机主教团](#idx-e174)闭门选出，终身任期。\"},{\"id\":\"e149\",\"title\":\"大审判长\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)最高长官，由[枢机主教团](#idx-e174)任命，与[大牧首](#idx-e148)同为终身任期。\"},{\"id\":\"e150\",\"title\":\"第二次宗教改革\",\"aliases\":[],\"body\":\"十三世纪末谋求将[星术](#idx-e7)纳入神权的改革，失败后直接导致[教会大分裂](#idx-e160)。\"},{\"id\":\"e151\",\"title\":\"第一次宗教改革\",\"aliases\":[],\"body\":\"八世纪中叶以[诺万尼斯大叛乱](#idx-e279)为导火索的改革，[龙族魔法](#idx-e1)获平反，《[索菲亚圣典](#idx-e132)·创世录》新增有关巨龙族的章节。\"},{\"id\":\"e152\",\"title\":\"都主教\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)[都主教区](#idx-e153)长官，教阶在主教之上；与[大牧首](#idx-e148)同不得婚娶，别称[门徒](#idx-e165)。\"},{\"id\":\"e153\",\"title\":\"都主教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)最高一级行政区划和宗教管理区划，全境共五个，长官称[都主教](#idx-e152)。[卡帕尼](#idx-e502)和[索拉瑞斯](#idx-e429)亦设有都主教区，但不具备行政职能。\"},{\"id\":\"e154\",\"title\":\"督审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)教阶之一，位在[审判官](#idx-e169)之上；[审判所](#idx-e162)驻任长官、[审判分庭](#idx-e168)官员。[诺万尼斯流放](#idx-e167)须由审判分庭所属督审判官主刑。\"},{\"id\":\"e155\",\"title\":\"公教会\",\"aliases\":[],\"body\":\"1295年[阿布丹提亚](#idx-e452)境内[正教会](#idx-e181)独立所成立的教会，领袖称[宗主教](#idx-e183)，驻[波马里亚](#idx-e459)。\"},{\"id\":\"e156\",\"title\":\"公教区\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)的行政区划，多依当地世俗政权划界；在[阿布丹提亚](#idx-e452)依[帝政省](#idx-e228)划分，所属分会设于区内最大城市。其下不再分级，直辖各地基层教会。\"},{\"id\":\"e157\",\"title\":\"公教总会\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)中枢，驻[阿布丹提亚帝国](#idx-e452)城市[波马里亚](#idx-e459)。\"},{\"id\":\"e158\",\"title\":\"祭词官\",\"aliases\":[],\"body\":\"[诺万尼斯流放](#idx-e167)行刑中负责诵读祭词的[司祭](#idx-e176)，由受刑人对应[教区](#idx-e161)教会指派。\"},{\"id\":\"e159\",\"title\":\"教公署\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)[教区](#idx-e161)处理日常政务的官署，下设主教公房、文书房、录册司与客室。\"},{\"id\":\"e160\",\"title\":\"教会大分裂\",\"aliases\":[],\"body\":\"1295年[第二次宗教改革](#idx-e150)失败后，[阿布丹提亚帝国](#idx-e452)境内[正教会](#idx-e181)宣布脱离[牧首厅](#idx-e166)独立，成立[公教会](#idx-e155)。\"},{\"id\":\"e161\",\"title\":\"教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)[都主教区](#idx-e153)下辖的最小一级行政区划，长官称主教。也是[正教会](#idx-e181)在大陆各国所划的宗教事务上的最小管理层级。\"},{\"id\":\"e162\",\"title\":\"教区审判所\",\"aliases\":[\"审判所\"],\"body\":\"[审判庭](#idx-e171)在[教区](#idx-e161)一级所设的分支机构，简称审判所，由[督审判官](#idx-e154)驻任长官。\"},{\"id\":\"e163\",\"title\":\"界圈\",\"aliases\":[],\"body\":\"围绕诺万尼斯枯竭区的石碑圈，为[终末碑座](#idx-e428)地区的边界。\"},{\"id\":\"e164\",\"title\":\"罗兹亚人头税\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)对非信徒另征的人头税，是大陆唯一以宗教身份区分纳税标准的制度。\"},{\"id\":\"e165\",\"title\":\"门徒\",\"aliases\":[],\"body\":\"教会系统中[都主教](#idx-e152)及以上神职，以及[审判庭](#idx-e171)系统中自[督审判官](#idx-e154)及以上职位的别称，象征舍弃现世之乐、专心侍神；门徒不得婚娶。\"},{\"id\":\"e166\",\"title\":\"牧首厅\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)中枢以及[圣领](#idx-e483)最高行政机构，下设[圣礼厅](#idx-e173)、[省察厅](#idx-e179)、[司牧厅](#idx-e177)、[神启厅](#idx-e172)、[传信厅](#idx-e147)、[卫教厅](#idx-e178)六分厅。\"},{\"id\":\"e167\",\"title\":\"诺万尼斯流放\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[索拉瑞斯帝国](#idx-e429)维持的一种极刑，将受刑者留置诺万尼斯区域枯竭死地直至器官衰竭。\"},{\"id\":\"e168\",\"title\":\"审判分庭\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)在[都主教区](#idx-e153)一级的机构，长官称审判长，由[大审判长](#idx-e149)直接任命。\"},{\"id\":\"e169\",\"title\":\"审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)教阶之一，负责日常调查和执行事务，是[圣领](#idx-e483)独立于军事系统的强制执行编制。\"},{\"id\":\"e170\",\"title\":\"审判所外科室\",\"aliases\":[\"外科室\"],\"body\":\"[审判所](#idx-e162)中负责采集与比对元素[疏化](#idx-e37)痕迹的技术部门。\"},{\"id\":\"e171\",\"title\":\"审判庭\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)直属司法和执行机构，处理[异端](#idx-e143)事务、追查未经许可的神启施法，拥有独立执法和行刑权。\"},{\"id\":\"e172\",\"title\":\"神启厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管[神启魔法](#idx-e4)事务。\"},{\"id\":\"e173\",\"title\":\"圣礼厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管宗教事务，亦负责[索拉瑞斯](#idx-e429)[凯撒](#idx-e234)的[血脉测试](#idx-e253)。\"},{\"id\":\"e174\",\"title\":\"枢机主教团\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)事实上的最高权力机构，[大牧首](#idx-e148)去世后负责闭门选出继任者。成员由大牧首自[都主教](#idx-e152)中选任。\"},{\"id\":\"e175\",\"title\":\"司铎\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)教阶之一，位在[执事](#idx-e182)之上、主教之下，直辖各地基层教会。\"},{\"id\":\"e176\",\"title\":\"司祭\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)教阶之一，分管各城镇乡村的基层教会，往往本人即[神启魔法](#idx-e4)师。\"},{\"id\":\"e177\",\"title\":\"司牧厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管民生。\"},{\"id\":\"e178\",\"title\":\"卫教厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管军事，战时统一征召[护教军](#idx-e289)。\"},{\"id\":\"e179\",\"title\":\"省察厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管监察。\"},{\"id\":\"e180\",\"title\":\"修士／修女\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教会](#idx-e155)中经[大祝职](#idx-e104)受任的基层神职人员，[圣领](#idx-e483)全境行政官员均出于此。\"},{\"id\":\"e181\",\"title\":\"正教会\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰最大教派[正教](#idx-e146)的教会组织，以[忒奥西斯](#idx-e483)圣领[牧首厅](#idx-e166)为教会中枢，同时也是圣领的统治机构。\"},{\"id\":\"e182\",\"title\":\"执事\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)共有的教阶之一，位在[修士／修女](#idx-e180)之上。\"},{\"id\":\"e183\",\"title\":\"宗主教\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)领袖，由全大陆[公教](#idx-e107)主教选出三名候选，再由盲眼童贞信徒抽签决定。\"},{\"id\":\"e184\",\"title\":\"阿尔巴\",\"aliases\":[\"肆之神\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰中六神之一，壮年之形，象征在大地上撑起天空的四根基柱，司社会制度、秩序与统治；[神遴者](#idx-e412)高居众人之上的教义即以其名颁布。\"},{\"id\":\"e185\",\"title\":\"阿姆萨\",\"aliases\":[\"伍之神\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰中六神之一，中年之形，象征人手所出的智慧结晶，司智慧、工艺、制造与艺术。\"},{\"id\":\"e186\",\"title\":\"大神庙\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)首都[阿尔努尔](#idx-e518)城中的[教长](#idx-e199)驻地，是酋邦的宗教中心与圣地。\"},{\"id\":\"e187\",\"title\":\"混沌之海\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中[混沌之河](#idx-e188)的尽头。现世的[巨航船](#idx-e190)于此为海浪撕毁，是为末日。千年后新船于混沌之河上游再度起航。\"},{\"id\":\"e188\",\"title\":\"混沌之河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中，孕育[司费尔](#idx-e194)的停滞之河，经其令之流动后成为宇宙时间的载体。[巨航船](#idx-e190)自上游航行而下抵达[混沌之海](#idx-e187)，是为一次循环。\"},{\"id\":\"e189\",\"title\":\"祭司团\",\"aliases\":[],\"body\":\"[诸神圣土](#idx-e202)按六神分设的祭司团，各设大祭司一位，兼为辅助[教长](#idx-e199)治理圣土的行政机构。\"},{\"id\":\"e190\",\"title\":\"巨航船\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中的宇宙譬喻：[现界](#idx-e137)如行于[混沌之河](#idx-e188)上的巨船，终将驶抵[混沌之海](#idx-e187)。\"},{\"id\":\"e191\",\"title\":\"玛阿特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中的死后审判仪式，以心脏置于天平称量，砝码为[希塔](#idx-e197)手杖顶端的宝石。\"},{\"id\":\"e192\",\"title\":\"塞兰萨\",\"aliases\":[\"叁之神\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰中六神之一，青年之形，象征时间轮转与农时，司岁时更替、万物生长与记忆。\"},{\"id\":\"e193\",\"title\":\"守护兽\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中神祇所驯养的神兽，鹰头狮身蛇尾。心脏未能通过[玛阿特](#idx-e191)称量之人，其心为之吞噬。\"},{\"id\":\"e194\",\"title\":\"司费尔\",\"aliases\":[\"零之神\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰中[混沌之河](#idx-e188)所孕育的最初亦唯一之神，以自身之躯造出[现界](#idx-e137)，又拆己身为六片化作六神，随后消隐，不受祭祀。\"},{\"id\":\"e195\",\"title\":\"司费尔书\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰唯一的成文典籍，载创世、宇宙与诸神的全部神话，古今各部所载相当固定。\"},{\"id\":\"e196\",\"title\":\"瓦赫德\",\"aliases\":[\"壹之神\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰中六神之首，孩童之形，象征循环与现世的开端，司驱动[混沌之河](#idx-e188)的\\\"第一力\\\"，是[秘术](#idx-e3)力量的源头。\"},{\"id\":\"e197\",\"title\":\"希塔\",\"aliases\":[\"陆之神\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰中六神之一，老者之形，象征万物的终点，司灵魂与审判，看护[至福乐土](#idx-e201)；[玛阿特](#idx-e191)称量由其执行，砝码即其手杖顶端的宝石。\"},{\"id\":\"e198\",\"title\":\"血票\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)实行的，以活体生物作等价支付手段的制度，所收活物依教义可合法作为祭品用于[秘术](#idx-e3)祭祀。\"},{\"id\":\"e199\",\"title\":\"伊玛目教长\",\"aliases\":[\"教长\"],\"body\":\"[尼希尔](#idx-e517)最高元首，简称教长，同时是酋邦的宗教领袖与[酋长会议](#idx-e239)首席。终身制，非世袭，代代以[秘术](#idx-e3)密封诏书委任继承。\"},{\"id\":\"e200\",\"title\":\"伊斯南\",\"aliases\":[\"贰之神\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰六神之一，少年之形，象征二元的对立与调和，司昼夜交替、河流涨落等自然之象。\"},{\"id\":\"e201\",\"title\":\"至福乐土\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中，[玛阿特](#idx-e191)称量通过者所被允许进入的永恒安乐之地，由[希塔](#idx-e197)看护。\"},{\"id\":\"e202\",\"title\":\"诸神圣土\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)中由[伊玛目教长](#idx-e199)直辖的宗教领地。含首都[阿尔努尔](#idx-e518)及周边耕地城市，由各部按比例出资供养。\"},{\"id\":\"e203\",\"title\":\"伴礼者\",\"aliases\":[],\"body\":\"精灵[成年礼](#idx-e204)上为受礼者戴上花冠的角色，多由至亲、伴侣或挚友担任。\"},{\"id\":\"e204\",\"title\":\"成年礼\",\"aliases\":[],\"body\":\"精灵人生五礼之一，于三度[圣树枯荣](#idx-e210)后举行，含诵七诫、授剑与加冠。\"},{\"id\":\"e205\",\"title\":\"风鸟\",\"aliases\":[],\"body\":\"精灵以塑形魔法召唤的发光大鸟，可载人飞行。\"},{\"id\":\"e206\",\"title\":\"归根\",\"aliases\":[],\"body\":\"精灵葬礼之谓：肉身葬于大森林，灵魂回归[圣树](#idx-e214)，来日再作新芽降生。\"},{\"id\":\"e207\",\"title\":\"落叶\",\"aliases\":[],\"body\":\"精灵与[圣树](#idx-e214)的精神连接中断之谓，主动者称背弃圣树者，被动者称圣树抛弃者。\"},{\"id\":\"e208\",\"title\":\"人生大礼\",\"aliases\":[],\"body\":\"精灵的出生与命名、成年、结婚、怀孕、葬礼，分对草木的抽芽、成叶、开花、结果、[归根](#idx-e206)。\"},{\"id\":\"e209\",\"title\":\"圣树祭典\",\"aliases\":[],\"body\":\"精灵的周期性祭典，最重要的一场用于纪念一次[圣树枯荣](#idx-e210)周期的开始。\"},{\"id\":\"e210\",\"title\":\"圣树枯荣\",\"aliases\":[],\"body\":\"精灵计时的大周期，一度圣树枯荣为一祭典循环的开始。\"},{\"id\":\"e211\",\"title\":\"氏族\",\"aliases\":[],\"body\":\"精灵族的社会单位，被喻为[大圣树](#idx-e214)的分枝，各有族长与长老，本族领地内高度自治。\"},{\"id\":\"e212\",\"title\":\"司院\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e524)[叶络枢机院](#idx-e216)首席，由[万叶庭](#idx-e213)轮选中得票最多的长老出任，同时也是[圣树](#idx-e214)信仰的宗教领袖。\"},{\"id\":\"e213\",\"title\":\"万叶庭\",\"aliases\":[],\"body\":\"精灵族最高权力机构，每三十年于[希尔文尼亚](#idx-e527)召开，全体精灵借[圣树魔法](#idx-e8)旁听并投票。\"},{\"id\":\"e214\",\"title\":\"希尔文诺大圣树\",\"aliases\":[\"圣树\",\"大圣树\",\"圣树之母\"],\"body\":\"圣树信仰唯一的神圣对象，通称大圣树或圣树，矗立于[希尔文尼亚](#idx-e527)祭坛广场；凡有描述皆以女性位格出现，精灵称之为圣树之母，[自然魔法](#idx-e8)即祂分享之力。\"},{\"id\":\"e215\",\"title\":\"希尔文诺七诫\",\"aliases\":[],\"body\":\"[圣树](#idx-e214)对自己精灵子民的教化，总结为七条自幼诵习、贯穿一生的诫律，是为七诫，由历代[叶络枢机院](#idx-e216)口传维系。\"},{\"id\":\"e216\",\"title\":\"叶络枢机院\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e524)日常行政与对外事务机构，席位由[万叶庭](#idx-e213)轮选，长老兼承宗教职责。\"},{\"id\":\"e217\",\"title\":\"仪服\",\"aliases\":[],\"body\":\"精灵[成年礼](#idx-e204)所着礼服，颜色依[氏族](#idx-e211)惯例而定。\"},{\"id\":\"e218\",\"title\":\"阿斯塔伦·塔利瑞安\",\"aliases\":[\"塔利瑞安\"],\"body\":\"[星术](#idx-e7)泰斗，1097年联合十二城邦创建[大星术研究院](#idx-e226)，即今[王家研究院](#idx-e249)之前身。\"},{\"id\":\"e219\",\"title\":\"伯爵领\",\"aliases\":[],\"body\":\"艾瑟瑞姆与[阿布丹提亚](#idx-e452)的贵族封地，在艾瑟瑞姆为最高级别的贵族封地，位于子爵领之上；在阿布丹提亚则位于[公爵领](#idx-e230)之下，子爵领之上。\"},{\"id\":\"e220\",\"title\":\"伯爵领研究院\",\"aliases\":[],\"body\":\"艾瑟瑞姆四大[伯爵领](#idx-e219)各设的研究机构，专职[星术](#idx-e7)相关学术和技术研究。\"},{\"id\":\"e221\",\"title\":\"裁判所\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)的地方司法机构，分[行省](#idx-e232)与区两级，跨行省纠纷上报[凯撒](#idx-e234)亲判。\"},{\"id\":\"e222\",\"title\":\"城务会\",\"aliases\":[\"卡里司泰城务会\"],\"body\":\"[自由城市](#idx-e261)[卡里司泰](#idx-e526)的治理机构，由各国贸易机构负责人与[希尔文诺](#idx-e524)精灵特别代表组成，权限止于仓储、转运、市集与治安等市政事务。\"},{\"id\":\"e223\",\"title\":\"初星院\",\"aliases\":[],\"body\":\"艾瑟瑞姆各地的[星术](#idx-e7)教育机构之一，负责11-14岁儿童的基础通识和星术教育。毕业后可进入对应行会见习。\"},{\"id\":\"e224\",\"title\":\"大法官\",\"aliases\":[],\"body\":\"艾瑟瑞姆[大司法院](#idx-e225)最高长官，由国王/女王任命、终身任职，与国王/女王签有[仲裁星术契约](#idx-e95)以保绝对诚实。\"},{\"id\":\"e225\",\"title\":\"大司法院\",\"aliases\":[],\"body\":\"艾瑟瑞姆三大中央机构之一，承担司法职能，长官称[大法官](#idx-e224)。\"},{\"id\":\"e226\",\"title\":\"大星术研究院\",\"aliases\":[],\"body\":\"1097年由[塔利瑞安](#idx-e218)联合十二城邦创建，艾瑟瑞姆[王家研究院](#idx-e249)前身，是艾瑟瑞姆国家形态的起点。\"},{\"id\":\"e227\",\"title\":\"地星师\",\"aliases\":[],\"body\":\"艾瑟瑞姆[星术](#idx-e7)学者的头衔之一。星术师于所属研究院研究室完成课题答辩，毕业后被授予的头衔。\"},{\"id\":\"e228\",\"title\":\"帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)的一级行政区划，共五个，与皇室直辖的[维里迪亚直辖省](#idx-e481)并列；省政府为中央[内阁](#idx-e237)的地方分支。原为六省，[卡帕尼](#idx-e502)独立后余五省。\"},{\"id\":\"e229\",\"title\":\"芙德兰研究室\",\"aliases\":[],\"body\":\"艾瑟瑞姆[多古雷伯爵领](#idx-e496)研究院的研究室，以[界星石](#idx-e66)构型研究见长。\"},{\"id\":\"e230\",\"title\":\"公爵领\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)最高级别的贵族封地，各[帝政省](#idx-e228)含一到两个公爵领。\"},{\"id\":\"e231\",\"title\":\"管理局\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[特贸区](#idx-e505)的立法与行政机构，由区内各商会分部选派代表组成，最高长官称管理局主席。\"},{\"id\":\"e232\",\"title\":\"军团行省\",\"aliases\":[\"行省\"],\"body\":\"[索拉瑞斯](#idx-e429)的一级行政区划，一行省对应一[军团](#idx-e294)，共八个，长官称[行省总督](#idx-e251)。\"},{\"id\":\"e233\",\"title\":\"龙裔继嗣法\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)开国皇帝[阿利昂](#idx-e235)晚年制定的皇位继承法，以直系子嗣的龙血浓度为据，由[牧首厅](#idx-e166)主持[血脉测试](#idx-e253)。\"},{\"id\":\"e234\",\"title\":\"龙裔凯撒\",\"aliases\":[\"凯撒\"],\"body\":\"[索拉瑞斯](#idx-e429)最高统治者的称号，简称凯撒，即位须由[大牧首](#idx-e148)主持册封礼，体现君权神授。\"},{\"id\":\"e235\",\"title\":\"马尔奇安·阿利昂\",\"aliases\":[\"阿利昂\"],\"body\":\"[索拉瑞斯](#idx-e429)开国[凯撒](#idx-e234)，人龙混血，受[大牧首](#idx-e148)册封为首位龙裔凯撒；捐帝国东部领土立[忒奥西斯](#idx-e483)圣领，晚年制定《[龙裔继嗣法](#idx-e233)》。\"},{\"id\":\"e236\",\"title\":\"米萨兰研究室\",\"aliases\":[],\"body\":\"艾瑟瑞姆[王家研究院](#idx-e249)，[仲裁星术](#idx-e58)系弗莉亚·米萨兰主持的研究室。具[星术示踪](#idx-e46)资质。\"},{\"id\":\"e237\",\"title\":\"内阁\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)和[阿布丹提亚帝国](#idx-e452)的中央机构之一。均指直属于王室/皇室的日常行政机构，各有大臣分管外交、军务、内务与王室/皇室财政。\"},{\"id\":\"e238\",\"title\":\"普罗姆研究室\",\"aliases\":[],\"body\":\"艾瑟瑞姆[王家研究院](#idx-e249)的[星术](#idx-e7)研究室之一，从属于[仲裁星术](#idx-e58)系。\"},{\"id\":\"e239\",\"title\":\"酋长会议\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)最高权力机构，由[教长](#idx-e199)与各部落酋长组成，每年[金素](#idx-e350)季于[阿尔努尔](#idx-e518)召开，协商全酋邦外交、军事与内政事宜。\"},{\"id\":\"e240\",\"title\":\"三柱议会\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)最高立法与财政机构，1393年确立，三柱指皇室、贵族与魔法阶级。\"},{\"id\":\"e241\",\"title\":\"蚀刻总所\",\"aliases\":[],\"body\":\"艾瑟瑞姆[特别仪式区](#idx-e244)内的[星轨蚀刻](#idx-e76)总所，由[王家研究院](#idx-e249)直属，垄断产业链核心蚀刻环节。\"},{\"id\":\"e242\",\"title\":\"首席发言人\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[四公联席会议](#idx-e243)主席，由四公爵轮任，联席会议表决平局时握最终裁决权。\"},{\"id\":\"e243\",\"title\":\"四公联席会议\",\"aliases\":[\"联席会议\"],\"body\":\"[卡帕尼](#idx-e502)最高权力机构，由四公爵组成，设[首席发言人](#idx-e242)一职，每五年轮换。\"},{\"id\":\"e244\",\"title\":\"特别仪式区\",\"aliases\":[],\"body\":\"位于艾瑟瑞姆中南部最[大平原](#idx-e453)，专用于王国[星术](#idx-e7)研究与设备制造，行政直属国王/女王。\"},{\"id\":\"e245\",\"title\":\"特区商法典\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[北部特贸区](#idx-e505)适用的独立法系，不同于各公国法系。\"},{\"id\":\"e246\",\"title\":\"天星师\",\"aliases\":[],\"body\":\"[星术](#idx-e7)学者的最高阶头衔与职位，授予学术成果极为杰出的[地星师](#idx-e227)。[托兰瓦尔·洛林](#idx-e74)、[奥韦纳尔·安柯伦坦](#idx-e9)等均曾任天星师。\"},{\"id\":\"e247\",\"title\":\"天星首席\",\"aliases\":[],\"body\":\"艾瑟瑞姆[王家研究院](#idx-e249)最高级别学者之职，永久由艾瑟瑞姆国王或女王兼任。\"},{\"id\":\"e248\",\"title\":\"王冠领地\",\"aliases\":[],\"body\":\"艾瑟瑞姆国王直辖之地，含以首都[阿斯托利亚](#idx-e495)为首的[坠星湖](#idx-e501)南岸城市群。\"},{\"id\":\"e249\",\"title\":\"王家研究院\",\"aliases\":[],\"body\":\"艾瑟瑞姆学术中枢，前身为[大星术研究院](#idx-e226)，兼掌王室继承事务与[特别仪式区](#idx-e244)管理，院长即[天星首席](#idx-e247)，永久由国王或女王兼任。\"},{\"id\":\"e250\",\"title\":\"行省区\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团行省](#idx-e232)下按地理划分的次级区划，一区对应一团编制，长官称区长，由团长兼任。\"},{\"id\":\"e251\",\"title\":\"行省总督\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团行省](#idx-e232)最高长官，由[军团](#idx-e294)长兼任，任期二十年，每年赴首都[索尔因](#idx-e448)叙职。\"},{\"id\":\"e252\",\"title\":\"叙职大会\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八位[行省总督](#idx-e251)每年赴[索尔因](#idx-e448)向[凯撒](#idx-e234)当面汇报施政与军务的会议。\"},{\"id\":\"e253\",\"title\":\"血脉测试\",\"aliases\":[],\"body\":\"《[龙裔继嗣法](#idx-e233)》规定的继承资格测试，由[牧首厅](#idx-e166)[圣礼厅](#idx-e173)主持，每代[凯撒](#idx-e234)继承人均须重测。\"},{\"id\":\"e254\",\"title\":\"巡查分院\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[御使巡查院](#idx-e258)在各[行省](#idx-e232)的常驻机构，也是三大中央机构选拔人才的唯一渠道。\"},{\"id\":\"e255\",\"title\":\"御令\",\"aliases\":[],\"body\":\"指[索拉瑞斯帝国](#idx-e429)[凯撒](#idx-e234)签发的各类诏令与敕令。\"},{\"id\":\"e256\",\"title\":\"御前参谋部\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)最高军事机构，直属[凯撒](#idx-e234)，主理战略与军事调度。\"},{\"id\":\"e257\",\"title\":\"御前咨政院\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)最高文官机构，直属[凯撒](#idx-e234)，主理行政与立法。\"},{\"id\":\"e258\",\"title\":\"御使巡查院\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)中央机构，直属[凯撒](#idx-e234)，定期巡查各[行省](#idx-e232)行政与军务，仅有上报权。\"},{\"id\":\"e259\",\"title\":\"仲裁所\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[特贸区](#idx-e505)[管理局](#idx-e231)下属机构，承担特贸区司法职能。\"},{\"id\":\"e260\",\"title\":\"专星院\",\"aliases\":[],\"body\":\"艾瑟瑞姆各地的[星术](#idx-e7)教育机构之一，承担王国14-20岁的中高等教育。毕业授星术师头衔，是进入研究院深造，以及从事各类高星术技术要求行业的必要条件。\"},{\"id\":\"e261\",\"title\":\"自由城市\",\"aliases\":[],\"body\":\"不受任何人类政权管辖、亦不被承认为独立政治实体的城市，大陆仅[卡里司泰](#idx-e526)一处。须完全去武装化，不具外交主体地位，由驻城各方组成的[城务会](#idx-e222)共同治理。\"},{\"id\":\"e262\",\"title\":\"自治城市\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)不属任何贵族封地的城市，由[帝政省](#idx-e228)政府统一管理。\"},{\"id\":\"e263\",\"title\":\"阿索战争\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)与[索拉瑞斯帝国](#idx-e429)之间的三次大规模战争（1290–1292、1351–1356、1479–1483）。\"},{\"id\":\"e264\",\"title\":\"布兰顿和约\",\"aliases\":[],\"body\":\"[第二次阿索战争](#idx-e269)停战和约，以[布兰顿河](#idx-e463)下游为两国新界，[布兰顿](#idx-e462)城割予[索拉瑞斯](#idx-e429)。\"},{\"id\":\"e265\",\"title\":\"布兰顿战役\",\"aliases\":[],\"body\":\"1479年[三战](#idx-e270)前期的一场决定性会战，[阿布丹提亚帝国](#idx-e452)获得战略性胜利。\"},{\"id\":\"e266\",\"title\":\"不习者改革\",\"aliases\":[],\"body\":\"[三战](#idx-e270)后[艾瑟瑞姆王国](#idx-e494)推行的对外开放政策，要求王国各大城市与口岸为不习[星术](#idx-e7)者准备不依赖星术操作的各类公共设施。\"},{\"id\":\"e267\",\"title\":\"常驻使节体系\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)、[索拉瑞斯](#idx-e429)、[忒奥西斯](#idx-e483)、艾瑟瑞姆和[卡帕尼](#idx-e502)五国互设常驻使节的外交制度，[尼希尔](#idx-e517)游离其外。\"},{\"id\":\"e268\",\"title\":\"丹提亚-瑞姆技术协约\",\"aliases\":[\"丹提亚-瑞姆协约\"],\"body\":\"1304年[阿布丹提亚](#idx-e452)与艾瑟瑞姆缔结的长期协约，艾瑟瑞姆输出[星术](#idx-e7)成果与人才，换取阿布丹提亚[魔矿](#idx-e71)与战略资源。\"},{\"id\":\"e269\",\"title\":\"第二次阿索战争\",\"aliases\":[\"二战\"],\"body\":\"于1351–1356年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第二次大规模战争，[忒奥西斯](#idx-e483)保持中立。索拉瑞斯获胜，得[西比尔平原](#idx-e492)南部与[布兰顿](#idx-e462)城，停战于《[布兰顿和约](#idx-e264)》；阿布丹提亚放弃[卡帕尼](#idx-e502)群岛，卡帕尼同年独立。\"},{\"id\":\"e270\",\"title\":\"第三次阿索战争\",\"aliases\":[\"三战\"],\"body\":\"于1479–1483年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第三次大规模战争，阿布丹提亚获胜。停战于《[卡斯特鲁姆和约](#idx-e275)》，索拉瑞斯向阿布丹提亚归还[大运河](#idx-e427)下游东岸两座城市及其周边土地，两国当代边界由此确立。\"},{\"id\":\"e271\",\"title\":\"第一次阿索战争\",\"aliases\":[\"一战\"],\"body\":\"于1290–1292年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第一次大规模战争，[忒奥西斯](#idx-e483)为索拉瑞斯盟友。索拉瑞斯获胜后与圣领同告东扩，停战于《[文特拉和约](#idx-e283)》；间接促成1295年[教会大分裂](#idx-e160)。\"},{\"id\":\"e272\",\"title\":\"对外贸易所\",\"aliases\":[],\"body\":\"[林缘议厅](#idx-e276)附设的贸易场所，是[希尔文诺](#idx-e524)精灵与人类的唯一官方贸易渠道，仅做物物交易。\"},{\"id\":\"e273\",\"title\":\"黑暗时代\",\"aliases\":[],\"body\":\"指八世纪[七王约](#idx-e280)瓦解后，西诺拉尼亚地区长达数百年的多国混战时期。\"},{\"id\":\"e274\",\"title\":\"继承战争\",\"aliases\":[],\"body\":\"1402–1433年[索拉瑞斯帝国](#idx-e429)因第七代[龙裔凯撒](#idx-e234)子嗣血脉不达标而起的三十年内战。最终中辖[军团](#idx-e294)胜出，其支持的三皇子后加冕为第八代凯撒雷尔金一世。\"},{\"id\":\"e275\",\"title\":\"卡斯特鲁姆和约\",\"aliases\":[],\"body\":\"[第三次阿索战争](#idx-e270)停战和约，确立阿索当代边界；[大运河](#idx-e427)下游东岸两城交接至今悬而未决。\"},{\"id\":\"e276\",\"title\":\"林缘议厅\",\"aliases\":[],\"body\":\"1203年[希尔文诺](#idx-e524)[叶络枢机院](#idx-e216)于[冠脊山脉](#idx-e419)东南脉隘口所设，是当前大陆唯一公认的中立缔约见证机构。\"},{\"id\":\"e277\",\"title\":\"洛林星术技术合作会议\",\"aliases\":[\"洛林会议\"],\"body\":\"全称洛林星术技术合作会议，每三年一届，由[王家研究院](#idx-e249)和四[公爵领](#idx-e230)研究院轮流主持。汇聚王国各研究院学者交流学术进展，同时也接受实业界人士参加，致力于学术成果产业转化。\"},{\"id\":\"e278\",\"title\":\"梅尔卡托条约\",\"aliases\":[],\"body\":\"723年[阿布丹提亚](#idx-e452)与[卡帕尼王国](#idx-e534)签订，[卡帕尼](#idx-e502)由此成为帝国附庸国。\"},{\"id\":\"e279\",\"title\":\"诺万尼斯大叛乱\",\"aliases\":[],\"body\":\"758年[龙骑士](#idx-e295)群体与[诺万尼斯王国](#idx-e538)结盟发动的叛乱，[索瑞斯战役](#idx-e282)引发大规模[元素枯竭](#idx-e53)。\"},{\"id\":\"e280\",\"title\":\"七王约\",\"aliases\":[],\"body\":\"328年西诺拉尼亚七国建立的松散邦联，存续约四个世纪，八世纪中叶瓦解。\"},{\"id\":\"e281\",\"title\":\"圈地运动\",\"aliases\":[],\"body\":\"[三战](#idx-e270)以来，[阿布丹提亚](#idx-e452)贵族与魔法阶层借[农用星术设备](#idx-e72)提升庄园产出、驱赶农奴的运动。大量失去土地的农奴流向[卡帕尼联邦](#idx-e502)。\"},{\"id\":\"e282\",\"title\":\"索瑞斯战役\",\"aliases\":[],\"body\":\"[诺万尼斯大叛乱](#idx-e279)中交战双方连续动用大规模[神启魔法](#idx-e4)的会战，直接导致诺万尼斯枯竭。\"},{\"id\":\"e283\",\"title\":\"文特拉和约\",\"aliases\":[],\"body\":\"[第一次阿索战争](#idx-e271)停战和约，[索拉瑞斯](#idx-e429)与[忒奥西斯](#idx-e483)领土东扩。\"},{\"id\":\"e284\",\"title\":\"长矛步\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团](#idx-e294)内部沿用的旧制长度单位。\"},{\"id\":\"e285\",\"title\":\"大舰队\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国舰队的合称，是大陆唯一成熟的海军编制，设舰队司令统率。\"},{\"id\":\"e286\",\"title\":\"地方军\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)按[帝政省](#idx-e228)划编的常规部队，战时由贵族征召指挥，军费自负。\"},{\"id\":\"e287\",\"title\":\"对龙工程兵团\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)专为反制[龙骑兵团](#idx-e291)而设的特殊编制，列装[对龙穿甲弩炮](#idx-e62)与[移动星术谐振台](#idx-e93)。\"},{\"id\":\"e288\",\"title\":\"海军陆战队\",\"aliases\":[],\"body\":\"[大舰队](#idx-e285)下属的陆战单位，含常规士兵与魔法师部队。\"},{\"id\":\"e289\",\"title\":\"护教军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)最主要的常规部队，下分五个师，由各[都主教区](#idx-e153)分别组建。\"},{\"id\":\"e290\",\"title\":\"皇室近卫军\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)皇帝直辖的常备军，规模有限，军费由议会审批、自国库支出。\"},{\"id\":\"e291\",\"title\":\"近卫龙骑兵团\",\"aliases\":[\"龙骑兵团\"],\"body\":\"[索拉瑞斯](#idx-e429)以[飞龙](#idx-e292)为坐骑的精锐常规部队，通称龙骑兵团，直属[凯撒](#idx-e234)，约八万头飞龙、五万人编制，跨地形作战能力冠绝大陆。\"},{\"id\":\"e292\",\"title\":\"巨龙眷属\",\"aliases\":[\"飞龙\"],\"body\":\"巨龙与大型野兽的混血飞行亚种，通称飞龙，寿约五百年，是[龙骑兵团](#idx-e291)的坐骑。\"},{\"id\":\"e293\",\"title\":\"巨像部队\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)[星术兵团](#idx-e304)中以[星术巨像](#idx-e81)为作战单位的编制。\"},{\"id\":\"e294\",\"title\":\"军团\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)最高军事编制，与[行省](#idx-e232)一体，下设团、大队、小队。\"},{\"id\":\"e295\",\"title\":\"龙骑士\",\"aliases\":[],\"body\":\"与巨龙缔结[血契](#idx-e48)、得以释放[龙族魔法](#idx-e1)的人类战士，存在[半龙化](#idx-e11)现象。\"},{\"id\":\"e296\",\"title\":\"龙骑士团\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)的顶级战力，成员皆与巨龙缔结[血契](#idx-e48)，效忠[凯撒](#idx-e234)本人而非帝国，团内以多数决议事。\"},{\"id\":\"e297\",\"title\":\"屏星军\",\"aliases\":[],\"body\":\"艾瑟瑞姆对应他国常规作战部队的编制，作战单位完全由[巨像](#idx-e81)与[魔偶](#idx-e83)构成。\"},{\"id\":\"e298\",\"title\":\"神庙卫士\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)[教长](#idx-e199)直属的护卫编制，职能与[圣领](#idx-e483)[宗座卫队](#idx-e309)类似。\"},{\"id\":\"e299\",\"title\":\"神启法术部队\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)战时由各[军团](#idx-e294)向辖内地方教会征调的法术部队。\"},{\"id\":\"e300\",\"title\":\"神使军\",\"aliases\":[],\"body\":\"学界推测中[尼希尔酋邦](#idx-e517)由[神遴者](#idx-e412)构成的魔法部队。\"},{\"id\":\"e301\",\"title\":\"圣礼骑士\",\"aliases\":[],\"body\":\"由[大牧首](#idx-e148)册封的[龙骑士](#idx-e295)，席位限一人，承担[圣领](#idx-e483)防卫义务，但编制上仍属[龙骑士团](#idx-e296)。\"},{\"id\":\"e302\",\"title\":\"圣仪军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)直属的精锐法术作战部队，大陆规模最大的法术军力，兼承民间大型工程建设。\"},{\"id\":\"e303\",\"title\":\"王室近卫部队\",\"aliases\":[],\"body\":\"艾瑟瑞姆由国库维持、直属国王的常规部队。\"},{\"id\":\"e304\",\"title\":\"星术兵团\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)魔法军力的主体，由[巨像](#idx-e81)、操作巨像的[星术](#idx-e7)师与[野战星术师](#idx-e306)组成，直属皇室。\"},{\"id\":\"e305\",\"title\":\"星术工程部队\",\"aliases\":[],\"body\":\"艾瑟瑞姆[源星军](#idx-e307)下属编制，近年列装自[阿布丹提亚](#idx-e452)引进的[对龙穿甲弩炮](#idx-e62)等器械。\"},{\"id\":\"e306\",\"title\":\"野战星术师\",\"aliases\":[],\"body\":\"艾瑟瑞姆与[阿布丹提亚](#idx-e452)[星术](#idx-e7)部队中不操作[巨像](#idx-e81)，自主作战的星术师，与[巨像部队](#idx-e293)并列为魔法军力主体。\"},{\"id\":\"e307\",\"title\":\"源星军\",\"aliases\":[],\"body\":\"艾瑟瑞姆真正意义上的魔法部队，由[野战星术师](#idx-e306)与[星术工程部队](#idx-e305)构成。\"},{\"id\":\"e308\",\"title\":\"众徒军\",\"aliases\":[],\"body\":\"学界推测中[尼希尔](#idx-e517)由奴隶与自由民构成的常规部队。\"},{\"id\":\"e309\",\"title\":\"宗座卫队\",\"aliases\":[],\"body\":\"[大牧首](#idx-e148)与[枢机主教团](#idx-e174)的近卫，驻[圣城索菲亚](#idx-e487)，高层成员一切信息不对外公开。\"},{\"id\":\"e310\",\"title\":\"阿斯托戈商会\",\"aliases\":[],\"body\":\"艾瑟瑞姆王室直属商会，是[三战](#idx-e270)前[星术设备](#idx-e85)出口的唯一合法渠道，牵头维护[星术通讯体系](#idx-e86)。\"},{\"id\":\"e311\",\"title\":\"艾瑟瑞姆星币\",\"aliases\":[],\"body\":\"艾瑟瑞姆流通货币，含金合金内嵌[蚀刻魔矿](#idx-e73)，凡掌握[星术](#idx-e7)者均可鉴伪并读取面额。\"},{\"id\":\"e312\",\"title\":\"保险业\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)独有的金融业态，涵盖贸易险与年金。\"},{\"id\":\"e313\",\"title\":\"出口印戳\",\"aliases\":[],\"body\":\"[卡帕尼联邦](#idx-e502)出口货物所打的印戳；旧制年季日顺序因港务局而异，常致歧义。\"},{\"id\":\"e314\",\"title\":\"存票\",\"aliases\":[],\"body\":\"银行或教会发行的储蓄凭证，附有利率。在[阿布丹提亚](#idx-e452)、[卡帕尼](#idx-e502)和艾瑟瑞姆境内可在二级市场流通，卡帕尼存票可经银联跨行自由存取；[圣领](#idx-e483)存票仅限神职人员与教会机构之间流通，不开放民间交易。[尼希尔](#idx-e517)与[索拉瑞斯](#idx-e429)不发行存票。\"},{\"id\":\"e315\",\"title\":\"大梅希斯商会\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)皇家投资商会，垄断[丹提亚纸](#idx-e316)业约八成贸易量，兼[丹提亚-瑞姆技术协约](#idx-e268)阿方的全权贸易代表。\"},{\"id\":\"e316\",\"title\":\"丹提亚纸\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)以[棉短绒](#idx-e405)制成的高品质纸张，是各国高端纸制品，以及[尼卡特汇票](#idx-e326)最重要的原材料之一。\"},{\"id\":\"e317\",\"title\":\"费内尔金币\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)流通货币，以开国皇帝卡立曼·费内尔命名，与[费内尔铜币](#idx-e318)比率一比一百。\"},{\"id\":\"e318\",\"title\":\"费内尔铜币\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)辅币，仅以铸造工艺防伪，长期存在伪造的灰色问题。\"},{\"id\":\"e319\",\"title\":\"工匠行会\",\"aliases\":[],\"body\":\"按行业组织同业手工业者的机构，广泛存在于[阿布丹提亚](#idx-e452)、艾瑟瑞姆与[卡帕尼](#idx-e502)，实行学徒制，配方与工序属行会秘密。\"},{\"id\":\"e320\",\"title\":\"公债\",\"aliases\":[],\"body\":\"由国家或[帝政省](#idx-e228)政府发行的[债票](#idx-e343)，于[阿布丹提亚](#idx-e452)、艾瑟瑞姆和[卡帕尼](#idx-e502)发行流通。\"},{\"id\":\"e321\",\"title\":\"河金\",\"aliases\":[],\"body\":\"船只通行[索菲亚大运河](#idx-e427)所缴的费用，是[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)的重要常规收入。\"},{\"id\":\"e322\",\"title\":\"家族信托\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)独有的金融业态，服务于大陆各国权贵阶层的财富传承需求。\"},{\"id\":\"e323\",\"title\":\"交易所\",\"aliases\":[],\"body\":\"票据与投资凭证的交易场所，以[卡帕尼](#idx-e502)[特贸区](#idx-e505)最为发达。\"},{\"id\":\"e324\",\"title\":\"卡帕尼尼卡特铸币\",\"aliases\":[\"尼卡特\"],\"body\":\"[卡帕尼](#idx-e502)流通货币的通称，含金合金铸造，是大陆事实上的国际货币。\"},{\"id\":\"e325\",\"title\":\"卡帕尼银联\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[四大商会](#idx-e336)与众多中小商会银行共组的联合体，发行并管理[尼卡特汇票](#idx-e326)。\"},{\"id\":\"e326\",\"title\":\"卡帕尼银联汇票\",\"aliases\":[\"尼卡特汇票\",\"汇票\"],\"body\":\"[卡帕尼银联](#idx-e325)发行的结算凭证，通称尼卡特汇票或汇票，可在任意卡帕尼银联成员银行兑现，学界视为已具事实货币地位。\"},{\"id\":\"e327\",\"title\":\"凯撒铁钞\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)流通货币，几乎不含贵金属，以复杂铸造工艺防伪，伪造处罚极重。与[圣领](#idx-e483)[伊琳娜圣银币](#idx-e341)按一比一互认流通。\"},{\"id\":\"e328\",\"title\":\"凯撒铁筹\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)辅币，与铁钞比率一比一百。\"},{\"id\":\"e329\",\"title\":\"联邦特许商业星术师\",\"aliases\":[],\"body\":\"[卡帕尼联邦](#idx-e502)与艾瑟瑞姆合作创办的资质，取得该资质者有资格在联邦各类商会及相关行业从事[星术](#idx-e7)相关工作，并可定期领取联邦补贴。\"},{\"id\":\"e330\",\"title\":\"洛卡金票\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)独有的投资凭证，可投资特定商会或贸易活动，于[交易所](#idx-e323)自由买卖。\"},{\"id\":\"e331\",\"title\":\"尼卡特分铸币\",\"aliases\":[],\"body\":\"[尼卡特](#idx-e324)的辅币，兑换比率一比一百。\"},{\"id\":\"e332\",\"title\":\"尼希尔金币\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)各部落自铸货币的统称，普遍含少量黄金，各部之间汇率不固定。\"},{\"id\":\"e333\",\"title\":\"商会礼\",\"aliases\":[],\"body\":\"大陆通行的商会人员的行礼方式。\"},{\"id\":\"e334\",\"title\":\"商业星术师\",\"aliases\":[],\"body\":\"隶属艾瑟瑞姆商会，从事[星术](#idx-e7)相关商业活动的星术师。专责对外贸易事务的驻外星术师是大陆各国境内星术师的最大来源。\"},{\"id\":\"e335\",\"title\":\"圣约瑟商会\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)直属商会，垄断圣领境内外一切贸易，学界普遍认为兼具情报网络职能。\"},{\"id\":\"e336\",\"title\":\"四大商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国各自直属的商会，由四公爵历史上直接出资创立，其主席即公爵本人。\"},{\"id\":\"e337\",\"title\":\"碎星币\",\"aliases\":[],\"body\":\"[艾瑟瑞姆星币](#idx-e311)的辅币，兑换比率一比一百。\"},{\"id\":\"e338\",\"title\":\"索利亚商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)商会之一，1489年前后由卡涅·道格拉斯创办，以[星术设备](#idx-e85)半成品与[魔矿](#idx-e71)原料分销起家，后跃居联邦前列。\"},{\"id\":\"e339\",\"title\":\"汶托尼亚商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[四大商会](#idx-e336)之一，属[汶托尼亚](#idx-e514)公国。\"},{\"id\":\"e340\",\"title\":\"伊琳娜分银币\",\"aliases\":[],\"body\":\"[伊琳娜圣银币](#idx-e341)的辅币，兑换比率一比一百。\"},{\"id\":\"e341\",\"title\":\"伊琳娜圣银币\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)流通货币，以高含银量铸造并防伪，与[索拉瑞斯](#idx-e429)铁钞按一比一互认流通。\"},{\"id\":\"e342\",\"title\":\"佣兵工会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)、艾瑟瑞姆、[忒奥西斯](#idx-e483)和[阿布丹提亚](#idx-e452)境内设立的中介机构，便于雇主发布委托、佣兵接受与提交委托，同时也兼具管理佣兵群体和提供综合服务的职能。\"},{\"id\":\"e343\",\"title\":\"债票\",\"aliases\":[],\"body\":\"银行或教会发行的债务凭证，附有利率。在[阿布丹提亚](#idx-e452)、[卡帕尼](#idx-e502)和艾瑟瑞姆境内可在二级市场流通，[圣领](#idx-e483)债票仅限神职人员与教会机构之间流通，不开放民间交易。[尼希尔](#idx-e517)与[索拉瑞斯](#idx-e429)不发行债票。\"},{\"id\":\"e344\",\"title\":\"自由港\",\"aliases\":[],\"body\":\"[特贸区](#idx-e505)所设、享有极高自治权的港口体系，是国际贸易量激增的制度前提。\"},{\"id\":\"e345\",\"title\":\"裁曜日\",\"aliases\":[\"圣伊琳娜日\"],\"body\":\"[通用历](#idx-e368)一周第二日，亦简称星期二；[仪式历](#idx-e361)作圣伊琳娜日，对应天星[仲裁星](#idx-e549)。\"},{\"id\":\"e346\",\"title\":\"大陆历\",\"aliases\":[],\"body\":\"[通用历](#idx-e368)纪年，以[唯一神](#idx-e135)降临传教义于[圣约翰](#idx-e123)之年为元年，元年之前称元前。\"},{\"id\":\"e347\",\"title\":\"第四纪\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e524)精灵[圣树历](#idx-e362)纪元前缀，学界主流解释为[叶茂](#idx-e375)是精灵纪年传统中的第四个纪元。\"},{\"id\":\"e348\",\"title\":\"虹曜日\",\"aliases\":[\"圣保罗日\"],\"body\":\"[通用历](#idx-e368)一周第四日，亦简称星期四；[仪式历](#idx-e361)作圣保罗日，对应天星[织虹星](#idx-e548)。\"},{\"id\":\"e349\",\"title\":\"降临节\",\"aliases\":[],\"body\":\"[晖醒](#idx-e356)季首日，纪念[唯一神](#idx-e135)降临传道的[正教](#idx-e146)宗教节日，是宗教意义上的新年与全年最大节日。\"},{\"id\":\"e350\",\"title\":\"金素\",\"aliases\":[\"圣献\",\"冕宫月\",\"肆位\"],\"body\":\"一年六季的第四季，各地作物相继采收。[仪式历](#idx-e361)同季作圣献，艾瑟瑞姆[星历](#idx-e371)作冕宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作肆位。\"},{\"id\":\"e351\",\"title\":\"烬曜日\",\"aliases\":[\"圣约瑟日\"],\"body\":\"[通用历](#idx-e368)一周第三日，亦简称星期三；[仪式历](#idx-e361)作圣约瑟日，对应天星[烬铸星](#idx-e533)。\"},{\"id\":\"e352\",\"title\":\"立约节\",\"aliases\":[],\"body\":\"纪念约瑟在大地上首施[神启魔法](#idx-e4)、借予之约显明于世的[正教](#idx-e146)宗教节日，因邻[通用历](#idx-e368)新年常连同庆祝。\"},{\"id\":\"e353\",\"title\":\"凛寒\",\"aliases\":[\"正炼\",\"琴宫月\",\"陆位\"],\"body\":\"一年六季的第六季，山地封路、[凛冰洋](#idx-e423)冰封，大陆整体进入年内节律最为收缩的状态。[仪式历](#idx-e361)同季作正炼，艾瑟瑞姆[星历](#idx-e371)作琴宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作陆位。\"},{\"id\":\"e354\",\"title\":\"灵诞节\",\"aliases\":[],\"body\":\"[降临节](#idx-e349)后第四日，纪念神传道毕重返[天界](#idx-e133)；自降临节起五日为[正教](#idx-e146)信仰中全年最长的休息日。\"},{\"id\":\"e355\",\"title\":\"诺拉年\",\"aliases\":[\"人类年\"],\"body\":\"[通用历](#idx-e368)年在精灵历法研究语境中的称呼，亦称人类年；通常认为一[圣树](#idx-e214)年约合三诺拉年。\"},{\"id\":\"e356\",\"title\":\"启蛰\",\"aliases\":[\"晖醒\",\"天宫月\",\"壹位\"],\"body\":\"一年六季的第一季，[通用历](#idx-e368)岁首所在。[凛冰洋](#idx-e423)浮冰退散、山地封雪消融、两河进入汛期，各地贸易与出行随之重新活跃。[仪式历](#idx-e361)同季作晖醒，艾瑟瑞姆[星历](#idx-e371)作天宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作壹位。\"},{\"id\":\"e357\",\"title\":\"清和\",\"aliases\":[\"垂恩\",\"船宫月\",\"贰位\"],\"body\":\"一年六季的第二季，气候达到全年最宜人的状态，远洋航运与陆上商路均进入最活跃的窗口。[仪式历](#idx-e361)同季作垂恩，艾瑟瑞姆[星历](#idx-e371)作船宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作贰位。\"},{\"id\":\"e358\",\"title\":\"日曜日\",\"aliases\":[\"圣神日\"],\"body\":\"[通用历](#idx-e368)一周第五日，亦简称星期日；[仪式历](#idx-e361)作圣神日，对应天星[冠阳](#idx-e532)，是信众向[唯一神](#idx-e135)礼拜的礼拜日。\"},{\"id\":\"e359\",\"title\":\"萨辛历\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)地方历法，以当代伊玛目称号纪年，每代即位则重置元年，六季称[壹位](#idx-e356)至[陆位](#idx-e353)。\"},{\"id\":\"e360\",\"title\":\"圣保罗节\",\"aliases\":[],\"body\":\"纪念保罗殉道的[正教](#idx-e146)宗教节日。\"},{\"id\":\"e361\",\"title\":\"圣格里仪式历\",\"aliases\":[\"仪式历\"],\"body\":\"[正教会](#idx-e181)原始历法，[通用历](#idx-e368)前身，[圣领](#idx-e483)与[索拉瑞斯](#idx-e429)的官方历法，六季与五日均保留宗教命名。\"},{\"id\":\"e362\",\"title\":\"圣树历\",\"aliases\":[],\"body\":\"精灵族官方历法，据人类学界推测一[圣树](#idx-e214)年约合三[诺拉年](#idx-e355)，由三轮春夏秋冬循环构成十二亚季。\"},{\"id\":\"e363\",\"title\":\"升天节\",\"aliases\":[],\"body\":\"纪念[圣约翰](#idx-e123)殉道的[正教](#idx-e146)宗教节日，《约翰福音》载其在[十字架](#idx-e127)上讲道一昼夜后直升[天界](#idx-e133)。\"},{\"id\":\"e364\",\"title\":\"圣伊琳娜节\",\"aliases\":[],\"body\":\"纪念伊琳娜殉道的[正教](#idx-e146)宗教节日，与[圣约瑟节](#idx-e365)同被恋人与夫妻视为爱情之节。[圣典](#idx-e132)载二圣为夫妻、婚姻受神祝福。\"},{\"id\":\"e365\",\"title\":\"圣约瑟节\",\"aliases\":[],\"body\":\"纪念约瑟殉道的[正教](#idx-e146)宗教节日；与[圣伊琳娜节](#idx-e364)同被恋人与夫妻视为爱情之节。[圣典](#idx-e132)载二圣为夫妻、婚姻受神祝福。\"},{\"id\":\"e366\",\"title\":\"霜序\",\"aliases\":[\"肃省\",\"波宫月\",\"伍位\"],\"body\":\"一年六季的第五季，气温持续下降，商路与人流逐渐收束，各地进入交流的尾声窗口。[仪式历](#idx-e361)同季作肃省，艾瑟瑞姆[星历](#idx-e371)作波宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作伍位。\"},{\"id\":\"e367\",\"title\":\"穗时历\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)地方历法，以建国之年386年为元年，是[公教会](#idx-e155)改制[仪式历](#idx-e361)的主要蓝本。\"},{\"id\":\"e368\",\"title\":\"通用历\",\"aliases\":[\"格里历\"],\"body\":\"大陆通行的太阳历，一年六季、每季五十日、每旬十日、每周五日；别称格里历，源自[正教会](#idx-e181)的[圣格里仪式历](#idx-e361)，经[公教会](#idx-e155)世俗化后扩散全大陆。\"},{\"id\":\"e369\",\"title\":\"五曜日\",\"aliases\":[],\"body\":\"[通用历](#idx-e368)每周五日，各对应一颗天星：[日曜日](#idx-e358)、[月曜日](#idx-e376)、[裁曜日](#idx-e345)、[烬曜日](#idx-e351)、[虹曜日](#idx-e348)。\"},{\"id\":\"e370\",\"title\":\"显圣节\",\"aliases\":[],\"body\":\"纪念约翰受神圣诏、建立[现界](#idx-e137)第一个教会的[正教](#idx-e146)宗教节日。\"},{\"id\":\"e371\",\"title\":\"星历\",\"aliases\":[],\"body\":\"艾瑟瑞姆地方历法，大陆唯一的月亮历，六月之名取自黄道六宫。\"},{\"id\":\"e372\",\"title\":\"星历六月\",\"aliases\":[],\"body\":\"[天宫月](#idx-e356)、[船宫月](#idx-e357)、[牧宫月](#idx-e374)、[冕宫月](#idx-e350)、[波宫月](#idx-e366)、[琴宫月](#idx-e353)，取黄道六宫之简称。\"},{\"id\":\"e373\",\"title\":\"旬\",\"aliases\":[],\"body\":\"[通用历](#idx-e368)每季五分之一，一旬十日，依次称上旬、前旬、中旬、后旬、下旬。\"},{\"id\":\"e374\",\"title\":\"炎阳\",\"aliases\":[\"神焰\",\"牧宫月\",\"叁位\"],\"body\":\"一年六季的第三季，[晨风海](#idx-e414)带来充沛降水，东部平原产出攀至顶峰，各国军事行动与大规模物资调动亦多集中于此时。[仪式历](#idx-e361)同季作神焰，艾瑟瑞姆[星历](#idx-e371)作牧宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作叁位。\"},{\"id\":\"e375\",\"title\":\"叶茂\",\"aliases\":[],\"body\":\"精灵纪年的纪元名，其元年约当[通用历](#idx-e368)二世纪二十年代，来历不明。\"},{\"id\":\"e376\",\"title\":\"月曜日\",\"aliases\":[\"圣约翰日\"],\"body\":\"[通用历](#idx-e368)一周第一日，亦简称星期一；[仪式历](#idx-e361)作圣约翰日，对应天星[汐月](#idx-e544)，是四个劳作日之首。\"},{\"id\":\"e377\",\"title\":\"祝星节\",\"aliases\":[],\"body\":\"纪念保罗于四元素耗尽时借[以太](#idx-e17)显现神迹，仅[公教](#idx-e107)庆祝，[牧首厅](#idx-e166)视公开庆祝为[异端](#idx-e143)之举。\"},{\"id\":\"e378\",\"title\":\"步米\",\"aliases\":[],\"body\":\"长度基本单位，源自[索拉瑞斯](#idx-e429)[军团](#idx-e294)标准行军步伐；一步米等于十分步米等于一百厘步米。\"},{\"id\":\"e379\",\"title\":\"多特\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e524)重量单位，一多特等于一百[西特](#idx-e394)，约合十二[河磅](#idx-e382)。\"},{\"id\":\"e380\",\"title\":\"海里\",\"aliases\":[],\"body\":\"海上航程单位，由[大运河](#idx-e427)入海口至[波托马利](#idx-e506)的顺流直线航程三百等分而得，约合三[陆里](#idx-e387)。\"},{\"id\":\"e381\",\"title\":\"航程日\",\"aliases\":[],\"body\":\"早期航海沿用至今的航程单位，即标准商船在常规海况下昼夜不停所行之距离。\"},{\"id\":\"e382\",\"title\":\"河磅\",\"aliases\":[],\"body\":\"重量基本单位，源自沙阿万[魔矿](#idx-e71)场的矿砂称量；一河磅等于一百河克，一河吨等于一千河磅。\"},{\"id\":\"e383\",\"title\":\"赫略卡\",\"aliases\":[],\"body\":\"[希尔文诺体系](#idx-e393)下容量的单位，一赫略卡等于二十[怀略卡](#idx-e384)，约合零点七[圣加仑](#idx-e388)。\"},{\"id\":\"e384\",\"title\":\"怀略卡\",\"aliases\":[],\"body\":\"[希尔文诺体系](#idx-e393)下容量的小单位。\"},{\"id\":\"e385\",\"title\":\"界石\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团](#idx-e294)沿主干道每千步所立的里程标记，亦为[陆里](#idx-e387)之所本。\"},{\"id\":\"e386\",\"title\":\"露卡\",\"aliases\":[],\"body\":\"[希尔文诺体系](#idx-e393)下长度单位，一露卡等于一千[斯尔](#idx-e391)，约合五百[步米](#idx-e378)。\"},{\"id\":\"e387\",\"title\":\"陆里\",\"aliases\":[],\"body\":\"长度单位，一陆里等于一千[步米](#idx-e378)，源自[军团](#idx-e294)沿主干道每千步立一[界石](#idx-e385)的传统。\"},{\"id\":\"e388\",\"title\":\"圣加仑\",\"aliases\":[],\"body\":\"容量单位，源自[圣领](#idx-e483)酿酒业；一标准酒桶合一百圣加仑，一圣加仑十[圣品脱](#idx-e389)。\"},{\"id\":\"e389\",\"title\":\"圣品脱\",\"aliases\":[],\"body\":\"容量单位，常见于民间日常零售的油、酒、奶等小量交易。\"},{\"id\":\"e390\",\"title\":\"树斯尔\",\"aliases\":[],\"body\":\"[希尔文诺体系](#idx-e393)下体积单位，以树为立方前缀。\"},{\"id\":\"e391\",\"title\":\"斯尔\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e524)长度基本单位，约合零点五[步米](#idx-e378)；一分斯尔为百分之一斯尔。\"},{\"id\":\"e392\",\"title\":\"塔特\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e524)重量单位，一塔特等于一百[多特](#idx-e379)，约合一点二河吨。\"},{\"id\":\"e393\",\"title\":\"希尔文诺体系\",\"aliases\":[],\"body\":\"人类学界对精灵族历法与度量衡的合称，其度量衡对照系数百年来基本无漂移。\"},{\"id\":\"e394\",\"title\":\"西特\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e524)重量的小单位，约合十二河克。\"},{\"id\":\"e395\",\"title\":\"星度\",\"aliases\":[],\"body\":\"温度基本单位，源自[王家研究院](#idx-e249)的[魔矿](#idx-e71)[蚀刻](#idx-e76)环境控制需求，以纯水冰点为零、沸点为一百。\"},{\"id\":\"e396\",\"title\":\"叶斯尔\",\"aliases\":[],\"body\":\"[希尔文诺体系](#idx-e393)下面积单位，以叶为平方前缀。\"},{\"id\":\"e397\",\"title\":\"报时钟\",\"aliases\":[],\"body\":\"各国城镇常见的公共计时装置，一般安装于教堂钟楼。\"},{\"id\":\"e398\",\"title\":\"抄本\",\"aliases\":[],\"body\":\"手抄书籍，通行于印刷技术没有覆盖的广大乡村地区。成本和耗时高昂，存本以《[索菲亚圣典](#idx-e132)》最多：许多神职人员视手抄圣典为信仰修行的一部分。\"},{\"id\":\"e399\",\"title\":\"丹提亚穗稻\",\"aliases\":[\"穗稻\"],\"body\":\"[阿布丹提亚大平原](#idx-e453)的主粮作物，高产稳产，通称穗稻。\"},{\"id\":\"e400\",\"title\":\"雕版印刷\",\"aliases\":[],\"body\":\"基于[星术](#idx-e7)的印刷技术，成本较高。诞生自艾瑟瑞姆，应用于学术论著等印刷场合。经[丹提亚-瑞姆协约](#idx-e268)自艾瑟瑞姆传入[阿布丹提亚](#idx-e452)。\"},{\"id\":\"e401\",\"title\":\"冠脊剑麻\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)南部山区广布的麻类作物，是绳索、布料与麻袋的主要原料。\"},{\"id\":\"e402\",\"title\":\"咖啡馆\",\"aliases\":[],\"body\":\"艾瑟瑞姆遍布城镇的饮品场所，兼具学术交流功能，常办民间学术沙龙。\"},{\"id\":\"e403\",\"title\":\"卡帕尼千岛群星\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)北部岛链的美称，热带群岛风光吸引各国权贵，旅游业发达。\"},{\"id\":\"e404\",\"title\":\"拉韦洛印刷机\",\"aliases\":[],\"body\":\"1401年洛伦索·拉韦洛改造[汇票](#idx-e326)印制器械而成的活字印刷机，随跨国贸易扩散至全大陆。\"},{\"id\":\"e405\",\"title\":\"棉短绒\",\"aliases\":[],\"body\":\"棉花脱棉后的副产物，是[丹提亚纸](#idx-e316)的原料。\"},{\"id\":\"e406\",\"title\":\"萨阿尔血麦\",\"aliases\":[\"血麦\"],\"body\":\"原产[尼希尔](#idx-e517)两河泛滥平原的粮食作物，耐旱耐贫，通称血麦。\"},{\"id\":\"e407\",\"title\":\"甜叶莎\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)两河流域的制糖作物，耐旱喜强光照，是大陆制糖业的主要原料。\"},{\"id\":\"e408\",\"title\":\"托伊尔莓\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)代表性染料作物，提取亮蓝色染料后的脱色副产物是上好的发酵原料。\"},{\"id\":\"e409\",\"title\":\"托伊尔莓酒\",\"aliases\":[],\"body\":\"以[托伊尔莓](#idx-e408)脱色副产物酿造的酒，既用于宗教仪式，也作奢侈品出口。\"},{\"id\":\"e410\",\"title\":\"印本\",\"aliases\":[],\"body\":\"以印刷术制成的书籍，由于成本和技术普及度限制，基本只通行于各国大城市与富裕阶层之间。\"},{\"id\":\"e411\",\"title\":\"落叶精灵\",\"aliases\":[],\"body\":\"已与[圣树](#idx-e214)断开连接（无论主动被动）的精灵统称，离开大森林后即失去[自然魔法](#idx-e8)的施展能力。\"},{\"id\":\"e412\",\"title\":\"神遴者\",\"aliases\":[\"神遴者阶层\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰的[玛阿特](#idx-e191)称量中，心脏与宝石恰成平衡者。宗教解释中，他们身负引导众生的责任，受赐[秘术](#idx-e3)之力转生现世；作为一个阶层，神遴者垄断了酋邦一切政治职位，[教长](#idx-e199)、祭司、部落酋长与长老无一例外皆出于此。\"},{\"id\":\"e413\",\"title\":\"北门湾\",\"aliases\":[],\"body\":\"[凛冰洋](#idx-e423)伸入大陆中部的内湾，位于[忒奥西斯](#idx-e483)北境，是[索菲亚大运河](#idx-e427)的北端入口。[尼希尔](#idx-e517)[魔矿](#idx-e71)经凛冰洋航线抵此南下，是当代大陆最重要跨洋贸易干线上的节点；[运河仪所](#idx-e493)即设于湾口。\"},{\"id\":\"e414\",\"title\":\"晨风海\",\"aliases\":[],\"body\":\"大陆东南方海域，洋流自东往西、往北持续输送暖湿气流深入内陆，是[阿布丹提亚大平原](#idx-e453)优良农业气候的关键成因。[马提尼河](#idx-e471)与[波特利亚河](#idx-e461)汇流后注入此海。\"},{\"id\":\"e415\",\"title\":\"大星洋\",\"aliases\":[],\"body\":\"大陆西侧海域，洋流复杂多变，深远洋几无成规模的远洋航行；较活跃者唯[索拉瑞斯](#idx-e429)西海岸的近海航线，串联[镜心湖](#idx-e436)产区与西南偏远[行省](#idx-e232)。其偏暖洋流携湿润气流北上，遇[裂境山脉](#idx-e422)与[冠脊山脉](#idx-e419)抬升成雨，是索拉瑞斯森林覆盖率过半的核心水分来源。\"},{\"id\":\"e416\",\"title\":\"翡翠海峡\",\"aliases\":[],\"body\":\"大陆南方水域，全大陆航运最繁忙之处，[卡帕尼](#idx-e502)群岛与大陆本体之间的物流几乎全经于此，亦是[索菲亚大运河](#idx-e427)的南端出口。卡帕尼北部岛链水文条件优越、港口全年可用，是这条贸易干线的天然枢纽。\"},{\"id\":\"e417\",\"title\":\"丰饶海\",\"aliases\":[],\"body\":\"大陆东侧海域，海况温和、物产丰富，是[阿布丹提亚](#idx-e452)最重要的渔业海域，同时承担帝国东部的南北向海运；[东丹提亚半岛](#idx-e464)伸入其与[晨风海](#idx-e414)之间。\"},{\"id\":\"e418\",\"title\":\"葛林沃尔克山脉\",\"aliases\":[],\"body\":\"大陆东北方最高处，是[阿布丹提亚](#idx-e452)北境的天然屏障，有效阻隔[凛冰洋](#idx-e423)冷气团南下，使山脉以南的平原远较同纬度温和。南脉沿线为大陆东部最重要的金属矿产区，铁铜之外亦产[魔矿](#idx-e71)——后者于十三世纪末被发现，成为帝国与艾瑟瑞姆缔结技术协约的核心筹码。\"},{\"id\":\"e419\",\"title\":\"冠脊山脉\",\"aliases\":[],\"body\":\"大陆规模最大的山脉系统，分北、西、东南、南四脉。北脉与西脉合围[尼希尔](#idx-e517)南侧边境，北脉与东南脉之间夹含[希尔文诺大森林](#idx-e528)，南脉则完全位于[索拉瑞斯](#idx-e429)境内。冠脊山脉北脉同时是大陆西部最重要的气候屏障，其北为尼希尔干旱荒漠，其南为[希尔文诺](#idx-e524)封闭湿润的万年密林，是大陆诸域中最极端的毗邻气候对照。\"},{\"id\":\"e420\",\"title\":\"剑刃山脉\",\"aliases\":[],\"body\":\"沿艾索边境分布于艾瑟瑞姆西北的山脉，是两国的地形分界线，于王国西北方向有效阻隔来自[索拉瑞斯](#idx-e429)方向的大陆性冷气团。山脉南麓即艾瑟瑞姆一侧，蕴藏大陆第二[大魔矿](#idx-e521)矿脉，其高地温差稳定、排水良好，又是王国咖啡与烟草的产区。\"},{\"id\":\"e421\",\"title\":\"狂啸海\",\"aliases\":[],\"body\":\"大陆西北方水域，拥有环大陆诸海域中最为恶劣的海况，洋流混乱，离岸一定距离后存在成因不明的海啸与漩涡，几乎完全阻断了通往[逆律岛](#idx-e425)方向的一切航行尝试，各国均采取回避态度。[尼希尔](#idx-e517)隔此海与逆律岛相望。\"},{\"id\":\"e422\",\"title\":\"裂境山脉\",\"aliases\":[],\"body\":\"南北走向纵贯[索拉瑞斯](#idx-e429)中部，是帝国东西地形的核心分界线：以东为[奥利提斯平原](#idx-e430)，落在其雨影区而气候偏干；以西地势平缓，[镜心湖](#idx-e436)居中。沿线铁铜矿藏富集，是大陆冶铁产业最重要的原料来源；[索尔河](#idx-e447)发源于其南麓。\"},{\"id\":\"e423\",\"title\":\"凛冰洋\",\"aliases\":[],\"body\":\"大陆北方极寒洋，以东西向洋流为主，北部与东部全年有浮冰，渔业与运输活动仅集中于中西部海域；对大陆只输出严寒与干燥。[尼希尔](#idx-e517)[魔矿](#idx-e71)出口的主干路线即自两河出海口北上进入此洋，东行抵[北门湾](#idx-e413)后南下入[大运河](#idx-e427)。\"},{\"id\":\"e424\",\"title\":\"暮光湾\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)与艾瑟瑞姆边境附近的海湾，通向[大星洋](#idx-e415)，是两国边境贸易的海运补充节点。渔业资源稀少，使用频率不高——两国的跨国贸易以[坠星湖](#idx-e501)北部陆路为主。\"},{\"id\":\"e425\",\"title\":\"逆律岛\",\"aliases\":[],\"body\":\"据传存在于大陆西北方、越过[狂啸海](#idx-e421)的岛屿，没有任何经过核实的地理记录。仅有关于它以某种方式\\\"刻写\\\"抵达者的神秘传说流传至今，是各类文化作品的灵感素材。\"},{\"id\":\"e426\",\"title\":\"穗浪湾\",\"aliases\":[],\"body\":\"三面被[阿布丹提亚](#idx-e452)环抱的内湾，兼具渔业与内海运输双重功能，帝国东西两大农业产区之间的大量货物经此中转，是境内最重要的贸易通道之一。\"},{\"id\":\"e427\",\"title\":\"索菲亚大运河\",\"aliases\":[\"大运河\"],\"body\":\"[忒奥西斯](#idx-e483)与[索拉瑞斯](#idx-e429)联合开凿的人工水道，1381–1388年历时七年建成，以[圣仪军](#idx-e302)的[神启魔法](#idx-e4)为主力，是[大陆历](#idx-e346)史上最庞大的人造工程。自[北门湾](#idx-e413)几乎垂直向南贯穿[西比尔平原](#idx-e492)，南端注入[翡翠海峡](#idx-e416)，将[凛冰洋](#idx-e423)与翡翠海峡物理贯通，从根本上重塑了大陆南北贸易格局。管理权归圣领，凡向其报备货物并缴纳[河金](#idx-e321)的船只不分国籍皆可通行。\"},{\"id\":\"e428\",\"title\":\"终末碑座\",\"aliases\":[\"诺万尼斯平原\"],\"body\":\"[索拉瑞斯](#idx-e429)东南部平原，原为黑暗时期[诺万尼斯王国](#idx-e538)故地。[大陆历](#idx-e346)758年[诺万尼斯大叛乱](#idx-e279)的[索瑞斯战役](#idx-e282)中，交战双方连续动用大规模[神启魔法](#idx-e4)引发[元素枯竭](#idx-e53)，平原自此化为死地，七百余年未见任何恢复迹象，连天气现象亦已消失。索拉瑞斯、[忒奥西斯](#idx-e483)与艾瑟瑞姆三国均划为禁入区，是大陆上真正意义的无人之地，也是[诺万尼斯流放](#idx-e167)的行刑地。\"},{\"id\":\"e429\",\"title\":\"索拉瑞斯帝国\",\"aliases\":[\"索拉瑞斯\"],\"body\":\"位于大陆中西部的军事集权帝制大国，首都[索尔因维克图斯](#idx-e448)。1159年[索拉尔王国](#idx-e541)国王[阿利昂](#idx-e235)统一西大陆诸国、受牧首册封为首代[龙裔凯撒](#idx-e234)而立国。国土一千一百二十万平方[陆里](#idx-e387)，划为八个[军团行省](#idx-e232)，逾七成为群山与原始森林，人口约四千二百万。以[军团](#idx-e294)—行省一体化制度与[龙骑兵团](#idx-e291)著称，尊[正教](#idx-e146)为国教，逾八成公民为正教信徒；外交强势，与[阿布丹提亚](#idx-e452)共构当代大陆两极。\"},{\"id\":\"e430\",\"title\":\"奥利提斯平原\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)境内[裂境山脉](#idx-e422)以东呈东北—西南走向的狭长平原，是帝国最主要的农业区与人口集中地之一，首都[索尔因维克图斯](#idx-e448)位于其西南角。因落在裂境山脉雨影区，气候较[镜心湖](#idx-e436)区偏干。\"},{\"id\":\"e431\",\"title\":\"澄星湖\",\"aliases\":[],\"body\":\"位于[剑刃山脉](#idx-e420)东端的索艾边境处，是[索拉瑞斯](#idx-e429)与艾瑟瑞姆的天然分界线。渔业资源极少，仅承担少量跨国湖运，湖体平抑了艾瑟瑞姆核心地带的气温波动。\"},{\"id\":\"e432\",\"title\":\"东奥利提斯行省\",\"aliases\":[],\"body\":\"帝国东部的[军团行省](#idx-e232)，下辖[卡斯特鲁姆](#idx-e438)与[文特拉](#idx-e449)等城市。\"},{\"id\":\"e433\",\"title\":\"弗密纳\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[裂境北行省](#idx-e441)首府，位于[裂境山脉](#idx-e422)以北、[冠脊山脉](#idx-e419)南脉以南；城北为大片森林地区，称为[弗密纳北森](#idx-e434)。\"},{\"id\":\"e434\",\"title\":\"弗密纳北森\",\"aliases\":[],\"body\":\"[弗密纳](#idx-e433)北部森林，东北接[冠脊山脉](#idx-e419)南脉。\"},{\"id\":\"e435\",\"title\":\"哈吉奥多罗\",\"aliases\":[],\"body\":\"[索菲亚大运河](#idx-e427)下游东岸的粮站城市，位于[缪涅斯特](#idx-e444)以北，名出\\\"圣赐\\\"，是运河通航后[西比尔平原](#idx-e492)南部兴起的谷物集散地之一。与缪涅斯特同为《[卡斯特鲁姆和约](#idx-e275)》自[索拉瑞斯](#idx-e429)划归[阿布丹提亚](#idx-e452)的两城，交接至今悬而未决；索拉瑞斯凭对二城的实际管辖，保有对运河下游入海段的物理控制。\"},{\"id\":\"e436\",\"title\":\"镜心湖\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)西部的湖泊，是帝国最重要的农业产区核心与人口最密集的区域之一。受[大星洋](#idx-e415)暖流直接调节，湖体又进一步平抑温差，是帝国内气候最温和宜居的地带。[纳赫尔河](#idx-e520)发源于此；东岸最大城市为[雷克西姆](#idx-e440)。\"},{\"id\":\"e437\",\"title\":\"镜心湖行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八个[军团行省](#idx-e232)之一，位于帝国西部，环[镜心湖](#idx-e436)而设，首府[雷克西姆](#idx-e440)。\"},{\"id\":\"e438\",\"title\":\"卡斯特鲁姆\",\"aliases\":[],\"body\":\"位于[大运河](#idx-e427)下游西岸的[索拉瑞斯](#idx-e429)城市，[东奥利提斯行省](#idx-e432)第二大城市，仅次于南方的[文特拉](#idx-e449)。[第三次阿索战争](#idx-e270)末期曾遭[阿布丹提亚](#idx-e452)近卫军围困半季，停战的《[卡斯特鲁姆和约](#idx-e275)》即在此签订。三战后帝国失去大运河东岸土地，此城几成半边境城市。\"},{\"id\":\"e439\",\"title\":\"莱戈尔\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[西奥利提斯行省](#idx-e450)首府，[圣伊琳娜](#idx-e122)与[圣约瑟](#idx-e124)殉道之地，莱戈尔大教堂保管二圣[圣骸](#idx-e120)。帝国高层，如[军团](#idx-e294)长、[龙骑士](#idx-e295)等的婚礼多在此由索拉瑞斯[都主教](#idx-e152)主持，[凯撒](#idx-e234)婚礼则由[大牧首](#idx-e148)亲自主持。\"},{\"id\":\"e440\",\"title\":\"雷克西姆\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[镜心湖行省](#idx-e437)首府，[镜心湖](#idx-e436)东岸最大城市，建有[圣保罗](#idx-e119)大教堂。堂中无[圣骸](#idx-e120)，仅供奉据称是保罗生前所披的斗篷——保罗殉道之处据《保罗福音》末章推测邻近镜心湖，[正教会](#idx-e181)因此在雷克西姆建立大教堂。\"},{\"id\":\"e441\",\"title\":\"裂境北行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八个[军团行省](#idx-e232)之一，位于[裂境山脉](#idx-e422)以北、[冠脊山脉](#idx-e419)西脉与南脉以南，首府[弗密纳](#idx-e433)。\"},{\"id\":\"e442\",\"title\":\"裂境南行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八个[军团行省](#idx-e232)之一，位于[裂境山脉](#idx-e422)以南、[剑刃山脉](#idx-e420)以北，是帝国面向艾瑟瑞姆的南部行省。\"},{\"id\":\"e443\",\"title\":\"临海行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八个[军团行省](#idx-e232)之一，位于帝国西南端沿海，北接[狂啸海](#idx-e421)，西、南面[大星洋](#idx-e415)，东南为[暮光湾](#idx-e424)。\"},{\"id\":\"e444\",\"title\":\"缪涅斯特\",\"aliases\":[],\"body\":\"[布兰顿河](#idx-e463)以西、[索菲亚大运河](#idx-e427)以东的城市，是[索拉瑞斯](#idx-e429)在[西比尔平原](#idx-e492)南部的东向门户。与北面的[哈吉奥多罗](#idx-e435)同为《[卡斯特鲁姆和约](#idx-e275)》划归[阿布丹提亚](#idx-e452)的大运河下游东岸两城，行政交接至今未能完成。\"},{\"id\":\"e445\",\"title\":\"尼托雷特行省\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)八个[军团行省](#idx-e232)之一，位于东部边境地带，下辖[尼托韦德](#idx-e446)等边境聚落。\"},{\"id\":\"e446\",\"title\":\"尼托韦德\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[尼托雷特行省](#idx-e445)东部的边境小镇，住户不多，偏僻清冷，距首都[索尔因维克图斯](#idx-e448)约两千七百[陆里](#idx-e387)。\"},{\"id\":\"e447\",\"title\":\"索尔河\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)境内河流。发源于[裂境山脉](#idx-e422)南麓，流经首都[索尔因维克图斯](#idx-e448)后向东南注入艾瑟瑞姆境内的[坠星湖](#idx-e501)，是帝国重要的内河水系。\"},{\"id\":\"e448\",\"title\":\"索尔因维克图斯\",\"aliases\":[\"索尔因\"],\"body\":\"[索拉瑞斯帝国](#idx-e429)首都，通称索尔因，位于[奥利提斯平原](#idx-e430)西南角，[索尔河](#idx-e447)流经其间。是帝国的政治军事中心与最大城市，八位[行省总督](#idx-e251)每年赴此参加[叙职大会](#idx-e252)；城南设有[龙骑士团](#idx-e296)驻地与飞场。\"},{\"id\":\"e449\",\"title\":\"文特拉\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[东奥利提斯行省](#idx-e432)南方的海运枢纽，是该[行省](#idx-e232)第一大城市。[第一次阿索战争](#idx-e271)的停战和约《[文特拉和约](#idx-e283)》以其为名。\"},{\"id\":\"e450\",\"title\":\"西奥利提斯行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八个[军团行省](#idx-e232)之一，位于帝国中部，与[东奥利提斯行省](#idx-e432)同处[奥利提斯平原](#idx-e430)，首府[莱戈尔](#idx-e439)。\"},{\"id\":\"e451\",\"title\":\"中辖行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八个[军团行省](#idx-e232)之一，位于[裂境山脉](#idx-e422)东南，[索尔河](#idx-e447)流经其间，帝国首都[索尔因维克图斯](#idx-e448)所在行省。\"},{\"id\":\"e452\",\"title\":\"阿布丹提亚帝国\",\"aliases\":[\"阿布丹提亚\",\"丹提亚帝国\"],\"body\":\"通称丹提亚帝国，位于大陆东南方[大平原](#idx-e453)的君主宪政制大国，首都[维里迪亚](#idx-e480)。386年卡立曼·费内尔统一诸国建立帝政，费内尔家族统治延续至今；两次[阿索战争](#idx-e263)失利后于1393年建[三柱议会](#idx-e240)，和平演变为君主立宪制国家。国土八百七十万平方[陆里](#idx-e387)，划为五个[帝政省](#idx-e228)和一个直辖省，人口逾六千二百万，为全大陆最多。大陆第一大粮食出口国与政治东极，约七成人口信奉[公教](#idx-e107)。\"},{\"id\":\"e453\",\"title\":\"阿布丹提亚大平原\",\"aliases\":[\"大平原\"],\"body\":\"[阿布丹提亚帝国](#idx-e452)国土主体，大陆东部平原带规模最大的一部分，为全大陆最集中的农业核心地带。地势平坦开阔，水系极为发达，冲积土壤肥沃；中部核心区无霜期长而几无结冻，是帝国粮食、棉花与人口的集中所在，首都[维里迪亚](#idx-e480)居其腹地。\"},{\"id\":\"e454\",\"title\":\"阿格伯瑞\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内城市，从属于[阿格伯瑞帝政省](#idx-e455)所属同名[公爵领](#idx-e230)。[第三次阿索战争](#idx-e270)时期该公爵领领主为卡立曼七世的表叔韦尔滕·迪韦勒。\"},{\"id\":\"e455\",\"title\":\"阿格伯瑞帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)五个[帝政省](#idx-e228)之一，以帝政省最大城市[阿格伯瑞](#idx-e454)命名，位于帝国西北，靠近阿索边境。\"},{\"id\":\"e456\",\"title\":\"奥斯提乌姆\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内城镇，位于[西比尔平原](#idx-e492)东南缘，[布兰顿河](#idx-e463)与其西支流交汇处。[三战](#idx-e270)[布兰顿战役](#idx-e265)中[索拉瑞斯](#idx-e429)集团军指挥部所在地。\"},{\"id\":\"e457\",\"title\":\"贝伊尔伯爵领\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内[伯爵领](#idx-e219)，属于[墨塔顿帝政省](#idx-e473)。\"},{\"id\":\"e458\",\"title\":\"彼得宁村\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内村庄，属于[墨塔顿帝政省](#idx-e473)[贝伊尔伯爵领](#idx-e457)。\"},{\"id\":\"e459\",\"title\":\"波马里亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内位于[润溪湖](#idx-e474)西南方的重要城市。是大陆东部已知元素丰度最高的城市之一，天然宜居且对元素[疏化](#idx-e37)抵抗力强。历史上曾为[正教会](#idx-e181)在东诺拉尼亚最重要的宗教驻地，[教会大分裂](#idx-e160)后成为[公教总会](#idx-e157)所在地；[公教会](#idx-e155)于十四世纪宣称寻得的[圣保罗](#idx-e119)[圣骸](#idx-e120)即供奉于波马里亚大教堂。该城亦是波马里亚[公爵领](#idx-e230)首府，同名[帝政省](#idx-e228)的省名即出于此。\"},{\"id\":\"e460\",\"title\":\"波马里亚帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)五个[帝政省](#idx-e228)之一，位于帝国中北部，两湖之间。帝政省辖[波马里亚](#idx-e459)与[库珀贝尔](#idx-e469)两[公爵领](#idx-e230)，省名取自省内的[元素丰地](#idx-e52)城市波马里亚。\"},{\"id\":\"e461\",\"title\":\"波特利亚河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内的主要河流之一，发源自[葛林沃尔克](#idx-e525)南脉南麓，与[马提尼河](#idx-e471)于[大平原](#idx-e453)中部汇流后注入[晨风海](#idx-e414)，两河交汇处即首都[维里迪亚](#idx-e480)所在。\"},{\"id\":\"e462\",\"title\":\"布兰顿\",\"aliases\":[],\"body\":\"[布兰顿河](#idx-e463)东岸城市，位于河流中游。[第二次阿索战争](#idx-e269)后依《[布兰顿和约](#idx-e264)》割予[索拉瑞斯](#idx-e429)，此后一百二十余年是帝国边境最靠东的据点。1479年[三战](#idx-e270)开战之初为[阿布丹提亚](#idx-e452)夺取，此后终战未再易手，现归属于阿布丹提亚。\"},{\"id\":\"e463\",\"title\":\"布兰顿河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内河流。自北向南流经[西比尔平原](#idx-e492)东南缘，中段接纳一条自西而来的支流后折向东南，于[法拉利亚](#idx-e465)一带入海；[第二次阿索战争](#idx-e269)后其下游为阿索两国界河，《[布兰顿和约](#idx-e264)》即以此河命名，1479年[布兰顿战役](#idx-e265)的战场亦在其中下游两岸。\"},{\"id\":\"e464\",\"title\":\"东丹提亚半岛\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)东部伸入[晨风海](#idx-e414)与[丰饶海](#idx-e417)之间的半岛，三面临海，是帝国海洋性气候最为突出的地带，夏天较内陆凉爽，渔业禀赋优于农业。\"},{\"id\":\"e465\",\"title\":\"法拉利亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内，[布兰顿河](#idx-e463)入[翡翠海峡](#idx-e416)河口处的港镇。\"},{\"id\":\"e466\",\"title\":\"费洛菲尔德\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内城市，[三战](#idx-e270)前靠近阿索边境，从属于[阿格伯瑞帝政省](#idx-e455)所属同名[公爵领](#idx-e230)。阿布丹提亚主要军工器械产地之一。\"},{\"id\":\"e467\",\"title\":\"弗鲁门尼亚帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)五个[帝政省](#idx-e228)之一，位于帝国东北。\"},{\"id\":\"e468\",\"title\":\"格雷瓦罗\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)最大城市，位于首都南方的帝国最南端，南面[晨风海](#idx-e414)、西南面[翡翠海峡](#idx-e416)，正当两片水域交界处，是帝国通往翡翠海峡的主要出入口。气候大体温和，但[凛寒](#idx-e353)季海上来风凛冽。\"},{\"id\":\"e469\",\"title\":\"库珀贝尔\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)北部矿业城市，从属于[波马里亚帝政省](#idx-e460)所属同名[公爵领](#idx-e230)。阿布丹提亚主要军工器械产地之一。\"},{\"id\":\"e470\",\"title\":\"卢佩尔库姆\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内城镇，位于[布兰顿河](#idx-e463)西支流上游。\"},{\"id\":\"e471\",\"title\":\"马提尼河\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)第一大河，发源于[穗满湖](#idx-e477)，向东南流经[大平原](#idx-e453)后与[波特利亚河](#idx-e461)汇流注入[晨风海](#idx-e414)，两河交汇处即首都[维里迪亚](#idx-e480)所在。\"},{\"id\":\"e472\",\"title\":\"米尔罗\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内城镇，位于[布兰顿](#idx-e462)东南方，是阿布丹提亚在这一带的路网枢纽。\"},{\"id\":\"e473\",\"title\":\"墨塔顿帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)五个[帝政省](#idx-e228)之一，位于帝国东南部，辖[斯拉格丹](#idx-e476)[公爵领](#idx-e230)和[赛兰德](#idx-e475)子爵领等贵族领地。\"},{\"id\":\"e474\",\"title\":\"润溪湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)双湖之东者，与[穗满湖](#idx-e477)并称双湖，是帝国北部水系的重要源头。湖运承担北部矿区矿产向核心区的输送；西南方为[元素丰地](#idx-e52)城市[波马里亚](#idx-e459)。\"},{\"id\":\"e475\",\"title\":\"赛兰德\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内城市，从属于[墨塔顿帝政省](#idx-e473)所属同名子爵领，城市规模较小。\"},{\"id\":\"e476\",\"title\":\"斯拉格丹\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内城市，从属于[墨塔顿帝政省](#idx-e473)所属同名[公爵领](#idx-e230)，位于[穗浪湾](#idx-e426)东岸。[大梅希斯商会](#idx-e315)在此设有分部。\"},{\"id\":\"e477\",\"title\":\"穗满湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)双湖之西者，与[润溪湖](#idx-e474)并称双湖。湖区周边水草丰美，是全大陆最集中的规模化牧区；[马提尼河](#idx-e471)发源于此。\"},{\"id\":\"e478\",\"title\":\"塔尔村\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内村庄，属于[墨塔顿帝政省](#idx-e473)[赛兰德](#idx-e475)子爵领。\"},{\"id\":\"e479\",\"title\":\"塔里村\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内村庄，属于[墨塔顿帝政省](#idx-e473)[赛兰德](#idx-e475)子爵领。\"},{\"id\":\"e480\",\"title\":\"维里迪亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)首都，位于[马提尼河](#idx-e471)与[波特利亚河](#idx-e461)交汇处、[大平原](#idx-e453)腹地，是帝国政治文化中心，也是帝国最重要的内河航运枢纽之一。城市内歌剧院与画廊林立，素有\\\"艺术之都\\\"之称。\"},{\"id\":\"e481\",\"title\":\"维里迪亚直辖省\",\"aliases\":[\"首都直辖省\"],\"body\":\"[阿布丹提亚帝国](#idx-e452)六个一级行政区中唯一由皇室直辖者，亦称首都直辖省，位于帝国西南，含首都[维里迪亚](#idx-e480)及周边；境内不设贵族封地与[帝政省](#idx-e228)政府，是该国唯一的直辖省。\"},{\"id\":\"e482\",\"title\":\"英克菲尔德帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)五个[帝政省](#idx-e228)之一，位于帝国东部，[穗浪湾](#idx-e426)东北方。\"},{\"id\":\"e483\",\"title\":\"忒奥西斯圣治领\",\"aliases\":[\"忒奥西斯\",\"圣治领\",\"圣领\"],\"body\":\"通称圣治领或圣领，位于大陆中央北部的[正教会](#idx-e181)神权共和国，首都[圣城索菲亚](#idx-e487)。1159年[索拉瑞斯](#idx-e429)开国[凯撒](#idx-e234)[阿利昂](#idx-e235)将帝国东部领土捐献给[大牧首](#idx-e148)而立，是正教会取得世俗领地后的政治实体。国土两百三十万平方[陆里](#idx-e387)，划为五个[都主教区](#idx-e153)，人口一千三百万。大牧首兼国家元首，[牧首厅](#idx-e166)为最高行政机构；直属[圣仪军](#idx-e302)兼掌国防与大型工程，[索菲亚大运河](#idx-e427)即其代表成果。\"},{\"id\":\"e484\",\"title\":\"诺柏多\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)境内城市，是[圣伊琳娜都主教区](#idx-e488)南部最大城市，[西昂斯教区](#idx-e491)的教座城。\"},{\"id\":\"e485\",\"title\":\"潘克拉托\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)境内城市，[圣约翰都主教区](#idx-e489)的都教座城。[圣约翰](#idx-e123)殉道之地，[圣骸](#idx-e120)存于圣约翰大教堂。\"},{\"id\":\"e486\",\"title\":\"塞林村\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)南部村庄，隶属[圣伊琳娜都主教区](#idx-e488)的[西昂斯教区](#idx-e491)。\"},{\"id\":\"e487\",\"title\":\"圣城索菲亚\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领首都，[大牧首](#idx-e148)及[牧首厅](#idx-e166)所在地。相传为[唯一神](#idx-e135)降临之处，本为小村，圣领建立及[大运河](#idx-e427)开通后扩张为兼具政治、宗教与经济中心地位的大都会。是大陆中部已知最大的[元素丰地](#idx-e52)，也是[正教会](#idx-e181)立都于此的重要自然前提；索菲亚大教堂藏有据称是[圣约翰](#idx-e123)升天时所钉[十字架](#idx-e127)的原木碎片。\"},{\"id\":\"e488\",\"title\":\"圣伊琳娜都主教区\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领南部的[都主教区](#idx-e153)，以四[使徒](#idx-e126)之一[圣伊琳娜](#idx-e122)命名，辖西昂斯等[教区](#idx-e161)。\"},{\"id\":\"e489\",\"title\":\"圣约翰都主教区\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领西南部[都主教区](#idx-e153)，以四[使徒](#idx-e126)之首[圣约翰](#idx-e123)命名，辖存有圣约翰[圣骸](#idx-e120)的[潘克拉托](#idx-e485)等地。\"},{\"id\":\"e490\",\"title\":\"索菲亚银矿\",\"aliases\":[],\"body\":\"[圣城索菲亚](#idx-e487)城北的银矿，是大陆已知规模最大的单一银矿产地，其产出构成[忒奥西斯](#idx-e483)高含银量货币体系的物质基础，[伊琳娜圣银币](#idx-e341)即以此为原料铸造。\"},{\"id\":\"e491\",\"title\":\"西昂斯教区\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)[圣伊琳娜都主教区](#idx-e488)下辖的[教区](#idx-e161)，教座设于[诺柏多](#idx-e484)，辖[塞林村](#idx-e486)等村庄，靠近圣领南境。\"},{\"id\":\"e492\",\"title\":\"西比尔平原\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领所在的温带半干旱草原，地势平坦、天然水源匮乏，[索菲亚大运河](#idx-e427)贯通前农业条件相当有限；北延至[北门湾](#idx-e413)，是大陆南北贸易的关键咽喉。其南部于[二战](#idx-e269)后尽归[索拉瑞斯](#idx-e429)，后为索菲亚大运河纵切为二；运河以东的土地依[三战](#idx-e270)《[卡斯特鲁姆和约](#idx-e275)》归[阿布丹提亚](#idx-e452)，交接至今悬置，是阿索两国博弈的核心争议。\"},{\"id\":\"e493\",\"title\":\"运河仪所\",\"aliases\":[],\"body\":\"坐落于[忒奥西斯](#idx-e483)圣领领土最北端、[索菲亚大运河](#idx-e427)与[北门湾](#idx-e413)交汇入口处的机构，是[牧首厅](#idx-e166)对大运河实施管理的最前沿。承担通行审核与海水除盐双重职能，常驻[神启魔法](#idx-e4)师持续以水元素魔法析出注入运河的海水盐分。其除盐作业常年施法却从未引发可观测的元素[疏化](#idx-e37)，已成为[魔元素动力学](#idx-e29)的专项研究课题。\"},{\"id\":\"e494\",\"title\":\"艾瑟瑞姆王国\",\"aliases\":[],\"body\":\"位于大陆西南部的封建君主制国家，首都[阿斯托利亚](#idx-e495)，领土环抱[坠星湖](#idx-e501)。源出西诺拉尼亚黑暗时期南下避难的[星术](#idx-e7)学者聚落，十一世纪末[塔利瑞安](#idx-e218)联合十二城邦创建[大星术研究院](#idx-e226)，十三世纪前叶塔利兰娜受推举加冕为初代女王。国土约四百二十万平方[陆里](#idx-e387)，由[王冠领地](#idx-e248)、四大伯爵封邑与[特别仪式区](#idx-e244)构成，人口约一千八百万。以星术立国，[王家研究院](#idx-e249)[天星首席](#idx-e247)永由君主兼任，传统意义的[施法者](#idx-e36)占人口逾半。\"},{\"id\":\"e495\",\"title\":\"阿斯托利亚\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)首都，位于[坠星湖](#idx-e501)南端[瑟蒂尔河](#idx-e499)出湖处，由[大陆历](#idx-e346)894年南下避难的[星术](#idx-e7)学者聚落发展而成，[王家研究院](#idx-e249)即设于此。城名源出[星空学派](#idx-e6)早期所用的 Astralis（\\\"属星的\\\"），后世音变作 Astoria，旧拼法今仅见于研究院的仪式文书。\"},{\"id\":\"e496\",\"title\":\"多古雷伯爵领\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)四大[伯爵领](#idx-e219)之一，辖有王国最大城市[斯特拉拉](#idx-e500)，设有多古雷伯爵领研究院，其[芙德兰研究室](#idx-e229)以[界星石](#idx-e66)构型研究见长。开放程度与对商业合作的积极性在王国各地区内属前列。\"},{\"id\":\"e497\",\"title\":\"卡尔姆\",\"aliases\":[],\"body\":\"[卡伊尔伯爵领](#idx-e498)首府，卡伊尔伯爵领研究院所在地，艾瑟瑞姆南部最大港城，濒[大星洋](#idx-e415)。卡伊尔伯爵为王国保守派代表人物，对[不习者改革](#idx-e266)态度消极，领内外国人极为罕见。王国第六十三届[洛林会议](#idx-e277)在城内[伯爵领研究院](#idx-e220)召开。\"},{\"id\":\"e498\",\"title\":\"卡伊尔伯爵领\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)四大[伯爵领](#idx-e219)之一，首府[卡尔姆](#idx-e497)，领地毗邻[特别仪式区](#idx-e244)，设有卡伊尔伯爵领研究院。领主卡伊尔伯爵为保守派代表人物，是王国内抵制[不习者改革](#idx-e266)与对外开放最力者。\"},{\"id\":\"e499\",\"title\":\"瑟蒂尔河\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)境内河流。由[坠星湖](#idx-e501)南端出发，向南流经艾瑟瑞姆注入[大星洋](#idx-e415)，首都[阿斯托利亚](#idx-e495)位于其北端出湖处。\"},{\"id\":\"e500\",\"title\":\"斯特拉拉\",\"aliases\":[],\"body\":\"艾瑟瑞姆[多古雷伯爵领](#idx-e496)以及王国最大城市。位于首都以东、面向[翡翠海峡](#idx-e416)，是王国的海陆交通枢纽与主要对外贸易门户，也是对[卡帕尼](#idx-e502)贸易的最大口岸。[阿斯托戈商会](#idx-e310)在此设有分部。\"},{\"id\":\"e501\",\"title\":\"坠星湖\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)的地理中心，首都[阿斯托利亚](#idx-e495)位于其南端出湖口。[索尔河](#idx-e447)自[索拉瑞斯](#idx-e429)方向注入湖北端，[瑟蒂尔河](#idx-e499)由南端流出南向[大星洋](#idx-e415)；湖运依托[星术](#idx-e7)船只，是沿岸城市群最重要的内部贸易路线。\"},{\"id\":\"e502\",\"title\":\"卡帕尼诸公联合\",\"aliases\":[\"卡帕尼\",\"卡帕尼联邦\"],\"body\":\"又称卡帕尼联邦，位于大陆南部群岛的公国联邦制国家，由四成员公国与[北部特别贸易区](#idx-e505)组成，四公国各有首府，联邦首都为[阿卡帕尼](#idx-e503)公国的[伊索拉韦尔德](#idx-e516)。1356年[第二次阿索战争](#idx-e269)后，四公爵于[米德可尔](#idx-e512)会晤宣布脱离[阿布丹提亚](#idx-e452)独立。国土约二百五十万平方[陆里](#idx-e387)，散布于七十八座岛屿，人口约九百八十万。联邦以商贸与金融立国，外交奉行离岸平衡，热带群岛旅游业亦非常发达。\"},{\"id\":\"e503\",\"title\":\"阿卡帕尼\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一，由同名公爵世袭领有，核心领地为[阿卡帕尼岛](#idx-e504)，首府[伊索拉韦尔德](#idx-e516)亦为联邦首都。\"},{\"id\":\"e504\",\"title\":\"阿卡帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)群岛南部主岛区的核心岛屿之一，与[梅尔帕尼岛](#idx-e510)合计聚居全联邦逾半人口。\"},{\"id\":\"e505\",\"title\":\"北部特别贸易区\",\"aliases\":[\"特贸区\",\"北部特贸区\"],\"body\":\"[卡帕尼联邦](#idx-e502)于1382年于群岛北部岛链设立的特别经济区，由五十八座岛屿及[自由港](#idx-e344)组成，适用独立的[特区商法典](#idx-e245)与优惠贸易税率，设[管理局](#idx-e231)与[仲裁所](#idx-e259)自治，是大陆各国商人自由设立分部开展贸易的核心地带，也是联邦金融机构最密集之处。\"},{\"id\":\"e506\",\"title\":\"波托马利\",\"aliases\":[],\"body\":\"[卡帕尼联邦](#idx-e502)最大城市，位于[北部特贸区](#idx-e505)、[翡翠海峡](#idx-e416)中央，是全大陆南北贸易的关键枢纽与海运门户。\"},{\"id\":\"e507\",\"title\":\"卡恩顿\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一，由同名公爵世袭领有，首府[柯拉罗](#idx-e508)。\"},{\"id\":\"e508\",\"title\":\"柯拉罗\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一[卡恩顿](#idx-e507)公国首府。\"},{\"id\":\"e509\",\"title\":\"梅尔帕尼\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一，由同名公爵世袭领有，核心领地为[梅尔帕尼岛](#idx-e510)，首府[梅卡托](#idx-e511)。现任[四公联席会议](#idx-e243)[首席发言人](#idx-e242)诺维雅三世即梅尔帕尼公爵。\"},{\"id\":\"e510\",\"title\":\"梅尔帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)群岛南部主岛区的核心岛屿之一，与[阿卡帕尼岛](#idx-e504)合计聚居全联邦逾半人口。\"},{\"id\":\"e511\",\"title\":\"梅卡托\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一[梅尔帕尼](#idx-e509)公国首府。\"},{\"id\":\"e512\",\"title\":\"米德可尔\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)境内地名。1356年[第二次阿索战争](#idx-e269)后，卡帕尼四公爵于此会晤宣布建立诸公联合，是联邦独立的历史象征地点。\"},{\"id\":\"e513\",\"title\":\"汶托布鲁\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一[汶托尼亚](#idx-e514)公国首府。\"},{\"id\":\"e514\",\"title\":\"汶托尼亚\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一，由同名公爵世袭领有，首府[汶托布鲁](#idx-e513)；其[汶托尼亚商会](#idx-e339)为[四大商会](#idx-e336)之一。\"},{\"id\":\"e515\",\"title\":\"谢兰港\",\"aliases\":[],\"body\":\"[卡帕尼联邦](#idx-e502)[波托马利](#idx-e506)城内的主要港口区。\"},{\"id\":\"e516\",\"title\":\"伊索拉韦尔德\",\"aliases\":[\"伊索拉\"],\"body\":\"[卡帕尼诸公联合](#idx-e502)首都，通称伊索拉，同时是[阿卡帕尼](#idx-e503)公国首府，四公国的政治核心所在地。当地作坊以镀银工艺见长，[索利亚商会](#idx-e338)创办于此。\"},{\"id\":\"e517\",\"title\":\"尼希尔伊玛目酋邦\",\"aliases\":[\"尼希尔\",\"尼希尔酋邦\"],\"body\":\"通称尼希尔酋邦，位于大陆西北角沙漠绿洲与两河流域的神权部落联邦国家，首都[阿尔努尔](#idx-e518)。五世纪[萨阿尔血王朝](#idx-e539)覆灭后，诸部酋长于阿尔努尔会盟，推举诸神大祭司为[伊玛目教长](#idx-e199)，成立酋邦。尼希尔国土五百八十万平方[陆里](#idx-e387)，由[诸神圣土](#idx-e202)与八部落领地构成，人口约一千八百万。酋邦是当今大陆唯一合法保有奴隶制的国家，社会等级高度固化。\"},{\"id\":\"e518\",\"title\":\"阿尔努尔\",\"aliases\":[],\"body\":\"[尼希尔伊玛目酋邦](#idx-e517)首都兼伊玛目城，位于两河流域核心地带，属[教长](#idx-e199)直辖的[诸神圣土](#idx-e202)。422年诸部酋长于此会盟建立部落联邦体制、推举首任伊玛目教长；城中六神各有神庙，另有教长主持全酋邦最隆重仪典的[大神庙](#idx-e186)，[酋长会议](#idx-e239)亦每年在此召开。\"},{\"id\":\"e519\",\"title\":\"哈亚特河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)两河之东河，发源于[冠脊山脉](#idx-e419)西脉北麓的积雪融水，自南向北流经酋邦西部，于[塔巴特](#idx-e523)与[纳赫尔河](#idx-e520)交汇后入[凛冰洋](#idx-e423)。其洪汛带来上游冲积土并补充土壤水分，随洪水消退而展开的播种是全酋邦农业的年度起点。\"},{\"id\":\"e520\",\"title\":\"纳赫尔河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)两河之西河，发源于[索拉瑞斯](#idx-e429)境内的[镜心湖](#idx-e436)，自南向北流经酋邦西部，于[塔巴特](#idx-e523)与[哈亚特河](#idx-e519)交汇。因源头在索拉瑞斯境内，诸神信仰第一季的西祭典历来只能在靠近南边境的城市勉强举行，这也是尼索边境关系长期恶劣的原因之一。\"},{\"id\":\"e521\",\"title\":\"沙阿万大魔矿\",\"aliases\":[\"大魔矿\"],\"body\":\"位于[尼希尔](#idx-e517)东部沙阿万沙漠地下，全大陆最大的单一[魔矿](#idx-e71)产地，年产量占大陆总量逾半，[高品级魔矿](#idx-e65)更占大陆产出八成以上，几乎构成事实垄断。矿井多由[神遴者](#idx-e412)以[秘术](#idx-e3)开凿，此后的采掘、支护、排水与转运则由奴隶以常规工具承担。各国对尼希尔的结构性经济依赖即根源于此。\"},{\"id\":\"e522\",\"title
