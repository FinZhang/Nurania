，深吸了一口气。四十一天里她跟多米尼克·阿尔玛只发生过两次对话——一次是入职那天他问她从哪里来，一次是上上周她把[汇票](#idx-e326)编号写错了，被卡尔米娜带去他办公室道歉。两次他都没多说什么，但露琪尔觉得他不说话时的那种沉默，比卡尔米娜挑出毛病时还要让人慌。\n\n她走到走廊尽头，抬手敲了敲办公室的门。\n\n“进来吧。”\n\n索利亚商会的副主席坐在一张深色橡木桌后面，手里捏着一份还没定章的合约。看见她进来，他抬起头，眉头短促地皱了一下。“维奥拉。”\n\n“阿尔玛先生，您找我。”\n\n“你师傅告了病假，今日来不了。她原本交给你的戈登克尔银行的清算汇报，我让佩特拉先接过去。”多米尼克把桌上一份夹板往她面前推了半寸，“今天巳时后有一笔从[斯特拉拉](#idx-e500)来的[星元](#idx-e69)到港，原本是拉佐去接。她去不了。”\n\n露琪尔看了一眼那份夹板，又抬头看他。“您要让我去？”\n\n“我不想让你去。”多米尼克意外地说得很坦白，“但分部今日上船下船的人手不齐。本来我自己跑一趟也行，但昨天[忒奥西斯](#idx-e483)那批银货出了问题我得处理，升天节后的总账又压在这儿。”他用指节敲了敲推出来的夹板，“合约你拿回去仔细读一遍，星元这一类东西的接货流程，拉佐之前应该给你讲过。”\n\n“拉佐姐——老师讲过。”\n\n“那就好。”他顿了顿，继续说下去，“按章办事，不要节外生枝。遇到任何拿不准的事，不要现场作决定，回来报告给我，让对方等。让对方等不要紧，一个下午的话索利亚的招牌还等的起。”\n\n“先生——”\n\n多米尼克抬眼。\n\n“……我不会让招牌等。”露琪尔本来想说“我保证不出错”，但多米尼克把她看虚了。\n\n多米尼克的目光在她脸上停了一秒。她以为他会再添一句话，但他只是把夹板推到她面前。\n\n“去吧。出门前先去仓库找瓦兰取要用的衡台。”\n\n“是。”\n\n她退到门口的时候，多米尼克忽然又开口：“维奥拉。”\n\n“在。”\n\n“别太紧张。”他说着话，但眼睛已经移回了手上的合约，“你比你师傅心细。拉佐跟我夸过你两次，她不轻易夸人。”\n\n露琪尔愣了一下。她在那一刻几乎要脱口问出“她真的跟您夸过我？”——但她忍住了，行了一礼退出来。\n\n走出办公室关上门，她在走廊里站了三秒，伸手按了一下额头，又按了一下心口，然后才下楼。\n\n*\n\n露琪尔回到一楼合约处，把多米尼克刚交给她的夹板摊在自己的桌子上，然后怔怔地坐了半分钟。\n\n“佩特拉。”她有些呆滞地开口。\n\n“嗯？”佩特拉正低头翻着一叠票据，随口应了一声。\n\n“阿尔玛先生说拉佐姐姐夸过我两次。”\n\n“我知道，我也听她夸过你。”\n\n“……你知道？”露琪尔转过头看自己的朋友，露出一个震惊的表情。\n\n“全分部都知道。就你不知道。”佩特拉头也不抬，“专心，专心。”\n\n露琪尔没好意思再接话，低头从夹板里抽出合约开始读。\n\n[阿斯托戈商会](#idx-e310)旗下“牧夫”号大三桅帆船，贸易品编号一百五十三：经艾瑟瑞姆[王家研究院](#idx-e249)核准，由[特别仪式区](#idx-e244)[星轨蚀刻](#idx-e76)总所生产，二百四十枚[洛林八阶](#idx-e68)星元，分十二箱，每箱二十枚；炎阳季十八日巳时二刻，由制式小艇在[谢兰港](#idx-e515)西一区第七号石阶接驳上岸；现场验讫，签发汇票，总价四万八千[尼卡特](#idx-e324)整。交货负责人：阿斯托戈商会斯特拉拉分部副主事，维里乌斯·里恩。\n\n她把流程在心里过了一遍——验铅封、衡台称重、开箱、抽验、关箱、登记、签票——每一项都对着章程上的相应条款核一次。\n\n她在衡台称重一条上停了一下，[星术制品](#idx-e88)是按件数计价的，通常没必要称重。她想起卡尔米娜之前带她去码头时额外说过一句：“这一步我们做得不多，但是做了不会错。”露琪尔当时没多想，今天她忽然意识到，这一步不是特贸区的交接惯例，而是索利亚的章程自己加的。\n\n露琪尔的桌上靠墙立着一个小相框，里面是她妹妹萨拉的画像。这是去年元日前，她们的父亲请村里的速写匠人花了三尼卡特画的。画里的萨拉十一岁，已经有了些和露琪尔一样的眉眼。\n\n“萨拉，”露琪尔小声对着画像说，“我去码头一趟，回来给你写信。”\n\n她意识到自己刚刚对着一张画说话。她回过头瞄了一眼佩特拉——佩特拉低头盖印，假装没听见。\n\n“……我出门了。”\n\n她从一旁抽屉里取出汇票本，和夹板一起夹在胳膊下面，起身出门。\n\n*\n\n走到街上后，露琪尔绕到建筑南侧的另一扇小门前。门环是黄铜的，已经被海风吹得有些斑驳，她握住它轻轻地敲了敲。\n\n“瓦兰爷爷，我来取今天接货要用的衡台。”\n\n给她开门的是一个看上去年过七旬的白发老者。他穿着一身旧制的索利亚商会袍，青绿色的布料因为长年反复清洗有些褪色。他胸口别着一枚徽章，一小块贝壳形状的水晶上排着五颗银白色星星，两大三小，擦得很干净。\n\n露琪尔认识这枚徽章——“[联邦特许商业星术师](#idx-e329)”，十五年前卡帕尼联邦和[艾瑟瑞姆王国](#idx-e494)合作创办的资质。她到分部当学徒的第一堂课就是认全特贸区常见的标志和徽章，当时没少被拉佐老师训：五十二个商会纹章里面，至少有十个在她看来都长一个样。\n\n“小露琪尔？”米埃尔·瓦兰略带惊讶地看着眼前的少女，又往她身后望了望，没看到卡尔米娜的身影。“今天怎么是你一个人？”\n\n“拉佐姐姐病了，今天午前有批斯特拉拉来的货由我去接，在谢兰港。”露琪尔递过夹板。\n\n“又一批星术制品？这应该是这一季来的第六批了吧。”米埃尔抽出合约读上面的内容，“你一个人去交接？”\n\n“是的，阿尔玛先生是这么吩咐的。”露琪尔说这话时，自己都觉得底气不足。\n\n“多米尼克那小子，真是不客气。”米埃尔皱皱眉，随即抬头宽慰她，“不过你也不用太过担心，艾瑟瑞姆人确实脾气都有些呆板，但非常守规则。作为贸易伙伴其实是挺让人安心的，你只要按章办事就行。”\n\n“瓦兰爷爷以前也在艾瑟瑞姆住过？”\n\n“以前是，后来不是大陆战争么，我就跑到卡帕尼来了。正好遇上联邦在招[商业星术师](#idx-e334)，一干就是十多年。”米埃尔把合约塞回夹板，招呼露琪尔进屋，“进来吧，外面太阳马上就要大起来了。”\n\n露琪尔从阳光强烈的室外走进门，视线猛地一暗。\n\n索利亚商会的仓库不算小，但空间被高大的货架挤得满满当当，三个巨大的木质货箱堆在墙侧，盖着防灰的麻布。左手边一张半宽的书桌，桌上亮着一盏老旧的[星术](#idx-e7)台灯，传来些许蚀刻[回路](#idx-e75)运转的杂音。桌上堆着厚厚几叠报货单，露琪尔眼尖，看到顶上几张的落款都是艾瑟瑞姆样式的商会印章。\n\n“小心脚下。今天吉米和巴依被多米尼克派去跟一船临时进港的[穗稻](#idx-e399)，我在替他们清点昨天到的一批货，箱子还没收起来。”米埃尔的声音从房间另一头的货架后面传来，“交接的是星元是吧？要[二型衡台](#idx-e63)？”\n\n“对，二型衡台。”\n\n她绕过地上摆着的几个纸箱，箱子没合上，里面露出烛台、[十字架](#idx-e127)、各式宗教人物像，在空气里闪着细微的银光，她忍不住多瞄了几眼。\n\n“这就是阿尔玛先生说的，忒奥西斯来的那批货吗？”\n\n“是。这回[圣约瑟](#idx-e124)那边找的不知道是哪家教会银制所，出了好几件次品。多米尼克为了这事儿把吉米批了半天。”货架后传来物件碰撞的声音，“他交接时偷懒没验货，要我说是这小子活该……诶，我记得不是放在这儿的吗——”\n\n“要我帮忙吗，瓦兰爷爷？”\n\n“不用，找到了。”米埃尔从货架背后转出来，手里拿着一台露琪尔熟悉又陌生的装置。“上次用完忘记放回原位了，年纪真是大咯。”\n\n“这就是二型衡台？”\n\n露琪尔的眼睛已经黏在了上面。她对普通衡台很熟悉，一边托盘放砝码，另一边放货品，中间秤杆偏向哪边就是哪边重，微调时用底部的旋钮砝码——拉佐姐姐反复强调过。眼前这台二型衡台除了这些东西，还有一根约莫三十厘[步米](#idx-e378)的石制柱立在秤杆中央的指示针旁边，底端连着一圈围绕衡台的金属框，像是一艘船的桅杆和围栏。她还瞄到那石柱侧边从上到下刻着长度不一的横线，像是某种刻度。\n\n“没错。这东西和普通衡台的区别就是这根[界星石](#idx-e66)，是用[蚀刻魔矿](#idx-e73)做的。”米埃尔指指那根略细的石柱，“我演示给你看怎么用。”\n\n他把衡台放在桌上，伸出左手两根手指搭在界星石顶端，嘴里吐出一串复杂的长音节。\n\n这不是露琪尔第一次看人施展星术，但之前她从未靠得这么近过。她看到一股淡蓝色的微光从米埃尔的胸口一闪而过，随后是右手和右臂，最后出现在他左手的指尖。\n\n接着她看到米埃尔手指下的石柱也亮起来，从上到下浮现出复杂密集的线条和光点，像是夜空里的星星连成星座。光芒抵达底部后，整个围绕衡台的金属框也同时亮起，闪烁出耀眼的蓝光。\n\n“好漂亮！”露琪尔脱口而出，手撑在桌上，恨不得把脸凑到石柱旁边。\n\n“这根界星石的作用是检测并稳定空间温度。”米埃尔露出一个略带狡黠的微笑，像一个给孙女展示有趣玩具的祖父，“现在它进入准备状态了，光柱停在这里，代表当前温度是……三十[星度](#idx-e395)。今天天气确实挺热。”\n\n覆盖界星石表面的星座般花纹已经退去，只剩下半部分微微亮着均匀的蓝光。露琪尔看清了石柱侧边横线旁边标着的一列小小数字，蓝光顶端对应的横线旁写着“30”。\n\n“准备状态下的界星石只能检测温度。用这个扳机调整[玛娜](#idx-e26)流向，可以把它切换到激活状态。”米埃尔按动衡台一侧的小金属块，界星石上的复杂花纹再次闪现，一层淡蓝色的光幕从下方的金属框升起，覆盖了整个衡台。\n\n“激活状态的界星石会在衡台周围形成局域[结界](#idx-e20)，把内部温度固定在激活那一刻的读数。至于为什么星元需要用二型衡台——”\n\n“是因为它的重量会随温度变化！”露琪尔像上课抢答一样举起手，“我刚刚在货品图鉴上看到过！”\n\n她意识到自己有点太兴奋了，把手缩回来，不好意思地咧了咧嘴。\n\n“没错，回答正确。”米埃尔慈祥地笑，“卡尔米娜说得没错，小丫头脑子转得很快。”\n\n露琪尔在心里给自己比了个“耶”。\n\n“那今天我就交给你这一台。界星石的玛娜余量我刚刚确认过了，足够用两个时辰。”米埃尔再次按动金属块，光幕缓缓沉回金属框里，“你到谢兰港找港务司租一个平台车，把衡台架在上面，对面如果要求检查，你就让他检查，后续称重的时候你自己来，别让对方碰。”\n\n“我明白了。”\n\n“还有，”米埃尔把衡台端给她，又顺手在她肩上轻轻拍了一下，“别太紧张。但是也别太放松。”\n\n露琪尔点点头，抱着衡台推门出去，外面的阳光确实已经大起来了。\n\n### 二\n\n巳时的太阳升到了桅尖之上，整个谢兰港被晒得发白。港里的人比露琪尔记忆中要稀疏许多，大部分商会在雨季期间会把交接货安排在清晨和夜间，避开白日里可能的暴雨。约在上午这个时段交货并不多见，偏偏今天正好是个大晴天。露琪尔一度怀疑，是不是这些会看星星的艾瑟瑞姆人夜观天象，预知了今天的天气才定在这个时间交货。\n\n只是不知道他们了不了解卡帕尼雨季不下雨的午前有多晒——露琪尔希望他们不了解，这样受罪的就不止她一个人了。\n\n“那艘应该就是‘牧夫’号了吧。”露琪尔把额前两撮被晒得有点卷的头发别到耳后，望向远处挂着艾瑟瑞姆旗子的三桅帆船。那台二型衡台放在她身侧租来的平台车上，界星石的光柱指向三十三星度的位置。\n\n她感觉自己约莫等了五分钟——或者没那么长，只是大太阳底下的时间太难熬——“牧夫”号靠岸一侧降下一条小艇，朝她这边划过来。\n\n艇划得很慢，她在心里数到三十的时候，艇还没靠岸。\n\n数到一百二十的时候，艇靠了。\n\n艇上三个人——两个划桨的水手，一个站在船头的瘦削男子。瘦削男子裹着一身墨蓝色的长袍，提着一只小皮箱，踏上石阶时脚下没有发出声音。\n\n“[蚀刻总所](#idx-e241)二级技术主管，阿斯托戈商会副主事，维里乌斯·里恩。”他的语速不快，通用语里带着点艾瑟瑞姆口音，但每个音节都发得很清楚，“按合约副本，二百四十枚洛林八阶，分十二箱。”\n\n露琪尔行了一个[商会礼](#idx-e333)。“索利亚商会波托马利分部，露琪尔·维奥拉。先生您好——”\n\n“拉佐女士不来了？”\n\n“她身体不适。”露琪尔答。\n\n“身体不适。”维里乌斯轻声重复了一遍，眼神在露琪尔脸上停了一刹那。她猜得到对方在估算她的年龄，他没有掩饰这个动作的意思。“今日由你接货？”\n\n“由我接货。”\n\n“……明白。开始吧。”\n\n露琪尔把原本要说的“先生您从斯特拉拉一路过来辛不辛苦”那一长串话咽了回去。\n\n她推过平台车把二型衡台架好，按下金属扳机把界星石切换到激活状态。淡蓝色的光幕从金属框升起，覆盖了整个衡台，光柱停在三十三星度的刻度上不再上下移动。\n\n维里乌斯看了一眼那道光幕，眉毛微微抬了一下。\n\n露琪尔感受到了对方的视线，“先生需要的话可以检查一下。”\n\n男人没有说话，脱下他的左手手套，将两根手指搭在界星石顶端。露琪尔看到整根石柱上星座般的花纹闪烁了三次，然后恢复了均匀的蓝光。\n\n“没问题，下货吧。”男人戴回手套，向背后的人示意。\n\n水手们把十二只杉木箱四个一组依次抬上石阶，按露琪尔指定的位置排成两列。每只箱子的边角都嵌着铅封，上面印着研究院的徽记。\n\n她从左列第一箱开始，搬上平台车检查铅封，密封完整，无外力痕迹。她在登记册上记了一笔，然后把箱子抬上衡台，调整砝码，秤杆晃了片刻，停在中央：十二[河磅](#idx-e382)八十七河克。她翻到之前从货品图鉴上抄下来的星元重量表，找到三十三星度那一行。\n\n洛林八阶星元，三十三星度参考标准质量为五十三到五十五河克。\n\n露琪尔心算了一下，扣掉箱子的定重后没问题，她在登记册上记下数字，拍下铅封，开箱。二十枚星元齐整地排在衬里上，每一枚都裹着薄铅箔。她戴上提前准备好的薄棉手套，从中间抽一枚，剥开铅箔的一角——里面是一枚约莫拇指长的暗蓝色晶体，光线照上去时，晶体中心浮出一道极细的金线。\n\n洛林星元——粗加工后的[魔矿](#idx-e71)晶体在表面和内部蚀刻回路后，注入玛娜封装的星术制品，可为各种小型[星术设备](#idx-e85)供能。露琪尔回忆自己在图鉴上看到的内容，星元阶数对应晶体内封装的玛娜浓度，八阶是艾瑟瑞姆官方允许出口的最高等级。\n\n她将铅箔重新包好，把这枚洛林八阶放回原位，合上箱盖，做了登记，接着搬起第二箱。\n\n她瞥见维里乌斯皱了皱眉，却强迫自己手下的动作不停。\n\n第二箱验重，十二河磅八十二河克，抽验一枚，无误。\n\n第三箱验重，十二河磅八十九河克，抽验一枚，无误。\n\n第四箱验重，十二河磅八十四河克，抽验一枚，无误。\n\n……\n\n露琪尔做这些动作的时候始终没有开口。她跟着卡尔米娜的时候来码头上待过不少次，但今天是她第一次站到这种位置上，对面又是蚀刻总所的人。她在心里告诫自己一句：现在不是说话的时候。\n\n维里乌斯的目光一直落在她身上。第七箱放上衡台的时候他开口了，第一句话不是关于星元的。\n\n“你做事很慢。”\n\n露琪尔抬起头。“按章程做。”\n\n“按交接惯例，每批星术制品最多抽选四分之一的箱数，每箱抽验一枚，登记，已经足够。”\n\n“按索利亚商会的章程，接货方有权对每箱进行验重。”\n\n维里乌斯沉默了片刻。“拉佐女士这样教你的？”\n\n“她是这样教我的。”\n\n维里乌斯没有再说什么。他从外袍内侧取出一只掌心大小的圆盘装置，看了一眼，又收了回去。“现在是巳时三刻。”\n\n露琪尔知道他的潜台词是“你在浪费我的时间”。\n\n第八、第九、第十箱：十二河磅八十四河克，八十河克，八十九河克，抽验三枚均无误。\n\n第十一箱。\n\n露琪尔把箱子抬上衡台时感觉自己的手腕短促地向下一沉——但她已经把箱子稳稳放上了秤盘，没让这一动作露在脸上。\n\n调整砝码，秤杆晃了片刻，停在中央。\n\n十三河磅十二河克。\n\n她盯着那个读数，愣了两秒。她把砝码再细推半分，秤杆立刻歪向一边；她调回砝码，再把秤杆轻轻拨了一下，秤杆回到正中央。\n\n十三河磅十二河克。\n\n她抬头看了维里乌斯一眼，对方面无表情。露琪尔在心里飞快过了一遍那些“差二十多河克仍然合理”的可能，又一一排除。她再拨了一次秤杆，指针来回晃了两下，倔强地指回原位。\n\n她意识到的时候，自己已经开口了。“先生。我需要验一下第十一箱。”\n\n“你验便是，前十箱都验了，不差最后两箱这点时间。”维里乌斯的话里带了点挖苦。\n\n“我需要逐一验第十一箱全部二十枚。”\n\n男人挑了挑眉，没有立刻接话，只是盯着露琪尔看，她被看的越来越没底气，一句“要不还是不验了吧”已经到了嘴边。\n\n好在维里乌斯先开了口：“逐一验二十枚，按你们的章程，交货方有权拒绝。”\n\n“按合约第十一条，若收货方对箱内货品质量有正当怀疑理由，有权要求逐一核验。核验期间若出现货物毁损，相应损失由收货方承担。”露琪尔脱口而出，随后才后知后觉地意识到，按自己的薪水，恐怕承担不起这个“相应损失”——一枚洛林八阶两百尼卡特，但凡弄坏一枚，接下来两季她都得靠佩特拉接济度日了。\n\n维里乌斯眯了眯眼，“你的那个正当理由，是什么？”\n\n露琪尔又看了一眼衡台上的砝码读数。\n\n“十三河磅十二河克。前十箱在十二河磅八十到九十河克之间，差二十五河克。”\n\n“一枚洛林八阶——”\n\n“只有五十河克出头。”她说，“我刚刚也是这么想的。”\n\n维里乌斯的目光在衡台上停了一会，又转回到露琪尔脸上。\n\n“你是说，”他放慢语速，“你怀疑这一箱里有星元是次品。”\n\n“我没说有次品。我说我要逐一验。”\n\n维里乌斯的目光在她脸上停了三秒。最后他把那张瘦削的脸侧过去，淡淡地说了一句“验吧。”\n\n*\n\n露琪尔把第十一箱搬下衡台，放在平台车的前侧，取下铅封。二十枚星元整齐地排在箱内衬里上。她按编号一枚一枚剥开铅箔，把每一枚捧到日光下转一个角度，看晶体中心那条极细的金线。\n\n第一枚，金线。\n\n第二枚，金线。\n\n第三、第四、第五……第十五枚，都有金线，没问题。\n\n第十六枚——\n\n露琪尔的手停下，她把这一枚举高一些，转一个角度。光线照进去，晶体内部清透得几乎像水，中心那条线是红色的。她又换一个角度，依旧是红色，有点像血。\n\n她把这一枚摆到一旁，继续剥下一枚。\n\n第十七、十八、十九、二十——都有金线。\n\n露琪尔把那块透着红线的星元放在秤盘上，调节砝码到秤杆水平：七十八河克。\n\n她抬起头，看到维里乌斯也在盯着衡台上的砝码。\n\n“先生，您看一眼这一枚。”\n\n维里乌斯接过去。他没有摘手套，用指尖搓了搓那枚晶体的边缘，又把它举起来对着日光看。他看到晶体里那条红线时，瞳孔微微缩了一下。随后他把那枚晶体放回掌心，从外袍内侧取出一枚极小的玻璃镜片，一边用手指摩擦晶体的表面，一边透过镜片仔细看。\n\n露琪尔在心里数到十五的时候，维里乌斯才开口。\n\n“……这不是洛林八阶。”\n\n“是低阶数的星元？”\n\n“不是星元，是水晶。打磨得很像，内部还做了工艺，但不是星元。”\n\n露琪尔没有接话。她其实有好多想说的，“我就说差二十五河克有问题”，“蚀刻总所怎么也会出这种事”，“那这一批星元要怎么办”——但她意识到，现在最聪明的做法是闭嘴。\n\n维里乌斯把那枚伪品紧握在掌中，表情几度变化。海风从他和露琪尔之间吹过去，他外袍上别着的蚀刻总所徽章发出极轻的一声叮。\n\n“我会立刻向商会分部和总所那边汇报。”他说，声音比刚才低了一分，“今日的交付暂时取消，整批货物随我重新返航核验，复议交付的时间再与索利亚约定。”\n\n“明白。”\n\n“你的港务司租赁费用和衡台费由我们出。”他顿了顿，“维奥拉小姐。”\n\n“先生？”\n\n“您的师傅教得不错。”\n\n露琪尔行了一个商会礼。维里乌斯没有立刻还礼，他先把那枚假星元用一方丝绢包好，然后才正过身来还礼。她注意到他还礼的动作很慢，头深深地低了下去。她忽然有点想装一回大人，说一句“先生不必”，但她忍住了。\n\n维里乌斯开始指挥水手把十二只箱子重新搬回小艇。露琪尔站在平台车边，把登记册塞回夹板，抱在怀里，看着那艘小艇划开海面的反光，朝“牧夫号”的方向回去。\n\n午时的钟声从远处的港务司钟楼传过来，一下，又一下。她在第七号石阶上又站了一会儿，才意识到，自己刚刚整整半个时辰几乎一句多余的话都没说。\n\n她想，等下回去要把这件事告诉萨拉，但她不知道该怎么写——萨拉一定不会相信她姐姐能憋半个时辰不说话。\n\n### 三\n\n露琪尔回到分部时已是午时二刻，太阳直直压在街面上，连影子都缩进了人脚下。她把夹板和那台二型衡台放在自己的位置上，对着佩特拉做了个“一会儿和你说”的手势，先上三楼复命。\n\n多米尼克听完汇报后没有立刻说话。他从那把橡木椅上站起来，走到窗边，往下看了一眼街面——办公室窗户对出去的街口是[卡帕尼银联](#idx-e325)的一处汇票点，门口的遮阳篷下排了七八个人，有几个已经把斗篷解开搭在肩上，显然没预料到雨季忽然有这么一个大晴天。他看了一会儿，转过身来。\n\n“你查出来那批星元一枚有质量问题，所以对方延期交付了。”\n\n“是。”露琪尔点头。\n\n“星元迟到对我们下游向研究所的供货周转是有影响的。”\n\n“我知道——但是先生，我，呃——”她忍不住开口，又咬住嘴唇咽回去。\n\n多米尼克的眉毛微微抬了一下。“说。”\n\n“……我觉得差半枚的重量太蹊跷了。”她说，“我宁愿我们晚两日给下游供货，也不想让一枚假星元以索利亚商会的名义卖出去。”\n\n多米尼克看了她几秒。\n\n“你还让一个商会的副主事在码头当众输了一阵。”\n\n“……我没想到他会这样反应。我以为他会直接拒绝或者让我去找主管人。”\n\n“你不需要想到，你只需要按章程办。”多米尼克顿了顿，“你按章程办了。”\n\n他回到桌后坐下，从抽屉里取出一本小册子，那是分部的工时记录簿。他翻到当日那一页，把露琪尔的名字下一栏添了一行：临时受派接货，洛林八阶星元二百四十枚——记一次代理。\n\n“你师傅烧到明日能不能起还不知道。”多米尼克说，“午饭后我让佩特拉把戈登克尔银行那份清算汇报送你那里，你接着做。”\n\n“……是。”\n\n露琪尔退出办公室时，看到楼梯口佩特拉正探着头往走廊这边看，她没忍住，扑过去抓住朋友的肩膀：“佩特拉我和你说——”\n\n“嘘嘘嘘——”佩特拉连忙抬手压住她，一边笑一边小声警告，“阿尔玛先生还在屋里，你别在这儿叫。”\n\n“我没叫！”\n\n“你叫了。”\n\n露琪尔被噎了一下，赌气似的撇撇嘴，“……那我去楼下叫。”\n\n“你下工了再叫，”佩特拉说，“先把戈登克尔的事接过去。”\n\n露琪尔鼓了鼓腮帮：“行行行，先戈登克尔，先戈登克尔。”随后她忍不住又开口，“你敢信吗，当时称出来的时候差了快三十河克——”\n\n“我信我信。”佩特拉嘴里这么说着，脚已经走下了楼梯。\n\n“等等！我还没说完呢！”\n\n*\n\n午饭后露琪尔抱着二型衡台出门又转到南侧，敲仓库门。\n\n米埃尔来开门，看到她手里的衡台先笑了一下。“回来啦？”\n\n“嗯，回来了。”\n\n“进来吧。”\n\n她跟着米埃尔进了仓库。后者把衡台接过去，手指拂过界星石顶部，整个石柱闪了一下，随后熄灭，恢复成了露琪尔第一次看到它时的样子。他随即把界星石小心地从衡台上取下来，检查了侧边的玛娜回路，又用一块软布擦底座的金属框。“交货时有出什么事吗？”\n\n“出了一点事。”露琪尔说，“第十一箱差了二十五河克，我在里面找出一枚伪品。”\n\n“伪品什么样？”\n\n“晶体清透得像水，里面那条线是红色的。”\n\n米埃尔擦衡台的手停了一下，但他没说话，只是点了点头。\n\n过了一会儿，他又点了一次头。他把衡台移到半宽书桌的边角上，转身从档案架上抽出一本旧簿子，翻了几页，又合上。\n\n“瓦兰爷爷？”露琪尔忍不住开口。\n\n“嗯？”\n\n“……您怎么了？”\n\n“没怎么。”米埃尔回头看她，“我在想这一批星元是不是总所另一个部门产的。下次我跟多米尼克提一句。”\n\n“我明白了。”\n\n“这次你干得不错，回去歇一歇。”他又拍了拍她的肩膀，“晚上早点休息，你还在长身体。”\n\n“……您怎么知道——”\n\n“昨晚子时三刻我路过你住的那条街，你窗里还点着灯。”\n\n“那是我忘了灭！”\n\n米埃尔莞尔一笑，送她到门口，“对对，是你忘了灭。”\n\n她回到合约处的时候，佩特拉已经把戈登克尔银行那份清算汇报搬过来摞在她桌上了。\n\n*\n\n卡尔米娜·拉佐下午来了分部一趟，在合约处坐了不到一刻钟。\n\n露琪尔看到她进门的瞬间就站了起来，差点把椅子蹭翻。“拉佐姐姐！”\n\n“嘘，”卡尔米娜竖起一根手指，“你慢点。”\n\n“您怎么样了？您还能跑环城路吗？”\n\n“我现在连下楼都得扶着栏杆，跑什么环城路。”卡尔米娜笑了一下，眉骨上还留着没干透的虚汗，“午饭后多米尼克带口信到我家，把上午的情况大略说了，我现在就过来看一眼。”\n\n她让露琪尔把那份合约拿来，看完点了点头，把东西递回去。\n\n“你称第十一箱的时候多少重？”\n\n露琪尔翻了翻登记册。“十三河磅十二河克。”\n\n“其他几箱呢？”\n\n“都是十二河磅八十多河克，没有超过九十的。”\n\n“嗯。”卡尔米娜又点了一下头。她的脸还有些苍白，但眼神依旧是露琪尔印象里那种认真，“那个里恩先生有没有为难你？”\n\n“为难过一下下。”\n\n“他怎么说的？”\n\n“按交接惯例，每批最多抽四分之一的箱数，每箱抽验一枚就够了。”\n\n卡尔米娜咧了咧嘴。“他从艾瑟瑞姆走出来的人，最爱抱着惯例和老规矩不放。你怎么应的？”\n\n“按索利亚商会的章程，接货方有权对每箱进行验重。”\n\n卡尔米娜有点意外地停下来看了她一眼。“你哪儿学的这一句？”\n\n“您让我抄的分部章程第十六条。”\n\n“我让你抄过？”\n\n“……上上周我写错汇票编号，您罚我抄过两遍。”\n\n“哦。”卡尔米娜把手按在桌沿上，似乎想说什么，又停了下来。她最终只说：“戈登克尔的汇报好好写，遇到有什么拿不准的，可以今晚来我家问我。”\n\n她站起来要走的时候，露琪尔追着她走了几步。“拉佐姐姐——”\n\n“嗯？”\n\n“……您是不是真的跟阿尔玛先生夸过我两次？”\n\n卡尔米娜回过头看她。\n\n“马上就是三次了。”她说，“但要是你还这么毛毛糙糙的，就只有两次了。”\n\n“……我明白了。”\n\n卡尔米娜挥挥手出了门。露琪尔转过头，看到佩特拉向她比了个大拇指。\n\n*\n\n斯特拉拉那边的回话傍晚时分就到了。\n\n阿斯托戈商会派人把回执送到索利亚分部，回执上简短地写着：经蚀刻总所内部初步核查，该批星元确有一枚被替换为改制水晶，系总所内值班学徒舞弊所致。涉案学徒已被开除并交由司法院分司处置，蚀刻总所向索利亚商会致歉，并提议次日重新交付整批货物。单价不变，总价以二百三十九枚计。\n\n回执末尾另附一行：“特谢索利亚商会波托马利分部露琪尔·维奥拉小姐之尽职。”\n\n多米尼克把回执拿到合约处交给露琪尔，没多说，转身上楼了。\n\n露琪尔看完最后一行，然后又看了一遍，抬起头时佩特拉已经站在她对面，端端正正地行了一个商会礼。“维奥拉小姐，您万安。”\n\n“佩特拉——”\n\n“阿斯托戈回执末尾的‘特谢’之辞，平日一年也难得见上一次。”\n\n“别闹！”露琪尔把夹板拍在佩特拉头上，但感觉自己的脸已经红了。\n\n“快说一声谢谢拉佐姐姐。”\n\n“我已经说过了。”\n\n“再说一遍也不亏。”\n\n“……谢谢拉佐姐姐。”露琪尔小声说。\n\n她转头，伸手把桌上那个相框正了一下，萨拉在画里开心地笑着。\n\n她看着那张脸，过了一会儿，从夹板里抽出一张空白纸。她把纸铺在桌上，拿笔蘸了墨水，开始写：“女儿来波托马利已经四十二日，一切顺利，望勿挂念。索利亚商会的大家都很好，请帮我转谢托里叔叔的介绍。”\n\n她空了几行，继续写“又及，今日做了一件师傅会满意的小事。”写完她想了想，把“师傅会满意的”几个字划掉，改成“师傅没有挑出毛病的”。然后又把“没有挑出毛病的”也划掉，最终留下：“今日做了一件小事。”\n\n她把这张纸折起来收进夹板，决定晚上把它写完。\n\n---\n\n下工前露琪尔去了趟账房把衡台费的报销单交了，然后出了分部门，沿着主航道边上的大街回家。走过两个街角，马拉戈正在收拾他的果汁摊，柠檬皮的味道还浮在空气里。\n\n“马拉戈大叔，”她叫住摊主，“一杯柠檬汁。”\n\n“今天真的来啦？”\n\n“今天来了。”她点点头，把三枚分铸币放在摊台上，接过装着柠檬汁的木杯，靠在临海的石栏上小口小口地喝。\n\n海上几艘卡帕尼快帆船刚出港，借着雨季伊始稳定的东南风一路朝北，驶向[翡翠海峡](#idx-e416)，桅顶的索旗被风吹得直直地朝前展开。再远些的海面已经被夕阳染成橙红色，白日的热度正在退去——这正是波托马利一天里最舒服的时段。\n\n“今天遇到好事儿了？”她放下空杯子的时候，马拉戈问道。\n\n“是，不过也就是件小事儿。”露琪尔抬起头，回给他一个灿烂的微笑。\n\n她告别马拉戈，沿着步道继续往家走，嘴里忍不住哼起了调子。\n\n希望明天也是一个大晴天。\n\n### 四\n\n第二日午时。\n\n露琪尔讲完整个故事时，我刚好把最后一句话记完。\n\n“所以，你最后有没有把这事告诉家里？”佩特拉放下刀叉喝了一口果汁，看向身边的友人，“我今早看你去邮局寄信了。”\n\n“没有。我后来想了想，其实这事儿也不算大，特地和他们说，感觉太小孩子气了。”\n\n“我倒是觉得，你的家人听了一定会很高兴的。”我把笔收进速记本一侧的套筒里，“虽然你觉得这是一件小事。”\n\n“真的吗！”露琪尔抬起头来，眼睛亮晶晶的，嘴里塞着两块土豆，说话含糊不清，“那我现在去邮局（嚼嚼）把信拿回来（嚼嚼）还来得及吗（嚼嚼）？”\n\n“你先把东西咽下去再说。”佩特拉轻轻敲了敲她的脑袋，“我同意尤里梅尔先生的看法。你可是萨拉眼中最优秀的姐姐。”\n\n我把本子放在桌侧，开始切盘子里的牛排。“还是你父母引以为傲的孩子。我了解这些研究院出身的艾瑟瑞姆人，你能在他们面前坚持自己，很不容易。”\n\n“我记得尤里梅尔先生也是艾瑟瑞姆人？”佩特拉转头看我。\n\n“是的，在[阿斯托利亚](#idx-e495)的研究院待过一阵子，后来出来旅行，已经三年多了。”\n\n“艾瑟瑞姆是个什么样的地方？人人都会放魔法……那什么，星术吗？”露琪尔插进话来。\n\n“艾瑟瑞姆是个很纯粹也很固执的地方。”我挑选着用词，“那里的人花一辈子看星星，看星星又是一件特别需要专注的事。”\n\n“什么意思？”\n\n“意思是，他们大多数人对‘另一个人的看法跟自己不同’这种事，通常没有什么准备。”\n\n露琪尔咀嚼的动作停了一下。“……听起来确实是里恩先生那种人。”\n\n“不过你说得没错，”我接下去，“在艾瑟瑞姆几乎人人都会用魔法。倒不如说，整个艾瑟瑞姆王国都是建立在星术上的。”\n\n“听上去好厉害！”露琪尔放下叉子，“我十四岁那年第一次坐船到波托马利，见到港里那么多帆船一起停着，在码头边上看了一刻钟没动。如果以后能到艾瑟瑞姆去看一回——”她想了想，“——回去跟萨拉吹一辈子的牛也值。”\n\n“你想的话，”佩特拉手指点点下巴，像是想到了什么，“阿尔玛先生上周提到咱们商会在斯特拉拉的分部向他要一个学徒，好像是最近跨国贸易激增，那边人手缺得不行。”\n\n“那不行，我要佩特拉陪我！”露琪尔转身抱住自己的朋友，摆出一副假哭的样子，“我才不要一个人去那么远的地方！”\n\n“这又不是旅游……”\n\n我看着面前的两人，露出一个微笑。\n\n---\n\n“那么，我们就先告辞了。”走出饭馆后，波托马利午后的阳光和海风扑面而来，佩特拉转向我告别。\n\n“你们是要去看望拉佐女士吗？”\n\n“是的，露琪尔很担心老师，所以向阿尔玛先生请了半天假。”文静的少女熟练地无视了身边念叨着“明明佩特拉自己也很担心”的同伴。\n\n“路上小心。有机会再来索利亚商会看你们。”我点点头。\n\n“尤里梅尔叔叔再见！”露琪尔挥手，随后想到什么，转身朝街口跑了出去，“我先走了，去邮局拿信！”\n\n佩特拉叹了一口气，向我行了一个商会礼，随后转身快步跟上了自己的朋友。\n\n我看着两个少女的身影消失在街角尽头，沿着街道另一个方向走去。\n\n*\n\n饭馆离海边并不远。走过约莫三分钟的路程，就来到了我平日散步的临海步道。没了建筑和树木的遮挡，卡帕尼雨季难得的阳光变得异常毒辣，好在有海风吹拂，我身上薄薄的汗很快就被吹干了。\n\n沿着步道又走了三分钟，转过一个拐角，繁忙的谢兰港出现在视野里。左手边一个向海方向突出的石质平台上摆着几条长椅，视野极好，平时基本都会被来往观赏港口景色的游客占满。今天不知道是因为午后实在太热还是别的什么，几条长椅基本空着，只有最右侧的一条坐着一个裹着墨蓝色长袍的瘦削男人。\n\n我走上平台，靠着石栏看了一会儿谢兰港进出的商船，然后开口。\n\n“不像是学徒干的。”\n\n“为什么这么说？”维里乌斯的声音从后面传来。\n\n“清透得像水，中间一条红线。”我重复了一遍露琪尔的描述，回过头看向研究院时期的同僚，“这是用水晶包住的[星术装药](#idx-e89)，激发玛娜回路会爆炸的那种。”\n\n“把装药封进水晶，把重量压得尽可能低，再打磨成和星元差不多的外形和质地，同时保证途中不爆炸，要的技术远不是一个刚接触蚀刻的学徒能有的。是卡伊尔伯爵的人？”\n\n“犯人还在审，要花点时间，但初步推测是他的人。”维里乌斯答，“[卡伊尔伯爵领](#idx-e498)离特别仪式区最近的城市有三家技术水平足够的设备作坊，安插人和货都很容易。而且他在反对女王陛下的开放政策上一直是最卖力的。”\n\n“我以为伯爵在[卡尔姆](#idx-e497)大火之后就放弃了他的计划。”\n\n“我们现在看到了，他并没有。”维里乌斯站到我身边，和我一起看着港口，“你离开阿斯托利亚有阵时间了。女王陛下现在面临的保守派压力不比三年前。”\n\n“乐观点想，至少内战没打起来。”\n\n“要是全是学者的国家打起了内战，那真是莫大的讽刺。”\n\n“所以他的计划是什么？”我说，“混一块装药进星元堆里，然后傻等着卡帕尼或者[阿布丹提亚](#idx-e452)什么地方的星术设备轰隆一声？”\n\n“不怎么高明，但确实是破坏王国贸易声誉最直接的办法。事实上他差点就成功了，蚀刻所出货时一般只查玛娜波动不查重量，封装水晶后星元和星术装药的波形是一样的，只有一箱箱验重才能抓出问题。”\n\n“星术制品要验重是索利亚章程里加的一条。”\n\n“是米埃尔·瓦兰加的吧。”维里乌斯忽然说道。\n\n这个名字出现在对话里后，空气安静了一瞬，只剩下海浪拍打平台下礁石的声音。\n\n“这是一种可能。”\n\n“你没去拜访他？我以为你们同为研究院的出走者，会有很多共同语言。”这句带了点挖苦。\n\n“大概没你想的那么多。”\n\n维里乌斯没有接话，片刻后，他像什么都没说过一样再次开口，“维奥拉——那小姑娘做得不错。”\n\n“是的，我相信她会成长为一个优秀的商人。她的老师也是这么说的。”\n\n“……说到老师，有机会回院里看看吧。弗莉亚老师时不时还会提起你。”维里乌斯第一次转头看向我，“你是她最优秀的学生。”\n\n我没回头看他。一只海鸥从平台前贴水掠过，又转向南，落到一艘已经卸了大半货物的丹提亚棉船的桅杆顶端。\n\n“我知道，学长。”\n\n“原来你还记得我是你的学长。”我感觉到肩膀上被轻轻拍了两下。“走了。我这趟船会停过夜，明日辰时离港。有兴趣就来坐坐，没兴趣也随便你。”\n\n脚步声慢慢离去，我长长呼出一口气，抬头看向远处的帆影。\n\n我对露琪尔说过，艾瑟瑞姆人对“另一个人的看法跟自己不同”这种事，通常没有什么准备。这是一句应景的、半开玩笑的话，但这句话也适用于王国的权力斗争。卡伊尔伯爵没有料到王室外交转型的决心，女王陛下恐怕也低估了对方对王国纯粹性的执着。一群看了一辈子星星的人就这样被赶上了政治牌桌，能做的却只有笨拙地互相抡拳头，像群半大的孩子。\n\n这可能是艾瑟瑞姆的幸运，也可能是艾瑟瑞姆的不幸。\n\n我从怀里掏出速记本，翻回刚刚露琪尔讲那段的位置。一个十六岁的学徒坚守章程，让一桩本会出错的交易在那个上午停了下来，为自己的商会挽回了可能的损失。这样的故事已经足够了——足够成为她值得记下来的一件小事。\n\n至于海峡那头那些大人们的事，就由他们自己去操心吧。\n\n我合上本子，沿着步道往码头走，海风把衣领吹得猎猎作响。今天确实又是一个大晴天，但雨季毕竟是雨季——明天就不一定了。\n\n**塞勒内斯 于[大陆历](#idx-e346)1502年三（炎阳）季19日 波托马利**\n\n**Selenus 1502.III.19 In Porto Marino**\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$2\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"min-h-[60vh] flex items-center justify-center text-[var(--ink-muted)]\",\"children\":\"加载中…\"}],\"children\":[\"$\",\"$L10\",null,{\"bookSlug\":\"compendium\",\"toc\":[{\"slug\":\"作者序\",\"title\":\"炉边随记（代作者序）\",\"titleEn\":\"Preface\",\"isArticle\":true},{\"slug\":\"年表与大事记 Chronology\",\"title\":\"年表与大事记\",\"titleEn\":\"Chronology\",\"isArticle\":true},{\"slug\":\"度量与岁时 Me ,{\"id\":\"e3\",\"title\":\"尼希尔秘术\",\"aliases\":[\"秘术\"],\"body\":\"[尼希尔](#idx-e517)统治阶级独有的魔法体系，简称秘术，以等价交换为原理，解离祭品的[构成元素](#idx-e18)为力量。\"},{\"id\":\"e4\",\"title\":\"神启祷言\",\"aliases\":[\"祷言\",\"神启魔法\"],\"body\":\"[神启学派](#idx-e5)对自身魔法的称呼，简称祷言；亦名神启魔法。\"},{\"id\":\"e5\",\"title\":\"神启学派\",\"aliases\":[],\"body\":\"以[唯一神](#idx-e135)所借权柄使用魔法的学派，编织[术式](#idx-e38)调动环境中游离态的[四大元素](#idx-e39)。\"},{\"id\":\"e6\",\"title\":\"星空学派\",\"aliases\":[],\"body\":\"以[第五元素](#idx-e17)以太的显现与外化解释魔法的学派，[内化](#idx-e30)以太于体内再[显化](#idx-e44)为魔法。\"},{\"id\":\"e7\",\"title\":\"以太星术\",\"aliases\":[\"星术\",\"星空魔法\"],\"body\":\"[星空学派](#idx-e6)对自身魔法的自称，简称星术；亦名星空魔法。狭义专指各类魔法对应的[大星轨](#idx-e16)走势。\"},{\"id\":\"e8\",\"title\":\"自然魔法\",\"aliases\":[\"精灵魔法\",\"圣树魔法\"],\"body\":\"精灵族与生俱来的法术能力，源自与[大圣树](#idx-e214)的契约连接；亦称精灵魔法、圣树魔法。\"},{\"id\":\"e9\",\"title\":\"奥韦纳尔·安柯伦坦\",\"aliases\":[\"安柯伦坦\"],\"body\":\"艾瑟瑞姆[天星师](#idx-e246)，1304年提出智慧生物出生时的[大星轨](#idx-e16)图像决定其[仪式星轨](#idx-e49)特征，且该特征恰合[源星](#idx-e56)五分类，[丝黛兰尔](#idx-e40)的分类法由此成为公认标准。\"},{\"id\":\"e13\",\"title\":\"裁闭术\",\"aliases\":[],\"body\":\"利用[界星石](#idx-e66)将局部空间环境状态固定的[星术](#idx-e7)，[仲裁星术](#idx-e58)的一种，常用于稳定温度。须以[玛娜](#idx-e26)供给[回路](#idx-e75)维持。\"},{\"id\":\"e16\",\"title\":\"大星轨\",\"aliases\":[\"天道星轨\"],\"body\":\"[天星五政](#idx-e41)在天球上的轨迹，代表宇宙中[以太](#idx-e17)流的流向；亦称天道星轨。\"},{\"id\":\"e17\",\"title\":\"第五元素\",\"aliases\":[\"以太\"],\"body\":\"构成群星与其间空间（宇宙）的物质，通称以太，永恒不朽；稀薄存在于大地之上，[星空魔法](#idx-e7)师可将其蓄积体内，是星术的能量来源。\"},{\"id\":\"e18\",\"title\":\"构成元素\",\"aliases\":[],\"body\":\"构成实体事物的四大[自然元素](#idx-e39)，不响应[祷言](#idx-e4)[术式](#idx-e38)。通过[秘术式](#idx-e2)可将其解离。\"},{\"id\":\"e20\",\"title\":\"结界\",\"aliases\":[],\"body\":\"[仲裁星术](#idx-e58)所构造的防护或隔离[术式](#idx-e38)，[裁闭术](#idx-e13)是其中的一种；通常依靠[界星石](#idx-e66)建立。\"},{\"id\":\"e23\",\"title\":\"精神力\",\"aliases\":[],\"body\":\"编织[祷言](#idx-e4)[术式](#idx-e38)所凭的能力，可经后天训练提高，只能依靠时间缓慢恢复。\"},{\"id\":\"e25\",\"title\":\"洛林阶运\",\"aliases\":[],\"body\":\"特定工艺的[星轨蚀刻](#idx-e76)（如旧式三分耦式蚀刻法）所致的[玛娜](#idx-e26)自然向外部流出的矿界面层现象。\"},{\"id\":\"e26\",\"title\":\"玛娜\",\"aliases\":[\"魔力\"],\"body\":\"[星空学派](#idx-e6)语境下[内化](#idx-e30)后的[以太](#idx-e17)，即俗称的魔力；释放后无法自然恢复，须[星术](#idx-e7)师冥想缓慢补充。\"},{\"id\":\"e29\",\"title\":\"魔元素动力学\",\"aliases\":[],\"body\":\"[神启学派](#idx-e5)中研究元素流动与[疏化](#idx-e37)机理的学科，由[神启魔法](#idx-e4)学者菲略奥斯等人奠基。\"},{\"id\":\"e30\",\"title\":\"内化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师于修习中将环境自由[以太](#idx-e17)汇入体内[仪式星轨](#idx-e49)的过程。\"},{\"id\":\"e36\",\"title\":\"施法者\",\"aliases\":[],\"body\":\"能够主动运用魔法的人口的统称，全大陆约占两成。\"},{\"id\":\"e37\",\"title\":\"疏化\",\"aliases\":[],\"body\":\"同一空间内反复施用[神启魔法](#idx-e4)后[自然元素](#idx-e39)恢复速率异常下降的现象，由神启魔法学者菲略奥斯提出。\"},{\"id\":\"e38\",\"title\":\"术式\",\"aliases\":[],\"body\":\"[神启魔法](#idx-e4)师以[精神力](#idx-e23)编织、临时改写自然法则的结构，是与[唯一神](#idx-e135)所立的单向契约。\"},{\"id\":\"e39\",\"title\":\"四大元素\",\"aliases\":[\"自然元素\"],\"body\":\"构成世界万物和游离在自然环境中的地、水、火、风元素，也称自然元素；唯游离态者可为[神启魔法](#idx-e4)调用。\"},{\"id\":\"e40\",\"title\":\"塔莉拉·丝黛兰尔\",\"aliases\":[\"丝黛兰尔\"],\"body\":\"[星空学派](#idx-e6)魔法先驱，著《[星术](#idx-e7)源流考》，首创以五颗天星对应五类魔法的[源星](#idx-e56)分类法，源星之名即出于此。\"},{\"id\":\"e41\",\"title\":\"天星五政\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)最重要的概念之一，指[冠阳](#idx-e532)、[汐月](#idx-e544)、[仲裁星](#idx-e549)、[烬铸星](#idx-e533)、[织虹星](#idx-e548)五颗天体。\"},{\"id\":\"e42\",\"title\":\"无属性元素流\",\"aliases\":[],\"body\":\"[秘术式](#idx-e2)解离祭品[构成元素](#idx-e18)后所得的能量形态，其性质仍是大陆魔法学界研究的未解课题。\"},{\"id\":\"e44\",\"title\":\"显化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师控制体内[以太](#idx-e17)流运转特定[大星轨](#idx-e16)、将[玛娜](#idx-e26)转为有色状态并外放的过程。\"},{\"id\":\"e48\",\"title\":\"血契\",\"aliases\":[],\"body\":\"人类与巨龙缔结的契约，双方精神世界互相开放，可转移龙族[术式](#idx-e38)的[精神力](#idx-e23)消耗。\"},{\"id\":\"e49\",\"title\":\"仪式星轨\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师于体内仿照[大星轨](#idx-e16)建立的[以太](#idx-e17)[回路](#idx-e75)，各部位对应一天宫。\"},{\"id\":\"e52\",\"title\":\"元素丰地\",\"aliases\":[],\"body\":\"游离态[四大元素](#idx-e39)丰度明显高于大陆平均的天然区域，对[疏化](#idx-e37)有强韧抵抗力。\"},{\"id\":\"e56\",\"title\":\"源星\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师[丝黛兰尔](#idx-e40)在《星术源流考》中提出的星术五分类，对应[天星五政](#idx-e41)。\"},{\"id\":\"e58\",\"title\":\"仲裁星术\",\"aliases\":[],\"body\":\"以[仲裁星](#idx-e549)为[源星](#idx-e56)的一类[星术](#idx-e7)，主秩序、约束与原则，含施加守护、封印、[结界](#idx-e20)制造与契约构造等星术。\"},{\"id\":\"e61\",\"title\":\"动力炉\",\"aliases\":[],\"body\":\"大型[星术设备](#idx-e85)的供能核心，见于[魔偶](#idx-e83)、[巨像](#idx-e81)与[星术驿车](#idx-e87)等。\"},{\"id\":\"e63\",\"title\":\"二型衡台\",\"aliases\":[],\"body\":\"附设[界星石](#idx-e66)，利用[裁闭术](#idx-e13)固定称重环境温度的衡台，用于称量对温度变化敏感的物品（如[星元](#idx-e69)）。\"},{\"id\":\"e65\",\"title\":\"高品级魔矿\",\"aliases\":[],\"body\":\"元素储存率极高、可承受各种魔法加工工艺的[魔矿](#idx-e71)，八成以上产自沙阿万。\"},{\"id\":\"e66\",\"title\":\"界星石\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e73)制成的器件，[仲裁星术](#idx-e58)设备的核心原件之一，用途极为广泛。可检测与稳定局部环境、维持[回路](#idx-e75)与[结界](#idx-e20)、容许特定构型[星术](#idx-e7)运行，用于[二型衡台](#idx-e63)、星术锁、[星术灯](#idx-e78)开关、建筑保温等领域。\"},{\"id\":\"e68\",\"title\":\"洛林八阶\",\"aliases\":[],\"body\":\"[星元](#idx-e69)的等级之一，阶数对应封装的[玛娜](#idx-e26)浓度，八阶是艾瑟瑞姆允许出口的最高等级。\"},{\"id\":\"e69\",\"title\":\"洛林星元\",\"aliases\":[\"星元\"],\"body\":\"粗加工[魔矿](#idx-e71)晶体经[星轨蚀刻](#idx-e76)、注入[玛娜](#idx-e26)封装的[星术制品](#idx-e88)，通称星元，取名于洛林法蚀刻，可为小型[星术设备](#idx-e85)供能。\"},{\"id\":\"e71\",\"title\":\"魔法矿石\",\"aliases\":[\"魔矿\"],\"body\":\"对五大元素均具极高流通率与储存率的天然矿石，通称魔矿，是大陆最重要的战略资源。\"},{\"id\":\"e73\",\"title\":\"蚀刻魔矿\",\"aliases\":[],\"body\":\"经[星轨蚀刻](#idx-e76)的[魔矿](#idx-e71)，可按[回路](#idx-e75)结构储存[玛娜](#idx-e26)，并在触发时释放对应[星术](#idx-e7)。\"},{\"id\":\"e74\",\"title\":\"托兰瓦尔·洛林\",\"aliases\":[\"洛林\"],\"body\":\"艾瑟瑞姆[天星师](#idx-e246)，1125年首报可流通储存[以太](#idx-e17)的矿石并据以发明[星轨蚀刻](#idx-e76)；洛林法蚀刻为纪念其贡献而名，[洛林星元](#idx-e69)、[洛林阶运](#idx-e25)之名亦由此而来。\"},{\"id\":\"e75\",\"title\":\"星轨回路\",\"aliases\":[\"回路\"],\"body\":\"通过[蚀刻](#idx-e76)在[魔矿](#idx-e71)上建立的模仿[仪式星轨](#idx-e49)的通路，允许魔矿储存[玛娜](#idx-e26)，并在特定条件触发下释放对应[星术](#idx-e7)。\"},{\"id\":\"e76\",\"title\":\"星轨回路蚀刻\",\"aliases\":[\"蚀刻\",\"星轨蚀刻\",\"洛林法蚀刻\"],\"body\":\"于[魔矿](#idx-e71)表面蚀刻[仪式星轨](#idx-e49)[回路](#idx-e75)的技术，简称星轨蚀刻或蚀刻，为纪念发明人，又名洛林法蚀刻。1125年由艾瑟瑞姆[星术](#idx-e7)学者[托兰瓦尔·洛林](#idx-e74)发明，构成了[星术设备](#idx-e85)的基石。\"},{\"id\":\"e78\",\"title\":\"星术灯\",\"aliases\":[],\"body\":\"以[星术](#idx-e7)驱动的照明器具，有台灯、壁灯、顶灯等形制，在[艾瑟瑞姆王国](#idx-e494)境内已经几乎完全取代了常规照明用具（如油灯）。\"},{\"id\":\"e81\",\"title\":\"星术巨像\",\"aliases\":[\"巨像\"],\"body\":\"[星术](#idx-e7)兵种的大型作战单位，通称巨像，由专精操作的星术师远距控制。\"},{\"id\":\"e83\",\"title\":\"星术魔偶\",\"aliases\":[\"魔偶\"],\"body\":\"以[蚀刻](#idx-e76)[回路](#idx-e75)驱动的小型[星术](#idx-e7)作战或劳作单位，通称魔偶，有农用魔偶、清扫魔偶等。\"},{\"id\":\"e85\",\"title\":\"星术设备\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e73)制成的各类器物的统称，自家用台灯至战场[巨像](#idx-e81)[动力炉](#idx-e61)，是艾瑟瑞姆高技术社会立国的物质基础。\"},{\"id\":\"e86\",\"title\":\"星术通讯体系\",\"aliases\":[],\"body\":\"艾瑟瑞姆由[阿斯托戈商会](#idx-e310)牵头建立维护的全境通讯网，通过[星讯](#idx-e90)连接王国各大城市与口岸，是支撑艾瑟瑞姆统一对外汇率的重要技术基础。\"},{\"id\":\"e87\",\"title\":\"星术驿车\",\"aliases\":[],\"body\":\"以[动力炉](#idx-e61)驱动的陆上载具，行于艾瑟瑞姆城市内或城际道路。\"},{\"id\":\"e88\",\"title\":\"星术制品\",\"aliases\":[],\"body\":\"[星术设备](#idx-e85)所需半成品作为贸易品的称呼，[洛林星元](#idx-e69)为其典型代表。\"},{\"id\":\"e89\",\"title\":\"星术装药\",\"aliases\":[],\"body\":\"在[魔矿](#idx-e71)上[蚀刻](#idx-e76)特定的[星轨回路](#idx-e75)，使之储存的[玛娜](#idx-e26)处于不稳定状态，激发后会发生爆炸。封入水晶后外形与[星元](#idx-e69)几可乱真。\"},{\"id\":\"e90\",\"title\":\"星讯\",\"aliases\":[],\"body\":\"通过[星术通讯体系](#idx-e86)实现的远程通讯手段，一次仅能传递少量文字。成本昂贵，技术要求极高，仅见于[艾瑟瑞姆王国](#idx-e494)境内各大城市及口岸通讯。\"},{\"id\":\"e99\",\"title\":\"朝圣\",\"aliases\":[],\"body\":\"[正教](#idx-e146)信众沿既定路线前往[圣城索菲亚](#idx-e487)的虔修，是[圣领](#idx-e483)可观的收入来源。\"},{\"id\":\"e100\",\"title\":\"称义\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒持守信仰、按神的教诲生活而得免[宿债](#idx-e131)的全过程，自[洗礼](#idx-e136)始，至临终而成。\"},{\"id\":\"e104\",\"title\":\"大祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)学徒正式受任为神职的[圣事](#idx-e121)。\"},{\"id\":\"e106\",\"title\":\"告解\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒为自身罪行请求赦免的[圣事](#idx-e121)，可反复进行。\"},{\"id\":\"e107\",\"title\":\"公教\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰两大教派之一，1295年[教会大分裂](#idx-e160)后自[阿布丹提亚](#idx-e452)境内的[正教会](#idx-e181)独立而成，以[公教会](#idx-e155)为组织载体，是阿布丹提亚人口的第一大信仰。将[星空魔法](#idx-e7)一并纳入唯一神权柄、另尊保罗为第二先知；主张轻罪可凭虔信与[圣事](#idx-e121)自赦，审判之权唯神独有，故不设[审判庭](#idx-e171)建制并废除[诺万尼斯流放](#idx-e167)，对个人虔修的要求高于[正教](#idx-e146)；[季首弥撒](#idx-e109)与节庆均依[通用历](#idx-e368)。\"},{\"id\":\"e109\",\"title\":\"季首弥撒\",\"aliases\":[],\"body\":\"[正教](#idx-e146)于[仪式历](#idx-e361)各季首日，[公教](#idx-e107)于[通用历](#idx-e368)各季首日举行的规模略大于每周[弥撒](#idx-e113)的集体仪式。\"},{\"id\":\"e110\",\"title\":\"坚振\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中，标志[称义](#idx-e100)大体完成的[圣事](#idx-e121)，一生一次，须对教会有重大贡献或持守信仰足够长久。\"},{\"id\":\"e112\",\"title\":\"礼仪年\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中六季[弥撒](#idx-e113)与九大节庆构成的一整年宗教循环。\"},{\"id\":\"e113\",\"title\":\"弥撒\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)礼拜日举行的集体仪式，与每日的[日课](#idx-e117)同为[称义](#idx-e100)最重要的日常载体。\"},{\"id\":\"e114\",\"title\":\"冥界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，信徒死后安息、静候轮回之地。\"},{\"id\":\"e117\",\"title\":\"日课\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒每日的功课，与礼拜日[弥撒](#idx-e113)同为[称义](#idx-e100)的日常载体。\"},{\"id\":\"e119\",\"title\":\"圣保罗\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，最初的医者，司治愈与修复；对应[织虹星](#idx-e548)与[虹曜日](#idx-e348)。[公教](#idx-e107)另尊其为第二先知。\"},{\"id\":\"e120\",\"title\":\"圣骸\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下的圣徒遗骨，为[朝圣](#idx-e99)与教堂声望所系，如[潘克拉托](#idx-e485)大教堂所藏的[圣约翰](#idx-e123)圣骸。\"},{\"id\":\"e121\",\"title\":\"圣事\",\"aliases\":[],\"body\":\"指[正教](#idx-e146)与[公教](#idx-e107)六项圣事：[洗礼](#idx-e136)、[坚振](#idx-e110)、婚姻、[告解](#idx-e106)、[大祝职](#idx-e104)、[小祝职](#idx-e138)。\"},{\"id\":\"e122\",\"title\":\"圣伊琳娜\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，司秩序与契约；对应[仲裁星](#idx-e549)与[裁曜日](#idx-e345)，[圣领](#idx-e483)[伊琳娜圣银币](#idx-e341)以其得名。\"},{\"id\":\"e123\",\"title\":\"圣约翰\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之首，[正教](#idx-e146)唯一的先知与弥赛亚，司精神与教导；对应[汐月](#idx-e544)与[月曜日](#idx-e376)。\"},{\"id\":\"e124\",\"title\":\"圣约瑟\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，商会之圣，司转化、破坏与锻造；对应[烬铸星](#idx-e533)与[烬曜日](#idx-e351)，[圣约瑟商会](#idx-e335)以其得名。\"},{\"id\":\"e126\",\"title\":\"使徒\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e132)》记载中，随[唯一神](#idx-e135)降世传教的最初四人：约翰、伊琳娜、约瑟、保罗。\"},{\"id\":\"e127\",\"title\":\"十字架\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教会](#idx-e155)共用的宗教象征符号。正教十字架为四端，象征四元素权柄。[公教](#idx-e107)下端另加一横，四横端象征四元素，竖端象征[星术](#idx-e7)。\"},{\"id\":\"e130\",\"title\":\"四界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰神学的宇宙构成：[天界](#idx-e133)、[现界](#idx-e137)、[冥界](#idx-e114)、[虚界](#idx-e141)。\"},{\"id\":\"e131\",\"title\":\"宿债\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰神学中，人一出生便背负的亏欠。缘于唯一神所借予而非赐予的权柄，受惠者无人能置身账外。\"},{\"id\":\"e132\",\"title\":\"索菲亚圣典\",\"aliases\":[\"圣典\"],\"body\":\"[唯一神](#idx-e135)信仰的最高典籍，通称《圣典》，分《创世录》《弥赛亚记》《神言书》《箴言集》四福音与《预言书》。\"},{\"id\":\"e133\",\"title\":\"天界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，唯一神、圣徒与天使的居所。\"},{\"id\":\"e135\",\"title\":\"唯一神\",\"aliases\":[\"主\",\"神\",\"上帝\"],\"body\":\"唯一神信仰所奉的至高神，信徒亦称主、神或上帝，是宇宙的创造者、维系者与监督者，也是世间一切魔法力量的源头。\"},{\"id\":\"e136\",\"title\":\"洗礼\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒入教与[称义](#idx-e100)之始的[圣事](#idx-e121)，一生一次，象征认清并领受自身的[宿债](#idx-e131)。\"},{\"id\":\"e137\",\"title\":\"现界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中[四界](#idx-e130)之一，人类生息的世界。\"},{\"id\":\"e138\",\"title\":\"小祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)神职人员卸任、复为寻常信徒之礼，多见于年老体弱者。\"},{\"id\":\"e141\",\"title\":\"虚界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，天球与大地之外仍为虚所充满的空间，罪人与非正信者死后的去处。\"},{\"id\":\"e143\",\"title\":\"异端\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下，秉持不同教义解释相异的教派；就[正教](#idx-e146)而言[公教](#idx-e107)即当代最大异端。\"},{\"id\":\"e146\",\"title\":\"正教\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰两大教派之一，以[正教会](#idx-e181)为组织载体，为[索拉瑞斯](#idx-e429)与[忒奥西斯](#idx-e483)的国教。认[神启祷言](#idx-e4)为唯一神所授的权柄，[星空魔法](#idx-e7)则不在神权之列；一切罪无论大小均须经[告解](#idx-e106)方得赦免，并以神在[现界](#idx-e137)的代行者自任，设[审判庭](#idx-e171)严管神启魔法、以[诺万尼斯流放](#idx-e167)向神赎罪。历法与[礼仪年](#idx-e112)循环依[圣格里仪式历](#idx-e361)。\"},{\"id\":\"e147\",\"title\":\"传信厅\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)[牧首厅](#idx-e166)六分厅之一，分管外交。\"},{\"id\":\"e148\",\"title\":\"大牧首\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)最高元首、[忒奥西斯](#idx-e483)圣领国家元首，由[枢机主教团](#idx-e174)闭门选出，终身任期。\"},{\"id\":\"e149\",\"title\":\"大审判长\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)最高长官，由[枢机主教团](#idx-e174)任命，与[大牧首](#idx-e148)同为终身任期。\"},{\"id\":\"e150\",\"title\":\"第二次宗教改革\",\"aliases\":[],\"body\":\"十三世纪末谋求将[星术](#idx-e7)纳入神权的改革，失败后直接导致[教会大分裂](#idx-e160)。\"},{\"id\":\"e152\",\"title\":\"都主教\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)[都主教区](#idx-e153)长官，教阶在主教之上；与[大牧首](#idx-e148)同不得婚娶，别称[门徒](#idx-e165)。\"},{\"id\":\"e153\",\"title\":\"都主教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)最高一级行政区划和宗教管理区划，全境共五个，长官称[都主教](#idx-e152)。[卡帕尼](#idx-e502)和[索拉瑞斯](#idx-e429)亦设有都主教区，但不具备行政职能。\"},{\"id\":\"e154\",\"title\":\"督审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)教阶之一，位在[审判官](#idx-e169)之上；[审判所](#idx-e162)驻任长官、[审判分庭](#idx-e168)官员。[诺万尼斯流放](#idx-e167)须由审判分庭所属督审判官主刑。\"},{\"id\":\"e155\",\"title\":\"公教会\",\"aliases\":[],\"body\":\"1295年[阿布丹提亚](#idx-e452)境内[正教会](#idx-e181)独立所成立的教会，领袖称[宗主教](#idx-e183)，驻[波马里亚](#idx-e459)。\"},{\"id\":\"e157\",\"title\":\"公教总会\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)中枢，驻[阿布丹提亚帝国](#idx-e452)城市[波马里亚](#idx-e459)。\"},{\"id\":\"e160\",\"title\":\"教会大分裂\",\"aliases\":[],\"body\":\"1295年[第二次宗教改革](#idx-e150)失败后，[阿布丹提亚帝国](#idx-e452)境内[正教会](#idx-e181)宣布脱离[牧首厅](#idx-e166)独立，成立[公教会](#idx-e155)。\"},{\"id\":\"e161\",\"title\":\"教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)[都主教区](#idx-e153)下辖的最小一级行政区划，长官称主教。也是[正教会](#idx-e181)在大陆各国所划的宗教事务上的最小管理层级。\"},{\"id\":\"e162\",\"title\":\"教区审判所\",\"aliases\":[\"审判所\"],\"body\":\"[审判庭](#idx-e171)在[教区](#idx-e161)一级所设的分支机构，简称审判所，由[督审判官](#idx-e154)驻任长官。\"},{\"id\":\"e165\",\"title\":\"门徒\",\"aliases\":[],\"body\":\"教会系统中[都主教](#idx-e152)及以上神职，以及[审判庭](#idx-e171)系统中自[督审判官](#idx-e154)及以上职位的别称，象征舍弃现世之乐、专心侍神；门徒不得婚娶。\"},{\"id\":\"e166\",\"title\":\"牧首厅\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)中枢以及[圣领](#idx-e483)最高行政机构，下设[圣礼厅](#idx-e173)、[省察厅](#idx-e179)、[司牧厅](#idx-e177)、[神启厅](#idx-e172)、[传信厅](#idx-e147)、[卫教厅](#idx-e178)六分厅。\"},{\"id\":\"e167\",\"title\":\"诺万尼斯流放\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[索拉瑞斯帝国](#idx-e429)维持的一种极刑，将受刑者留置诺万尼斯区域枯竭死地直至器官衰竭。\"},{\"id\":\"e168\",\"title\":\"审判分庭\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)在[都主教区](#idx-e153)一级的机构，长官称审判长，由[大审判长](#idx-e149)直接任命。\"},{\"id\":\"e169\",\"title\":\"审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)教阶之一，负责日常调查和执行事务，是[圣领](#idx-e483)独立于军事系统的强制执行编制。\"},{\"id\":\"e171\",\"title\":\"审判庭\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)直属司法和执行机构，处理[异端](#idx-e143)事务、追查未经许可的神启施法，拥有独立执法和行刑权。\"},{\"id\":\"e172\",\"title\":\"神启厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管[神启魔法](#idx-e4)事务。\"},{\"id\":\"e173\",\"title\":\"圣礼厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管宗教事务，亦负责[索拉瑞斯](#idx-e429)[凯撒](#idx-e234)的[血脉测试](#idx-e253)。\"},{\"id\":\"e174\",\"title\":\"枢机主教团\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)事实上的最高权力机构，[大牧首](#idx-e148)去世后负责闭门选出继任者。成员由大牧首自[都主教](#idx-e152)中选任。\"},{\"id\":\"e177\",\"title\":\"司牧厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管民生。\"},{\"id\":\"e178\",\"title\":\"卫教厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管军事，战时统一征召[护教军](#idx-e289)。\"},{\"id\":\"e179\",\"title\":\"省察厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管监察。\"},{\"id\":\"e181\",\"title\":\"正教会\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰最大教派[正教](#idx-e146)的教会组织，以[忒奥西斯](#idx-e483)圣领[牧首厅](#idx-e166)为教会中枢，同时也是圣领的统治机构。\"},{\"id\":\"e183\",\"title\":\"宗主教\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)领袖，由全大陆[公教](#idx-e107)主教选出三名候选，再由盲眼童贞信徒抽签决定。\"},{\"id\":\"e186\",\"title\":\"大神庙\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)首都[阿尔努尔](#idx-e518)城中的[教长](#idx-e199)驻地，是酋邦的宗教中心与圣地。\"},{\"id\":\"e191\",\"title\":\"玛阿特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中的死后审判仪式，以心脏置于天平称量，砝码为[希塔](#idx-e197)手杖顶端的宝石。\"},{\"id\":\"e197\",\"title\":\"希塔\",\"aliases\":[\"陆之神\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰中六神之一，老者之形，象征万物的终点，司灵魂与审判，看护[至福乐土](#idx-e201)；[玛阿特](#idx-e191)称量由其执行，砝码即其手杖顶端的宝石。\"},{\"id\":\"e199\",\"title\":\"伊玛目教长\",\"aliases\":[\"教长\"],\"body\":\"[尼希尔](#idx-e517)最高元首，简称教长，同时是酋邦的宗教领袖与[酋长会议](#idx-e239)首席。终身制，非世袭，代代以[秘术](#idx-e3)密封诏书委任继承。\"},{\"id\":\"e201\",\"title\":\"至福乐土\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中，[玛阿特](#idx-e191)称量通过者所被允许进入的永恒安乐之地，由[希塔](#idx-e197)看护。\"},{\"id\":\"e202\",\"title\":\"诸神圣土\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)中由[伊玛目教长](#idx-e199)直辖的宗教领地。含首都[阿尔努尔](#idx-e518)及周边耕地城市，由各部按比例出资供养。\"},{\"id\":\"e211\",\"title\":\"氏族\",\"aliases\":[],\"body\":\"精灵族的社会单位，被喻为[大圣树](#idx-e214)的分枝，各有族长与长老，本族领地内高度自治。\"},{\"id\":\"e213\",\"title\":\"万叶庭\",\"aliases\":[],\"body\":\"精灵族最高权力机构，每三十年于[希尔文尼亚](#idx-e527)召开，全体精灵借[圣树魔法](#idx-e8)旁听并投票。\"},{\"id\":\"e214\",\"title\":\"希尔文诺大圣树\",\"aliases\":[\"圣树\",\"大圣树\",\"圣树之母\"],\"body\":\"圣树信仰唯一的神圣对象，通称大圣树或圣树，矗立于[希尔文尼亚](#idx-e527)祭坛广场；凡有描述皆以女性位格出现，精灵称之为圣树之母，[自然魔法](#idx-e8)即祂分享之力。\"},{\"id\":\"e216\",\"title\":\"叶络枢机院\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e524)日常行政与对外事务机构，席位由[万叶庭](#idx-e213)轮选，长老兼承宗教职责。\"},{\"id\":\"e218\",\"title\":\"阿斯塔伦·塔利瑞安\",\"aliases\":[\"塔利瑞安\"],\"body\":\"[星术](#idx-e7)泰斗，1097年联合十二城邦创建[大星术研究院](#idx-e226)，即今[王家研究院](#idx-e249)之前身。\"},{\"id\":\"e219\",\"title\":\"伯爵领\",\"aliases\":[],\"body\":\"艾瑟瑞姆与[阿布丹提亚](#idx-e452)的贵族封地，在艾瑟瑞姆为最高级别的贵族封地，位于子爵领之上；在阿布丹提亚则位于[公爵领](#idx-e230)之下，子爵领之上。\"},{\"id\":\"e220\",\"title\":\"伯爵领研究院\",\"aliases\":[],\"body\":\"艾瑟瑞姆四大[伯爵领](#idx-e219)各设的研究机构，专职[星术](#idx-e7)相关学术和技术研究。\"},{\"id\":\"e226\",\"title\":\"大星术研究院\",\"aliases\":[],\"body\":\"1097年由[塔利瑞安](#idx-e218)联合十二城邦创建，艾瑟瑞姆[王家研究院](#idx-e249)前身，是艾瑟瑞姆国家形态的起点。\"},{\"id\":\"e227\",\"title\":\"地星师\",\"aliases\":[],\"body\":\"艾瑟瑞姆[星术](#idx-e7)学者的头衔之一。星术师于所属研究院研究室完成课题答辩，毕业后被授予的头衔。\"},{\"id\":\"e228\",\"title\":\"帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)的一级行政区划，共五个，与皇室直辖的[维里迪亚直辖省](#idx-e481)并列；省政府为中央[内阁](#idx-e237)的地方分支。原为六省，[卡帕尼](#idx-e502)独立后余五省。\"},{\"id\":\"e229\",\"title\":\"芙德兰研究室\",\"aliases\":[],\"body\":\"艾瑟瑞姆[多古雷伯爵领](#idx-e496)研究院的研究室，以[界星石](#idx-e66)构型研究见长。\"},{\"id\":\"e230\",\"title\":\"公爵领\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)最高级别的贵族封地，各[帝政省](#idx-e228)含一到两个公爵领。\"},{\"id\":\"e231\",\"title\":\"管理局\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[特贸区](#idx-e505)的立法与行政机构，由区内各商会分部选派代表组成，最高长官称管理局主席。\"},{\"id\":\"e232\",\"title\":\"军团行省\",\"aliases\":[\"行省\"],\"body\":\"[索拉瑞斯](#idx-e429)的一级行政区划，一行省对应一[军团](#idx-e294)，共八个，长官称[行省总督](#idx-e251)。\"},{\"id\":\"e233\",\"title\":\"龙裔继嗣法\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)开国皇帝[阿利昂](#idx-e235)晚年制定的皇位继承法，以直系子嗣的龙血浓度为据，由[牧首厅](#idx-e166)主持[血脉测试](#idx-e253)。\"},{\"id\":\"e234\",\"title\":\"龙裔凯撒\",\"aliases\":[\"凯撒\"],\"body\":\"[索拉瑞斯](#idx-e429)最高统治者的称号，简称凯撒，即位须由[大牧首](#idx-e148)主持册封礼，体现君权神授。\"},{\"id\":\"e235\",\"title\":\"马尔奇安·阿利昂\",\"aliases\":[\"阿利昂\"],\"body\":\"[索拉瑞斯](#idx-e429)开国[凯撒](#idx-e234)，人龙混血，受[大牧首](#idx-e148)册封为首位龙裔凯撒；捐帝国东部领土立[忒奥西斯](#idx-e483)圣领，晚年制定《[龙裔继嗣法](#idx-e233)》。\"},{\"id\":\"e237\",\"title\":\"内阁\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)和[阿布丹提亚帝国](#idx-e452)的中央机构之一。均指直属于王室/皇室的日常行政机构，各有大臣分管外交、军务、内务与王室/皇室财政。\"},{\"id\":\"e239\",\"title\":\"酋长会议\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)最高权力机构，由[教长](#idx-e199)与各部落酋长组成，每年[金素](#idx-e350)季于[阿尔努尔](#idx-e518)召开，协商全酋邦外交、军事与内政事宜。\"},{\"id\":\"e240\",\"title\":\"三柱议会\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)最高立法与财政机构，1393年确立，三柱指皇室、贵族与魔法阶级。\"},{\"id\":\"e241\",\"title\":\"蚀刻总所\",\"aliases\":[],\"body\":\"艾瑟瑞姆[特别仪式区](#idx-e244)内的[星轨蚀刻](#idx-e76)总所，由[王家研究院](#idx-e249)直属，垄断产业链核心蚀刻环节。\"},{\"id\":\"e244\",\"title\":\"特别仪式区\",\"aliases\":[],\"body\":\"位于艾瑟瑞姆中南部最[大平原](#idx-e453)，专用于王国[星术](#idx-e7)研究与设备制造，行政直属国王/女王。\"},{\"id\":\"e245\",\"title\":\"特区商法典\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[北部特贸区](#idx-e505)适用的独立法系，不同于各公国法系。\"},{\"id\":\"e246\",\"title\":\"天星师\",\"aliases\":[],\"body\":\"[星术](#idx-e7)学者的最高阶头衔与职位，授予学术成果极为杰出的[地星师](#idx-e227)。[托兰瓦尔·洛林](#idx-e74)、[奥韦纳尔·安柯伦坦](#idx-e9)等均曾任天星师。\"},{\"id\":\"e247\",\"title\":\"天星首席\",\"aliases\":[],\"body\":\"艾瑟瑞姆[王家研究院](#idx-e249)最高级别学者之职，永久由艾瑟瑞姆国王或女王兼任。\"},{\"id\":\"e248\",\"title\":\"王冠领地\",\"aliases\":[],\"body\":\"艾瑟瑞姆国王直辖之地，含以首都[阿斯托利亚](#idx-e495)为首的[坠星湖](#idx-e501)南岸城市群。\"},{\"id\":\"e249\",\"title\":\"王家研究院\",\"aliases\":[],\"body\":\"艾瑟瑞姆学术中枢，前身为[大星术研究院](#idx-e226)，兼掌王室继承事务与[特别仪式区](#idx-e244)管理，院长即[天星首席](#idx-e247)，永久由国王或女王兼任。\"},{\"id\":\"e251\",\"title\":\"行省总督\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团行省](#idx-e232)最高长官，由[军团](#idx-e294)长兼任，任期二十年，每年赴首都[索尔因](#idx-e448)叙职。\"},{\"id\":\"e252\",\"title\":\"叙职大会\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八位[行省总督](#idx-e251)每年赴[索尔因](#idx-e448)向[凯撒](#idx-e234)当面汇报施政与军务的会议。\"},{\"id\":\"e253\",\"title\":\"血脉测试\",\"aliases\":[],\"body\":\"《[龙裔继嗣法](#idx-e233)》规定的继承资格测试，由[牧首厅](#idx-e166)[圣礼厅](#idx-e173)主持，每代[凯撒](#idx-e234)继承人均须重测。\"},{\"id\":\"e259\",\"title\":\"仲裁所\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[特贸区](#idx-e505)[管理局](#idx-e231)下属机构，承担特贸区司法职能。\"},{\"id\":\"e263\",\"title\":\"阿索战争\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)与[索拉瑞斯帝国](#idx-e429)之间的三次大规模战争（1290–1292、1351–1356、1479–1483）。\"},{\"id\":\"e264\",\"title\":\"布兰顿和约\",\"aliases\":[],\"body\":\"[第二次阿索战争](#idx-e269)停战和约，以[布兰顿河](#idx-e463)下游为两国新界，[布兰顿](#idx-e462)城割予[索拉瑞斯](#idx-e429)。\"},{\"id\":\"e265\",\"title\":\"布兰顿战役\",\"aliases\":[],\"body\":\"1479年[三战](#idx-e270)前期的一场决定性会战，[阿布丹提亚帝国](#idx-e452)获得战略性胜利。\"},{\"id\":\"e266\",\"title\":\"不习者改革\",\"aliases\":[],\"body\":\"[三战](#idx-e270)后[艾瑟瑞姆王国](#idx-e494)推行的对外开放政策，要求王国各大城市与口岸为不习[星术](#idx-e7)者准备不依赖星术操作的各类公共设施。\"},{\"id\":\"e269\",\"title\":\"第二次阿索战争\",\"aliases\":[\"二战\"],\"body\":\"于1351–1356年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第二次大规模战争，[忒奥西斯](#idx-e483)保持中立。索拉瑞斯获胜，得[西比尔平原](#idx-e492)南部与[布兰顿](#idx-e462)城，停战于《[布兰顿和约](#idx-e264)》；阿布丹提亚放弃[卡帕尼](#idx-e502)群岛，卡帕尼同年独立。\"},{\"id\":\"e270\",\"title\":\"第三次阿索战争\",\"aliases\":[\"三战\"],\"body\":\"于1479–1483年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第三次大规模战争，阿布丹提亚获胜。停战于《[卡斯特鲁姆和约](#idx-e275)》，索拉瑞斯向阿布丹提亚归还[大运河](#idx-e427)下游东岸两座城市及其周边土地，两国当代边界由此确立。\"},{\"id\":\"e273\",\"title\":\"黑暗时代\",\"aliases\":[],\"body\":\"指八世纪[七王约](#idx-e280)瓦解后，西诺拉尼亚地区长达数百年的多国混战时期。\"},{\"id\":\"e275\",\"title\":\"卡斯特鲁姆和约\",\"aliases\":[],\"body\":\"[第三次阿索战争](#idx-e270)停战和约，确立阿索当代边界；[大运河](#idx-e427)下游东岸两城交接至今悬而未决。\"},{\"id\":\"e276\",\"title\":\"林缘议厅\",\"aliases\":[],\"body\":\"1203年[希尔文诺](#idx-e524)[叶络枢机院](#idx-e216)于[冠脊山脉](#idx-e419)东南脉隘口所设，是当前大陆唯一公认的中立缔约见证机构。\"},{\"id\":\"e277\",\"title\":\"洛林星术技术合作会议\",\"aliases\":[\"洛林会议\"],\"body\":\"全称洛林星术技术合作会议，每三年一届，由[王家研究院](#idx-e249)和四[公爵领](#idx-e230)研究院轮流主持。汇聚王国各研究院学者交流学术进展，同时也接受实业界人士参加，致力于学术成果产业转化。\"},{\"id\":\"e280\",\"title\":\"七王约\",\"aliases\":[],\"body\":\"328年西诺拉尼亚七国建立的松散邦联，存续约四个世纪，八世纪中叶瓦解。\"},{\"id\":\"e289\",\"title\":\"护教军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)最主要的常规部队，下分五个师，由各[都主教区](#idx-e153)分别组建。\"},{\"id\":\"e291\",\"title\":\"近卫龙骑兵团\",\"aliases\":[\"龙骑兵团\"],\"body\":\"[索拉瑞斯](#idx-e429)以[飞龙](#idx-e292)为坐骑的精锐常规部队，通称龙骑兵团，直属[凯撒](#idx-e234)，约八万头飞龙、五万人编制，跨地形作战能力冠绝大陆。\"},{\"id\":\"e292\",\"title\":\"巨龙眷属\",\"aliases\":[\"飞龙\"],\"body\":\"巨龙与大型野兽的混血飞行亚种，通称飞龙，寿约五百年，是[龙骑兵团](#idx-e291)的坐骑。\"},{\"id\":\"e294\",\"title\":\"军团\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)最高军事编制，与[行省](#idx-e232)一体，下设团、大队、小队。\"},{\"id\":\"e296\",\"title\":\"龙骑士团\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)的顶级战力，成员皆与巨龙缔结[血契](#idx-e48)，效忠[凯撒](#idx-e234)本人而非帝国，团内以多数决议事。\"},{\"id\":\"e302\",\"title\":\"圣仪军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)直属的精锐法术作战部队，大陆规模最大的法术军力，兼承民间大型工程建设。\"},{\"id\":\"e310\",\"title\":\"阿斯托戈商会\",\"aliases\":[],\"body\":\"艾瑟瑞姆王室直属商会，是[三战](#idx-e270)前[星术设备](#idx-e85)出口的唯一合法渠道，牵头维护[星术通讯体系](#idx-e86)。\"},{\"id\":\"e321\",\"title\":\"河金\",\"aliases\":[],\"body\":\"船只通行[索菲亚大运河](#idx-e427)所缴的费用，是[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)的重要常规收入。\"},{\"id\":\"e324\",\"title\":\"卡帕尼尼卡特铸币\",\"aliases\":[\"尼卡特\"],\"body\":\"[卡帕尼](#idx-e502)流通货币的通称，含金合金铸造，是大陆事实上的国际货币。\"},{\"id\":\"e325\",\"title\":\"卡帕尼银联\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[四大商会](#idx-e336)与众多中小商会银行共组的联合体，发行并管理[尼卡特汇票](#idx-e326)。\"},{\"id\":\"e326\",\"title\":\"卡帕尼银联汇票\",\"aliases\":[\"尼卡特汇票\",\"汇票\"],\"body\":\"[卡帕尼银联](#idx-e325)发行的结算凭证，通称尼卡特汇票或汇票，可在任意卡帕尼银联成员银行兑现，学界视为已具事实货币地位。\"},{\"id\":\"e329\",\"title\":\"联邦特许商业星术师\",\"aliases\":[],\"body\":\"[卡帕尼联邦](#idx-e502)与艾瑟瑞姆合作创办的资质，取得该资质者有资格在联邦各类商会及相关行业从事[星术](#idx-e7)相关工作，并可定期领取联邦补贴。\"},{\"id\":\"e333\",\"title\":\"商会礼\",\"aliases\":[],\"body\":\"大陆通行的商会人员的行礼方式。\"},{\"id\":\"e334\",\"title\":\"商业星术师\",\"aliases\":[],\"body\":\"隶属艾瑟瑞姆商会，从事[星术](#idx-e7)相关商业活动的星术师。专责对外贸易事务的驻外星术师是大陆各国境内星术师的最大来源。\"},{\"id\":\"e335\",\"title\":\"圣约瑟商会\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)直属商会，垄断圣领境内外一切贸易，学界普遍认为兼具情报网络职能。\"},{\"id\":\"e336\",\"title\":\"四大商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国各自直属的商会，由四公爵历史上直接出资创立，其主席即公爵本人。\"},{\"id\":\"e338\",\"title\":\"索利亚商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)商会之一，1489年前后由卡涅·道格拉斯创办，以[星术设备](#idx-e85)半成品与[魔矿](#idx-e71)原料分销起家，后跃居联邦前列。\"},{\"id\":\"e341\",\"title\":\"伊琳娜圣银币\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)流通货币，以高含银量铸造并防伪，与[索拉瑞斯](#idx-e429)铁钞按一比一互认流通。\"},{\"id\":\"e344\",\"title\":\"自由港\",\"aliases\":[],\"body\":\"[特贸区](#idx-e505)所设、享有极高自治权的港口体系，是国际贸易量激增的制度前提。\"},{\"id\":\"e345\",\"title\":\"裁曜日\",\"aliases\":[\"圣伊琳娜日\"],\"body\":\"[通用历](#idx-e368)一周第二日，亦简称星期二；[仪式历](#idx-e361)作圣伊琳娜日，对应天星[仲裁星](#idx-e549)。\"},{\"id\":\"e346\",\"title\":\"大陆历\",\"aliases\":[],\"body\":\"[通用历](#idx-e368)纪年，以[唯一神](#idx-e135)降临传教义于[圣约翰](#idx-e123)之年为元年，元年之前称元前。\"},{\"id\":\"e348\",\"title\":\"虹曜日\",\"aliases\":[\"圣保罗日\"],\"body\":\"[通用历](#idx-e368)一周第四日，亦简称星期四；[仪式历](#idx-e361)作圣保罗日，对应天星[织虹星](#idx-e548)。\"},{\"id\":\"e350\",\"title\":\"金素\",\"aliases\":[\"圣献\",\"冕宫月\",\"肆位\"],\"body\":\"一年六季的第四季，各地作物相继采收。[仪式历](#idx-e361)同季作圣献，艾瑟瑞姆[星历](#idx-e371)作冕宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作肆位。\"},{\"id\":\"e351\",\"title\":\"烬曜日\",\"aliases\":[\"圣约瑟日\"],\"body\":\"[通用历](#idx-e368)一周第三日，亦简称星期三；[仪式历](#idx-e361)作圣约瑟日，对应天星[烬铸星](#idx-e533)。\"},{\"id\":\"e353\",\"title\":\"凛寒\",\"aliases\":[\"正炼\",\"琴宫月\",\"陆位\"],\"body\":\"一年六季的第六季，山地封路、[凛冰洋](#idx-e423)冰封，大陆整体进入年内节律最为收缩的状态。[仪式历](#idx-e361)同季作正炼，艾瑟瑞姆[星历](#idx-e371)作琴宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作陆位。\"},{\"id\":\"e356\",\"title\":\"启蛰\",\"aliases\":[\"晖醒\",\"天宫月\",\"壹位\"],\"body\":\"一年六季的第一季，[通用历](#idx-e368)岁首所在。[凛冰洋](#idx-e423)浮冰退散、山地封雪消融、两河进入汛期，各地贸易与出行随之重新活跃。[仪式历](#idx-e361)同季作晖醒，艾瑟瑞姆[星历](#idx-e371)作天宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作壹位。\"},{\"id\":\"e358\",\"title\":\"日曜日\",\"aliases\":[\"圣神日\"],\"body\":\"[通用历](#idx-e368)一周第五日，亦简称星期日；[仪式历](#idx-e361)作圣神日，对应天星[冠阳](#idx-e532)，是信众向[唯一神](#idx-e135)礼拜的礼拜日。\"},{\"id\":\"e359\",\"title\":\"萨辛历\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)地方历法，以当代伊玛目称号纪年，每代即位则重置元年，六季称[壹位](#idx-e356)至[陆位](#idx-e353)。\"},{\"id\":\"e361\",\"title\":\"圣格里仪式历\",\"aliases\":[\"仪式历\"],\"body\":\"[正教会](#idx-e181)原始历法，[通用历](#idx-e368)前身，[圣领](#idx-e483)与[索拉瑞斯](#idx-e429)的官方历法，六季与五日均保留宗教命名。\"},{\"id\":\"e363\",\"title\":\"升天节\",\"aliases\":[],\"body\":\"纪念[圣约翰](#idx-e123)殉道的[正教](#idx-e146)宗教节日，《约翰福音》载其在[十字架](#idx-e127)上讲道一昼夜后直升[天界](#idx-e133)。\"},{\"id\":\"e368\",\"title\":\"通用历\",\"aliases\":[\"格里历\"],\"body\":\"大陆通行的太阳历，一年六季、每季五十日、每旬十日、每周五日；别称格里历，源自[正教会](#idx-e181)的[圣格里仪式历](#idx-e361)，经[公教会](#idx-e155)世俗化后扩散全大陆。\"},{\"id\":\"e371\",\"title\":\"星历\",\"aliases\":[],\"body\":\"艾瑟瑞姆地方历法，大陆唯一的月亮历，六月之名取自黄道六宫。\"},{\"id\":\"e374\",\"title\":\"炎阳\",\"aliases\":[\"神焰\",\"牧宫月\",\"叁位\"],\"body\":\"一年六季的第三季，[晨风海](#idx-e414)带来充沛降水，东部平原产出攀至顶峰，各国军事行动与大规模物资调动亦多集中于此时。[仪式历](#idx-e361)同季作神焰，艾瑟瑞姆[星历](#idx-e371)作牧宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作叁位。\"},{\"id\":\"e376\",\"title\":\"月曜日\",\"aliases\":[\"圣约翰日\"],\"body\":\"[通用历](#idx-e368)一周第一日，亦简称星期一；[仪式历](#idx-e361)作圣约翰日，对应天星[汐月](#idx-e544)，是四个劳作日之首。\"},{\"id\":\"e378\",\"title\":\"步米\",\"aliases\":[],\"body\":\"长度基本单位，源自[索拉瑞斯](#idx-e429)[军团](#idx-e294)标准行军步伐；一步米等于十分步米等于一百厘步米。\"},{\"id\":\"e382\",\"title\":\"河磅\",\"aliases\":[],\"body\":\"重量基本单位，源自沙阿万[魔矿](#idx-e71)场的矿砂称量；一河磅等于一百河克，一河吨等于一千河磅。\"},{\"id\":\"e385\",\"title\":\"界石\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团](#idx-e294)沿主干道每千步所立的里程标记，亦为[陆里](#idx-e387)之所本。\"},{\"id\":\"e387\",\"title\":\"陆里\",\"aliases\":[],\"body\":\"长度单位，一陆里等于一千[步米](#idx-e378)，源自[军团](#idx-e294)沿主干道每千步立一[界石](#idx-e385)的传统。\"},{\"id\":\"e395\",\"title\":\"星度\",\"aliases\":[],\"body\":\"温度基本单位，源自[王家研究院](#idx-e249)的[魔矿](#idx-e71)[蚀刻](#idx-e76)环境控制需求，以纯水冰点为零、沸点为一百。\"},{\"id\":\"e399\",\"title\":\"丹提亚穗稻\",\"aliases\":[\"穗稻\"],\"body\":\"[阿布丹提亚大平原](#idx-e453)的主粮作物，高产稳产，通称穗稻。\"},{\"id\":\"e412\",\"title\":\"神遴者\",\"aliases\":[\"神遴者阶层\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰的[玛阿特](#idx-e191)称量中，心脏与宝石恰成平衡者。宗教解释中，他们身负引导众生的责任，受赐[秘术](#idx-e3)之力转生现世；作为一个阶层，神遴者垄断了酋邦一切政治职位，[教长](#idx-e199)、祭司、部落酋长与长老无一例外皆出于此。\"},{\"id\":\"e413\",\"title\":\"北门湾\",\"aliases\":[],\"body\":\"[凛冰洋](#idx-e423)伸入大陆中部的内湾，位于[忒奥西斯](#idx-e483)北境，是[索菲亚大运河](#idx-e427)的北端入口。[尼希尔](#idx-e517)[魔矿](#idx-e71)经凛冰洋航线抵此南下，是当代大陆最重要跨洋贸易干线上的节点；[运河仪所](#idx-e493)即设于湾口。\"},{\"id\":\"e414\",\"title\":\"晨风海\",\"aliases\":[],\"body\":\"大陆东南方海域，洋流自东往西、往北持续输送暖湿气流深入内陆，是[阿布丹提亚大平原](#idx-e453)优良农业气候的关键成因。[马提尼河](#idx-e471)与[波特利亚河](#idx-e461)汇流后注入此海。\"},{\"id\":\"e415\",\"title\":\"大星洋\",\"aliases\":[],\"body\":\"大陆西侧海域，洋流复杂多变，深远洋几无成规模的远洋航行；较活跃者唯[索拉瑞斯](#idx-e429)西海岸的近海航线，串联[镜心湖](#idx-e436)产区与西南偏远[行省](#idx-e232)。其偏暖洋流携湿润气流北上，遇[裂境山脉](#idx-e422)与[冠脊山脉](#idx-e419)抬升成雨，是索拉瑞斯森林覆盖率过半的核心水分来源。\"},{\"id\":\"e416\",\"title\":\"翡翠海峡\",\"aliases\":[],\"body\":\"大陆南方水域，全大陆航运最繁忙之处，[卡帕尼](#idx-e502)群岛与大陆本体之间的物流几乎全经于此，亦是[索菲亚大运河](#idx-e427)的南端出口。卡帕尼北部岛链水文条件优越、港口全年可用，是这条贸易干线的天然枢纽。\"},{\"id\":\"e419\",\"title\":\"冠脊山脉\",\"aliases\":[],\"body\":\"大陆规模最大的山脉系统，分北、西、东南、南四脉。北脉与西脉合围[尼希尔](#idx-e517)南侧边境，北脉与东南脉之间夹含[希尔文诺大森林](#idx-e528)，南脉则完全位于[索拉瑞斯](#idx-e429)境内。冠脊山脉北脉同时是大陆西部最重要的气候屏障，其北为尼希尔干旱荒漠，其南为[希尔文诺](#idx-e524)封闭湿润的万年密林，是大陆诸域中最极端的毗邻气候对照。\"},{\"id\":\"e422\",\"title\":\"裂境山脉\",\"aliases\":[],\"body\":\"南北走向纵贯[索拉瑞斯](#idx-e429)中部，是帝国东西地形的核心分界线：以东为[奥利提斯平原](#idx-e430)，落在其雨影区而气候偏干；以西地势平缓，[镜心湖](#idx-e436)居中。沿线铁铜矿藏富集，是大陆冶铁产业最重要的原料来源；[索尔河](#idx-e447)发源于其南麓。\"},{\"id\":\"e423\",\"title\":\"凛冰洋\",\"aliases\":[],\"body\":\"大陆北方极寒洋，以东西向洋流为主，北部与东部全年有浮冰，渔业与运输活动仅集中于中西部海域；对大陆只输出严寒与干燥。[尼希尔](#idx-e517)[魔矿](#idx-e71)出口的主干路线即自两河出海口北上进入此洋，东行抵[北门湾](#idx-e413)后南下入[大运河](#idx-e427)。\"},{\"id\":\"e427\",\"title\":\"索菲亚大运河\",\"aliases\":[\"大运河\"],\"body\":\"[忒奥西斯](#idx-e483)与[索拉瑞斯](#idx-e429)联合开凿的人工水道，1381–1388年历时七年建成，以[圣仪军](#idx-e302)的[神启魔法](#idx-e4)为主力，是[大陆历](#idx-e346)史上最庞大的人造工程。自[北门湾](#idx-e413)几乎垂直向南贯穿[西比尔平原](#idx-e492)，南端注入[翡翠海峡](#idx-e416)，将[凛冰洋](#idx-e423)与翡翠海峡物理贯通，从根本上重塑了大陆南北贸易格局。管理权归圣领，凡向其报备货物并缴纳[河金](#idx-e321)的船只不分国籍皆可通行。\"},{\"id\":\"e429\",\"title\":\"索拉瑞斯帝国\",\"aliases\":[\"索拉瑞斯\"],\"body\":\"位于大陆中西部的军事集权帝制大国，首都[索尔因维克图斯](#idx-e448)。1159年[索拉尔王国](#idx-e541)国王[阿利昂](#idx-e235)统一西大陆诸国、受牧首册封为首代[龙裔凯撒](#idx-e234)而立国。国土一千一百二十万平方[陆里](#idx-e387)，划为八个[军团行省](#idx-e232)，逾七成为群山与原始森林，人口约四千二百万。以[军团](#idx-e294)—行省一体化制度与[龙骑兵团](#idx-e291)著称，尊[正教](#idx-e146)为国教，逾八成公民为正教信徒；外交强势，与[阿布丹提亚](#idx-e452)共构当代大陆两极。\"},{\"id\":\"e430\",\"title\":\"奥利提斯平原\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)境内[裂境山脉](#idx-e422)以东呈东北—西南走向的狭长平原，是帝国最主要的农业区与人口集中地之一，首都[索尔因维克图斯](#idx-e448)位于其西南角。因落在裂境山脉雨影区，气候较[镜心湖](#idx-e436)区偏干。\"},{\"id\":\"e436\",\"title\":\"镜心湖\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)西部的湖泊，是帝国最重要的农业产区核心与人口最密集的区域之一。受[大星洋](#idx-e415)暖流直接调节，湖体又进一步平抑温差，是帝国内气候最温和宜居的地带。[纳赫尔河](#idx-e520)发源于此；东岸最大城市为[雷克西姆](#idx-e440)。\"},{\"id\":\"e437\",\"title\":\"镜心湖行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八个[军团行省](#idx-e232)之一，位于帝国西部，环[镜心湖](#idx-e436)而设，首府[雷克西姆](#idx-e440)。\"},{\"id\":\"e440\",\"title\":\"雷克西姆\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[镜心湖行省](#idx-e437)首府，[镜心湖](#idx-e436)东岸最大城市，建有[圣保罗](#idx-e119)大教堂。堂中无[圣骸](#idx-e120)，仅供奉据称是保罗生前所披的斗篷——保罗殉道之处据《保罗福音》末章推测邻近镜心湖，[正教会](#idx-e181)因此在雷克西姆建立大教堂。\"},{\"id\":\"e447\",\"title\":\"索尔河\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)境内河流。发源于[裂境山脉](#idx-e422)南麓，流经首都[索尔因维克图斯](#idx-e448)后向东南注入艾瑟瑞姆境内的[坠星湖](#idx-e501)，是帝国重要的内河水系。\"},{\"id\":\"e448\",\"title\":\"索尔因维克图斯\",\"aliases\":[\"索尔因\"],\"body\":\"[索拉瑞斯帝国](#idx-e429)首都，通称索尔因，位于[奥利提斯平原](#idx-e430)西南角，[索尔河](#idx-e447)流经其间。是帝国的政治军事中心与最大城市，八位[行省总督](#idx-e251)每年赴此参加[叙职大会](#idx-e252)；城南设有[龙骑士团](#idx-e296)驻地与飞场。\"},{\"id\":\"e452\",\"title\":\"阿布丹提亚帝国\",\"aliases\":[\"阿布丹提亚\",\"丹提亚帝国\"],\"body\":\"通称丹提亚帝国，位于大陆东南方[大平原](#idx-e453)的君主宪政制大国，首都[维里迪亚](#idx-e480)。386年卡立曼·费内尔统一诸国建立帝政，费内尔家族统治延续至今；两次[阿索战争](#idx-e263)失利后于1393年建[三柱议会](#idx-e240)，和平演变为君主立宪制国家。国土八百七十万平方[陆里](#idx-e387)，划为五个[帝政省](#idx-e228)和一个直辖省，人口逾六千二百万，为全大陆最多。大陆第一大粮食出口国与政治东极，约七成人口信奉[公教](#idx-e107)。\"},{\"id\":\"e453\",\"title\":\"阿布丹提亚大平原\",\"aliases\":[\"大平原\"],\"body\":\"[阿布丹提亚帝国](#idx-e452)国土主体，大陆东部平原带规模最大的一部分，为全大陆最集中的农业核心地带。地势平坦开阔，水系极为发达，冲积土壤肥沃；中部核心区无霜期长而几无结冻，是帝国粮食、棉花与人口的集中所在，首都[维里迪亚](#idx-e480)居其腹地。\"},{\"id\":\"e459\",\"title\":\"波马里亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内位于[润溪湖](#idx-e474)西南方的重要城市。是大陆东部已知元素丰度最高的城市之一，天然宜居且对元素[疏化](#idx-e37)抵抗力强。历史上曾为[正教会](#idx-e181)在东诺拉尼亚最重要的宗教驻地，[教会大分裂](#idx-e160)后成为[公教总会](#idx-e157)所在地；[公教会](#idx-e155)于十四世纪宣称寻得的[圣保罗](#idx-e119)[圣骸](#idx-e120)即供奉于波马里亚大教堂。该城亦是波马里亚[公爵领](#idx-e230)首府，同名[帝政省](#idx-e228)的省名即出于此。\"},{\"id\":\"e461\",\"title\":\"波特利亚河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内的主要河流之一，发源自[葛林沃尔克](#idx-e525)南脉南麓，与[马提尼河](#idx-e471)于[大平原](#idx-e453)中部汇流后注入[晨风海](#idx-e414)，两河交汇处即首都[维里迪亚](#idx-e480)所在。\"},{\"id\":\"e462\",\"title\":\"布兰顿\",\"aliases\":[],\"body\":\"[布兰顿河](#idx-e463)东岸城市，位于河流中游。[第二次阿索战争](#idx-e269)后依《[布兰顿和约](#idx-e264)》割予[索拉瑞斯](#idx-e429)，此后一百二十余年是帝国边境最靠东的据点。1479年[三战](#idx-e270)开战之初为[阿布丹提亚](#idx-e452)夺取，此后终战未再易手，现归属于阿布丹提亚。\"},{\"id\":\"e463\",\"title\":\"布兰顿河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内河流。自北向南流经[西比尔平原](#idx-e492)东南缘，中段接纳一条自西而来的支流后折向东南，于[法拉利亚](#idx-e465)一带入海；[第二次阿索战争](#idx-e269)后其下游为阿索两国界河，《[布兰顿和约](#idx-e264)》即以此河命名，1479年[布兰顿战役](#idx-e265)的战场亦在其中下游两岸。\"},{\"id\":\"e465\",\"title\":\"法拉利亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内，[布兰顿河](#idx-e463)入[翡翠海峡](#idx-e416)河口处的港镇。\"},{\"id\":\"e471\",\"title\":\"马提尼河\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)第一大河，发源于[穗满湖](#idx-e477)，向东南流经[大平原](#idx-e453)后与[波特利亚河](#idx-e461)汇流注入[晨风海](#idx-e414)，两河交汇处即首都[维里迪亚](#idx-e480)所在。\"},{\"id\":\"e474\",\"title\":\"润溪湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)双湖之东者，与[穗满湖](#idx-e477)并称双湖，是帝国北部水系的重要源头。湖运承担北部矿区矿产向核心区的输送；西南方为[元素丰地](#idx-e52)城市[波马里亚](#idx-e459)。\"},{\"id\":\"e477\",\"title\":\"穗满湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)双湖之西者，与[润溪湖](#idx-e474)并称双湖。湖区周边水草丰美，是全大陆最集中的规模化牧区；[马提尼河](#idx-e471)发源于此。\"},{\"id\":\"e480\",\"title\":\"维里迪亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)首都，位于[马提尼河](#idx-e471)与[波特利亚河](#idx-e461)交汇处、[大平原](#idx-e453)腹地，是帝国政治文化中心，也是帝国最重要的内河航运枢纽之一。城市内歌剧院与画廊林立，素有\\\"艺术之都\\\"之称。\"},{\"id\":\"e481\",\"title\":\"维里迪亚直辖省\",\"aliases\":[\"首都直辖省\"],\"body\":\"[阿布丹提亚帝国](#idx-e452)六个一级行政区中唯一由皇室直辖者，亦称首都直辖省，位于帝国西南，含首都[维里迪亚](#idx-e480)及周边；境内不设贵族封地与[帝政省](#idx-e228)政府，是该国唯一的直辖省。\"},{\"id\":\"e483\",\"title\":\"忒奥西斯圣治领\",\"aliases\":[\"忒奥西斯\",\"圣治领\",\"圣领\"],\"body\":\"通称圣治领或圣领，位于大陆中央北部的[正教会](#idx-e181)神权共和国，首都[圣城索菲亚](#idx-e487)。1159年[索拉瑞斯](#idx-e429)开国[凯撒](#idx-e234)[阿利昂](#idx-e235)将帝国东部领土捐献给[大牧首](#idx-e148)而立，是正教会取得世俗领地后的政治实体。国土两百三十万平方[陆里](#idx-e387)，划为五个[都主教区](#idx-e153)，人口一千三百万。大牧首兼国家元首，[牧首厅](#idx-e166)为最高行政机构；直属[圣仪军](#idx-e302)兼掌国防与大型工程，[索菲亚大运河](#idx-e427)即其代表成果。\"},{\"id\":\"e485\",\"title\":\"潘克拉托\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)境内城市，[圣约翰都主教区](#idx-e489)的都教座城。[圣约翰](#idx-e123)殉道之地，[圣骸](#idx-e120)存于圣约翰大教堂。\"},{\"id\":\"e487\",\"title\":\"圣城索菲亚\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领首都，[大牧首](#idx-e148)及[牧首厅](#idx-e166)所在地。相传为[唯一神](#idx-e135)降临之处，本为小村，圣领建立及[大运河](#idx-e427)开通后扩张为兼具政治、宗教与经济中心地位的大都会。是大陆中部已知最大的[元素丰地](#idx-e52)，也是[正教会](#idx-e181)立都于此的重要自然前提；索菲亚大教堂藏有据称是[圣约翰](#idx-e123)升天时所钉[十字架](#idx-e127)的原木碎片。\"},{\"id\":\"e489\",\"title\":\"圣约翰都主教区\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领西南部[都主教区](#idx-e153)，以四[使徒](#idx-e126)之首[圣约翰](#idx-e123)命名，辖存有圣约翰[圣骸](#idx-e120)的[潘克拉托](#idx-e485)等地。\"},{\"id\":\"e492\",\"title\":\"西比尔平原\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领所在的温带半干旱草原，地势平坦、天然水源匮乏，[索菲亚大运河](#idx-e427)贯通前农业条件相当有限；北延至[北门湾](#idx-e413)，是大陆南北贸易的关键咽喉。其南部于[二战](#idx-e269)后尽归[索拉瑞斯](#idx-e429)，后为索菲亚大运河纵切为二；运河以东的土地依[三战](#idx-e270)《[卡斯特鲁姆和约](#idx-e275)》归[阿布丹提亚](#idx-e452)，交接至今悬置，是阿索两国博弈的核心争议。\"},{\"id\":\"e493\",\"title\":\"运河仪所\",\"aliases\":[],\"body\":\"坐落于[忒奥西斯](#idx-e483)圣领领土最北端、[索菲亚大运河](#idx-e427)与[北门湾](#idx-e413)交汇入口处的机构，是[牧首厅](#idx-e166)对大运河实施管理的最前沿。承担通行审核与海水除盐双重职能，常驻[神启魔法](#idx-e4)师持续以水元素魔法析出注入运河的海水盐分。其除盐作业常年施法却从未引发可观测的元素[疏化](#idx-e37)，已成为[魔元素动力学](#idx-e29)的专项研究课题。\"},{\"id\":\"e494\",\"title\":\"艾瑟瑞姆王国\",\"aliases\":[],\"body\":\"位于大陆西南部的封建君主制国家，首都[阿斯托利亚](#idx-e495)，领土环抱[坠星湖](#idx-e501)。源出西诺拉尼亚黑暗时期南下避难的[星术](#idx-e7)学者聚落，十一世纪末[塔利瑞安](#idx-e218)联合十二城邦创建[大星术研究院](#idx-e226)，十三世纪前叶塔利兰娜受推举加冕为初代女王。国土约四百二十万平方[陆里](#idx-e387)，由[王冠领地](#idx-e248)、四大伯爵封邑与[特别仪式区](#idx-e244)构成，人口约一千八百万。以星术立国，[王家研究院](#idx-e249)[天星首席](#idx-e247)永由君主兼任，传统意义的[施法者](#idx-e36)占人口逾半。\"},{\"id\":\"e495\",\"title\":\"阿斯托利亚\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)首都，位于[坠星湖](#idx-e501)南端[瑟蒂尔河](#idx-e499)出湖处，由[大陆历](#idx-e346)894年南下避难的[星术](#idx-e7)学者聚落发展而成，[王家研究院](#idx-e249)即设于此。城名源出[星空学派](#idx-e6)早期所用的 Astralis（\\\"属星的\\\"），后世音变作 Astoria，旧拼法今仅见于研究院的仪式文书。\"},{\"id\":\"e496\",\"title\":\"多古雷伯爵领\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)四大[伯爵领](#idx-e219)之一，辖有王国最大城市[斯特拉拉](#idx-e500)，设有多古雷伯爵领研究院，其[芙德兰研究室](#idx-e229)以[界星石](#idx-e66)构型研究见长。开放程度与对商业合作的积极性在王国各地区内属前列。\"},{\"id\":\"e497\",\"title\":\"卡尔姆\",\"aliases\":[],\"body\":\"[卡伊尔伯爵领](#idx-e498)首府，卡伊尔伯爵领研究院所在地，艾瑟瑞姆南部最大港城，濒[大星洋](#idx-e415)。卡伊尔伯爵为王国保守派代表人物，对[不习者改革](#idx-e266)态度消极，领内外国人极为罕见。王国第六十三届[洛林会议](#idx-e277)在城内[伯爵领研究院](#idx-e220)召开。\"},{\"id\":\"e498\",\"title\":\"卡伊尔伯爵领\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)四大[伯爵领](#idx-e219)之一，首府[卡尔姆](#idx-e497)，领地毗邻[特别仪式区](#idx-e244)，设有卡伊尔伯爵领研究院。领主卡伊尔伯爵为保守派代表人物，是王国内抵制[不习者改革](#idx-e266)与对外开放最力者。\"},{\"id\":\"e499\",\"title\":\"瑟蒂尔河\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)境内河流。由[坠星湖](#idx-e501)南端出发，向南流经艾瑟瑞姆注入[大星洋](#idx-e415)，首都[阿斯托利亚](#idx-e495)位于其北端出湖处。\"},{\"id\":\"e500\",\"title\":\"斯特拉拉\",\"aliases\":[],\"body\":\"艾瑟瑞姆[多古雷伯爵领](#idx-e496)以及王国最大城市。位于首都以东、面向[翡翠海峡](#idx-e416)，是王国的海陆交通枢纽与主要对外贸易门户，也是对[卡帕尼](#idx-e502)贸易的最大口岸。[阿斯托戈商会](#idx-e310)在此设有分部。\"},{\"id\":\"e501\",\"title\":\"坠星湖\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)的地理中心，首都[阿斯托利亚](#idx-e495)位于其南端出湖口。[索尔河](#idx-e447)自[索拉瑞斯](#idx-e429)方向注入湖北端，[瑟蒂尔河](#idx-e499)由南端流出南向[大星洋](#idx-e415)；湖运依托[星术](#idx-e7)船只，是沿岸城市群最重要的内部贸易路线。\"},{\"id\":\"e502\",\"title\":\"卡帕尼诸公联合\",\"aliases\":[\"卡帕尼\",\"卡帕尼联邦\"],\"body\":\"又称卡帕尼联邦，位于大陆南部群岛的公国联邦制国家，由四成员公国与[北部特别贸易区](#idx-e505)组成，四公国各有首府，联邦首都为[阿卡帕尼](#idx-e503)公国的[伊索拉韦尔德](#idx-e516)。1356年[第二次阿索战争](#idx-e269)后，四公爵于[米德可尔](#idx-e512)会晤宣布脱离[阿布丹提亚](#idx-e452)独立。国土约二百五十万平方[陆里](#idx-e387)，散布于七十八座岛屿，人口约九百八十万。联邦以商贸与金融立国，外交奉行离岸平衡，热带群岛旅游业亦非常发达。\"},{\"id\":\"e503\",\"title\":\"阿卡帕尼\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一，由同名公爵世袭领有，核心领地为[阿卡帕尼岛](#idx-e504)，首府[伊索拉韦尔德](#idx-e516)亦为联邦首都。\"},{\"id\":\"e504\",\"title\":\"阿卡帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)群岛南部主岛区的核心岛屿之一，与[梅尔帕尼岛](#idx-e510)合计聚居全联邦逾半人口。\"},{\"id\":\"e505\",\"title\":\"北部特别贸易区\",\"aliases\":[\"特贸区\",\"北部特贸区\"],\"body\":\"[卡帕尼联邦](#idx-e502)于1382年于群岛北部岛链设立的特别经济区，由五十八座岛屿及[自由港](#idx-e344)组成，适用独立的[特区商法典](#idx-e245)与优惠贸易税率，设[管理局](#idx-e231)与[仲裁所](#idx-e259)自治，是大陆各国商人自由设立分部开展贸易的核心地带，也是联邦金融机构最密集之处。\"},{\"id\":\"e506\",\"title\":\"波托马利\",\"aliases\":[],\"body\":\"[卡帕尼联邦](#idx-e502)最大城市，位于[北部特贸区](#idx-e505)、[翡翠海峡](#idx-e416)中央，是全大陆南北贸易的关键枢纽与海运门户。\"},{\"id\":\"e510\",\"title\":\"梅尔帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)群岛南部主岛区的核心岛屿之一，与[阿卡帕尼岛](#idx-e504)合计聚居全联邦逾半人口。\"},{\"id\":\"e512\",\"title\":\"米德可尔\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)境内地名。1356年[第二次阿索战争](#idx-e269)后，卡帕尼四公爵于此会晤宣布建立诸公联合，是联邦独立的历史象征地点。\"},{\"id\":\"e515\",\"title\":\"谢兰港\",\"aliases\":[],\"body\":\"[卡帕尼联邦](#idx-e502)[波托马利](#idx-e506)城内的主要港口区。\"},{\"id\":\"e516\",\"title\":\"伊索拉韦尔德\",\"aliases\":[\"伊索拉\"],\"body\":\"[卡帕尼诸公联合](#idx-e502)首都，通称伊索拉，同时是[阿卡帕尼](#idx-e503)公国首府，四公国的政治核心所在地。当地作坊以镀银工艺见长，[索利亚商会](#idx-e338)创办于此。\"},{\"id\":\"e517\",\"title\":\"尼希尔伊玛目酋邦\",\"aliases\":[\"尼希尔\",\"尼希尔酋邦\"],\"body\":\"通称尼希尔酋邦，位于大陆西北角沙漠绿洲与两河流域的神权部落联邦国家，首都[阿尔努尔](#idx-e518)。五世纪[萨阿尔血王朝](#idx-e539)覆灭后，诸部酋长于阿尔努尔会盟，推举诸神大祭司为[伊玛目教长](#idx-e199)，成立酋邦。尼希尔国土五百八十万平方[陆里](#idx-e387)，由[诸神圣土](#idx-e202)与八部落领地构成，人口约一千八百万。酋邦是当今大陆唯一合法保有奴隶制的国家，社会等级高度固化。\"},{\"id\":\"e518\",\"title\":\"阿尔努尔\",\"aliases\":[],\"body\":\"[尼希尔伊玛目酋邦](#idx-e517)首都兼伊玛目城，位于两河流域核心地带，属[教长](#idx-e199)直辖的[诸神圣土](#idx-e202)。422年诸部酋长于此会盟建立部落联邦体制、推举首任伊玛目教长；城中六神各有神庙，另有教长主持全酋邦最隆重仪典的[大神庙](#idx-e186)，[酋长会议](#idx-e239)亦每年在此召开。\"},{\"id\":\"e519\",\"title\":\"哈亚特河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)两河之东河，发源于[冠脊山脉](#idx-e419)西脉北麓的积雪融水，自南向北流经酋邦西部，于[塔巴特](#idx-e523)与[纳赫尔河](#idx-e520)交汇后入[凛冰洋](#idx-e423)。其洪汛带来上游冲积土并补充土壤水分，随洪水消退而展开的播种是全酋邦农业的年度起点。\"},{\"id\":\"e520\",\"title\":\"纳赫尔河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)两河之西河，发源于[索拉瑞斯](#idx-e429)境内的[镜心湖](#idx-e436)，自南向北流经酋邦西部，于[塔巴特](#idx-e523)与[哈亚特河](#idx-e519)交汇。因源头在索拉瑞斯境内，诸神信仰第一季的西祭典历来只能在靠近南边境的城市勉强举行，这也是尼索边境关系长期恶劣的原因之一。\"},{\"id\":\"e521\",\"title\":\"沙阿万大魔矿\",\"aliases\":[\"大魔矿\"],\"body\":\"位于[尼希尔](#idx-e517)东部沙阿万沙漠地下，全大陆最大的单一[魔矿](#idx-e71)产地，年产量占大陆总量逾半，[高品级魔矿](#idx-e65)更占大陆产出八成以上，几乎构成事实垄断。矿井多由[神遴者](#idx-e412)以[秘术](#idx-e3)开凿，此后的采掘、支护、排水与转运则由奴隶以常规工具承担。各国对尼希尔的结构性经济依赖即根源于此。\"},{\"id\":\"e522\",\"title\":\"沙阿万大沙漠\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)东部广袤沙漠，是大陆最严酷的干旱地带，地表资源匮乏，昼夜温差可超三十[星度](#idx-e395)，仅有[冠脊山脉](#idx-e419)北脉北麓发源的两条小型沙漠河流维系着若干绿洲；地下则蕴藏[沙阿万大魔矿](#idx-e521)。\"},{\"id\":\"e523\",\"title\":\"塔巴特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)西部[纳赫尔河](#idx-e520)与[哈亚特河](#idx-e519)的交汇处，是两河流域的重要节点，两河在此汇合后继续北行入[凛冰洋](#idx-e423)。\"},{\"id\":\"e524\",\"title\":\"希尔文诺\",\"aliases\":[],\"body\":\"大陆精灵族裔及其文明与家园的统称，位于[冠脊山脉](#idx-e419)间的封闭盆地，由二十余个[氏族](#idx-e211)部落构成，最大聚落为[大圣树](#idx-e214)所在的[希尔文尼亚](#idx-e527)。其实际控制面积以大森林为界约一百二十万平方[陆里](#idx-e387)，人口一般认为不超过一百万。制度植根于大圣树信仰，每三十年召开[万叶庭](#idx-e213)全体表决，[叶络枢机院](#idx-e216)理日常行政与对外事务。1132年与人类首次接触，此后长期保持中立与封闭，被各国视为大陆事务的天然缓冲区与仲裁者。\"},{\"id\":\"e525\",\"title\":\"葛林沃尔克\",\"aliases\":[],\"body\":\"大陆东北角地区，由南北两支山脉夹峙高山密林构成，北部为雪原冰川。是大陆地理信息最匮乏的区域，据传其可能存在智慧种族与独立的魔法体系，但学界均无可靠资料。\"},{\"id\":\"e527\",\"title\":\"希尔文尼亚\",\"aliases\":[],\"body\":\"[希尔文诺大圣树](#idx-e214)所在之地，精灵族规模最大的聚居点，[万叶庭](#idx-e213)与[叶络枢机院](#idx-e216)所在。据推测是大陆最优越的[元素丰地](#idx-e52)之一。\"},{\"id\":\"e528\",\"title\":\"希尔文诺大森林\",\"aliases\":[],\"body\":\"精灵族世代定居之地，坐落于[冠脊山脉](#idx-e419)北脉与东南脉合围而成的山间盆地，是大陆封闭程度最高的区域之一，实际控制面积约一百二十万平方[陆里](#idx-e387)。山脉双重合围造就封闭湿润的气候，孕育大量大陆其他地区所没有的特有动植物；盆地开口朝向东南，东南脉中部的天然隘口是[林缘议厅](#idx-e276)所在地。\"},{\"id\":\"e532\",\"title\":\"冠阳\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之首，[星空学派](#idx-e6)完整名\\\"主序·冠阳\\\"，即太阳。[源星](#idx-e56)属权威、创造与审判；[正教](#idx-e146)神学中象征[唯一神](#idx-e135)，对应[仪式历](#idx-e361)[圣神日](#idx-e358)与[通用历](#idx-e368)日曜日。\"},{\"id\":\"e533\",\"title\":\"烬铸星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"熔炉·烬铸星\\\"。[源星](#idx-e56)属转化、破坏与锻造，常被视为天球之上的锻造炉象征；[正教](#idx-e146)神学上象征[圣约瑟](#idx-e124)，对应[烬曜日](#idx-e351)。\"},{\"id\":\"e539\",\"title\":\"萨阿尔血王朝\",\"aliases\":[],\"body\":\"古代[尼希尔](#idx-e517)地区存在的政权，由掌握[秘术](#idx-e3)的萨阿尔部落于[大陆历](#idx-e346)元前二世纪建立。该部自[沙阿万大沙漠](#idx-e522)西侵，用八年统一西尼希尔诸部，王朝延续至五世纪。其以自身信仰强行替代西尼希尔原有神话体系，奠定了尼希尔日后的诸神信仰与政教结构。史籍普遍估算，王朝治下因屠杀或献祭而死者逾四百万。该王朝在五世纪大起义中覆灭，但其制度主体却被422年的[阿尔努尔](#idx-e518)会盟所承袭。\"},{\"id\":\"e541\",\"title\":\"索拉尔王国\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)的前身，于西诺拉尼亚[黑暗时代](#idx-e273)中崛起的王国。1159年，索拉尔国王[阿利昂](#idx-e235)统一西大陆诸国、受牧首册封为首位[龙裔凯撒](#idx-e234)，索拉瑞斯帝国由此建立。现代通用度量衡的长度单位[步米](#idx-e378)与[陆里](#idx-e387)即源自索拉尔王国的[军团](#idx-e294)行军传统。\"},{\"id\":\"e544\",\"title\":\"汐月\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"银杯·汐月\\\"，即月亮。[源星](#idx-e56)属容纳、精神与教导；[正教](#idx-e146)神学上象征[圣约翰](#idx-e123)，对应[月曜日](#idx-e376)。艾瑟瑞姆[星历](#idx-e371)即以其盈亏循环为月。\"},{\"id\":\"e548\",\"title\":\"织虹星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"脉生·织虹星\\\"。[源星](#idx-e56)属修复、治疗与幻象；[正教](#idx-e146)神学上象征[圣保罗](#idx-e119)，对应[虹曜日](#idx-e348)。\"},{\"id\":\"e549\",\"title\":\"仲裁星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"律令·仲裁星\\\"，是星空中最亮且运动最明显的三颗星体之一。[源星](#idx-e56)属秩序、守护与契约；[正教](#idx-e146)神学上象征[圣伊琳娜](#idx-e122)，对应[裁曜日](#idx-e345)。\"}],\"titleImagePath\":\"/compendium/诸域纪闻/衡台.webp\",\"titleImageInsertLine\":1}}]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"12:I[27201,[\"/Nurania/next/static/chunks/ff1a16fafef87110.js\",\"/Nurania/next/static/chunks/0bd6498bda341889.js\"],\"IconMark\"]\na:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"衡台 | The Weighing Scale\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"纪念塞勒内斯·尤里梅尔诞辰150周年系列文集\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/Nurania/icon.svg?icon.986a92ce.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L12\",\"3\",{}]]\n"])</script></body></html>
