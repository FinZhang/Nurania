一边的埃尔顿聊了几句，男人在她问到今天日期的时候愣了一下。\n\n“我们离开[塔尔村](#idx-e478)正好是[升天节](#idx-e363)后第三天，按这么算的话，今天应该是[炎阳](#idx-e374)季二十三日。”埃尔顿想了想回答她。\n\n赫利娅点点头，这和她从子爵城出发那天开始算的日子是同一个。她又走到希斯旁边，叮嘱了他几句独自守夜的注意事项。小莉诺从他怀里探出头来看她，两只小眼睛黑亮黑亮的。赫利娅有点想伸手摸摸她的脑袋，但最后忍住了。\n\n她转身回到篝火边自己的位置，那条旧毯子裹在身上。夜色渐深，周围的流民陆续睡下，杜拉尔对她点点头，走到营地另一边守夜。\n\n这时诺雅抱着她的小毯子小步跑了过来，“梵诺尔姐姐，我能跟你睡吗？”\n\n赫利娅没出声，往旁边让了让，给她腾地方。\n\n“谢谢姐姐。”诺雅挨着她坐下，然后半晌没说话。\n\n赫利娅转过头，诺雅抱着膝盖，手指捏着毯子的下摆。\n\n“姐姐，我有点怕。”诺雅的声音闷闷的，“我们马上就要到新的贵族老爷的领地了，是不是以后再也不能回塔尔村了？”\n\n赫利娅静静地听着。\n\n“我和爸爸一直住在村里小教堂后面，靠着家里管的两片田。[清和](#idx-e357)季的时候田上会开漂亮的白色小花，爸爸从教堂回来早的时候，会带我去田里玩。”诺雅继续小声地说，“西边塞利叔叔家养了两只灰狗，很亲人，我有时候会把自己的面包省一点下来给它们吃。塞利叔叔说明年生了新的小狗崽就分给我一只养。”\n\n“爸爸说彼得宁村那边的贵族老爷会对我们好一些，但是彼得宁会有田里的小花，会有喜欢我的小狗吗？”诺雅声音更小了，带了点哭腔。“我不想离开塔尔村……我想回家。”\n\n赫利娅感觉到女孩的身体在微微发抖，又往她的胳膊上靠了靠。\n\n“姐姐的家是不是在一片大森林里？我听爸爸说，精灵们都住在大陆另一边的山里。”过了一会，诺雅小声地问。\n\n“嗯。”\n\n“那为什么后来离开家了呢？”\n\n赫利娅沉默了一会儿，然后探手进领口，把那只银吊坠盒取出来，搁到诺雅手心里。“你看。”\n\n诺雅借着火光，笨手笨脚地揭开盒盖，看见里头那片碧绿的叶子，“哇”了一声。\n\n“这是我离开家时，我的妈妈给我的。”赫利娅小心翼翼地斟酌着语言，“我以前住的那片大森林叫做[希尔文诺](#idx-e524)。那时候我总想着有一天要走出森林，看看希尔文诺外面的世界是怎么样的。后来我就真的出来了，一个人走了很远很远的路，也遇到了很多很多事。”\n\n这些话，每一句单看都不假，她只是略去了一些——离开家的决定是别人替她做的，她走的那晚哭得几乎喘不上气，而那片名叫希尔文诺的大森林，也已经不再欢迎她了。她讲给诺雅听的，是同一件事的另一个版本：那个她小时候躺在草地上、自己对自己讲过许多遍的版本。\n\n诺雅摸着吊坠盒上的细纹，继续问，“那……姐姐觉得外面的世界好吗？”\n\n“有好的，也有不好的。”赫利娅答，“遇到坏蛋我就教训他们，遇到好人，我就帮他们的忙。这几天我给你讲过很多，你还记得吗？”\n\n“记得！”诺雅用力地点头，“姐姐特别厉害，就好像爸爸说的游侠一样！”\n\n赫利娅愣了一下。\n\n“……可能吧。”她最后说。\n\n“我希望以后我也能像姐姐那么厉害，不过西里诺斯爷爷教我练剑的时候，我总是笨手笨脚的。村里的[司祭](#idx-e176)也说我没有魔法的天分。”诺雅说着说着声音又低了下去。\n\n“厉害不一定要打架，”赫利娅安慰她，“你还小，之后总归能找到一件自己擅长的事的，慢慢来，不急。”\n\n诺雅似懂非懂地点点头，“我相信梵诺尔姐姐。”\n\n“叫我赫利娅吧，赫利娅·梵诺尔。”\n\n“赫，利，娅。”诺雅慢慢念了一遍，然后露出一个笑容，“我喜欢这个名字！”\n\n赫利娅轻轻地摸了摸她的头。诺雅的心情似乎好了些，又开始问赫利娅过去委托的故事，赫利娅慢慢地给她讲，女孩时不时地追问几句。又过了一会，赫利娅讲完一段，注意到身边没了声息，她转头，诺雅已经攥着吊坠盒睡着了。\n\n赫利娅伸手想把盒子取回来，指尖碰到诺雅的手背，停住了。\n\n等明日再说吧，她想着，小心翼翼地把自己的毯子垫在地上，让诺雅躺下，盖着她自己的小毯子。\n\n随后她把斗篷取出来盖上，躺在诺雅身边，闭上了眼。\n\n*\n\n清晨的第一缕光从林子东边的树梢透下来时，赫利娅已经做好了出发的准备。\n\n她昨夜少见地睡得不好，醒来有些发昏。她直起身子，诺雅还安静地躺在她旁边睡着，呼吸平稳。赫利娅小心地帮她把滑落的毯角掖好，然后回头收拾行装。\n\n营地中央的篝火已经熄灭了，流民们都还没醒。赫利娅从背包里翻出上次在子爵城出任务的委托书，撕了空白的半页给埃尔顿留了言，说自己往南回子爵城，和队伍汇合之后可能也会北上，有机会再去彼得宁村看他们。\n\n然后赫利娅想了想，又另起一行写了几个杂煮汤的要点。莉娜尔不认字，但可以让埃尔顿念给她听。写完后她把纸对折，压在埃尔顿的包袱下面。\n\n她把剑插在身侧，长弓挂上左肩，再把包背在身上，往营地外走。她小心地避开在另一侧守夜的希斯——这并不太难，再有精神的守夜人这个点也昏昏欲睡了。这是赫利娅刻意挑的时间，她不想流民们起来送她。\n\n走远时她回头看了一眼，营地里静悄悄的，她想起五年前隘口的那个清晨，心里像是压着什么东西。她站了一会，努力把不安感压下去一点，转身迈开脚步。\n\n*\n\n赫利娅沿着商道往南赶，走得很快。她和同伴约的是十天后在城里汇合，护送比她预计的多花了一天，剩下三天时间，即使以她的脚程也有些紧张。更何况她中途要停下来办一件事。\n\n日头一点点爬高，炎阳季的太阳直直地烤着大地，好在商道旁的林荫下还算能走。到正午时，赫利娅在一条小溪边停下来，从背包里取了几块干粮，就着水当午饭。她把干粮袋留在了流民营地，他们比她更需要它。\n\n吃完饭她背靠树坐下，取出那张旧地图又确认了一下路线。继续沿着商道往南，中途在拐往东的岔路前扎营。明天凌晨把那件事做完再出发往子爵城赶，时间应该勉强足够。她的视线又在地图上往北移动了些，看到那个代表彼得宁村的小点。这个时间点埃尔顿他们应该走了一半的路程，说不定已经能看到村里的教堂尖顶了。\n\n赫利娅把地图折起来放回背包，手随着多年的习惯按了一下胸口，却按了个空。\n\n吊坠盒不在。\n\n她心里猛地一沉，想起来昨天她把吊坠盒拿出来给诺雅看，今早起来时脑袋有点昏，走的时候又小心翼翼不想惊动其他人，忘记把它收回来了。难怪她离开时心里不安，总感觉有什么事情忘记了。\n\n赫利娅站起来，水袋的塞子还没拧上，水洒湿了半条裤腿，但她没去管，掉头往北。\n\n她走得比上午往南时更快，几乎是小步快跑。商道上的行人逐渐多了起来，大多是歇过晌的商人和佣兵，到了接近傍晚时分，边境的路标再次进入赫利娅视线。\n\n没有流民群的身影。时间过了大半天，他们应该已经快到彼得宁村了。赫利娅喘了口气，继续顺着商道往北。\n\n她经过路标的时候迎面遇上了两辆运货的马车，她避到路一侧让车通过。马车后面跟着三个赶路人，三人都压着兜帽，脚步极快；走在当中那个肩上扛着一卷裹得严实的行囊，沉甸甸地往下坠。其中一个行人经过时似是抬眼朝她看了一下。赫利娅心里记挂着吊坠盒，脚下没停，擦肩过去，很快将他们落在了身后。\n\n*\n\n天气阴沉了下来，似乎马上就要下雨了。\n\n越过边境后大概一刻时间，商道往东分出去一条小路。这是去彼得宁村最近的路线，但因为路况很差，过往的人不多。路口的泥泞处有些纷乱的脚印和两道马车车辙，赫利娅蹲下检查了一下，是埃尔顿他们，应该是为了在天黑前赶到村子抄了近路。她看着地上的脚印，流民们似乎走得比平日里快些，步伐有些慌乱的影子。\n\n她心里那股莫名的不安又回来了。\n\n赫利娅沿着小路又走了一阵子，空气里忽然传来一股轻微的血腥味。她把剑从鞘里拔出来，伏下身子快步往前。\n\n血腥味越来越浓，转过两棵遮挡视线的大树，赫利娅看到了那辆熟悉的破旧马车。\n\n还有它周围的流民尸体。\n\n昨夜还围着火堆烙饼的那些人，此刻横七竖八躺在地上。他们是从背后被袭击的，位置在队尾的杜拉尔倒在最外侧，胸前有一个狰狞的利器创口，手里还捏着一根已经折了的木棍。\n\n袭击者是人类。赫利娅快走几步靠近马车，空气里的血腥味浓得让她胃里一阵阵翻腾。希斯倒在马车另一侧的位置，腹部被匕首开了个洞。他显然在地上爬了一会才断气，地上拖出一条长长的血痕。顺着血痕往前，是莉娜尔，她弓着背，像是想保护怀里的什么东西。赫利娅轻轻拉开她，小莉诺应该在她怀里——\n\n然后她移开了视线。\n\n西里诺斯死在马车上，他手里紧紧攥着希斯那根木棍，削尖的顶端沾了些许血迹——是袭击者的。这位年迈的教官想把几个孩子护在背后，但袭击者的剑洞穿了他的喉咙，还有孩子们的。\n\n埃尔顿躺在那匹叫萝卜的瘦马旁边，他双手前伸，似乎是想解开马的缰绳。斧头从背后追上了他，几乎把他砍成两段。赫利娅小心地把埃尔顿翻过来，他的眼睛睁着，脸上带着恐惧和不可置信。\n\n赫利娅绕着马车确认了一圈，老人，孩子，男人，女人，没有一个活人。袭击者的手段残忍而高效，几乎都是一击毙命，是职业佣兵的风格。斧、匕首、剑，各司其职，配合得严丝合缝。\n\n她的脚步猛地停下，蹲下重新去看那些伤口。杜拉尔胸口被斧头劈中，两侧的皮肤被烧得发黑起卷。希斯被匕首从侧下方刺中腹部，西里诺斯被一剑贯穿喉咙，精准有效，这些手法她都认得，认得太清楚了。\n\n是克莱门汀他们下的手。\n\n赫利娅感觉一股血冲进自己的脑袋，站起身的一瞬间甚至一个踉跄。\n\n赫利娅并不觉得自己和流民们走得有多近，她替他们守过夜，给孩子分过几碗汤，让一个老教官指点了几招剑术，仅此而已。流民委托的内容是把他们护送到边境，这任务她已经完成了，剩下的事和她一点关系都没有。\n\n可这会儿她站在这片狼藉里，看着过去几天和她说话的，向她微笑的，朝她鞠躬的人毫无生息地躺在地上，胸口有个地方堵得喘不过气。埃尔顿、希斯、莉娜尔、西里诺斯、杜拉尔……\n\n没有诺雅。\n\n赫利娅点了一圈人数，四个老人，四个孩子，十九个人。她又点了一遍。\n\n没有诺雅。她想起傍晚经过边境时擦肩而过的三个佣兵，压着兜帽，中间那个身材高大的肩上扛着一卷裹得严实的行囊。\n\n第一滴雨落了下来，砸在赫利娅的手背上。她转过身，沿着来时的路飞奔而去。\n\n*\n\n雨很快转大，远处还传来隐约的雷声。商道上很多行人躲进了林子，在树冠下面避雨。豆大的雨滴砸在赫利娅脸上，她宛如浑然不知，脚下不停。她在用风元素托轻身体，赶路速度比平时快出了两三倍。她平常很少这么做，持续施法对她的[精神力](#idx-e23)负担很大，但现在她已经顾不上了。\n\n天色逐渐变黑，赫利娅顺着商道继续往南，她不怕错过自己的目标——克莱门汀他们在边境和自己打了照面，清楚杀流民的事马上就会败露，因此肯定会连夜往子爵城赶。而大半夜赶路不可能离开商道，除非他们想在林子里迷路。\n\n追了大概大半个时辰，赫利娅远远地看到了亮光。那是[希塔](#idx-e197)戈点的火，这么大的雨火把点不着，三个人只能靠她的魔法照路。火光裹在雨幕里，忽明忽暗的一团，在严重偏向水元素的环境里维持火球，对希塔戈来说并不轻松。\n\n赫利娅又追近了几步，借着火光已经能看清三人的身影了。那卷行囊被希塔戈扛在肩上。她抹去脸上的雨水，抬手虚拢，手指在空中划出复杂的图形，精神力抽调而出，编织[术式](#idx-e38)。周围的雨丝一凝，卷成水柱，水柱又绞成龙卷，席卷而去把克莱门汀三人围住。希塔戈的骂声从水龙卷里传出来，火光抖了抖，灭了。\n\n当希塔戈手忙脚乱地再次把火球点起来的时候，赫利娅已经站在了三人身前，隔了只有几步远。\n\n“妈的。”这是鲁默尔见到她的第一句话。\n\n“……梵诺尔？”希塔戈的声音迟疑了一下，然后立刻转成她一贯的粗鲁，“你疯了？用这种等级的魔法，到时候教会那帮神棍查起来怎么办？”\n\n赫利娅没理她，径直看向她肩上的行囊，希塔戈不自然地把它放下。\n\n“把它打开。”\n\n“我不懂你什么意思——”\n\n“把它打开。”赫利娅直接把剑拔了出来，剑锋对着三人。\n\n“梵诺尔，你先听我们说，”克莱门汀向前一步面对着赫利娅，掌心朝外，是个谈话的姿势，“希塔戈，把它打开。”\n\n希塔戈悻悻地把行囊解开，是诺雅。她嘴被塞住了，眼睛也被一块黑布蒙着，手脚被粗绳捆住，但看上去没什么大碍。赫利娅的剑往下垂了一分。\n\n“梵诺尔，这事实在不赖我们，我们也是被逼的。”克莱门汀趁机开口，语速比往常快得多，“我们回去和子爵——皮里亚复命，说是‘强盗’四散进了林子，难以清理，希望按惯例赔一笔违约金了事，但那老头不肯。”\n\n赫利娅听着她的话，但眼神一直落在诺雅身上。小女孩显然听到三人叫了“梵诺尔”，挣扎的力度变小了些。\n\n“他怕自己雇人的事儿传到上头哪位大人耳朵里，他这子爵也就当到头了。这世道你也知道，贵族擅杀逃奴是要担干系的。”克莱门汀说得有条不紊，像是之前就准备好了这套说辞。“他扣了我们所有的身家，说要么把事情做干净，要么就被当做通匪的下大牢。你说，咱们还能怎么办？”\n\n“——而且，我们也没想到那么巧，”鲁默尔接过话来，“我们花了好几天才重新追到他们的踪迹，结果他们刚好过了边境，你已经走了。我们跟了一段确定你不在才动的手，回程路上正好碰上你在往回赶。我说真的，就这么个半天的机会给我们碰着了，要是我之前在赌场有这个运气——”\n\n“鲁默尔！”克莱门汀喝了鲁默尔一声，让他闭了嘴。\n\n“诺雅。”赫利娅开口，地上的女孩闷闷地呜了一声，“你们为什么把她带走？”\n\n希塔戈瞄了一眼克莱门汀。克莱门汀没接话。\n\n“……梵诺尔，老娘和你说实话吧。”希塔戈开口，“这档子事前前后后快十天，干了一堆脏活，到头来不仅没有进账还要倒贴，老娘实在咽不下这口气。这小姑娘你也见过了，长得挺标致的。城里玛尔达那边正好在收小孩，价格开得很高。卖了她，这一趟亏的能补回来。”\n\n赫利娅沉默了几秒。\n\n“……卖给玛尔达。”她重复。\n\n“对。”希塔戈点头，“说到底，她跟着她爹去了北边又如何？还不是一样的农奴，靠舔贵族老爷的脚底板过活？与其这样，还不如去玛尔达那儿，至少吃得饱穿得暖，客人的赏钱还都是自己的。”\n\n“希塔戈的话糙，但说得在理。”克莱门汀继续说，“梵诺尔你想想，贝伊尔能比[赛兰德](#idx-e475)好到哪里去？这些人与其当一辈子农奴，一辈子在日头底下刨食，还不如让我们一刀解脱来得实在。这小姑娘到了城里，往后吃穿都不用愁，我们呢，挣一点辛苦钱。你看，哪一头都不亏。”\n\n赫利娅静静听完。\n\n“克莱门汀。”她开口。\n\n“嗯。”\n\n“把诺雅放了，然后我们一起回子爵城。”\n\n克莱门汀愣了一下，“……你要干什么？”\n\n“找赛兰德。”\n\n希塔戈在一旁发出了一声嗤笑。\n\n克莱门汀盯着赫利娅看了好几秒，“梵诺尔，他们只是一群农奴而已，死了就死了。你已经按委托把人护送到了边境，后面发生什么都不算犯你的规矩。”\n\n“就是。”鲁默尔又忍不住插嘴，“要我说，梵诺尔当时你还不如不阻止我们。横竖这群人都得死，一开始碰上就动手，所有人都能落个痛快，咱们还能把钱给拿了。绕这么一大圈，还在这白淋雨，图什么？”\n\n克莱门汀这回没出声阻止他。\n\n“梵诺尔怕不是和这群泥腿子待出感情来了，”希塔戈冷笑一声，“之前多少趟买卖你都冷着张脸，多一事不如少一事，怎么这回不干了？你的那套规矩最近多加了一条‘正义使者’还是怎么地？”\n\n“你忘了？她那套规矩里还有‘不能攻击同伴’呢。”鲁默尔慢悠悠地说，“你瞧人家气势汹汹地赶过来，结果不还是得好声好气地和我们说话？”\n\n“把诺雅放了。”赫利娅又说了一遍。\n\n但对面的三个人都没有动，希塔戈甚至瞟了地上的诺雅一眼，\n\n往那边移了一步。\n\n*\n\n赫利娅站在原地，雨水顺着她的额发往下淌。\n\n“……接下来这一诫呢，[圣树](#idx-e214)母亲是这样说的：汝须感恩，授于汝者，汝终须归回。大家平常里，都管这一条叫‘雨露之恩皆偿’……”\n\n是波丽卡的声音，从很多年前飘过来。[希尔文尼亚](#idx-e527)祭典广场的草坪上，母亲把她抱在怀里，一字一句给她讲第三诫。那时的波丽卡神色温柔，一边念，一边抬眼望向广场尽头那株亮着金光的大圣树。而她现在站在夜雨里想起这句诫条，手里握着剑。面前曾经的同伴们冷笑着看着她，希塔戈的脚边躺着一个被布蒙了眼，绳子绑了手脚的孩子，身体在地上微微发抖。\n\n在希尔文诺的日子永远是那么温暖，没有人教过她恨是什么。所以这句诫条也透着暖意，承雨露之恩，结硕果相报，透着大森林的风儿和青草香。\n\n可是，圣树妈妈，她在心里问，问那棵此刻远在千里之外、她已经看不见的圣树——要是有人伤害了你，伤害了你所在乎的人，摧折枝叶，斫断根茎——您会要我怎么做呢？\n\n圣树没有应她，也不可能应。它在千里之外，隔着她这些年走过的山山水水。这条诫是圣树定的，可祂此刻不在这里，这片雨地里，只有她自己。\n\n赫利娅沉默了很久，久得鲁默尔不耐烦地“啧”了一声，久到希塔戈手上的火球又灭了一次，被她重新点上。\n\n“世间万物如根脉交织，授于汝者，汝终须归回。”她终于出声，不高，可在场的几个人都听得清清楚楚。\n\n“真他妈服了，憋了半天，还当要说什么呢。”希塔戈转过头，看向旁边的两人，“又是精灵的那套玩意儿。鲁默尔，来给我帮把手——”\n\n“汝须清算。”\n\n赫利娅的声音平静，但庄严如诵。她抬起剑，剑尖斜上指出，一个希尔文诺剑术的起手式。左脚在前，右脚虚后，重心压在前面，这是西里诺斯教给她的。\n\n“诸恩皆偿——”\n\n话音落在雨里，她的身影已在五步之外。希塔戈还没反应过来发生了什么，赫利娅的剑锋已到她的眼前——\n\n“——诸仇皆灭！”\n\n### 五\n\n赫利娅蹲下身子给诺雅松绑，把她蒙眼的黑布解开。女孩没有立刻睁开眼睛，等她睁开时先是惊得整个身子缩了一下，看见是赫利娅之后才慢慢松下来。\n\n赫利娅脸上、衣服上都溅着血，袍子被雨打湿，沾着污泥和草屑。诺雅转过头，雨地里已经没有别的人站着了。\n\n“……姐姐。”\n\n“我在。”\n\n诺雅的右拳一直攥着，这时一点点松开，摊在她眼前。是那只银吊坠盒。她攥得很紧，手心被盒子上的细纹压出了好几条红印。\n\n“这个，我一直拿着，”诺雅的话一截一截地往外蹦，“爸爸让我带着它跑，绝对不能松手。”\n\n赫利娅把吊坠盒接过来。盒子是热的，还带着诺雅的体温。\n\n女孩断断续续地把发生的事讲给赫利娅听。流民群过了边境没多久就发觉背后有人跟着他们，为了抓紧时间到村子里决定抄小路，但没走出多远克莱门汀三人就追了上来。埃尔顿让诺雅带着吊坠往彼得宁的方向跑，自己留下来想办法。\n\n赫利娅想起男人最后的姿势，双手前伸像是要去解萝卜的缰绳。他自己瘸了腿，爬不上马，他是想放萝卜去追诺雅。\n\n“我拼命地跑，可是他们从后面追了上来。”诺雅嗫嚅，“但我没让他们发现吊坠。”\n\n赫利娅把吊坠盒收进领口，然后把诺雅整个抱进怀里。这个动作她做得不顺——她过去五年没抱过任何人，两条胳膊不知道该使多大力。\n\n“赫利娅姐姐……我的爸爸……还有莉娜尔阿姨他们……”诺雅在她肩窝里把脸埋下去，她感觉到有热的液体打湿了自己的衣襟。\n\n赫利娅没说话，只是稍微紧了紧自己的怀抱。\n\n*\n\n夏天的夜雨来得快去得也快，月亮从云层背后重新露了出来。\n\n赫利娅让诺雅背过身，坐在一截倒木上，自己拔剑在商道边挖了三个浅坑。剑不是用来挖土的，雨水把剑柄泡得直打滑。挖完之后她走到一边，曾经的同伴三人躺在雨地里，脸上表情惊愕，像是没想到赫利娅真的会杀他们。赫利娅把三具尸体一个个放进坑里，希塔戈、鲁默尔、克莱门汀。末了用地上的湿树叶把每张脸的血泥揩了一下。\n\n她站在坑边看了三人最后一眼。这不是她第一次杀人，强盗、流寇、歹徒……任务里她的剑没慢过半分。但这是她第一次对同伴出剑。\n\n赫利娅用剑把土填回去，把三人的武器依次插在坑侧。这是佣兵死于荒野时惯常的埋葬方式，她过去五年里见过不少次，也做过不少次。\n\n做完一切后她把诺雅背起来往北走，没再回头看一眼。\n\n*\n\n两人越过边境，回到那条通往彼得宁的小路上的时候，已经是后半夜了。\n\n路上没有一个行人，空气里的血腥味已经散了一些。赫利娅不想让诺雅见到大人们的惨状，在那两棵拐角的大树前面把女孩放下，叮嘱了她两句不要走动，自己马上回来。诺雅脸上带着泪痕，咬着嘴唇点了点头。\n\n赫利娅把自己的斗篷取出来披在诺雅身上，帮她把领口扣紧。短了一截的斗篷在诺雅身上拖到了脚踝。女孩靠着大树，手不安地搓着衣角。赫利娅摸摸她的头，绕过大树往前再走了一段，回到了流民群遇害的地点。\n\n这回她用了[祷言](#idx-e4)。先引导地元素把被雨水浸透的土地松成沙状，再用马车上的锄头挖了一个大坑，用风元素托起一具具流民的身体往坑里放进去。埃尔顿、西里诺斯、杜拉尔、希斯、莉娜尔……小莉诺躺在莉娜尔身侧，怀里放着她的小木人。流民全部安置完后她数了一下人数。\n\n四个老人，四个孩子，一共十九个人，不多不少。\n\n赫利娅单膝跪下，她不知道[阿布丹提亚](#idx-e452)农奴的葬礼是怎么样的，她没参加过。也许会有当地的司祭主持祈祷仪式，墓前放着朴素的白花，亲人们神色哀痛，人群时不时传出一声抽咽。但这里什么都没有，赫利娅只能按她知道的希尔文诺的方式来默哀。\n\n几分钟后，赫利娅直起身子准备填土。她本来想要继续用祷言，但抬手试了几次术式都溃散在空气里——她从清晨一直在赶路到深夜，还经过了一场战斗，中途反复施法，精神力已经到了极限。她只好改用锄头，但她的体力也有些撑不住了，用力的时候手滑了好几次。\n\n埋葬完流民后她把周围散落的行囊打开检查了一遍，把有用的东西挑出来。大半袋干粮、水袋、两条旧毯子，几件过冬的衣服，一本翻得破破烂烂的识字读本，全部放进一个旧背包里。赫利娅又想了想，又把昨天夜里埃尔顿交给她当酬金的那袋铜币也塞了进去。\n\n她做这一切的时候动作很慢，每放一件东西进背包，心里都过一遍：这个有什么用，顶得了几天，是不是非带不可。空间快装满了，她就用手背去压，确保下面的东西装得最实。做完这个动作后她的手在空中停了一瞬，然后才去拿下一件东西。\n\n打包完背包，赫利娅走到萝卜旁边，把背包挂在它背上。赫利娅不知道萝卜是否意识到了自己的主人们已经不在了，轻轻顺了顺它的鬃毛，萝卜温顺地嘶鸣了一声。赫利娅把从行囊里找到的旧马鞍给萝卜装上，牵着它回去接诺雅。\n\n转过大树的拐角诺雅立刻小步跑了过来，萝卜用头蹭了蹭她的脸。诺雅摸着萝卜的脑袋，眼里又开始有了水。赫利娅轻轻把女孩抱起来，放在马上。\n\n*\n\n赫利娅牵着马沿着小路往北走。诺雅又惊又怕地过了大半天，又被噩耗连番打击，精神早已透支，出发后不久就在马背上睡了过去。赫利娅轻轻拉了拉缰绳，让萝卜的步伐慢一些。\n\n小路出了林子拐了个弯向北，她们来到了一处山崖上——山崖不高，但视野开阔。往北边望去，不远处是一片木质民房，铺在大块的农田里，是彼得宁村。赫利娅侧身把诺雅从马上抱下来，放在山崖边一处避风的草地上。诺雅还披着她的斗篷，赫利娅花了点时间帮她把斗篷角掖好，又看了她的睡脸一会儿。\n\n随即她站起身，向山崖高处走去。拂晓的光开始从东边天空的边缘亮起来，这片土地迎来了新的一天。\n\n[大陆历](#idx-e346)1494年炎阳季二十五日，今天是赫利娅180岁的生日。如果按希尔文诺历法来算，圣树已过三度枯荣。\n\n赫利娅在崖边站定，朝阳在她身后升起，她把它留在背后，正对西北方。\n\n她拔出腰间的剑，那柄她的老师托人转交给她，陪伴她度过五年里每个佣兵任务的长剑，剑刃在晨光里泛着淡淡的青色。她把剑直直地插在土里，没入一半。又从领口取出吊坠盒，挂上剑柄，让刻着叶纹的那一面朝着自己。\n\n她退后两步，看那柄剑。剑立在土里，吊坠盒在柄上轻轻晃了晃，停住了。\n\n她又低头看了看自己，身上的袍子大半还是湿的，前半夜的雨水只干了一半。袖口、裤管，糊着污泥和草汁，也有血——干透的，半干的，她分不清哪一道是克莱门汀他们的，哪一道又是埋葬流民时粘上的。\n\n她伸手把袖口往上拢了拢，又把沾满了草屑的发梢拨到肩后，对着剑缓缓开口。\n\n“赫利娅·梵诺尔·伊格德拉·希尔文诺。”\n\n她念这一串名字念得慢，像是从记忆中慢慢地抽出什么东西。她离开希尔文诺之后，再也没有完整念过这个名字。\n\n“自嫩芽抽出至今，已过三度[圣树枯荣](#idx-e210)。今日在——”\n\n她停住了，把到了嘴边的“圣树”两个字咽了回去。\n\n“今日在此处，”她改口，“我从一枚初生之芽，长成一片完整之叶。”\n\n她在剑前单膝跪下，闭上眼，“诵七诫。”\n\n她开口头一个字出来时喉咙是紧的，念到后头才松开。\n\n“第一诫，言出如根入土。吾须诚实：不可虚言，不可收回。”\n\n这是她人生中第一次把诫条放声念出来。她在希尔文尼亚的时候曾经无数次想象过这个场景。她想象自己穿着雪白的[仪服](#idx-e217)，金绿的长发扎着发带，站在圣树脚下，亲人朋友坐在观礼席。她想象主持仪式是卡约内爷爷，因为他是赫利娅最熟悉的长老。她有时还担忧自己会不会到时候太激动直接哭出来，那就太丢人了。\n\n“第二诫，勿以巨木碾蕨。吾须公正：不得以强凌弱、以长欺幼。”\n\n可她现在独自跪在山崖上。袖口和衣摆的污泥还没干透，身上溅着同伴的血，无辜者的血，或许还有她自己的血。她身边没有亲人朋友，也没有主持的长老。只有一个同样失去一切、被迫离开家乡的孩子。\n\n“第三诫，诸恩皆偿，诸仇皆灭。”她念到这一条时声音轻轻冷下来一截，“吾须清算：授于汝者，汝终须归回。”\n\n这一条原不是这么说的。昨夜雨里，她向并肩走了半年的同伴举起剑，血溅在脸上，刺得她发痛。她不知道圣树会不会认这改过的半句，但她念了。念的时候，她想起赛兰德子爵府前那扇发暗的橡木门。\n\n“第四诫，所诺刻于年轮。吾须守信：风雨不可磨，时日不可废。”\n\n她答应了埃尔顿要把他们安全送到边境，她送到了。她想保护这群流民，她没做到。那时她真以为过了边境就不会再有危险，但没料到赛兰德不肯就此罢手。字上的诺她守住了，但心里的诺她落了空。\n\n“第五诫，一叶不贪朝露。吾须知足：不囤奢靡之物，不溺片刻之欢。”\n\n接流民这趟的酬劳，连本都收不回来。这事克莱门汀提醒过她，她心里一开始也就清楚。但她还是接下了。她把两季里攒的钱全掏出来付了违约金，眼皮都没抬。知足一条她在希尔文诺就守得不费劲，到人间反倒更省心——她所有留恋的事物，都已经丢在了那片大森林里。\n\n“第六诫，光照众木无偏。吾须等视：蕨草与橡树同沐，守门人与族长同语。”\n\n崖下的林子里扑棱棱惊起一只鸟。她想起克莱门汀平淡地说“农奴死了就死了”，像是在说几件穿破了的旧衣服；想起希塔戈像一件货一样把诺雅扛在肩上，惦记着把她卖到玛尔达那儿去；想起子爵府里赛兰德看他们的视线，眼里的睥睨藏在客气后面。诫上写着等视，她在人间见的，向来是另一套量法。\n\n“第七诫，枝叶不忘其本。”念到末一条，她的声音慢了下来，“吾须铭记：心系圣树所在——”\n\n她停住了。\n\n五年前也是停在这里。那时她趴在[风鸟](#idx-e205)背上，脚下的大森林被翅膀下的风一寸寸推着往后退，大圣树的金光越缩越小，最后只剩一盏灯那么大。她在心里念第七诫，下半句却像被风吹散了，怎么也找不回来。\n\n她抬眼，看剑柄上那只吊坠盒，叶纹的一面正冲着她。\n\n“……此身终归于根。”这半句她念得很轻，一个字一个字地补完了。\n\n圣树已经抛弃了她，但她依旧舍不下圣树。她和希尔文诺连的那根线，一头是空的，空了五年。可她还是把这半句，说给了那空着的一头听。\n\n念完七诫后，她在剑前跪着沉默了一会儿。照传统，这时候是[伴礼者](#idx-e203)上前为她戴上花冠的时候，然后台底下的人一齐鼓掌。她想起那个答应做她伴礼者的少年，如今他的面容已经变得模糊不清，仿佛隔着一层薄雾。\n\n赫利娅对着少年的影子怔了一秒，然后把他收进脑海的角落里。她俯下身掐了一把草，简单地编了一个圈，为自己戴在头上。草冠毛糙糙地压着头发，有根草梗翘出来扫着耳朵，她没去管。\n\n“礼成。”她说。\n\n她脚下的山崖沉默不语。\n\n*\n\n赫利娅又在地上跪了一会儿才站起来。\n\n她伸手把剑柄上的吊坠盒取下，重新挂回自己的领口里。然后双手握住剑，从土里拔出来。剑刃带出的泥她用袖口边擦了几下，又用怀里那块布巾仔细擦了一遍剑身，最后把剑收进鞘里。\n\n她转身往诺雅那边走。女孩睡得正沉，斗篷盖在身上，只露出半张脸，和一只揪着领口的小手。赫利娅在她旁边坐下，又帮她掖了掖松开的斗篷角。\n\n她抬起头，太阳正从东方升起来。\n\n新的一天的第一缕阳光，慢慢铺开。它洒在崖下村庄的房顶上，洒在山崖两侧林子的树梢上，洒在裹着深绿斗篷，睡着的小女孩身上，也洒在坐在一边，头上戴着草冠，望着远方沉默的精灵女子身上。\n\n她的视线前方，极远的西北，[希尔文诺大森林](#idx-e528)静静地卧在[冠脊山脉](#idx-e419)之间，沉在地平线之外；而在那片林海更深处，那株她此刻看不见的大圣树，依旧亮着金光。\n\n### 六\n\n赫利娅说到这里停了一会儿，拿起木勺搅动了一下架在火上的汤。\n\n我快速几笔把最后一段写完，抬头看她。我没说话，因为我知道这个故事还没结束。\n\n“那天傍晚我把诺雅送到了彼得宁村。埃尔顿那个远房是给伯爵管账的，所以找起来没有太困难，算是不幸中的万幸。”赫利娅放下勺子，接着说下去，“我把萝卜也留给了她，我用腿赶路习惯了。”\n\n“后来你有去看过她吗？”\n\n“没有。事情了结后，我很快北上往英克菲尔德省的方向去了。”赫利娅回答，对着我眨眨眼，“但实际上我们后来都见过她。”\n\n“‘我们’？”我怔了一下，然后忽然意识到了什么，“诺雅……诺雅·西瑟斯？”\n\n“是的。”赫利娅点点头，“她在彼得宁村跟着长辈记账，后来被贝伊尔伯爵看中，送去[大梅希斯商会](#idx-e315)在[斯拉格丹](#idx-e476)的分部当学徒。她的通用语读写学得非常优秀，算数也好，很快被选调去了首都[维里迪亚](#idx-e480)的总部。十六岁就完成了学徒考核当上了正职。”\n\n我想起三年前在首都见过的那位年轻的书记官。\n\n“她已经成长为非常优秀的年轻人了。聪慧，还有胆识。”我回忆道，“没有她，我们当时未必能脱身。”\n\n“我同意。”\n\n“她的父亲会很欣慰的。埃尔顿·西瑟斯——”\n\n“西瑟斯是埃尔顿那个远房亲戚的姓。”赫利娅调整了一下火堆里的柴，“诺雅后来没用她原来的姓，怕被查出来和过去的逃奴有关系。”\n\n“会被赛兰德找麻烦？”\n\n“这点她倒是不用担心。”赫利娅轻轻耸了耸肩，“我杀了他。”\n\n我顿了顿，没有立刻说话。我实际上已经有了一些预感。\n\n“把诺雅安顿好后，我立刻赶回了子爵城，找了个晚上的时间‘拜访’了一下赛兰德。”赫利娅的语气像是在讲一件事不关己的小事，“他最后的表情很平静，像是早就知道会有这么一天。”\n\n“诸仇皆灭。”我喃喃。\n\n“诸仇皆灭。”赫利娅跟着重复了一遍，然后抬头看了看我的脸，话里带了点揶揄，“怎么，知道自己旅伴连同伴和委托人都杀，害怕了？”\n\n“哪儿有的事。倒不如说是恰恰相反。”我把手稿放回夹板，塞进背包里，没明说是哪种“恰恰相反”。“谢谢你愿意告诉我这些。”\n\n“这些事在我心里也放了很久，能有机会说出来，感觉比我想的要好。”赫利娅把锅从火上拿了下来，拿起勺子盛汤，“尝尝看，我猜你对它的味道很好奇。”\n\n“那我就不客气了。”我双手接过木碗，乳白色的汤面上浮着切细的菌丝和绿色碎叶。轻轻尝了一下，蘑菇和肉类的鲜味融合得恰到好处，我又忍不住喝了几口。\n\n“如何？”赫利娅手托着腮，笑着看我。\n\n“好喝。一份值得传承下去的手艺。”我认真地说。\n\n“我能做的还不是最好的版本，毕竟是我自己琢磨出来的。”赫利娅给自己舀了一勺汤，“等我们到了希尔文尼亚，你一定要尝尝我妈妈的杂煮汤——”\n\n她停下了话头，表情明显暗了下去。\n\n“你的父母会没事的。”我知道这么说很苍白，但还是开了口，“[万叶庭](#idx-e213)选举在炎阳末，我们还有时间。”\n\n“……嗯。”赫利娅低下头，默默地把汤一口口地送进嘴里。\n\n我转头看向北方，山谷间的路还有最后一段。我们很快就要穿过冠脊山脉了。山脉背后便是希尔文诺大森林，赫利娅阔别十八年的故乡，她把自己的一部分连同童年一起留在了那里。\n\n“赫利娅。”我忽然开口。\n\n“嗯？”\n\n“等希尔文诺的事情解决，你愿意来艾瑟瑞姆看看吗？”我转头看向她。\n\n赫利娅愣愣地看了我几秒。\n\n“好啊。”然后她点点头，微笑，“你是我的雇主，旅行的目的地你来定，三年来不都是这样么。”\n\n“那就这么说定了。”我略带刻意地一拍手，然后把碗里的汤喝完，“早点休息吧，明天我们就到希尔文诺了。”\n\n“今天我来守上半夜吧。”赫利娅从我手中接过空碗，一边说，“这阵子我意外地睡得还不错。倒是你，看上去一直很疲惫的样子。”\n\n“大概是因为晚上花了太多时间写字了。”这句话半真半假。我每天晚上确实在校对前阵子积攒下来的手稿，但更多的时间花在了用[星术](#idx-e7)为赫利娅安神和冥想补充[玛娜](#idx-e26)上。\n\n“你注意休息。”赫利娅应该没有看出端倪，听完我的话只是点点头，然后走向篝火另一边。\n\n我看着她的背影，脑[海里](#idx-e380)想起我们离开维里迪亚时发生的事。\n\n那时赫利娅为了要去[佣兵工会](#idx-e342)了结委托先走了一步。街道上，年轻的书记官向我深深地鞠了一躬。\n\n“麻烦您多照顾赫利娅姐姐，”诺雅的头压得很低，“她一直一个人……真的很辛苦。”\n\n那时我没有理解这句话，只是把她扶了起来，没回答。\n\n三年的时光过去，在这条通往大森林的山路上，这句话再次回响在我耳边。\n\n“我会的。”我对着记忆里的身影回答。\n\n“你说什么？”赫利娅看我。\n\n“没什么。”我躺在毯子上，对她露出一个笑容。“晚安，赫利娅。”\n\n“晚安。”\n\n**塞勒内斯 于大陆历1507年二（清和）季49日 冠脊西脉某处**\n\n**Selenus 1507.II.49 In Crownridge Western Range**\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$2\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"min-h-[60vh] flex items-center justify-center text-[var(--ink-muted)]\",\"children\":\"加载中…\"}],\"children\":[\"$\",\"$L10\",null,{\"bookSlug\":\"compendium\",\"toc\":[{\"slug\":\"作者序\",\"title\":\"炉边随记（代作者序）\",\"titleEn\":\"Preface\",\"isArticle\":true},{\"slug\":\"年表与大事记 Chronology\",\"title\":\"年表与大事记\",\"titleEn\":\"Chronology\",\"isArticle\":true},{\"slug\":\"度量与岁时 Measures and Times\",\"title\":\"度量与岁时\",\"titleEn\":\"Measures and Times\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview\",\"title\":\"大陆总览 Overview\",\"children\":[{\"slug\":\"大陆总览 Overview/地理\",\"title\":\"地理概述\",\"titleEn\":\"The Geography\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/魔法\",\"title\":\"魔法概述\",\"titleEn\":\"The Magic\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/经济\",\"title\":\"经济概述\",\"titleEn\":\"The Economy\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/宗教\",\"title\":\"宗教概述\",\"titleEn\":\"The Religions\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/政治\",\"title\":\"政治概述\",\"titleEn\":\"The Politics\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/文化\",\"title\":\"文化概述\",\"titleEn\":\"The Culture\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"诸国列志 Chorography of the Nations\",\"title\":\"诸国列志 Chorography of the Nations\",\"children\":[{\"slug\":\"诸国列志 Chorography of the Nations/阿布丹提亚\",\"title\":\"阿布丹提亚帝国\",\"titleEn\":\"The Abundantia Empire\",\"isArticle\":true},{\"slug\":\"诸国列志 Chorography of the Nations/索拉瑞斯\",\"title\":\"索拉瑞斯帝国\",\"titleEn\":\"Imperium Solaris\",\"isArticle\":true},{\"slug\":\"诸国列志 Chorography of the Nati "slug\":\"诸域纪闻 Chronicles of the Realms/在人间·下\",\"title\":\"在人间·下\",\"titleEn\":\"Coming of Age·In the Human World II\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/送别\",\"title\":\"送别\",\"titleEn\":\"The Farewell\",\"isArticle\":true},{\"slug\":\"诸域纪闻 Chronicles of the Realms/铸币的两面\",\"title\":\"铸币的两面\",\"titleEn\":\"Two Sides of a Nicat\",\"isArticle\":true}],\"isArticle\":false},{\"slug\":\"索引 Index\",\"title\":\"索引\",\"titleEn\":\"Index\",\"isArticle\":true}],\"currentSlug\":\"诸域纪闻 Chronicles of the Realms/在人间·下\",\"article\":{\"slug\":\"诸域纪闻 Chronicles of the Realms/在人间·下\",\"title\":\"在人间·下\",\"titleEn\":\"Coming of Age·In the Human World II\",\"content\":\"$11\",\"indexTerms\":[{\"id\":\"e2\",\"title\":\"秘术式\",\"aliases\":[],\"body\":\"[尼希尔秘术](#idx-e3)施法所用的特殊仪式，将祭品[构成元素](#idx-e18)解离为[无属性元素流](#idx-e42)并转化为魔法。\"},{\"id\":\"e3\",\"title\":\"尼希尔秘术\",\"aliases\":[\"秘术\"],\"body\":\"[尼希尔](#idx-e517)统治阶级独有的魔法体系，简称秘术，以等价交换为原理，解离祭品的[构成元素](#idx-e18)为力量。\"},{\"id\":\"e4\",\"title\":\"神启祷言\",\"aliases\":[\"祷言\",\"神启魔法\"],\"body\":\"[神启学派](#idx-e5)对自身魔法的称呼，简称祷言；亦名神启魔法。\"},{\"id\":\"e5\",\"title\":\"神启学派\",\"aliases\":[],\"body\":\"以[唯一神](#idx-e135)所借权柄使用魔法的学派，编织[术式](#idx-e38)调动环境中游离态的[四大元素](#idx-e39)。\"},{\"id\":\"e6\",\"title\":\"星空学派\",\"aliases\":[],\"body\":\"以[第五元素](#idx-e17)以太的显现与外化解释魔法的学派，[内化](#idx-e30)以太于体内再[显化](#idx-e44)为魔法。\"},{\"id\":\"e7\",\"title\":\"以太星术\",\"aliases\":[\"星术\",\"星空魔法\"],\"body\":\"[星空学派](#idx-e6)对自身魔法的自称，简称星术；亦名星空魔法。狭义专指各类魔法对应的[大星轨](#idx-e16)走势。\"},{\"id\":\"e8\",\"title\":\"自然魔法\",\"aliases\":[\"精灵魔法\",\"圣树魔法\"],\"body\":\"精灵族与生俱来的法术能力，源自与[大圣树](#idx-e214)的契约连接；亦称精灵魔法、圣树魔法。\"},{\"id\":\"e9\",\"title\":\"奥韦纳尔·安柯伦坦\",\"aliases\":[\"安柯伦坦\"],\"body\":\"艾瑟瑞姆[天星师](#idx-e246)，1304年提出智慧生物出生时的[大星轨](#idx-e16)图像决定其[仪式星轨](#idx-e49)特征，且该特征恰合[源星](#idx-e56)五分类，[丝黛兰尔](#idx-e40)的分类法由此成为公认标准。\"},{\"id\":\"e16\",\"title\":\"大星轨\",\"aliases\":[\"天道星轨\"],\"body\":\"[天星五政](#idx-e41)在天球上的轨迹，代表宇宙中[以太](#idx-e17)流的流向；亦称天道星轨。\"},{\"id\":\"e17\",\"title\":\"第五元素\",\"aliases\":[\"以太\"],\"body\":\"构成群星与其间空间（宇宙）的物质，通称以太，永恒不朽；稀薄存在于大地之上，[星空魔法](#idx-e7)师可将其蓄积体内，是星术的能量来源。\"},{\"id\":\"e18\",\"title\":\"构成元素\",\"aliases\":[],\"body\":\"构成实体事物的四大[自然元素](#idx-e39)，不响应[祷言](#idx-e4)[术式](#idx-e38)。通过[秘术式](#idx-e2)可将其解离。\"},{\"id\":\"e23\",\"title\":\"精神力\",\"aliases\":[],\"body\":\"编织[祷言](#idx-e4)[术式](#idx-e38)所凭的能力，可经后天训练提高，只能依靠时间缓慢恢复。\"},{\"id\":\"e25\",\"title\":\"洛林阶运\",\"aliases\":[],\"body\":\"特定工艺的[星轨蚀刻](#idx-e76)（如旧式三分耦式蚀刻法）所致的[玛娜](#idx-e26)自然向外部流出的矿界面层现象。\"},{\"id\":\"e26\",\"title\":\"玛娜\",\"aliases\":[\"魔力\"],\"body\":\"[星空学派](#idx-e6)语境下[内化](#idx-e30)后的[以太](#idx-e17)，即俗称的魔力；释放后无法自然恢复，须[星术](#idx-e7)师冥想缓慢补充。\"},{\"id\":\"e29\",\"title\":\"魔元素动力学\",\"aliases\":[],\"body\":\"[神启学派](#idx-e5)中研究元素流动与[疏化](#idx-e37)机理的学科，由[神启魔法](#idx-e4)学者菲略奥斯等人奠基。\"},{\"id\":\"e30\",\"title\":\"内化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师于修习中将环境自由[以太](#idx-e17)汇入体内[仪式星轨](#idx-e49)的过程。\"},{\"id\":\"e36\",\"title\":\"施法者\",\"aliases\":[],\"body\":\"能够主动运用魔法的人口的统称，全大陆约占两成。\"},{\"id\":\"e37\",\"title\":\"疏化\",\"aliases\":[],\"body\":\"同一空间内反复施用[神启魔法](#idx-e4)后[自然元素](#idx-e39)恢复速率异常下降的现象，由神启魔法学者菲略奥斯提出。\"},{\"id\":\"e38\",\"title\":\"术式\",\"aliases\":[],\"body\":\"[神启魔法](#idx-e4)师以[精神力](#idx-e23)编织、临时改写自然法则的结构，是与[唯一神](#idx-e135)所立的单向契约。\"},{\"id\":\"e39\",\"title\":\"四大元素\",\"aliases\":[\"自然元素\"],\"body\":\"构成世界万物和游离在自然环境中的地、水、火、风元素，也称自然元素；唯游离态者可为[神启魔法](#idx-e4)调用。\"},{\"id\":\"e40\",\"title\":\"塔莉拉·丝黛兰尔\",\"aliases\":[\"丝黛兰尔\"],\"body\":\"[星空学派](#idx-e6)魔法先驱，著《[星术](#idx-e7)源流考》，首创以五颗天星对应五类魔法的[源星](#idx-e56)分类法，源星之名即出于此。\"},{\"id\":\"e41\",\"title\":\"天星五政\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)最重要的概念之一，指[冠阳](#idx-e532)、[汐月](#idx-e544)、[仲裁星](#idx-e549)、[烬铸星](#idx-e533)、[织虹星](#idx-e548)五颗天体。\"},{\"id\":\"e42\",\"title\":\"无属性元素流\",\"aliases\":[],\"body\":\"[秘术式](#idx-e2)解离祭品[构成元素](#idx-e18)后所得的能量形态，其性质仍是大陆魔法学界研究的未解课题。\"},{\"id\":\"e44\",\"title\":\"显化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师控制体内[以太](#idx-e17)流运转特定[大星轨](#idx-e16)、将[玛娜](#idx-e26)转为有色状态并外放的过程。\"},{\"id\":\"e48\",\"title\":\"血契\",\"aliases\":[],\"body\":\"人类与巨龙缔结的契约，双方精神世界互相开放，可转移龙族[术式](#idx-e38)的[精神力](#idx-e23)消耗。\"},{\"id\":\"e49\",\"title\":\"仪式星轨\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师于体内仿照[大星轨](#idx-e16)建立的[以太](#idx-e17)[回路](#idx-e75)，各部位对应一天宫。\"},{\"id\":\"e52\",\"title\":\"元素丰地\",\"aliases\":[],\"body\":\"游离态[四大元素](#idx-e39)丰度明显高于大陆平均的天然区域，对[疏化](#idx-e37)有强韧抵抗力。\"},{\"id\":\"e56\",\"title\":\"源星\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师[丝黛兰尔](#idx-e40)在《星术源流考》中提出的星术五分类，对应[天星五政](#idx-e41)。\"},{\"id\":\"e61\",\"title\":\"动力炉\",\"aliases\":[],\"body\":\"大型[星术设备](#idx-e85)的供能核心，见于[魔偶](#idx-e83)、[巨像](#idx-e81)与[星术驿车](#idx-e87)等。\"},{\"id\":\"e65\",\"title\":\"高品级魔矿\",\"aliases\":[],\"body\":\"元素储存率极高、可承受各种魔法加工工艺的[魔矿](#idx-e71)，八成以上产自沙阿万。\"},{\"id\":\"e69\",\"title\":\"洛林星元\",\"aliases\":[\"星元\"],\"body\":\"粗加工[魔矿](#idx-e71)晶体经[星轨蚀刻](#idx-e76)、注入[玛娜](#idx-e26)封装的[星术制品](#idx-e88)，通称星元，取名于洛林法蚀刻，可为小型[星术设备](#idx-e85)供能。\"},{\"id\":\"e71\",\"title\":\"魔法矿石\",\"aliases\":[\"魔矿\"],\"body\":\"对五大元素均具极高流通率与储存率的天然矿石，通称魔矿，是大陆最重要的战略资源。\"},{\"id\":\"e73\",\"title\":\"蚀刻魔矿\",\"aliases\":[],\"body\":\"经[星轨蚀刻](#idx-e76)的[魔矿](#idx-e71)，可按[回路](#idx-e75)结构储存[玛娜](#idx-e26)，并在触发时释放对应[星术](#idx-e7)。\"},{\"id\":\"e74\",\"title\":\"托兰瓦尔·洛林\",\"aliases\":[\"洛林\"],\"body\":\"艾瑟瑞姆[天星师](#idx-e246)，1125年首报可流通储存[以太](#idx-e17)的矿石并据以发明[星轨蚀刻](#idx-e76)；洛林法蚀刻为纪念其贡献而名，[洛林星元](#idx-e69)、[洛林阶运](#idx-e25)之名亦由此而来。\"},{\"id\":\"e75\",\"title\":\"星轨回路\",\"aliases\":[\"回路\"],\"body\":\"通过[蚀刻](#idx-e76)在[魔矿](#idx-e71)上建立的模仿[仪式星轨](#idx-e49)的通路，允许魔矿储存[玛娜](#idx-e26)，并在特定条件触发下释放对应[星术](#idx-e7)。\"},{\"id\":\"e76\",\"title\":\"星轨回路蚀刻\",\"aliases\":[\"蚀刻\",\"星轨蚀刻\",\"洛林法蚀刻\"],\"body\":\"于[魔矿](#idx-e71)表面蚀刻[仪式星轨](#idx-e49)[回路](#idx-e75)的技术，简称星轨蚀刻或蚀刻，为纪念发明人，又名洛林法蚀刻。1125年由艾瑟瑞姆[星术](#idx-e7)学者[托兰瓦尔·洛林](#idx-e74)发明，构成了[星术设备](#idx-e85)的基石。\"},{\"id\":\"e81\",\"title\":\"星术巨像\",\"aliases\":[\"巨像\"],\"body\":\"[星术](#idx-e7)兵种的大型作战单位，通称巨像，由专精操作的星术师远距控制。\"},{\"id\":\"e83\",\"title\":\"星术魔偶\",\"aliases\":[\"魔偶\"],\"body\":\"以[蚀刻](#idx-e76)[回路](#idx-e75)驱动的小型[星术](#idx-e7)作战或劳作单位，通称魔偶，有农用魔偶、清扫魔偶等。\"},{\"id\":\"e85\",\"title\":\"星术设备\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e73)制成的各类器物的统称，自家用台灯至战场[巨像](#idx-e81)[动力炉](#idx-e61)，是艾瑟瑞姆高技术社会立国的物质基础。\"},{\"id\":\"e87\",\"title\":\"星术驿车\",\"aliases\":[],\"body\":\"以[动力炉](#idx-e61)驱动的陆上载具，行于艾瑟瑞姆城市内或城际道路。\"},{\"id\":\"e88\",\"title\":\"星术制品\",\"aliases\":[],\"body\":\"[星术设备](#idx-e85)所需半成品作为贸易品的称呼，[洛林星元](#idx-e69)为其典型代表。\"},{\"id\":\"e99\",\"title\":\"朝圣\",\"aliases\":[],\"body\":\"[正教](#idx-e146)信众沿既定路线前往[圣城索菲亚](#idx-e487)的虔修，是[圣领](#idx-e483)可观的收入来源。\"},{\"id\":\"e100\",\"title\":\"称义\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒持守信仰、按神的教诲生活而得免[宿债](#idx-e131)的全过程，自[洗礼](#idx-e136)始，至临终而成。\"},{\"id\":\"e104\",\"title\":\"大祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)学徒正式受任为神职的[圣事](#idx-e121)。\"},{\"id\":\"e106\",\"title\":\"告解\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒为自身罪行请求赦免的[圣事](#idx-e121)，可反复进行。\"},{\"id\":\"e107\",\"title\":\"公教\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰两大教派之一，1295年[教会大分裂](#idx-e160)后自[阿布丹提亚](#idx-e452)境内的[正教会](#idx-e181)独立而成，以[公教会](#idx-e155)为组织载体，是阿布丹提亚人口的第一大信仰。将[星空魔法](#idx-e7)一并纳入唯一神权柄、另尊保罗为第二先知；主张轻罪可凭虔信与[圣事](#idx-e121)自赦，审判之权唯神独有，故不设[审判庭](#idx-e171)建制并废除[诺万尼斯流放](#idx-e167)，对个人虔修的要求高于[正教](#idx-e146)；[季首弥撒](#idx-e109)与节庆均依[通用历](#idx-e368)。\"},{\"id\":\"e109\",\"title\":\"季首弥撒\",\"aliases\":[],\"body\":\"[正教](#idx-e146)于[仪式历](#idx-e361)各季首日，[公教](#idx-e107)于[通用历](#idx-e368)各季首日举行的规模略大于每周[弥撒](#idx-e113)的集体仪式。\"},{\"id\":\"e110\",\"title\":\"坚振\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中，标志[称义](#idx-e100)大体完成的[圣事](#idx-e121)，一生一次，须对教会有重大贡献或持守信仰足够长久。\"},{\"id\":\"e112\",\"title\":\"礼仪年\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中六季[弥撒](#idx-e113)与九大节庆构成的一整年宗教循环。\"},{\"id\":\"e113\",\"title\":\"弥撒\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)礼拜日举行的集体仪式，与每日的[日课](#idx-e117)同为[称义](#idx-e100)最重要的日常载体。\"},{\"id\":\"e114\",\"title\":\"冥界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，信徒死后安息、静候轮回之地。\"},{\"id\":\"e117\",\"title\":\"日课\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒每日的功课，与礼拜日[弥撒](#idx-e113)同为[称义](#idx-e100)的日常载体。\"},{\"id\":\"e119\",\"title\":\"圣保罗\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，最初的医者，司治愈与修复；对应[织虹星](#idx-e548)与[虹曜日](#idx-e348)。[公教](#idx-e107)另尊其为第二先知。\"},{\"id\":\"e120\",\"title\":\"圣骸\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下的圣徒遗骨，为[朝圣](#idx-e99)与教堂声望所系，如[潘克拉托](#idx-e485)大教堂所藏的[圣约翰](#idx-e123)圣骸。\"},{\"id\":\"e121\",\"title\":\"圣事\",\"aliases\":[],\"body\":\"指[正教](#idx-e146)与[公教](#idx-e107)六项圣事：[洗礼](#idx-e136)、[坚振](#idx-e110)、婚姻、[告解](#idx-e106)、[大祝职](#idx-e104)、[小祝职](#idx-e138)。\"},{\"id\":\"e122\",\"title\":\"圣伊琳娜\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，司秩序与契约；对应[仲裁星](#idx-e549)与[裁曜日](#idx-e345)，[圣领](#idx-e483)[伊琳娜圣银币](#idx-e341)以其得名。\"},{\"id\":\"e123\",\"title\":\"圣约翰\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之首，[正教](#idx-e146)唯一的先知与弥赛亚，司精神与教导；对应[汐月](#idx-e544)与[月曜日](#idx-e376)。\"},{\"id\":\"e124\",\"title\":\"圣约瑟\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，商会之圣，司转化、破坏与锻造；对应[烬铸星](#idx-e533)与[烬曜日](#idx-e351)，[圣约瑟商会](#idx-e335)以其得名。\"},{\"id\":\"e126\",\"title\":\"使徒\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e132)》记载中，随[唯一神](#idx-e135)降世传教的最初四人：约翰、伊琳娜、约瑟、保罗。\"},{\"id\":\"e127\",\"title\":\"十字架\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教会](#idx-e155)共用的宗教象征符号。正教十字架为四端，象征四元素权柄。[公教](#idx-e107)下端另加一横，四横端象征四元素，竖端象征[星术](#idx-e7)。\"},{\"id\":\"e130\",\"title\":\"四界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰神学的宇宙构成：[天界](#idx-e133)、[现界](#idx-e137)、[冥界](#idx-e114)、[虚界](#idx-e141)。\"},{\"id\":\"e131\",\"title\":\"宿债\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰神学中，人一出生便背负的亏欠。缘于唯一神所借予而非赐予的权柄，受惠者无人能置身账外。\"},{\"id\":\"e132\",\"title\":\"索菲亚圣典\",\"aliases\":[\"圣典\"],\"body\":\"[唯一神](#idx-e135)信仰的最高典籍，通称《圣典》，分《创世录》《弥赛亚记》《神言书》《箴言集》四福音与《预言书》。\"},{\"id\":\"e133\",\"title\":\"天界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，唯一神、圣徒与天使的居所。\"},{\"id\":\"e135\",\"title\":\"唯一神\",\"aliases\":[\"主\",\"神\",\"上帝\"],\"body\":\"唯一神信仰所奉的至高神，信徒亦称主、神或上帝，是宇宙的创造者、维系者与监督者，也是世间一切魔法力量的源头。\"},{\"id\":\"e136\",\"title\":\"洗礼\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒入教与[称义](#idx-e100)之始的[圣事](#idx-e121)，一生一次，象征认清并领受自身的[宿债](#idx-e131)。\"},{\"id\":\"e137\",\"title\":\"现界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中[四界](#idx-e130)之一，人类生息的世界。\"},{\"id\":\"e138\",\"title\":\"小祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)神职人员卸任、复为寻常信徒之礼，多见于年老体弱者。\"},{\"id\":\"e141\",\"title\":\"虚界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，天球与大地之外仍为虚所充满的空间，罪人与非正信者死后的去处。\"},{\"id\":\"e143\",\"title\":\"异端\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下，秉持不同教义解释相异的教派；就[正教](#idx-e146)而言[公教](#idx-e107)即当代最大异端。\"},{\"id\":\"e146\",\"title\":\"正教\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰两大教派之一，以[正教会](#idx-e181)为组织载体，为[索拉瑞斯](#idx-e429)与[忒奥西斯](#idx-e483)的国教。认[神启祷言](#idx-e4)为唯一神所授的权柄，[星空魔法](#idx-e7)则不在神权之列；一切罪无论大小均须经[告解](#idx-e106)方得赦免，并以神在[现界](#idx-e137)的代行者自任，设[审判庭](#idx-e171)严管神启魔法、以[诺万尼斯流放](#idx-e167)向神赎罪。历法与[礼仪年](#idx-e112)循环依[圣格里仪式历](#idx-e361)。\"},{\"id\":\"e147\",\"title\":\"传信厅\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)[牧首厅](#idx-e166)六分厅之一，分管外交。\"},{\"id\":\"e148\",\"title\":\"大牧首\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)最高元首、[忒奥西斯](#idx-e483)圣领国家元首，由[枢机主教团](#idx-e174)闭门选出，终身任期。\"},{\"id\":\"e149\",\"title\":\"大审判长\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)最高长官，由[枢机主教团](#idx-e174)任命，与[大牧首](#idx-e148)同为终身任期。\"},{\"id\":\"e150\",\"title\":\"第二次宗教改革\",\"aliases\":[],\"body\":\"十三世纪末谋求将[星术](#idx-e7)纳入神权的改革，失败后直接导致[教会大分裂](#idx-e160)。\"},{\"id\":\"e152\",\"title\":\"都主教\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)[都主教区](#idx-e153)长官，教阶在主教之上；与[大牧首](#idx-e148)同不得婚娶，别称[门徒](#idx-e165)。\"},{\"id\":\"e153\",\"title\":\"都主教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)最高一级行政区划和宗教管理区划，全境共五个，长官称[都主教](#idx-e152)。[卡帕尼](#idx-e502)和[索拉瑞斯](#idx-e429)亦设有都主教区，但不具备行政职能。\"},{\"id\":\"e154\",\"title\":\"督审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)教阶之一，位在[审判官](#idx-e169)之上；[审判所](#idx-e162)驻任长官、[审判分庭](#idx-e168)官员。[诺万尼斯流放](#idx-e167)须由审判分庭所属督审判官主刑。\"},{\"id\":\"e155\",\"title\":\"公教会\",\"aliases\":[],\"body\":\"1295年[阿布丹提亚](#idx-e452)境内[正教会](#idx-e181)独立所成立的教会，领袖称[宗主教](#idx-e183)，驻[波马里亚](#idx-e459)。\"},{\"id\":\"e157\",\"title\":\"公教总会\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)中枢，驻[阿布丹提亚帝国](#idx-e452)城市[波马里亚](#idx-e459)。\"},{\"id\":\"e160\",\"title\":\"教会大分裂\",\"aliases\":[],\"body\":\"1295年[第二次宗教改革](#idx-e150)失败后，[阿布丹提亚帝国](#idx-e452)境内[正教会](#idx-e181)宣布脱离[牧首厅](#idx-e166)独立，成立[公教会](#idx-e155)。\"},{\"id\":\"e161\",\"title\":\"教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)[都主教区](#idx-e153)下辖的最小一级行政区划，长官称主教。也是[正教会](#idx-e181)在大陆各国所划的宗教事务上的最小管理层级。\"},{\"id\":\"e162\",\"title\":\"教区审判所\",\"aliases\":[\"审判所\"],\"body\":\"[审判庭](#idx-e171)在[教区](#idx-e161)一级所设的分支机构，简称审判所，由[督审判官](#idx-e154)驻任长官。\"},{\"id\":\"e165\",\"title\":\"门徒\",\"aliases\":[],\"body\":\"教会系统中[都主教](#idx-e152)及以上神职，以及[审判庭](#idx-e171)系统中自[督审判官](#idx-e154)及以上职位的别称，象征舍弃现世之乐、专心侍神；门徒不得婚娶。\"},{\"id\":\"e166\",\"title\":\"牧首厅\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)中枢以及[圣领](#idx-e483)最高行政机构，下设[圣礼厅](#idx-e173)、[省察厅](#idx-e179)、[司牧厅](#idx-e177)、[神启厅](#idx-e172)、[传信厅](#idx-e147)、[卫教厅](#idx-e178)六分厅。\"},{\"id\":\"e167\",\"title\":\"诺万尼斯流放\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[索拉瑞斯帝国](#idx-e429)维持的一种极刑，将受刑者留置诺万尼斯区域枯竭死地直至器官衰竭。\"},{\"id\":\"e168\",\"title\":\"审判分庭\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)在[都主教区](#idx-e153)一级的机构，长官称审判长，由[大审判长](#idx-e149)直接任命。\"},{\"id\":\"e169\",\"title\":\"审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)教阶之一，负责日常调查和执行事务，是[圣领](#idx-e483)独立于军事系统的强制执行编制。\"},{\"id\":\"e171\",\"title\":\"审判庭\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)直属司法和执行机构，处理[异端](#idx-e143)事务、追查未经许可的神启施法，拥有独立执法和行刑权。\"},{\"id\":\"e172\",\"title\":\"神启厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管[神启魔法](#idx-e4)事务。\"},{\"id\":\"e173\",\"title\":\"圣礼厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管宗教事务，亦负责[索拉瑞斯](#idx-e429)[凯撒](#idx-e234)的[血脉测试](#idx-e253)。\"},{\"id\":\"e174\",\"title\":\"枢机主教团\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)事实上的最高权力机构，[大牧首](#idx-e148)去世后负责闭门选出继任者。成员由大牧首自[都主教](#idx-e152)中选任。\"},{\"id\":\"e176\",\"title\":\"司祭\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)教阶之一，分管各城镇乡村的基层教会，往往本人即[神启魔法](#idx-e4)师。\"},{\"id\":\"e177\",\"title\":\"司牧厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管民生。\"},{\"id\":\"e178\",\"title\":\"卫教厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管军事，战时统一征召[护教军](#idx-e289)。\"},{\"id\":\"e179\",\"title\":\"省察厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管监察。\"},{\"id\":\"e181\",\"title\":\"正教会\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰最大教派[正教](#idx-e146)的教会组织，以[忒奥西斯](#idx-e483)圣领[牧首厅](#idx-e166)为教会中枢，同时也是圣领的统治机构。\"},{\"id\":\"e183\",\"title\":\"宗主教\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)领袖，由全大陆[公教](#idx-e107)主教选出三名候选，再由盲眼童贞信徒抽签决定。\"},{\"id\":\"e186\",\"title\":\"大神庙\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)首都[阿尔努尔](#idx-e518)城中的[教长](#idx-e199)驻地，是酋邦的宗教中心与圣地。\"},{\"id\":\"e191\",\"title\":\"玛阿特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中的死后审判仪式，以心脏置于天平称量，砝码为[希塔](#idx-e197)手杖顶端的宝石。\"},{\"id\":\"e197\",\"title\":\"希塔\",\"aliases\":[\"陆之神\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰中六神之一，老者之形，象征万物的终点，司灵魂与审判，看护[至福乐土](#idx-e201)；[玛阿特](#idx-e191)称量由其执行，砝码即其手杖顶端的宝石。\"},{\"id\":\"e199\",\"title\":\"伊玛目教长\",\"aliases\":[\"教长\"],\"body\":\"[尼希尔](#idx-e517)最高元首，简称教长，同时是酋邦的宗教领袖与[酋长会议](#idx-e239)首席。终身制，非世袭，代代以[秘术](#idx-e3)密封诏书委任继承。\"},{\"id\":\"e201\",\"title\":\"至福乐土\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中，[玛阿特](#idx-e191)称量通过者所被允许进入的永恒安乐之地，由[希塔](#idx-e197)看护。\"},{\"id\":\"e202\",\"title\":\"诸神圣土\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)中由[伊玛目教长](#idx-e199)直辖的宗教领地。含首都[阿尔努尔](#idx-e518)及周边耕地城市，由各部按比例出资供养。\"},{\"id\":\"e203\",\"title\":\"伴礼者\",\"aliases\":[],\"body\":\"精灵[成年礼](#idx-e204)上为受礼者戴上花冠的角色，多由至亲、伴侣或挚友担任。\"},{\"id\":\"e204\",\"title\":\"成年礼\",\"aliases\":[],\"body\":\"精灵人生五礼之一，于三度[圣树枯荣](#idx-e210)后举行，含诵七诫、授剑与加冠。\"},{\"id\":\"e205\",\"title\":\"风鸟\",\"aliases\":[],\"body\":\"精灵以塑形魔法召唤的发光大鸟，可载人飞行。\"},{\"id\":\"e210\",\"title\":\"圣树枯荣\",\"aliases\":[],\"body\":\"精灵计时的大周期，一度圣树枯荣为一祭典循环的开始。\"},{\"id\":\"e211\",\"title\":\"氏族\",\"aliases\":[],\"body\":\"精灵族的社会单位，被喻为[大圣树](#idx-e214)的分枝，各有族长与长老，本族领地内高度自治。\"},{\"id\":\"e213\",\"title\":\"万叶庭\",\"aliases\":[],\"body\":\"精灵族最高权力机构，每三十年于[希尔文尼亚](#idx-e527)召开，全体精灵借[圣树魔法](#idx-e8)旁听并投票。\"},{\"id\":\"e214\",\"title\":\"希尔文诺大圣树\",\"aliases\":[\"圣树\",\"大圣树\",\"圣树之母\"],\"body\":\"圣树信仰唯一的神圣对象，通称大圣树或圣树，矗立于[希尔文尼亚](#idx-e527)祭坛广场；凡有描述皆以女性位格出现，精灵称之为圣树之母，[自然魔法](#idx-e8)即祂分享之力。\"},{\"id\":\"e216\",\"title\":\"叶络枢机院\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e524)日常行政与对外事务机构，席位由[万叶庭](#idx-e213)轮选，长老兼承宗教职责。\"},{\"id\":\"e217\",\"title\":\"仪服\",\"aliases\":[],\"body\":\"精灵[成年礼](#idx-e204)所着礼服，颜色依[氏族](#idx-e211)惯例而定。\"},{\"id\":\"e218\",\"title\":\"阿斯塔伦·塔利瑞安\",\"aliases\":[\"塔利瑞安\"],\"body\":\"[星术](#idx-e7)泰斗，1097年联合十二城邦创建[大星术研究院](#idx-e226)，即今[王家研究院](#idx-e249)之前身。\"},{\"id\":\"e219\",\"title\":\"伯爵领\",\"aliases\":[],\"body\":\"艾瑟瑞姆与[阿布丹提亚](#idx-e452)的贵族封地，在艾瑟瑞姆为最高级别的贵族封地，位于子爵领之上；在阿布丹提亚则位于[公爵领](#idx-e230)之下，子爵领之上。\"},{\"id\":\"e226\",\"title\":\"大星术研究院\",\"aliases\":[],\"body\":\"1097年由[塔利瑞安](#idx-e218)联合十二城邦创建，艾瑟瑞姆[王家研究院](#idx-e249)前身，是艾瑟瑞姆国家形态的起点。\"},{\"id\":\"e227\",\"title\":\"地星师\",\"aliases\":[],\"body\":\"艾瑟瑞姆[星术](#idx-e7)学者的头衔之一。星术师于所属研究院研究室完成课题答辩，毕业后被授予的头衔。\"},{\"id\":\"e228\",\"title\":\"帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)的一级行政区划，共五个，与皇室直辖的[维里迪亚直辖省](#idx-e481)并列；省政府为中央[内阁](#idx-e237)的地方分支。原为六省，[卡帕尼](#idx-e502)独立后余五省。\"},{\"id\":\"e230\",\"title\":\"公爵领\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)最高级别的贵族封地，各[帝政省](#idx-e228)含一到两个公爵领。\"},{\"id\":\"e231\",\"title\":\"管理局\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[特贸区](#idx-e505)的立法与行政机构，由区内各商会分部选派代表组成，最高长官称管理局主席。\"},{\"id\":\"e232\",\"title\":\"军团行省\",\"aliases\":[\"行省\"],\"body\":\"[索拉瑞斯](#idx-e429)的一级行政区划，一行省对应一[军团](#idx-e294)，共八个，长官称[行省总督](#idx-e251)。\"},{\"id\":\"e233\",\"title\":\"龙裔继嗣法\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)开国皇帝[阿利昂](#idx-e235)晚年制定的皇位继承法，以直系子嗣的龙血浓度为据，由[牧首厅](#idx-e166)主持[血脉测试](#idx-e253)。\"},{\"id\":\"e234\",\"title\":\"龙裔凯撒\",\"aliases\":[\"凯撒\"],\"body\":\"[索拉瑞斯](#idx-e429)最高统治者的称号，简称凯撒，即位须由[大牧首](#idx-e148)主持册封礼，体现君权神授。\"},{\"id\":\"e235\",\"title\":\"马尔奇安·阿利昂\",\"aliases\":[\"阿利昂\"],\"body\":\"[索拉瑞斯](#idx-e429)开国[凯撒](#idx-e234)，人龙混血，受[大牧首](#idx-e148)册封为首位龙裔凯撒；捐帝国东部领土立[忒奥西斯](#idx-e483)圣领，晚年制定《[龙裔继嗣法](#idx-e233)》。\"},{\"id\":\"e237\",\"title\":\"内阁\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)和[阿布丹提亚帝国](#idx-e452)的中央机构之一。均指直属于王室/皇室的日常行政机构，各有大臣分管外交、军务、内务与王室/皇室财政。\"},{\"id\":\"e239\",\"title\":\"酋长会议\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)最高权力机构，由[教长](#idx-e199)与各部落酋长组成，每年[金素](#idx-e350)季于[阿尔努尔](#idx-e518)召开，协商全酋邦外交、军事与内政事宜。\"},{\"id\":\"e240\",\"title\":\"三柱议会\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)最高立法与财政机构，1393年确立，三柱指皇室、贵族与魔法阶级。\"},{\"id\":\"e244\",\"title\":\"特别仪式区\",\"aliases\":[],\"body\":\"位于艾瑟瑞姆中南部最[大平原](#idx-e453)，专用于王国[星术](#idx-e7)研究与设备制造，行政直属国王/女王。\"},{\"id\":\"e245\",\"title\":\"特区商法典\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[北部特贸区](#idx-e505)适用的独立法系，不同于各公国法系。\"},{\"id\":\"e246\",\"title\":\"天星师\",\"aliases\":[],\"body\":\"[星术](#idx-e7)学者的最高阶头衔与职位，授予学术成果极为杰出的[地星师](#idx-e227)。[托兰瓦尔·洛林](#idx-e74)、[奥韦纳尔·安柯伦坦](#idx-e9)等均曾任天星师。\"},{\"id\":\"e247\",\"title\":\"天星首席\",\"aliases\":[],\"body\":\"艾瑟瑞姆[王家研究院](#idx-e249)最高级别学者之职，永久由艾瑟瑞姆国王或女王兼任。\"},{\"id\":\"e248\",\"title\":\"王冠领地\",\"aliases\":[],\"body\":\"艾瑟瑞姆国王直辖之地，含以首都[阿斯托利亚](#idx-e495)为首的[坠星湖](#idx-e501)南岸城市群。\"},{\"id\":\"e249\",\"title\":\"王家研究院\",\"aliases\":[],\"body\":\"艾瑟瑞姆学术中枢，前身为[大星术研究院](#idx-e226)，兼掌王室继承事务与[特别仪式区](#idx-e244)管理，院长即[天星首席](#idx-e247)，永久由国王或女王兼任。\"},{\"id\":\"e251\",\"title\":\"行省总督\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团行省](#idx-e232)最高长官，由[军团](#idx-e294)长兼任，任期二十年，每年赴首都[索尔因](#idx-e448)叙职。\"},{\"id\":\"e252\",\"title\":\"叙职大会\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八位[行省总督](#idx-e251)每年赴[索尔因](#idx-e448)向[凯撒](#idx-e234)当面汇报施政与军务的会议。\"},{\"id\":\"e253\",\"title\":\"血脉测试\",\"aliases\":[],\"body\":\"《[龙裔继嗣法](#idx-e233)》规定的继承资格测试，由[牧首厅](#idx-e166)[圣礼厅](#idx-e173)主持，每代[凯撒](#idx-e234)继承人均须重测。\"},{\"id\":\"e259\",\"title\":\"仲裁所\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[特贸区](#idx-e505)[管理局](#idx-e231)下属机构，承担特贸区司法职能。\"},{\"id\":\"e263\",\"title\":\"阿索战争\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)与[索拉瑞斯帝国](#idx-e429)之间的三次大规模战争（1290–1292、1351–1356、1479–1483）。\"},{\"id\":\"e264\",\"title\":\"布兰顿和约\",\"aliases\":[],\"body\":\"[第二次阿索战争](#idx-e269)停战和约，以[布兰顿河](#idx-e463)下游为两国新界，[布兰顿](#idx-e462)城割予[索拉瑞斯](#idx-e429)。\"},{\"id\":\"e265\",\"title\":\"布兰顿战役\",\"aliases\":[],\"body\":\"1479年[三战](#idx-e270)前期的一场决定性会战，[阿布丹提亚帝国](#idx-e452)获得战略性胜利。\"},{\"id\":\"e268\",\"title\":\"丹提亚-瑞姆技术协约\",\"aliases\":[\"丹提亚-瑞姆协约\"],\"body\":\"1304年[阿布丹提亚](#idx-e452)与艾瑟瑞姆缔结的长期协约，艾瑟瑞姆输出[星术](#idx-e7)成果与人才，换取阿布丹提亚[魔矿](#idx-e71)与战略资源。\"},{\"id\":\"e269\",\"title\":\"第二次阿索战争\",\"aliases\":[\"二战\"],\"body\":\"于1351–1356年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第二次大规模战争，[忒奥西斯](#idx-e483)保持中立。索拉瑞斯获胜，得[西比尔平原](#idx-e492)南部与[布兰顿](#idx-e462)城，停战于《[布兰顿和约](#idx-e264)》；阿布丹提亚放弃[卡帕尼](#idx-e502)群岛，卡帕尼同年独立。\"},{\"id\":\"e270\",\"title\":\"第三次阿索战争\",\"aliases\":[\"三战\"],\"body\":\"于1479–1483年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第三次大规模战争，阿布丹提亚获胜。停战于《[卡斯特鲁姆和约](#idx-e275)》，索拉瑞斯向阿布丹提亚归还[大运河](#idx-e427)下游东岸两座城市及其周边土地，两国当代边界由此确立。\"},{\"id\":\"e273\",\"title\":\"黑暗时代\",\"aliases\":[],\"body\":\"指八世纪[七王约](#idx-e280)瓦解后，西诺拉尼亚地区长达数百年的多国混战时期。\"},{\"id\":\"e275\",\"title\":\"卡斯特鲁姆和约\",\"aliases\":[],\"body\":\"[第三次阿索战争](#idx-e270)停战和约，确立阿索当代边界；[大运河](#idx-e427)下游东岸两城交接至今悬而未决。\"},{\"id\":\"e276\",\"title\":\"林缘议厅\",\"aliases\":[],\"body\":\"1203年[希尔文诺](#idx-e524)[叶络枢机院](#idx-e216)于[冠脊山脉](#idx-e419)东南脉隘口所设，是当前大陆唯一公认的中立缔约见证机构。\"},{\"id\":\"e280\",\"title\":\"七王约\",\"aliases\":[],\"body\":\"328年西诺拉尼亚七国建立的松散邦联，存续约四个世纪，八世纪中叶瓦解。\"},{\"id\":\"e289\",\"title\":\"护教军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)最主要的常规部队，下分五个师，由各[都主教区](#idx-e153)分别组建。\"},{\"id\":\"e291\",\"title\":\"近卫龙骑兵团\",\"aliases\":[\"龙骑兵团\"],\"body\":\"[索拉瑞斯](#idx-e429)以[飞龙](#idx-e292)为坐骑的精锐常规部队，通称龙骑兵团，直属[凯撒](#idx-e234)，约八万头飞龙、五万人编制，跨地形作战能力冠绝大陆。\"},{\"id\":\"e292\",\"title\":\"巨龙眷属\",\"aliases\":[\"飞龙\"],\"body\":\"巨龙与大型野兽的混血飞行亚种，通称飞龙，寿约五百年，是[龙骑兵团](#idx-e291)的坐骑。\"},{\"id\":\"e294\",\"title\":\"军团\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)最高军事编制，与[行省](#idx-e232)一体，下设团、大队、小队。\"},{\"id\":\"e296\",\"title\":\"龙骑士团\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)的顶级战力，成员皆与巨龙缔结[血契](#idx-e48)，效忠[凯撒](#idx-e234)本人而非帝国，团内以多数决议事。\"},{\"id\":\"e302\",\"title\":\"圣仪军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)直属的精锐法术作战部队，大陆规模最大的法术军力，兼承民间大型工程建设。\"},{\"id\":\"e315\",\"title\":\"大梅希斯商会\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)皇家投资商会，垄断[丹提亚纸](#idx-e316)业约八成贸易量，兼[丹提亚-瑞姆技术协约](#idx-e268)阿方的全权贸易代表。\"},{\"id\":\"e316\",\"title\":\"丹提亚纸\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)以[棉短绒](#idx-e405)制成的高品质纸张，是各国高端纸制品，以及[尼卡特汇票](#idx-e326)最重要的原材料之一。\"},{\"id\":\"e321\",\"title\":\"河金\",\"aliases\":[],\"body\":\"船只通行[索菲亚大运河](#idx-e427)所缴的费用，是[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)的重要常规收入。\"},{\"id\":\"e325\",\"title\":\"卡帕尼银联\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[四大商会](#idx-e336)与众多中小商会银行共组的联合体，发行并管理[尼卡特汇票](#idx-e326)。\"},{\"id\":\"e326\",\"title\":\"卡帕尼银联汇票\",\"aliases\":[\"尼卡特汇票\",\"汇票\"],\"body\":\"[卡帕尼银联](#idx-e325)发行的结算凭证，通称尼卡特汇票或汇票，可在任意卡帕尼银联成员银行兑现，学界视为已具事实货币地位。\"},{\"id\":\"e335\",\"title\":\"圣约瑟商会\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)直属商会，垄断圣领境内外一切贸易，学界普遍认为兼具情报网络职能。\"},{\"id\":\"e336\",\"title\":\"四大商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国各自直属的商会，由四公爵历史上直接出资创立，其主席即公爵本人。\"},{\"id\":\"e338\",\"title\":\"索利亚商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)商会之一，1489年前后由卡涅·道格拉斯创办，以[星术设备](#idx-e85)半成品与[魔矿](#idx-e71)原料分销起家，后跃居联邦前列。\"},{\"id\":\"e341\",\"title\":\"伊琳娜圣银币\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)流通货币，以高含银量铸造并防伪，与[索拉瑞斯](#idx-e429)铁钞按一比一互认流通。\"},{\"id\":\"e342\",\"title\":\"佣兵工会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)、艾瑟瑞姆、[忒奥西斯](#idx-e483)和[阿布丹提亚](#idx-e452)境内设立的中介机构，便于雇主发布委托、佣兵接受与提交委托，同时也兼具管理佣兵群体和提供综合服务的职能。\"},{\"id\":\"e344\",\"title\":\"自由港\",\"aliases\":[],\"body\":\"[特贸区](#idx-e505)所设、享有极高自治权的港口体系，是国际贸易量激增的制度前提。\"},{\"id\":\"e345\",\"title\":\"裁曜日\",\"aliases\":[\"圣伊琳娜日\"],\"body\":\"[通用历](#idx-e368)一周第二日，亦简称星期二；[仪式历](#idx-e361)作圣伊琳娜日，对应天星[仲裁星](#idx-e549)。\"},{\"id\":\"e346\",\"title\":\"大陆历\",\"aliases\":[],\"body\":\"[通用历](#idx-e368)纪年，以[唯一神](#idx-e135)降临传教义于[圣约翰](#idx-e123)之年为元年，元年之前称元前。\"},{\"id\":\"e348\",\"title\":\"虹曜日\",\"aliases\":[\"圣保罗日\"],\"body\":\"[通用历](#idx-e368)一周第四日，亦简称星期四；[仪式历](#idx-e361)作圣保罗日，对应天星[织虹星](#idx-e548)。\"},{\"id\":\"e350\",\"title\":\"金素\",\"aliases\":[\"圣献\",\"冕宫月\",\"肆位\"],\"body\":\"一年六季的第四季，各地作物相继采收。[仪式历](#idx-e361)同季作圣献，艾瑟瑞姆[星历](#idx-e371)作冕宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作肆位。\"},{\"id\":\"e351\",\"title\":\"烬曜日\",\"aliases\":[\"圣约瑟日\"],\"body\":\"[通用历](#idx-e368)一周第三日，亦简称星期三；[仪式历](#idx-e361)作圣约瑟日，对应天星[烬铸星](#idx-e533)。\"},{\"id\":\"e353\",\"title\":\"凛寒\",\"aliases\":[\"正炼\",\"琴宫月\",\"陆位\"],\"body\":\"一年六季的第六季，山地封路、[凛冰洋](#idx-e423)冰封，大陆整体进入年内节律最为收缩的状态。[仪式历](#idx-e361)同季作正炼，艾瑟瑞姆[星历](#idx-e371)作琴宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作陆位。\"},{\"id\":\"e356\",\"title\":\"启蛰\",\"aliases\":[\"晖醒\",\"天宫月\",\"壹位\"],\"body\":\"一年六季的第一季，[通用历](#idx-e368)岁首所在。[凛冰洋](#idx-e423)浮冰退散、山地封雪消融、两河进入汛期，各地贸易与出行随之重新活跃。[仪式历](#idx-e361)同季作晖醒，艾瑟瑞姆[星历](#idx-e371)作天宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作壹位。\"},{\"id\":\"e357\",\"title\":\"清和\",\"aliases\":[\"垂恩\",\"船宫月\",\"贰位\"],\"body\":\"一年六季的第二季，气候达到全年最宜人的状态，远洋航运与陆上商路均进入最活跃的窗口。[仪式历](#idx-e361)同季作垂恩，艾瑟瑞姆[星历](#idx-e371)作船宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作贰位。\"},{\"id\":\"e358\",\"title\":\"日曜日\",\"aliases\":[\"圣神日\"],\"body\":\"[通用历](#idx-e368)一周第五日，亦简称星期日；[仪式历](#idx-e361)作圣神日，对应天星[冠阳](#idx-e532)，是信众向[唯一神](#idx-e135)礼拜的礼拜日。\"},{\"id\":\"e359\",\"title\":\"萨辛历\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)地方历法，以当代伊玛目称号纪年，每代即位则重置元年，六季称[壹位](#idx-e356)至[陆位](#idx-e353)。\"},{\"id\":\"e361\",\"title\":\"圣格里仪式历\",\"aliases\":[\"仪式历\"],\"body\":\"[正教会](#idx-e181)原始历法，[通用历](#idx-e368)前身，[圣领](#idx-e483)与[索拉瑞斯](#idx-e429)的官方历法，六季与五日均保留宗教命名。\"},{\"id\":\"e363\",\"title\":\"升天节\",\"aliases\":[],\"body\":\"纪念[圣约翰](#idx-e123)殉道的[正教](#idx-e146)宗教节日，《约翰福音》载其在[十字架](#idx-e127)上讲道一昼夜后直升[天界](#idx-e133)。\"},{\"id\":\"e368\",\"title\":\"通用历\",\"aliases\":[\"格里历\"],\"body\":\"大陆通行的太阳历，一年六季、每季五十日、每旬十日、每周五日；别称格里历，源自[正教会](#idx-e181)的[圣格里仪式历](#idx-e361)，经[公教会](#idx-e155)世俗化后扩散全大陆。\"},{\"id\":\"e371\",\"title\":\"星历\",\"aliases\":[],\"body\":\"艾瑟瑞姆地方历法，大陆唯一的月亮历，六月之名取自黄道六宫。\"},{\"id\":\"e374\",\"title\":\"炎阳\",\"aliases\":[\"神焰\",\"牧宫月\",\"叁位\"],\"body\":\"一年六季的第三季，[晨风海](#idx-e414)带来充沛降水，东部平原产出攀至顶峰，各国军事行动与大规模物资调动亦多集中于此时。[仪式历](#idx-e361)同季作神焰，艾瑟瑞姆[星历](#idx-e371)作牧宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作叁位。\"},{\"id\":\"e376\",\"title\":\"月曜日\",\"aliases\":[\"圣约翰日\"],\"body\":\"[通用历](#idx-e368)一周第一日，亦简称星期一；[仪式历](#idx-e361)作圣约翰日，对应天星[汐月](#idx-e544)，是四个劳作日之首。\"},{\"id\":\"e378\",\"title\":\"步米\",\"aliases\":[],\"body\":\"长度基本单位，源自[索拉瑞斯](#idx-e429)[军团](#idx-e294)标准行军步伐；一步米等于十分步米等于一百厘步米。\"},{\"id\":\"e380\",\"title\":\"海里\",\"aliases\":[],\"body\":\"海上航程单位，由[大运河](#idx-e427)入海口至[波托马利](#idx-e506)的顺流直线航程三百等分而得，约合三[陆里](#idx-e387)。\"},{\"id\":\"e385\",\"title\":\"界石\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团](#idx-e294)沿主干道每千步所立的里程标记，亦为[陆里](#idx-e387)之所本。\"},{\"id\":\"e387\",\"title\":\"陆里\",\"aliases\":[],\"body\":\"长度单位，一陆里等于一千[步米](#idx-e378)，源自[军团](#idx-e294)沿主干道每千步立一[界石](#idx-e385)的传统。\"},{\"id\":\"e395\",\"title\":\"星度\",\"aliases\":[],\"body\":\"温度基本单位，源自[王家研究院](#idx-e249)的[魔矿](#idx-e71)[蚀刻](#idx-e76)环境控制需求，以纯水冰点为零、沸点为一百。\"},{\"id\":\"e405\",\"title\":\"棉短绒\",\"aliases\":[],\"body\":\"棉花脱棉后的副产物，是[丹提亚纸](#idx-e316)的原料。\"},{\"id\":\"e412\",\"title\":\"神遴者\",\"aliases\":[\"神遴者阶层\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰的[玛阿特](#idx-e191)称量中，心脏与宝石恰成平衡者。宗教解释中，他们身负引导众生的责任，受赐[秘术](#idx-e3)之力转生现世；作为一个阶层，神遴者垄断了酋邦一切政治职位，[教长](#idx-e199)、祭司、部落酋长与长老无一例外皆出于此。\"},{\"id\":\"e413\",\"title\":\"北门湾\",\"aliases\":[],\"body\":\"[凛冰洋](#idx-e423)伸入大陆中部的内湾，位于[忒奥西斯](#idx-e483)北境，是[索菲亚大运河](#idx-e427)的北端入口。[尼希尔](#idx-e517)[魔矿](#idx-e71)经凛冰洋航线抵此南下，是当代大陆最重要跨洋贸易干线上的节点；[运河仪所](#idx-e493)即设于湾口。\"},{\"id\":\"e414\",\"title\":\"晨风海\",\"aliases\":[],\"body\":\"大陆东南方海域，洋流自东往西、往北持续输送暖湿气流深入内陆，是[阿布丹提亚大平原](#idx-e453)优良农业气候的关键成因。[马提尼河](#idx-e471)与[波特利亚河](#idx-e461)汇流后注入此海。\"},{\"id\":\"e415\",\"title\":\"大星洋\",\"aliases\":[],\"body\":\"大陆西侧海域，洋流复杂多变，深远洋几无成规模的远洋航行；较活跃者唯[索拉瑞斯](#idx-e429)西海岸的近海航线，串联[镜心湖](#idx-e436)产区与西南偏远[行省](#idx-e232)。其偏暖洋流携湿润气流北上，遇[裂境山脉](#idx-e422)与[冠脊山脉](#idx-e419)抬升成雨，是索拉瑞斯森林覆盖率过半的核心水分来源。\"},{\"id\":\"e416\",\"title\":\"翡翠海峡\",\"aliases\":[],\"body\":\"大陆南方水域，全大陆航运最繁忙之处，[卡帕尼](#idx-e502)群岛与大陆本体之间的物流几乎全经于此，亦是[索菲亚大运河](#idx-e427)的南端出口。卡帕尼北部岛链水文条件优越、港口全年可用，是这条贸易干线的天然枢纽。\"},{\"id\":\"e419\",\"title\":\"冠脊山脉\",\"aliases\":[],\"body\":\"大陆规模最大的山脉系统，分北、西、东南、南四脉。北脉与西脉合围[尼希尔](#idx-e517)南侧边境，北脉与东南脉之间夹含[希尔文诺大森林](#idx-e528)，南脉则完全位于[索拉瑞斯](#idx-e429)境内。冠脊山脉北脉同时是大陆西部最重要的气候屏障，其北为尼希尔干旱荒漠，其南为[希尔文诺](#idx-e524)封闭湿润的万年密林，是大陆诸域中最极端的毗邻气候对照。\"},{\"id\":\"e422\",\"title\":\"裂境山脉\",\"aliases\":[],\"body\":\"南北走向纵贯[索拉瑞斯](#idx-e429)中部，是帝国东西地形的核心分界线：以东为[奥利提斯平原](#idx-e430)，落在其雨影区而气候偏干；以西地势平缓，[镜心湖](#idx-e436)居中。沿线铁铜矿藏富集，是大陆冶铁产业最重要的原料来源；[索尔河](#idx-e447)发源于其南麓。\"},{\"id\":\"e423\",\"title\":\"凛冰洋\",\"aliases\":[],\"body\":\"大陆北方极寒洋，以东西向洋流为主，北部与东部全年有浮冰，渔业与运输活动仅集中于中西部海域；对大陆只输出严寒与干燥。[尼希尔](#idx-e517)[魔矿](#idx-e71)出口的主干路线即自两河出海口北上进入此洋，东行抵[北门湾](#idx-e413)后南下入[大运河](#idx-e427)。\"},{\"id\":\"e426\",\"title\":\"穗浪湾\",\"aliases\":[],\"body\":\"三面被[阿布丹提亚](#idx-e452)环抱的内湾，兼具渔业与内海运输双重功能，帝国东西两大农业产区之间的大量货物经此中转，是境内最重要的贸易通道之一。\"},{\"id\":\"e427\",\"title\":\"索菲亚大运河\",\"aliases\":[\"大运河\"],\"body\":\"[忒奥西斯](#idx-e483)与[索拉瑞斯](#idx-e429)联合开凿的人工水道，1381–1388年历时七年建成，以[圣仪军](#idx-e302)的[神启魔法](#idx-e4)为主力，是[大陆历](#idx-e346)史上最庞大的人造工程。自[北门湾](#idx-e413)几乎垂直向南贯穿[西比尔平原](#idx-e492)，南端注入[翡翠海峡](#idx-e416)，将[凛冰洋](#idx-e423)与翡翠海峡物理贯通，从根本上重塑了大陆南北贸易格局。管理权归圣领，凡向其报备货物并缴纳[河金](#idx-e321)的船只不分国籍皆可通行。\"},{\"id\":\"e429\",\"title\":\"索拉瑞斯帝国\",\"aliases\":[\"索拉瑞斯\"],\"body\":\"位于大陆中西部的军事集权帝制大国，首都[索尔因维克图斯](#idx-e448)。1159年[索拉尔王国](#idx-e541)国王[阿利昂](#idx-e235)统一西大陆诸国、受牧首册封为首代[龙裔凯撒](#idx-e234)而立国。国土一千一百二十万平方[陆里](#idx-e387)，划为八个[军团行省](#idx-e232)，逾七成为群山与原始森林，人口约四千二百万。以[军团](#idx-e294)—行省一体化制度与[龙骑兵团](#idx-e291)著称，尊[正教](#idx-e146)为国教，逾八成公民为正教信徒；外交强势，与[阿布丹提亚](#idx-e452)共构当代大陆两极。\"},{\"id\":\"e430\",\"title\":\"奥利提斯平原\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)境内[裂境山脉](#idx-e422)以东呈东北—西南走向的狭长平原，是帝国最主要的农业区与人口集中地之一，首都[索尔因维克图斯](#idx-e448)位于其西南角。因落在裂境山脉雨影区，气候较[镜心湖](#idx-e436)区偏干。\"},{\"id\":\"e436\",\"title\":\"镜心湖\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)西部的湖泊，是帝国最重要的农业产区核心与人口最密集的区域之一。受[大星洋](#idx-e415)暖流直接调节，湖体又进一步平抑温差，是帝国内气候最温和宜居的地带。[纳赫尔河](#idx-e520)发源于此；东岸最大城市为[雷克西姆](#idx-e440)。\"},{\"id\":\"e437\",\"title\":\"镜心湖行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八个[军团行省](#idx-e232)之一，位于帝国西部，环[镜心湖](#idx-e436)而设，首府[雷克西姆](#idx-e440)。\"},{\"id\":\"e440\",\"title\":\"雷克西姆\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[镜心湖行省](#idx-e437)首府，[镜心湖](#idx-e436)东岸最大城市，建有[圣保罗](#idx-e119)大教堂。堂中无[圣骸](#idx-e120)，仅供奉据称是保罗生前所披的斗篷——保罗殉道之处据《保罗福音》末章推测邻近镜心湖，[正教会](#idx-e181)因此在雷克西姆建立大教堂。\"},{\"id\":\"e447\",\"title\":\"索尔河\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)境内河流。发源于[裂境山脉](#idx-e422)南麓，流经首都[索尔因维克图斯](#idx-e448)后向东南注入艾瑟瑞姆境内的[坠星湖](#idx-e501)，是帝国重要的内河水系。\"},{\"id\":\"e448\",\"title\":\"索尔因维克图斯\",\"aliases\":[\"索尔因\"],\"body\":\"[索拉瑞斯帝国](#idx-e429)首都，通称索尔因，位于[奥利提斯平原](#idx-e430)西南角，[索尔河](#idx-e447)流经其间。是帝国的政治军事中心与最大城市，八位[行省总督](#idx-e251)每年赴此参加[叙职大会](#idx-e252)；城南设有[龙骑士团](#idx-e296)驻地与飞场。\"},{\"id\":\"e452\",\"title\":\"阿布丹提亚帝国\",\"aliases\":[\"阿布丹提亚\",\"丹提亚帝国\"],\"body\":\"通称丹提亚帝国，位于大陆东南方[大平原](#idx-e453)的君主宪政制大国，首都[维里迪亚](#idx-e480)。386年卡立曼·费内尔统一诸国建立帝政，费内尔家族统治延续至今；两次[阿索战争](#idx-e263)失利后于1393年建[三柱议会](#idx-e240)，和平演变为君主立宪制国家。国土八百七十万平方[陆里](#idx-e387)，划为五个[帝政省](#idx-e228)和一个直辖省，人口逾六千二百万，为全大陆最多。大陆第一大粮食出口国与政治东极，约七成人口信奉[公教](#idx-e107)。\"},{\"id\":\"e453\",\"title\":\"阿布丹提亚大平原\",\"aliases\":[\"大平原\"],\"body\":\"[阿布丹提亚帝国](#idx-e452)国土主体，大陆东部平原带规模最大的一部分，为全大陆最集中的农业核心地带。地势平坦开阔，水系极为发达，冲积土壤肥沃；中部核心区无霜期长而几无结冻，是帝国粮食、棉花与人口的集中所在，首都[维里迪亚](#idx-e480)居其腹地。\"},{\"id\":\"e457\",\"title\":\"贝伊尔伯爵领\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内[伯爵领](#idx-e219)，属于[墨塔顿帝政省](#idx-e473)。\"},{\"id\":\"e458\",\"title\":\"彼得宁村\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内村庄，属于[墨塔顿帝政省](#idx-e473)[贝伊尔伯爵领](#idx-e457)。\"},{\"id\":\"e459\",\"title\":\"波马里亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内位于[润溪湖](#idx-e474)西南方的重要城市。是大陆东部已知元素丰度最高的城市之一，天然宜居且对元素[疏化](#idx-e37)抵抗力强。历史上曾为[正教会](#idx-e181)在东诺拉尼亚最重要的宗教驻地，[教会大分裂](#idx-e160)后成为[公教总会](#idx-e157)所在地；[公教会](#idx-e155)于十四世纪宣称寻得的[圣保罗](#idx-e119)[圣骸](#idx-e120)即供奉于波马里亚大教堂。该城亦是波马里亚[公爵领](#idx-e230)首府，同名[帝政省](#idx-e228)的省名即出于此。\"},{\"id\":\"e461\",\"title\":\"波特利亚河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内的主要河流之一，发源自[葛林沃尔克](#idx-e525)南脉南麓，与[马提尼河](#idx-e471)于[大平原](#idx-e453)中部汇流后注入[晨风海](#idx-e414)，两河交汇处即首都[维里迪亚](#idx-e480)所在。\"},{\"id\":\"e462\",\"title\":\"布兰顿\",\"aliases\":[],\"body\":\"[布兰顿河](#idx-e463)东岸城市，位于河流中游。[第二次阿索战争](#idx-e269)后依《[布兰顿和约](#idx-e264)》割予[索拉瑞斯](#idx-e429)，此后一百二十余年是帝国边境最靠东的据点。1479年[三战](#idx-e270)开战之初为[阿布丹提亚](#idx-e452)夺取，此后终战未再易手，现归属于阿布丹提亚。\"},{\"id\":\"e463\",\"title\":\"布兰顿河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内河流。自北向南流经[西比尔平原](#idx-e492)东南缘，中段接纳一条自西而来的支流后折向东南，于[法拉利亚](#idx-e465)一带入海；[第二次阿索战争](#idx-e269)后其下游为阿索两国界河，《[布兰顿和约](#idx-e264)》即以此河命名，1479年[布兰顿战役](#idx-e265)的战场亦在其中下游两岸。\"},{\"id\":\"e465\",\"title\":\"法拉利亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内，[布兰顿河](#idx-e463)入[翡翠海峡](#idx-e416)河口处的港镇。\"},{\"id\":\"e471\",\"title\":\"马提尼河\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)第一大河，发源于[穗满湖](#idx-e477)，向东南流经[大平原](#idx-e453)后与[波特利亚河](#idx-e461)汇流注入[晨风海](#idx-e414)，两河交汇处即首都[维里迪亚](#idx-e480)所在。\"},{\"id\":\"e473\",\"title\":\"墨塔顿帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)五个[帝政省](#idx-e228)之一，位于帝国东南部，辖[斯拉格丹](#idx-e476)[公爵领](#idx-e230)和[赛兰德](#idx-e475)子爵领等贵族领地。\"},{\"id\":\"e474\",\"title\":\"润溪湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)双湖之东者，与[穗满湖](#idx-e477)并称双湖，是帝国北部水系的重要源头。湖运承担北部矿区矿产向核心区的输送；西南方为[元素丰地](#idx-e52)城市[波马里亚](#idx-e459)。\"},{\"id\":\"e475\",\"title\":\"赛兰德\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内城市，从属于[墨塔顿帝政省](#idx-e473)所属同名子爵领，城市规模较小。\"},{\"id\":\"e476\",\"title\":\"斯拉格丹\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内城市，从属于[墨塔顿帝政省](#idx-e473)所属同名[公爵领](#idx-e230)，位于[穗浪湾](#idx-e426)东岸。[大梅希斯商会](#idx-e315)在此设有分部。\"},{\"id\":\"e477\",\"title\":\"穗满湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)双湖之西者，与[润溪湖](#idx-e474)并称双湖。湖区周边水草丰美，是全大陆最集中的规模化牧区；[马提尼河](#idx-e471)发源于此。\"},{\"id\":\"e478\",\"title\":\"塔尔村\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内村庄，属于[墨塔顿帝政省](#idx-e473)[赛兰德](#idx-e475)子爵领。\"},{\"id\":\"e480\",\"title\":\"维里迪亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)首都，位于[马提尼河](#idx-e471)与[波特利亚河](#idx-e461)交汇处、[大平原](#idx-e453)腹地，是帝国政治文化中心，也是帝国最重要的内河航运枢纽之一。城市内歌剧院与画廊林立，素有\\\"艺术之都\\\"之称。\"},{\"id\":\"e481\",\"title\":\"维里迪亚直辖省\",\"aliases\":[\"首都直辖省\"],\"body\":\"[阿布丹提亚帝国](#idx-e452)六个一级行政区中唯一由皇室直辖者，亦称首都直辖省，位于帝国西南，含首都[维里迪亚](#idx-e480)及周边；境内不设贵族封地与[帝政省](#idx-e228)政府，是该国唯一的直辖省。\"},{\"id\":\"e483\",\"title\":\"忒奥西斯圣治领\",\"aliases\":[\"忒奥西斯\",\"圣治领\",\"圣领\"],\"body\":\"通称圣治领或圣领，位于大陆中央北部的[正教会](#idx-e181)神权共和国，首都[圣城索菲亚](#idx-e487)。1159年[索拉瑞斯](#idx-e429)开国[凯撒](#idx-e234)[阿利昂](#idx-e235)将帝国东部领土捐献给[大牧首](#idx-e148)而立，是正教会取得世俗领地后的政治实体。国土两百三十万平方[陆里](#idx-e387)，划为五个[都主教区](#idx-e153)，人口一千三百万。大牧首兼国家元首，[牧首厅](#idx-e166)为最高行政机构；直属[圣仪军](#idx-e302)兼掌国防与大型工程，[索菲亚大运河](#idx-e427)即其代表成果。\"},{\"id\":\"e485\",\"title\":\"潘克拉托\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)境内城市，[圣约翰都主教区](#idx-e489)的都教座城。[圣约翰](#idx-e123)殉道之地，[圣骸](#idx-e120)存于圣约翰大教堂。\"},{\"id\":\"e487\",\"title\":\"圣城索菲亚\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领首都，[大牧首](#idx-e148)及[牧首厅](#idx-e166)所在地。相传为[唯一神](#idx-e135)降临之处，本为小村，圣领建立及[大运河](#idx-e427)开通后扩张为兼具政治、宗教与经济中心地位的大都会。是大陆中部已知最大的[元素丰地](#idx-e52)，也是[正教会](#idx-e181)立都于此的重要自然前提；索菲亚大教堂藏有据称是[圣约翰](#idx-e123)升天时所钉[十字架](#idx-e127)的原木碎片。\"},{\"id\":\"e489\",\"title\":\"圣约翰都主教区\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领西南部[都主教区](#idx-e153)，以四[使徒](#idx-e126)之首[圣约翰](#idx-e123)命名，辖存有圣约翰[圣骸](#idx-e120)的[潘克拉托](#idx-e485)等地。\"},{\"id\":\"e492\",\"title\":\"西比尔平原\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领所在的温带半干旱草原，地势平坦、天然水源匮乏，[索菲亚大运河](#idx-e427)贯通前农业条件相当有限；北延至[北门湾](#idx-e413)，是大陆南北贸易的关键咽喉。其南部于[二战](#idx-e269)后尽归[索拉瑞斯](#idx-e429)，后为索菲亚大运河纵切为二；运河以东的土地依[三战](#idx-e270)《[卡斯特鲁姆和约](#idx-e275)》归[阿布丹提亚](#idx-e452)，交接至今悬置，是阿索两国博弈的核心争议。\"},{\"id\":\"e493\",\"title\":\"运河仪所\",\"aliases\":[],\"body\":\"坐落于[忒奥西斯](#idx-e483)圣领领土最北端、[索菲亚大运河](#idx-e427)与[北门湾](#idx-e413)交汇入口处的机构，是[牧首厅](#idx-e166)对大运河实施管理的最前沿。承担通行审核与海水除盐双重职能，常驻[神启魔法](#idx-e4)师持续以水元素魔法析出注入运河的海水盐分。其除盐作业常年施法却从未引发可观测的元素[疏化](#idx-e37)，已成为[魔元素动力学](#idx-e29)的专项研究课题。\"},{\"id\":\"e494\",\"title\":\"艾瑟瑞姆王国\",\"aliases\":[],\"body\":\"位于大陆西南部的封建君主制国家，首都[阿斯托利亚](#idx-e495)，领土环抱[坠星湖](#idx-e501)。源出西诺拉尼亚黑暗时期南下避难的[星术](#idx-e7)学者聚落，十一世纪末[塔利瑞安](#idx-e218)联合十二城邦创建[大星术研究院](#idx-e226)，十三世纪前叶塔利兰娜受推举加冕为初代女王。国土约四百二十万平方[陆里](#idx-e387)，由[王冠领地](#idx-e248)、四大伯爵封邑与[特别仪式区](#idx-e244)构成，人口约一千八百万。以星术立国，[王家研究院](#idx-e249)[天星首席](#idx-e247)永由君主兼任，传统意义的[施法者](#idx-e36)占人口逾半。\"},{\"id\":\"e495\",\"title\":\"阿斯托利亚\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)首都，位于[坠星湖](#idx-e501)南端[瑟蒂尔河](#idx-e499)出湖处，由[大陆历](#idx-e346)894年南下避难的[星术](#idx-e7)学者聚落发展而成，[王家研究院](#idx-e249)即设于此。城名源出[星空学派](#idx-e6)早期所用的 Astralis（\\\"属星的\\\"），后世音变作 Astoria，旧拼法今仅见于研究院的仪式文书。\"},{\"id\":\"e499\",\"title\":\"瑟蒂尔河\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)境内河流。由[坠星湖](#idx-e501)南端出发，向南流经艾瑟瑞姆注入[大星洋](#idx-e415)，首都[阿斯托利亚](#idx-e495)位于其北端出湖处。\"},{\"id\":\"e501\",\"title\":\"坠星湖\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)的地理中心，首都[阿斯托利亚](#idx-e495)位于其南端出湖口。[索尔河](#idx-e447)自[索拉瑞斯](#idx-e429)方向注入湖北端，[瑟蒂尔河](#idx-e499)由南端流出南向[大星洋](#idx-e415)；湖运依托[星术](#idx-e7)船只，是沿岸城市群最重要的内部贸易路线。\"},{\"id\":\"e502\",\"title\":\"卡帕尼诸公联合\",\"aliases\":[\"卡帕尼\",\"卡帕尼联邦\"],\"body\":\"又称卡帕尼联邦，位于大陆南部群岛的公国联邦制国家，由四成员公国与[北部特别贸易区](#idx-e505)组成，四公国各有首府，联邦首都为[阿卡帕尼](#idx-e503)公国的[伊索拉韦尔德](#idx-e516)。1356年[第二次阿索战争](#idx-e269)后，四公爵于[米德可尔](#idx-e512)会晤宣布脱离[阿布丹提亚](#idx-e452)独立。国土约二百五十万平方[陆里](#idx-e387)，散布于七十八座岛屿，人口约九百八十万。联邦以商贸与金融立国，外交奉行离岸平衡，热带群岛旅游业亦非常发达。\"},{\"id\":\"e503\",\"title\":\"阿卡帕尼\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一，由同名公爵世袭领有，核心领地为[阿卡帕尼岛](#idx-e504)，首府[伊索拉韦尔德](#idx-e516)亦为联邦首都。\"},{\"id\":\"e504\",\"title\":\"阿卡帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)群岛南部主岛区的核心岛屿之一，与[梅尔帕尼岛](#idx-e510)合计聚居全联邦逾半人口。\"},{\"id\":\"e505\",\"title\":\"北部特别贸易区\",\"aliases\":[\"特贸区\",\"北部特贸区\"],\"body\":\"[卡帕尼联邦](#idx-e502)于1382年于群岛北部岛链设立的特别经济区，由五十八座岛屿及[自由港](#idx-e344)组成，适用独立的[特区商法典](#idx-e245)与优惠贸易税率，设[管理局](#idx-e231)与[仲裁所](#idx-e259)自治，是大陆各国商人自由设立分部开展贸易的核心地带，也是联邦金融机构最密集之处。\"},{\"id\":\"e506\",\"title\":\"波托马利\",\"aliases\":[],\"body\":\"[卡帕尼联邦](#idx-e502)最大城市，位于[北部特贸区](#idx-e505)、[翡翠海峡](#idx-e416)中央，是全大陆南北贸易的关键枢纽与海运门户。\"},{\"id\":\"e510\",\"title\":\"梅尔帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)群岛南部主岛区的核心岛屿之一，与[阿卡帕尼岛](#idx-e504)合计聚居全联邦逾半人口。\"},{\"id\":\"e512\",\"title\":\"米德可尔\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)境内地名。1356年[第二次阿索战争](#idx-e269)后，卡帕尼四公爵于此会晤宣布建立诸公联合，是联邦独立的历史象征地点。\"},{\"id\":\"e516\",\"title\":\"伊索拉韦尔德\",\"aliases\":[\"伊索拉\"],\"body\":\"[卡帕尼诸公联合](#idx-e502)首都，通称伊索拉，同时是[阿卡帕尼](#idx-e503)公国首府，四公国的政治核心所在地。当地作坊以镀银工艺见长，[索利亚商会](#idx-e338)创办于此。\"},{\"id\":\"e517\",\"title\":\"尼希尔伊玛目酋邦\",\"aliases\":[\"尼希尔\",\"尼希尔酋邦\"],\"body\":\"通称尼希尔酋邦，位于大陆西北角沙漠绿洲与两河流域的神权部落联邦国家，首都[阿尔努尔](#idx-e518)。五世纪[萨阿尔血王朝](#idx-e539)覆灭后，诸部酋长于阿尔努尔会盟，推举诸神大祭司为[伊玛目教长](#idx-e199)，成立酋邦。尼希尔国土五百八十万平方[陆里](#idx-e387)，由[诸神圣土](#idx-e202)与八部落领地构成，人口约一千八百万。酋邦是当今大陆唯一合法保有奴隶制的国家，社会等级高度固化。\"},{\"id\":\"e518\",\"title\":\"阿尔努尔\",\"aliases\":[],\"body\":\"[尼希尔伊玛目酋邦](#idx-e517)首都兼伊玛目城，位于两河流域核心地带，属[教长](#idx-e199)直辖的[诸神圣土](#idx-e202)。422年诸部酋长于此会盟建立部落联邦体制、推举首任伊玛目教长；城中六神各有神庙，另有教长主持全酋邦最隆重仪典的[大神庙](#idx-e186)，[酋长会议](#idx-e239)亦每年在此召开。\"},{\"id\":\"e519\",\"title\":\"哈亚特河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)两河之东河，发源于[冠脊山脉](#idx-e419)西脉北麓的积雪融水，自南向北流经酋邦西部，于[塔巴特](#idx-e523)与[纳赫尔河](#idx-e520)交汇后入[凛冰洋](#idx-e423)。其洪汛带来上游冲积土并补充土壤水分，随洪水消退而展开的播种是全酋邦农业的年度起点。\"},{\"id\":\"e520\",\"title\":\"纳赫尔河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)两河之西河，发源于[索拉瑞斯](#idx-e429)境内的[镜心湖](#idx-e436)，自南向北流经酋邦西部，于[塔巴特](#idx-e523)与[哈亚特河](#idx-e519)交汇。因源头在索拉瑞斯境内，诸神信仰第一季的西祭典历来只能在靠近南边境的城市勉强举行，这也是尼索边境关系长期恶劣的原因之一。\"},{\"id\":\"e521\",\"title\":\"沙阿万大魔矿\",\"aliases\":[\"大魔矿\"],\"body\":\"位于[尼希尔](#idx-e517)东部沙阿万沙漠地下，全大陆最大的单一[魔矿](#idx-e71)产地，年产量占大陆总量逾半，[高品级魔矿](#idx-e65)更占大陆产出八成以上，几乎构成事实垄断。矿井多由[神遴者](#idx-e412)以[秘术](#idx-e3)开凿，此后的采掘、支护、排水与转运则由奴隶以常规工具承担。各国对尼希尔的结构性经济依赖即根源于此。\"},{\"id\":\"e522\",\"title\":\"沙阿万大沙漠\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)东部广袤沙漠，是大陆最严酷的干旱地带，地表资源匮乏，昼夜温差可超三十[星度](#idx-e395)，仅有[冠脊山脉](#idx-e419)北脉北麓发源的两条小型沙漠河流维系着若干绿洲；地下则蕴藏[沙阿万大魔矿](#idx-e521)。\"},{\"id\":\"e523\",\"title\":\"塔巴特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)西部[纳赫尔河](#idx-e520)与[哈亚特河](#idx-e519)的交汇处，是两河流域的重要节点，两河在此汇合后继续北行入[凛冰洋](#idx-e423)。\"},{\"id\":\"e524\",\"title\":\"希尔文诺\",\"aliases\":[],\"body\":\"大陆精灵族裔及其文明与家园的统称，位于[冠脊山脉](#idx-e419)间的封闭盆地，由二十余个[氏族](#idx-e211)部落构成，最大聚落为[大圣树](#idx-e214)所在的[希尔文尼亚](#idx-e527)。其实际控制面积以大森林为界约一百二十万平方[陆里](#idx-e387)，人口一般认为不超过一百万。制度植根于大圣树信仰，每三十年召开[万叶庭](#idx-e213)全体表决，[叶络枢机院](#idx-e216)理日常行政与对外事务。1132年与人类首次接触，此后长期保持中立与封闭，被各国视为大陆事务的天然缓冲区与仲裁者。\"},{\"id\":\"e525\",\"title\":\"葛林沃尔克\",\"aliases\":[],\"body\":\"大陆东北角地区，由南北两支山脉夹峙高山密林构成，北部为雪原冰川。是大陆地理信息最匮乏的区域，据传其可能存在智慧种族与独立的魔法体系，但学界均无可靠资料。\"},{\"id\":\"e527\",\"title\":\"希尔文尼亚\",\"aliases\":[],\"body\":\"[希尔文诺大圣树](#idx-e214)所在之地，精灵族规模最大的聚居点，[万叶庭](#idx-e213)与[叶络枢机院](#idx-e216)所在。据推测是大陆最优越的[元素丰地](#idx-e52)之一。\"},{\"id\":\"e528\",\"title\":\"希尔文诺大森林\",\"aliases\":[],\"body\":\"精灵族世代定居之地，坐落于[冠脊山脉](#idx-e419)北脉与东南脉合围而成的山间盆地，是大陆封闭程度最高的区域之一，实际控制面积约一百二十万平方[陆里](#idx-e387)。山脉双重合围造就封闭湿润的气候，孕育大量大陆其他地区所没有的特有动植物；盆地开口朝向东南，东南脉中部的天然隘口是[林缘议厅](#idx-e276)所在地。\"},{\"id\":\"e532\",\"title\":\"冠阳\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之首，[星空学派](#idx-e6)完整名\\\"主序·冠阳\\\"，即太阳。[源星](#idx-e56)属权威、创造与审判；[正教](#idx-e146)神学中象征[唯一神](#idx-e135)，对应[仪式历](#idx-e361)[圣神日](#idx-e358)与[通用历](#idx-e368)日曜日。\"},{\"id\":\"e533\",\"title\":\"烬铸星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"熔炉·烬铸星\\\"。[源星](#idx-e56)属转化、破坏与锻造，常被视为天球之上的锻造炉象征；[正教](#idx-e146)神学上象征[圣约瑟](#idx-e124)，对应[烬曜日](#idx-e351)。\"},{\"id\":\"e539\",\"title\":\"萨阿尔血王朝\",\"aliases\":[],\"body\":\"古代[尼希尔](#idx-e517)地区存在的政权，由掌握[秘术](#idx-e3)的萨阿尔部落于[大陆历](#idx-e346)元前二世纪建立。该部自[沙阿万大沙漠](#idx-e522)西侵，用八年统一西尼希尔诸部，王朝延续至五世纪。其以自身信仰强行替代西尼希尔原有神话体系，奠定了尼希尔日后的诸神信仰与政教结构。史籍普遍估算，王朝治下因屠杀或献祭而死者逾四百万。该王朝在五世纪大起义中覆灭，但其制度主体却被422年的[阿尔努尔](#idx-e518)会盟所承袭。\"},{\"id\":\"e541\",\"title\":\"索拉尔王国\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)的前身，于西诺拉尼亚[黑暗时代](#idx-e273)中崛起的王国。1159年，索拉尔国王[阿利昂](#idx-e235)统一西大陆诸国、受牧首册封为首位[龙裔凯撒](#idx-e234)，索拉瑞斯帝国由此建立。现代通用度量衡的长度单位[步米](#idx-e378)与[陆里](#idx-e387)即源自索拉尔王国的[军团](#idx-e294)行军传统。\"},{\"id\":\"e544\",\"title\":\"汐月\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"银杯·汐月\\\"，即月亮。[源星](#idx-e56)属容纳、精神与教导；[正教](#idx-e146)神学上象征[圣约翰](#idx-e123)，对应[月曜日](#idx-e376)。艾瑟瑞姆[星历](#idx-e371)即以其盈亏循环为月。\"},{\"id\":\"e548\",\"title\":\"织虹星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"脉生·织虹星\\\"。[源星](#idx-e56)属修复、治疗与幻象；[正教](#idx-e146)神学上象征[圣保罗](#idx-e119)，对应[虹曜日](#idx-e348)。\"},{\"id\":\"e549\",\"title\":\"仲裁星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"律令·仲裁星\\\"，是星空中最亮且运动最明显的三颗星体之一。[源星](#idx-e56)属秩序、守护与契约；[正教](#idx-e146)神学上象征[圣伊琳娜](#idx-e122)，对应[裁曜日](#idx-e345)。\"}]}}]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"12:I[27201,[\"/Nurania/next/static/chunks/ff1a16fafef87110.js\",\"/Nurania/next/static/chunks/0bd6498bda341889.js\"],\"IconMark\"]\na:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"在人间·下 | Coming of Age·In the Human World II\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"纪念塞勒内斯·尤里梅尔诞辰150周年系列文集\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/Nurania/icon.svg?icon.986a92ce.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L12\",\"3\",{}]]\n"])</script></body></html>
