](#idx-e353)季的最后几日，[索尔因维克图斯](#idx-e448)大雪纷飞。皇宫的内寝向来不许外人进入，但那一晚，凯撒身边的几位近臣给龙骑士团发出了召见令。一封信，八个名字，萨德里安第一个赶到。\n\n他抵达皇宫时雪已经下了大半夜。皇宫里的灯只点了三分之一，长廊深处的烛火被风吹得来回偏摆。带路的近臣几乎没有说话，走得很快。\n\n经过西翼那条偏僻的走廊时，萨德里安忽然想起几年前的一件事。\n\n那年也是一个飘雪的冬夜，他刚结束一次外勤，奉召入宫向托兰西斯二世汇报边境军况。汇报完后他独自往宫门方向走，途中在这条走廊上遇到一位年迈的内务官。\n\n老人姓什么萨德里安已经记不清了，多年来宫里的内务官换了一批又一批。当时两人点头示意，并排走了一段路，谁也没有开口说话。萨德里安以为他和自己一样在赶夜路。\n\n走到一个岔口时，老人忽然停下来，问他：“韦尔尼阁下，凯撒御下今晚什么时候休息？”\n\n萨德里安记得自己当时怔了一下。他和托兰西斯二世的私交不算秘密，但宫里的人很少这样问他。\n\n“御下今夜会读完军报。”他答。\n\n老人点点头，没有立刻走开。他看向廊外飘扬的雪花，用一种像是对自己也像是对萨德里安说话的语气，讲了一件事。\n\n去年春天，先皇旁系的某位远房公主诞下一子，请凯撒去主持婴儿的[洗礼](#idx-e136)，凯撒去了。仪式中段，他盯着襁褓里的婴儿看了许久，然后一言不发地转身离场，回到内寝闭门不出了一整天。第二天的午后，凯撒打开门把当值的内务官——也就是说话的这位老人——叫了进去，只说了一句话。\n\n“去告诉他母亲，把孩子的名字定下来——免得墓碑上没有东西刻。”\n\n那孩子果然没有活过那个春天。\n\n老人讲完后转头看着萨德里安，停了片刻。\n\n“我当差三十六年了，韦尔尼阁下。早夭这种事，我见得越来越多……皇室里其他能活下来的孩子，也常常带着些说不清的毛病。”他没有刻意压低声音，皇室家族抛头露面，早夭与先天病很多人都看在眼里，本就不是什么需要避讳的话题。萨德里安站在走廊上，没明白老人为何要和他说这件事。\n\n“凯撒御下的负担很重……太重了。”内务官说完，仿佛是害怕萨德里安追问一般，向他行了一礼，快步离去。萨德里安看着老人的身影消失在岔路的另一头，随后转身出宫。\n\n如今他走在同一条走廊上，往同一位凯撒的内寝去，脚下的青石板和当年也并无两样。但那位老内务官早已退职，听说去年也已离世。\n\n只有他的那段话仍留在萨德里安心里。\n\n*\n\n内寝的门是半开的，屋里点着两盏灯，光压得很低。一位侍医坐在床尾，看到萨德里安进来便起身让位，退到外间。\n\n托兰西斯二世侧躺在床上，目光投向对面墙上的一幅画像。那幅画里是雷尔金一世，托兰西斯二世的父亲，雷尔金二世的祖父。画中的第八代龙裔凯撒盔甲齐整，站姿挺直，鼻梁是萨德里安极为熟悉的、鹰隼般的弧度。\n\n托兰西斯二世正在对自己——或者对画像——喃喃自语，似乎没有注意萨德里安已经到了。\n\n“他的鼻子，和我儿子一模一样。”凯撒的声音很轻，但屋子安静得能听清每一个字。“我祖父也是。我们家的脸，一直在变窄。”\n\n短暂的停顿。\n\n“……真丑啊。”\n\n萨德里安站在门口听完这两句。脚没有动，呼吸也压得很轻。\n\n托兰西斯二世转过脸，年迈的凯撒已经瘦得不成样子。萨德里安最后一次见到他是半年前，那时他还能在花园里散步。如今的人躺在床上，脸颊深陷，呼吸短促，像是有某种诅咒快速吸干了他的生命力。萨德里安的视线落在他的鼻子上，那鹰隼一般弯曲弧线的鼻子，曾经给年轻时的凯撒带来一种阴郁的英俊感，但如今它盘踞在老人瘦削凹陷的脸上，像是某种恶心的肉块。\n\n“萨德里安。”凯撒说。\n\n“御下。”萨德里安快走几步，在床边站定行礼。\n\n“其他人……还没到？”\n\n“他们在路上。”\n\n“那好。”\n\n接下来的几分钟，凯撒一句话都没有说。萨德里安站在床边，不知道自己该坐下还是该退到一旁。\n\n“萨德里安。”凯撒忽然开口。\n\n“我在。”\n\n“我父亲做过的事，我做过的事……我儿子不必再做。”\n\n萨德里安没有问是什么事，因为凯撒的语气里有种近乎哀求的东西，让他觉得追问会令对方非常痛苦。\n\n于是他只是点了点头，“御下，我听到了。”\n\n“你听到了。”\n\n凯撒闭上眼睛，不再说话。其他几位龙骑士在半小时后陆续到来，凯撒简短感谢了龙骑士团多年来的效忠，言辞恳切，语气平稳，挑不出来毛病。但萨德里安隐约感觉到，凯撒今天真正想说的话只有刚刚对他说的那一句。\n\n托兰西斯二世在第二日凌晨去世。\n\n---\n\n阿尔图斯猛地扇动翅膀，像巨大的飞鸟一般轻盈地越过[裂境山脉](#idx-e422)的侧峰，月光照耀下，[索尔河](#idx-e447)闪烁着冷冽的银光。地平线处，索尔因维克图斯的巨大身影再次出现在萨德里安眼里，这趟夜间飞行即将抵达终点。\n\n那一晚他从托兰西斯二世的内寝退出来后，独自走过同一条长廊。\n\n他回忆起早年刚刚加入龙骑士团时，曾受到过先皇雷尔金一世的召见，当时先皇后也在场。那是一位美丽高雅的女性，年轻的萨德里安没忍住，偷偷多瞄了几眼。\n\n那位皇后的鼻子，是否也有着鹰隼般弯曲的弧度？\n\n他停下脚步。\n\n右手边一扇侧廊的拱门半开着，深处亮着一盏孤零零的壁灯。亮光刚好落在几幅画像上——是历代凯撒与皇配的双人像。他不知道是什么驱使自己拐了进去。\n\n第一幅，第二幅，第三幅……他的视线从每一代[索拉瑞斯](#idx-e429)的统治者和配偶的脸上划过。\n\n然后他退了一步，壁灯在风里暗了一瞬。\n\n雪还在下，和来时一样，萨德里安转身回到主廊，继续向宫门走去。\n\n“我父亲做过的事，我做过的事……我儿子不必再做。”\n\n——他在那一刻明白了这句话的一半，而理解这句话剩下的一半，花了他三年时间。\n\n*\n\n《[龙裔继嗣法](#idx-e233)》。\n\n这部开国凯撒[阿利昂](#idx-e235)留下的法典，规定了每代继承皇位的继承人的龙血浓度必须高于一个最低值。如果一个继承人的血脉不能达标，那么他的下一代，再下一代，也大概率达不了标。\n\n萨德里安意识到这一点的时候，他已经六十七岁。那是雷尔金二世登基后第三个[垂恩](#idx-e357)季。他假借执行御令的机会，得以进入长年关闭的皇家档案库。档案库的空气很安静，只有一股老旧纸张的腐朽气味。十来个高大到顶的铁质档案柜沿着墙一字排开，像是某种巨大的墓碑。\n\n萨德里安花了点时间找到了[继承战争](#idx-e274)时期的内宫旧档，档案册的皮革封面落了厚厚一层灰，显然很久没被人打开过。\n\n……1402年，第七代龙裔凯撒克[洛林](#idx-e74)三世意外驾崩，其子女无人达到继嗣法规定的最低血脉浓度；各[军团](#idx-e294)长以不同继承人名义相互征伐，拉开继承战争序幕……\n\n萨德里安小心翼翼地翻动着档案册已经发黄变脆的书页，军团会战，龙骑士变节，协定签署又被撕毁——每一行字都代表着几千人的生与死。\n\n他加入龙骑士团时内战已经结束三年，在此之前他从未真正关心过那三十年里索拉瑞斯发生了什么。\n\n……1431年，支持三皇子派的中辖军团向[圣领](#idx-e483)捐献了大笔资金，主要流向负责宗教事务的[圣礼厅](#idx-e173)……\n\n……继承战争结束于1433年，三皇子于[圣城索菲亚](#idx-e487)加冕为雷尔金一世。在加冕仪式上，[大牧首](#idx-e148)皮亚诺一世亲自为他重新测试血脉并且宣布通过……\n\n萨德里安的目光停在这行字上，没有继续往下翻页。\n\n档案库里静的能听到墙壁另一侧来往侍从的脚步声。他把档案册合上，坐了很久，等到终于站起来时，外面已经天黑。\n\n每代凯撒的子嗣被选为继承人时都要重新进行血统测试，如果一代凯撒因为血脉不达标而在测试里造了假，那么他也要为自己的儿子造假，他的儿子也要为他的孙子造假。\n\n——那句临终遗言的另一半，落在这里。\n\n---\n\n萨德里安感受到风向稍稍变了，阿尔图斯再次飞回了索尔因维克图斯上空。索拉瑞斯帝国的心脏在下方铺开，夜已经很深了，城里的灯火灭了大半。一人一龙沉默着从城市上空飞过，直到萨德里安开口。\n\n“阿尔图斯。”\n\n“嗯。”\n\n“……我想清楚了。”\n\n“我知道你今晚出来就是为了想清楚。”\n\n短暂的沉默。\n\n“你不问？”萨德里安说。\n\n“我可以问。”巨龙的声音很平静，“不过你不会愿意长篇解释。我也不太在意。”\n\n萨德里安在风里轻轻笑了一下。\n\n“是人类的事，”阿尔图斯说，“按你的本心办吧。老规矩，我和你在一起。”\n\n冷风从他们身边掠过，月亮又往西移了一点。阿尔图斯的翅膀微微向右倾斜，缓缓向城南龙骑士团的飞场方向偏过去。\n\n### 二\n\n阿尔图斯的爪子坚实地踏在飞场的地面上，萨德里安侧过身，从自己的巨龙身上跳下。他回头解下飞鞍，把额头贴在阿尔图斯的颈侧——这是他们之间习惯的告别方式。阿尔图斯沉默地抬起一侧的翅膀，轻轻拍了拍老伙计的头，发出一声嗡鸣。\n\n萨德里安像过去许多个日子一样，沉默地走向自己的屋子，走到房门前的时候，一个留着金色半长发的青年男人已经站在那里。\n\n“嗨。”他抬起手打了个招呼，嘴角扬起一个萨德里安非常熟悉的微笑。\n\n“卡西安。”\n\n卡西安·洛尔是龙骑士团里萨德里安最熟悉的成员，或者说，朋友。他比萨德里安年轻十二岁，但加入团的时间几乎同期。萨德里安还记得当年那个咋咋呼呼一腔热血的少年，两人的行事风格可以说截然相反。如今几十年过去，他们作为战友一起经历过很多事，但卡西安的性格却似乎没有任何改变，萨德里安常常惊异于性格宛如两面的两人的友谊能够维持这么久。\n\n“我能进去吗？”\n\n“进吧。”\n\n卡西安跟着他进屋，关门。萨德里安给两人各倒了一杯莓酒。\n\n“我刚刚经过团长和阿尔玛瑞克小哥的屋子，灯都亮着，今晚睡不着觉的看来不止我们俩。”卡西安往后靠在椅子上，接过酒杯，但没立刻喝，“明天的投票，你怎么打算的？”\n\n萨德里安看着杯子里晃动的酒。“……我想我已经决定了。”\n\n卡西安点了点头，看上去并不打算追问。萨德里安以为他不会再接话，但卡西安喝了一口酒，自己说了下去。\n\n“我也决定了。我投不参战。”\n\n萨德里安抬起视线。\n\n“——别用那种眼神看我，我可不是听了什么风声。”卡西安摆摆手，“那东西正式名字叫啥来着……哦对，[血脉共鸣](#idx-e47)。我就是单纯地共鸣不上，没那么多弯弯绕。从雷尔金二世登基那天起，我每次见他，都没有反应。先皇……也就是托兰西斯二世，也是这样。”\n\n他把酒杯放在桌子上，继续说下去，“我们效忠的是龙血，不是随便哪个坐在皇位上的人。这话我和阿尔玛瑞克前阵子聊过，他也是这么看的，团里另外几个人也是。明天会议上你会听到。”\n\n“嗯。”\n\n“你呢？”卡西安看着他，“不过你的理由我大概有数——你和先皇的关系大家都知道，这么多年来你执行凯撒的命令时也是全团最积极的，连埃莉诺拉团长都夸——”\n\n“我会投不参战。”萨德里安平静地打断了他。\n\n卡西安像是被无形的手卡住了脖子，瞪大了眼睛看着他，毫不掩饰脸上的震惊。\n\n“你在开玩笑吧？”虽然他知道萨德里安从不开玩笑。\n\n“不是。”萨德里安依旧盯着杯子里的酒，没有抬头。“我觉得索拉瑞斯需要一场失败，一场能撬动帝国根基的失败。”\n\n“……如果你我不是龙骑士，你的这句话就足够让我俩上绞刑架。”卡西安眨眨眼，露出一个苦笑，“你这不说话则已，一说话就吓死个人的毛病真得改一改。”\n\n萨德里安没理他，他知道这是卡西安在缓和气氛。“……如果血脉已经成为枷锁，那么就靠外力来把它砸破。”\n\n老友瘦削凹陷的脸再次浮现在他的眼前，他曾是萨德里安见过最富精力、最积极进取的人，而临终的他虚弱地蜷缩在床上，像是有某种极其沉重的东西在过去几十年里一节一节地压碎了他的脊梁。\n\n“我不懂你的意思。”卡西安收起了笑容，他清楚自己朋友的每句话都是深思熟虑的结果。\n\n但萨德里安没有再开口。卡西安意识到他无意继续解释，也许是不想，又也许是不能。\n\n“好吧，老规矩，你不想说就不用说。”卡西安的脸色缓和下来，再次露出他平常那个笑容。他把空酒杯放在桌上示意，“那想再喝一杯，总是可以的吧？”\n\n萨德里安一言不发，起身拿来了酒瓶。\n\n“哎呀感谢感谢，要我说还是萨德里安老哥你有门道，我怎么在城里就找不到口感这么棒的[托伊尔莓酒](#idx-e409)呢。对，我自己来就行了，”卡西安毫不见外地接过酒瓶，给自己倒满，“不谈投票了，我和你说件好玩的事儿，上次我去找奥斯托喝酒……”\n\n萨德里安安静地听着自己的龙骑士同僚像往日一样口若悬河，时不时地出声附和或者评论几句，这是他们以往惯常的相处模式，今夜似乎也没什么两样。\n\n“……所以说啊，我长得又不差，还是堂堂帝国龙骑士，那姑娘怎么就连再见我一面就都不肯呢？”卡西安说到郁闷处，又去桌子上抓酒瓶。手上一轻，原来不知不觉一瓶刚开封的莓酒已经见了底，他略带尴尬地挠了挠头。\n\n“时间不早了。”萨德里安适时的提醒道。\n\n“确实，那我就不打扰你休息了。”卡西安把酒杯里剩的液体一饮而尽，站起身来。\n\n“……明日辰时见。”\n\n“明日辰时见。”\n\n---\n\n龙骑士团内部会议厅在驻地的最深处。和外界想象的威严堂皇不一样，这个决定索拉瑞斯、乃至全大陆最强战力走向的场所是一座只有两层楼高的、外表发灰的石质建筑。\n\n和往常一样，萨德里安是第一个到的。空旷的大厅里，八个座位围绕一张古旧的石桌摆成一个圆。首座上方挂着一副已经略有褪色的开国君主、第一代龙裔凯撒阿利昂的巨幅肖像。萨德里安落座后，盯着这幅肖像出神。\n\n第二个到达的是卡西安，接着是阿尔玛瑞克、奥斯托、伊蕾妮娅……众龙骑士互相点头示意，沉默着依次入座，没有人说话，直到窗外传来大教堂辰时的钟声。\n\n主持人是团长埃莉诺拉·维斯，团里资历最深的成员。她九十二岁，以龙骑士的标准来算也已属高龄，但杰出的体魄和长年的训练让她仍能骑龙空中格斗，团内训练时常常把年轻团员打得满地找牙。她打开会议时只说了一句话。\n\n“凯撒御令。是否参战。”\n\n没有铺垫，没有解释。这是龙骑士团的传统——繁文缛节越少，决议越纯净。\n\n短暂的沉默后，第一个发言的是奥斯托·托雷尔。\n\n“参战。”体格魁梧的[圣礼骑士](#idx-e301)的声音简短而坚定，“敌方是[公教](#idx-e107)徒的军队。让一群[异端](#idx-e143)在大陆上继续扩张是对[唯一神](#idx-e135)信仰的亵渎，不是龙骑士团应当容忍的事。这是龙血所担的使命，没有什么可争议的。”他的右手盖在桌上，像是按着一本不存在的教典。\n\n“我同意托雷尔叔叔的看法，帝国需要我们。”萨德里安没有转头，但他听得出来这是提诺尔·瓦索，团里最年轻的成员。他的声音里带着只有少年人才有的朝气和坚定，让萨德里安想起几十年前的卡西安。\n\n“我觉得我们应该参战。”下一个开口的是埃莉诺拉，声音稳定，没有情绪，像她主持任何一次会议时一样，“凯撒下了令。我们效忠的是凯撒。”\n\n“我们效忠的是凯撒所代表的血脉。”一个略带冷漠的声音从她旁边响起，他的主人是一位外表儒雅，有着文官气质的长发男子。初见阿尔玛瑞克·瓦伦的人往往很难把他和战场上所向披靡的龙骑士联系在一起，此时他看着埃莉诺拉团长，似乎没有感觉到自己的话让会议厅里的气氛骤然一变。\n\n“那也是凯撒。”奥斯托在另一边接过他的话。\n\n“如果是真正的凯撒。”阿尔玛瑞克回头看向圣礼骑士。他在“真正的”三个字上加重了音。会议厅里安静了几秒钟。这是第一次有人在团内会议上把“如果是真正的凯撒”这句话说出来。\n\n萨德里安听到自己左手边传来一声响亮的口哨，伊蕾妮娅·卡兹毫不在意自己吸引来的目光，一边卷着红色的长发，一边饶有趣味地看着另一边针锋相对的几人，俨然一副看好戏的样子。\n\n“阿尔玛瑞克，我是否可以把你的发言理解为对凯撒的正式指控。”埃莉诺拉听到了口哨声，但她没有理会。\n\n“我无意冒犯凯撒的权威，但在场的诸位都是巨龙[血契](#idx-e48)之人，我们只向同样流淌着高贵龙血的凯撒效忠，这一点想必团长也不会否认。”阿尔玛瑞克短暂地停了一下，看到艾利诺拉和同僚们都微微颔首。\n\n他斟酌了一下措辞，继续说下去：“我们能通过血脉与同族共鸣。但是我和我的契约方泽尔斯，不能和托兰西斯二世御下以及雷尔金二世产生这种共鸣，这十年里，我每次见到凯撒御下，都不能。”\n\n“我也想说一句。”坐在阿尔玛瑞克左边的中年女性开口，声音不大，但众人都听得清。莉薇娜·梅伦留着棕色的长发，目光温和，团内争议时一向扮演的是调解人的角色，“我和我的契约方也很多年无法和凯撒发生共鸣了。这件事我之前一直没想说，但既然现在阿尔玛瑞克已经提出来了——”\n\n她没有说完，但萨德里安的视线扫过石桌四周，看到有几位龙骑士都露出了赞同的神色。坐在他正对面的卡西安注意到了他的视线，耸了耸肩，向他露出一个“我早和你说过”的表情。\n\n“我也共鸣不上。”伊蕾妮娅懒洋洋地接话，一只手撑着下巴，“所以我投不参战。不过你们知道的，我不是因为什么血脉不血脉。我就是不想为了人类的事情飞出去打，索拉瑞斯管我屁事。”\n\n奥斯托猛地侧头看她：“这是——”\n\n“是对凯撒的不敬，是对唯一神的背叛，是龙骑士的耻辱。”伊蕾妮娅对他翻了个白眼，“你来来回回就那么几顶帽子，奥斯托。你说你的，我说我的。”\n\n圣礼骑士站起身来，厚重的木椅向后划过地板发出巨大的声响。有一瞬间萨德里安以为他要直接动手，但埃莉诺拉抬手按了一下桌面，奥斯托恨恨地深呼吸了几次，坐了回去，没有再反驳。\n\n萨德里安低下头，视线落在石桌中央那道因为年代久远而开裂的纹路上，没有抬起来。他听到卡西安也开了口，话里大意和他昨晚对自己说的一样。\n\n卡西安的发言以“我支持不参战”收尾，随后会议厅里重新陷入了沉默。萨德里安知道自己不会发言，他的同僚们也知道。\n\n埃莉诺拉站起身，将八枚铁筹和两个木碗放在石桌上，一个上面刻“参战”，另一个刻“不参战”。\n\n“讨论结束，投票。”\n\n龙骑士们依次走上前，拿起代表选择权的铁筹，投进对应的碗里。没人说话，该说的话已经在刚刚说够了。萨德里安拿起自己的铁筹的时候，感觉这个小小的金属块比他握过的任何骑枪都要沉重。\n\n八人投票完毕，埃莉诺拉走上前，把两个碗里的铁筹倒出来给所有人看。\n\n“三比五，不参战。”\n\n奥斯托重重地叹了一口气，毫不忌讳让同僚听到他的愤懑。萨德里安看着石桌上小小的两堆铁筹，如果他投了“参战”，票数就会是四比四平票。平票团长加权，而所有人都看着埃莉诺拉团长第一个投了“参战”。\n\n自己的票改变了龙骑士团的决定。\n\n埃莉诺拉的脸上看不出什么表情，她合上记录册，眼神扫过每一位团员，没有在任何一个人身上多停留一秒：“散会。决议今日下午送交凯撒与[御前参谋部](#idx-e256)。”\n\n### 三\n\n散会的过程同样很安静，诸位龙骑士怀着各自的心情离席。萨德里安在自己的位置上多坐了一会，感觉有什么东西压在他的肩上。卡西安经过他身边时拍了拍他的胳膊，做了个喝酒的动作——萨德里安知道这是在邀请他一会去喝一杯，一种属于卡西安的安慰人的方式。萨德里安点点头回应。\n\n原本就人数不多的会议厅很快空了下来。\n\n萨德里安抬头将视线再次投向阿利昂的画像。这位传奇的龙骑士兼索拉瑞斯的缔造者，相传是人与巨龙的直接混血，也是晚年写下《龙裔继嗣法》、开启龙血检测传统的人。画像上的初代凯撒身披重甲，身伴巨龙，盔甲外的手臂上覆满青黑色的龙鳞，拿着一柄两人高有余的长枪。他和他的巨龙面色冷峻，看向画像外的观众。\n\n萨德里安注意到他的鼻子也有些许鹰隼般的弧度。\n\n“这不是萨德里安大叔么，还没走？”萨德里安转过头，年轻的女龙骑士去而复返，倚着会议厅的大门看向他。\n\n“嗯。”萨德里安简短地回应。\n\n“你知道你的票会让凯撒输掉这场战争吧？”伊蕾妮娅走近几步，和萨德里安一起看着阿利昂的画像。“这倒是让我好奇起来了，是什么让你这条雷尔金的狗……哦不好意思，忘了这是在你面前了。”\n\n伊蕾妮娅转向他摊了摊手，但她眼里没有丝毫抱歉的意思：“是什么让您这位凯撒御下的大忠臣投了不参战？”\n\n“随便问问，反正人类拼死拼活对我来说毫无所谓。”她顿了顿，看到萨德里安不像是要开口的样子，“不想说就算了，反正你一天到晚本来也憋不出几句话。”\n\n萨德里安还是没有说话。伊蕾妮娅以为他不会开口了，撇撇嘴露出明显扫兴的表情，正要转身。\n\n“那你怎么看索拉瑞斯？”\n\n伊蕾妮娅停下，回头看他。她显然没想到这位平时基本不和她说话的“凯撒御下大忠臣”会反过来问她。\n\n“我？”她咧了咧嘴，语气里带着平日里惯常的嘲弄，“就和我刚刚说的一样——索拉瑞斯变成什么样关我屁事。这个帝国是明天就没了，还是一千年后还赖着喘气，我都不会多看一眼。我当这龙骑士是为了特权和享受，可不是为了什么帝国或者神的荣耀抛头颅洒热血，天生的傻子才会这么干。”\n\n萨德里安没有看她，他的视线仍然停在阿利昂的画像上，但他知道伊蕾妮娅说的是提诺尔和奥斯托，可能还要算上埃莉诺拉。\n\n“或许，”他过了好一会才开口，“让索拉瑞斯灭亡，才是对凯撒真正的忠诚。”\n\n伊蕾妮娅愣了一秒。\n\n然后她笑出了声。“你他妈在放屁吧。”\n\n她走到画像前，仰头看着画上那个手持长枪的初代凯撒，又转头看向萨德里安。\n\n“我虽然不在乎人类那点破事，但在人类世界里也活了不短的时间。”她说，“这种上位者想要的忠诚只有一种，就是好好的给他当狗，大叔。让一个人丢掉他的皇位，他只会想杀了你。他不会因为‘你是为了他好’就赦免你，这就是人类。”\n\n“就算凯撒能理解你，他周围那些靠他活着的人也不可能让他接受这个结局。我不知道你说的‘真正的忠诚’是什么东西，我也没兴趣知道。”伊蕾妮娅挥挥手，“但凯撒和帝国是一体的，你想救一个却毁了另一个，剩下的那一个也活不了。”\n\n萨德里安没有反驳。他想起雷尔金二世初见他时眼里那份不该并存的警惕与请求。\n\n伊蕾妮娅看他不接话，耸了耸肩，往门口走去。走到门口她停下，回头看了萨德里安一眼，眼里嘲讽的神色已经退得一干二净。她旋即转身离开。\n\n会议厅里又只剩下萨德里安和初代凯撒。\n\n阿利昂在画像里看着他，鼻梁有些许鹰隼般的弧度。\n\n---\n\n散会后他答应了卡西安那杯酒，两人在城南的军官会所坐了一阵子。卡西安像往常一样口若悬河，他像往常一样应付式地接住，只是今天他少见地比卡西安喝得都快。从会所出来后他没回屋，径直走向飞场。\n\n到达时阿尔图斯已经在那里等他。\n\n下午的索尔因维克图斯天色灰蒙蒙，云压得很低，把阳光遮得严严实实。阿尔图斯的爬升平稳，很快身下首都的建筑群就缩小成了一个个形状不一的小方块，在这个高度，天空似乎比大地离的更近。萨德里安像昨夜一样靠在巨龙颈后的鳞甲上，没有说话。\n\n离开城市区域后，阿尔图斯转向东北方飞去，这是和昨夜一样的路线。下方奥利提斯平原的覆雪还没有化，大片的白底子上，没被雪掩埋的地方是大片的黑——树林、河流、还没结冰的水洼、岩棱破雪的轮廓。黑与白之间没有过渡，分明得像两种独立的物质。\n\n萨德里安想起石桌上那两堆分明的铁筹，三比五。\n\n他想起托兰西斯二世临终前那个近乎哀求的眼神。\n\n他想起阿尔玛瑞克说“如果是真正的凯撒”那一刻会议厅里几秒钟的安静。\n\n他想起伊蕾妮娅在画像前说“让一个人丢掉他的皇位，他只会想杀了你”。\n\n他想起雷尔金二世初见他时眼里那份不该并存的警惕与请求。\n\n——他不知道自己做的是不是对的。\n\n萨德里安手上的缰绳不自觉地松了又紧，像是一个刚骑上[飞龙](#idx-e292)的新兵。阿尔图斯仿佛感受到了伙伴郁结的心情，开了口。\n\n“今天的事已经发生了。”巨龙的声音和昨夜一样平静，“你做了自己的决定，想清不想清都是这样了。”\n\n萨德里安回以沉默，只是拍了拍阿尔图斯脖颈侧的鳞片。\n\n冷风仍在耳侧呼啸，下方的奥利提斯平原黑与白依旧。一只乌鸦从雪原上掠过，留下一道短促的黑线，消失在远处某片没被雪覆盖的树林里。\n\n阿尔图斯没有改变方向，朝着平原更深处平稳地飞去。\n\n### 四\n\n“我觉得萨德里安可能不会希望更多人知道这个故事。”赫利娅把最后一页手稿放在桌上，抬起头说道。\n\n“确实如此，所以我也并不是想把这篇文章公诸于世。”我从她手下拿过手稿，放回我的夹板里。“只是人的记忆是不可靠的，我不想让他的故事就这样消失，把它记下来是最好的选择。”\n\n赫利娅点点头，转头看向旅店窗外的夜色。[尼托韦德](#idx-e446)是索拉瑞斯很典型的边境小镇，住户不多，更和繁华两字不沾边。此时虽然时间还不算太晚，窗外的灯火基本已经熄灭了。\n\n“我们离索尔因还有多久的路？”\n\n我拿过一旁的地图铺在桌上，确认了一下路线。“我们告别萨德里安、离开[冠脊山脉](#idx-e419)是五天前，目前我们在边境的尼托韦德镇，也就是[尼托雷特行省](#idx-e445)的东边……按这个速度来看，大概还有三十来天的路程。”\n\n“……还要一阵子。”赫利娅把视线投向地图，似乎在检查后续的路线计划。\n\n我意识到她正在斟酌语言。\n\n“多利安……还有虔信者的事，我很抱歉。”\n\n我有些吃惊地抬起头。赫利娅的视线没有离开地图，但她纤长的耳尖在细微颤动。离开忒奥西斯后，我们两人很有默契地都没有提这件事，直至此刻。\n\n“那不是你的错，不全是。”我也谨慎地组织着措辞，“多利安有他自己的选择，我们有我们的。”\n\n赫利娅没有再说话。屋子里只有桌上那盏油灯轻微的爆裂声。\n\n为了打破这种令人难堪的沉默，我尝试转移话题：“说起来，我们和萨德里安分别前，阿尔图斯和你说了什么？当时在场的四位只有我一个人不懂龙语，我很尴尬啊。”\n\n赫利娅的耳尖颤动得微弱了一些，“……没什么。”\n\n我看着她，等她继续。\n\n“它问了我一些路上的事。”赫利娅终于抬眼看了我一下，但视线只停留了一瞬就移开了，“没什么重要的。”\n\n我意识到这是一个被她刻意回避的话题，便也不再追问。两年同行的时间，我们之间或多或少有了一些默契，例如何时应该勒住自己的好奇心。\n\n“明白了。”\n\n沉默再次笼罩了房间。过了一会儿，赫利娅把地图叠起来放回背包里，起身往房间另一头走去。\n\n“我先睡了。”\n\n“晚安。”\n\n她背对着我，在床边躺下，很快传来了均匀的呼吸声。\n\n桌上只剩下那盏油灯和我。\n\n我把稿纸夹再次翻开，从中拿出萨德里安那份手稿，又添了几页空白纸到夹子里。萨德里安的故事我已经写完了，但帝国和龙裔凯撒的故事还没有，比如说，那场战争的后续。\n\n第三次阿索战争最终以索拉瑞斯战败告终，距今已是二十三年前的事。这二十三年间，雷尔金二世从未公开提及过龙骑士团的不参战决议，也没有清算阿尔玛瑞克或其他任何反对者。他像他父亲一样，稳健地、沉默地继续统治索拉瑞斯，继续按照龙裔凯撒的传统走下去，继续背负他父亲临终时不愿让他再背负的东西。\n\n萨德里安的决定是否起到了他想要的作用？\n\n激发改革——没有；削弱圣领的影响力——没有；战后二十多年来圣领与索拉瑞斯的关系反而比战前更紧密。把凯撒从血脉诅咒里解脱出来——更没有。\n\n伊蕾妮娅二十七年前在会议厅的画像下，对萨德里安是这么说的：“让一个人丢掉他的皇位，他只会想杀了你。”\n\n哪怕那皇冠代表着不伦、欺骗和罪恶。\n\n但雷尔金二世选择继续戴着这顶皇冠，是因为他自己醉心权力，还是因为他和他父亲一样想要松手，却被那些靠他活着的人按在御座上？萨德里安到今天没有想出答案，我也不会比萨德里安看得更清楚。\n\n我放下笔，看向窗外。\n\n天黑黢黢的，月亮被云层挡得严严实实。离这个边境小镇两千七百[陆里](#idx-e387)的西南方，索尔因维克图斯沉默地统治着这个建立在龙血与战争之上的帝国。三战已经过去二十三年，按大陆如今各国的政治局面推算，下一场大陆冲突大概不会再让人等太久。\n\n——而那时皇宫深处那个人会做出什么样的选择，我不知道。\n\n我合上稿纸夹，吹熄了油灯。\n\n**塞勒内斯 于大陆历1506年二（清和）季3日 尼托韦德**\n\n**Selenus 1506.II.3 In Nitrewade**"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$2\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"min-h-[60vh] flex items-center jus rue}],\"currentSlug\":\"诸域纪闻 Chronicles of the Realms/沉默者\",\"article\":{\"slug\":\"诸域纪闻 Chronicles of the Realms/沉默者\",\"title\":\"沉默者\",\"titleEn\":\"The Silent One\",\"content\":\"$11\",\"indexTerms\":[{\"id\":\"e0\",\"title\":\"龙语\",\"aliases\":[],\"body\":\"[龙族魔法](#idx-e1)[术式](#idx-e38)所用的咏唱体系，结构特殊，元素消耗极低而[精神力](#idx-e23)消耗极高。\"},{\"id\":\"e1\",\"title\":\"龙族魔法\",\"aliases\":[],\"body\":\"巨龙及龙族亚种所用的种族魔法，学界归类为[神启魔法](#idx-e4)的一种。\"},{\"id\":\"e2\",\"title\":\"秘术式\",\"aliases\":[],\"body\":\"[尼希尔秘术](#idx-e3)施法所用的特殊仪式，将祭品[构成元素](#idx-e18)解离为[无属性元素流](#idx-e42)并转化为魔法。\"},{\"id\":\"e3\",\"title\":\"尼希尔秘术\",\"aliases\":[\"秘术\"],\"body\":\"[尼希尔](#idx-e517)统治阶级独有的魔法体系，简称秘术，以等价交换为原理，解离祭品的[构成元素](#idx-e18)为力量。\"},{\"id\":\"e4\",\"title\":\"神启祷言\",\"aliases\":[\"祷言\",\"神启魔法\"],\"body\":\"[神启学派](#idx-e5)对自身魔法的称呼，简称祷言；亦名神启魔法。\"},{\"id\":\"e5\",\"title\":\"神启学派\",\"aliases\":[],\"body\":\"以[唯一神](#idx-e135)所借权柄使用魔法的学派，编织[术式](#idx-e38)调动环境中游离态的[四大元素](#idx-e39)。\"},{\"id\":\"e6\",\"title\":\"星空学派\",\"aliases\":[],\"body\":\"以[第五元素](#idx-e17)以太的显现与外化解释魔法的学派，[内化](#idx-e30)以太于体内再[显化](#idx-e44)为魔法。\"},{\"id\":\"e7\",\"title\":\"以太星术\",\"aliases\":[\"星术\",\"星空魔法\"],\"body\":\"[星空学派](#idx-e6)对自身魔法的自称，简称星术；亦名星空魔法。狭义专指各类魔法对应的[大星轨](#idx-e16)走势。\"},{\"id\":\"e8\",\"title\":\"自然魔法\",\"aliases\":[\"精灵魔法\",\"圣树魔法\"],\"body\":\"精灵族与生俱来的法术能力，源自与[大圣树](#idx-e214)的契约连接；亦称精灵魔法、圣树魔法。\"},{\"id\":\"e9\",\"title\":\"奥韦纳尔·安柯伦坦\",\"aliases\":[\"安柯伦坦\"],\"body\":\"艾瑟瑞姆[天星师](#idx-e246)，1304年提出智慧生物出生时的[大星轨](#idx-e16)图像决定其[仪式星轨](#idx-e49)特征，且该特征恰合[源星](#idx-e56)五分类，[丝黛兰尔](#idx-e40)的分类法由此成为公认标准。\"},{\"id\":\"e11\",\"title\":\"半龙化\",\"aliases\":[],\"body\":\"人类与巨龙缔结[血契](#idx-e48)后，其思维与立场不可逆地向龙族一侧偏移的现象。\"},{\"id\":\"e16\",\"title\":\"大星轨\",\"aliases\":[\"天道星轨\"],\"body\":\"[天星五政](#idx-e41)在天球上的轨迹，代表宇宙中[以太](#idx-e17)流的流向；亦称天道星轨。\"},{\"id\":\"e17\",\"title\":\"第五元素\",\"aliases\":[\"以太\"],\"body\":\"构成群星与其间空间（宇宙）的物质，通称以太，永恒不朽；稀薄存在于大地之上，[星空魔法](#idx-e7)师可将其蓄积体内，是星术的能量来源。\"},{\"id\":\"e18\",\"title\":\"构成元素\",\"aliases\":[],\"body\":\"构成实体事物的四大[自然元素](#idx-e39)，不响应[祷言](#idx-e4)[术式](#idx-e38)。通过[秘术式](#idx-e2)可将其解离。\"},{\"id\":\"e23\",\"title\":\"精神力\",\"aliases\":[],\"body\":\"编织[祷言](#idx-e4)[术式](#idx-e38)所凭的能力，可经后天训练提高，只能依靠时间缓慢恢复。\"},{\"id\":\"e25\",\"title\":\"洛林阶运\",\"aliases\":[],\"body\":\"特定工艺的[星轨蚀刻](#idx-e76)（如旧式三分耦式蚀刻法）所致的[玛娜](#idx-e26)自然向外部流出的矿界面层现象。\"},{\"id\":\"e26\",\"title\":\"玛娜\",\"aliases\":[\"魔力\"],\"body\":\"[星空学派](#idx-e6)语境下[内化](#idx-e30)后的[以太](#idx-e17)，即俗称的魔力；释放后无法自然恢复，须[星术](#idx-e7)师冥想缓慢补充。\"},{\"id\":\"e29\",\"title\":\"魔元素动力学\",\"aliases\":[],\"body\":\"[神启学派](#idx-e5)中研究元素流动与[疏化](#idx-e37)机理的学科，由[神启魔法](#idx-e4)学者菲略奥斯等人奠基。\"},{\"id\":\"e30\",\"title\":\"内化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师于修习中将环境自由[以太](#idx-e17)汇入体内[仪式星轨](#idx-e49)的过程。\"},{\"id\":\"e36\",\"title\":\"施法者\",\"aliases\":[],\"body\":\"能够主动运用魔法的人口的统称，全大陆约占两成。\"},{\"id\":\"e37\",\"title\":\"疏化\",\"aliases\":[],\"body\":\"同一空间内反复施用[神启魔法](#idx-e4)后[自然元素](#idx-e39)恢复速率异常下降的现象，由神启魔法学者菲略奥斯提出。\"},{\"id\":\"e38\",\"title\":\"术式\",\"aliases\":[],\"body\":\"[神启魔法](#idx-e4)师以[精神力](#idx-e23)编织、临时改写自然法则的结构，是与[唯一神](#idx-e135)所立的单向契约。\"},{\"id\":\"e39\",\"title\":\"四大元素\",\"aliases\":[\"自然元素\"],\"body\":\"构成世界万物和游离在自然环境中的地、水、火、风元素，也称自然元素；唯游离态者可为[神启魔法](#idx-e4)调用。\"},{\"id\":\"e40\",\"title\":\"塔莉拉·丝黛兰尔\",\"aliases\":[\"丝黛兰尔\"],\"body\":\"[星空学派](#idx-e6)魔法先驱，著《[星术](#idx-e7)源流考》，首创以五颗天星对应五类魔法的[源星](#idx-e56)分类法，源星之名即出于此。\"},{\"id\":\"e41\",\"title\":\"天星五政\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)最重要的概念之一，指[冠阳](#idx-e532)、[汐月](#idx-e544)、[仲裁星](#idx-e549)、[烬铸星](#idx-e533)、[织虹星](#idx-e548)五颗天体。\"},{\"id\":\"e42\",\"title\":\"无属性元素流\",\"aliases\":[],\"body\":\"[秘术式](#idx-e2)解离祭品[构成元素](#idx-e18)后所得的能量形态，其性质仍是大陆魔法学界研究的未解课题。\"},{\"id\":\"e44\",\"title\":\"显化\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师控制体内[以太](#idx-e17)流运转特定[大星轨](#idx-e16)、将[玛娜](#idx-e26)转为有色状态并外放的过程。\"},{\"id\":\"e47\",\"title\":\"血脉共鸣\",\"aliases\":[],\"body\":\"[龙骑士](#idx-e295)与流淌龙血者之间的感应；[龙骑士团](#idx-e296)据此判定[凯撒](#idx-e234)血脉的真伪。\"},{\"id\":\"e48\",\"title\":\"血契\",\"aliases\":[],\"body\":\"人类与巨龙缔结的契约，双方精神世界互相开放，可转移龙族[术式](#idx-e38)的[精神力](#idx-e23)消耗。\"},{\"id\":\"e49\",\"title\":\"仪式星轨\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师于体内仿照[大星轨](#idx-e16)建立的[以太](#idx-e17)[回路](#idx-e75)，各部位对应一天宫。\"},{\"id\":\"e52\",\"title\":\"元素丰地\",\"aliases\":[],\"body\":\"游离态[四大元素](#idx-e39)丰度明显高于大陆平均的天然区域，对[疏化](#idx-e37)有强韧抵抗力。\"},{\"id\":\"e56\",\"title\":\"源星\",\"aliases\":[],\"body\":\"[星空魔法](#idx-e7)师[丝黛兰尔](#idx-e40)在《星术源流考》中提出的星术五分类，对应[天星五政](#idx-e41)。\"},{\"id\":\"e61\",\"title\":\"动力炉\",\"aliases\":[],\"body\":\"大型[星术设备](#idx-e85)的供能核心，见于[魔偶](#idx-e83)、[巨像](#idx-e81)与[星术驿车](#idx-e87)等。\"},{\"id\":\"e65\",\"title\":\"高品级魔矿\",\"aliases\":[],\"body\":\"元素储存率极高、可承受各种魔法加工工艺的[魔矿](#idx-e71)，八成以上产自沙阿万。\"},{\"id\":\"e69\",\"title\":\"洛林星元\",\"aliases\":[\"星元\"],\"body\":\"粗加工[魔矿](#idx-e71)晶体经[星轨蚀刻](#idx-e76)、注入[玛娜](#idx-e26)封装的[星术制品](#idx-e88)，通称星元，取名于洛林法蚀刻，可为小型[星术设备](#idx-e85)供能。\"},{\"id\":\"e71\",\"title\":\"魔法矿石\",\"aliases\":[\"魔矿\"],\"body\":\"对五大元素均具极高流通率与储存率的天然矿石，通称魔矿，是大陆最重要的战略资源。\"},{\"id\":\"e73\",\"title\":\"蚀刻魔矿\",\"aliases\":[],\"body\":\"经[星轨蚀刻](#idx-e76)的[魔矿](#idx-e71)，可按[回路](#idx-e75)结构储存[玛娜](#idx-e26)，并在触发时释放对应[星术](#idx-e7)。\"},{\"id\":\"e74\",\"title\":\"托兰瓦尔·洛林\",\"aliases\":[\"洛林\"],\"body\":\"艾瑟瑞姆[天星师](#idx-e246)，1125年首报可流通储存[以太](#idx-e17)的矿石并据以发明[星轨蚀刻](#idx-e76)；洛林法蚀刻为纪念其贡献而名，[洛林星元](#idx-e69)、[洛林阶运](#idx-e25)之名亦由此而来。\"},{\"id\":\"e75\",\"title\":\"星轨回路\",\"aliases\":[\"回路\"],\"body\":\"通过[蚀刻](#idx-e76)在[魔矿](#idx-e71)上建立的模仿[仪式星轨](#idx-e49)的通路，允许魔矿储存[玛娜](#idx-e26)，并在特定条件触发下释放对应[星术](#idx-e7)。\"},{\"id\":\"e76\",\"title\":\"星轨回路蚀刻\",\"aliases\":[\"蚀刻\",\"星轨蚀刻\",\"洛林法蚀刻\"],\"body\":\"于[魔矿](#idx-e71)表面蚀刻[仪式星轨](#idx-e49)[回路](#idx-e75)的技术，简称星轨蚀刻或蚀刻，为纪念发明人，又名洛林法蚀刻。1125年由艾瑟瑞姆[星术](#idx-e7)学者[托兰瓦尔·洛林](#idx-e74)发明，构成了[星术设备](#idx-e85)的基石。\"},{\"id\":\"e81\",\"title\":\"星术巨像\",\"aliases\":[\"巨像\"],\"body\":\"[星术](#idx-e7)兵种的大型作战单位，通称巨像，由专精操作的星术师远距控制。\"},{\"id\":\"e83\",\"title\":\"星术魔偶\",\"aliases\":[\"魔偶\"],\"body\":\"以[蚀刻](#idx-e76)[回路](#idx-e75)驱动的小型[星术](#idx-e7)作战或劳作单位，通称魔偶，有农用魔偶、清扫魔偶等。\"},{\"id\":\"e85\",\"title\":\"星术设备\",\"aliases\":[],\"body\":\"[蚀刻魔矿](#idx-e73)制成的各类器物的统称，自家用台灯至战场[巨像](#idx-e81)[动力炉](#idx-e61)，是艾瑟瑞姆高技术社会立国的物质基础。\"},{\"id\":\"e87\",\"title\":\"星术驿车\",\"aliases\":[],\"body\":\"以[动力炉](#idx-e61)驱动的陆上载具，行于艾瑟瑞姆城市内或城际道路。\"},{\"id\":\"e88\",\"title\":\"星术制品\",\"aliases\":[],\"body\":\"[星术设备](#idx-e85)所需半成品作为贸易品的称呼，[洛林星元](#idx-e69)为其典型代表。\"},{\"id\":\"e99\",\"title\":\"朝圣\",\"aliases\":[],\"body\":\"[正教](#idx-e146)信众沿既定路线前往[圣城索菲亚](#idx-e487)的虔修，是[圣领](#idx-e483)可观的收入来源。\"},{\"id\":\"e100\",\"title\":\"称义\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒持守信仰、按神的教诲生活而得免[宿债](#idx-e131)的全过程，自[洗礼](#idx-e136)始，至临终而成。\"},{\"id\":\"e104\",\"title\":\"大祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)学徒正式受任为神职的[圣事](#idx-e121)。\"},{\"id\":\"e106\",\"title\":\"告解\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒为自身罪行请求赦免的[圣事](#idx-e121)，可反复进行。\"},{\"id\":\"e107\",\"title\":\"公教\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰两大教派之一，1295年[教会大分裂](#idx-e160)后自[阿布丹提亚](#idx-e452)境内的[正教会](#idx-e181)独立而成，以[公教会](#idx-e155)为组织载体，是阿布丹提亚人口的第一大信仰。将[星空魔法](#idx-e7)一并纳入唯一神权柄、另尊保罗为第二先知；主张轻罪可凭虔信与[圣事](#idx-e121)自赦，审判之权唯神独有，故不设[审判庭](#idx-e171)建制并废除[诺万尼斯流放](#idx-e167)，对个人虔修的要求高于[正教](#idx-e146)；[季首弥撒](#idx-e109)与节庆均依[通用历](#idx-e368)。\"},{\"id\":\"e109\",\"title\":\"季首弥撒\",\"aliases\":[],\"body\":\"[正教](#idx-e146)于[仪式历](#idx-e361)各季首日，[公教](#idx-e107)于[通用历](#idx-e368)各季首日举行的规模略大于每周[弥撒](#idx-e113)的集体仪式。\"},{\"id\":\"e110\",\"title\":\"坚振\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中，标志[称义](#idx-e100)大体完成的[圣事](#idx-e121)，一生一次，须对教会有重大贡献或持守信仰足够长久。\"},{\"id\":\"e112\",\"title\":\"礼仪年\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰中六季[弥撒](#idx-e113)与九大节庆构成的一整年宗教循环。\"},{\"id\":\"e113\",\"title\":\"弥撒\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)礼拜日举行的集体仪式，与每日的[日课](#idx-e117)同为[称义](#idx-e100)最重要的日常载体。\"},{\"id\":\"e114\",\"title\":\"冥界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，信徒死后安息、静候轮回之地。\"},{\"id\":\"e117\",\"title\":\"日课\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒每日的功课，与礼拜日[弥撒](#idx-e113)同为[称义](#idx-e100)的日常载体。\"},{\"id\":\"e119\",\"title\":\"圣保罗\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，最初的医者，司治愈与修复；对应[织虹星](#idx-e548)与[虹曜日](#idx-e348)。[公教](#idx-e107)另尊其为第二先知。\"},{\"id\":\"e120\",\"title\":\"圣骸\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下的圣徒遗骨，为[朝圣](#idx-e99)与教堂声望所系，如[潘克拉托](#idx-e485)大教堂所藏的[圣约翰](#idx-e123)圣骸。\"},{\"id\":\"e121\",\"title\":\"圣事\",\"aliases\":[],\"body\":\"指[正教](#idx-e146)与[公教](#idx-e107)六项圣事：[洗礼](#idx-e136)、[坚振](#idx-e110)、婚姻、[告解](#idx-e106)、[大祝职](#idx-e104)、[小祝职](#idx-e138)。\"},{\"id\":\"e122\",\"title\":\"圣伊琳娜\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，司秩序与契约；对应[仲裁星](#idx-e549)与[裁曜日](#idx-e345)，[圣领](#idx-e483)[伊琳娜圣银币](#idx-e341)以其得名。\"},{\"id\":\"e123\",\"title\":\"圣约翰\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之首，[正教](#idx-e146)唯一的先知与弥赛亚，司精神与教导；对应[汐月](#idx-e544)与[月曜日](#idx-e376)。\"},{\"id\":\"e124\",\"title\":\"圣约瑟\",\"aliases\":[],\"body\":\"四[使徒](#idx-e126)之一，商会之圣，司转化、破坏与锻造；对应[烬铸星](#idx-e533)与[烬曜日](#idx-e351)，[圣约瑟商会](#idx-e335)以其得名。\"},{\"id\":\"e126\",\"title\":\"使徒\",\"aliases\":[],\"body\":\"《[索菲亚圣典](#idx-e132)》记载中，随[唯一神](#idx-e135)降世传教的最初四人：约翰、伊琳娜、约瑟、保罗。\"},{\"id\":\"e127\",\"title\":\"十字架\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教会](#idx-e155)共用的宗教象征符号。正教十字架为四端，象征四元素权柄。[公教](#idx-e107)下端另加一横，四横端象征四元素，竖端象征[星术](#idx-e7)。\"},{\"id\":\"e130\",\"title\":\"四界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰神学的宇宙构成：[天界](#idx-e133)、[现界](#idx-e137)、[冥界](#idx-e114)、[虚界](#idx-e141)。\"},{\"id\":\"e131\",\"title\":\"宿债\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰神学中，人一出生便背负的亏欠。缘于唯一神所借予而非赐予的权柄，受惠者无人能置身账外。\"},{\"id\":\"e132\",\"title\":\"索菲亚圣典\",\"aliases\":[\"圣典\"],\"body\":\"[唯一神](#idx-e135)信仰的最高典籍，通称《圣典》，分《创世录》《弥赛亚记》《神言书》《箴言集》四福音与《预言书》。\"},{\"id\":\"e133\",\"title\":\"天界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，唯一神、圣徒与天使的居所。\"},{\"id\":\"e135\",\"title\":\"唯一神\",\"aliases\":[\"主\",\"神\",\"上帝\"],\"body\":\"唯一神信仰所奉的至高神，信徒亦称主、神或上帝，是宇宙的创造者、维系者与监督者，也是世间一切魔法力量的源头。\"},{\"id\":\"e136\",\"title\":\"洗礼\",\"aliases\":[],\"body\":\"[正教](#idx-e146)与[公教](#idx-e107)信徒入教与[称义](#idx-e100)之始的[圣事](#idx-e121)，一生一次，象征认清并领受自身的[宿债](#idx-e131)。\"},{\"id\":\"e137\",\"title\":\"现界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中[四界](#idx-e130)之一，人类生息的世界。\"},{\"id\":\"e138\",\"title\":\"小祝职\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[公教会](#idx-e155)神职人员卸任、复为寻常信徒之礼，多见于年老体弱者。\"},{\"id\":\"e141\",\"title\":\"虚界\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰宇宙观中的[四界](#idx-e130)之一，天球与大地之外仍为虚所充满的空间，罪人与非正信者死后的去处。\"},{\"id\":\"e143\",\"title\":\"异端\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰语境下，秉持不同教义解释相异的教派；就[正教](#idx-e146)而言[公教](#idx-e107)即当代最大异端。\"},{\"id\":\"e146\",\"title\":\"正教\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰两大教派之一，以[正教会](#idx-e181)为组织载体，为[索拉瑞斯](#idx-e429)与[忒奥西斯](#idx-e483)的国教。认[神启祷言](#idx-e4)为唯一神所授的权柄，[星空魔法](#idx-e7)则不在神权之列；一切罪无论大小均须经[告解](#idx-e106)方得赦免，并以神在[现界](#idx-e137)的代行者自任，设[审判庭](#idx-e171)严管神启魔法、以[诺万尼斯流放](#idx-e167)向神赎罪。历法与[礼仪年](#idx-e112)循环依[圣格里仪式历](#idx-e361)。\"},{\"id\":\"e147\",\"title\":\"传信厅\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)[牧首厅](#idx-e166)六分厅之一，分管外交。\"},{\"id\":\"e148\",\"title\":\"大牧首\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)最高元首、[忒奥西斯](#idx-e483)圣领国家元首，由[枢机主教团](#idx-e174)闭门选出，终身任期。\"},{\"id\":\"e149\",\"title\":\"大审判长\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)最高长官，由[枢机主教团](#idx-e174)任命，与[大牧首](#idx-e148)同为终身任期。\"},{\"id\":\"e150\",\"title\":\"第二次宗教改革\",\"aliases\":[],\"body\":\"十三世纪末谋求将[星术](#idx-e7)纳入神权的改革，失败后直接导致[教会大分裂](#idx-e160)。\"},{\"id\":\"e152\",\"title\":\"都主教\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)[都主教区](#idx-e153)长官，教阶在主教之上；与[大牧首](#idx-e148)同不得婚娶，别称[门徒](#idx-e165)。\"},{\"id\":\"e153\",\"title\":\"都主教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)最高一级行政区划和宗教管理区划，全境共五个，长官称[都主教](#idx-e152)。[卡帕尼](#idx-e502)和[索拉瑞斯](#idx-e429)亦设有都主教区，但不具备行政职能。\"},{\"id\":\"e154\",\"title\":\"督审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)教阶之一，位在[审判官](#idx-e169)之上；[审判所](#idx-e162)驻任长官、[审判分庭](#idx-e168)官员。[诺万尼斯流放](#idx-e167)须由审判分庭所属督审判官主刑。\"},{\"id\":\"e155\",\"title\":\"公教会\",\"aliases\":[],\"body\":\"1295年[阿布丹提亚](#idx-e452)境内[正教会](#idx-e181)独立所成立的教会，领袖称[宗主教](#idx-e183)，驻[波马里亚](#idx-e459)。\"},{\"id\":\"e157\",\"title\":\"公教总会\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)中枢，驻[阿布丹提亚帝国](#idx-e452)城市[波马里亚](#idx-e459)。\"},{\"id\":\"e160\",\"title\":\"教会大分裂\",\"aliases\":[],\"body\":\"1295年[第二次宗教改革](#idx-e150)失败后，[阿布丹提亚帝国](#idx-e452)境内[正教会](#idx-e181)宣布脱离[牧首厅](#idx-e166)独立，成立[公教会](#idx-e155)。\"},{\"id\":\"e161\",\"title\":\"教区\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)[都主教区](#idx-e153)下辖的最小一级行政区划，长官称主教。也是[正教会](#idx-e181)在大陆各国所划的宗教事务上的最小管理层级。\"},{\"id\":\"e162\",\"title\":\"教区审判所\",\"aliases\":[\"审判所\"],\"body\":\"[审判庭](#idx-e171)在[教区](#idx-e161)一级所设的分支机构，简称审判所，由[督审判官](#idx-e154)驻任长官。\"},{\"id\":\"e165\",\"title\":\"门徒\",\"aliases\":[],\"body\":\"教会系统中[都主教](#idx-e152)及以上神职，以及[审判庭](#idx-e171)系统中自[督审判官](#idx-e154)及以上职位的别称，象征舍弃现世之乐、专心侍神；门徒不得婚娶。\"},{\"id\":\"e166\",\"title\":\"牧首厅\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)中枢以及[圣领](#idx-e483)最高行政机构，下设[圣礼厅](#idx-e173)、[省察厅](#idx-e179)、[司牧厅](#idx-e177)、[神启厅](#idx-e172)、[传信厅](#idx-e147)、[卫教厅](#idx-e178)六分厅。\"},{\"id\":\"e167\",\"title\":\"诺万尼斯流放\",\"aliases\":[],\"body\":\"[正教会](#idx-e181)与[索拉瑞斯帝国](#idx-e429)维持的一种极刑，将受刑者留置诺万尼斯区域枯竭死地直至器官衰竭。\"},{\"id\":\"e168\",\"title\":\"审判分庭\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)在[都主教区](#idx-e153)一级的机构，长官称审判长，由[大审判长](#idx-e149)直接任命。\"},{\"id\":\"e169\",\"title\":\"审判官\",\"aliases\":[],\"body\":\"[审判庭](#idx-e171)教阶之一，负责日常调查和执行事务，是[圣领](#idx-e483)独立于军事系统的强制执行编制。\"},{\"id\":\"e171\",\"title\":\"审判庭\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)直属司法和执行机构，处理[异端](#idx-e143)事务、追查未经许可的神启施法，拥有独立执法和行刑权。\"},{\"id\":\"e172\",\"title\":\"神启厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管[神启魔法](#idx-e4)事务。\"},{\"id\":\"e173\",\"title\":\"圣礼厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管宗教事务，亦负责[索拉瑞斯](#idx-e429)[凯撒](#idx-e234)的[血脉测试](#idx-e253)。\"},{\"id\":\"e174\",\"title\":\"枢机主教团\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)事实上的最高权力机构，[大牧首](#idx-e148)去世后负责闭门选出继任者。成员由大牧首自[都主教](#idx-e152)中选任。\"},{\"id\":\"e177\",\"title\":\"司牧厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管民生。\"},{\"id\":\"e178\",\"title\":\"卫教厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管军事，战时统一征召[护教军](#idx-e289)。\"},{\"id\":\"e179\",\"title\":\"省察厅\",\"aliases\":[],\"body\":\"[牧首厅](#idx-e166)六分厅之一，分管监察。\"},{\"id\":\"e181\",\"title\":\"正教会\",\"aliases\":[],\"body\":\"[唯一神](#idx-e135)信仰最大教派[正教](#idx-e146)的教会组织，以[忒奥西斯](#idx-e483)圣领[牧首厅](#idx-e166)为教会中枢，同时也是圣领的统治机构。\"},{\"id\":\"e183\",\"title\":\"宗主教\",\"aliases\":[],\"body\":\"[公教会](#idx-e155)领袖，由全大陆[公教](#idx-e107)主教选出三名候选，再由盲眼童贞信徒抽签决定。\"},{\"id\":\"e186\",\"title\":\"大神庙\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)首都[阿尔努尔](#idx-e518)城中的[教长](#idx-e199)驻地，是酋邦的宗教中心与圣地。\"},{\"id\":\"e191\",\"title\":\"玛阿特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中的死后审判仪式，以心脏置于天平称量，砝码为[希塔](#idx-e197)手杖顶端的宝石。\"},{\"id\":\"e197\",\"title\":\"希塔\",\"aliases\":[\"陆之神\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰中六神之一，老者之形，象征万物的终点，司灵魂与审判，看护[至福乐土](#idx-e201)；[玛阿特](#idx-e191)称量由其执行，砝码即其手杖顶端的宝石。\"},{\"id\":\"e199\",\"title\":\"伊玛目教长\",\"aliases\":[\"教长\"],\"body\":\"[尼希尔](#idx-e517)最高元首，简称教长，同时是酋邦的宗教领袖与[酋长会议](#idx-e239)首席。终身制，非世袭，代代以[秘术](#idx-e3)密封诏书委任继承。\"},{\"id\":\"e201\",\"title\":\"至福乐土\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)诸神信仰中，[玛阿特](#idx-e191)称量通过者所被允许进入的永恒安乐之地，由[希塔](#idx-e197)看护。\"},{\"id\":\"e202\",\"title\":\"诸神圣土\",\"aliases\":[],\"body\":\"[尼希尔酋邦](#idx-e517)中由[伊玛目教长](#idx-e199)直辖的宗教领地。含首都[阿尔努尔](#idx-e518)及周边耕地城市，由各部按比例出资供养。\"},{\"id\":\"e211\",\"title\":\"氏族\",\"aliases\":[],\"body\":\"精灵族的社会单位，被喻为[大圣树](#idx-e214)的分枝，各有族长与长老，本族领地内高度自治。\"},{\"id\":\"e213\",\"title\":\"万叶庭\",\"aliases\":[],\"body\":\"精灵族最高权力机构，每三十年于[希尔文尼亚](#idx-e527)召开，全体精灵借[圣树魔法](#idx-e8)旁听并投票。\"},{\"id\":\"e214\",\"title\":\"希尔文诺大圣树\",\"aliases\":[\"圣树\",\"大圣树\",\"圣树之母\"],\"body\":\"圣树信仰唯一的神圣对象，通称大圣树或圣树，矗立于[希尔文尼亚](#idx-e527)祭坛广场；凡有描述皆以女性位格出现，精灵称之为圣树之母，[自然魔法](#idx-e8)即祂分享之力。\"},{\"id\":\"e216\",\"title\":\"叶络枢机院\",\"aliases\":[],\"body\":\"[希尔文诺](#idx-e524)日常行政与对外事务机构，席位由[万叶庭](#idx-e213)轮选，长老兼承宗教职责。\"},{\"id\":\"e218\",\"title\":\"阿斯塔伦·塔利瑞安\",\"aliases\":[\"塔利瑞安\"],\"body\":\"[星术](#idx-e7)泰斗，1097年联合十二城邦创建[大星术研究院](#idx-e226)，即今[王家研究院](#idx-e249)之前身。\"},{\"id\":\"e226\",\"title\":\"大星术研究院\",\"aliases\":[],\"body\":\"1097年由[塔利瑞安](#idx-e218)联合十二城邦创建，艾瑟瑞姆[王家研究院](#idx-e249)前身，是艾瑟瑞姆国家形态的起点。\"},{\"id\":\"e227\",\"title\":\"地星师\",\"aliases\":[],\"body\":\"艾瑟瑞姆[星术](#idx-e7)学者的头衔之一。星术师于所属研究院研究室完成课题答辩，毕业后被授予的头衔。\"},{\"id\":\"e228\",\"title\":\"帝政省\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)的一级行政区划，共五个，与皇室直辖的[维里迪亚直辖省](#idx-e481)并列；省政府为中央[内阁](#idx-e237)的地方分支。原为六省，[卡帕尼](#idx-e502)独立后余五省。\"},{\"id\":\"e230\",\"title\":\"公爵领\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)最高级别的贵族封地，各[帝政省](#idx-e228)含一到两个公爵领。\"},{\"id\":\"e231\",\"title\":\"管理局\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[特贸区](#idx-e505)的立法与行政机构，由区内各商会分部选派代表组成，最高长官称管理局主席。\"},{\"id\":\"e232\",\"title\":\"军团行省\",\"aliases\":[\"行省\"],\"body\":\"[索拉瑞斯](#idx-e429)的一级行政区划，一行省对应一[军团](#idx-e294)，共八个，长官称[行省总督](#idx-e251)。\"},{\"id\":\"e233\",\"title\":\"龙裔继嗣法\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)开国皇帝[阿利昂](#idx-e235)晚年制定的皇位继承法，以直系子嗣的龙血浓度为据，由[牧首厅](#idx-e166)主持[血脉测试](#idx-e253)。\"},{\"id\":\"e234\",\"title\":\"龙裔凯撒\",\"aliases\":[\"凯撒\"],\"body\":\"[索拉瑞斯](#idx-e429)最高统治者的称号，简称凯撒，即位须由[大牧首](#idx-e148)主持册封礼，体现君权神授。\"},{\"id\":\"e235\",\"title\":\"马尔奇安·阿利昂\",\"aliases\":[\"阿利昂\"],\"body\":\"[索拉瑞斯](#idx-e429)开国[凯撒](#idx-e234)，人龙混血，受[大牧首](#idx-e148)册封为首位龙裔凯撒；捐帝国东部领土立[忒奥西斯](#idx-e483)圣领，晚年制定《[龙裔继嗣法](#idx-e233)》。\"},{\"id\":\"e237\",\"title\":\"内阁\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)和[阿布丹提亚帝国](#idx-e452)的中央机构之一。均指直属于王室/皇室的日常行政机构，各有大臣分管外交、军务、内务与王室/皇室财政。\"},{\"id\":\"e239\",\"title\":\"酋长会议\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)最高权力机构，由[教长](#idx-e199)与各部落酋长组成，每年[金素](#idx-e350)季于[阿尔努尔](#idx-e518)召开，协商全酋邦外交、军事与内政事宜。\"},{\"id\":\"e240\",\"title\":\"三柱议会\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)最高立法与财政机构，1393年确立，三柱指皇室、贵族与魔法阶级。\"},{\"id\":\"e244\",\"title\":\"特别仪式区\",\"aliases\":[],\"body\":\"位于艾瑟瑞姆中南部最[大平原](#idx-e453)，专用于王国[星术](#idx-e7)研究与设备制造，行政直属国王/女王。\"},{\"id\":\"e245\",\"title\":\"特区商法典\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[北部特贸区](#idx-e505)适用的独立法系，不同于各公国法系。\"},{\"id\":\"e246\",\"title\":\"天星师\",\"aliases\":[],\"body\":\"[星术](#idx-e7)学者的最高阶头衔与职位，授予学术成果极为杰出的[地星师](#idx-e227)。[托兰瓦尔·洛林](#idx-e74)、[奥韦纳尔·安柯伦坦](#idx-e9)等均曾任天星师。\"},{\"id\":\"e247\",\"title\":\"天星首席\",\"aliases\":[],\"body\":\"艾瑟瑞姆[王家研究院](#idx-e249)最高级别学者之职，永久由艾瑟瑞姆国王或女王兼任。\"},{\"id\":\"e248\",\"title\":\"王冠领地\",\"aliases\":[],\"body\":\"艾瑟瑞姆国王直辖之地，含以首都[阿斯托利亚](#idx-e495)为首的[坠星湖](#idx-e501)南岸城市群。\"},{\"id\":\"e249\",\"title\":\"王家研究院\",\"aliases\":[],\"body\":\"艾瑟瑞姆学术中枢，前身为[大星术研究院](#idx-e226)，兼掌王室继承事务与[特别仪式区](#idx-e244)管理，院长即[天星首席](#idx-e247)，永久由国王或女王兼任。\"},{\"id\":\"e251\",\"title\":\"行省总督\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团行省](#idx-e232)最高长官，由[军团](#idx-e294)长兼任，任期二十年，每年赴首都[索尔因](#idx-e448)叙职。\"},{\"id\":\"e252\",\"title\":\"叙职大会\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八位[行省总督](#idx-e251)每年赴[索尔因](#idx-e448)向[凯撒](#idx-e234)当面汇报施政与军务的会议。\"},{\"id\":\"e253\",\"title\":\"血脉测试\",\"aliases\":[],\"body\":\"《[龙裔继嗣法](#idx-e233)》规定的继承资格测试，由[牧首厅](#idx-e166)[圣礼厅](#idx-e173)主持，每代[凯撒](#idx-e234)继承人均须重测。\"},{\"id\":\"e255\",\"title\":\"御令\",\"aliases\":[],\"body\":\"指[索拉瑞斯帝国](#idx-e429)[凯撒](#idx-e234)签发的各类诏令与敕令。\"},{\"id\":\"e256\",\"title\":\"御前参谋部\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)最高军事机构，直属[凯撒](#idx-e234)，主理战略与军事调度。\"},{\"id\":\"e259\",\"title\":\"仲裁所\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)[特贸区](#idx-e505)[管理局](#idx-e231)下属机构，承担特贸区司法职能。\"},{\"id\":\"e263\",\"title\":\"阿索战争\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)与[索拉瑞斯帝国](#idx-e429)之间的三次大规模战争（1290–1292、1351–1356、1479–1483）。\"},{\"id\":\"e264\",\"title\":\"布兰顿和约\",\"aliases\":[],\"body\":\"[第二次阿索战争](#idx-e269)停战和约，以[布兰顿河](#idx-e463)下游为两国新界，[布兰顿](#idx-e462)城割予[索拉瑞斯](#idx-e429)。\"},{\"id\":\"e265\",\"title\":\"布兰顿战役\",\"aliases\":[],\"body\":\"1479年[三战](#idx-e270)前期的一场决定性会战，[阿布丹提亚帝国](#idx-e452)获得战略性胜利。\"},{\"id\":\"e269\",\"title\":\"第二次阿索战争\",\"aliases\":[\"二战\"],\"body\":\"于1351–1356年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第二次大规模战争，[忒奥西斯](#idx-e483)保持中立。索拉瑞斯获胜，得[西比尔平原](#idx-e492)南部与[布兰顿](#idx-e462)城，停战于《[布兰顿和约](#idx-e264)》；阿布丹提亚放弃[卡帕尼](#idx-e502)群岛，卡帕尼同年独立。\"},{\"id\":\"e270\",\"title\":\"第三次阿索战争\",\"aliases\":[\"三战\"],\"body\":\"于1479–1483年[索拉瑞斯](#idx-e429)与[阿布丹提亚](#idx-e452)发生的第三次大规模战争，阿布丹提亚获胜。停战于《[卡斯特鲁姆和约](#idx-e275)》，索拉瑞斯向阿布丹提亚归还[大运河](#idx-e427)下游东岸两座城市及其周边土地，两国当代边界由此确立。\"},{\"id\":\"e273\",\"title\":\"黑暗时代\",\"aliases\":[],\"body\":\"指八世纪[七王约](#idx-e280)瓦解后，西诺拉尼亚地区长达数百年的多国混战时期。\"},{\"id\":\"e274\",\"title\":\"继承战争\",\"aliases\":[],\"body\":\"1402–1433年[索拉瑞斯帝国](#idx-e429)因第七代[龙裔凯撒](#idx-e234)子嗣血脉不达标而起的三十年内战。最终中辖[军团](#idx-e294)胜出，其支持的三皇子后加冕为第八代凯撒雷尔金一世。\"},{\"id\":\"e275\",\"title\":\"卡斯特鲁姆和约\",\"aliases\":[],\"body\":\"[第三次阿索战争](#idx-e270)停战和约，确立阿索当代边界；[大运河](#idx-e427)下游东岸两城交接至今悬而未决。\"},{\"id\":\"e276\",\"title\":\"林缘议厅\",\"aliases\":[],\"body\":\"1203年[希尔文诺](#idx-e524)[叶络枢机院](#idx-e216)于[冠脊山脉](#idx-e419)东南脉隘口所设，是当前大陆唯一公认的中立缔约见证机构。\"},{\"id\":\"e280\",\"title\":\"七王约\",\"aliases\":[],\"body\":\"328年西诺拉尼亚七国建立的松散邦联，存续约四个世纪，八世纪中叶瓦解。\"},{\"id\":\"e289\",\"title\":\"护教军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)最主要的常规部队，下分五个师，由各[都主教区](#idx-e153)分别组建。\"},{\"id\":\"e291\",\"title\":\"近卫龙骑兵团\",\"aliases\":[\"龙骑兵团\"],\"body\":\"[索拉瑞斯](#idx-e429)以[飞龙](#idx-e292)为坐骑的精锐常规部队，通称龙骑兵团，直属[凯撒](#idx-e234)，约八万头飞龙、五万人编制，跨地形作战能力冠绝大陆。\"},{\"id\":\"e292\",\"title\":\"巨龙眷属\",\"aliases\":[\"飞龙\"],\"body\":\"巨龙与大型野兽的混血飞行亚种，通称飞龙，寿约五百年，是[龙骑兵团](#idx-e291)的坐骑。\"},{\"id\":\"e294\",\"title\":\"军团\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)最高军事编制，与[行省](#idx-e232)一体，下设团、大队、小队。\"},{\"id\":\"e295\",\"title\":\"龙骑士\",\"aliases\":[],\"body\":\"与巨龙缔结[血契](#idx-e48)、得以释放[龙族魔法](#idx-e1)的人类战士，存在[半龙化](#idx-e11)现象。\"},{\"id\":\"e296\",\"title\":\"龙骑士团\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)的顶级战力，成员皆与巨龙缔结[血契](#idx-e48)，效忠[凯撒](#idx-e234)本人而非帝国，团内以多数决议事。\"},{\"id\":\"e301\",\"title\":\"圣礼骑士\",\"aliases\":[],\"body\":\"由[大牧首](#idx-e148)册封的[龙骑士](#idx-e295)，席位限一人，承担[圣领](#idx-e483)防卫义务，但编制上仍属[龙骑士团](#idx-e296)。\"},{\"id\":\"e302\",\"title\":\"圣仪军\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)直属的精锐法术作战部队，大陆规模最大的法术军力，兼承民间大型工程建设。\"},{\"id\":\"e321\",\"title\":\"河金\",\"aliases\":[],\"body\":\"船只通行[索菲亚大运河](#idx-e427)所缴的费用，是[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)的重要常规收入。\"},{\"id\":\"e335\",\"title\":\"圣约瑟商会\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)[牧首厅](#idx-e166)直属商会，垄断圣领境内外一切贸易，学界普遍认为兼具情报网络职能。\"},{\"id\":\"e338\",\"title\":\"索利亚商会\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)商会之一，1489年前后由卡涅·道格拉斯创办，以[星术设备](#idx-e85)半成品与[魔矿](#idx-e71)原料分销起家，后跃居联邦前列。\"},{\"id\":\"e341\",\"title\":\"伊琳娜圣银币\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)流通货币，以高含银量铸造并防伪，与[索拉瑞斯](#idx-e429)铁钞按一比一互认流通。\"},{\"id\":\"e344\",\"title\":\"自由港\",\"aliases\":[],\"body\":\"[特贸区](#idx-e505)所设、享有极高自治权的港口体系，是国际贸易量激增的制度前提。\"},{\"id\":\"e345\",\"title\":\"裁曜日\",\"aliases\":[\"圣伊琳娜日\"],\"body\":\"[通用历](#idx-e368)一周第二日，亦简称星期二；[仪式历](#idx-e361)作圣伊琳娜日，对应天星[仲裁星](#idx-e549)。\"},{\"id\":\"e346\",\"title\":\"大陆历\",\"aliases\":[],\"body\":\"[通用历](#idx-e368)纪年，以[唯一神](#idx-e135)降临传教义于[圣约翰](#idx-e123)之年为元年，元年之前称元前。\"},{\"id\":\"e348\",\"title\":\"虹曜日\",\"aliases\":[\"圣保罗日\"],\"body\":\"[通用历](#idx-e368)一周第四日，亦简称星期四；[仪式历](#idx-e361)作圣保罗日，对应天星[织虹星](#idx-e548)。\"},{\"id\":\"e350\",\"title\":\"金素\",\"aliases\":[\"圣献\",\"冕宫月\",\"肆位\"],\"body\":\"一年六季的第四季，各地作物相继采收。[仪式历](#idx-e361)同季作圣献，艾瑟瑞姆[星历](#idx-e371)作冕宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作肆位。\"},{\"id\":\"e351\",\"title\":\"烬曜日\",\"aliases\":[\"圣约瑟日\"],\"body\":\"[通用历](#idx-e368)一周第三日，亦简称星期三；[仪式历](#idx-e361)作圣约瑟日，对应天星[烬铸星](#idx-e533)。\"},{\"id\":\"e353\",\"title\":\"凛寒\",\"aliases\":[\"正炼\",\"琴宫月\",\"陆位\"],\"body\":\"一年六季的第六季，山地封路、[凛冰洋](#idx-e423)冰封，大陆整体进入年内节律最为收缩的状态。[仪式历](#idx-e361)同季作正炼，艾瑟瑞姆[星历](#idx-e371)作琴宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作陆位。\"},{\"id\":\"e356\",\"title\":\"启蛰\",\"aliases\":[\"晖醒\",\"天宫月\",\"壹位\"],\"body\":\"一年六季的第一季，[通用历](#idx-e368)岁首所在。[凛冰洋](#idx-e423)浮冰退散、山地封雪消融、两河进入汛期，各地贸易与出行随之重新活跃。[仪式历](#idx-e361)同季作晖醒，艾瑟瑞姆[星历](#idx-e371)作天宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作壹位。\"},{\"id\":\"e357\",\"title\":\"清和\",\"aliases\":[\"垂恩\",\"船宫月\",\"贰位\"],\"body\":\"一年六季的第二季，气候达到全年最宜人的状态，远洋航运与陆上商路均进入最活跃的窗口。[仪式历](#idx-e361)同季作垂恩，艾瑟瑞姆[星历](#idx-e371)作船宫月，[尼希尔](#idx-e517)[萨辛历](#idx-e359)作贰位。\"},{\"id\":\"e358\",\"title\":\"日曜日\",\"aliases\":[\"圣神日\"],\"body\":\"[通用历](#idx-e368)一周第五日，亦简称星期日；[仪式历](#idx-e361)作圣神日，对应天星[冠阳](#idx-e532)，是信众向[唯一神](#idx-e135)礼拜的礼拜日。\"},{\"id\":\"e359\",\"title\":\"萨辛历\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)地方历法，以当代伊玛目称号纪年，每代即位则重置元年，六季称[壹位](#idx-e356)至[陆位](#idx-e353)。\"},{\"id\":\"e361\",\"title\":\"圣格里仪式历\",\"aliases\":[\"仪式历\"],\"body\":\"[正教会](#idx-e181)原始历法，[通用历](#idx-e368)前身，[圣领](#idx-e483)与[索拉瑞斯](#idx-e429)的官方历法，六季与五日均保留宗教命名。\"},{\"id\":\"e368\",\"title\":\"通用历\",\"aliases\":[\"格里历\"],\"body\":\"大陆通行的太阳历，一年六季、每季五十日、每旬十日、每周五日；别称格里历，源自[正教会](#idx-e181)的[圣格里仪式历](#idx-e361)，经[公教会](#idx-e155)世俗化后扩散全大陆。\"},{\"id\":\"e371\",\"title\":\"星历\",\"aliases\":[],\"body\":\"艾瑟瑞姆地方历法，大陆唯一的月亮历，六月之名取自黄道六宫。\"},{\"id\":\"e376\",\"title\":\"月曜日\",\"aliases\":[\"圣约翰日\"],\"body\":\"[通用历](#idx-e368)一周第一日，亦简称星期一；[仪式历](#idx-e361)作圣约翰日，对应天星[汐月](#idx-e544)，是四个劳作日之首。\"},{\"id\":\"e378\",\"title\":\"步米\",\"aliases\":[],\"body\":\"长度基本单位，源自[索拉瑞斯](#idx-e429)[军团](#idx-e294)标准行军步伐；一步米等于十分步米等于一百厘步米。\"},{\"id\":\"e385\",\"title\":\"界石\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[军团](#idx-e294)沿主干道每千步所立的里程标记，亦为[陆里](#idx-e387)之所本。\"},{\"id\":\"e387\",\"title\":\"陆里\",\"aliases\":[],\"body\":\"长度单位，一陆里等于一千[步米](#idx-e378)，源自[军团](#idx-e294)沿主干道每千步立一[界石](#idx-e385)的传统。\"},{\"id\":\"e395\",\"title\":\"星度\",\"aliases\":[],\"body\":\"温度基本单位，源自[王家研究院](#idx-e249)的[魔矿](#idx-e71)[蚀刻](#idx-e76)环境控制需求，以纯水冰点为零、沸点为一百。\"},{\"id\":\"e408\",\"title\":\"托伊尔莓\",\"aliases\":[],\"body\":\"[圣领](#idx-e483)代表性染料作物，提取亮蓝色染料后的脱色副产物是上好的发酵原料。\"},{\"id\":\"e409\",\"title\":\"托伊尔莓酒\",\"aliases\":[],\"body\":\"以[托伊尔莓](#idx-e408)脱色副产物酿造的酒，既用于宗教仪式，也作奢侈品出口。\"},{\"id\":\"e412\",\"title\":\"神遴者\",\"aliases\":[\"神遴者阶层\"],\"body\":\"[尼希尔](#idx-e517)诸神信仰的[玛阿特](#idx-e191)称量中，心脏与宝石恰成平衡者。宗教解释中，他们身负引导众生的责任，受赐[秘术](#idx-e3)之力转生现世；作为一个阶层，神遴者垄断了酋邦一切政治职位，[教长](#idx-e199)、祭司、部落酋长与长老无一例外皆出于此。\"},{\"id\":\"e413\",\"title\":\"北门湾\",\"aliases\":[],\"body\":\"[凛冰洋](#idx-e423)伸入大陆中部的内湾，位于[忒奥西斯](#idx-e483)北境，是[索菲亚大运河](#idx-e427)的北端入口。[尼希尔](#idx-e517)[魔矿](#idx-e71)经凛冰洋航线抵此南下，是当代大陆最重要跨洋贸易干线上的节点；[运河仪所](#idx-e493)即设于湾口。\"},{\"id\":\"e414\",\"title\":\"晨风海\",\"aliases\":[],\"body\":\"大陆东南方海域，洋流自东往西、往北持续输送暖湿气流深入内陆，是[阿布丹提亚大平原](#idx-e453)优良农业气候的关键成因。[马提尼河](#idx-e471)与[波特利亚河](#idx-e461)汇流后注入此海。\"},{\"id\":\"e415\",\"title\":\"大星洋\",\"aliases\":[],\"body\":\"大陆西侧海域，洋流复杂多变，深远洋几无成规模的远洋航行；较活跃者唯[索拉瑞斯](#idx-e429)西海岸的近海航线，串联[镜心湖](#idx-e436)产区与西南偏远[行省](#idx-e232)。其偏暖洋流携湿润气流北上，遇[裂境山脉](#idx-e422)与[冠脊山脉](#idx-e419)抬升成雨，是索拉瑞斯森林覆盖率过半的核心水分来源。\"},{\"id\":\"e416\",\"title\":\"翡翠海峡\",\"aliases\":[],\"body\":\"大陆南方水域，全大陆航运最繁忙之处，[卡帕尼](#idx-e502)群岛与大陆本体之间的物流几乎全经于此，亦是[索菲亚大运河](#idx-e427)的南端出口。卡帕尼北部岛链水文条件优越、港口全年可用，是这条贸易干线的天然枢纽。\"},{\"id\":\"e419\",\"title\":\"冠脊山脉\",\"aliases\":[],\"body\":\"大陆规模最大的山脉系统，分北、西、东南、南四脉。北脉与西脉合围[尼希尔](#idx-e517)南侧边境，北脉与东南脉之间夹含[希尔文诺大森林](#idx-e528)，南脉则完全位于[索拉瑞斯](#idx-e429)境内。冠脊山脉北脉同时是大陆西部最重要的气候屏障，其北为尼希尔干旱荒漠，其南为[希尔文诺](#idx-e524)封闭湿润的万年密林，是大陆诸域中最极端的毗邻气候对照。\"},{\"id\":\"e422\",\"title\":\"裂境山脉\",\"aliases\":[],\"body\":\"南北走向纵贯[索拉瑞斯](#idx-e429)中部，是帝国东西地形的核心分界线：以东为[奥利提斯平原](#idx-e430)，落在其雨影区而气候偏干；以西地势平缓，[镜心湖](#idx-e436)居中。沿线铁铜矿藏富集，是大陆冶铁产业最重要的原料来源；[索尔河](#idx-e447)发源于其南麓。\"},{\"id\":\"e423\",\"title\":\"凛冰洋\",\"aliases\":[],\"body\":\"大陆北方极寒洋，以东西向洋流为主，北部与东部全年有浮冰，渔业与运输活动仅集中于中西部海域；对大陆只输出严寒与干燥。[尼希尔](#idx-e517)[魔矿](#idx-e71)出口的主干路线即自两河出海口北上进入此洋，东行抵[北门湾](#idx-e413)后南下入[大运河](#idx-e427)。\"},{\"id\":\"e427\",\"title\":\"索菲亚大运河\",\"aliases\":[\"大运河\"],\"body\":\"[忒奥西斯](#idx-e483)与[索拉瑞斯](#idx-e429)联合开凿的人工水道，1381–1388年历时七年建成，以[圣仪军](#idx-e302)的[神启魔法](#idx-e4)为主力，是[大陆历](#idx-e346)史上最庞大的人造工程。自[北门湾](#idx-e413)几乎垂直向南贯穿[西比尔平原](#idx-e492)，南端注入[翡翠海峡](#idx-e416)，将[凛冰洋](#idx-e423)与翡翠海峡物理贯通，从根本上重塑了大陆南北贸易格局。管理权归圣领，凡向其报备货物并缴纳[河金](#idx-e321)的船只不分国籍皆可通行。\"},{\"id\":\"e429\",\"title\":\"索拉瑞斯帝国\",\"aliases\":[\"索拉瑞斯\"],\"body\":\"位于大陆中西部的军事集权帝制大国，首都[索尔因维克图斯](#idx-e448)。1159年[索拉尔王国](#idx-e541)国王[阿利昂](#idx-e235)统一西大陆诸国、受牧首册封为首代[龙裔凯撒](#idx-e234)而立国。国土一千一百二十万平方[陆里](#idx-e387)，划为八个[军团行省](#idx-e232)，逾七成为群山与原始森林，人口约四千二百万。以[军团](#idx-e294)—行省一体化制度与[龙骑兵团](#idx-e291)著称，尊[正教](#idx-e146)为国教，逾八成公民为正教信徒；外交强势，与[阿布丹提亚](#idx-e452)共构当代大陆两极。\"},{\"id\":\"e430\",\"title\":\"奥利提斯平原\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)境内[裂境山脉](#idx-e422)以东呈东北—西南走向的狭长平原，是帝国最主要的农业区与人口集中地之一，首都[索尔因维克图斯](#idx-e448)位于其西南角。因落在裂境山脉雨影区，气候较[镜心湖](#idx-e436)区偏干。\"},{\"id\":\"e436\",\"title\":\"镜心湖\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)西部的湖泊，是帝国最重要的农业产区核心与人口最密集的区域之一。受[大星洋](#idx-e415)暖流直接调节，湖体又进一步平抑温差，是帝国内气候最温和宜居的地带。[纳赫尔河](#idx-e520)发源于此；东岸最大城市为[雷克西姆](#idx-e440)。\"},{\"id\":\"e437\",\"title\":\"镜心湖行省\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)八个[军团行省](#idx-e232)之一，位于帝国西部，环[镜心湖](#idx-e436)而设，首府[雷克西姆](#idx-e440)。\"},{\"id\":\"e440\",\"title\":\"雷克西姆\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[镜心湖行省](#idx-e437)首府，[镜心湖](#idx-e436)东岸最大城市，建有[圣保罗](#idx-e119)大教堂。堂中无[圣骸](#idx-e120)，仅供奉据称是保罗生前所披的斗篷——保罗殉道之处据《保罗福音》末章推测邻近镜心湖，[正教会](#idx-e181)因此在雷克西姆建立大教堂。\"},{\"id\":\"e445\",\"title\":\"尼托雷特行省\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)八个[军团行省](#idx-e232)之一，位于东部边境地带，下辖[尼托韦德](#idx-e446)等边境聚落。\"},{\"id\":\"e446\",\"title\":\"尼托韦德\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)[尼托雷特行省](#idx-e445)东部的边境小镇，住户不多，偏僻清冷，距首都[索尔因维克图斯](#idx-e448)约两千七百[陆里](#idx-e387)。\"},{\"id\":\"e447\",\"title\":\"索尔河\",\"aliases\":[],\"body\":\"[索拉瑞斯](#idx-e429)境内河流。发源于[裂境山脉](#idx-e422)南麓，流经首都[索尔因维克图斯](#idx-e448)后向东南注入艾瑟瑞姆境内的[坠星湖](#idx-e501)，是帝国重要的内河水系。\"},{\"id\":\"e448\",\"title\":\"索尔因维克图斯\",\"aliases\":[\"索尔因\"],\"body\":\"[索拉瑞斯帝国](#idx-e429)首都，通称索尔因，位于[奥利提斯平原](#idx-e430)西南角，[索尔河](#idx-e447)流经其间。是帝国的政治军事中心与最大城市，八位[行省总督](#idx-e251)每年赴此参加[叙职大会](#idx-e252)；城南设有[龙骑士团](#idx-e296)驻地与飞场。\"},{\"id\":\"e452\",\"title\":\"阿布丹提亚帝国\",\"aliases\":[\"阿布丹提亚\",\"丹提亚帝国\"],\"body\":\"通称丹提亚帝国，位于大陆东南方[大平原](#idx-e453)的君主宪政制大国，首都[维里迪亚](#idx-e480)。386年卡立曼·费内尔统一诸国建立帝政，费内尔家族统治延续至今；两次[阿索战争](#idx-e263)失利后于1393年建[三柱议会](#idx-e240)，和平演变为君主立宪制国家。国土八百七十万平方[陆里](#idx-e387)，划为五个[帝政省](#idx-e228)和一个直辖省，人口逾六千二百万，为全大陆最多。大陆第一大粮食出口国与政治东极，约七成人口信奉[公教](#idx-e107)。\"},{\"id\":\"e453\",\"title\":\"阿布丹提亚大平原\",\"aliases\":[\"大平原\"],\"body\":\"[阿布丹提亚帝国](#idx-e452)国土主体，大陆东部平原带规模最大的一部分，为全大陆最集中的农业核心地带。地势平坦开阔，水系极为发达，冲积土壤肥沃；中部核心区无霜期长而几无结冻，是帝国粮食、棉花与人口的集中所在，首都[维里迪亚](#idx-e480)居其腹地。\"},{\"id\":\"e459\",\"title\":\"波马里亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内位于[润溪湖](#idx-e474)西南方的重要城市。是大陆东部已知元素丰度最高的城市之一，天然宜居且对元素[疏化](#idx-e37)抵抗力强。历史上曾为[正教会](#idx-e181)在东诺拉尼亚最重要的宗教驻地，[教会大分裂](#idx-e160)后成为[公教总会](#idx-e157)所在地；[公教会](#idx-e155)于十四世纪宣称寻得的[圣保罗](#idx-e119)[圣骸](#idx-e120)即供奉于波马里亚大教堂。该城亦是波马里亚[公爵领](#idx-e230)首府，同名[帝政省](#idx-e228)的省名即出于此。\"},{\"id\":\"e461\",\"title\":\"波特利亚河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内的主要河流之一，发源自[葛林沃尔克](#idx-e525)南脉南麓，与[马提尼河](#idx-e471)于[大平原](#idx-e453)中部汇流后注入[晨风海](#idx-e414)，两河交汇处即首都[维里迪亚](#idx-e480)所在。\"},{\"id\":\"e462\",\"title\":\"布兰顿\",\"aliases\":[],\"body\":\"[布兰顿河](#idx-e463)东岸城市，位于河流中游。[第二次阿索战争](#idx-e269)后依《[布兰顿和约](#idx-e264)》割予[索拉瑞斯](#idx-e429)，此后一百二十余年是帝国边境最靠东的据点。1479年[三战](#idx-e270)开战之初为[阿布丹提亚](#idx-e452)夺取，此后终战未再易手，现归属于阿布丹提亚。\"},{\"id\":\"e463\",\"title\":\"布兰顿河\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)境内河流。自北向南流经[西比尔平原](#idx-e492)东南缘，中段接纳一条自西而来的支流后折向东南，于[法拉利亚](#idx-e465)一带入海；[第二次阿索战争](#idx-e269)后其下游为阿索两国界河，《[布兰顿和约](#idx-e264)》即以此河命名，1479年[布兰顿战役](#idx-e265)的战场亦在其中下游两岸。\"},{\"id\":\"e465\",\"title\":\"法拉利亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)境内，[布兰顿河](#idx-e463)入[翡翠海峡](#idx-e416)河口处的港镇。\"},{\"id\":\"e471\",\"title\":\"马提尼河\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)第一大河，发源于[穗满湖](#idx-e477)，向东南流经[大平原](#idx-e453)后与[波特利亚河](#idx-e461)汇流注入[晨风海](#idx-e414)，两河交汇处即首都[维里迪亚](#idx-e480)所在。\"},{\"id\":\"e474\",\"title\":\"润溪湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)双湖之东者，与[穗满湖](#idx-e477)并称双湖，是帝国北部水系的重要源头。湖运承担北部矿区矿产向核心区的输送；西南方为[元素丰地](#idx-e52)城市[波马里亚](#idx-e459)。\"},{\"id\":\"e477\",\"title\":\"穗满湖\",\"aliases\":[],\"body\":\"[阿布丹提亚](#idx-e452)双湖之西者，与[润溪湖](#idx-e474)并称双湖。湖区周边水草丰美，是全大陆最集中的规模化牧区；[马提尼河](#idx-e471)发源于此。\"},{\"id\":\"e480\",\"title\":\"维里迪亚\",\"aliases\":[],\"body\":\"[阿布丹提亚帝国](#idx-e452)首都，位于[马提尼河](#idx-e471)与[波特利亚河](#idx-e461)交汇处、[大平原](#idx-e453)腹地，是帝国政治文化中心，也是帝国最重要的内河航运枢纽之一。城市内歌剧院与画廊林立，素有\\\"艺术之都\\\"之称。\"},{\"id\":\"e481\",\"title\":\"维里迪亚直辖省\",\"aliases\":[\"首都直辖省\"],\"body\":\"[阿布丹提亚帝国](#idx-e452)六个一级行政区中唯一由皇室直辖者，亦称首都直辖省，位于帝国西南，含首都[维里迪亚](#idx-e480)及周边；境内不设贵族封地与[帝政省](#idx-e228)政府，是该国唯一的直辖省。\"},{\"id\":\"e483\",\"title\":\"忒奥西斯圣治领\",\"aliases\":[\"忒奥西斯\",\"圣治领\",\"圣领\"],\"body\":\"通称圣治领或圣领，位于大陆中央北部的[正教会](#idx-e181)神权共和国，首都[圣城索菲亚](#idx-e487)。1159年[索拉瑞斯](#idx-e429)开国[凯撒](#idx-e234)[阿利昂](#idx-e235)将帝国东部领土捐献给[大牧首](#idx-e148)而立，是正教会取得世俗领地后的政治实体。国土两百三十万平方[陆里](#idx-e387)，划为五个[都主教区](#idx-e153)，人口一千三百万。大牧首兼国家元首，[牧首厅](#idx-e166)为最高行政机构；直属[圣仪军](#idx-e302)兼掌国防与大型工程，[索菲亚大运河](#idx-e427)即其代表成果。\"},{\"id\":\"e485\",\"title\":\"潘克拉托\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)境内城市，[圣约翰都主教区](#idx-e489)的都教座城。[圣约翰](#idx-e123)殉道之地，[圣骸](#idx-e120)存于圣约翰大教堂。\"},{\"id\":\"e487\",\"title\":\"圣城索菲亚\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领首都，[大牧首](#idx-e148)及[牧首厅](#idx-e166)所在地。相传为[唯一神](#idx-e135)降临之处，本为小村，圣领建立及[大运河](#idx-e427)开通后扩张为兼具政治、宗教与经济中心地位的大都会。是大陆中部已知最大的[元素丰地](#idx-e52)，也是[正教会](#idx-e181)立都于此的重要自然前提；索菲亚大教堂藏有据称是[圣约翰](#idx-e123)升天时所钉[十字架](#idx-e127)的原木碎片。\"},{\"id\":\"e489\",\"title\":\"圣约翰都主教区\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领西南部[都主教区](#idx-e153)，以四[使徒](#idx-e126)之首[圣约翰](#idx-e123)命名，辖存有圣约翰[圣骸](#idx-e120)的[潘克拉托](#idx-e485)等地。\"},{\"id\":\"e492\",\"title\":\"西比尔平原\",\"aliases\":[],\"body\":\"[忒奥西斯](#idx-e483)圣领所在的温带半干旱草原，地势平坦、天然水源匮乏，[索菲亚大运河](#idx-e427)贯通前农业条件相当有限；北延至[北门湾](#idx-e413)，是大陆南北贸易的关键咽喉。其南部于[二战](#idx-e269)后尽归[索拉瑞斯](#idx-e429)，后为索菲亚大运河纵切为二；运河以东的土地依[三战](#idx-e270)《[卡斯特鲁姆和约](#idx-e275)》归[阿布丹提亚](#idx-e452)，交接至今悬置，是阿索两国博弈的核心争议。\"},{\"id\":\"e493\",\"title\":\"运河仪所\",\"aliases\":[],\"body\":\"坐落于[忒奥西斯](#idx-e483)圣领领土最北端、[索菲亚大运河](#idx-e427)与[北门湾](#idx-e413)交汇入口处的机构，是[牧首厅](#idx-e166)对大运河实施管理的最前沿。承担通行审核与海水除盐双重职能，常驻[神启魔法](#idx-e4)师持续以水元素魔法析出注入运河的海水盐分。其除盐作业常年施法却从未引发可观测的元素[疏化](#idx-e37)，已成为[魔元素动力学](#idx-e29)的专项研究课题。\"},{\"id\":\"e494\",\"title\":\"艾瑟瑞姆王国\",\"aliases\":[],\"body\":\"位于大陆西南部的封建君主制国家，首都[阿斯托利亚](#idx-e495)，领土环抱[坠星湖](#idx-e501)。源出西诺拉尼亚黑暗时期南下避难的[星术](#idx-e7)学者聚落，十一世纪末[塔利瑞安](#idx-e218)联合十二城邦创建[大星术研究院](#idx-e226)，十三世纪前叶塔利兰娜受推举加冕为初代女王。国土约四百二十万平方[陆里](#idx-e387)，由[王冠领地](#idx-e248)、四大伯爵封邑与[特别仪式区](#idx-e244)构成，人口约一千八百万。以星术立国，[王家研究院](#idx-e249)[天星首席](#idx-e247)永由君主兼任，传统意义的[施法者](#idx-e36)占人口逾半。\"},{\"id\":\"e495\",\"title\":\"阿斯托利亚\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)首都，位于[坠星湖](#idx-e501)南端[瑟蒂尔河](#idx-e499)出湖处，由[大陆历](#idx-e346)894年南下避难的[星术](#idx-e7)学者聚落发展而成，[王家研究院](#idx-e249)即设于此。城名源出[星空学派](#idx-e6)早期所用的 Astralis（\\\"属星的\\\"），后世音变作 Astoria，旧拼法今仅见于研究院的仪式文书。\"},{\"id\":\"e499\",\"title\":\"瑟蒂尔河\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)境内河流。由[坠星湖](#idx-e501)南端出发，向南流经艾瑟瑞姆注入[大星洋](#idx-e415)，首都[阿斯托利亚](#idx-e495)位于其北端出湖处。\"},{\"id\":\"e501\",\"title\":\"坠星湖\",\"aliases\":[],\"body\":\"[艾瑟瑞姆王国](#idx-e494)的地理中心，首都[阿斯托利亚](#idx-e495)位于其南端出湖口。[索尔河](#idx-e447)自[索拉瑞斯](#idx-e429)方向注入湖北端，[瑟蒂尔河](#idx-e499)由南端流出南向[大星洋](#idx-e415)；湖运依托[星术](#idx-e7)船只，是沿岸城市群最重要的内部贸易路线。\"},{\"id\":\"e502\",\"title\":\"卡帕尼诸公联合\",\"aliases\":[\"卡帕尼\",\"卡帕尼联邦\"],\"body\":\"又称卡帕尼联邦，位于大陆南部群岛的公国联邦制国家，由四成员公国与[北部特别贸易区](#idx-e505)组成，四公国各有首府，联邦首都为[阿卡帕尼](#idx-e503)公国的[伊索拉韦尔德](#idx-e516)。1356年[第二次阿索战争](#idx-e269)后，四公爵于[米德可尔](#idx-e512)会晤宣布脱离[阿布丹提亚](#idx-e452)独立。国土约二百五十万平方[陆里](#idx-e387)，散布于七十八座岛屿，人口约九百八十万。联邦以商贸与金融立国，外交奉行离岸平衡，热带群岛旅游业亦非常发达。\"},{\"id\":\"e503\",\"title\":\"阿卡帕尼\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)四公国之一，由同名公爵世袭领有，核心领地为[阿卡帕尼岛](#idx-e504)，首府[伊索拉韦尔德](#idx-e516)亦为联邦首都。\"},{\"id\":\"e504\",\"title\":\"阿卡帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)群岛南部主岛区的核心岛屿之一，与[梅尔帕尼岛](#idx-e510)合计聚居全联邦逾半人口。\"},{\"id\":\"e505\",\"title\":\"北部特别贸易区\",\"aliases\":[\"特贸区\",\"北部特贸区\"],\"body\":\"[卡帕尼联邦](#idx-e502)于1382年于群岛北部岛链设立的特别经济区，由五十八座岛屿及[自由港](#idx-e344)组成，适用独立的[特区商法典](#idx-e245)与优惠贸易税率，设[管理局](#idx-e231)与[仲裁所](#idx-e259)自治，是大陆各国商人自由设立分部开展贸易的核心地带，也是联邦金融机构最密集之处。\"},{\"id\":\"e510\",\"title\":\"梅尔帕尼岛\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)群岛南部主岛区的核心岛屿之一，与[阿卡帕尼岛](#idx-e504)合计聚居全联邦逾半人口。\"},{\"id\":\"e512\",\"title\":\"米德可尔\",\"aliases\":[],\"body\":\"[卡帕尼](#idx-e502)境内地名。1356年[第二次阿索战争](#idx-e269)后，卡帕尼四公爵于此会晤宣布建立诸公联合，是联邦独立的历史象征地点。\"},{\"id\":\"e516\",\"title\":\"伊索拉韦尔德\",\"aliases\":[\"伊索拉\"],\"body\":\"[卡帕尼诸公联合](#idx-e502)首都，通称伊索拉，同时是[阿卡帕尼](#idx-e503)公国首府，四公国的政治核心所在地。当地作坊以镀银工艺见长，[索利亚商会](#idx-e338)创办于此。\"},{\"id\":\"e517\",\"title\":\"尼希尔伊玛目酋邦\",\"aliases\":[\"尼希尔\",\"尼希尔酋邦\"],\"body\":\"通称尼希尔酋邦，位于大陆西北角沙漠绿洲与两河流域的神权部落联邦国家，首都[阿尔努尔](#idx-e518)。五世纪[萨阿尔血王朝](#idx-e539)覆灭后，诸部酋长于阿尔努尔会盟，推举诸神大祭司为[伊玛目教长](#idx-e199)，成立酋邦。尼希尔国土五百八十万平方[陆里](#idx-e387)，由[诸神圣土](#idx-e202)与八部落领地构成，人口约一千八百万。酋邦是当今大陆唯一合法保有奴隶制的国家，社会等级高度固化。\"},{\"id\":\"e518\",\"title\":\"阿尔努尔\",\"aliases\":[],\"body\":\"[尼希尔伊玛目酋邦](#idx-e517)首都兼伊玛目城，位于两河流域核心地带，属[教长](#idx-e199)直辖的[诸神圣土](#idx-e202)。422年诸部酋长于此会盟建立部落联邦体制、推举首任伊玛目教长；城中六神各有神庙，另有教长主持全酋邦最隆重仪典的[大神庙](#idx-e186)，[酋长会议](#idx-e239)亦每年在此召开。\"},{\"id\":\"e519\",\"title\":\"哈亚特河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)两河之东河，发源于[冠脊山脉](#idx-e419)西脉北麓的积雪融水，自南向北流经酋邦西部，于[塔巴特](#idx-e523)与[纳赫尔河](#idx-e520)交汇后入[凛冰洋](#idx-e423)。其洪汛带来上游冲积土并补充土壤水分，随洪水消退而展开的播种是全酋邦农业的年度起点。\"},{\"id\":\"e520\",\"title\":\"纳赫尔河\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)两河之西河，发源于[索拉瑞斯](#idx-e429)境内的[镜心湖](#idx-e436)，自南向北流经酋邦西部，于[塔巴特](#idx-e523)与[哈亚特河](#idx-e519)交汇。因源头在索拉瑞斯境内，诸神信仰第一季的西祭典历来只能在靠近南边境的城市勉强举行，这也是尼索边境关系长期恶劣的原因之一。\"},{\"id\":\"e521\",\"title\":\"沙阿万大魔矿\",\"aliases\":[\"大魔矿\"],\"body\":\"位于[尼希尔](#idx-e517)东部沙阿万沙漠地下，全大陆最大的单一[魔矿](#idx-e71)产地，年产量占大陆总量逾半，[高品级魔矿](#idx-e65)更占大陆产出八成以上，几乎构成事实垄断。矿井多由[神遴者](#idx-e412)以[秘术](#idx-e3)开凿，此后的采掘、支护、排水与转运则由奴隶以常规工具承担。各国对尼希尔的结构性经济依赖即根源于此。\"},{\"id\":\"e522\",\"title\":\"沙阿万大沙漠\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)东部广袤沙漠，是大陆最严酷的干旱地带，地表资源匮乏，昼夜温差可超三十[星度](#idx-e395)，仅有[冠脊山脉](#idx-e419)北脉北麓发源的两条小型沙漠河流维系着若干绿洲；地下则蕴藏[沙阿万大魔矿](#idx-e521)。\"},{\"id\":\"e523\",\"title\":\"塔巴特\",\"aliases\":[],\"body\":\"[尼希尔](#idx-e517)西部[纳赫尔河](#idx-e520)与[哈亚特河](#idx-e519)的交汇处，是两河流域的重要节点，两河在此汇合后继续北行入[凛冰洋](#idx-e423)。\"},{\"id\":\"e524\",\"title\":\"希尔文诺\",\"aliases\":[],\"body\":\"大陆精灵族裔及其文明与家园的统称，位于[冠脊山脉](#idx-e419)间的封闭盆地，由二十余个[氏族](#idx-e211)部落构成，最大聚落为[大圣树](#idx-e214)所在的[希尔文尼亚](#idx-e527)。其实际控制面积以大森林为界约一百二十万平方[陆里](#idx-e387)，人口一般认为不超过一百万。制度植根于大圣树信仰，每三十年召开[万叶庭](#idx-e213)全体表决，[叶络枢机院](#idx-e216)理日常行政与对外事务。1132年与人类首次接触，此后长期保持中立与封闭，被各国视为大陆事务的天然缓冲区与仲裁者。\"},{\"id\":\"e525\",\"title\":\"葛林沃尔克\",\"aliases\":[],\"body\":\"大陆东北角地区，由南北两支山脉夹峙高山密林构成，北部为雪原冰川。是大陆地理信息最匮乏的区域，据传其可能存在智慧种族与独立的魔法体系，但学界均无可靠资料。\"},{\"id\":\"e527\",\"title\":\"希尔文尼亚\",\"aliases\":[],\"body\":\"[希尔文诺大圣树](#idx-e214)所在之地，精灵族规模最大的聚居点，[万叶庭](#idx-e213)与[叶络枢机院](#idx-e216)所在。据推测是大陆最优越的[元素丰地](#idx-e52)之一。\"},{\"id\":\"e528\",\"title\":\"希尔文诺大森林\",\"aliases\":[],\"body\":\"精灵族世代定居之地，坐落于[冠脊山脉](#idx-e419)北脉与东南脉合围而成的山间盆地，是大陆封闭程度最高的区域之一，实际控制面积约一百二十万平方[陆里](#idx-e387)。山脉双重合围造就封闭湿润的气候，孕育大量大陆其他地区所没有的特有动植物；盆地开口朝向东南，东南脉中部的天然隘口是[林缘议厅](#idx-e276)所在地。\"},{\"id\":\"e532\",\"title\":\"冠阳\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之首，[星空学派](#idx-e6)完整名\\\"主序·冠阳\\\"，即太阳。[源星](#idx-e56)属权威、创造与审判；[正教](#idx-e146)神学中象征[唯一神](#idx-e135)，对应[仪式历](#idx-e361)[圣神日](#idx-e358)与[通用历](#idx-e368)日曜日。\"},{\"id\":\"e533\",\"title\":\"烬铸星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"熔炉·烬铸星\\\"。[源星](#idx-e56)属转化、破坏与锻造，常被视为天球之上的锻造炉象征；[正教](#idx-e146)神学上象征[圣约瑟](#idx-e124)，对应[烬曜日](#idx-e351)。\"},{\"id\":\"e539\",\"title\":\"萨阿尔血王朝\",\"aliases\":[],\"body\":\"古代[尼希尔](#idx-e517)地区存在的政权，由掌握[秘术](#idx-e3)的萨阿尔部落于[大陆历](#idx-e346)元前二世纪建立。该部自[沙阿万大沙漠](#idx-e522)西侵，用八年统一西尼希尔诸部，王朝延续至五世纪。其以自身信仰强行替代西尼希尔原有神话体系，奠定了尼希尔日后的诸神信仰与政教结构。史籍普遍估算，王朝治下因屠杀或献祭而死者逾四百万。该王朝在五世纪大起义中覆灭，但其制度主体却被422年的[阿尔努尔](#idx-e518)会盟所承袭。\"},{\"id\":\"e541\",\"title\":\"索拉尔王国\",\"aliases\":[],\"body\":\"[索拉瑞斯帝国](#idx-e429)的前身，于西诺拉尼亚[黑暗时代](#idx-e273)中崛起的王国。1159年，索拉尔国王[阿利昂](#idx-e235)统一西大陆诸国、受牧首册封为首位[龙裔凯撒](#idx-e234)，索拉瑞斯帝国由此建立。现代通用度量衡的长度单位[步米](#idx-e378)与[陆里](#idx-e387)即源自索拉尔王国的[军团](#idx-e294)行军传统。\"},{\"id\":\"e544\",\"title\":\"汐月\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"银杯·汐月\\\"，即月亮。[源星](#idx-e56)属容纳、精神与教导；[正教](#idx-e146)神学上象征[圣约翰](#idx-e123)，对应[月曜日](#idx-e376)。艾瑟瑞姆[星历](#idx-e371)即以其盈亏循环为月。\"},{\"id\":\"e548\",\"title\":\"织虹星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"脉生·织虹星\\\"。[源星](#idx-e56)属修复、治疗与幻象；[正教](#idx-e146)神学上象征[圣保罗](#idx-e119)，对应[虹曜日](#idx-e348)。\"},{\"id\":\"e549\",\"title\":\"仲裁星\",\"aliases\":[],\"body\":\"[天星五政](#idx-e41)之一，[星空学派](#idx-e6)完整名\\\"律令·仲裁星\\\"，是星空中最亮且运动最明显的三颗星体之一。[源星](#idx-e56)属秩序、守护与契约；[正教](#idx-e146)神学上象征[圣伊琳娜](#idx-e122)，对应[裁曜日](#idx-e345)。\"}],\"titleImagePath\":\"/compendium/诸域纪闻/沉默者.webp\",\"titleImageInsertLine\":1}}]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"12:I[27201,[\"/Nurania/next/static/chunks/ff1a16fafef87110.js\",\"/Nurania/next/static/chunks/0bd6498bda341889.js\"],\"IconMark\"]\na:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"沉默者 | The Silent One\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"纪念塞勒内斯·尤里梅尔诞辰150周年系列文集\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/Nurania/icon.svg?icon.986a92ce.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L12\",\"3\",{}]]\n"])</script></body></html>
