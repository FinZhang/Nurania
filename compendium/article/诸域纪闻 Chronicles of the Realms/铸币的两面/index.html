":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$2\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"10:I[53360,[\"/Nurania/next/static/chunks/27ac9b8ec347c021.js\",\"/Nurania/next/static/chunks/3548cb099ad61741.js\",\"/Nurania/next/static/chunks/f81039c8341e0685.js\",\"/Nurania/next/static/chunks/088430588bf85aac.js\"],\"default\"]\n11:T12326,"])</script><script>self.__next_f.push([1,"\n### 一\n\n清和季四十六日午后，维里乌斯·里恩在旅馆三楼走廊尽头的房门前站定，从怀里摸出星术怀表，翻开表盖确认了一下时间，刚到未时。他把表收回去，抬手将两根手指搭上门框右侧的界星石，一道极淡的蓝光从指尖透出，界星石表面的蚀刻回路随之闪烁了一下。\n\n门内传来一声短促的铃响，接着是自己老师弗莉亚的声音：“进来吧。”\n\n界星石的蚀刻回路再次亮起，锁舌弹开。维里乌斯推门进去。房间不大，陈设也很朴素，窗口正对着多西瓦大街背面的下坡，窗外能望见几排屋脊，再远处是卡尔姆东港的桅杆。弗莉亚·米萨兰正坐在窗边的小圆桌旁边，手里拿着咖啡杯，桌上摊着洛林会议的议程单和一沓沾了墨迹的稿纸，一只咖啡壶镇在手稿一角。\n\n弗莉亚看见维里乌斯进来，把杯子放下，指了指对面的椅子，“坐吧，会议几天的安排再过一下。”\n\n维里乌斯点点头，拉过椅子坐下，把夹在胳膊下的笔记本翻开平放在桌上，“会议四十九日开始，第一天主要是伯爵领研究院的专题，看摘要说是要介绍关于三分耦蚀刻的最新进展。我的报告在第二天，基本已经准备完了，不过最好补一组界星石备用。带来的那一组我上午检查了一下，有两枚回路老化了，容流量不够，演示的时候如果出问题得现场换。”\n\n弗莉亚把笔记本拿过去，扫了两眼数据表格，又递回给维里乌斯。“确实低了些，这个容流量恐怕没法很好复现结果。一会儿你出门买一组新的换上吧，卡尔姆这边的话，我记得临港街上那家星术作坊质量不错，收据抬头写米萨兰研究室……哦，顺便再买一卷铅箔，我这儿正好用完了。”\n\n“好。”维里乌斯低头记了一笔，“第三天是其他几个研究院的报告，重要度低一些。会议的海报厅从第一天午前就会开，我和塞勒内斯确认过了，他的海报能按时做好，没什么问题。”\n\n弗莉亚点点头，起身从边橱里拿了一个新杯子，给维里乌斯倒了半杯咖啡，自己也续了半杯。“塞勒内斯的论文，你看了吗？”\n\n“看了。写得很清楚，模型推导部分比他上一季那版好了不少。”维里乌斯顿了一下，“不过最后一节措辞太谨慎了些，只写了高弛豫时间与特定天宫以太容流特征的疑似相关性。他的数据完全可以支撑更强的结论。”\n\n“这种谨慎的表述是他的风格，不过洛林会议上，谨慎过了头会让人觉得他对自己的结果没把握。”弗莉亚敲了敲桌上那张议程单，“会议前你找时间和他说一声，海报前面会有人问。”\n\n“我待会儿就去。”\n\n“他这个年纪能把弛豫时间做到这个水平，很难得了。”弗莉亚喝了口咖啡，“等他答辩过了，我想把他招到我们研究室来，你平日里多提点他一些。”\n\n“他缺的不是提点。”维里乌斯说，“是自信。”\n\n“这话我听他在专星院的老师也说过。”弗莉亚笑了一声，“好苗子可遇不可求，要是米埃尔老爷子还在研究院，肯定要和咱们抢——”\n\n弗莉亚半道停住了话头，维里乌斯垂下眼睛，盯着自己的笔记本。\n\n“这回第三天有几个报告是多古雷伯爵领研究院的，那边的芙德兰研究室做界星石很强，你留意一下有没有和你课题相关的。”半晌之后，他的老师继续说。\n\n“好。”维里乌斯合上笔记本，站起身来。\n\n“明天辰时你再过来一趟，带上界星石，我们最后走一遍演示流程。”\n\n“我会准时到。”维里乌斯微微鞠了一躬，“谢谢老师。”\n\n“没事，去吧。”弗莉亚点了点头，手已经拿起了那沓稿纸。\n\n*\n\n弗莉亚的房门在身后重新落锁。走廊里午后的阳光从一侧的窄窗斜照进来，在地毯上拖出一道长条光斑。两侧墙壁上每隔几步嵌一盏星术壁灯，这个时辰灯里的明星石不亮，灯座里蚀刻回路的运转声极轻，几乎听不见。\n\n维里乌斯往楼梯方向走了几步，在拐角的时候差点和人撞上。塞勒内斯·尤里梅尔正从楼上下来，怀里抱着手稿夹板，右手手指上沾着墨水，抓着一支羽毛笔。看见维里乌斯，他脚步停下来，站直了身体。\n\n“学长，我正想着去找你。”塞勒内斯把夹板里一页稿纸抽出来递给维里乌斯，“海报还差最后一部分，弛豫时间和暂态以太流量的关系，三组数据的拟合残差我打算并在一张图里，但是天鹰宫段的结果和其他两宫差得太大，画出来效果很不好，改了一上午了。”\n\n维里乌斯低头看手稿里的图，点了点其中一条线，“天鹰宫段的流量浮偏是各天宫里最高的，残差高很正常，所以天生不适合和别的宫段数据画在一起。你应该还记得上一季普罗姆研究室的报告吧，当时他们把天鹰宫所有流量相关的图全部单独画了一遍。”\n\n“天鹰宫段单独画的话，海报的篇幅——”\n\n“篇幅肯定够，如果你觉得不够，说明你前面理论部分写太多了。”维里乌斯答，“草稿给我看一眼。”\n\n塞勒内斯点点头，从夹板里翻出两张写满了公式的稿纸。\n\n“这里容流量随以太流量变化的具体模型，还有下面巴伊尔类的标准流量修正推导，都可以精简成一句话，或者直接删了都行，”维里乌斯接过去扫了几眼，“这些东西写在论文里就可以了，你不能指望人家在海报面前读大篇幅的公式。”\n\n“明白了。”塞勒内斯低头记笔记。\n\n“我现在要出门，大概半个时辰后回来，晚饭前都会在自己房间。”维里乌斯把理论部分的稿纸按回塞勒内斯怀里，“你回去改下海报草稿，然后给我看一遍。”\n\n“好的。”塞勒内斯把稿纸都塞回夹板，抱在怀里转身往楼上走，爬了几步楼梯又回过头，“谢谢学长。”\n\n维里乌斯摆了摆手，没有说话，沿着楼梯往楼下走去。\n\n*\n\n维里乌斯出了旅馆大门，沿着多西瓦大街往临港街的方向走。午后的日头把路上铺设的石板晒得温热，虽然才是清和季末尾，但人在太阳底下已经能感受到了些许暑气。街上来往的行人不算少，旁边偶尔开过去一两辆星术驿车。一台清扫魔偶正贴着街沿慢慢爬，身后拖出两道湿痕，维里乌斯经过它身边时，能听见它动力炉里传出来的嗡鸣声。\n\n卡尔姆是卡伊尔伯爵领的首府，艾瑟瑞姆南部最大的港城，维里乌斯七年前随父母来过这座城市一次。如今这是他第二次到访，港口吹来的风依旧带着大星洋的腥咸味，每天的日头也比阿斯托利亚大得多，和维里乌斯记忆里的一样。\n\n但让他感觉最明显的，是这座城市在不习者改革上几乎纹丝未动。\n\n维里乌斯侧头看向沿街排开的店：蚀刻修理铺，星热炉专卖、兼做信件转送的星讯分局。每家店门都是星术门，没有一家改成了常规推拉门。一家餐馆摆在窗前的菜单这个时间是暗着的，需要激活一侧的界星石才亮起来。街对面挂着“赫林父子”招牌的船具铺，门框上钉着一只黄铜门环，是他这一路上见到的唯一一只。\n\n不习者改革是女王登基后的第二年就颁布的诏令，作为王国对外开放政策的一部分。改革要求境内各个大城市的公共设施，都要为外国人另备一套不需要星术的东西：门上加上锁孔，旅馆换上油灯，各个口岸入境的审查和复核也一并简化。诏令下到今年是第五年，维里乌斯在研究院旁听现代史课时听讲师提过，这几年王国的对外贸易额翻了不止一倍，在大城市里见到外国人也已不算新鲜。但他现在在卡尔姆的街上走了快半刻钟，没有看到一副锁孔，也没有看到一张外国人的脸。\n\n到了临港街，维里乌斯没花太多力气就找到了弗莉亚提到的那家星术作坊，作坊的招牌是用整块明星石刻的，现在没亮着，露出灰蓝的石质颜色。维里乌斯买了三枚中品级的界星石和一卷铅箔。付钱时店主验了他的研究院派出函，在收据抬头上写上研究室的名字，然后把界星石用软布包好，装进一只窄木盒里，和铅箔一起递给维里乌斯。\n\n维里乌斯回到旅馆大堂的时候掏出怀表看了一眼，未时三刻，弗莉亚老师应该在午休。他盘算了一下，决定先把铅箔放回自己房间，明天再带给老师。\n\n他沿着楼梯上了三楼，发现走廊里多了一个人。\n\n一位年轻男子站在自己房间前两间的位置，背靠着门，二十七八岁的样子。一身裁剪考究的深蓝外衣，领口别着一枚银扣，一顶缀着灰色羽毛的宽檐礼帽拿在手里当扇子。男人右手转着一枚金色铸币，翻过来，又翻过去。\n\n维里乌斯放慢脚步。男人看到他，直起身来。\n\n“先生，冒昧。”他的艾瑟瑞姆语说得很流利，带着南方群岛的调子，“您会开这种门吗？”\n\n维里乌斯停下脚步，看了看他，又看了看门。\n\n“我一刻前就联系了前台，让他们派人来开门。”男人把礼帽扣回头上，嘴角弯了一下，“前台的人说‘稍等’。这层楼的房间门我已经数过三遍了，一共三十六扇。”\n\n维里乌斯走到男人身边，低头看了一眼门框旁边的界星石。标准的仲裁星术门锁，没有钥匙孔，和走廊里每一扇门一样。\n\n“他们给你星钥了吗？”维里乌斯问。\n\n“星钥……哦您是指这个，”男人眨了眨眼，然后从怀里掏出一块菱形的石块交到维里乌斯手里，“给您。”\n\n维里乌斯没回答，把星钥按在界星石上，指尖透出略微的蓝光。界星石和菱形石块上的花纹亮起，拼合成一个完整图案。锁芯里传来咔哒一声，门开了一条缝。\n\n男人愣了一下，随即笑起来，笑得很敞亮。“多谢，真是帮了大忙了。”\n\n“你不会星术。”\n\n“确实不会。”男人摊开两手，“您也看到了，我是卡帕尼人。”\n\n“这家旅馆没经过不习者改造，不会星术的话恐怕会住得很不舒服。”维里乌斯把星钥递回给他。\n\n“我出发前就听说卡尔姆不是很欢迎外国人，这下可算亲身体验过了。”男人接过星钥，随即从外衣胸口的内袋里摸出一张小卡，双手递过来，“索利亚商会，卡涅·道格拉斯。这是我的名片。”\n\n维里乌斯接过卡片。他在学校里学过，许多行走大陆的商会人士备着这种叫名片的自我介绍物，见到实物却是头一回。名片是丹提亚纸制的，手感很好，比王国制式公文纸细腻得多。浅蓝的底色上一条浅银线，后面用烫金的通用语花体写着“卡涅·道格拉斯”几个字，右下角一行小字：“卡帕尼联邦，索利亚商会”，跟着一个伊索拉韦尔德打头的地址。\n\n“维里乌斯·里恩。”他把名片收进内袋，“王家研究院的地星师。”\n\n“研究院的学者？”卡涅的眉毛明显地抬了一下。他的目光在维里乌斯领口的院徽上停了一瞬，“来卡尔姆参加洛林会议的？”\n\n“是。”\n\n“那咱们是同一场会的客人了。”卡涅侧身把房门推开些，“进来坐坐？”\n\n“不必了。”维里乌斯抬了抬手里的提包，“还有东西要归置。”\n\n“那不耽误您。”卡涅退后半步让开走廊，帽檐微微一压，“这份人情我记下了，里恩先生。”\n\n维里乌斯点了点头，往前走到自己的房间前，拿出星钥开了锁，推门进去。房间地上摆着他之前排练报告时搭好的界星石阵列。维里乌斯蹲下身，从提包里取出那个窄木盒，把两枚新的界星石替换上去，然后注入玛娜调试了一会儿，确认运行正常了才站起身来。\n\n他从内袋里掏出怀表放在桌上，手指碰到了刚刚收到的名片，于是又拿出来看了一眼。\n\n索利亚商会。没听说过。\n\n*\n\n傍晚时分维里乌斯花了半个时辰给塞勒内斯改了海报草稿，然后独自出门在街角的餐馆吃了晚饭。回到旅馆时，一楼咖啡馆的灯已经亮了起来。\n\n卡尔姆的咖啡馆和阿斯托利亚的差别不大：深色木桌，高背椅，墙上几幅星图版画。柜台后面的星热炉上架着两只柱式咖啡壶，大厅里弥漫着一股好闻的烘烤香味。此时咖啡馆里十几张桌子坐了大半，基本都是提前到会的各地学者，桌上摊着讲稿和草稿纸，说话声压得不高，偶尔有人为一个式子争起来，很快又低回去。\n\n维里乌斯打算穿过咖啡馆直接上楼。\n\n“里恩先生！”\n\n他转过头，卡涅正坐在窗边的一张桌子旁，面前摆着一杯喝了大半的咖啡和一叠摊开的文件。金色的短发在壁灯下泛着暖光，那顶灰色羽毛的宽檐礼帽倒扣在旁边的空椅上。他朝维里乌斯招了招手。\n\n“下午在大堂等了一阵没看到你。来坐一会儿？”卡涅看到维里乌斯走近，露出一个爽朗的微笑，“让我请你喝杯咖啡，开门的事怎么也得谢一谢。”\n\n维里乌斯掏出怀表看了一眼。刚过戌时，离休息的时间还有一阵子。\n\n他走过去坐了下来。\n\n“劳驾。”卡涅朝柜台方向示意了一下，等侍者走过来，“两杯卡尔姆产区的，磨细，加一份糖。”\n\n侍者点头，回到了柜台后面。卡涅靠在椅背上，把面前的文件归拢到一侧，那枚铸币不知道什么时候又出现在了他右手指尖，这回维里乌斯看清了，那是一枚卡帕尼尼卡特。\n\n“道格拉斯先生来卡尔姆几天了？”维里乌斯问。\n\n“两天。光入境手续就办了一天半。港口海关翻了三遍行李，每件东西都要登记造册。”卡涅把铸币在食指和中指之间弹了一下，“不过这也不全是坏事，卡尔姆这么封闭，愿意为了通关折腾一天半的同行不会太多。”\n\n“同行？”\n\n“其他商会的人。洛林会议每三年一次，艾瑟瑞姆开放之后，盯着会议来谈合作的卡帕尼商会不说三十个也有二十个，但正好赶上今年这届在卡尔姆开。”卡涅两只手交叉放到桌上，“索利亚商会刚起步，去年第一个分部才建起来，我想着把对王国的生意再往前做一步，这次会议是绝佳机会——所以我硬着头皮来了，只带了手下一个主簿。”\n\n“你们商会做什么方向的贸易？”\n\n“星术设备的半成品和魔矿原料分销。”卡涅答得很快，“我在斯特拉拉待了一年多，和阿斯托戈以及几家归属多古雷伯爵领的商会都有往来。你们的星术设备出口增长很快，但蚀刻总所的产能是有限的，正好卡帕尼这几年在建一批星术组装作坊，中间商的价值就在这儿。”\n\n侍者走近，把两杯飘着热气的咖啡放在了桌上。维里乌斯谢了一声，拿起其中一杯呷了一口。卡尔姆的豆子是艾瑟瑞姆的南方品种，比阿斯托利亚的中部种偏酸，后味带一点烟草的回甘。\n\n“把不需要技术含量的封装流程转移到卡帕尼，让蚀刻总所宝贵的产能用在最有价值的蚀刻工艺上，而在中间负责搬运原料和蚀刻半成品赚辛苦钱的，就是中间商。”\n\n维里乌斯没有接话。\n\n卡涅略略咳嗽了一声，换了个话题。“里恩先生在研究院做什么方向？”\n\n“仲裁星术。”\n\n“仲裁星术。”卡涅把这四个字重复了一遍，“界星石设计相关？”\n\n维里乌斯看了他一眼。他在研究院里见过不少旁听学术报告的外国商人，多数人听到“仲裁星术”之后的反应是礼貌地点头，然后把话题往别处带。\n\n“差不多。”维里乌斯回答他。\n\n“我在斯特拉拉看过一篇报道，王家研究院有个研究室在做联级界星石的星场效应。”卡涅右手在桌面上比画了一个粗略的节点布局，“用某种特殊的联级设计，让星场内部玛娜浓度分布实现自动调节。不知道和您的研究领域有没有关系。”\n\n维里乌斯放下了咖啡杯，稍微坐正了些。“你说的就是我做的课题。”\n\n“太巧了。”卡涅双手一拍，“我读了那篇报道之后一直在想，如果这个东西成了，对需要时变的星场的维护成本会是一笔巨大的削减。不再需要专门的星术师全程监控星场强度，结界自己能实现玛娜浓度的周期调节。”\n\n维里乌斯看着面前这个卡帕尼商人，“你很了解应用星术。”\n\n“在星术师的国家做星术设备的生意，不懂一些怎么行。”卡涅笑了一下，抬手朝天花板上指了指，维里乌斯知道他在说下午那扇打不开的门，“虽然我自己一点不会。”\n\n“所以你晚上也没办法在房间里待着？”\n\n“没法待着。房间里没有照明，我不会开星术灯，油灯也没有。我派多米尼克下午出去跑了一圈，卡尔姆似乎不卖油灯这种东西。”他靠在椅背上，“所以天黑了之后我只好下来喝咖啡。”\n\n维里乌斯看了一眼墙上的星术壁灯。如今王国的很多地方随着不习者改革推行，外国人居住渐多，城里已经买得到油灯。有些制作精良的进口灯具也被当作工艺品在王国内流通——但他们现在身处卡尔姆。维里乌斯甚至怀疑现在全城都找不出一盏油灯来。\n\n“来之前没准备？”\n\n“入境检查太严了，少一件行李就省一点时间。”卡涅答，“不过没关系。就当每天晚上到咖啡馆加班。这里的咖啡确实比伊索拉韦尔德好喝。”\n\n这时旅馆正门进来两个人，弗莉亚在前，塞勒内斯抱着一只长纸筒跟在后面。经过咖啡馆门口，弗莉亚朝这边望了一眼，脚步转了过来。\n\n“弗莉亚老师。”维里乌斯起身，“这位——”\n\n“卡涅·道格拉斯。”卡涅已经起身了，动作比维里乌斯还快半拍。他从内袋里又取出两张名片，先双手递给弗莉亚，再递给塞勒内斯。“下午里恩先生帮我开了一扇打不开的门，我正在谢他。”\n\n弗莉亚接过名片扫了几眼，嘴角有了一点笑意。“这座城市的门对外国客人是难开了些。卡帕尼的朋友肯到卡尔姆来，这几年还不多见。研究院倒是一直盼着会上多些外面的面孔。”\n\n“那我就当自己来对地方了。”卡涅说，“弗莉亚女士——”\n\n“米萨兰。弗莉亚·米萨兰，在王家研究院仲裁星术系工作。”\n\n“米萨兰教授。”卡涅立刻改口，欠身行礼。\n\n“客气了。”弗莉亚摆了摆手。“道格拉斯先生的商会在做什么方向？”\n\n“星术设备的半成品和魔矿原料分销。”\n\n弗莉亚看了维里乌斯一眼。维里乌斯微微点了一下头。\n\n“很好。”弗莉亚转向卡涅，“洛林会议一直需要更多有实业背景的人参与讨论。学术和应用脱节太久，对双方都不利。”\n\n塞勒内斯站在一旁，手里捏着卡涅递来的名片翻来覆去地看：“这个烫金，是伊索拉韦尔德的工艺吗？”\n\n“是波托马利的。”卡涅答，“伊索拉的作坊更擅长镀银。”\n\n弗莉亚拍了拍塞勒内斯的肩。“时间不早了。道格拉斯先生，我们先上去了。会议上见。”\n\n“米萨兰教授慢走。”卡涅鞠了一躬，目送着弗莉亚带着塞勒内斯朝楼上走去。\n\n两人又坐了一阵，咖啡见了底。卡涅朝侍者招手结账，随手把那枚尼卡特搁在托盘上。\n\n侍者站着没动，“先生，本店不收外币。”\n\n“这是尼卡特。”卡涅说。\n\n“本店不收外币。”侍者又说了一遍，语气没有起伏。\n\n卡涅笑了笑，把铸币拈回来。维里乌斯已经把几枚星币放进了托盘，“一起的。”\n\n侍者收走了钱，卡涅看着他走远，把那枚铸币收进口袋里。“下回，”他说，“下回我找一个收它的地方请你。”\n\n维里乌斯没应这句，起身道了晚安。上楼的时候他回头看了一眼，卡涅还坐在原位，侧头看着窗外多西瓦大街上亮着的星术路灯。\n\n### 二\n\n清和季四十九日，第六十三届洛林星术技术合作会议在卡伊尔伯爵领研究院开幕。\n\n签到处设在主楼门厅，学者们依次领取黄铜的与会牌，牌面上刻着各自研究院的徽记，商会和贵族的客籍与会牌则是素面的，用墨简单地写着姓名。会议的开幕致辞安排在研究院东侧的大讲堂里，拱顶下能容纳两百余人。维里乌斯和弗莉亚坐在中区第六排，塞勒内斯在他们后面一排，面前摊着笔记本，海报的长纸筒搁在旁边的位置上。\n\n第一天上午的报告有十二场，分散在大讲堂和附属的两个报告厅里。维里乌斯听了四场与自己课题相关的，做了一页半笔记。去第四场报告前他在走廊里和塞勒内斯碰了头，最后检查了一下海报。\n\n“都没问题了。”维里乌斯拍拍自己学弟的肩膀，“自信些。”\n\n塞勒内斯点点头，深吸了口气，抱着长纸筒去了主楼的海报厅。\n\n中午的茶歇区就在海报厅一侧，和午餐区域连在一起。大厅里两侧墙壁钉着二十多块展板，各研究院研究室的海报贴在上面。展板前三三两两地站着人，有的手里还拿着午餐的三明治。大厅尽头一张茶水桌，咖啡壶在星热炉上热着，维里乌斯倒了一杯咖啡，端着杯子沿展板慢慢走过去。\n\n他在塞勒内斯的海报前看到了卡涅，塞勒内斯不在，应该在吃午饭。\n\n年轻的卡帕尼商人站在展板前，一只手撑着下巴，另一只手里夹着那枚尼卡特铸币。他正对着最上方那行标题出声地念：“经黄道上三宫的巴伊尔类……仲裁星术的高星轨……”他在“弛豫”两个字前头卡住了，退开半步，又凑近了些。\n\n“弛豫。”维里乌斯在他身后开口，“星术施法后到玛娜外显之间的那一点时间。”\n\n“里恩先生。”卡涅侧身让开半个位子，脸上带着微笑，指指海报，“惭愧，这个词只在书上见过，念不准。”\n\n“内容你看得懂吗？”维里乌斯问。\n\n“如果我不认识里恩先生，恐怕要以为您在讽刺我。”卡涅的笑容不减，“数学模型和公式我不大能理解，但图表和结论还是看得懂的。”\n\n维里乌斯看向海报的右下角，天鹰宫段和其他两宫段的残差画在两张图里，跟在拟合结果下面。\n\n卡涅顺着他的视线看过去，开口，“所以下面这张图是说，走黄道上三宫的术式弛豫时间和以太流量的关系比较特殊？”\n\n“没错。而且三宫之间的表现也不一致，但又恰好符合容流量时变的模型。”\n\n“像是管道的尺寸在随着水流变化。”\n\n“差不多。”维里乌斯看了他一眼。\n\n卡涅把铸币在指间弹了一下，“这个和您做的联级界星石有关系吗？”\n\n“有。不少操作界星石的巴伊尔类星术要过这三个天宫，弛豫时间偏移会影响谐振系统的周期稳定性。如果没有准确的弛豫时间预测，我这边的设计要多做一层冗余。”维里乌斯说，“做这个的是我的学弟，塞勒内斯，前几天你在咖啡馆见过。”\n\n“原来是那位。”卡涅恍然，“所以他的研究对您的课题会有帮助。”\n\n“如果他的结论成立的话。”\n\n“贵研究室两个人的课题刚好能互相配合，您的老师安排得很巧。”\n\n“塞勒内斯还不是我们研究室成员。”\n\n“我猜很快就是了。”\n\n维里乌斯没回他。他喝了一口咖啡，目光移向海报上方的理论部分。\n\n“下午会有伯爵领研究院的专题报告，”他开口，眼睛还停留在那两行公式上，“你可以来听。”\n\n“关于什么的？”卡涅稍微站直了些。\n\n“他们有个研究室一直在做米西斯类的魔矿蚀刻，最近对室温下的三分耦工艺有了一个技术突破，这次报告要讲。”维里乌斯答，“你应该会有兴趣。”\n\n“里恩先生的推荐，那我可一定要到场。”卡涅微微欠身，“方便的话，晚上一起吃个饭？报告的细节，我还想多请教几句。”\n\n维里乌斯没开口，只是略略点了点头。\n\n下午的伯爵领研究院专题报告在大讲堂进行，下面的位子坐得差不多和开幕致辞一样满。主讲的是一位五十多岁的天星师，报告用了将近一个时辰。室温下三分耦式蚀刻导致的矿界面层洛林阶运现象——维里乌斯在议程册上看到这个标题时就画了标记，报告内容没有让他失望。三分耦工艺如果真能突破低温限制，米西斯类魔矿的蚀刻效率至少提高五成。\n\n讲堂里很安静，弗莉亚一直在写笔记，偶尔侧过头来和维里乌斯低声交换一两句评价，塞勒内斯的笔也没停过。卡涅坐在后排靠边的位置，那顶缀羽毛的礼帽拿在手里，从头听到了尾。\n\n*\n\n第二日午后，维里乌斯在二号报告厅做联级界星石的报告。演示很顺利，四枚界星石的阵列被嵌在木板上，五块明星石在板子上标注的谐振点上依次亮起又熄灭，全程没有人施法。做完报告的时候掌声很热烈，他走下讲台，看到弗莉亚老师在前排朝他点了点头，塞勒内斯在后面记着笔记，然后又抬起手来鼓掌。\n\n维里乌斯在走廊里拆演示用的界星石组时卡涅从报告厅侧门走了出来。\n\n“谐振系统的实时调节那一段做得很精彩。”卡涅倚在墙上，帽子夹在腋下，“四枚界星石能支持五点位的局部星场浓度变化——如果我没理解错的话，把星场的规模加上去，实际使用的界星石数量可以远少于点位数。”\n\n“你理解得没错。”维里乌斯把最后一枚界星石从木板凹槽里取出来，放进木匣。\n\n“那成本降幅会很可观。”卡涅打了个响指，“刚刚您在讲结论部分，我在下面算了一下，用您的设计替代现有的人工定期调节方案，光维护费用就能省四成以上。”\n\n维里乌斯合上木匣，看了他一眼。“你算得很快。”\n\n“做生意的习惯。”卡涅耸了耸肩，接着开口，“昨天下午那个报告，我越想越觉得重要。三分耦蚀刻如果能摆脱低温限制，伯爵领这边的蚀刻工坊产量会大幅提高。所以昨天晚饭之后，我就去找了他们研究院的人谈合作。”\n\n“难怪你昨天饭后这么快就告了别。”维里乌斯转过身来，“结果如何？”\n\n“没结果。对方连研究室都没让我进，门口的人查了与会牌就说‘不接待商务访问’。”卡涅摊了一下手，“今天上午我试图在茶歇上和那位报告人直接聊，人家知道我是卡帕尼人就转头走了，连个借口都不肯找。”\n\n“听上去很有卡伊尔伯爵领的风格。”\n\n“好在也不是什么收获都没有。多古雷伯爵领那边有几个研究室表示对商业合作有兴趣，约了我下周去斯特拉拉细谈。”\n\n“那你会议后直接去斯特拉拉？”\n\n“嗯。在这里再待两天看看，然后就出发去东边。不管怎么说，这趟卡尔姆没有白来。”他顿了一下，从墙上站直身子，“也谢谢里恩先生这几天的帮忙。”\n\n维里乌斯把木匣收进提包，正要开口说自己没帮什么忙，走廊另一头传来脚步声。一位别着研究院徽章的门房走过来，朝卡涅欠了欠身。\n\n“道格拉斯先生，外面有人找您。”\n\n“是哪位？”\n\n“说是治安署的人，没有报姓名。只说是关于您的商会成员的事。”\n\n卡涅的脸色稍微变了下，他朝维里乌斯看了一眼。“失陪。”\n\n他跟着门房快步走了。维里乌斯站在走廊里，手里拎着提包，看着卡涅的背影消失在转角。\n\n*\n\n下午最后一场报告在大讲堂，一位蚀刻总所的技术主管在讲台上介绍近年特别仪式区蚀刻总所的架构调整，内容很枯燥，中途时不时有听众离席。维里乌斯坐在最后排，整理自己关于联级界星石的笔记。报告结束时他掏出怀表，已经快到酉时了。他合上笔记本，提着提包去茶歇区找弗莉亚和塞勒内斯。\n\n海报厅展板上的海报已经撤了下来，此刻只有两个工作人员正在打扫卫生。维里乌斯继续往里走，茶歇区的人也已经走得差不多了，公共区域一侧排着一列配着桌椅的小休息室，供会议期间需要工作的学者使用，此时他右手第一间的休息室门正半开着，里面传来一个他熟悉的声音。\n\n“……所以我需要一位有王家研究院背景的学者，在质证中作为中立的技术顾问出席。”\n\n维里乌斯在门口停下，轻轻敲了敲门。\n\n“进来吧。”弗莉亚的声音。\n\n维里乌斯推门进去，先看见的是塞勒内斯，他站在窗边，手里抱着海报的长纸筒。弗莉亚坐在圆桌旁，对面是卡涅，手里依旧捏着他那顶礼帽。桌上两杯咖啡，都没动过。\n\n卡涅看到维里乌斯走进来，转头看向他，这是维里乌斯第一次从这位年轻商人脸上看到严肃的表情。\n\n“老师。”维里乌斯先向弗莉亚点了点头，然后问，“发生什么事了？”\n\n“我的主簿，多米尼克被卡尔姆治安署逮捕了。”卡涅把帽子放在桌角，“指控是昨天夜里侵入伯爵领研究院档案室，盗窃技术文档。”\n\n“什么技术文档？”\n\n“昨天报告的那个。三分耦蚀刻的实验数据和工艺细节。”卡涅回答。\n\n“治安署说今晚就要质证。考虑到是研究院里发生的案子，可能会涉及星术的技术细节和施法痕迹判断。”弗莉亚靠在椅背上，双手交叉在胸前，“道格拉斯先生自己不会星术，所以来找我，希望让你作为质证的中立技术顾问出席。”\n\n她看着维里乌斯。“卡尔姆治安署是卡伊尔伯爵直属的部门，伯爵领研究院也是。”\n\n维里乌斯站在那里。他的目光从弗莉亚移到卡涅，又移回弗莉亚。\n\n“多米尼克什么时候被逮捕的？”\n\n“今天午前。”卡涅扯了扯嘴角，露出一个苦笑，“质证定在酉时二刻，那位治安官给了我不到两个时辰找顾问。”\n\n“那就走吧。”维里乌斯说。\n\n塞勒内斯往前半步，“学长，我——”\n\n“你送老师回旅馆，还有这个。”维里乌斯把提包交给他，“晚上我来你房间取。”\n\n两人出了研究院正门，天色已经转暗。沿街路灯正一盏盏亮起来，蓝白的光一直往港口的方向延伸过去。一个穿治安署制服的年轻人提着星术提灯等在台阶下，见了他们出来，转身在前头带路。卡涅走在维里乌斯前面半步，一路没有说话，那顶礼帽捏在手里，一直没有戴上。\n\n### 三\n\n卡尔姆治安署在港口以北的行政街上，是一座三层的灰石建筑，正门上方嵌着一块刻着伯爵领纹章的明星石，蓝白色的光在暮色里很亮。\n\n一名穿制服的年轻文员在治安署门口等着，核过维里乌斯的研究院派出函后带两人上了二楼。质证室在走廊尽头，门开着，里面已经有人。\n\n一张长桌横在房间里，主理治安官西涅尔坐在长桌中间一侧的高背椅上，身侧站着一名治安员。西涅尔四十来岁，深蓝色的头发束在脑后，制服扣得一丝不苟。她面前摊着一叠文书，旁边放着一支削好的羽毛笔和一只墨水瓶。看见两人进来，她站起身，脸上带着一种恰到好处的微笑。\n\n“道格拉斯先生。”她朝卡涅微微欠身，目光移到维里乌斯身上，“这位是——”\n\n“维里乌斯·里恩，王家研究院米萨兰研究室，地星师。”维里乌斯把门口验过的派出函递出去。\n\n西涅尔接过派出函，看了正面，又翻过来看背面，她的脸上什么都没变，但核验的时间比门口的文员长了不止一倍。接着她又从柜子里取出一册簿子，向维里乌斯要了与会牌，从上往下一行行对过去。维里乌斯瞥见簿子的抬头写的是洛林会议的与会名录。\n\n他侧头看了眼卡涅，卡涅对着他耸了耸肩。\n\n西涅尔的手指在某一行上停下来，随后她合上簿子，双手把派出函和与会牌还给维里乌斯。“身份核验无误，里恩地星师，失敬。”\n\n维里乌斯点点头，把东西收进怀里。\n\n“我很意外，道格拉斯先生能在这么短的时间内找到一位合适的中立顾问。”她转向卡涅。\n\n“运气好。”卡涅说。\n\n“……好。”西涅尔脸上的笑容没有动，“按规矩，顾问就技术事项发问、核证，不代关系方发言。请坐这边。”\n\n她把维里乌斯安排在长桌侧面，与卡涅隔开一个桌角，随后朝门外扬声：“传报案人。”\n\n进来的是个五十上下的男人，斑秃的头发，穿着一件半旧的院务袍。他进门先朝西涅尔鞠躬，又朝维里乌斯和卡涅鞠躬。\n\n“卡伊尔伯爵领研究院档案室管理人哈雷。”西涅尔介绍道，“本案的报案人和目击证人。”\n\n哈雷走到长桌另一头，坐下时两只手放在膝盖上，背挺得直但肩膀有些缩。\n\n“那么我们开始。”西涅尔拿起羽毛笔蘸了墨，“首先请报案人陈述。哈雷先生。”\n\n哈雷清了清嗓子，开始说。会议这几日研究院主楼里存着与会研究室的器械设备，夜里安保加了码。哈雷作为档案室管理人，也被分到一轮主楼巡查，昨夜子时前后，他巡查完二楼，从楼梯走下来时，隔着中庭看到档案室的窗户里亮着光。他跑过去冲进屋，正好看见一个年轻男人在翻档案柜，听到哈雷开门的声音，男人转了一下头，然后冲到窗户口跳了出去。\n\n这一段他说得很顺，几乎没有停。\n\n“你看清了那个人的样貌吗？”西涅尔问。\n\n“不算特别清楚。但灯光下我看到了他的侧脸和身形，个子不高，棕色的短发。”\n\n卡涅皱了皱眉。\n\n西涅尔转头看向他和维里乌斯，“今天凌晨我署接到报案后，根据报案人的描述进行了相貌排查和画像指认，哈雷先生指认了近日到达卡尔姆的索利亚商会成员多米尼克·阿尔玛，我署于巳时三刻在多西瓦大街的希佩尔旅馆房间将其收押。”\n\n“多米尼克昨天在希佩尔一楼的咖啡馆写了一天的账，”卡涅开口，“到了晚上回房间又没有能用的灯，所以早早地就睡下了，今天快到巳时才起。”\n\n“嫌疑人在问讯时也如此供述。”西涅尔说，“下午我署已经派治安员往希佩尔旅馆调查，嫌疑人昨天白天确实在咖啡馆坐了一天，但当晚旅馆前台亥时后无人值守，无法证明嫌疑人夜晚没有外出。”\n\n维里乌斯看到卡涅张了张嘴，但没有说话。\n\n“另外，下午治安员在希佩尔旅馆周边搜查时，在下水道起获一根铁制撬棍。”西涅尔向身侧的治安员示意了一下，后者从柜子里取出一个托盘，上面放着一根两头缠布的金属条，“档案室的窗户是旧式木框窗，窗框因年久失修相当脆弱，这根撬棍与窗框上的撬痕宽窄吻合。失窃的资料还没找到，但港口和各个出城口已经设了卡。”\n\n“档案室窗户的星术锁不是触发型的？”维里乌斯问，“窗框直接被物理撬开，应该会有警报声。”\n\n西涅尔回头看他，“星术锁确实是触发型。但是因为上次维护在一年前，界星石里的玛娜已经消耗殆尽，因此没有发出警报。”\n\n“我已经和研究院打了几次报告，希望提高维护频率，但暂时还没落到实处。”哈雷在旁边补充，“城里治安一直很好，没想到会有人直接翻窗进来偷东西。”\n\n“我能看看这根撬棍吗？”卡涅问。\n\n西涅尔点了点头，卡涅拿起那根撬棍掂了掂，看了看两头缠的布，放回托盘。\n\n“治安员在调查时还发现一件事，”西涅尔拿过一页报告，“据研究院的人说，失窃当晚，道格拉斯先生曾到访过该资料所属的研究室，但在研究室外被回绝。”\n\n她抬起眼，“道格拉斯先生，您当时是否意欲向研究室提出商业合作？”\n\n“是。”卡涅回答。\n\n“谢谢您的诚实。”治安官点了点头，“动机、人证、物证俱在，案情算得上清楚。若顾问与关系方对证据无异议，本次质证现在便可录结。”\n\n“被回绝的买卖，做生意的一年到头得有个十几桩吧。”卡涅两手交叠放在桌上，嘴角扯出一个笑容，“桩桩都要偷，索利亚商会不如改名叫索利亚盗贼团。”\n\n“道格拉斯先生说笑了。”\n\n“证物看过了，现场还没看。”卡涅说，“我请求去档案室看一眼。”\n\n“现场晨间已经勘验，笔录在案。”西涅尔说，“研究院夜里不便——”\n\n“我也希望检查一下现场。”维里乌斯开口，“治安员不是专业星术师，笔录很可能有缺漏。”\n\n西涅尔朝他看了几秒。\n\n“……既然顾问这么说。”她放下报告，把记录本和羽毛笔拿在手里，站起身来，“那我陪几位过去。”\n\n*\n\n半刻后几人回到了伯爵领研究院的主楼。天色已经完全黑了，一楼的西走廊点着蓝白光的壁灯，光线照在灰石地面上有一种空旷的感觉。维里乌斯是第一次踏上这条走廊——会议的海报厅和茶歇区设在主楼东侧。\n\n研究院的档案室在西走廊的尽头，门装的是标准制式的星术锁。哈雷在前面拿出星钥开了锁，推门进去，又侧身在墙上的界星石上一搭。档案室的两盏顶灯先后亮起来，照亮了整间屋子。\n\n档案室不大，靠墙立着一排木制文档柜，每个柜子四格抽屉，柜面上贴着分类标签。柜子尽头是那扇被撬开的窗户，窗框的木头确实很旧了，边缘有明显的撬痕，木屑散落在窗台上。维里乌斯走过去看了眼窗外，是研究院西面的一条小巷，窗户到地面的高度不到一人高。\n\n“就是这扇窗户。”哈雷站在窗边指了指撬痕，“您看，木头已经朽了，稍微一用力就能撬开。”\n\n“撬痕和证物撬棍比对的结果是一致的。”西涅尔把在质证室的话又提了一遍。\n\n维里乌斯把手按在窗框的界星石上，注入玛娜，过了得有十秒，石头表面的花纹才隐隐地亮起来。“只剩下残留的基底玛娜了。”\n\n卡涅站在柜子前，用手敲了敲抽屉，“贵院档案室的柜子不上锁？”\n\n“之前是锁的。但是这几年研究院扩建，研究室加到了二十几个，每天来送文件归档的，来取报告对照的，一天得有个三四十次。”哈雷解释，“院里后来觉得太繁琐，就没再要求柜子上锁。”\n\n卡涅没再说话，走到维里乌斯旁边，垂下眼睛去瞧窗户上的撬痕。维里乌斯看了他一眼，走到房间入口处，抬头看天花板上的顶灯。\n\n“这两盏灯是什么型号？”他开口问。\n\n“巴伊尔六型，十年前研究院翻新的时候换的。”哈雷答得很快，“整栋楼的房间顶灯都是这个型号。”\n\n“做过不习者改造吗？”\n\n“……啊？”\n\n“就是给不用星术的人做的改造，用机械装置切换界星石的回路来控制灯的开关。”维里乌斯敲了敲侧边墙上那块界星石，“我没看出来这儿做过这种改造。”\n\n哈雷眨了眨眼。“没改过。研究院的楼，改那个做什么。”\n\n“昨夜你冲进档案室的时候，”维里乌斯说，“这两盏灯，是亮的？”\n\n“亮着的。”哈雷点头，“我进来的时候，那人正在翻柜子，我看到他的侧脸——”\n\n“多米尼克·阿尔玛是卡帕尼联邦公民，是一名不习者。”维里乌斯打断他，“他无法点亮这两盏灯。”\n\n西涅尔手里的笔停了。\n\n哈雷张着嘴，半天没出声，他朝西涅尔那边看了一眼。\n\n“嫌疑人确实是卡帕尼人，档案里也确实没有他在艾瑟瑞姆的星术学习记录。”过了一会儿，西涅尔缓缓开口，“但这不能排除他通过某种非官方渠道掌握了星术，因此能够把灯点亮。”\n\n“请相信我，治安官阁下。”卡涅走到维里乌斯身侧，把帽子按在胸前向她鞠了一躬，“在卡帕尼，星术师的价值比在王国高得多。如果多米尼克会用星术，我绝对不会冒着被逮捕的风险让他来艾瑟瑞姆偷东西。”\n\n“退一步说，即使多米尼克会星术，我也不认为他会去开这两盏顶灯。”维里乌斯在旁边开口，“目标太大，简直是生怕别人不知道档案室里有人。更小的光源显然更合适，比如希佩尔旅馆房间标配的星术灯。”\n\n西涅尔眉毛扬了一下，正要说话，旁边的哈雷按着额角开口了，“让……让我再想想。”\n\n他转身朝门口走了两步，又走回来，抬着手比划，“我是从北面楼梯口……看到档案室的窗户亮着光……跑到门口，开锁，进屋——”\n\n“……不对，不对。”他像是想起了什么，“我进档案室的时候，屋里还是黑的。顶灯是我自己点亮的，那时候那男人已经冲到窗口了，正好回过头，让我看见了脸。我在楼梯口那边看到的亮光是偏暗的，黄蒙蒙的……对，黄蒙蒙的，应该是他自己带的灯。”\n\n“比如油灯之类的常规照明工具。”西涅尔接上了这句话，语气平稳，“深夜隔窗，认错光源，情理上说得通。往年署里也录过外国客商自带灯烛的先例。哈雷先生久在楼里当值，头一时想岔了，不奇怪。”\n\n“多米尼克没有携带任何照明工具。”卡涅立刻开口，“我和多米尼克入境时行李经过港口海关的完整检查，每一件物品都有登记造册。我们没有携带油灯或者任何可以组装成照明设备的东西——一块火石都没有，治安署可以即刻调档。”\n\n哈雷的肩膀往下缩了一点。他闭上了嘴，目光在卡涅和西涅尔之间来回移动。\n\n“会调的。”西涅尔点头，低头在记录本上写了一笔，“不过道格拉斯先生，容我确认一句，清和季四十六日，是不是有位外乡人在多西瓦大街上挨家问着买油灯？”\n\n卡涅沉默了一会儿，开口答，“是多米尼克。我让他去买油灯，房间里的星术灯我们不会用。”\n\n“嗯。”那个周到的笑容又回到了西涅尔脸上，“入境时未携带常规照明工具，属实；嫌疑人入城后设法购置油灯，也属实。既然不能排除经其他渠道获取照明工具的可能，我署有责任进一步搜查。里恩地星师作为技术顾问，应该也同意这一点。”\n\n维里乌斯没有立刻回答。他看了看哈雷，又看了看西涅尔。\n\n“我同意。”他说。\n\n“那么。”西涅尔的羽毛笔不停，在记录本写了两行，“鉴于目击证人证词中关于照明方式的部分需要进一步核实，本次质证暂时中止。治安署将对嫌疑人可能使用的常规照明工具进行搜查。搜查得出结果前，嫌疑人继续收押。各方如有异议，请现在提出。”\n\n卡涅看了维里乌斯一眼。维里乌斯微微摇了摇头。\n\n“没有异议。”卡涅说。\n\n*\n\n两人从研究院出来时已经过了亥时。街边路灯在石板路面上投下蓝白色的光，海风从港口方向吹过来，比白天凉了不少。\n\n两人沿多西瓦大街往旅馆的方向走。卡涅在维里乌斯左边半步的位置，好一阵没有说话。那枚尼卡特铸币又回到了他手里，在指间无声地翻转着。\n\n“谢谢你，里恩先生。”卡涅先打破了沉默，“今天如果没有你在场——”\n\n“你在质证室的时候就听出来灯的矛盾了。”维里乌斯说，“管理人说他在灯光下看到了多米尼克的脸，我看你皱了眉。”\n\n“我当时只是怀疑，直到在档案室见了现场才确认。”卡涅耸了耸肩。\n\n“那你为什么不说？”\n\n“因为这些话需要你来说。”卡涅的声音很平淡，“你应该也看得出来，在治安官面前，谁说的比说了什么更要紧。”\n\n“东西是多米尼克偷的吗？”\n\n卡涅停住了脚步，他的脸在蓝白灯光下比白天显得苍白一些，但表情平静。\n\n“绝对不是。”他一字一顿。\n\n维里乌斯点点头，没有再问。两人又走了一段，卡涅又开了口，“等着吧。”\n\n维里乌斯转头看他。\n\n卡涅把铸币从左手换到右手，翻了两下，“他们要找油灯，那就让他们找。”\n\n### 四\n\n洛林会议在炎阳季一日落下帷幕。下午最后一场报告前先公布了会议海报的评奖结果，塞勒内斯听到自己名字的时候还没反应过来，被维里乌斯用手肘捅了一下才从座位上弹起来冲去前面。他走上讲台台阶的时候有些急，差点绊了一跤。维里乌斯看着他，嘴角难得地带了点笑意。\n\n傍晚维里乌斯在旅馆门口送自己的老师和学弟回阿斯托利亚。几人来卡尔姆时坐的星术驿车就停在街边，车上的动力炉已经预热好了，蚀刻回路里传来一阵阵低沉的轰鸣声。\n\n“顾问的差事，办完就回来。”弗莉亚站在车边，把维里乌斯提着的行李接过去，“有什么需要研究室这边出面的，直接往阿斯托利亚递星讯。”\n\n“我明白。”维里乌斯点头。\n\n“这几天你自己的课题也别落下，芙德兰研究室今天报告的那种界星石构型，你抽时间读一下他们的论文，后续联级设计里可以参考。”\n\n“我明天就和多古雷研究院那边联系。”\n\n“道格拉斯先生呢？”塞勒内斯从车窗里探出头来，左右看了看，“今天没看见他。”\n\n“他今天不在会场，今天早上我出门时碰见他，说是要去星讯局办点事。”\n\n“还想在走之前和他打个招呼。”塞勒内斯露出一个遗憾的表情，然后看向维里乌斯，“我答辩在这季后旬，论文最后一章可能还要麻烦学长帮忙看一眼。”\n\n“我回研究室和你约时间。”维里乌斯答，“还有三十几天，来得及。”\n\n弗莉亚拍了两下维里乌斯的背，拉开车门坐了进去。动力炉连响了两声，驿车沿着多西瓦大街往北边城门方向去了。维里乌斯目送着车子开远，然后转身进了门。\n\n*\n\n接下来的日子里维里乌斯基本一直待在旅馆。白天在房间里整理会议笔记和资料，中午和傍晚出门吃饭，回来后在一楼的咖啡馆坐一阵再上楼。\n\n卡涅几乎每天都来找他。\n\n有时候是中午来拉他去吃饭，有时候是晚上一起喝咖啡，还有的时候是直接来敲维里乌斯的门，在房间里坐着聊会儿天。他来找维里乌斯的时候从不主动提多米尼克的案子，只聊卡尔姆的天气和物价，聊后续和几个研究室的合作计划，聊他当年在伊索拉韦尔德的港口倒了两季的货才凑够索利亚的注册金。维里乌斯大部分时间听着，偶尔问一两句。\n\n炎阳季七日傍晚，维里乌斯照常在离旅馆不远的那家餐馆吃过晚饭，回到希佩尔一楼的咖啡馆坐下，还是那张靠窗的桌子。他掏出怀表确认了眼时间，随后抬手向侍者点了单，从提包里抽出芙德兰研究室那份界星石构型的论文读。他几天前给多古雷研究院递了星讯，昨天下午收到了论文副本，稿纸厚厚一沓，光数学推导就写了三十页。作者选用了一种全新的理论模型，虽然维里乌斯自认对界星石足够了解，读起来也很费劲。\n\n侍者把两杯咖啡端上来的时候，卡涅正从旅馆正门进来。他看见维里乌斯面前的两个杯子，脚步顿了一下。\n\n“里恩先生终于习惯了。”他拉开椅子坐下，把那顶缀羽毛的帽子搁在桌角，话里带着笑意，“卡尔姆产区的？”\n\n“卡尔姆产区的，磨细，加一份糖。”维里乌斯的视线没有从论文上抬起来。\n\n“谢谢。”卡涅喝了一口咖啡，右手又摸出那枚尼卡特铸币，“早上我带给你的熏鱼片味道如何？”\n\n“还可以。”维里乌斯答，“不过我更好奇你在卡尔姆是怎么买到卡帕尼熏鱼片的。”\n\n“昨天中午有一艘货船从斯特拉拉到港，我从那边的分部调了点货过来，在港口跑了一天，所以昨天没来找你。多米尼克不在，什么事都要亲力亲为。”卡涅用下巴指了指维里乌斯放在桌上的稿纸，“你的论文是从斯特拉拉寄过来的？那估计也是跟着这艘船到的。”\n\n“你现在这样在外面跑，每天回房都得让前台给你开门？”\n\n“本来是这样，不过前几日前台还叫我‘道格拉斯先生’，这两日已经改口叫我‘又是你’了。”尼卡特在他指间转了两下，“我也懒得再和他们交涉，干脆直接把门一直开着。那位管理人不是说城里治安很好吗？想必不会有人来偷我一个外国商人的东西。”\n\n维里乌斯抬头看了卡涅一眼。\n\n“多米尼克这几日怎么样？”\n\n“我隔两天去看他一次。精神还好，这小子比我沉得住气。”卡涅拿起咖啡杯，“我还是有那么一点急的，那几桩多古雷研究院的合作还在斯特拉拉等着我去谈呢。”\n\n“那得看治安署的搜查什么时候出结果了。”\n\n“我猜快了。”\n\n“你怎么知道——”\n\n“里恩先生和道格拉斯先生。”旅馆前台快步走过来，打断了维里乌斯的话，手里拿着一封没封口的信，“治安署的通知，刚刚送过来的。”\n\n维里乌斯接过来打开，内容很简短，只说治安署近日于城内某处搜获一件常规照明工具，明日巳时于治安署重开质证。落款是西涅尔治安官。\n\n“找到照明工具了，明天巳时重开质证。”维里乌斯看向卡涅，卡涅脸上的表情没发生什么变化，只是把那枚铸币捏在了手心。\n\n“效率真高。”卡涅把咖啡一饮而尽，站起身拿起帽子，“明日见，里恩先生。”\n\n*\n\n次日巳时，两人到了治安署，质证室里的布置和上次几乎一样。西涅尔照旧坐在长桌中间一侧，身边站着一名治安员。哈雷坐在桌子右端，两只手放在膝盖上，看到维里乌斯和卡涅从门口进来，垂下眼去盯着桌面。\n\n两人在桌子左侧坐下，隔开一个桌角。西涅尔随即开口，“人到齐了，我们开始。”\n\n那根撬棍依旧装在托盘里放在桌面上，此时它旁边多了一只托盘，上面是一盏长柄油灯。黄铜的灯身，弧形提手，灯口内壁有一层新的熏黑。油灯做工很考究，底座上刻着一圈精细的叶纹装饰。\n\n“近日治安署在城内搜查中找到了这盏油灯。”西涅尔看向卡涅和维里乌斯，“具体搜查细节因涉及署内工作程序，不便在质证中透露。从内壁的熏黑痕迹来看，这盏灯近期使用过。我们有理由认为这就是嫌疑人在案发当晚使用的照明工具。”\n\n她向身侧的治安员示意，治安员掏出火石灯油把油灯点了起来，一簇暖色的火苗在灯口跳动。\n\n“哈雷先生，这是否和你当夜隔着中庭看到的亮光相符？”西涅尔转头问。\n\n哈雷看了几眼油灯里的火苗，点头，“对，我记得看到的就是这个颜色。”\n\n“劳驾。”卡涅举了举手，“我想看一下这盏油灯。”\n\n西涅尔点头。治安员熄了火，撤了油，把灯递给卡涅。卡涅双手接过去掂了掂，在手里转了一圈，又把灯翻过来看了底座好一阵。\n\n西涅尔露出了略微的不耐，“道格拉斯先生有什么问题吗？”\n\n“没有。”卡涅把油灯放回托盘，语气很平静，“是波托马利的丕平铜匠坊制作的，而且是工艺品标准的高端货，专供出口。”\n\n“您承认这盏油灯来自卡帕尼了？”\n\n“我承认。”\n\n“很好。”西涅尔脸上又挂上了那个周到的笑容，“既然物证已足，若无异议——”\n\n“治安官阁下，我知道您急着结案交差，把我的主簿送进监狱。”卡涅向西涅尔欠了欠身，“但我建议您先把我的话听完。”\n\n治安官皱了皱眉头，但没开口，示意他说下去。\n\n“谢谢您。”卡涅点了点头，“诸位知道，我是一个商人，这几日闲着也是闲着，我这做买卖的心收不住，就跑了趟星讯局，托斯特拉拉的分部调了几盏长柄油灯过来，点名要的是丕平坊里的高端货，前天中午才随船运到卡尔姆。”\n\n“我在西城区物色了一家工艺品店，把那几盏油灯——哦，还有配套的火石和灯油——寄卖在了他家店里，还拜托老板务必把它们放在橱窗里最好的位置上。”卡涅靠在椅背上，那枚尼卡特又出现在他指间，“当天夜里老板就来递话，说有位客人把它们全买走了。艾瑟瑞姆人对艺术的热情真让我吃惊，我还想着同这位买家见面认识一下。”\n\n西涅尔的笔停了下来，维里乌斯看到她的脸色明显变了。\n\n“现在可算真相大白了，原来这几盏油灯是治安署的某位阁下买走的，”卡涅脸上露出一个戏谑的笑容，“只是看起来，不是为了艺术买的。”\n\n质证室里安静了大概有十秒钟，随后西涅尔清了清嗓子，声音低沉，“道格拉斯先生，这是对我署的严重指控。”\n\n“如果让您产生了这样的误解，我郑重道歉。但我确实有一点不明白，想请治安官阁下为我解释。”卡涅脸上的笑容不减，再次伸手拿起油灯，把底座上一行小小的数字露出来给在场的人看，“这行数字是卡帕尼联邦出口货物会打的印戳。这盏灯今年炎阳季二日才离开伊索拉韦尔德的港口。请问我的主簿，是如何在清和季四十九日夜里，拿着它进入卡伊尔研究院的档案室的？”\n\n维里乌斯身体稍稍前倾，看清了那行3打头的凹刻数字。数字和底座是一个颜色，挤在底部外沿的一个角落里，不是特地注意的话，几乎和花纹没区别。他把视线转向长桌另一侧，哈雷的目光死死盯着油灯底座，嘴唇张了两下，没有发出声音。\n\n“我的话说完了。”卡涅站起身，把油灯轻轻放回托盘，深深鞠了一躬，“如果治安官还想就此结案的话，请便。”\n\n西涅尔的表情收紧了，但她很快恢复了镇定。她靠在椅背上，左手托着下巴。\n\n“道格拉斯先生，您提出的疑点很合理。但出口印戳的解读需要专业人士验证，不能仅凭利益相关方的单方面说辞来认定。”她的语气依旧平稳，“卡帕尼联邦的出口标识体系与我国不同，治安署需要时间来核实。”\n\n“那就核实。”卡涅语速很快，“卡帕尼的出口印戳格式是联邦统一的，伊索拉韦尔德、波托马利、或者联邦其他随便哪个港口的出口记录档案都可以调取比对。需要多久？”\n\n“这——”西涅尔搓了搓羽毛笔，“卡尔姆与卡帕尼联邦并无对口贸易关系，调档恐怕要花很长时间，而且调之前还要报给伯爵批准——”\n\n“如果治安署认为确认油灯来历比较困难，我提议一个方案。”这是维里乌斯这个上午第一次开口，声音不大，但每个人都听得清楚。“档案室门口与窗户装的星术锁用的是旧式的米特兰类蚀刻法，每次被激活都会在界星石的回路里留下细微的容流偏移，可以用来做星术示踪。”\n\n“示踪可以从偏移特征中还原每次激活的时间和施法者体内的仪式星轨特征。档案室窗户装的是触发型的星术锁，所以被撬开也相当于被激活。这种时候它记录的是和窗户物理接触过的人。”他看了哈雷一眼，哈雷的脸色已经变得煞白，“虽然窗户里的界星石当时只剩下基底量的玛娜，但理论上容流偏移还是会发生，足够执行示踪。”\n\n“也就是说可以直接判断当时撬窗的是不是多米尼克。”卡涅把铸币立在桌面上，“我支持这个方案，治安官阁下的意见？”\n\n西涅尔的目光快速闪了一下，从维里乌斯身上移到哈雷身上，又移回来。\n\n“星术示踪的成本非常高，而且只有研究院的几个研究室有这个资质，”西涅尔说，“要过伯爵领研究院的审批流程——”\n\n“如果治安官阁下同意申请示踪核证，我可以立刻往阿斯托利亚递星讯，以米萨兰研究室的名义向王家研究院申请星术示踪。全程走内部的审批流程，一周内就能完成。”维里乌斯回答，“另外，米萨兰研究室恰好有星术示踪的资质，我的老师弗莉亚·米萨兰是王国最早认可的示踪师之一。”\n\n质证室里又安静了。\n\n哈雷的整个人开始发抖，他把脸埋下去，两只手无意识地搓着裤缝。西涅尔手里的羽毛笔已经停了很久了，嘴角紧绷着，视线落在维里乌斯和卡涅身上，又转过去看哈雷。\n\n“……若示踪复原的结果与证词不符，”她再开口时，换了一种腔调，脸上那个周到的笑容不见了，“那便不是记忆出错的问题，是谎报案情和诬陷——哈雷先生，在本署为你申请示踪核证之前，你还有没有要补充的？”\n\n哈雷忽然不抖了。他没有立刻开口，先站起来，腰深深地弯下去，脸几乎贴在桌子上。\n\n“我——”他的声音有些嘶哑，“是我自己干的。”\n\n西涅尔的笔又动了起来。\n\n“那天我吃完晚饭，先去了档案室检查，发现窗户的星术锁没了玛娜，想到这是绝佳的机会。于是晚上从主楼巡视回来的时候，把那份资料从柜子里拿了出来。然后我跑去工具间拿了撬棍，绕到外面把窗户撬了，做成外人闯进来的样子。”\n\n“撬棍我半夜跑去丢在了多西瓦大街尾的下水道那儿，”他肩膀塌下去，声音越来越低，“‘隔着中庭看见亮光’，‘进了档案室有人在翻柜子’之类的，都是我自己编的。资料现在藏在我家床底下。”\n\n“动机？”西涅尔的声音很冷。\n\n哈雷咬咬牙，继续开口，“是我一时糊涂，想把研究室的资料卖掉，再把这事嫁祸出去。”\n\n“你为什么指认了多米尼克？”维里乌斯出声问。\n\n哈雷似乎没想到会被问到这个，过了一会儿才稍微抬起头来答，“那天他在多西瓦大街上挨家挨户地问油灯，我经过看见了，知道他是卡帕尼人。”\n\n他瞥了一眼西涅尔，声音小得几乎听不见，“在卡尔姆，嫁祸给一个外国人很容易。”\n\n维里乌斯听到旁边传来一声哂笑。\n\n西涅尔低着头，笔下如飞，“伯爵领研究院档案室管理人哈雷，诬陷、伪证、监守自盗，供认不讳。即日起收监，报伯爵定夺。”\n\n“搜查中发现的那盏油灯，系我署治安员在执行任务过程中的判断失误，与本案无关。”西涅尔说得很快，一句压着一句，“本案指控不成立，嫌疑人多米尼克·阿尔玛即时释放。本署向索利亚商会致歉。”\n\n她起身向卡涅鞠躬，又转向维里乌斯，“示踪一事，自然也不必劳动贵研究室了。”\n\n“治安官阁下明察。”卡涅起身还礼，挑不出一点毛病。\n\n“道格拉斯先生客气了。”西涅尔把记录本合上，“质证到此结束。”\n\n*\n\n从治安署出来的时候太阳已经升得很高了，维里乌斯看了眼怀表，午时一刻。两人沿着行政街往南走，先说话的是维里乌斯。\n\n“你前天人不在旅馆，就是去港口交接那几盏从斯特拉拉运过来的油灯？”\n\n“还有在西城区找到合适的工艺品店。”卡涅把那枚尼卡特铸币在指间翻了一下，“要有大橱窗的，而且店主不会问我身份的。”\n\n“你故意把它们送到治安署的眼皮底下，等他们买走当作证据拿出来。”\n\n“嗯。”卡涅点头，“当天晚上买走，隔一天就摆上了质证室的桌子，他们效率很高。”\n\n维里乌斯停下，转头看他，“你觉得这种做法合适？”\n\n“合适不合适不好说。”卡涅跟着停下，脸上表情没什么变化，“但有效。多米尼克的清白，我嘴上怎么说都没有用，卡尔姆的治安官不可能听一个卡帕尼商人的。要让他们自己把诬陷的证据拿出来，然后我再当场戳破，不给他们留后路。”\n\n“即使如此，他们也可能再找出别的借口来质疑你。”维里乌斯说，“就像刚才那样。”\n\n“所以我才需要你在场。”卡涅笑了笑，“谢谢你提的星术示踪，否则免不了还要再纠缠下去。”\n\n维里乌斯没有笑，转身继续往前走，卡涅扶了扶帽子跟在后面。两人走在临港街上，港口的喧闹声隔着建筑传过来。\n\n“如果他们没上钩，或者从别的地方拿到了照明工具怎么办？”\n\n“那我就输了。我打了个赌，赌这座城市封闭得找不到油灯，赌治安署会为了把多米尼克送进监狱不择手段。”他看了维里乌斯一眼，“也赌你会相信我。”\n\n“你赌赢了。”维里乌斯脚下不停。\n\n“运气好。”卡涅又笑了一声。第一次在治安署，他也是这么答西涅尔的。\n\n“这件事背后不是哈雷一个人。”过了一会儿维里乌斯才又开口。\n\n卡涅把铸币攥在掌心，抬头看了眼日头，“我知道。”\n\n“撬棍、画像指认、逮捕，整套流程太顺了，没有治安署的配合做不到这些。”维里乌斯说，“西涅尔最后那几句话你也听到了。她把搜查油灯说成是‘判断失误’，又飞快地把整件事推到哈雷头上。做到这个程度的诬陷，不可能只是一个管理人的个人行为。”\n\n“嗯。”卡涅答，“毕竟是那位伯爵阁下的城市。”\n\n“所以你打算就这样？”\n\n“我还能怎样呢，里恩先生。多米尼克自由了，索利亚商会的名誉没有受损，哈雷会受到他应得的惩罚——虽然我们都知道大概不会太重。”他顿了一下，“对一个刚起步的小商会来说，这已经是最好的结果了。”\n\n两人转过临港街的拐角，街口东面的坡道下方就是卡尔姆东港。此时正是午前卸货的时候，搬运工和水手来来往往，喊号子的听着都是艾瑟瑞姆口音。港里停着的船不多，挂着王国各个伯爵领或者商会的旗子，唯一一面外国旗子挂在最外侧泊位的一艘单桅快帆船上，浅蓝的底上一条斜银线。\n\n“治安署那位文员小姐和我说，多米尼克会在未时放出来。我们傍晚前就会出发去斯特拉拉。”卡涅在街口停下脚步，转身过来看维里乌斯，“得先去港口办一下出航登记，恐怕没法和里恩先生共进午餐了。”\n\n“你们走得很快。”\n\n“时间就是尼卡特，斯特拉拉还有合作要谈。”卡涅说，然后站直了身子，脸上的笑意收了收。“里恩先生。”\n\n他把那枚尼卡特收进了口袋，摘下帽子按在胸前。\n\n“这些天承蒙你的帮忙。不只是案子——从你帮我开门那天起，你对我一直很照顾。”他停了一下，“我是认真的。我想邀请你加入索利亚商会，担任商会的商业星术师。”\n\n“我在王家研究院有自己的工作。”维里乌斯说。\n\n“我知道。但你不一定要一辈子待在研究室里。”卡涅说，“你对应用星术的理解不只是学术层面的，你也看到了这个领域有多大的商业空间。索利亚商会需要一个既懂星术又能做判断的人。”\n\n他看着维里乌斯，“你就是那个人。”\n\n年轻的卡帕尼商人站得笔直，深蓝色的外衣下摆在海风中摇动，领口的银扣在日光下闪了两下。维里乌斯看了他一会儿，随后微微摇头。\n\n“谢谢你的邀请，道格拉斯先生。请容我拒绝。”\n\n卡涅脸上没有显出意外，他点了点头，嘴角又弯了起来。\n\n“猜到了。”他从口袋里掏出那枚铸币，在掌心转了一圈，“但这个邀请永远有效。什么时候改了主意，随时来找我。”\n\n维里乌斯点点头。\n\n“之后到阿斯托利亚出差，可能会来研究院拜访里恩先生。”卡涅说，“以朋友的身份，不介意吧？”\n\n“阿斯托利亚收尼卡特。”维里乌斯回答，“研究院东街有一家我常去的咖啡馆，豆子很好。”\n\n卡涅笑了起来，笑得很敞亮。\n\n“一言为定。”他朝维里乌斯伸出手。维里乌斯握住，卡涅的手掌干燥温热，带了一层薄茧。\n\n“后会有期，里恩先生。”\n\n“后会有期。”\n\n卡涅转身，戴上那顶灰色羽毛的宽檐礼帽，顺着坡道往港口的方向走去。维里乌斯站在原地，看着那顶帽子在坡道上越来越小。\n\n傍晚时他提着行李再次经过这个街口，港口最外侧的泊位已经空了出来。\n\n### 五\n\n“牧夫”号的船体在微微摇晃，舱壁外能听到海水拍打船身的声音。\n\n我放下速记本，伸手把矮桌上的星热炉打开。铜壶里的咖啡渐渐热起来，飘出来一股好闻的香气。\n\n“我完全不知道当时还发生了这些。”我开口，“我记得你回了阿斯托利亚之后，只和老师说了一句‘案子结了’。”\n\n“案子确实结了，其他的事毕竟和研究室无关。”维里乌斯靠在对侧的舱壁上，怀表的链子在灯光下晃了一下，“你当时才二十岁，心思全在课题和毕业答辩上。”\n\n“那时候卡伊尔伯爵还只会在领内用这样的小手段。”\n\n“后来他的动作越来越大，直到卡尔姆大火。”维里乌斯走过来，拉过矮桌对面的椅子坐下。\n\n我提起铜壶，给他和自己各倒了半杯咖啡。\n\n“当年索利亚还是个名不见经传的小商会。”我又拿起速记本和笔，“如今贸易额也已经是联邦前列了。我记得特贸区的索利亚分部，除了波托马利这儿的，至少还有三家。”\n\n“索利亚现在的体量，四大商会之下大概能排到前三。”他拿起杯子喝了一口，“特别是对艾瑟瑞姆的星术制品贸易，每年的利润可能都快赶上汶托尼亚商会了。”\n\n“道格拉斯先生做生意确实有一套。”我点点头。\n\n“也不只是他的功劳。”维里乌斯的嘴角动了一下，不算笑，但差不多了，“他手下那位多米尼克，能力也很强。这些年来，卡涅在国外谈合作的时候，多米尼克就在卡帕尼负责商会的日常运行。他如今管着波托马利分部，你应该见过。”\n\n我回想了一下在分部三楼见过的那位不苟言笑的副主席，把他和维里乌斯嘴里被诬陷的主簿联系在一起。\n\n“卡涅这阵子在阿布丹提亚，商会刚刚在格雷瓦罗开了新分部，他放心不下，亲自过去盯着。”他说这些话的时候很自然，“上一季他给我寄信，照例把邀请重发了一遍。”\n\n“十二年了，还在发？”\n\n“一年到头，总要发个几遍，像收租。”\n\n“你也一年回绝几遍？”\n\n“嗯。”\n\n“但你后来离开了研究室，去了蚀刻总所，又在阿斯托戈商会领了职，在斯特拉拉的分部工作。”我看着他，“斯特拉拉是王国对卡帕尼贸易的最大枢纽。你在那边经手的业务，有多少是和索利亚商会做的？”\n\n“索利亚是个很好的合作伙伴。”维里乌斯扬了扬眉毛，“这回也是靠他们按规矩办事，才把那枚星术装药抓出来，没导致严重后果。”\n\n“确实如此。”我低下头，假装写字，把笑意藏在速记本后面。\n\n桌子对面传来一声咳嗽，“你当年要是有这种观察力，也不至于课题论文写了五十页还只敢在结论里写‘疑似’。”\n\n“学长教训的是。”我笑容不减，把最后几笔写完，合上速记本，站起身，“时候不早了，我也该告辞了。”\n\n维里乌斯把我送到舷梯口。夜里的谢兰港很静，桅灯在水面上拖出一条条碎光。\n\n“你接下来什么打算？”他开口问我。\n\n“在波托马利住到金素季末，然后回大陆，应该会去阿布丹提亚看看。”我回答，指了指他背后的船舱，“谢谢你的咖啡，还有故事。”\n\n“你来了我就讲，”维里乌斯靠在舷栏上，“换别人我不一定说。”\n\n“之后你如果回阿斯托利亚，替我向弗莉亚老师问安。”\n\n“自己回去说。”\n\n我笑了笑，转身下了舷梯。走出几步，身后又来了一句：“稿子写完寄一份。斯特拉拉，阿斯托戈商会，写我的名字。”\n\n我扬了扬手，没有回头，踩上码头的石阶。\n\n*\n\n我沿临海步道往旅馆方向走，走了一会儿又回到了白天和维里乌斯见面的那个平台上。我在靠近路灯的一条长椅上坐下，海风带着盐味，时而送来几声海鸥的叫声。远处灯塔的光每隔几秒扫过来一次，在海面上划出一道长长的白痕。\n\n我从怀里取出速记本，翻到刚刚在船舱里记的那几页。维里乌斯的故事里，有一个细节让我非常在意：那行出口印戳。\n\n联邦如今的出口印戳是八年前改制重新统一过的，一行字的顺序是年、季、日，其中季数按各国惯例，用的是字母I到VI。然而在此之前，为了节约印戳机的制版成本，印戳的季数和日数一样用的是数字，季日在前，年在后，而且不同的港务局，季日的顺序可能是相反的，常常导致歧义。\n\n佩特拉和我在餐桌上说到这件事的时候，露出了一个苦笑，解释说这一混乱导致了许多商会改制前的出口记录档案都极难整理。要弄清当年各个港务局各自的季日约定，几乎不可能。\n\n维里乌斯给我讲的故事发生在十二年前的1490年，那时候卡帕尼联邦的印戳依旧是旧式的。卡涅在质证室拿起油灯说那个印戳代表它炎阳季二日离开伊索拉韦尔德，那串数字以3打头，说明是3021490，3（炎阳季）02（日）1490（年）。但如果当时负责这批货的港务局季日约定是相反的呢？\n\n30（日）2（清和季）1490（年），盗窃案发生前十九天。时间足够让这盏灯从卡帕尼送到斯特拉拉，再转运到卡尔姆，出现在那天夜里研究院的档案室里。\n\n如果，我是说如果。\n\n多米尼克当时真的带了这盏油灯，用某种方式进了档案室，抄录了三分耦蚀刻的技术资料——当晚窗户上的星术锁没了玛娜，只是个卡住窗框的栓子，有准备的人完全可以用技巧打开。多米尼克没被任何人发现，却恰好碰上哈雷被伯爵授意来诬陷索利亚商会。他编造证词、伪造窗户的撬痕，但完全不知道多米尼克是真的来过。卡涅听完证词就知道哈雷在诬陷，而不是如实指认。那么他会怎么做？\n\n他从洛林会议上请来了一位中立的技术顾问，演了一场戏，让顾问自己看出哈雷证词里的漏洞。再故意把多米尼克用过的油灯放到市面上，等治安署找到后，又在那位顾问面前用另一种约定解读印戳，假装这盏灯是自己案发后才从斯特拉拉运过来的。最终那位顾问推理出治安署的诬陷，提出星术示踪。哈雷扛不住，直接认了罪，案子以诬陷结案。\n\n他赌了三件事：卡尔姆足够封闭，治安署对出口印戳的歧义没有概念；那位顾问足够聪明，能从假证据里推出栽赃的结论；哈雷足够脆弱，在示踪威胁下会先崩溃。\n\n三注全中。\n\n我合上速记本，看着远处的海面。灯塔的光又扫过来了一次。\n\n维里乌斯现在应该已经知道了这个“如果”。他做了这么多年的对卡贸易，亲眼见证了联邦出口印戳的改制。他不可能不知道当年那个上午，那盏油灯底座的印戳会有两个读法，其中一个会让伪证变成真正的证据。\n\n但他如今依旧和卡涅保持着联络，依旧和索利亚商会做着生意，每次卡涅路过斯特拉拉都会见面。今晚讲这个故事的时候，他也没有提到这个“如果”。\n\n卡涅·道格拉斯到底是一个正直的商会主席，还是一个为了商会的利益铤而走险、精准算计了所有人的赌徒，如今只有他自己和多米尼克知道。卡涅眼下不在波托马利，但那位露琪尔和佩特拉敬畏的副主席在，明天照旧会在索利亚的分部三楼写他的总账。\n\n我可以去问，但我不会去问。\n\n维里乌斯说，卡涅有个在手里玩尼卡特的习惯。一枚铸币在指背上翻过来，又翻过去，非得落回手里按住，才分得出正反。现在有一枚在卡涅指背上翻了十二年，还没有落下来。\n\n决定它何时落回手的人，应该是维里乌斯，不是我。\n\n我把速记本收回怀里，从长椅上站起来。望向港口，泊位上的“牧夫”号只剩桅灯，和一扇还亮着的舷窗。\n\n我转身，沿着步道往旅馆走去。\n\n**塞勒内斯 于大陆历1502年三（炎阳）季19日 波托马利**\n\n**Selenus 1502.III.19 In Porto Marino**\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$2\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"min-h-[60vh] flex items-center justify-center text-[var(--ink-muted)]\",\"children\":\"加载中…\"}],\"children\":[\"$\",\"$L10\",null,{\"bookSlug\":\"compendium\",\"toc\":[{\"slug\":\"作者序\",\"title\":\"炉边随记（代作者序）\",\"titleEn\":\"Preface\",\"isArticle\":true},{\"slug\":\"年表与大事记 Chronology\",\"title\":\"年表与大事记\",\"titleEn\":\"Chronology\",\"isArticle\":true},{\"slug\":\"度量与岁时 Measures and Times\",\"title\":\"度量与岁时\",\"titleEn\":\"Measures and Times\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview\",\"title\":\"大陆总览 Overview\",\"children\":[{\"slug\":\"大陆总览 Overview/地理\",\"title\":\"地理概述\",\"titleEn\":\"The Geography\",\"isArticle\":true},{\"slug\":\"大陆总览 Overview/魔法\",\"title\":\"魔法概述
