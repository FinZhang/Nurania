<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <style>
    .c{color:#6b4a1f}
    @media (prefers-color-scheme: dark){.c{color:#d8b56a}}
  </style>
  <defs>
    <!-- 在星芒中心挖出透明小孔，深浅底色下都成立 -->
    <mask id="hole">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="16" cy="16" r="2.4" fill="#000"/>
    </mask>
  </defs>
  <g class="c" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g mask="url(#hole)">
      <!-- 外环 -->
      <circle cx="16" cy="16" r="11" stroke-width="1.4"/>
      <!-- 两道交叉的星轨 -->
      <ellipse cx="16" cy="16" rx="11" ry="3.3" stroke-width="1.05" transform="rotate(33 16 16)"/>
      <ellipse cx="16" cy="16" rx="11" ry="3.3" stroke-width="1.05" transform="rotate(-33 16 16)"/>
      <!-- 四芒长星 -->
      <path d="M16 0.8 L17 15 L31.2 16 L17 17 L16 31.2 L15 17 L0.8 16 L15 15 Z" fill="currentColor" stroke-width="0.5"/>
      <!-- 斜向短芒 -->
      <path d="M21.7 10.3 L16.5 16.5 L10.3 21.7 L15.5 15.5 Z M10.3 10.3 L15.5 16.5 L21.7 21.7 L16.5 15.5 Z" fill="currentColor" stroke-width="0.3"/>
    </g>
    <!-- 中心小环 -->
    <circle cx="16" cy="16" r="2" stroke-width="1"/>
  </g>
</svg>
